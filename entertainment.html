function esc(v){
  return String(v??'').replace(/[&<>"']/g,m=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}

async function remote(section){
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),2500);
  try{
    const u=SB_URL+'/rest/v1/section_sliders?select=section_key,slot,image_url,title,subtitle,details_url,is_active&section_key=eq.'+
      encodeURIComponent(section)+'&order=slot.asc';
    const r=await fetch(u,{
      headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY},
      cache:'no-store',
      signal:controller.signal
    });
    if(!r.ok)return null;
    return await r.json();
  }catch(e){
    return null;
  }finally{
    clearTimeout(timeout);
  }
}

function cleanSource(src){
  const name=String(src||'').split(/[?#]/)[0].split('/').pop();
  const slot=/^entertainment-([1-5])\.svg$/.exec(name);
  if(slot)return DEFAULTS.entertainment[Number(slot[1])-1].image_url;
  return window.HASectionArtwork?.slides[name]||src;
}

const oldEntertainmentCaptions=[{"slot": 1, "title": "الألعاب", "subtitle": "مجموعة ألعاب سريعة وممتعة", "details_url": "games.html"}, {"slot": 2, "title": "التحديات", "subtitle": "نافس وارفع ترتيبك", "details_url": "games-ranking.html"}, {"slot": 3, "title": "لعبة القناص", "subtitle": "تحديات دقة ومهارة", "details_url": "sniper-battle.html"}, {"slot": 4, "title": "ركلات الجزاء", "subtitle": "اختبر مهارتك بالتسديد", "details_url": "penalties.html"}, {"slot": 5, "title": "ألعاب متنوعة", "subtitle": "اكتشف المزيد من الألعاب", "details_url": "games-hub.html"}];
function merge(section,rows){
  if(section==='entertainment'&&Array.isArray(rows))rows=rows.map(row=>{const old=oldEntertainmentCaptions.find(x=>x.slot===Number(row.slot)),next={...row};if(old)for(const field of ['title','subtitle','details_url'])if(next[field]===old[field])delete next[field];return next;});
  const base=(DEFAULTS[section]||[]).map(x=>({...x,image_url:cleanSource(x.image_url)}));
  if(!Array.isArray(rows)||!rows.length)return base;
  return base.map(d=>{
    const r=rows.find(x=>Number(x.slot)===d.slot);
    return r?{
      ...d,...r,
      image_url:cleanSource(r.image_url||d.image_url),
      title:r.title||d.title,
      subtitle:r.subtitle||d.subtitle,
      details_url:r.details_url||d.details_url
    }:d;
  }).filter(x=>x.is_active!==false);
}

function setBackgrounds(root){
  const defaults=DEFAULTS[root.dataset.haSlider]||[];
  root.querySelectorAll('.ha-home-slide-bg').forEach((bg,index)=>{
    const src=bg.getAttribute('data-src')||'';
    const slot=Number(bg.closest('.ha-slide')?.dataset.slot);
    const fallback=cleanSource(defaults.find(x=>Number(x.slot)===slot)?.image_url||defaults[index]?.image_url||'');
    const set=url=>{
      if(!url)return;
      const local=/^ha-entertainment-local:([1-5])$/.exec(url);
      bg.querySelector('.ha-entertainment-banner-art')?.remove();
      bg.closest('.ha-slide').classList.toggle('ha-entertainment-local-banner',!!local);
      if(local){const i=Number(local[1]),art=document.createElement('span');art.className='ha-entertainment-banner-art';art.setAttribute('aria-hidden','true');art.style.backgroundPosition=(i%3)*50+'% '+Math.floor(i/3)*100+'%';bg.style.backgroundImage='none';bg.appendChild(art);}
      else bg.style.backgroundImage='url("'+url.replace(/"/g,'%22')+'")';
    };
    set(fallback);
    if(!src||src===fallback)return;
    const img=new Image();
    img.onload=()=>set(src);
    img.onerror=()=>set(fallback);
    img.src=src;
  });
}

function initSlider(root,slides){
  if(typeof root._haSliderCleanup==='function')root._haSliderCleanup();

  root.classList.add('ha-home-pattern-slider');

  if(!slides.length){
    root.innerHTML='<div class="ha-slider-loading">لا توجد صور مفعلة حالياً.</div>';
    return;
  }

  root.innerHTML=`
    <div class="ha-slider-track">
      ${slides.map((s,i)=>`
        <article class="ha-slide ${i===0?'active':''}" data-index="${i}" data-slot="${s.slot}">
          <div class="ha-home-slide-bg" data-src="${esc(s.image_url)}"></div>
          <div class="ha-home-slide-shade"></div>
          <div class="ha-slide-content">
            <span class="ha-slide-badge">HA Marketing</span>
            <h3>${esc(s.title)}</h3>
            <p>${esc(s.subtitle)}</p>
            <a class="ha-slide-details" href="${esc(s.details_url)}">
              انقر على التفاصيل <span>←</span>
            </a>
          </div>
        </article>
      `).join('')}
    </div>

    <button class="ha-slider-arrow prev" type="button" aria-label="الصورة السابقة" dir="ltr">→</button>
    <button class="ha-slider-arrow next" type="button" aria-label="الصورة التالية" dir="ltr">←</button>

    <div class="ha-slider-dots">
      ${slides.map((_,i)=>`
        <button class="ha-slider-dot ${i===0?'active':''}" type="button" aria-label="الصورة ${i+1}"></button>
      `).join('')}
    </div>

    <div class="ha-slider-count">1 / ${slides.length}</div>
  `;

  setBackgrounds(root);

  const els=[...root.querySelectorAll('.ha-slide')];
  const dots=[...root.querySelectorAll('.ha-slider-dot')];
  const count=root.querySelector('.ha-slider-count');

  let index=0,timer=null,startX=null;

  function show(i,user=false){
    index=(i+els.length)%els.length;
    els.forEach((x,n)=>x.classList.toggle('active',n===index));
    dots.forEach((x,n)=>x.classList.toggle('active',n===index));
    if(count)count.textContent=(index+1)+' / '+els.length;
    if(user)play();
  }

  function play(){
    clearInterval(timer);
    if(els.length>1&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
      timer=setInterval(()=>show(index+1),4500);
    }
  }

  const prev=root.querySelector('.prev');
  const next=root.querySelector('.next');

  prev?.addEventListener('click',()=>show(index-1,true));
  next?.addEventListener('click',()=>show(index+1,true));
  dots.forEach((d,i)=>d.addEventListener('click',()=>show(i,true)));

  const onEnter=()=>clearInterval(timer);
  const onLeave=()=>play();
  const onTouchStart=e=>{startX=e.touches[0].clientX;clearInterval(timer)};
  const onTouchEnd=e=>{
    if(startX!=null){
      const dx=e.changedTouches[0].clientX-startX;
      if(Math.abs(dx)>45)show(index+(dx>0?-1:1),true);
      startX=null;
    }
    play();
  };
  const onVisibility=()=>document.hidden?clearInterval(timer):play();

  root.addEventListener('mouseenter',onEnter);
  root.addEventListener('mouseleave',onLeave);
  root.addEventListener('touchstart',onTouchStart,{passive:true});
  root.addEventListener('touchend',onTouchEnd,{passive:true});
  document.addEventListener('visibilitychange',onVisibility);

  root._haSliderCleanup=()=>{
    clearInterval(timer);
    document.removeEventListener('visibilitychange',onVisibility);
  };

  play();
}

function boot(){
  document.querySelectorAll('[data-ha-slider]').forEach(root=>{
    const section=root.dataset.haSlider;

    // امسح الشكل القديم كلياً وابنه من جديد بنفس قالب الرئيسية.
    root.innerHTML='';
    root.removeAttribute('style');
    root.classList.add('ha-home-pattern-slider');

    initSlider(root,merge(section,null));

    remote(section).then(rows=>{
      if(Array.isArray(rows)&&rows.length){
        initSlider(root,merge(section,rows));
      }
    }).catch(()=>{});
  });
}

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);
else boot();

})();
