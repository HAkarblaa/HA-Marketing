<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المكتبة الدراسية</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f5f5f5;color:#111}.wrap{width:94%;max-width:1050px;margin:22px auto}.top,.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.btn,button{border:0;border-radius:11px;padding:11px 14px;background:#111;color:#fff;text-decoration:none;cursor:pointer;font:inherit}.light{background:#eee;color:#111}.danger{background:#9b1028}.ok{background:#0c6b2a}.card{background:#fff;border-radius:16px;padding:15px;margin:12px 0;box-shadow:0 4px 16px #0001}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.muted{color:#666;line-height:1.7}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eee;font-size:12px}input,select,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;font:inherit;margin:5px 0 10px}textarea{min-height:90px}.status{padding:10px;border-radius:10px;background:#f1f1f1;white-space:pre-wrap}@media(max-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.card{padding:10px}.grid .card{font-size:12px}}</style></head><body><div class="wrap"><div class="top"><a class="btn light" href="study.html">← الدراسة</a><h1>📚 المكتبة الدراسية</h1><span></span></div><div class="card"><div class="grid"><select id="stage"><option value="">كل المراحل</option><option>ابتدائية</option><option>متوسطة</option><option>إعدادية</option><option>جامعة</option></select><input id="subject" placeholder="المادة"><input id="q" placeholder="بحث بالعنوان"></div></div><div id="list">جاري التحميل...</div></div><script>const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});
let rows=[];function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){const {data,error}=await db.from('study_materials').select('*').eq('is_active',true).order('created_at',{ascending:false});if(error){list.innerHTML='<div class="card">شغّل CORE-MARKETPLACE-ROLES-UPDATE.sql أولاً.</div>';return}rows=data||[];render()}function render(){const s=stage.value.trim(),sub=subject.value.trim(),qq=q.value.trim();const a=rows.filter(x=>(!s||x.stage===s)&&(!sub||(x.subject||'').includes(sub))&&(!qq||(x.title+' '+(x.description||'')).includes(qq)));list.innerHTML=a.map(x=>`<div class="card"><div class="row"><h3>${esc(x.title)}</h3><span class="badge">${esc(x.material_type)}</span></div><div class="muted">${esc(x.stage)} ${esc(x.grade||'')} — ${esc(x.subject)}</div><p>${esc(x.description||'')}</p><div class="row">${x.file_url?`<a class="btn" href="${esc(x.file_url)}" target="_blank">فتح الملف</a>`:''}${x.external_url?`<a class="btn light" href="${esc(x.external_url)}" target="_blank">فتح الرابط</a>`:''}</div></div>`).join('')||'<div class="card">لا توجد مواد مطابقة.</div>'}stage.onchange=subject.oninput=q.oninput=render;load();</script></body></html>
