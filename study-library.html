<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>المكتبة الدراسية - HA Marketing</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="ha-study-subjects.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial;background:#eef4f8;color:#15304b}
.wrap{width:min(1050px,94%);margin:22px auto 90px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.top a{background:#fff;color:#087f61;padding:10px 14px;border-radius:13px;text-decoration:none}
.section{background:#fff;border-radius:20px;padding:16px;margin:14px 0;box-shadow:0 8px 24px #15304b0c}
.section h2{margin:0 0 12px;font-size:18px}
.choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.choice{border:2px solid transparent;border-radius:17px;padding:14px 10px;background:#f4f7f8;color:#17344d;font:inherit;font-weight:900;cursor:pointer;min-height:82px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.choice span{font-size:27px}
.choice small{font-size:10px;font-weight:700;color:#6d7d88}
.choice.active{border-color:#119b73;background:#e8f8f2;color:#08795a}
.choice.hidden{display:none}
.card{background:#fff;border-radius:18px;padding:15px;margin:13px 0;box-shadow:0 8px 24px #15304b0c}
.item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.meta{color:#667788;font-size:13px;line-height:1.7}
.btn{display:inline-block;background:#087f61;color:#fff;text-decoration:none;border:0;border-radius:11px;padding:10px 13px;font-weight:900}
.light{background:#edf4f2;color:#087f61}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.badge{display:inline-block;background:#eef3f5;padding:5px 8px;border-radius:999px;font-size:11px}
.summary{background:#eaf8f3;border-radius:15px;padding:12px 14px;color:#08795a;font-weight:900;margin-top:12px}
.empty{padding:18px;text-align:center;color:#6a7b87}
.reset{border:0;border-radius:12px;padding:10px 13px;background:#edf4f2;color:#087f61;font:inherit;font-weight:900;cursor:pointer}
@media(max-width:820px){.choices{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:620px){.choices{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{min-height:74px;padding:11px 8px}.item{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a href="javascript:history.back()">← رجوع</a>
    <h1>📚 المكتبة الدراسية</h1>
    <a href="study.html">الدراسة</a>
  </div>

  <section class="section">
    <h2>1. اختر المرحلة</h2>
    <div id="stageChoices" class="choices">
      <button class="choice" data-value="ابتدائي"><span>🏫</span>ابتدائي<small>الأول إلى السادس</small></button>
      <button class="choice" data-value="متوسط"><span>📘</span>متوسط<small>الأول إلى الثالث</small></button>
      <button class="choice" data-value="إعدادي"><span>🎓</span>إعدادي<small>علمي وأدبي ومهني</small></button>
      <button class="choice" data-value="متوسط متميزين"><span>⭐</span>متوسط متميزين</button>
      <button class="choice" data-value="إعدادي متميزين"><span>🌟</span>إعدادي متميزين</button>
      <button class="choice" data-value="جامعي"><span>🎓</span>جامعي</button>
    </div>
  </section>

  <section id="branchSection" class="section" hidden>
    <h2>2. اختر الفرع</h2>
    <div id="branchChoices" class="choices">
      <button class="choice" data-value="علمي"><span>🔬</span>علمي</button>
      <button class="choice" data-value="أدبي"><span>📖</span>أدبي</button>
      <button class="choice" data-value="مهني"><span>🛠️</span>مهني</button>
    </div>
  </section>

  <section id="gradeSection" class="section" hidden>
    <h2 id="gradeTitle">2. اختر الصف</h2>
    <div id="gradeChoices" class="choices"></div>
  </section>

  <section id="subjectSection" class="section" hidden>
    <h2>3. اختر المادة</h2>
    <div id="subjectChoices" class="choices"></div>
  </section>

  <section id="typeSection" class="section" hidden>
    <h2>4. اختر نوع المحتوى</h2>
    <div id="typeChoices" class="choices">
      <button class="choice" data-value=""><span>📂</span>الكل</button>
      <button class="choice" data-value="book"><span>📚</span>كتب</button>
      <button class="choice" data-value="notes"><span>📒</span>ملازم</button>
      <button class="choice" data-value="questions"><span>🧾</span>أسئلة وزارية</button>
      <button class="choice" data-value="solutions"><span>✅</span>حلول</button>
      <button class="choice" data-value="lesson"><span>📝</span>دروس</button>
      <button class="choice" data-value="video"><span>🎥</span>فيديو</button>
    </div>
    <div id="summary" class="summary">اختر المرحلة ثم الصف.</div>
    <button id="resetBtn" class="reset" type="button">إعادة الاختيار</button>
  </section>

  <div id="list"><div class="card">اختر المرحلة والصف والمادة حتى تظهر الملفات.</div></div>
</div>

<script>
const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll');
const q=new URLSearchParams(location.search);

let rows=[];
let selectedStage=q.get('stage_name')||'';
let selectedGrade=q.get('grade_name')||'';
let selectedBranch=q.get('branch_name')||'';
let selectedSubject=q.get('subject')||'';
let selectedType=q.get('type')||'';

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gradesByStage={
  'ابتدائي':['الأول الابتدائي','الثاني الابتدائي','الثالث الابتدائي','الرابع الابتدائي','الخامس الابتدائي','السادس الابتدائي'],
  'متوسط':['الأول المتوسط','الثاني المتوسط','الثالث المتوسط'],
  'إعدادي':['الرابع الإعدادي','الخامس الإعدادي','السادس الإعدادي'],
  'متوسط متميزين':['الثالث المتوسط متميزين'],
  'إعدادي متميزين':['السادس الإعدادي متميزين'],
  'جامعي':[]
};

function activate(container,value){
  [...container.querySelectorAll('.choice')].forEach(b=>b.classList.toggle('active',b.dataset.value===value));
}
function renderGrades(){
  const section=document.getElementById('gradeSection');
  const list=document.getElementById('gradeChoices');
  const arr=gradesByStage[selectedStage]||[];
  if(selectedStage==='جامعي'){
    section.hidden=true;
    selectedGrade='';
    renderSubjects();
    return;
  }
  section.hidden=!selectedStage;
  list.innerHTML=arr.map((g,i)=>`<button class="choice ${g===selectedGrade?'active':''}" data-value="${esc(g)}"><span>${i+1}️⃣</span>${esc(g)}</button>`).join('');
  list.querySelectorAll('.choice').forEach(btn=>btn.onclick=()=>{
    selectedGrade=btn.dataset.value;
    activate(list,selectedGrade);
    renderSubjects();
    render();
  });
}
function renderSubjects(){
  const section=document.getElementById('subjectSection');
  const list=document.getElementById('subjectChoices');
  if(!selectedStage || (selectedStage!=='جامعي'&&!selectedGrade)){
    section.hidden=true;
    return;
  }

  let subs=[];
  if(selectedStage==='جامعي'){
    subs=['حسب التخصص'];
  }else{
    subs=haSubjectsFor(selectedGrade,selectedBranch);
  }
  section.hidden=false;
  list.innerHTML=subs.map((s,i)=>`<button class="choice ${s===selectedSubject?'active':''}" data-value="${esc(s)}"><span>${['📘','📗','📕','📙','📐','🔬','🧪','🌍'][i%8]}</span>${esc(s)}</button>`).join('');
  list.querySelectorAll('.choice').forEach(btn=>btn.onclick=()=>{
    selectedSubject=btn.dataset.value;
    activate(list,selectedSubject);
    document.getElementById('typeSection').hidden=false;
    render();
  });
  document.getElementById('typeSection').hidden=!selectedSubject;
}
function updateSummary(){
  const parts=[selectedStage,selectedBranch,selectedGrade,selectedSubject].filter(Boolean);
  document.getElementById('summary').textContent=parts.length?'المحدد: '+parts.join(' ← '):'اختر المرحلة ثم الصف.';
}
function render(){
  updateSummary();
  if(!selectedStage || (selectedStage!=='جامعي'&&!selectedGrade) || !selectedSubject){
    document.getElementById('list').innerHTML='<div class="card">أكمل الاختيارات حتى تظهر الملفات.</div>';
    return;
  }
  const a=rows.filter(x=>
    (!selectedStage||x.stage===selectedStage) &&
    (!selectedGrade||x.grade===selectedGrade) &&
    (!selectedSubject||x.subject===selectedSubject) &&
    (!selectedType||x.material_type===selectedType) &&
    (!selectedBranch||!x.branch_name||x.branch_name===selectedBranch)
  );
  document.getElementById('list').innerHTML=a.map(x=>`<div class="card item"><div><h3>${esc(x.title)}</h3><div class="meta">${esc(x.stage)} ${esc(x.grade||'')} ${esc(x.branch_name||'')} — ${esc(x.subject)} <span class="badge">${esc(x.material_type)}</span></div><p>${esc(x.description||'')}</p></div><div class="actions">${x.file_url?`<a class="btn" href="${esc(x.file_url)}" download target="_blank">⬇️ تحميل مباشر</a>`:''}${x.external_url?`<a class="btn light" href="${esc(x.external_url)}" target="_blank">فتح الرابط</a>`:''}</div></div>`).join('')||'<div class="card empty">لا توجد ملفات بهذا الاختيار حالياً.</div>';
}
async function load(){
  const {data,error}=await db.from('study_materials').select('*').eq('is_active',true).order('created_at',{ascending:false});
  if(error){document.getElementById('list').innerHTML='<div class="card">'+esc(error.message)+'</div>';return}
  rows=data||[];
  render();
}

document.querySelectorAll('#stageChoices .choice').forEach(btn=>btn.onclick=()=>{
  selectedStage=btn.dataset.value;
  selectedGrade='';selectedSubject='';
  activate(document.getElementById('stageChoices'),selectedStage);
  const needsBranch=selectedStage==='إعدادي';
  document.getElementById('branchSection').hidden=!needsBranch;
  if(!needsBranch)selectedBranch='';
  renderGrades();
  render();
});

document.querySelectorAll('#branchChoices .choice').forEach(btn=>btn.onclick=()=>{
  selectedBranch=btn.dataset.value;
  selectedSubject='';
  activate(document.getElementById('branchChoices'),selectedBranch);
  renderGrades();
  renderSubjects();
  render();
});

document.querySelectorAll('#typeChoices .choice').forEach(btn=>btn.onclick=()=>{
  selectedType=btn.dataset.value;
  activate(document.getElementById('typeChoices'),selectedType);
  render();
});

document.getElementById('resetBtn').onclick=()=>{
  selectedStage='';selectedGrade='';selectedBranch='';selectedSubject='';selectedType='';
  document.querySelectorAll('.choice').forEach(x=>x.classList.remove('active'));
  document.getElementById('branchSection').hidden=true;
  document.getElementById('gradeSection').hidden=true;
  document.getElementById('subjectSection').hidden=true;
  document.getElementById('typeSection').hidden=true;
  render();
};

// Restore query-string selections when opening from a grade/subject page.
if(selectedStage){
  activate(document.getElementById('stageChoices'),selectedStage);
  document.getElementById('branchSection').hidden=selectedStage!=='إعدادي';
  if(selectedBranch)activate(document.getElementById('branchChoices'),selectedBranch);
  renderGrades();
  if(selectedGrade)renderSubjects();
  if(selectedSubject){
    document.getElementById('typeSection').hidden=false;
    activate(document.getElementById('typeChoices'),selectedType);
  }
}
load();
</script>
</body>
</html>
