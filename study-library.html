<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المكتبة الدراسية - HA Marketing</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#eef4f8;color:#15304b}.wrap{width:min(1050px,94%);margin:22px auto 90px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.top a{background:#fff;color:#087f61;padding:10px 14px;border-radius:13px;text-decoration:none}.filters,.card{background:#fff;border-radius:18px;padding:15px;margin:13px 0;box-shadow:0 8px 24px #15304b0c}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}input,select{width:100%;padding:11px;border:1px solid #d6e0e4;border-radius:10px;font:inherit}.item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.meta{color:#667788;font-size:13px;line-height:1.7}.btn{display:inline-block;background:#087f61;color:#fff;text-decoration:none;border:0;border-radius:11px;padding:10px 13px;font-weight:900}.light{background:#edf4f2;color:#087f61}.actions{display:flex;gap:8px;flex-wrap:wrap}.badge{display:inline-block;background:#eef3f5;padding:5px 8px;border-radius:999px;font-size:11px}@media(max-width:720px){.grid{grid-template-columns:1fr 1fr}.item{grid-template-columns:1fr}}</style></head><body>
<div class="wrap"><div class="top"><a href="javascript:history.back()">← رجوع</a><h1>📚 المكتبة الدراسية</h1><a href="study.html">الدراسة</a></div>
<div class="filters"><div class="grid"><input id="stage" placeholder="المرحلة"><input id="grade" placeholder="الصف"><input id="subject" placeholder="المادة"><select id="kind"><option value="">كل الأنواع</option><option value="book">كتاب</option><option value="notes">ملزمة</option><option value="questions">أسئلة وزارية</option><option value="solutions">حلول</option><option value="lesson">درس</option><option value="video">فيديو</option></select></div></div><div id="list">جاري التحميل...</div></div>
<script>
const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll');
const q=new URLSearchParams(location.search);stage.value=q.get('stage_name')||'';grade.value=q.get('grade_name')||'';subject.value=q.get('subject')||'';kind.value=q.get('type')||'';
let rows=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){const {data,error}=await db.from('study_materials').select('*').eq('is_active',true).order('created_at',{ascending:false});if(error){list.innerHTML='<div class="card">'+esc(error.message)+'</div>';return}rows=data||[];render()}
function render(){const s=stage.value.trim(),g=grade.value.trim(),sub=subject.value.trim(),k=kind.value,branch=q.get('branch_name')||'';const a=rows.filter(x=>(!s||x.stage===s)&&(!g||x.grade===g)&&(!sub||x.subject===sub)&&(!k||x.material_type===k)&&(!branch||!x.branch_name||x.branch_name===branch));
list.innerHTML=a.map(x=>`<div class="card item"><div><h3>${esc(x.title)}</h3><div class="meta">${esc(x.stage)} ${esc(x.grade||'')} ${esc(x.branch_name||'')} — ${esc(x.subject)} <span class="badge">${esc(x.material_type)}</span></div><p>${esc(x.description||'')}</p></div><div class="actions">${x.file_url?`<a class="btn" href="${esc(x.file_url)}" download target="_blank">⬇️ تحميل مباشر</a>`:''}${x.external_url?`<a class="btn light" href="${esc(x.external_url)}" target="_blank">فتح الرابط</a>`:''}</div></div>`).join('')||'<div class="card">لا توجد ملفات بهذا القسم حالياً.</div>'}
stage.oninput=grade.oninput=subject.oninput=kind.onchange=render;load();
</script></body></html>
