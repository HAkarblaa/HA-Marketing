</head><body><div class="wrap"><a class="back" href="courses.html">← الدورات</a><div class="card" id="box">جاري فتح الكلاس...</div></div><script>const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});const id=new URLSearchParams(location.search).get('class');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function init(){const {data:{session}}=await db.auth.getSession();if(!session)return location.href='login.html';if(!id){box.textContent='الكلاس غير محدد';return}const {data:c,error}=await db.from('study_classes').select('*').eq('id',id).maybeSingle();if(error||!c){box.textContent='تعذر العثور على الكلاس';return}const isTeacher=c.teacher_user_id===session.user.id;let joined=isTeacher;if(!joined){const m=await db.from('study_class_members').select('class_id').eq('class_id',id).eq('student_user_id',session.user.id).maybeSingle();joined=!!m.data}if(!joined){box.innerHTML='<h1>🔒 هذا الكلاس خاص</h1><div class="muted">تحتاج دعوة من المدرس وقبولها قبل الدخول.</div>';return}const t=await db.from('study_teachers').select('display_name').eq('user_id',c.teacher_user_id).maybeSingle();box.innerHTML=`<h1>${esc(c.class_name)}</h1><div class="muted">المدرس: ${esc(t.data?.display_name||'مدرس')}<br>${esc(c.description||'')}</div><div class="details"><div class="detail"><b>الصف</b><br>${esc(c.grade_name)} ${c.branch?'— '+esc(c.branch):''}</div><div class="detail"><b>المادة</b><br>${esc(c.subject||'—')}</div></div>${c.online_url?`<a class="action" href="${esc(c.online_url)}" target="_blank" rel="noopener">💻 دخول الدرس الأونلاين</a>`:''}${c.location_text?`<div class="action">📍 ${esc(c.location_text)}</div>`:''}`}init();</script></body></html>
