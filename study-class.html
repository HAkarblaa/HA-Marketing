<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الكلاس - HA Marketing</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#06090c;color:#fff;min-height:100vh}.wrap{width:min(94%,920px);margin:16px auto 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.back{display:inline-flex;padding:10px 13px;border-radius:12px;border:1px solid #394650;background:#12181d;color:#fff;text-decoration:none}.card{padding:16px;border-radius:20px;border:1px solid #3a4752;background:linear-gradient(145deg,#11181d,#080c0f);margin:14px 0}.card h1{color:#f0c86b;margin:0 0 8px}.muted{color:#aeb7bf;line-height:1.7}.details{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.detail{padding:10px;border-radius:13px;background:#0a1014;border:1px solid #2e3b45}.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}.tool{aspect-ratio:1/1;min-height:120px;border:1px solid #3a4752;border-radius:19px;background:linear-gradient(145deg,#12181d,#080c0f);color:#fff;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:10px}.tool span{font-size:34px}.tool b{font-size:15px;color:#f0c86b}.teacher-only{display:none!important}.teacher .teacher-only{display:flex!important}.action{display:flex;align-items:center;justify-content:center;min-height:50px;margin-top:14px;border-radius:14px;border:1px solid #967026;background:#18130b;color:#f0c86b;text-decoration:none;font-weight:800}@media(max-width:560px){.tools{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.tool{min-height:105px;padding:7px}.tool span{font-size:27px}.tool b{font-size:12px}.details{grid-template-columns:1fr}}
</style><script src="ha-theme.js"></script><link rel="stylesheet" href="ha-theme.css"></head><body><div class="wrap" id="root"><div class="top"><a class="back" id="backLink" href="courses.html">← رجوع</a><b>HA Marketing</b><span></span></div><div class="card" id="box">جاري فتح الكلاس...</div><div id="tools" class="tools" style="display:none"></div></div>
<script>
const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});const id=new URLSearchParams(location.search).get('class');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MODULES=[['📊','الدرجات','study-class-grades.html'],['📅','التقويم','study-class-module.html?type=calendar'],['📚','الملازم','study-class-module.html?type=handout'],['📝','الامتحانات','study-class-module.html?type=exam'],['❓','الأسئلة','study-class-module.html?type=question'],['🎥','الدروس','study-class-module.html?type=lesson'],['✅','الواجبات','study-class-module.html?type=assignment'],['📢','الإعلانات','study-class-module.html?type=announcement'],['📋','الحضور','study-class-attendance.html'],['💬','المراسلة','study-class-messages.html'],['🗓️','جدول الحصص','study-class-module.html?type=schedule'],['🔗','روابط مهمة','study-class-module.html?type=link']];
async function init(){const {data:{session}}=await db.auth.getSession();if(!session)return location.href='login.html';if(!id){box.textContent='الكلاس غير محدد';return}const {data:c,error}=await db.from('study_classes').select('*').eq('id',id).maybeSingle();if(error||!c){box.textContent='تعذر العثور على الكلاس';return}const isTeacher=c.teacher_user_id===session.user.id;let joined=isTeacher;if(!joined){const m=await db.from('study_class_members').select('class_id').eq('class_id',id).eq('student_user_id',session.user.id).maybeSingle();joined=!!m.data}if(!joined){box.innerHTML='<h1>🔒 هذا الكلاس خاص</h1><div class="muted">تحتاج دعوة من المدرس وقبولها قبل الدخول.</div>';return}if(isTeacher){document.body.classList.add('teacher');document.getElementById('backLink').href='teacher-my-classes.html'}const t=await db.from('study_teachers').select('display_name').eq('user_id',c.teacher_user_id).maybeSingle();box.innerHTML=`<h1>${esc(c.class_name)}</h1><div class="muted">المدرس: ${esc(t.data?.display_name||'مدرس')}<br>${esc(c.description||'')}</div><div class="details"><div class="detail"><b>الصف</b><br>${esc(c.grade_name)} ${c.branch?'— '+esc(c.branch):''}</div><div class="detail"><b>المادة</b><br>${esc(c.subject||'—')}</div></div>${c.online_url?`<a class="action" href="${esc(c.online_url)}" target="_blank" rel="noopener">💻 دخول الدرس الأونلاين</a>`:''}${c.location_text?`<div class="action">📍 ${esc(c.location_text)}</div>`:''}`;const tools=document.getElementById('tools');let toolHtml=MODULES.map(m=>`<a class="tool" href="${m[2]}${m[2].includes('?')?'&':'?'}class=${encodeURIComponent(id)}"><span>${m[0]}</span><b>${m[1]}</b></a>`).join('');if(isTeacher){toolHtml+=`<a class="tool" href="study-class-notify.html?class=${encodeURIComponent(id)}"><span>🔔</span><b>تبليغ الصف</b></a>`;}tools.innerHTML=toolHtml;tools.style.display='grid'}init();
</script></body></html>
