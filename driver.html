<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>واجهة السائق - HA Marketing</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f5f5f5;color:#111}
.app{width:100%;max-width:760px;margin:auto;background:#fff;min-height:100vh}
.head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid #eee}
.head h1{font-size:17px;margin:0}
.status-toggle{display:flex;align-items:center;gap:8px}
.status-toggle button{border:0;border-radius:999px;padding:9px 14px;font-weight:700;cursor:pointer;background:#111;color:#fff}
.status-toggle button.off{background:#e5e5e5;color:#555}

#map{height:42vh;min-height:300px}

.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 12px}
.summary .box{background:#f7f7f7;border-radius:12px;padding:10px;text-align:center}
.summary small{display:block;color:#777;font-size:10px;margin-bottom:3px}
.summary b{font-size:14px}

.section{padding:10px 12px}
.section h2{font-size:16px;margin:0 0 8px}
.request-card{background:#fff;border:1px solid #e8e8e8;border-radius:16px;padding:12px;box-shadow:0 3px 12px #0001}
.customer{display:flex;align-items:center;gap:10px}
.avatar{width:44px;height:44px;border-radius:50%;background:#eee;display:flex;align-items:center;justify-content:center;font-size:23px}
.customer-info{flex:1}.customer-info b{display:block}.customer-info span{color:#777;font-size:12px}

.route-info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.route-info .item{background:#f8f8f8;border-radius:10px;padding:9px}
.route-info small{display:block;color:#777;font-size:10px;margin-bottom:3px}
.route-info b{font-size:12px}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.actions button{border:0;border-radius:11px;padding:12px;font-size:14px;font-weight:700;cursor:pointer}
.accept{background:#1769e0;color:#fff}
.reject{background:#eee;color:#111}

.accepted-panel{display:none}
.accepted-panel.show{display:block}
.state{background:#eef4ff;border-radius:12px;padding:10px;text-align:center;font-weight:700;margin-bottom:10px}
.trip-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.trip-actions button{border:0;border-radius:11px;padding:11px;font-weight:700;cursor:pointer}
.arrive{background:#111;color:#fff}
.start-trip{background:#1769e0;color:#fff}
.finish-trip{background:#16803b;color:#fff;grid-column:1/-1}

.contact{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}
.contact button{border:0;border-radius:10px;padding:9px;background:#f4f4f4;cursor:pointer;font-size:12px}

@media(max-width:560px){
  #map{height:40vh}
  .summary{grid-template-columns:repeat(3,1fr)}
}

/* ===== نافذة إلغاء الطلب ===== */
.cancel-reason-sheet{
  position:fixed;inset:0;z-index:6000;background:rgba(0,0,0,.42);
  display:none;align-items:flex-end;justify-content:center
}
.cancel-reason-sheet.show{display:flex}
.cancel-reason-card{
  width:min(760px,100%);background:#fff;border-radius:22px 22px 0 0;
  padding:16px 14px 18px
}
.cancel-reason-head{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:10px
}
.cancel-reason-head h3{margin:0;font-size:18px}
.cancel-reason-head button{
  width:36px;height:36px;border:0;border-radius:50%;background:#eee;font-size:20px
}
.cancel-reason-option{
  display:flex;align-items:center;gap:9px;padding:12px 10px;
  border:1px solid #eee;border-radius:11px;margin:7px 0;background:#fafafa
}
.cancel-reason-option input{width:18px;height:18px}
.cancel-other{
  display:none;width:100%;padding:10px;border:1px solid #ccc;
  border-radius:10px;margin-top:7px;font-size:14px
}
.cancel-other.show{display:block}
.confirm-cancel-btn{
  width:100%;border:0;border-radius:12px;padding:13px;margin-top:10px;
  background:#c62828;color:#fff;font-size:15px;font-weight:700
}

</style>
</head>
<body>
<div class="app">
  <div class="head">
    <h1>🚖 واجهة السائق</h1>
    <div class="status-toggle">
      <button id="availabilityBtn">متاح</button>
    </div>
  </div>

  <div id="map"></div>

  <div class="summary">
    <div class="box"><small>الطلبات القريبة</small><b id="nearbyCount">1</b></div>
    <div class="box"><small>المسافة للزبون</small><b id="toCustomer">2.4 كم</b></div>
    <div class="box"><small>السعر</small><b id="fare">8,500 د.ع</b></div>
  </div>

  <div class="section" id="requestsSection">
    <h2>الطلبات القريبة</h2>

    <div class="request-card" id="requestCard">
      <div class="customer">
        <div class="avatar">👤</div>
        <div class="customer-info">
          <b id="requestCustomerName">بانتظار طلب...</b>
          <span>⭐ 4.8</span>
        </div>
        <strong id="requestVehicle">🚕 —</strong>
      </div>

      <div class="route-info">
        <div class="item"><small>الانطلاق</small><b id="requestPickup">—</b></div>
        <div class="item"><small>الوصول</small><b id="requestDestination">—</b></div>
        <div class="item"><small>مدة الوصول للزبون</small><b>6 دقائق</b></div>
        <div class="item"><small>مدة الرحلة</small><b id="requestTripTime">—</b></div>
      </div>

      <div class="actions">
        <button id="acceptBtn" class="accept">قبول الطلب</button>
        <button id="rejectBtn" class="reject">رفض</button>
      </div>
    </div>
  </div>

  <div class="section accepted-panel" id="acceptedPanel">
    <h2>الطلب الحالي</h2>
    <div class="state" id="tripState">بالطريق إلى الزبون</div>

    <div class="request-card">
      <div class="customer">
        <div class="avatar">👤</div>
        <div class="customer-info">
          <b>الزبون</b>
          <span>المنصور → الكرادة</span>
        </div>
        <strong id="currentFare">8,500 د.ع</strong>
      </div>

      <div class="contact">
        <button onclick="window.location.href='tel:07700000000'">📞 اتصال</button>
        <button onclick="window.open('https://wa.me/9647700000000','_blank')">🟢 واتساب</button>
        <button onclick="alert('نربط الدردشة داخل التطبيق لاحقاً')">💬 رسالة</button>
      </div>

      <div class="trip-actions" style="margin-top:10px">
        <button id="arriveBtn" class="arrive">وصلت للزبون</button>
        <button id="startTripBtn" class="start-trip" disabled>ابدأ الرحلة</button>
        <button id="finishTripBtn" class="finish-trip" disabled>إنهاء الرحلة</button>
<button id="driverCancelCurrentBtn" class="reject" type="button" style="grid-column:1/-1">إلغاء الطلب</button>
      </div>
    </div>
  </div>
</div>


<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAPmaCbhJCh1a7DyDos1HyM95HDKe4L6sE",
  authDomain: "ha-marketing.firebaseapp.com",
  databaseURL: "https://ha-marketing-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ha-marketing",
  storageBucket: "ha-marketing.firebasestorage.app",
  messagingSenderId: "558520139704",
  appId: "1:558520139704:web:526f8026dac658403b594d"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
</script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map').setView([33.3152,44.3661],13);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{
  maxZoom:19,subdomains:'abcd',attribution:'&copy; OpenStreetMap &copy; CARTO'
}).addTo(map);

const driver=L.marker([33.325,44.35]).addTo(map).bindPopup('موقع السائق');
const customer=L.marker([33.31,44.37]).addTo(map).bindPopup('موقع الزبون');
const destination=L.marker([33.29,44.40]).addTo(map).bindPopup('الوجهة');

let available=true;
let currentRideId=null;
let currentRide=null;
let driverWatch=null;
let currentRideStatusRef=null;

const driverProfile={
  name:'سائق HA',
  phone:'07700000000',
  plate:'بغداد —',
  carName:'سيارة تكسي',
  carColor:'—',
  rating:'5.0',
  photo:''
};

function coordText(p){
  if(!p)return '—';
  return Number(p.lat).toFixed(5)+', '+Number(p.lng).toFixed(5);
}

function watchPendingRides(){
  if(driverWatch) driverWatch.off();
  driverWatch=db.ref('rides');
  driverWatch.orderByChild('status').equalTo('searching').on('value',snap=>{
    const rides=snap.val()||{};
    const entries=Object.entries(rides).sort((a,b)=>(a[1].createdAt||0)-(b[1].createdAt||0));
    nearbyCount.textContent=available ? String(entries.length) : '0';

    if(!available || currentRideId)return;

    if(!entries.length){
      requestCard.style.display='none';
      return;
    }

    const [id,ride]=entries[0];
    currentRideId=id;
    currentRide=ride;
    requestCard.style.display='block';

    requestCustomerName.textContent=ride.customer?.name||'زبون';
    requestVehicle.textContent='🚕 '+(ride.vehicleType||'تكسي');
    requestPickup.textContent=coordText(ride.pickup);
    requestDestination.textContent=coordText(ride.destination);
    requestTripTime.textContent=ride.tripMinutes ? Math.round(ride.tripMinutes)+' دقيقة' : '—';
    fare.textContent=ride.price ? Number(ride.price).toLocaleString('ar-IQ')+' د.ع' : '—';

    if(ride.pickup){
      customer.setLatLng([ride.pickup.lat,ride.pickup.lng]);
    }
    if(ride.destination){
      destination.setLatLng([ride.destination.lat,ride.destination.lng]);
    }
  });
}

function stopCurrentRideStatusWatch(){
  if(currentRideStatusRef){
    currentRideStatusRef.off();
    currentRideStatusRef=null;
  }
}

function watchCurrentRideStatus(rideId){
  stopCurrentRideStatusWatch();
  if(!rideId)return;

  currentRideStatusRef=db.ref('rides/'+rideId);
  currentRideStatusRef.on('value',snap=>{
    const ride=snap.val();
    if(!ride)return;

    if(ride.status==='cancelled' && ride.cancelledBy==='customer'){
      const reason=ride.cancelReason||'بدون سبب محدد';
      stopCurrentRideStatusWatch();
      localStorage.removeItem('ha_driver_active_ride');

      currentRideId=null;
      currentRide=null;
      acceptedPanel.classList.remove('show');
      requestsSection.style.display='block';
      arriveBtn.disabled=false;
      startTripBtn.disabled=true;
      finishTripBtn.disabled=true;

      alert('الزبون ألغى الرحلة.\nسبب الإلغاء: '+reason);
      watchPendingRides();
      return;
    }

    if(ride.status==='finished'){
      stopCurrentRideStatusWatch();
    }
  });
}

availabilityBtn.onclick=()=>{
  available=!available;
  availabilityBtn.textContent=available?'متاح':'غير متاح';
  availabilityBtn.classList.toggle('off',!available);
  if(!available){
    nearbyCount.textContent='0';
    requestCard.style.display='none';
  }else{
    currentRideId=null;
    currentRide=null;
    watchPendingRides();
  }
};

acceptBtn.onclick=async()=>{
  if(!currentRideId)return;

  const ref=db.ref('rides/'+currentRideId);
  const tx=await ref.transaction(ride=>{
    if(ride && ride.status==='searching'){
      ride.status='accepted';
      ride.acceptedAt=Date.now();
      ride.driver=driverProfile;
      return ride;
    }
    return;
  });

  if(!tx.committed){
    alert('هذا الطلب تم أخذه أو إلغاؤه.');
    currentRideId=null;
    currentRide=null;
    watchPendingRides();
    return;
  }

  currentRide=tx.snapshot.val();
  localStorage.setItem('ha_driver_active_ride',currentRideId);
  watchCurrentRideStatus(currentRideId);
  requestsSection.style.display='none';
  acceptedPanel.classList.add('show');
  tripState.textContent='بالطريق إلى الزبون';
  currentFare.textContent=currentRide.price ? Number(currentRide.price).toLocaleString('ar-IQ')+' د.ع' : '—';

  if(navigator.geolocation){
    navigator.geolocation.watchPosition(pos=>{
      if(!currentRideId)return;
      const loc={lat:pos.coords.latitude,lng:pos.coords.longitude,updatedAt:Date.now()};
      driver.setLatLng([loc.lat,loc.lng]);
      db.ref('rides/'+currentRideId+'/driverLocation').set(loc);
    },()=>{}, {enableHighAccuracy:true,maximumAge:5000,timeout:10000});
  }

  fetch(`https://router.project-osrm.org/route/v1/driving/${driver.getLatLng().lng},${driver.getLatLng().lat};${customer.getLatLng().lng},${customer.getLatLng().lat}?overview=full&geometries=geojson`)
    .then(r=>r.json()).then(j=>{
      if(j.code==='Ok'){
        const layer=L.geoJSON(j.routes[0].geometry,{style:{weight:5}}).addTo(map);
        map.fitBounds(layer.getBounds(),{padding:[30,30]});
      }
    });
};

rejectBtn.onclick=async()=>{
  if(!currentRideId)return;
  await db.ref('rides/'+currentRideId).update({status:'rejected',rejectedAt:Date.now()});
  currentRideId=null;
  currentRide=null;
  requestCard.style.display='none';
  watchPendingRides();
};

arriveBtn.onclick=async()=>{
  tripState.textContent='وصلت إلى الزبون';
  arriveBtn.disabled=true;
  startTripBtn.disabled=false;
  if(currentRideId) await db.ref('rides/'+currentRideId).update({status:'arrived',arrivedAt:Date.now()});
};

startTripBtn.onclick=async()=>{
  tripState.textContent='الرحلة بدأت';
  startTripBtn.disabled=true;
  finishTripBtn.disabled=false;
  if(currentRideId) await db.ref('rides/'+currentRideId).update({status:'started',startedAt:Date.now()});

  fetch(`https://router.project-osrm.org/route/v1/driving/${customer.getLatLng().lng},${customer.getLatLng().lat};${destination.getLatLng().lng},${destination.getLatLng().lat}?overview=full&geometries=geojson`)
    .then(r=>r.json()).then(j=>{
      if(j.code==='Ok'){
        const layer=L.geoJSON(j.routes[0].geometry,{style:{weight:5}}).addTo(map);
        map.fitBounds(layer.getBounds(),{padding:[30,30]});
      }
    });
};

finishTripBtn.onclick=async()=>{
  tripState.textContent='تم إنهاء الرحلة';
  finishTripBtn.disabled=true;
  if(currentRideId){
    await db.ref('rides/'+currentRideId).update({status:'finished',finishedAt:Date.now()});
    localStorage.removeItem('ha_driver_active_ride');
    stopCurrentRideStatusWatch();
  }
  setTimeout(()=>{
    currentRideId=null;
    currentRide=null;
    acceptedPanel.classList.remove('show');
    requestsSection.style.display='block';
    arriveBtn.disabled=false;
    startTripBtn.disabled=true;
    finishTripBtn.disabled=true;
    watchPendingRides();
  },1200);
};

async function restoreDriverRide(){
  const saved=localStorage.getItem('ha_driver_active_ride');
  if(!saved){
    watchPendingRides();
    return;
  }

  const snap=await db.ref('rides/'+saved).once('value');
  const ride=snap.val();
  if(!ride || ['finished','cancelled','rejected'].includes(ride.status)){
    localStorage.removeItem('ha_driver_active_ride');
    currentRideId=null;
    currentRide=null;
    watchPendingRides();
    return;
  }

  currentRideId=saved;
  currentRide=ride;
  watchCurrentRideStatus(currentRideId);
  requestsSection.style.display='none';
  acceptedPanel.classList.add('show');
  currentFare.textContent=ride.price ? Number(ride.price).toLocaleString('ar-IQ')+' د.ع' : '—';

  if(ride.pickup) customer.setLatLng([ride.pickup.lat,ride.pickup.lng]);
  if(ride.destination) destination.setLatLng([ride.destination.lat,ride.destination.lng]);

  const stateText={
    accepted:'بالطريق إلى الزبون',
    arrived:'وصلت إلى الزبون',
    started:'الرحلة بدأت'
  };
  tripState.textContent=stateText[ride.status]||'الطلب الحالي';

  arriveBtn.disabled=ride.status!=='accepted';
  startTripBtn.disabled=ride.status!=='arrived';
  finishTripBtn.disabled=ride.status!=='started';

  if(navigator.geolocation){
    navigator.geolocation.watchPosition(pos=>{
      if(!currentRideId)return;
      const loc={lat:pos.coords.latitude,lng:pos.coords.longitude,updatedAt:Date.now()};
      driver.setLatLng([loc.lat,loc.lng]);
      db.ref('rides/'+currentRideId+'/driverLocation').set(loc);
    },()=>{}, {enableHighAccuracy:true,maximumAge:5000,timeout:10000});
  }
}

requestCard.style.display='none';
nearbyCount.textContent='0';
restoreDriverRide();
</script>

<div id="driverCancelReasonSheet" class="cancel-reason-sheet">
  <div class="cancel-reason-card">
    <div class="cancel-reason-head">
      <h3>سبب إلغاء رحلة التكسي من السائق</h3>
      <button type="button" data-close-cancel="driverCancelReasonSheet">×</button>
    </div>
    <label class="cancel-reason-option">
  <input type="radio" name="driverCancelReasonSheet_reason" value="الزبون بعيد جدًا" >
  <span>الزبون بعيد جدًا</span>
</label>
<label class="cancel-reason-option">
  <input type="radio" name="driverCancelReasonSheet_reason" value="ازدحام أو طريق مغلق" >
  <span>ازدحام أو طريق مغلق</span>
</label>
<label class="cancel-reason-option">
  <input type="radio" name="driverCancelReasonSheet_reason" value="مشكلة بالمركبة" >
  <span>مشكلة بالمركبة</span>
</label>
<label class="cancel-reason-option">
  <input type="radio" name="driverCancelReasonSheet_reason" value="تعذر التواصل مع الزبون" >
  <span>تعذر التواصل مع الزبون</span>
</label>
<label class="cancel-reason-option">
  <input type="radio" name="driverCancelReasonSheet_reason" value="طلب غير مناسب" >
  <span>طلب غير مناسب</span>
</label>
<label class="cancel-reason-option">
  <input type="radio" name="driverCancelReasonSheet_reason" value="غير ذلك" id="driverCancelReasonSheet_other">
  <span>غير ذلك</span>
</label>
    <input id="driverCancelOtherText" class="cancel-other" placeholder="اكتب سبب الإلغاء">
    <button id="confirmDriverCancelReason" class="confirm-cancel-btn" type="button">تأكيد الإلغاء</button>
  </div>
</div>

<script>
function openDriverCancelReason(){
  document.getElementById('driverCancelReasonSheet').classList.add('show');
}
function closeDriverCancelReason(){
  document.getElementById('driverCancelReasonSheet').classList.remove('show');
}
document.getElementById('driverCancelCurrentBtn').onclick=openDriverCancelReason;
document.querySelectorAll('[data-close-cancel="driverCancelReasonSheet"]').forEach(b=>b.onclick=closeDriverCancelReason);
document.getElementById('driverCancelReasonSheet').addEventListener('click',e=>{
  if(e.target.id==='driverCancelReasonSheet') closeDriverCancelReason();
});
document.querySelectorAll('input[name="driverCancelReasonSheet_reason"]').forEach(r=>{
  r.addEventListener('change',()=>{
    document.getElementById('driverCancelOtherText').classList.toggle('show',r.value==='غير ذلك' && r.checked);
  });
});
document.getElementById('confirmDriverCancelReason').onclick=async()=>{
  const checked=document.querySelector('input[name="driverCancelReasonSheet_reason"]:checked');
  if(!checked){ alert('اختار سبب الإلغاء أولاً.'); return; }

  let reason=checked.value;
  if(checked.value==='غير ذلك'){
    reason=document.getElementById('driverCancelOtherText').value.trim();
    if(!reason){
      alert('اكتب سبب الإلغاء.');
      document.getElementById('driverCancelOtherText').focus();
      return;
    }
  }

  if(currentRideId){
    await db.ref('rides/'+currentRideId).update({
      status:'cancelled',
      cancelledBy:'driver',
      cancelReason:reason,
      cancelledAt:firebase.database.ServerValue.TIMESTAMP
    });
    localStorage.removeItem('ha_driver_active_ride');
  }

  stopCurrentRideStatusWatch();
  closeDriverCancelReason();
  currentRideId=null;
  currentRide=null;
  acceptedPanel.classList.remove('show');
  requestsSection.style.display='block';
  arriveBtn.disabled=false;
  startTripBtn.disabled=true;
  finishTripBtn.disabled=true;

  document.querySelectorAll('input[name="driverCancelReasonSheet_reason"]').forEach(r=>r.checked=false);
  document.getElementById('driverCancelOtherText').value='';
  document.getElementById('driverCancelOtherText').classList.remove('show');

  watchPendingRides();
};
</script>
</body>
</html>
