<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المراسلة - HA Marketing</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#06090c;color:#fff;font-family:Tahoma,Arial}.wrap{width:min(94%,820px);margin:16px auto 90px}.top{display:flex;align-items:center;justify-content:space-between}.btn,button{padding:10px 13px;border:1px solid #3b4853;border-radius:12px;background:#12181d;color:#fff;text-decoration:none;font:inherit}.hero{padding:15px;text-align:center}.hero h1{color:#f0c86b}.teacher-picker{display:none;margin:8px 0}.teacher .teacher-picker{display:block}select{width:100%;padding:11px;background:#0a0f13;color:#fff;border:1px solid #3b4853;border-radius:11px}.chat{min-height:420px;max-height:58vh;overflow:auto;border:1px solid #36434e;border-radius:20px;background:#090e12;padding:12px}.msg{max-width:80%;padding:10px 12px;border-radius:15px;margin:7px 0;line-height:1.55}.mine{margin-right:auto;background:#1d3a2a;border:1px solid #2e6847}.theirs{margin-left:auto;background:#152231;border:1px solid #31516c}.time{display:block;font-size:9px;color:#9eabb6;margin-top:4px}.send{display:flex;gap:8px;margin-top:10px}.send input{flex:1;padding:12px;border-radius:13px;border:1px solid #3b4853;background:#0a0f13;color:#fff}.muted{color:#aeb7bf;text-align:center;padding:20px}</style></head><body><div class="wrap"><div class="top"><a class="btn" id="back">← الصف</a><b>HA Marketing</b><span></span></div><div class="hero"><h1>💬 المراسلة</h1></div><div class="teacher-picker"><select id="studentSelect" onchange="loadMessages()"></select></div><div id="chat" class="chat"><div class="muted">جاري التحميل...</div></div><div class="send"><input id="messageInput" placeholder="اكتب رسالتك"><button onclick="sendMessage()">إرسال</button></div></div><script>
const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});const classId=new URLSearchParams(location.search).get('class');let me=null,teacherId=null,isTeacher=false;back.href='study-class.html?class='+classId;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function init(){const {data:{session}}=await db.auth.getSession();if(!session)return location.href='login.html';me=session.user;const {data:c}=await db.from('study_classes').select('teacher_user_id').eq('id',classId).maybeSingle();if(!c)return;teacherId=c.teacher_user_id;isTeacher=teacherId===me.id;if(isTeacher){document.body.classList.add('teacher');const {data,error}=await db.rpc('get_study_class_students',{p_class_id:Number(classId)});if(error)return chat.innerHTML='<div class="muted">'+esc(error.message)+'</div>';studentSelect.innerHTML=(data||[]).map(x=>`<option value="${x.student_user_id}">${esc(x.email)}</option>`).join('')||'<option value="">لا يوجد طلاب</option>'}loadMessages();setInterval(loadMessages,5000)}
function otherId(){return isTeacher?studentSelect.value:teacherId}
async function loadMessages(){const other=otherId();if(!other){chat.innerHTML='<div class="muted">لا يوجد طالب محدد.</div>';return}const {data,error}=await db.from('study_class_messages').select('*').eq('class_id',classId).or(`and(sender_user_id.eq.${me.id},recipient_user_id.eq.${other}),and(sender_user_id.eq.${other},recipient_user_id.eq.${me.id})`).order('created_at');if(error){chat.innerHTML='<div class="muted">'+esc(error.message)+'</div>';return}chat.innerHTML=(data||[]).map(x=>`<div class="msg ${x.sender_user_id===me.id?'mine':'theirs'}">${esc(x.message)}<span class="time">${new Date(x.created_at).toLocaleString('ar-IQ')}</span></div>`).join('')||'<div class="muted">ابدأ المحادثة.</div>';chat.scrollTop=chat.scrollHeight}
async function sendMessage(){const other=otherId(),msg=messageInput.value.trim();if(!other)return alert('لا يوجد مستلم');if(!msg)return;const {error}=await db.from('study_class_messages').insert({class_id:Number(classId),sender_user_id:me.id,recipient_user_id:other,message:msg});if(error)return alert(error.message);messageInput.value='';loadMessages()}messageInput.addEventListener('keydown',e=>{if(e.key==='Enter')sendMessage()});init();
</script></body></html>
