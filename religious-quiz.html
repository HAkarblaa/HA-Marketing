<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>أسئلة دينية - HA Marketing</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f5f5f5;color:#111}
.wrap{width:95%;max-width:1000px;margin:26px auto;position:relative}
h1{text-align:center;margin-bottom:7px}
.sub{text-align:center;color:#666;margin-bottom:18px}
.game{display:grid;grid-template-columns:80px 1fr;gap:16px;align-items:start}
.side{position:sticky;top:18px;display:flex;flex-direction:column;align-items:center;gap:12px}
.stage-ball{width:62px;height:62px;border-radius:50%;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;position:relative}
.stage-ball::after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:#fff;top:3px;left:50%;transform:translateX(-50%);animation:orbit 2s linear infinite;transform-origin:0 28px}
@keyframes orbit{from{transform:rotate(0deg) translateX(28px)}to{transform:rotate(360deg) translateX(28px)}}
.arrow-up{font-size:32px;transition:transform .3s}
.progress-rail{height:370px;width:10px;border-radius:999px;background:#ddd;position:relative;overflow:visible}
.progress-fill{position:absolute;bottom:0;left:0;right:0;background:#111;border-radius:999px;height:0%;transition:height .35s}
.progress-arrow{position:absolute;left:50%;transform:translate(-50%,50%);bottom:0;font-size:22px;transition:bottom .35s}
.quiz-card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 4px 18px #0001;min-height:430px}
.topline{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}
.timer{display:flex;align-items:center;gap:10px}
.timer-ring{width:54px;height:54px;border-radius:50%;background:conic-gradient(#111 var(--p,100%),#ddd 0);display:flex;align-items:center;justify-content:center;position:relative}
.timer-ring::before{content:"";position:absolute;inset:6px;background:#fff;border-radius:50%}
.timer-ring span{position:relative;font-weight:700;font-size:16px}
.stage-text{font-weight:700}
.question{font-size:25px;line-height:1.7;margin:18px 0 22px}
.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.answer{border:2px solid #e3e3e3;background:#fafafa;border-radius:14px;padding:16px;text-align:right;font-size:17px;cursor:pointer;transition:.2s}
.answer:hover{border-color:#aaa}
.answer.correct{background:#e9f8ed;border-color:#34a853}
.answer.wrong{background:#fdeaea;border-color:#d93025}
.answer:disabled{cursor:default}
.mark{font-size:52px;text-align:center;min-height:65px;margin-top:14px}
.mark.ok{color:#1e9e4a}.mark.bad{color:#d93025}
.result{display:none;text-align:center}
.result.show{display:block}
.score-circle{width:180px;height:180px;border-radius:50%;border:12px solid #111;margin:20px auto;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-circle b{font-size:42px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.stat{background:#f7f7f7;border-radius:12px;padding:14px}
.restart{margin-top:18px;border:0;border-radius:12px;background:#111;color:#fff;padding:13px 20px;font-size:16px;cursor:pointer}
.back{display:block;text-align:center;margin:26px 0;text-decoration:none;color:#111}
@media(max-width:700px){
 .game{grid-template-columns:58px 1fr;gap:8px}
 .stage-ball{width:50px;height:50px;font-size:16px}
 .progress-rail{height:300px}
 .quiz-card{padding:16px}
 .question{font-size:21px}
 .answers{grid-template-columns:1fr}
 .stats{grid-template-columns:1fr}
}
</style>
</head>

</div>

const TOTAL=20;
let questions=[],index=0,correct=0,wrong=0,skipped=0,timeLeft=15,timer=null,locked=false;

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function newGame(){
  questions=shuffle(BANK).slice(0,TOTAL);
  index=0;correct=0;wrong=0;skipped=0;
  document.getElementById('resultView').classList.remove('show');
  document.getElementById('quizView').style.display='block';
  renderQuestion();
}

function updateProgress(){
  const stage=index+1;
  document.getElementById('stageNum').textContent=Math.min(stage,TOTAL);
  document.getElementById('sideStage').textContent=Math.min(stage,TOTAL);
  const pct=(index/TOTAL)*100;
  document.getElementById('progressFill').style.height=pct+'%';
  document.getElementById('progressArrow').style.bottom=pct+'%';
}

function startTimer(){
  clearInterval(timer);
  timeLeft=15;
  renderTimer();
  timer=setInterval(()=>{
    timeLeft--;
    renderTimer();
    if(timeLeft<=0){
      clearInterval(timer);
      if(!locked) handleTimeout();
    }
  },1000);
}

function renderTimer(){
  document.getElementById('timerNum').textContent=timeLeft;
  document.getElementById('timerRing').style.setProperty('--p',(timeLeft/15*100)+'%');
}

function renderQuestion(){
  locked=false;
  updateProgress();
  document.getElementById('mark').textContent='';
  document.getElementById('mark').className='mark';

  const q=questions[index];
  document.getElementById('question').textContent=q.q;
  const box=document.getElementById('answers');
  box.innerHTML='';
  q.a.forEach((txt,i)=>{
    const b=document.createElement('button');
    b.className='answer';
    b.textContent=txt;
    b.onclick=()=>choose(i,b);
    box.appendChild(b);
  });
  startTimer();
}

function disableAnswers(){
  document.querySelectorAll('.answer').forEach(b=>b.disabled=true);
}

function choose(choice,btn){
  if(locked)return;
  locked=true;
  clearInterval(timer);
  disableAnswers();

  const q=questions[index];
  const mark=document.getElementById('mark');

  if(choice===q.c){
    correct++;
    btn.classList.add('correct');
    mark.textContent='✅';
    mark.className='mark ok';
  }else{
    wrong++;
    btn.classList.add('wrong');
    const buttons=[...document.querySelectorAll('.answer')];
    buttons[q.c].classList.add('correct');
    mark.textContent='❌';
    mark.className='mark bad';
  }

  setTimeout(nextQuestion,3000);
}

function handleTimeout(){
  if(locked)return;
  locked=true;
  skipped++;
  wrong++;
  disableAnswers();
  const q=questions[index];
  const buttons=[...document.querySelectorAll('.answer')];
  buttons[q.c].classList.add('correct');
  const mark=document.getElementById('mark');
  mark.textContent='⏱️❌';
  mark.className='mark bad';
  setTimeout(nextQuestion,3000);
}

function nextQuestion(){
  index++;
  if(index>=TOTAL){
    finish();
  }else{
    renderQuestion();
  }
}

function finish(){
  clearInterval(timer);
  document.getElementById('quizView').style.display='none';
  const rv=document.getElementById('resultView');
  rv.classList.add('show');
  const pct=Math.round((correct/TOTAL)*100);
  document.getElementById('percent').textContent=pct+'%';
  document.getElementById('correctCount').textContent=correct;
  document.getElementById('wrongCount').textContent=wrong;
  document.getElementById('skipCount').textContent=skipped;
  document.getElementById('progressFill').style.height='100%';
  document.getElementById('progressArrow').style.bottom='100%';
  document.getElementById('sideStage').textContent='20';
}

document.getElementById('restartBtn').onclick=newGame;
newGame();
</script>
