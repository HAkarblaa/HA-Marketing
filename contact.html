<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلب خدمة - HA Marketing</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f5f5f5;color:#111}.wrap{width:94%;max-width:900px;margin:24px auto}.card{background:white;border-radius:18px;padding:20px;box-shadow:0 4px 18px #0001}h1{text-align:center}.service-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:16px}.service-card{border:0;background:#fff;border-radius:16px;padding:18px 10px;box-shadow:0 4px 16px #0001;cursor:pointer;text-align:center;color:#111;transition:.15s}.service-card:active{transform:scale(.98)}.service-card .ico{font-size:43px;display:block;margin-bottom:7px}.service-card .name{font-size:18px;font-weight:700}.selected-title{background:#f4f4f4;border-radius:12px;padding:12px;text-align:center;font-weight:700;margin-bottom:8px}label{display:block;font-weight:bold;margin:13px 0 6px}input,select,textarea,button,a.btn{width:100%;padding:13px;border-radius:10px;font-size:16px}input,select,textarea{border:1px solid #ccc;background:#fff}textarea{min-height:150px;resize:vertical}button{border:0;cursor:pointer;margin-top:12px}.primary{background:#111;color:#fff}.light{background:#eee;color:#111}.status{padding:12px;border-radius:10px;background:#f4f4f4;margin:12px 0;line-height:1.8}.ok{background:#e4f7e9}.error{background:#fde7e7}.btn{display:block;text-align:center;text-decoration:none;margin-top:10px}.small{font-size:13px;color:#666}.hidden{display:none}@media(max-width:650px){.service-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.service-card{padding:15px 7px}.service-card .ico{font-size:38px}.service-card .name{font-size:16px}}</style></head><body><div class="wrap"><div class="card"><h1>🛠️ طلب خدمة</h1><div id="pageStatus" class="status">جاري التحقق من الحساب...</div>
<div id="serviceChooser" class="hidden"><div style="text-align:center;line-height:1.8;color:#555">اختر نوع الخدمة المطلوبة</div><div class="service-grid">
<button class="service-card" type="button" data-service="حداد"><span class="ico">🔩</span><span class="name">حداد</span></button>
<button class="service-card" type="button" data-service="بناء"><span class="ico">🧱</span><span class="name">بناء</span></button>
<button class="service-card" type="button" data-service="لباخ"><span class="ico">🏠</span><span class="name">لباخ</span></button>
<button class="service-card" type="button" data-service="نجار"><span class="ico">🪚</span><span class="name">نجار</span></button>
<button class="service-card" type="button" data-service="سلك مجاري"><span class="ico">🚿</span><span class="name">سلك مجاري</span></button>
<button class="service-card" type="button" data-service="سباك"><span class="ico">🔧</span><span class="name">سباك</span></button>
<button class="service-card" type="button" data-service="كهربائي"><span class="ico">⚡</span><span class="name">كهربائي</span></button>
<button class="service-card" type="button" data-service="تبريد وتكييف"><span class="ico">❄️</span><span class="name">تبريد وتكييف</span></button>
<button class="service-card" type="button" data-service="صباغ"><span class="ico">🎨</span><span class="name">صباغ</span></button>
<button class="service-card" type="button" data-service="بلاط وسيراميك"><span class="ico">⬜</span><span class="name">بلاط وسيراميك</span></button>
<button class="service-card" type="button" data-service="ألمنيوم وزجاج"><span class="ico">🪟</span><span class="name">ألمنيوم وزجاج</span></button>
<button class="service-card" type="button" data-service="صيانة أجهزة"><span class="ico">🧰</span><span class="name">صيانة أجهزة</span></button>
<button class="service-card" type="button" data-service="نقل وتركيب"><span class="ico">🚚</span><span class="name">نقل وتركيب</span></button>
<button class="service-card" type="button" data-service="تنظيف"><span class="ico">🧹</span><span class="name">تنظيف</span></button>
<button class="service-card" type="button" data-service="صيانة منزلية"><span class="ico">🛠️</span><span class="name">صيانة منزلية</span></button>
<button class="service-card" type="button" data-service="خدمة أخرى"><span class="ico">➕</span><span class="name">خدمة أخرى</span></button>
</div></div>
<div id="formBox" class="hidden"><div id="selectedTitle" class="selected-title"></div><button id="changeServiceBtn" class="light" type="button">↩ تغيير نوع الخدمة</button><input id="serviceType" type="hidden"><label>رقم الهاتف *</label><input id="phone" type="tel"><label>المنطقة / العنوان *</label><input id="area" placeholder="مثال: كربلاء - حي الحسين"><label>تفاصيل الطلب *</label><textarea id="description" placeholder="اشرح الخدمة المطلوبة بالتفصيل"></textarea><label>صورة أو فيديو (اختياري)</label><input id="attachment" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm"><div class="small">الحد الأقصى 20MB.</div><button id="locationBtn" class="light" type="button">📍 تحديد موقعي الحقيقي</button><div id="locationInfo" class="status">لم يتم تحديد الموقع بعد.</div><button id="submitBtn" class="primary" type="button">إرسال الطلب</button></div><a class="btn light" href="account.html">طلباتي</a><a class="btn light" href="index.html">← الرئيسية</a></div></div><script>
const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});let me=null,lat=null,lng=null;
const pageStatus=document.getElementById('pageStatus'),serviceChooser=document.getElementById('serviceChooser'),formBox=document.getElementById('formBox'),serviceType=document.getElementById('serviceType'),selectedTitle=document.getElementById('selectedTitle'),phone=document.getElementById('phone'),area=document.getElementById('area'),description=document.getElementById('description'),attachment=document.getElementById('attachment'),locationBtn=document.getElementById('locationBtn'),locationInfo=document.getElementById('locationInfo'),submitBtn=document.getElementById('submitBtn'),changeServiceBtn=document.getElementById('changeServiceBtn');
async function init(){const {data}=await db.auth.getUser();me=data?.user||null;if(!me||me.is_anonymous){pageStatus.innerHTML='طلب الخدمة يحتاج حساب عميل حقيقي.<br><a href="login.html">تسجيل الدخول</a>';return}const {data:p}=await db.from('profiles').select('account_type,phone').eq('id',me.id).maybeSingle();if(!p||p.account_type!=='customer'){pageStatus.textContent='طلب الخدمة متاح لحساب العميل فقط.';return}phone.value=p.phone||'';pageStatus.textContent='الحساب جاهز لإرسال طلب حقيقي.';pageStatus.className='status ok';serviceChooser.classList.remove('hidden')}
document.querySelectorAll('.service-card').forEach(btn=>btn.addEventListener('click',()=>{const name=btn.dataset.service;serviceType.value=name;selectedTitle.textContent='الخدمة المختارة: '+name;serviceChooser.classList.add('hidden');formBox.classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}));
changeServiceBtn.onclick=()=>{formBox.classList.add('hidden');serviceChooser.classList.remove('hidden');serviceType.value='';window.scrollTo({top:0,behavior:'smooth'})};
locationBtn.onclick=()=>{if(!navigator.geolocation){alert('المتصفح لا يدعم GPS');return}locationInfo.textContent='جاري تحديد الموقع...';navigator.geolocation.getCurrentPosition(p=>{lat=p.coords.latitude;lng=p.coords.longitude;locationInfo.textContent='✅ تم تحديد موقعك بدقة تقريبية '+Math.round(p.coords.accuracy)+' متر';locationInfo.className='status ok'},e=>{locationInfo.textContent='❌ تعذر تحديد الموقع. اسمح بإذن الموقع وحاول مرة ثانية.';locationInfo.className='status error'},{enableHighAccuracy:true,timeout:15000,maximumAge:0})};
submitBtn.onclick=async()=>{const st=serviceType.value,ph=phone.value.trim(),ar=area.value.trim(),desc=description.value.trim();if(!st||!ph||!ar||!desc){alert('أكمل الحقول المطلوبة');return}if(lat===null||lng===null){alert('حدد موقعك الحقيقي قبل إرسال الطلب');return}const f=attachment.files[0];if(f&&f.size>20*1024*1024){alert('الملف أكبر من 20MB');return}submitBtn.disabled=true;submitBtn.textContent='جاري إرسال الطلب...';let url=null;if(f){const ext=(f.name.split('.').pop()||'bin').toLowerCase();const path=me.id+'/'+Date.now()+'.'+ext;const {error:uerr}=await db.storage.from('service-attachments').upload(path,f,{upsert:false});if(uerr){alert('تعذر رفع الملف: '+uerr.message);submitBtn.disabled=false;submitBtn.textContent='إرسال الطلب';return}url=db.storage.from('service-attachments').getPublicUrl(path).data.publicUrl}const {data:o,error}=await db.from('orders').insert({customer_id:me.id,department:'services',order_type:st,description:desc,phone:ph,area:ar,customer_lat:lat,customer_lng:lng,attachment_url:url,status:'new'}).select('id').single();if(error){alert('تعذر إرسال الطلب: '+error.message);submitBtn.disabled=false;submitBtn.textContent='إرسال الطلب';return}alert('تم إرسال الطلب رقم #'+o.id+' بنجاح');location.href='account.html'};init();
</script></body></html>
