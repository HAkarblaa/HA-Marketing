<script>window.__haI18nRequested=true;</script><script src="ha-i18n.js?v=20261009-service-upload1" defer></script><script src="ha-service-upload.js?v=20261009-1"></script>
<style id="ha-service-upload-retry-style">#requestStatus{margin:12px 0;line-height:1.9;overflow-wrap:anywhere}#requestStatus.error{background:#fff0f0!important;color:#962d37!important;border:1px solid #efbec6!important;border-radius:12px!important}#requestStatus[hidden],#skipAttachmentsBtn[hidden]{display:none!important}#skipAttachmentsBtn{background:#fff!important;border:1px solid #bd8d36!important;color:#765019!important;white-space:normal}#fileList .file-item span{min-width:0;overflow-wrap:anywhere}#fileList .file-item button{flex-shrink:0}#submitBtn{white-space:normal}#formBox button:disabled{opacity:.6;cursor:not-allowed}</style></head><body><div class="wrap"><div class="card"><h1>🛠️ تقديم طلب خدمة</h1><div id="pageStatus" class="status">جاري التحقق من الحساب...</div>
<div id="serviceChooser" class="hidden"><div style="text-align:center;line-height:1.8;color:#555">اختر نوع الخدمة المطلوبة</div><div class="service-grid"><button class="service-card" type="button" data-service="صيانة طابعات"><span class="ico">🖨️</span><span class="name">صيانة طابعات</span></button><button class="service-card" type="button" data-service="صيانة موبايلات"><span class="ico">📱</span><span class="name">صيانة موبايلات</span></button><button class="service-card" type="button" data-service="حلاق"><span class="ico">💈</span><span class="name">حلاق</span></button>

<div id="formBox" class="hidden">
<div id="selectedTitle" class="selected-title"></div>
<button id="changeServiceBtn" class="light" type="button">↩ تغيير نوع الخدمة</button>
<input id="serviceType" type="hidden">

<div class="req-grid">
  <div>
    <label>رقم الموبايل *</label>
    <input id="phone" type="tel" inputmode="tel" placeholder="07XXXXXXXXX">
  </div>

  <div>
    <label>المحافظة *</label>
    <select id="governorate">
      <option value="">اختر المحافظة</option>
      <option>بغداد</option><option>البصرة</option><option>نينوى</option><option>أربيل</option>
      <option>النجف</option><option>كربلاء</option><option>ذي قار</option><option>الأنبار</option>
      <option>ديالى</option><option>كركوك</option><option>صلاح الدين</option><option>واسط</option>
      <option>ميسان</option><option>المثنى</option><option>القادسية</option><option>بابل</option>
      <option>دهوك</option><option>السليمانية</option><option>حلبجة</option>
    </select>
  </div>

  <div class="full">
    <label>العنوان *</label>
    <input id="address" placeholder="اكتب المنطقة / الحي / الشارع، أو استخدم مسمار الموقع">
    <button id="locationBtn" class="light" type="button">📍 تحديد العنوان تلقائياً من موقعي</button>
    <div id="locationInfo" class="status">تگدر تكتب العنوان بنفسك أو تضغط على مسمار الموقع.</div>
  </div>

  <div class="full">
    <label>صور أو فيديوهات للمشكلة (اختياري)</label>
    <input id="attachments" type="file" multiple accept="image/*,video/*">
    <div class="hint">تگدر تختار أكثر من صورة أو فيديو. الحد الأعلى لكل ملف 20MB.</div>
    <div id="fileList" class="file-list"></div>
  </div>

  <div class="full">
    <label>شرح الخدمة المطلوبة *</label>
    <textarea id="description" placeholder="اشرح المشكلة أو الخدمة التي تحتاجها بالتفصيل"></textarea>
  </div>
</div>

<div id="requestStatus" hidden class="status" role="status" aria-live="polite"></div><button id="skipAttachmentsBtn" hidden class="light" type="button">إرسال الطلب بدون مرفقات</button>
<button id="submitBtn" class="primary" type="button">إرسال الطلب</button>
</div><a class="btn light" href="service-orders.html?source=orders">طلباتي</a><a class="btn light" href="index.html">← الرئيسية</a></div></div><script>
const db=supabase.createClient(
  'https://ubayrhtshgtgggxprrek.supabase.co',
  'sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',
  {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}}
);

let me=null,lat=null,lng=null;
let selectedFiles=[],requestBusy=false,pendingPayload=null;
const uploadConfig={url:'https://ubayrhtshgtgggxprrek.supabase.co',key:'sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll'};
let requestKey=HAServiceUpload.uuid();
const requestStatus=document.getElementById('requestStatus'),skipAttachmentsBtn=document.getElementById('skipAttachmentsBtn');
function requestDialogText(message){return window.HAI18N?.translateText?.(message)||message}
function showRequestStatus(message,isError=false){requestStatus.textContent=message;requestStatus.className='status '+(isError?'error':'');requestStatus.hidden=!message}
function requestProgress(index,count,percent){submitBtn.innerHTML='<span>جاري رفع المرفق</span> <span data-no-i18n>'+index+' / '+count+(Number.isFinite(percent)?' — '+percent+'%':'')+'</span>'}
function pendingKey(){return 'ha-service-request-send:'+String(me?.id||'')}
function savePending(){if(!me)return;try{sessionStorage.setItem(pendingKey(),JSON.stringify({key:requestKey,payload:pendingPayload}))}catch(_e){}}
function lockPendingFields(){if(pendingPayload){formBox.querySelectorAll('input,select,textarea,#changeServiceBtn,.file-item button').forEach(x=>x.disabled=true)}}
function restorePending(){try{const p=JSON.parse(sessionStorage.getItem(pendingKey())||'null');if(p&&/^[0-9a-f-]{36}$/i.test(p.key)){requestKey=p.key;pendingPayload=p.payload||null;if(pendingPayload){showRequestStatus('قد يكون الطلب أُرسل قبل انقطاع الرد. اضغط إعادة المحاولة للتحقق؛ لن يتكرر الطلب.');submitBtn.textContent='إعادة المحاولة';lockPendingFields()}}}catch(_e){}}


const pageStatus=document.getElementById('pageStatus');
const serviceChooser=document.getElementById('serviceChooser');
const formBox=document.getElementById('formBox');
const serviceType=document.getElementById('serviceType');
const selectedTitle=document.getElementById('selectedTitle');
const phone=document.getElementById('phone');
const governorate=document.getElementById('governorate');
const address=document.getElementById('address');
const description=document.getElementById('description');
const attachments=document.getElementById('attachments');
const fileList=document.getElementById('fileList');
const locationBtn=document.getElementById('locationBtn');
const locationInfo=document.getElementById('locationInfo');
const submitBtn=document.getElementById('submitBtn');
const changeServiceBtn=document.getElementById('changeServiceBtn');

const requestedService=new URLSearchParams(location.search).get('service')||'';
const draftKey='ha-service-request-draft-v2';

function openRequestForm(name){
  if(!name)return;
  serviceType.value=name;
  selectedTitle.textContent='الخدمة المطلوبة: '+name;
  serviceChooser.classList.add('hidden');
  formBox.classList.remove('hidden');
}

function saveDraft(){
  try{
    sessionStorage.setItem(draftKey,JSON.stringify({
      service:serviceType.value,
      phone:phone.value.trim(),
      governorate:governorate.value,
      address:address.value.trim(),
      description:description.value.trim(),
      lat,lng
    }));
  }catch(_e){}
}

function restoreDraft(){
  try{
    const d=JSON.parse(sessionStorage.getItem(draftKey)||'null');
    if(!d)return;
    if(d.service)openRequestForm(d.service);
    if(d.phone)phone.value=d.phone;
    if(d.governorate)governorate.value=d.governorate;
    if(d.address)address.value=d.address;
    if(d.description)description.value=d.description;
    if(Number.isFinite(d.lat))lat=d.lat;
    if(Number.isFinite(d.lng))lng=d.lng;
    if(lat!==null&&lng!==null){
      locationInfo.textContent='✅ تم استرجاع الموقع المحدد.';
      locationInfo.className='status ok';
    }
  }catch(_e){}
}

function renderFiles(){
  fileList.innerHTML='';
  selectedFiles.forEach((f,i)=>{
    const row=document.createElement('div');
    row.className='file-item';
    const size=(f.size/1024/1024).toFixed(1);
    const label=document.createElement('span');label.dataset.noI18n='';label.textContent=`${HAServiceUpload.mime(f).startsWith('video/')?'🎥':'🖼️'} ${f.name} — ${size}MB`;
    const remove=document.createElement('button');remove.type='button';remove.textContent='حذف';remove.onclick=()=>{if(requestBusy||pendingPayload)return;selectedFiles.splice(i,1);renderFiles()};row.append(label,remove);
    fileList.appendChild(row);
  });
}

attachments.addEventListener('change',()=>{
  if(requestBusy||pendingPayload){attachments.value='';return}
  const incoming=[...attachments.files];
  for(const f of incoming){
    try{HAServiceUpload.validate(f);if(!selectedFiles.some(x=>x.name===f.name&&x.size===f.size&&x.lastModified===f.lastModified))selectedFiles.push(f)}catch(e){showRequestStatus(e.message,true)}
  }
  attachments.value='';
  renderFiles();
});

async function reverseGeocode(latitude,longitude){
  const url=`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(latitude)}&lon=${encodeURIComponent(longitude)}&accept-language=ar`;
  const res=await fetch(url,{headers:{Accept:'application/json'}});
  if(!res.ok)throw new Error('reverse geocoding failed');
  const data=await res.json();
  return data?.display_name||'';
}

locationBtn.onclick=()=>{
  if(!navigator.geolocation){
    alert('المتصفح لا يدعم تحديد الموقع');
    return;
  }

  locationInfo.textContent='جاري تحديد موقعك وعنوانك...';
  locationInfo.className='status';

  navigator.geolocation.getCurrentPosition(async p=>{
    lat=p.coords.latitude;
    lng=p.coords.longitude;

    try{
      const a=await reverseGeocode(lat,lng);
      if(a)address.value=a;
      locationInfo.textContent='✅ تم تحديد الموقع والعنوان تلقائياً.';
      locationInfo.className='status ok';
    }catch(_e){
      locationInfo.textContent='✅ تم تحديد موقعك، اكتب العنوان إذا لم يظهر تلقائياً.';
      locationInfo.className='status ok';
    }
  },()=>{
    locationInfo.textContent='❌ تعذر تحديد الموقع. اسمح بإذن الموقع أو اكتب العنوان يدوياً.';
    locationInfo.className='status error';
  },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
};

async function init(){
  const {data}=await db.auth.getUser();
  me=data?.user||null;

  if(requestedService)openRequestForm(requestedService);
  else serviceChooser.classList.remove('hidden');

  restoreDraft();

  if(!me||me.is_anonymous){
    pageStatus.textContent='املأ معلومات الطلب مباشرة. تسجيل الدخول يُطلب فقط عند الإرسال إذا لم تكن مسجلاً.';
    pageStatus.className='status';
    return;
  }

  const {data:p}=await db.from('profiles')
    .select('account_type,phone,governorate')
    .eq('id',me.id)
    .maybeSingle();

  if(p?.phone&&!phone.value)phone.value=p.phone;
  if(p?.governorate&&!governorate.value)governorate.value=p.governorate;

  restorePending();
  pageStatus.textContent='الحساب جاهز لإرسال الطلب.';
  pageStatus.className='status ok';
}

document.querySelectorAll('.service-card').forEach(btn=>{
  btn.addEventListener('click',()=>{
    openRequestForm(btn.dataset.service);
    window.scrollTo({top:0,behavior:'smooth'});
  });
});

changeServiceBtn.onclick=()=>{
  formBox.classList.add('hidden');
  serviceChooser.classList.remove('hidden');
  serviceType.value='';
  selectedTitle.textContent='';
  window.scrollTo({top:0,behavior:'smooth'});
};

async function uploadFiles(){
 const urls=[];
 for(let i=0;i<selectedFiles.length;i++){
  const f=selectedFiles[i];requestProgress(i+1,selectedFiles.length);
  const url=await HAServiceUpload.upload(db,uploadConfig,me.id,requestKey,f,i,percent=>requestProgress(i+1,selectedFiles.length,percent),()=>showRequestStatus('انقطع اتصال الرفع. جاري إعادة المحاولة...'));
  urls.push(url);
 }
 return urls;
}
function setRequestBusy(busy){requestBusy=busy;formBox.querySelectorAll('input,select,textarea,button').forEach(x=>x.disabled=busy)}

async function sendRequest(withoutAttachments=false){
 if(requestBusy)return;
 const st=serviceType.value.trim(),ph=phone.value.trim().replace(/[٠-٩۰-۹]/g,c=>String(c.charCodeAt(0)>1775?c.charCodeAt(0)-1776:c.charCodeAt(0)-1632)),gov=governorate.value.trim(),addr=address.value.trim(),desc=description.value.trim();
 if(!pendingPayload&&(!st||!ph||!gov||!addr||!desc)){showRequestStatus('أكمل رقم الموبايل والمحافظة والعنوان وشرح الخدمة',true);return}
 if(!pendingPayload&&!/^07\d{9}$/.test(ph)){showRequestStatus('رقم الهاتف يجب أن يبدأ بـ 07 ويتكون من 11 رقم',true);return}
 if(!me||me.is_anonymous){saveDraft();location.href='login.html?next='+encodeURIComponent('contact.html?service='+st);return}
 saveDraft();setRequestBusy(true);skipAttachmentsBtn.hidden=true;showRequestStatus('جاري تجهيز الطلب...');submitBtn.textContent='جاري إرسال الطلب...';let stage=pendingPayload?'submit':'upload',success=false;
 try{
  if(!pendingPayload){
   const urls=withoutAttachments?[]:await uploadFiles();
   pendingPayload={customer_id:me.id,order_type:st,description:desc,phone:ph,governorate:gov,address:addr,customer_lat:lat,customer_lng:lng,attachment_urls:urls};
   savePending();
  }
  stage='submit';submitBtn.textContent='جاري إرسال الطلب...';showRequestStatus('جاري إرسال الطلب...');
  const result=await HAServiceUpload.submit(db,uploadConfig,me.id,requestKey,pendingPayload,()=>showRequestStatus('جاري إعادة الاتصال والتحقق من إرسال الطلب...'));
  success=true;sessionStorage.removeItem(draftKey);sessionStorage.removeItem(pendingKey());showRequestStatus('تم إرسال الطلب بنجاح.');submitBtn.textContent='تم إرسال الطلب';
  alert(requestDialogText('تم إرسال الطلب بنجاح.')+' #'+result.id);location.href='service-orders.html?source=orders';
 }catch(e){
  if(stage==='submit'&&e.status>=400&&e.status<500&&![408,429].includes(e.status)){pendingPayload=null;savePending()}
  showRequestStatus(HAServiceUpload.message(e,stage),true);skipAttachmentsBtn.hidden=stage!=='upload'||selectedFiles.length===0||e.status===401;submitBtn.textContent='إعادة المحاولة';saveDraft();
 }finally{setRequestBusy(false);if(!success)lockPendingFields();if(success)submitBtn.disabled=true}
}
submitBtn.onclick=()=>sendRequest(false);
skipAttachmentsBtn.onclick=()=>{if(requestBusy||pendingPayload)return;if(confirm(requestDialogText('الصور والفيديوهات لن تُرسل مع الطلب. هل تريد إرسال الطلب بدون مرفقات؟')))sendRequest(true)};
[phone,governorate,address,description].forEach(el=>el.addEventListener('input',saveDraft));

init();
</script><script src="ha-lux-icons.js?v=20260930-1" defer></script></body></html>
