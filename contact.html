<!doctype html><html lang="ar" dir="rtl"><head><script id="ha-modern-boot">document.documentElement.setAttribute('data-ha-modern','1');document.documentElement.setAttribute('data-ha-theme','light');document.documentElement.style.colorScheme='light';</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلب خدمة - HA Marketing</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f5f5f5;color:#111}.wrap{width:94%;max-width:900px;margin:24px auto}.card{background:white;border-radius:18px;padding:20px;box-shadow:0 4px 18px #0001}h1{text-align:center}.service-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:16px}.service-card{border:0;background:#fff;border-radius:16px;padding:18px 10px;box-shadow:0 4px 16px #0001;cursor:pointer;text-align:center;color:#111;transition:.15s}.service-card:active{transform:scale(.98)}.service-card .ico{font-size:43px;display:block;margin-bottom:7px}.service-card .name{font-size:18px;font-weight:700}.selected-title{background:#f4f4f4;border-radius:12px;padding:12px;text-align:center;font-weight:700;margin-bottom:8px}label{display:block;font-weight:bold;margin:13px 0 6px}input,select,textarea,button,a.btn{width:100%;padding:13px;border-radius:10px;font-size:16px}input,select,textarea{border:1px solid #ccc;background:#fff}textarea{min-height:150px;resize:vertical}button{border:0;cursor:pointer;margin-top:12px}.primary{background:#111;color:#fff}.light{background:#eee;color:#111}.status{padding:12px;border-radius:10px;background:#f4f4f4;margin:12px 0;line-height:1.8}.ok{background:#e4f7e9}.error{background:#fde7e7}.btn{display:block;text-align:center;text-decoration:none;margin-top:10px}.small{font-size:13px;color:#666}.hidden{display:none}@media(max-width:650px){.service-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.service-card{padding:15px 7px}.service-card .ico{font-size:38px}.service-card .name{font-size:16px}}</style><link rel="stylesheet" href="ha-premium-theme.css"><script src="ha-theme.js"></script>
<link rel="stylesheet" href="ha-theme.css">
<link rel="stylesheet" href="ha-modern-blue.css?v=20260926-1"><script src="ha-modern-blue.js?v=20260926-1" defer></script><link rel="stylesheet" href="ha-lux-icons.css?v=20260930-1">
<style id="ha-service-customer-request-upgrade">
.req-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.req-grid .full{grid-column:1/-1}
.location-actions{display:grid;grid-template-columns:1fr;gap:8px}
.file-list{display:grid;gap:8px;margin-top:10px}
.file-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#f6f8fa;border:1px solid #e4e8ec;border-radius:10px;padding:9px 10px;font-size:13px}
.file-item button{width:auto;margin:0;padding:6px 9px;border-radius:8px;background:#ffe9ec;color:#a61f37}
.hint{font-size:12px;color:#68727c;line-height:1.6;margin-top:6px}
@media(max-width:650px){.req-grid{grid-template-columns:1fr}}
</style>
</head><body><div class="wrap"><div class="card"><h1>🛠️ تقديم طلب خدمة</h1><div id="pageStatus" class="status">جاري التحقق من الحساب...</div>
<div id="serviceChooser" class="hidden"><div style="text-align:center;line-height:1.8;color:#555">اختر نوع الخدمة المطلوبة</div><div class="service-grid"><button class="service-card" type="button" data-service="صيانة طابعات"><span class="ico">🖨️</span><span class="name">صيانة طابعات</span></button><button class="service-card" type="button" data-service="صيانة موبايلات"><span class="ico">📱</span><span class="name">صيانة موبايلات</span></button><button class="service-card" type="button" data-service="حلاق"><span class="ico">💈</span><span class="name">حلاق</span></button>
<button class="service-card" type="button" data-service="حداد"><span class="ico">🔩</span><span class="name">حداد</span></button>
<button class="service-card" type="button" data-service="بناء"><span class="ico">🧱</span><span class="name">بناء</span></button>
<button class="service-card" type="button" data-service="لباخ"><span class="ico">🏠</span><span class="name">لباخ</span></button>
<button class="service-card" type="button" data-service="نجار"><span class="ico">🪚</span><span class="name">نجار</span></button>
<button class="service-card" type="button" data-service="سلك مجاري"><span class="ico">🚿</span><span class="name">سلك مجاري</span></button>
<button class="service-card" type="button" data-service="سباك"><span class="ico">🔧</span><span class="name">سباك</span></button>
<button class="service-card" type="button" data-service="كهربائي"><span class="ico">⚡</span><span class="name">كهربائي</span></button>
<button class="service-card" type="button" data-service="تبريد وتكييف"><span class="ico">❄️</span><span class="name">تبريد وتكييف</span></button>
<button class="service-card" type="button" data-service="صباغ"><span class="ico">🎨</span><span class="name">صباغ</span></button>
<button class="service-card" type="button" data-service="بلاط وسيراميك"><span class="ico">⬜</span><span class="name">بلاط وسيراميك</span></button>
<button class="service-card" type="button" data-service="ألمنيوم وزجاج"><span class="ico">🪟</span><span class="name">ألمنيوم وزجاج</span></button>
<button class="service-card" type="button" data-service="صيانة أجهزة"><span class="ico">🧰</span><span class="name">صيانة أجهزة</span></button>
<button class="service-card" type="button" data-service="نقل وتركيب"><span class="ico">🚚</span><span class="name">نقل وتركيب</span></button>
<button class="service-card" type="button" data-service="تنظيف"><span class="ico">🧹</span><span class="name">تنظيف</span></button>
<button class="service-card" type="button" data-service="صيانة منزلية"><span class="ico">🛠️</span><span class="name">صيانة منزلية</span></button>
<button class="service-card" type="button" data-service="خدمة أخرى"><span class="ico">➕</span><span class="name">خدمة أخرى</span></button>
</div></div>
<div id="formBox" class="hidden">
<div id="selectedTitle" class="selected-title"></div>
<button id="changeServiceBtn" class="light" type="button">↩ تغيير نوع الخدمة</button>
<input id="serviceType" type="hidden">

<div class="req-grid">
  <div>
    <label>رقم الموبايل *</label>
    <input id="phone" type="tel" inputmode="tel" placeholder="07XXXXXXXXX">
  </div>

  <div>
    <label>المحافظة *</label>
    <select id="governorate">
      <option value="">اختر المحافظة</option>
      <option>بغداد</option><option>البصرة</option><option>نينوى</option><option>أربيل</option>
      <option>النجف</option><option>كربلاء</option><option>ذي قار</option><option>الأنبار</option>
      <option>ديالى</option><option>كركوك</option><option>صلاح الدين</option><option>واسط</option>
      <option>ميسان</option><option>المثنى</option><option>القادسية</option><option>بابل</option>
      <option>دهوك</option><option>السليمانية</option><option>حلبجة</option>
    </select>
  </div>

  <div class="full">
    <label>العنوان *</label>
    <input id="address" placeholder="اكتب المنطقة / الحي / الشارع، أو استخدم مسمار الموقع">
    <button id="locationBtn" class="light" type="button">📍 تحديد العنوان تلقائياً من موقعي</button>
    <div id="locationInfo" class="status">تگدر تكتب العنوان بنفسك أو تضغط على مسمار الموقع.</div>
  </div>

  <div class="full">
    <label>صور أو فيديوهات للمشكلة (اختياري)</label>
    <input id="attachments" type="file" multiple accept="image/*,video/*">
    <div class="hint">تگدر تختار أكثر من صورة أو فيديو. الحد الأعلى لكل ملف 20MB.</div>
    <div id="fileList" class="file-list"></div>
  </div>

  <div class="full">
    <label>شرح الخدمة المطلوبة *</label>
    <textarea id="description" placeholder="اشرح المشكلة أو الخدمة التي تحتاجها بالتفصيل"></textarea>
  </div>
</div>

<button id="submitBtn" class="primary" type="button">إرسال الطلب</button>
</div><a class="btn light" href="account.html">طلباتي</a><a class="btn light" href="index.html">← الرئيسية</a></div></div><script>
const db=supabase.createClient(
  'https://ubayrhtshgtgggxprrek.supabase.co',
  'sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',
  {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}}
);

let me=null,lat=null,lng=null;
let selectedFiles=[];

const pageStatus=document.getElementById('pageStatus');
const serviceChooser=document.getElementById('serviceChooser');
const formBox=document.getElementById('formBox');
const serviceType=document.getElementById('serviceType');
const selectedTitle=document.getElementById('selectedTitle');
const phone=document.getElementById('phone');
const governorate=document.getElementById('governorate');
const address=document.getElementById('address');
const description=document.getElementById('description');
const attachments=document.getElementById('attachments');
const fileList=document.getElementById('fileList');
const locationBtn=document.getElementById('locationBtn');
const locationInfo=document.getElementById('locationInfo');
const submitBtn=document.getElementById('submitBtn');
const changeServiceBtn=document.getElementById('changeServiceBtn');

const requestedService=new URLSearchParams(location.search).get('service')||'';
const draftKey='ha-service-request-draft-v2';

function openRequestForm(name){
  if(!name)return;
  serviceType.value=name;
  selectedTitle.textContent='الخدمة المطلوبة: '+name;
  serviceChooser.classList.add('hidden');
  formBox.classList.remove('hidden');
}

function saveDraft(){
  try{
    sessionStorage.setItem(draftKey,JSON.stringify({
      service:serviceType.value,
      phone:phone.value.trim(),
      governorate:governorate.value,
      address:address.value.trim(),
      description:description.value.trim(),
      lat,lng
    }));
  }catch(_e){}
}

function restoreDraft(){
  try{
    const d=JSON.parse(sessionStorage.getItem(draftKey)||'null');
    if(!d)return;
    if(d.service)openRequestForm(d.service);
    if(d.phone)phone.value=d.phone;
    if(d.governorate)governorate.value=d.governorate;
    if(d.address)address.value=d.address;
    if(d.description)description.value=d.description;
    if(Number.isFinite(d.lat))lat=d.lat;
    if(Number.isFinite(d.lng))lng=d.lng;
    if(lat!==null&&lng!==null){
      locationInfo.textContent='✅ تم استرجاع الموقع المحدد.';
      locationInfo.className='status ok';
    }
  }catch(_e){}
}

function renderFiles(){
  fileList.innerHTML='';
  selectedFiles.forEach((f,i)=>{
    const row=document.createElement('div');
    row.className='file-item';
    const size=(f.size/1024/1024).toFixed(1);
    row.innerHTML=`<span>${f.type.startsWith('video/')?'🎥':'🖼️'} ${f.name} — ${size}MB</span><button type="button">حذف</button>`;
    row.querySelector('button').onclick=()=>{
      selectedFiles.splice(i,1);
      renderFiles();
    };
    fileList.appendChild(row);
  });
}

attachments.addEventListener('change',()=>{
  const incoming=[...attachments.files];
  for(const f of incoming){
    if(f.size>20*1024*1024){
      alert('الملف '+f.name+' أكبر من 20MB وتم تجاهله');
      continue;
    }
    if(!(f.type.startsWith('image/')||f.type.startsWith('video/'))){
      alert('الملف '+f.name+' ليس صورة أو فيديو وتم تجاهله');
      continue;
    }
    selectedFiles.push(f);
  }
  attachments.value='';
  renderFiles();
});

async function reverseGeocode(latitude,longitude){
  const url=`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(latitude)}&lon=${encodeURIComponent(longitude)}&accept-language=ar`;
  const res=await fetch(url,{headers:{Accept:'application/json'}});
  if(!res.ok)throw new Error('reverse geocoding failed');
  const data=await res.json();
  return data?.display_name||'';
}

locationBtn.onclick=()=>{
  if(!navigator.geolocation){
    alert('المتصفح لا يدعم تحديد الموقع');
    return;
  }

  locationInfo.textContent='جاري تحديد موقعك وعنوانك...';
  locationInfo.className='status';

  navigator.geolocation.getCurrentPosition(async p=>{
    lat=p.coords.latitude;
    lng=p.coords.longitude;

    try{
      const a=await reverseGeocode(lat,lng);
      if(a)address.value=a;
      locationInfo.textContent='✅ تم تحديد الموقع والعنوان تلقائياً.';
      locationInfo.className='status ok';
    }catch(_e){
      locationInfo.textContent='✅ تم تحديد موقعك، اكتب العنوان إذا لم يظهر تلقائياً.';
      locationInfo.className='status ok';
    }
  },()=>{
    locationInfo.textContent='❌ تعذر تحديد الموقع. اسمح بإذن الموقع أو اكتب العنوان يدوياً.';
    locationInfo.className='status error';
  },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
};

async function init(){
  const {data}=await db.auth.getUser();
  me=data?.user||null;

  if(requestedService)openRequestForm(requestedService);
  else serviceChooser.classList.remove('hidden');

  restoreDraft();

  if(!me||me.is_anonymous){
    pageStatus.textContent='املأ معلومات الطلب مباشرة. تسجيل الدخول يُطلب فقط عند الإرسال إذا لم تكن مسجلاً.';
    pageStatus.className='status';
    return;
  }

  const {data:p}=await db.from('profiles')
    .select('account_type,phone,governorate')
    .eq('id',me.id)
    .maybeSingle();

  if(p?.phone&&!phone.value)phone.value=p.phone;
  if(p?.governorate&&!governorate.value)governorate.value=p.governorate;

  pageStatus.textContent='الحساب جاهز لإرسال الطلب.';
  pageStatus.className='status ok';
}

document.querySelectorAll('.service-card').forEach(btn=>{
  btn.addEventListener('click',()=>{
    openRequestForm(btn.dataset.service);
    window.scrollTo({top:0,behavior:'smooth'});
  });
});

changeServiceBtn.onclick=()=>{
  formBox.classList.add('hidden');
  serviceChooser.classList.remove('hidden');
  serviceType.value='';
  selectedTitle.textContent='';
  window.scrollTo({top:0,behavior:'smooth'});
};

async function uploadFiles(){
  const urls=[];
  for(let i=0;i<selectedFiles.length;i++){
    const f=selectedFiles[i];
    submitBtn.textContent=`جاري رفع المرفق ${i+1} من ${selectedFiles.length}...`;
    const ext=(f.name.split('.').pop()||'bin').toLowerCase();
    const path=`${me.id}/${Date.now()}-${i}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    const {error}=await db.storage.from('service-attachments').upload(path,f,{
      upsert:false,
      contentType:f.type||undefined
    });
    if(error)throw error;
    const {data}=db.storage.from('service-attachments').getPublicUrl(path);
    if(data?.publicUrl)urls.push(data.publicUrl);
  }
  return urls;
}

submitBtn.onclick=async()=>{
  const st=serviceType.value.trim();
  const ph=phone.value.trim();
  const gov=governorate.value.trim();
  const addr=address.value.trim();
  const desc=description.value.trim();

  if(!st||!ph||!gov||!addr||!desc){
    alert('أكمل رقم الموبايل والمحافظة والعنوان وشرح الخدمة');
    return;
  }

  if(!/^07\d{9}$/.test(ph)){
    alert('رقم الهاتف يجب أن يبدأ بـ 07 ويتكون من 11 رقم');
    return;
  }

  if(!me||me.is_anonymous){
    saveDraft();
    alert('راح تنتقل لتسجيل الدخول، وبعدها ترجع لنفس الطلب. إذا اخترت صور أو فيديوهات أعد اختيارها بعد الرجوع.');
    const next='contact.html?service='+encodeURIComponent(st);
    location.href='login.html?next='+encodeURIComponent(next);
    return;
  }

  submitBtn.disabled=true;
  submitBtn.textContent='جاري إرسال الطلب...';

  try{
    const urls=await uploadFiles();

    const payload={
      customer_id:me.id,
      department:'services',
      order_type:st,
      description:desc,
      phone:ph,
      governorate:gov,
      address:addr,
      area:addr,
      customer_lat:lat,
      customer_lng:lng,
      attachment_url:urls[0]||null,
      attachment_urls:urls,
      status:'new'
    };

    const {data:o,error}=await db.from('orders')
      .insert(payload)
      .select('id')
      .single();

    if(error)throw error;

    sessionStorage.removeItem(draftKey);
    alert('تم إرسال الطلب رقم #'+o.id+' بنجاح');
    location.href='service-orders.html';
  }catch(error){
    alert('تعذر إرسال الطلب: '+(error?.message||error));
    submitBtn.disabled=false;
    submitBtn.textContent='إرسال الطلب';
  }
};

init();
</script><script src="ha-lux-icons.js?v=20260930-1" defer></script></body></html>
