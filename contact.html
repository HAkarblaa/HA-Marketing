<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلب خدمة - HA Marketing</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f5f5f5;color:#111}.wrap{width:94%;max-width:760px;margin:28px auto}.card{background:white;border-radius:18px;padding:20px;box-shadow:0 4px 18px #0001}h1{text-align:center}label{display:block;font-weight:bold;margin:13px 0 6px}input,select,textarea,button,a.btn{width:100%;padding:13px;border-radius:10px;font-size:16px}input,select,textarea{border:1px solid #ccc;background:#fff}textarea{min-height:150px;resize:vertical}button{border:0;cursor:pointer;margin-top:12px}.primary{background:#111;color:#fff}.light{background:#eee;color:#111}.status{padding:12px;border-radius:10px;background:#f4f4f4;margin:12px 0;line-height:1.8}.ok{background:#e4f7e9}.error{background:#fde7e7}.btn{display:block;text-align:center;text-decoration:none;margin-top:10px}.small{font-size:13px;color:#666}.hidden{display:none}</style></head><body><div class="wrap"><div class="card"><h1>🛠️ طلب خدمة</h1><div id="pageStatus" class="status">جاري التحقق من الحساب...</div><div id="formBox" class="hidden"><label>نوع الخدمة *</label><select id="serviceType"><option value="">اختر الخدمة</option><option>صيانة منزلية</option><option>كهرباء</option><option>سباكة</option><option>تبريد وتكييف</option><option>صيانة أجهزة</option><option>نقل وتركيب</option><option>تنظيف</option><option>خدمة أخرى</option></select><label>رقم الهاتف *</label><input id="phone" type="tel"><label>المنطقة / العنوان *</label><input id="area" placeholder="مثال: كربلاء - حي الحسين"><label>تفاصيل الطلب *</label><textarea id="description" placeholder="اشرح الخدمة المطلوبة بالتفصيل"></textarea><label>صورة أو فيديو (اختياري)</label><input id="attachment" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm"><div class="small">الحد الأقصى 20MB.</div><button id="locationBtn" class="light" type="button">📍 تحديد موقعي الحقيقي</button><div id="locationInfo" class="status">لم يتم تحديد الموقع بعد.</div><button id="submitBtn" class="primary" type="button">إرسال الطلب</button></div><a class="btn light" href="account.html">طلباتي</a><a class="btn light" href="index.html">← الرئيسية</a></div></div><script>
const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll');let me=null,lat=null,lng=null;
async function init(){const {data}=await db.auth.getUser();me=data?.user||null;if(!me||me.is_anonymous){pageStatus.innerHTML='طلب الخدمة يحتاج حساب عميل حقيقي.<br><a href="login.html">تسجيل الدخول</a>';return}const {data:p}=await db.from('profiles').select('account_type,phone').eq('id',me.id).maybeSingle();if(!p||p.account_type!=='customer'){pageStatus.textContent='طلب الخدمة متاح لحساب العميل فقط.';return}phone.value=p.phone||'';pageStatus.textContent='الحساب جاهز لإرسال طلب حقيقي.';pageStatus.className='status ok';formBox.classList.remove('hidden')}
locationBtn.onclick=()=>{if(!navigator.geolocation){alert('المتصفح لا يدعم GPS');return}locationInfo.textContent='جاري تحديد الموقع...';navigator.geolocation.getCurrentPosition(p=>{lat=p.coords.latitude;lng=p.coords.longitude;locationInfo.textContent='✅ تم تحديد موقعك بدقة تقريبية '+Math.round(p.coords.accuracy)+' متر';locationInfo.className='status ok'},e=>{locationInfo.textContent='❌ تعذر تحديد الموقع. اسمح بإذن الموقع وحاول مرة ثانية.';locationInfo.className='status error'},{enableHighAccuracy:true,timeout:15000,maximumAge:0})};
submitBtn.onclick=async()=>{const st=serviceType.value,ph=phone.value.trim(),ar=area.value.trim(),desc=description.value.trim();if(!st||!ph||!ar||!desc){alert('أكمل الحقول المطلوبة');return}if(lat===null||lng===null){alert('حدد موقعك الحقيقي قبل إرسال الطلب');return}const f=attachment.files[0];if(f&&f.size>20*1024*1024){alert('الملف أكبر من 20MB');return}submitBtn.disabled=true;submitBtn.textContent='جاري إرسال الطلب...';let url=null;if(f){const ext=(f.name.split('.').pop()||'bin').toLowerCase();const path=me.id+'/'+Date.now()+'.'+ext;const {error:uerr}=await db.storage.from('service-attachments').upload(path,f,{upsert:false});if(uerr){alert('تعذر رفع الملف: '+uerr.message);submitBtn.disabled=false;submitBtn.textContent='إرسال الطلب';return}url=db.storage.from('service-attachments').getPublicUrl(path).data.publicUrl}const {data:o,error}=await db.from('orders').insert({customer_id:me.id,department:'services',order_type:st,description:desc,phone:ph,area:ar,customer_lat:lat,customer_lng:lng,attachment_url:url,status:'new'}).select('id').single();if(error){alert('تعذر إرسال الطلب: '+error.message);submitBtn.disabled=false;submitBtn.textContent='إرسال الطلب';return}alert('تم إرسال الطلب رقم #'+o.id+' بنجاح');location.href='account.html'};init();
</script></body></html>
