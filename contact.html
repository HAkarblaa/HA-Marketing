<style>
body{
    font-family:Arial;
    direction:rtl;
    margin:0;
    background:#fff;
}

.service-form{
    width:100%;
    max-width:900px;
    margin:40px auto;
}

.service-form h1{
    text-align:center;
    font-size:40px;
    margin-bottom:30px;
}

.service-form input,
.service-form textarea,
.service-form button{
    width:100%;
    box-sizing:border-box;
    padding:20px;
    margin:15px 0;
    font-size:20px;
    border:1px solid #ccc;
    border-radius:10px;
}

.service-form textarea{
    height:220px;
    resize:vertical;
}

.service-form button{
    background:#000;
    color:#fff;
    border:none;
    cursor:pointer;
    font-size:22px;
    font-weight:bold;
}

.contact-section{
    width:100%;
    max-width:900px;
    margin:35px auto 20px;
    padding:0 15px;
    box-sizing:border-box;
}
.contact-section h2{
    text-align:center;
    font-size:30px;
    margin-bottom:20px;
}
.contact-number{
    background:#f5f5f5;
    border:1px solid #ddd;
    border-radius:12px;
    padding:18px;
    margin:14px 0;
    text-align:center;
}
.contact-number .number{
    font-size:22px;
    font-weight:bold;
    direction:ltr;
    margin-bottom:14px;
}
.contact-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}
.contact-actions a{
    display:block;
    padding:13px 8px;
    border-radius:9px;
    text-decoration:none;
    font-size:18px;
    font-weight:bold;
}
.call-btn{
    background:#000;
    color:#fff;
}
.whatsapp-btn{
    background:#25D366;
    color:#fff;
}
