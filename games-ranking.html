<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التصنيف - ألعاب HA Marketing</title><link rel="stylesheet" href="assets/ha-games-style.css"></head><body><div class="page"><div class="topbar"><div class="brand"><div class="logo">🏆</div><div><h1>التصنيف العام</h1><p>ترتيب شامل وترتيب منفصل لكل لعبة</p></div></div><div class="row"><a class="btn secondary" href="games-hub.html">↩ العودة للألعاب</a></div></div>
<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">اختيار التصنيف</h2><select id="gameSelect" style="max-width:300px"><option value="all">التصنيف العام</option><option value="car-dodge">🚗 تفادي العوائق</option><option value="bird-game">🐦 الطائر</option><option value="brick-breaker">🧱 تكسير الطابوق</option><option value="jumper">🏃 لعبة القفز</option><option value="coin-runner">🪙 جمع العملات</option></select></div><div class="small" style="margin-top:8px">الترتيب حسب مجموع النقاط أولاً، ثم أفضل نتيجة، ثم عدد مرات اللعب.</div></div>
<div class="card" style="margin-top:16px"><table class="table"><thead><tr><th>#</th><th>الاسم</th><th>المعرف</th><th>مجموع النقاط</th><th>أفضل نتيجة</th><th>مرات اللعب</th><th>الفوز</th></tr></thead><tbody id="tableBody"></tbody></table></div>
<div class="grid" style="margin-top:16px"><div class="card"><h3>آخر النتائج</h3><div id="recentBox" class="list"></div></div><div class="card"><h3>ملخص الألعاب</h3><div id="summaryBox" class="list"></div></div></div><footer>HA Marketing Games Leaderboard</footer></div>
<script src="assets/ha-games-common.js"></script><script>
function draw(){const key=document.getElementById('gameSelect').value;const list=HAGames.getLeaderboard(key);const tb=document.getElementById('tableBody');tb.innerHTML=list.length?list.map((p,i)=>`<tr><td>${i+1}</td><td>${p.name}</td><td>@${p.username}</td><td>${p.totalScore||0}</td><td>${p.bestScore||0}</td><td>${p.playCount||0}</td><td>${p.wins||0}</td></tr>`).join(''):'<tr><td colspan="7">لا توجد نتائج حالياً</td></tr>';}document.getElementById('gameSelect').addEventListener('change',draw);draw();
const data=JSON.parse(localStorage.getItem('ha_games_records_v1')||'{"games":{},"history":[]}');document.getElementById('recentBox').innerHTML=(data.history||[]).slice(0,10).map(x=>`<div class="list-item"><div>${x.name} <span class="small">@${x.username}</span><div class="small">${x.gameTitle}</div></div><div>${x.score} نقطة</div></div>`).join('')||'<div class="notice">لا توجد نتائج بعد.</div>';document.getElementById('summaryBox').innerHTML=HAGames.getGameSummaries().map(g=>`<div class="list-item"><div>${g.title}</div><div>${g.count} لاعب</div></div>`).join('')||'<div class="notice">لا توجد بيانات ألعاب بعد.</div>';
</script></body></html>
