</head><body><main class="wrap"><div class="top"><a class="back" href="entertainment.html">‹ رجوع</a><div class="head"><h1>🏆 تصنيف الألعاب</h1><p>التصنيف الحقيقي من Supabase عند توفر الإنترنت، ومحلياً كخيار احتياطي</p></div><div style="width:70px"></div></div><div id="tabs" class="tabs"></div><section class="summary"><div class="sum"><b id="players">0</b><small>اللاعبون</small></div><div class="sum"><b id="points">0</b><small>مجموع النقاط</small></div><div class="sum"><b id="plays">0</b><small>مرات اللعب</small></div></section><section class="card"><div class="row head"><div>#</div><div>اللاعب</div><div>النقاط</div><div>أفضل</div><div class="wins">مرات اللعب</div></div><div id="list"></div></section><button id="refresh" class="refresh">↻ تحديث</button></main><script>
const GAMES={all:'🌐 الكل','car-dodge':'🚗 تفادي العوائق','bird-game':'🐦 الطائر','brick-breaker':'🧱 تكسير الطابوق','jumper':'🏃 القفز','coin-runner':'🪙 جمع العملات'};let current='all';
const SB_URL='https://ubayrhtshgtgggxprrek.supabase.co',SB_KEY='sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll';let db=null;try{if(window.supabase)db=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}})}catch(e){}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function fmt(n){return Number(n||0).toLocaleString('ar-IQ')}
function localRows(){let raw=null;try{raw=localStorage.getItem('ha_games_records_v2')}catch(e){};let d={games:{}};try{d=JSON.parse(raw)||d}catch(e){};const map={};for(const [k,g] of Object.entries(d.games||{})){if(current!=='all'&&k!==current)continue;for(const p of Object.values(g.players||{})){const id=p.userId||p.username||Math.random();map[id]??={name:p.name,username:p.username,total_score:0,best_score:0,play_count:0,wins:0};const m=map[id];m.total_score+=Number(p.totalScore||0);m.best_score=Math.max(m.best_score,Number(p.bestScore||0));m.play_count+=Number(p.playCount||0);m.wins+=Number(p.wins||0)}}return Object.values(map).sort((a,b)=>b.total_score-a.total_score||b.best_score-a.best_score)}
async function rows(){if(db){try{let q=db.from('ha_game_scores').select('user_id,display_name,username,game_key,total_score,best_score,play_count,wins');if(current!=='all')q=q.eq('game_key',current);const r=await q.order('total_score',{ascending:false});if(!r.error&&r.data){if(current!=='all')return r.data.map(x=>({name:x.display_name,username:x.username,total_score:x.total_score,best_score:x.best_score,play_count:x.play_count,wins:x.wins}));const map={};for(const x of r.data){map[x.user_id]??={name:x.display_name,username:x.username,total_score:0,best_score:0,play_count:0,wins:0};const m=map[x.user_id];m.total_score+=Number(x.total_score||0);m.best_score=Math.max(m.best_score,Number(x.best_score||0));m.play_count+=Number(x.play_count||0);m.wins+=Number(x.wins||0)}return Object.values(map).sort((a,b)=>b.total_score-a.total_score||b.best_score-a.best_score)}}catch(e){}}return localRows()}
function buildTabs(){tabs.innerHTML=Object.entries(GAMES).map(([k,v])=>`<button class="tab ${k===current?'active':''}" data-k="${k}">${v}</button>`).join('');tabs.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{current=b.dataset.k;buildTabs();load()})}
async function load(){list.innerHTML='<div class="empty">جاري التحميل...</div>';const r=await rows();players.textContent=fmt(r.length);points.textContent=fmt(r.reduce((s,x)=>s+Number(x.total_score||0),0));plays.textContent=fmt(r.reduce((s,x)=>s+Number(x.play_count||0),0));list.innerHTML=r.length?r.map((x,i)=>`<div class="row"><div class="rank">${i<3?['🥇','🥈','🥉'][i]:i+1}</div><div class="player"><b>${esc(x.name||'مستخدم')}</b><small>@${esc(x.username||'user')}</small></div><div class="cell"><b>${fmt(x.total_score)}</b></div><div class="cell"><b>${fmt(x.best_score)}</b></div><div class="cell wins"><b>${fmt(x.play_count)}</b></div></div>`).join(''):'<div class="empty">لا توجد نتائج بعد.</div>'}
refresh.onclick=load;buildTabs();load();
</script></body></html>
