<meta name="viewport" content="width=device-width,initial-scale=1"><title>اقتراح دراسي - HA Marketing</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#eef4f8;color:#15304b}.wrap{width:min(720px,94%);margin:24px auto 90px}.top{display:flex;justify-content:space-between}.top a{background:#fff;padding:10px 14px;border-radius:13px;color:#087f61;text-decoration:none}.hero{margin:15px 0;background:linear-gradient(135deg,#8b59e7,#268ee8);color:#fff;border-radius:24px;padding:22px}.card{background:#fff;border-radius:20px;padding:18px;box-shadow:0 10px 28px #15304b0d}label{display:block;font-weight:900;font-size:12px;margin:12px 0 6px}input,textarea{width:100%;border:1px solid #d8e1e5;border-radius:12px;padding:12px;font:inherit}textarea{min-height:135px}button{width:100%;border:0;border-radius:14px;padding:14px;margin-top:14px;background:#087f61;color:#fff;font-weight:900;font:inherit}.status{margin-top:12px;padding:11px;border-radius:12px;background:#f2f5f6;color:#63727b}</style></head><body>
<div class="wrap"><div class="top"><a href="javascript:history.back()">← رجوع</a><a href="study.html">الدراسة</a></div><div class="hero"><h1>💡 اقتراح للطالب والمدرس</h1><p>تگدر تدز كتابة أو ملف أو صورة أو تسجيل صوتي للأدمن الرئيسي.</p></div>
<div class="card"><label>عنوان الاقتراح *</label><input id="title" placeholder="مثال: إضافة ملزمة أو تصحيح معلومة"><label>التفاصيل *</label><textarea id="details" placeholder="اكتب اقتراحك أو ملاحظتك"></textarea><label>ملف / صورة / صوت (اختياري)</label><input id="file" type="file" accept="image/*,audio/*,.pdf,.doc,.docx,.txt"><button id="send">إرسال للأدمن الرئيسي</button><div id="status" class="status">الاقتراح يوصل مباشرة للأدمن الرئيسي.</div></div></div>
<script>
const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});
const q=new URLSearchParams(location.search),stage=q.get('stage')||'',grade=q.get('grade')||'',branch=q.get('branch')||'';let me=null;
(async()=>{const {data:{session}}=await db.auth.getSession();if(!session){location.href='login.html?next='+encodeURIComponent(location.pathname.slice(1)+location.search);return}me=session.user})();
send.onclick=async()=>{const t=title.value.trim(),d=details.value.trim(),f=file.files[0];if(!t||!d)return alert('اكتب العنوان والتفاصيل');send.disabled=true;status.textContent='جاري الإرسال...';let path=null;
try{if(f){if(f.size>30*1024*1024)throw new Error('الملف أكبر من 30MB');const ext=(f.name.split('.').pop()||'bin').toLowerCase();path=me.id+'/'+Date.now()+'.'+ext;const {error}=await db.storage.from('study-suggestions').upload(path,f,{upsert:false,contentType:f.type||undefined});if(error)throw error}
const {error}=await db.from('study_suggestions').insert({user_id:me.id,title:t,details:d,stage_name:stage,grade_name:grade,branch_name:branch||'',attachment_path:path,status:'pending'});if(error)throw error;status.textContent='✅ تم إرسال الاقتراح للأدمن الرئيسي.';title.value='';details.value='';file.value=''}catch(e){status.textContent='تعذر الإرسال: '+e.message}finally{send.disabled=false}};
</script></body></html>
