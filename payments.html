<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>الدفع الإلكتروني - HA Marketing</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll');</script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f5f5f5;color:#111}.wrap{width:94%;max-width:760px;margin:35px auto}h1{text-align:center}.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 4px 16px #0001;margin:14px 0}.notice{padding:14px;border-radius:12px;background:#f3f3f3;line-height:1.8}.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.btn{display:inline-block;background:#111;color:#fff;text-decoration:none;border-radius:10px;padding:12px 15px}.light{background:#eee;color:#111}.amount{font-size:25px;font-weight:bold}</style></head><body><div class="wrap"><h1>💳 الدفع الإلكتروني</h1><div id="box" class="card">جاري تحميل الطلب...</div><div class="card"><div class="notice"><strong>مهم:</strong> خيار الدفع الإلكتروني مفعّل داخل الطلب، لكن الخصم الحقيقي من البطاقة غير مربوط ببوابة دفع بعد. لذلك لن يتم سحب أي مبلغ حالياً.</div><div class="row" style="margin-top:15px"><a class="btn" href="shop-orders.html">طلباتي</a><a class="btn light" href="shop.html">متابعة التسوق</a></div></div></div><script>const id=Number(new URLSearchParams(location.search).get('order'));const box=document.getElementById('box');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}async function load(){if(!Number.isInteger(id)||id<1){box.innerHTML='رقم الطلب غير صحيح.';return}const {data:u}=await db.auth.getUser();if(!u?.user){box.innerHTML='يجب تسجيل الدخول لعرض الطلب.';return}const {data:o,error}=await db.from('shop_orders').select('id,total,payment_method,payment_status,status,created_at').eq('id',id).eq('customer_id',u.user.id).maybeSingle();if(error||!o){box.innerHTML='تعذر العثور على الطلب.';return}box.innerHTML=`<h2>طلب #${o.id}</h2><p>طريقة الدفع: <strong>${o.payment_method==='electronic'?'دفع إلكتروني / بطاقة':'الدفع عند الاستلام'}</strong></p><p>حالة الدفع: <strong>${o.payment_status==='paid'?'مدفوع':o.payment_status==='failed'?'فشل الدفع':'بانتظار الدفع'}</strong></p><div class="amount">${Number(o.total).toLocaleString('ar-IQ')} د.ع</div><p>سيبقى طلبك محفوظاً، وعند ربط بوابة الدفع لاحقاً تظهر هنا خطوة إدخال بيانات البطاقة بشكل آمن.</p>`}load();</script></body></html>
