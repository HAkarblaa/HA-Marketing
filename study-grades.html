<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الدرجات والتقييم</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7fb;color:#111}.w{width:min(1100px,94%);margin:20px auto}.c{background:#fff;border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 3px 14px #0001}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#f7f8fb;border:1px solid #e7e9ef;border-radius:14px;padding:14px;text-align:center}.stat b{display:block;font-size:22px;margin-top:5px}input,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px}button,.b{border:0;background:#111;color:#fff;padding:11px 14px;border-radius:10px;text-decoration:none;cursor:pointer}.secondary{background:#fff;color:#111;border:1px solid #ccc}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions button{flex:1}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #eee;text-align:center}.excellent{color:#087f23}.good{color:#1769aa}.mid{color:#a56a00}.low{color:#b00020}.bar{height:10px;background:#eee;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#111}.muted{color:#666;font-size:13px}.scroll{overflow:auto}.analysis{line-height:1.9}@media(max-width:700px){.g,.stats{grid-template-columns:1fr 1fr}table{font-size:12px}}@media(max-width:430px){.g,.stats{grid-template-columns:1fr}}</style></head><body><div class=w><a class=b href="study.html">← دراسة</a><h1>📊 الدرجات والتقييم المتقدم</h1><div class=c><h2>إضافة تقييم جديد</h2><div class=g><select id=student><option value="">اختر الطالب</option></select><input id=subject placeholder="المادة"><input id=term placeholder="الفصل / الشهر"><input id=daily type=number min=0 max=100 placeholder="اليومي"><input id=monthly type=number min=0 max=100 placeholder="الشهري"><input id=dictation type=number min=0 max=100 placeholder="الإملاء"><input id=participation type=number min=0 max=100 placeholder="المشاركة"><input id=effort type=number min=0 max=100 placeholder="السعي"><input id=exam type=number min=0 max=100 placeholder="الامتحان"></div><button onclick=save() style="margin-top:10px;width:100%">حفظ الدرجات</button><p class=muted>التقييم يحسب المعدل العام تلقائياً ويبين نقاط القوة والمواد التي تحتاج متابعة.</p></div><div class=c><h2>ملخص الأداء</h2><div class=stats><div class=stat>المعدل العام<b id=overall>—</b></div><div class=stat>أعلى مادة<b id=best>—</b></div><div class=stat>تحتاج متابعة<b id=weak>—</b></div><div class=stat>عدد التقييمات<b id=count>0</b></div></div></div><div class=c><h2>بحث وتحليل</h2><div class=g><select id=filterStudent onchange=render()><option value="">كل الطلاب</option></select><input id=filterSubject placeholder="ابحث عن مادة" oninput=render()><select id=filterLevel onchange=render()><option value="">كل المستويات</option><option>ممتاز</option><option>جيد جداً</option><option>جيد</option><option>متوسط</option><option>مقبول</option><option>يحتاج متابعة</option></select></div><div class=actions><button class=secondary onclick="clearFilters()">مسح البحث</button><button onclick="window.print()">طباعة التقرير</button></div></div><div class=c><h2>تحليل تفصيلي</h2><div id=analysis class=analysis>جاري التحميل...</div></div><div class=c><h2>سجل الدرجات</h2><div id=list class=scroll>جاري التحميل...</div></div></div><script>const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});let me=null,rows=[];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function level(n){return n>=90?'ممتاز':n>=80?'جيد جداً':n>=70?'جيد':n>=60?'متوسط':n>=50?'مقبول':'يحتاج متابعة'}function cls(n){return n>=90?'excellent':n>=70?'good':n>=50?'mid':'low'}function avg(o){let a=['daily','monthly','dictation','participation','effort','exam'].map(k=>Number(o[k])).filter(Number.isFinite);return a.length?a.reduce((x,y)=>x+y,0)/a.length:0}async function init(){const {data:{session}}=await db.auth.getSession();if(!session)return location.href='login.html?next=study-grades.html';me=session.user;const {data:s}=await db.from('study_students').select('id,student_name').eq('owner_user_id',me.id);let opts=(s||[]).map(x=>`<option value="${x.id}">${esc(x.student_name)}</option>`).join('');student.innerHTML='<option value="">اختر الطالب</option>'+opts;filterStudent.innerHTML='<option value="">كل الطلاب</option>'+opts;load()}async function save(){if(!student.value||!subject.value.trim())return alert('اختر الطالب واكتب المادة');const vals=[daily,monthly,dictation,participation,effort,exam];if(vals.some(x=>x.value!==''&&(+x.value<0||+x.value>100)))return alert('كل درجة يجب أن تكون من 0 إلى 100');const row={owner_user_id:me.id,student_id:Number(student.value),subject:subject.value.trim(),term:term.value.trim()||null,daily:+daily.value||0,monthly:+monthly.value||0,dictation:+dictation.value||0,participation:+participation.value||0,effort:+effort.value||0,exam:+exam.value||0};const {error}=await db.from('student_grades').insert(row);if(error)return alert(error.message);vals.forEach(x=>x.value='');load()}async function load(){const {data,error}=await db.from('student_grades').select('*,study_students(student_name)').eq('owner_user_id',me.id).order('created_at',{ascending:false});if(error){list.textContent='قاعدة بيانات الدرجات غير مفعلة بعد.';analysis.textContent='يلزم تفعيل جدول student_grades.';return}rows=data||[];render()}function filtered(){let q=filterSubject.value.trim().toLowerCase();return rows.filter(x=>(!filterStudent.value||String(x.student_id)===filterStudent.value)&&(!q||String(x.subject).toLowerCase().includes(q))&&(!filterLevel.value||level(avg(x))===filterLevel.value))}function render(){let d=filtered();count.textContent=d.length;if(!d.length){overall.textContent=best.textContent=weak.textContent='—';analysis.textContent='لا توجد درجات مطابقة.';list.innerHTML='لا توجد نتائج.';return}let av=d.map(x=>avg(x)),oa=av.reduce((a,b)=>a+b,0)/av.length;overall.textContent=oa.toFixed(1)+'%';let by={};d.forEach(x=>{(by[x.subject]??=[]).push(avg(x))});let subs=Object.entries(by).map(([k,v])=>[k,v.reduce((a,b)=>a+b,0)/v.length]).sort((a,b)=>b[1]-a[1]);best.textContent=subs[0][0]+' '+subs[0][1].toFixed(0)+'%';weak.textContent=subs.at(-1)[0]+' '+subs.at(-1)[1].toFixed(0)+'%';let comps={daily:'اليومي',monthly:'الشهري',dictation:'الإملاء',participation:'المشاركة',effort:'السعي',exam:'الامتحان'};let ca=Object.entries(comps).map(([k,n])=>[n,d.reduce((a,x)=>a+(+x[k]||0),0)/d.length]).sort((a,b)=>b[1]-a[1]);analysis.innerHTML=`<b>المستوى العام:</b> <span class="${cls(oa)}">${level(oa)}</span><br><b>أقوى جانب:</b> ${esc(ca[0][0])} (${ca[0][1].toFixed(1)}%)<br><b>الجانب الذي يحتاج تطوير:</b> ${esc(ca.at(-1)[0])} (${ca.at(-1)[1].toFixed(1)}%)<br><b>توصية:</b> ${oa>=90?'استمر على نفس المستوى مع أهداف أعلى.':oa>=70?'ركز على الجانب الأقل درجة لرفع المعدل العام.':oa>=50?'يحتاج جدول مراجعة منتظم ومتابعة أسبوعية.':'يحتاج متابعة مركزة وتقوية الأساسيات قبل الانتقال للموضوعات الأصعب.'}<div style="margin-top:12px">${ca.map(x=>`<div>${esc(x[0])} ${x[1].toFixed(1)}%<div class=bar><i style="width:${Math.max(0,Math.min(100,x[1]))}%"></i></div></div>`).join('')}</div>`;list.innerHTML=`<table><tr><th>الطالب</th><th>المادة</th><th>الفترة</th><th>يومي</th><th>شهري</th><th>إملاء</th><th>مشاركة</th><th>سعي</th><th>امتحان</th><th>المعدل</th><th>المستوى</th></tr>${d.map(x=>{let a=avg(x);return `<tr><td>${esc(x.study_students?.student_name||'')}</td><td>${esc(x.subject)}</td><td>${esc(x.term||'—')}</td><td>${x.daily}</td><td>${x.monthly}</td><td>${x.dictation}</td><td>${x.participation}</td><td>${x.effort}</td><td>${x.exam}</td><td>${a.toFixed(1)}</td><td class="${cls(a)}">${level(a)}</td></tr>`}).join('')}</table>`}function clearFilters(){filterStudent.value='';filterSubject.value='';filterLevel.value='';render()}init();</script></body></html>
