<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الدرجات والتقييم</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7fb}.w{width:min(1000px,94%);margin:20px auto}.c{background:#fff;border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 3px 14px #0001}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}input,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px}button,.b{border:0;background:#111;color:#fff;padding:11px 14px;border-radius:10px;text-decoration:none}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #eee;text-align:center}.excellent{color:#087f23}.good{color:#1769aa}.mid{color:#a56a00}.low{color:#b00020}@media(max-width:600px){.g{grid-template-columns:1fr}table{font-size:12px}}</style></head><body><div class=w><a class=b href="study.html">← دراسة</a><h1>📊 الدرجات والتقييم</h1><div class=c><div class=g><select id=student><option value="">اختر الطالب</option></select><input id=subject placeholder="المادة"><input id=term placeholder="الفصل / الشهر"><input id=daily type=number min=0 max=100 placeholder="اليومي"><input id=monthly type=number min=0 max=100 placeholder="الشهري"><input id=dictation type=number min=0 max=100 placeholder="الإملاء"><input id=participation type=number min=0 max=100 placeholder="المشاركة"><input id=effort type=number min=0 max=100 placeholder="السعي"><input id=exam type=number min=0 max=100 placeholder="الامتحان"></div><button onclick=save() style="margin-top:10px;width:100%">حفظ الدرجات</button><p>التقييم التلقائي: ممتاز 90–100، جيد جداً 80–89، جيد 70–79، متوسط 60–69، مقبول 50–59، يحتاج متابعة أقل من 50.</p></div><div class=c><div id=list>جاري التحميل...</div></div></div><script>const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});
let me=null;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function level(n){return n>=90?'ممتاز':n>=80?'جيد جداً':n>=70?'جيد':n>=60?'متوسط':n>=50?'مقبول':'يحتاج متابعة'}function cls(n){return n>=90?'excellent':n>=70?'good':n>=50?'mid':'low'}function avg(o){let a=['daily','monthly','dictation','participation','effort','exam'].map(k=>Number(o[k])).filter(Number.isFinite);return a.length?a.reduce((x,y)=>x+y,0)/a.length:0}async function init(){const {data:{session}}=await db.auth.getSession();if(!session)return location.href='login.html?next=study-grades.html';me=session.user;const {data:s}=await db.from('study_students').select('id,student_name').eq('owner_user_id',me.id);student.innerHTML='<option value="">اختر الطالب</option>'+(s||[]).map(x=>`<option value="${x.id}">${esc(x.student_name)}</option>`).join('');load()}async function save(){if(!student.value||!subject.value.trim())return alert('اختر الطالب واكتب المادة');const row={owner_user_id:me.id,student_id:Number(student.value),subject:subject.value.trim(),term:term.value.trim()||null,daily:+daily.value||0,monthly:+monthly.value||0,dictation:+dictation.value||0,participation:+participation.value||0,effort:+effort.value||0,exam:+exam.value||0};const {error}=await db.from('student_grades').insert(row);if(error)return alert(error.message);document.querySelectorAll('input[type=number]').forEach(x=>x.value='');load()}async function load(){const {data,error}=await db.from('student_grades').select('*,study_students(student_name)').eq('owner_user_id',me.id).order('created_at',{ascending:false});if(error){list.textContent='شغّل NEW-FEATURES-2026-09-04.sql أولاً.';return}list.innerHTML=`<table><tr><th>الطالب</th><th>المادة</th><th>يومي</th><th>شهري</th><th>إملاء</th><th>سعي</th><th>امتحان</th><th>المعدل</th><th>المستوى</th></tr>${(data||[]).map(x=>{let a=avg(x);return `<tr><td>${esc(x.study_students?.student_name||'')}</td><td>${esc(x.subject)}</td><td>${x.daily}</td><td>${x.monthly}</td><td>${x.dictation}</td><td>${x.effort}</td><td>${x.exam}</td><td>${a.toFixed(1)}</td><td class="${cls(a)}">${level(a)}</td></tr>`}).join('')}</table>`}init();</script></body></html>
