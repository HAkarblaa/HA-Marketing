<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المنتجات</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});</script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f5f5f5;color:#111}.wrap{width:94%;max-width:1120px;margin:24px auto}h1{text-align:center}.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 16px #0001;position:relative}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.btn,button{display:inline-block;border:0;border-radius:10px;padding:11px 14px;background:#111;color:#fff;text-decoration:none;cursor:pointer}.light{background:#eee;color:#111}.muted{color:#666;line-height:1.7}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.img{width:100%;height:210px;object-fit:contain;background:#fafafa;border-radius:12px}.price{font-size:21px;font-weight:bold}.old{text-decoration:line-through;color:#888;font-size:14px}.badge{background:#eee;padding:5px 9px;border-radius:999px}.sale{background:#111;color:#fff}.filters{background:#fff;border-radius:16px;padding:12px;margin:14px 0;display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:8px}.filters input,.filters select{padding:10px;border:1px solid #ccc;border-radius:10px;width:100%}.fav{position:absolute;top:20px;left:20px;border:0;background:#fff;color:#111;width:38px;height:38px;border-radius:50%;padding:0;box-shadow:0 2px 10px #0002;font-size:20px}.actions{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.details{background:#eee;color:#111;text-align:center}.stocklow{color:#a86800;font-weight:bold}.empty{grid-column:1/-1;text-align:center}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.filters{grid-template-columns:1fr 1fr}.filters input:first-child{grid-column:1/-1}}@media(max-width:520px){.grid{grid-template-columns:1fr}.img{height:230px}}</style></head><body><div class="wrap"><div class="row"><a class="btn light" href="shop.html">← الأقسام</a><div><a class="btn light" href="shop-orders.html">📦 طلباتي</a> <a class="btn" href="cart.html">🛒 السلة <span id="cc"></span></a></div></div><h1 id="title">المنتجات</h1><div class="filters"><input id="search" placeholder="🔎 ابحث باسم المنتج"><input id="minPrice" type="number" min="0" placeholder="أقل سعر"><input id="maxPrice" type="number" min="0" placeholder="أعلى سعر"><select id="stockFilter"><option value="all">كل المخزون</option><option value="available">المتوفر فقط</option><option value="low">كمية قليلة</option></select><select id="sort"><option value="new">الأحدث</option><option value="priceAsc">السعر: الأقل</option><option value="priceDesc">السعر: الأعلى</option><option value="name">الاسم</option></select></div><div id="box" class="grid"><div class="card empty">جاري التحميل...</div></div></div><script>
const key=new URLSearchParams(location.search).get('category');let cart=JSON.parse(localStorage.getItem('ha_cart')||'[]'),all=[],favIds=new Set(),me=null;const box=document.getElementById('box'),title=document.getElementById('title'),cc=document.getElementById('cc');function count(){const n=cart.reduce((s,x)=>s+Number(x.qty||0),0);cc.textContent=n?'('+n+')':''}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function effective(p){return p.discount_price!=null&&Number(p.discount_price)<Number(p.price)?Number(p.discount_price):Number(p.price)}count();
async function load(){const {data:u}=await db.auth.getUser();me=u?.user||null;if(!key){box.innerHTML='<div class="card empty">القسم غير محدد.</div>';return}const {data:cat,error:ce}=await db.from('product_categories').select('id,name,slug').eq('slug',key).eq('is_active',true).maybeSingle();if(ce||!cat){title.textContent='قسم غير موجود';box.innerHTML='<div class="card empty">القسم غير موجود أو غير مفعل.</div>';return}title.textContent=cat.name;document.title=cat.name+' - HA Marketing';const {data,error}=await db.from('products').select('id,name,description,price,discount_price,image_url,stock,min_order_qty,specifications,created_at').eq('category_id',cat.id).eq('is_active',true).order('created_at',{ascending:false});if(error){box.innerHTML='<div class="card empty">'+esc(error.message)+'</div>';return}all=data||[];if(me){const {data:f}=await db.from('shop_favorites').select('product_id').eq('user_id',me.id);favIds=new Set((f||[]).map(x=>x.product_id))}render()}
function render(){const q=search.value.trim().toLowerCase(),mn=Number(minPrice.value||0),mx=maxPrice.value?Number(maxPrice.value):Infinity,sf=stockFilter.value;let arr=all.filter(p=>{const pr=effective(p),txt=(p.name+' '+(p.description||'')+' '+(p.specifications||'')).toLowerCase();if(q&&!txt.includes(q))return false;if(pr<mn||pr>mx)return false;if(sf==='available'&&p.stock<=0)return false;if(sf==='low'&&!(p.stock>0&&p.stock<=5))return false;return true});if(sort.value==='priceAsc')arr.sort((a,b)=>effective(a)-effective(b));else if(sort.value==='priceDesc')arr.sort((a,b)=>effective(b)-effective(a));else if(sort.value==='name')arr.sort((a,b)=>a.name.localeCompare(b.name,'ar'));else arr.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));box.innerHTML=arr.map(p=>{const sale=p.discount_price!=null&&Number(p.discount_price)<Number(p.price),price=effective(p),min=Math.max(1,Number(p.min_order_qty||1));return `<div class="card"><button class="fav" onclick="fav(${p.id})" title="المفضلة">${favIds.has(p.id)?'♥':'♡'}</button>${p.image_url?`<img class="img" src="${esc(p.image_url)}" alt="">`:'<div class="img"></div>'}<h2>${esc(p.name)}</h2><p class="muted">${esc((p.description||'').slice(0,120))}</p><div class="row"><div>${sale?`<div class="old">${Number(p.price).toLocaleString('ar-IQ')} د.ع</div>`:''}<span class="price">${price.toLocaleString('ar-IQ')} د.ع</span></div>${sale?'<span class="badge sale">عرض</span>':''}</div><div class="row" style="margin-top:7px"><span class="badge">المتوفر: ${p.stock}</span>${p.stock>0&&p.stock<=5?'<span class="stocklow">كمية قليلة</span>':''}${min>1?`<span class="badge">الحد الأدنى: ${min}</span>`:''}</div><div class="actions"><button ${p.stock<min?'disabled':''} onclick="add(${p.id},${min},${Number(p.stock)})">${p.stock>=min?'أضف للسلة':'نفد المخزون'}</button><a class="btn details" href="product-details.html?id=${p.id}&category=${encodeURIComponent(key)}">التفاصيل</a></div></div>`}).join('')||'<div class="card empty">لا توجد منتجات مطابقة للبحث.</div>'}
function add(id,min,stock){const p=all.find(x=>x.id===id),x=cart.find(i=>i.product_id===id);if(!p)return;if(x){const next=x.qty+min;if(next>stock){alert('لا يمكن تجاوز الكمية المتوفرة');return}x.qty=next}else cart.push({product_id:id,name:p.name,qty:min});localStorage.setItem('ha_cart',JSON.stringify(cart));count();alert('تمت الإضافة للسلة')}
async function fav(id){if(!me){alert('سجل الدخول أولاً لحفظ المفضلة');return}if(favIds.has(id)){const {error}=await db.from('shop_favorites').delete().eq('user_id',me.id).eq('product_id',id);if(!error)favIds.delete(id)}else{const {error}=await db.from('shop_favorites').insert({user_id:me.id,product_id:id});if(!error)favIds.add(id)}render()}
[search,minPrice,maxPrice,stockFilter,sort].forEach(x=>x.addEventListener('input',render));load();
</script></body></html>
