<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المنتجات</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll');</script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f5f5f5;color:#111}.wrap{width:94%;max-width:1000px;margin:24px auto}h1{text-align:center}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 4px 16px #0001}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.btn,button{display:inline-block;border:0;border-radius:10px;padding:11px 14px;background:#111;color:#fff;text-decoration:none;cursor:pointer}.light{background:#eee;color:#111}.muted{color:#666;line-height:1.7}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.img{width:100%;height:220px;object-fit:contain;background:#fafafa;border-radius:12px}.price{font-size:21px;font-weight:bold}.badge{background:#eee;padding:5px 9px;border-radius:999px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="row"><a class="btn light" href="shop.html">← الأقسام</a><a class="btn" href="cart.html">🛒 السلة <span id="cc"></span></a></div><h1 id="title">المنتجات</h1><div id="box" class="grid"><div class="card">جاري التحميل...</div></div></div><script>
const key=new URLSearchParams(location.search).get('category');let cart=JSON.parse(localStorage.getItem('ha_cart')||'[]');const box=document.getElementById('box'),title=document.getElementById('title'),cc=document.getElementById('cc');function count(){const n=cart.reduce((s,x)=>s+Number(x.qty||0),0);cc.textContent=n?'('+n+')':''}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}count();
async function load(){if(!key){box.innerHTML='<div class="card">القسم غير محدد.</div>';return}const {data:cat,error:ce}=await db.from('product_categories').select('id,name,slug').eq('slug',key).eq('is_active',true).maybeSingle();if(ce){box.innerHTML='<div class="card">'+esc(ce.message)+'</div>';return}if(!cat){title.textContent='قسم غير موجود';box.innerHTML='<div class="card">القسم غير موجود أو غير مفعل.</div>';return}title.textContent=cat.name;const {data,error}=await db.from('products').select('id,name,description,price,image_url,stock').eq('category_id',cat.id).eq('is_active',true).order('created_at',{ascending:false});if(error){box.innerHTML='<div class="card">'+esc(error.message)+'</div>';return}if(!data?.length){box.innerHTML='<div class="card" style="grid-column:1/-1;text-align:center">لا توجد منتجات متوفرة في هذا القسم حاليًا.</div>';return}box.innerHTML=data.map(p=>`<div class="card">${p.image_url?`<img class="img" src="${esc(p.image_url)}" alt="">`:''}<h2>${esc(p.name)}</h2><p class="muted">${esc(p.description||'')}</p><div class="row"><span class="price">${Number(p.price).toLocaleString('ar-IQ')} د.ع</span><span class="badge">المتوفر: ${p.stock}</span></div><button style="width:100%;margin-top:12px" ${p.stock<=0?'disabled':''} onclick="add(${p.id},'${encodeURIComponent(p.name)}',${Number(p.stock)})">${p.stock>0?'أضف للسلة':'نفد المخزون'}</button></div>`).join('')}
function add(id,n,stock){const x=cart.find(i=>i.product_id===id);if(x){if(x.qty>=stock){alert('لا يمكن تجاوز الكمية المتوفرة');return}x.qty++;}else cart.push({product_id:id,name:decodeURIComponent(n),qty:1});localStorage.setItem('ha_cart',JSON.stringify(cart));count();alert('تمت الإضافة للسلة')}load();
</script></body></html>
