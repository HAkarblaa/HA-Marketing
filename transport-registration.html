<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل سائق أو مندوب</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f5f5f5;color:#111}.wrap{width:94%;max-width:1050px;margin:22px auto}.top,.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.btn,button{border:0;border-radius:11px;padding:11px 14px;background:#111;color:#fff;text-decoration:none;cursor:pointer;font:inherit}.light{background:#eee;color:#111}.danger{background:#9b1028}.ok{background:#0c6b2a}.card{background:#fff;border-radius:16px;padding:15px;margin:12px 0;box-shadow:0 4px 16px #0001}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.muted{color:#666;line-height:1.7}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eee;font-size:12px}input,select,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;font:inherit;margin:5px 0 10px}textarea{min-height:90px}.status{padding:10px;border-radius:10px;background:#f1f1f1;white-space:pre-wrap}@media(max-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.card{padding:10px}.grid .card{font-size:12px}}</style></head><body><div class="wrap"><div class="top"><a class="btn light" href="taxi-delivery.html">← النقل</a><h1>🚕🛵 تسجيل السائق والمندوب</h1><a class="btn light" href="marketplace-onboarding.html">طلبات الانضمام</a></div><div class="card"><select id="role"><option value="taxi_driver">سائق تكسي</option><option value="delivery_driver">مندوب توصيل</option></select><input id="name" placeholder="الاسم الكامل"><input id="phone" placeholder="رقم الهاتف"><input id="vehicle" placeholder="نوع المركبة"><input id="model" placeholder="موديل المركبة"><input id="color" placeholder="اللون"><input id="plate" placeholder="رقم اللوحة"><input id="gov" placeholder="المحافظة"><button onclick="save()">حفظ/إرسال بيانات الاعتماد</button><div id="status" class="status">يجب أن يوافق الأدمن الرئيسي قبل استقبال الطلبات.</div></div><div class="card" id="go"></div></div><script>function migrateLegacyAuth(){try{const target='ha-marketing-auth';if(localStorage.getItem(target))return;for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i)||'';if(/^sb-.*-auth-token$/.test(k)){const v=localStorage.getItem(k);if(v){localStorage.setItem(target,v);break}}}}catch(e){console.warn(e)}}migrateLegacyAuth();const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});
let me=null;function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function init(){const {data:{session}}=await db.auth.getSession();if(!session){location.href='login.html';return}me=session.user;const {data:x}=await db.from('transport_profiles').select('*').eq('user_id',me.id).maybeSingle();if(x){role.value=x.role_type;name.value=x.full_name;phone.value=x.phone||'';vehicle.value=x.vehicle_type||'';model.value=x.vehicle_model||'';color.value=x.vehicle_color||'';plate.value=x.plate_number||'';gov.value=x.governorate||'';status.textContent='الحالة: '+(x.status==='approved'?'مقبول ✅':x.status==='rejected'?'مرفوض':'قيد المراجعة');if(x.status==='approved')go.innerHTML=x.role_type==='taxi_driver'?'<a class="btn" href="driver.html">فتح واجهة السائق</a>':'<a class="btn" href="driver.html">فتح واجهة المندوب/السائق</a>'}}async function save(){if(!name.value.trim())return alert('اكتب الاسم');const payload={user_id:me.id,role_type:role.value,full_name:name.value.trim(),phone:phone.value.trim()||null,vehicle_type:vehicle.value.trim()||null,vehicle_model:model.value.trim()||null,vehicle_color:color.value.trim()||null,plate_number:plate.value.trim()||null,governorate:gov.value.trim()||null,status:'pending',updated_at:new Date().toISOString()};status.textContent='جاري إرسال الطلب...';const {error:tpErr}=await db.from('transport_profiles').upsert(payload);if(tpErr){status.textContent='فشل حفظ بيانات النقل.';return alert('تعذر حفظ بيانات الموظف: '+tpErr.message)}const app={user_id:me.id,role_type:role.value,display_name:payload.full_name,phone:payload.phone,governorate:payload.governorate,details:[payload.vehicle_type,payload.vehicle_model,payload.vehicle_color,payload.plate_number].filter(Boolean).join(' - '),status:'pending',updated_at:new Date().toISOString()};const {data:appData,error:appErr}=await db.from('marketplace_applications').upsert(app,{onConflict:'user_id,role_type'}).select('id,status').single();if(appErr){status.textContent='تم حفظ بيانات الموظف لكن لم يصل طلب الموافقة للإدارة.';return alert('تعذر إرسال طلب الموافقة إلى الإدارة: '+appErr.message)}status.textContent='تم إرسال الطلب للإدارة بنجاح ✅ — الحالة: قيد المراجعة';alert('تم إرسال طلبك إلى الأدمن الرئيسي بنجاح.')}init();</script></body></html>
