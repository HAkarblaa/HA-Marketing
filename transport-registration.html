<style>body .ha-driver-address{border:1px solid #dfebe4;border-radius:14px;padding:14px;margin:6px 0 16px;background:#f8fbfa}body .ha-driver-address label{display:block;font-weight:bold;font-size:14px;margin:4px 0}body .ha-driver-address p{font-size:13px;margin:0}body .ha-driver-address input,body .ha-driver-address select{min-height:44px}</style></head><body class="ha-ui-final ha-family-transport"><div class="ha-family-strip"><a href="taxi-delivery.html">← النقل والتكسي</a><div><b>تسجيل سائق أو مندوب</b><small>HA Marketing</small></div><a href="index.html">الرئيسية</a></div><div class="wrap"><div class="top"><a class="btn light" href="taxi-delivery.html">← النقل</a><h1>🚕🛵 تسجيل السائق والمندوب</h1><a class="btn light" href="transport-registration.html">حالة التسجيل</a></div><div class="card"><select id="role"><option value="taxi_driver">🚕 سائق تكسي</option><option value="tuktuk_driver">🛺 سائق تكتك</option><option value="delivery_driver">🛵 مندوب توصيل</option><option value="stoota_driver">🛻 سائق ستوتة</option></select><input id="name" placeholder="الاسم الكامل"><input id="phone" placeholder="رقم الهاتف"><input id="vehicle" placeholder="نوع المركبة"><input id="model" placeholder="موديل المركبة"><input id="color" placeholder="اللون"><input id="plate" placeholder="رقم اللوحة"><div class="ha-driver-address"><label for="gov">المحافظة</label><select id="gov" required autocomplete="address-level1"><option value="">اختر المحافظة</option><option value="بغداد">بغداد</option><option value="البصرة">البصرة</option><option value="نينوى">نينوى</option><option value="أربيل">أربيل</option><option value="النجف">النجف</option><option value="كربلاء">كربلاء</option><option value="ذي قار">ذي قار</option><option value="الأنبار">الأنبار</option><option value="ديالى">ديالى</option><option value="كركوك">كركوك</option><option value="صلاح الدين">صلاح الدين</option><option value="واسط">واسط</option><option value="ميسان">ميسان</option><option value="المثنى">المثنى</option><option value="القادسية">القادسية</option><option value="بابل">بابل</option><option value="دهوك">دهوك</option><option value="السليمانية">السليمانية</option><option value="حلبجة">حلبجة</option></select><label for="address">الموقع والعنوان</label><input id="address" required autocomplete="street-address" placeholder="اكتب المنطقة / الحي / الشارع وأقرب نقطة دالة"><p class="muted">اختَر المحافظة واكتب عنوانك بالتفصيل.</p></div><button onclick="save()">حفظ/إرسال بيانات الاعتماد</button><div id="status" class="status">بعد إرسال البيانات يبقى الطلب قيد المراجعة إلى أن توافق الإدارة.</div></div><div class="card" id="go"></div></div><script>const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});
let me=null;
const el=id=>document.getElementById(id);
const roleEl=el('role');
const nameEl=el('name');
const phoneEl=el('phone');
const vehicleEl=el('vehicle');
const modelEl=el('model');
const colorEl=el('color');
const plateEl=el('plate');
const govEl=el('gov');
const addressEl=el('address');
function setDriverGovernorate(value){if(!value)return;if(!Array.from(govEl.options).some(o=>o.value===value)){const option=document.createElement('option');option.value=value;option.textContent=value;govEl.appendChild(option);}govEl.value=value;}
async function restoreDriverAddress(){try{const selected=roleEl.value==='tuktuk_driver'?'taxi_driver':roleEl.value;const {data,error}=await db.from('marketplace_applications').select('address,governorate').eq('user_id',me.id).eq('role_type',selected).order('created_at',{ascending:false}).limit(1);if(!error&&data?.[0]){addressEl.value=data[0].address||'';setDriverGovernorate(data[0].governorate);}}catch(e){}}
const statusEl=el('status');
const goEl=el('go');function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function init(){const {data:{session}}=await db.auth.getSession();if(!session){location.href='login.html';return}me=session.user;const {data:x}=await db.from('transport_profiles').select('*').eq('user_id',me.id).maybeSingle();if(x){roleEl.value=(x.role_type==='taxi_driver'&&String(x.vehicle_type||'').includes('تكتك'))?'tuktuk_driver':x.role_type;nameEl.value=x.full_name;phoneEl.value=x.phone||'';vehicleEl.value=x.vehicle_type||'';modelEl.value=x.vehicle_model||'';colorEl.value=x.vehicle_color||'';plateEl.value=x.plate_number||'';setDriverGovernorate(x.governorate||'');statusEl.textContent='الحالة: '+(x.status==='approved'?'مقبول ✅':x.status==='rejected'?'مرفوض':'قيد المراجعة');if(x.status==='approved')goEl.innerHTML=x.role_type==='taxi_driver'?'<a class="btn" href="driver.html">فتح واجهة السائق</a>':'<a class="btn" href="driver.html">فتح واجهة المندوب/السائق</a>'}await restoreDriverAddress();}async function save(){
  if(!nameEl.value.trim())return alert('اكتب الاسم');
  if(!phoneEl.value.trim())return alert('اكتب رقم الهاتف');
  if(!govEl.value.trim())return alert('اختر المحافظة');
  if(!addressEl.value.trim())return alert('اكتب الموقع والعنوان بالتفصيل');
  if(!vehicleEl.value.trim())return alert('اكتب نوع المركبة');
  if(!modelEl.value.trim())return alert('اكتب موديل المركبة');
  if(!colorEl.value.trim())return alert('اكتب لون المركبة');
  if(!plateEl.value.trim())return alert('اكتب رقم اللوحة');

  const selectedRole=roleEl.value;
  const dbRole=selectedRole==='tuktuk_driver'?'taxi_driver':selectedRole;
  const vehicleType=selectedRole==='tuktuk_driver'?'تكتك':selectedRole==='stoota_driver'?'ستوتة':vehicleEl.value.trim();
  const note=selectedRole==='tuktuk_driver'
    ?'نوع السائق: سائق تكتك'
    :selectedRole==='taxi_driver'
      ?'نوع السائق: سائق تكسي'
      :selectedRole==='stoota_driver'
        ?'نوع السائق: سائق ستوتة'
        
          :'نوع العمل: مندوب توصيل';

  statusEl.textContent='جاري إرسال طلب الصلاحية...';

  const {data,error}=await db.rpc('request_marketplace_role',{
    p_role:dbRole,
    p_display_name:nameEl.value.trim(),
    p_phone:phoneEl.value.trim(),
    p_governorate:govEl.value.trim(),
    p_address:addressEl.value.trim(),
    p_details:[note,vehicleType,modelEl.value.trim(),colorEl.value.trim(),plateEl.value.trim()].filter(Boolean).join(' - '),
    p_vehicle_type:vehicleType,
    p_vehicle_model:modelEl.value.trim()||null,
    p_vehicle_color:colorEl.value.trim()||null,
    p_plate_number:plateEl.value.trim()||null
  });

  if(error){
    console.error(error);
    statusEl.textContent='❌ فشل إرسال طلب الصلاحية: '+error.message;
    alert(error.message);
    return;
  }

  statusEl.textContent='✅ تم إرسال الطلب للإدارة — الحالة: قيد المراجعة';
  alert('تم إرسال طلب السائق/المندوب إلى الإدارة.');
  await init();
}
init();</script><script src="ha-role-bottom-nav.js?v=20260930-1" defer></script><script src="ha-lux-icons.js?v=20260930-1" defer></script><script src="ha-card-customizer.js?v=20261001-1" defer></script>
