<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أخبار وزارة التربية - HA Marketing</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#111}
.wrap{width:94%;max-width:900px;margin:35px auto}
h1{text-align:center;font-size:38px;margin-bottom:8px}
.subtitle{text-align:center;color:#666;margin-bottom:22px}
.status{background:#fff;padding:13px;border-radius:12px;text-align:center;margin-bottom:16px}
.news-list{display:grid;grid-template-columns:1fr;gap:14px}
.news-item{background:#fff;border-radius:15px;padding:18px;box-shadow:0 3px 12px rgba(0,0,0,.09)}
.news-item h2{font-size:20px;margin:0 0 10px;line-height:1.6}
.news-item p{font-size:16px;line-height:1.8;color:#555;margin:0 0 12px}
.news-item .date{font-size:13px;color:#777;margin-bottom:10px}
.news-item a{display:inline-block;text-decoration:none;background:#000;color:#fff;padding:10px 14px;border-radius:8px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.actions button,.actions a{display:block;width:100%;text-align:center;border:0;border-radius:10px;padding:13px;font-size:16px;cursor:pointer;text-decoration:none}
.actions button{background:#000;color:#fff}
.actions a{background:#fff;color:#111;border:1px solid #ccc}
.note{text-align:center;color:#666;font-size:13px;line-height:1.7;margin-top:14px}
.back{display:block;text-align:center;margin-top:24px;text-decoration:none;color:#111}
@media(max-width:600px){
 h1{font-size:30px}
 .news-item h2{font-size:18px}
}
</style>
</head>
<body>
<div class="wrap">
<h1>🏫 أخبار وزارة التربية</h1>
<p class="subtitle">آخر الأخبار من القناة الرسمية لوزارة التربية العراقية</p>

<div class="status" id="status">جاري تحميل آخر الأخبار...</div>
<div class="news-list" id="newsList"></div>

<div class="actions">
  <button type="button" id="refreshBtn">🔄 تحديث الأخبار</button>
  <a href="https://t.me/Educationiq" target="_blank" rel="noopener">فتح القناة الرسمية</a>
</div>

<p class="note">يتم جلب الأخبار تلقائيًا عبر تغذية RSS وسيطة. إذا توقف المصدر الوسيط مؤقتًا، استخدم زر فتح القناة الرسمية.</p>
<a class="back" href="news.html">← الرجوع إلى آخر الأخبار</a>
</div>

<script>
const API_URL = 'https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Frsshub.umzzz.com%2Ftelegram%2Fchannel%2FEducationiq';

function cleanHtml(html){
  const div = document.createElement('div');
  div.innerHTML = html || '';
  return (div.textContent || div.innerText || '').trim();
}

function shortText(text, max=320){
  if(!text) return '';
  return text.length > max ? text.slice(0,max) + '…' : text;
}

async function loadNews(){
  const status = document.getElementById('status');
  const list = document.getElementById('newsList');
  const btn = document.getElementById('refreshBtn');

  status.textContent = 'جاري تحميل آخر الأخبار...';
  list.innerHTML = '';
  btn.disabled = true;

  try{
    const res = await fetch(API_URL);
    if(!res.ok) throw new Error('تعذر الوصول إلى خدمة الأخبار');

    const data = await res.json();
    if(data.status !== 'ok' || !Array.isArray(data.items)) throw new Error('تعذر قراءة الأخبار');

    const items = data.items.slice(0,10);

    if(items.length === 0){
      status.textContent = 'لا توجد أخبار متاحة حالياً.';
      return;
    }

    items.forEach(item => {
      const article = document.createElement('article');
      article.className = 'news-item';

      const title = document.createElement('h2');
      title.textContent = cleanHtml(item.title) || 'خبر جديد';

      const date = document.createElement('div');
      date.className = 'date';
      date.textContent = item.pubDate ? 'تاريخ النشر: ' + item.pubDate : '';

      const p = document.createElement('p');
      p.textContent = shortText(cleanHtml(item.description));

      const link = document.createElement('a');
      link.href = item.link || 'https://t.me/Educationiq';
      link.target = '_blank';
      link.rel = 'noopener';
      link.textContent = 'قراءة الخبر';

      article.appendChild(title);
      if(date.textContent) article.appendChild(date);
      if(p.textContent) article.appendChild(p);
      article.appendChild(link);

      list.appendChild(article);
    });

    status.textContent = 'تم تحديث الأخبار تلقائيًا';
  }catch(err){
    console.error(err);
    status.textContent = 'تعذر تحميل الأخبار الآن. جرّب التحديث أو افتح القناة الرسمية.';
  }finally{
    btn.disabled = false;
  }
}

document.getElementById('refreshBtn').addEventListener('click', loadNews);
loadNews();
</script>
</body>
</html>
