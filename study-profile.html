<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ملفي الدراسي والتبليغات - HA Marketing</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f5f5f5;color:#111}.top{background:#000;color:#fff;padding:13px 16px;display:flex;justify-content:space-between;align-items:center}.top a{background:#fff;color:#111;padding:9px 12px;border-radius:9px;text-decoration:none}.wrap{width:min(850px,94%);margin:18px auto}.box{background:#fff;border-radius:17px;padding:18px;margin-bottom:14px;box-shadow:0 4px 15px #00000012}.field{margin:10px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;font:inherit}.btn{border:0;background:#111;color:#fff;border-radius:10px;padding:12px 17px;font-weight:700}.notice{border-bottom:1px solid #eee;padding:13px 0}.notice:last-child{border:0}.notice h3{margin:0 0 7px}.small{color:#666;font-size:13px}.status{padding:10px;border-radius:9px;background:#f2f2f2;margin-top:10px}</style>
</head><body>
<div class="top"><b>🔔 ملفي الدراسي</b><a href="study.html">رجوع</a></div>
<div class="wrap">
<div class="box"><h2>بيانات الدراسة</h2><p class="small">هذه البيانات تحدد التبليغات التي تصلك. اكتب اسم المدرسة أو الجامعة بدقة.</p>
<div class="field"><label>المحافظة</label><input id="gov" placeholder="مثال: كربلاء"></div>
<div class="field"><label>المرحلة</label><select id="stage"><option value="">اختر المرحلة</option><option>روضة</option><option>ابتدائي</option><option>متوسط</option><option>إعدادي</option><option>متميزين</option><option>خارجي</option><option>مهني</option><option>دبلوم</option><option>بكالوريوس</option><option>ماجستير</option><option>دكتوراه</option></select></div>
<div class="field"><label>المدرسة / الجامعة</label><input id="school" placeholder="اسم المدرسة أو الجامعة"></div>
<div class="field"><label>الصف / المرحلة الدراسية</label><input id="grade" placeholder="مثال: السادس الابتدائي"></div>
<button class="btn" onclick="saveProfile()">حفظ البيانات</button><div id="status" class="status">جاري التحقق من الحساب...</div></div>
<div class="box"><h2>التبليغات الخاصة بي</h2><div id="notices">جاري التحميل...</div></div>
</div>
<script>
const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});let me=null;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function init(){const {data:{session}}=await db.auth.getSession();if(!session){status.textContent='سجل الدخول أولاً.';notices.textContent='لا يمكن عرض التبليغات بدون تسجيل الدخول.';return}me=session.user;const {data:p}=await db.from('study_student_profiles').select('*').eq('user_id',me.id).maybeSingle();if(p){gov.value=p.governorate||'';stage.value=p.stage||'';school.value=p.school_name||'';grade.value=p.grade_name||''}status.textContent='الحساب جاهز.';await loadNotices()}
async function saveProfile(){if(!me)return alert('سجل الدخول أولاً');if(!stage.value||!school.value.trim())return alert('اختر المرحلة واكتب المدرسة أو الجامعة');const row={user_id:me.id,governorate:gov.value.trim(),stage:stage.value,school_name:school.value.trim(),grade_name:grade.value.trim()||null,institution_type:['دبلوم','بكالوريوس','ماجستير','دكتوراه'].includes(stage.value)?'university':'school',updated_at:new Date().toISOString()};const {error}=await db.from('study_student_profiles').upsert(row,{onConflict:'user_id'});status.textContent=error?'تعذر الحفظ: '+error.message:'تم حفظ بياناتك الدراسية.';if(!error)await loadNotices()}
async function loadNotices(){const {data,error}=await db.from('study_notices').select('*').order('created_at',{ascending:false}).limit(100);if(error){notices.textContent='تعذر تحميل التبليغات: '+error.message;return}notices.innerHTML=(data||[]).map(n=>'<div class="notice"><h3>'+esc(n.title)+'</h3><div>'+esc(n.body)+'</div><div class="small">'+new Date(n.created_at).toLocaleString('ar-IQ')+'</div></div>').join('')||'لا توجد تبليغات مطابقة لبياناتك حالياً.'}
init();
</script></body></html>
