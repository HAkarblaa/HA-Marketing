<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>كرة القدم</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#eff7f1}.w{width:min(1100px,95%);margin:18px auto}.tabs{display:flex;gap:6px;overflow:auto;margin:10px 0}.tabs button,.b{border:0;background:#fff;padding:11px 14px;border-radius:12px;text-decoration:none;color:#111;white-space:nowrap}.tabs .on{background:#0d5a35;color:#fff}.p{display:none}.p.show{display:block}.c{background:#fff;border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 3px 14px #0001}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}input,textarea,select{width:100%;padding:10px;border:1px solid #ccd7d0;border-radius:10px;margin:5px 0}.btn{border:0;background:#0d5a35;color:#fff;border-radius:10px;padding:10px 13px}.muted{color:#667;line-height:1.7}img.logo{width:70px;height:70px;object-fit:cover;border-radius:50%}@media(max-width:650px){.g{grid-template-columns:1fr}}</style></head><body><div class=w><a class=b href="sports.html">← الرياضة</a> <a class=b href="sports-owner.html">إدارة الطلبات والدوريات</a><h1>⚽ كرة القدم</h1><div class=tabs><button class=on onclick="tab('stadiums',this)">الملاعب</button><button onclick="tab('teams',this)">الفرق</button><button onclick="tab('leagues',this)">الدوريات</button></div><section id=stadiums class="p show"><div class=c><button class=btn onclick=openFacility()>＋ إضافة ملعب</button><div class=muted>إضافة الملاعب للموظف المعتمد/مقدم الخدمة أو الأدمن الرئيسي. العملاء يقدرون يحجزون حسب الوقت المتاح.</div></div><div id=facilityForm class=c style="display:none"><input id=fn placeholder="اسم الملعب"><input id=fa placeholder="العنوان"><input id=fg placeholder="المحافظة"><input id=fh placeholder="ساعات العمل"><input id=fp type=number placeholder="سعر الساعة"><input id=fc placeholder="رقم التواصل"><textarea id=fd placeholder="تفاصيل الملعب والخدمات والأرضية"></textarea><input id=fslots placeholder="الأوقات المتاحة مثال: 4-5، 5-6، 8-9"><button class=btn onclick=saveFacility()>حفظ الملعب</button></div><div id=facilities class=g></div></section><section id=teams class=p><div class=c><h2>إضافة فريقك</h2><input id=tn placeholder="اسم الفريق"><input id=tl placeholder="رابط الشعار (اختياري)"><input id=tcity placeholder="المدينة"><textarea id=td placeholder="تفاصيل الفريق"></textarea><button class=btn onclick=saveTeam()>إنشاء الفريق</button></div><div id=teamsList class=g></div></section><section id=leagues class=p><div class=c><h2>الدوريات</h2><div class=muted>يعرض الدوريات المضافة من أصحاب المرافق أو الإدارة.</div></div><div id=leagueList class=g></div></section></div><script>const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});
let me=null,manager=false;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function tab(id,b){document.querySelectorAll('.p').forEach(x=>x.classList.remove('show'));document.getElementById(id).classList.add('show');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}async function init(){const {data:{session}}=await db.auth.getSession();me=session?.user||null;if(me){const {data}=await db.rpc('can_manage_sports');manager=!!data}loadAll()}function openFacility(){if(!me)return location.href='login.html?next=football.html';if(!manager)return alert('إضافة الملعب متاحة للموظف المعتمد/مقدم الخدمة أو الأدمن الرئيسي.');facilityForm.style.display='block'}async function saveFacility(){if(!manager)return;let r={owner_user_id:me.id,facility_type:'stadium',name:fn.value.trim(),address:fa.value.trim(),governorate:fg.value.trim(),working_hours:fh.value.trim(),price:Number(fp.value)||0,phone:fc.value.trim(),details:fd.value.trim(),available_slots:fslots.value.trim()};if(!r.name||!r.address)return alert('اكتب اسم الملعب والعنوان');let {error}=await db.from('sports_facilities').insert(r);if(error)return alert(error.message);facilityForm.style.display='none';loadFacilities()}async function loadFacilities(){let {data,error}=await db.from('sports_facilities').select('*').eq('facility_type','stadium').eq('is_active',true).order('created_at',{ascending:false});if(error){facilities.innerHTML='<div class=c>شغّل ملف SQL الجديد أولاً.</div>';return}facilities.innerHTML=(data||[]).map(x=>`<article class=c><h3>🏟️ ${esc(x.name)}</h3><div>${esc(x.governorate||'')} — ${esc(x.address||'')}</div><div class=muted>ساعات العمل: ${esc(x.working_hours||'—')}<br>سعر الساعة: ${Number(x.price||0).toLocaleString('ar-IQ')} د.ع<br>الأوقات المتاحة: ${esc(x.available_slots||'حسب الاتصال')}<br>${esc(x.details||'')}</div><button class=btn onclick="book(${x.id})">طلب حجز</button></article>`).join('')||'<div class=c>لا توجد ملاعب مضافة بعد.</div>'}async function book(id){if(!me)return location.href='login.html?next=football.html';let d=prompt('اكتب تاريخ الحجز YYYY-MM-DD');if(!d)return;let t=prompt('اكتب الوقت HH:MM');if(!t)return;let {error}=await db.from('sports_bookings').insert({user_id:me.id,facility_id:id,booking_date:d,booking_time:t,status:'pending'});alert(error?error.message:'✅ تم إرسال طلب الحجز')}async function saveTeam(){if(!me)return location.href='login.html?next=football.html';if(!tn.value.trim())return alert('اكتب اسم الفريق');let {data,error}=await db.from('sports_teams').insert({owner_user_id:me.id,name:tn.value.trim(),logo_url:tl.value.trim()||null,city:tcity.value.trim()||null,details:td.value.trim()||null}).select().single();if(error)return alert(error.message);alert('تم إنشاء الفريق. من بطاقة الفريق أضف اللاعبين حسب معرفاتهم.');loadTeams()}async function loadTeams(){let {data,error}=await db.from('sports_teams').select('*,sports_team_members(position,shirt_number,notes,profiles(username,full_name))').eq('is_active',true).order('created_at',{ascending:false});if(error)return;teamsList.innerHTML=(data||[]).map(x=>`<article class=c>${x.logo_url?`<img class=logo src="${esc(x.logo_url)}">`:'⚽'}<h3>${esc(x.name)}</h3><div>${esc(x.city||'')}</div><p class=muted>${esc(x.details||'')}</p><div class=muted><b>اللاعبون:</b><br>${(x.sports_team_members||[]).map(m=>`${esc(m.profiles?.full_name||m.profiles?.username||'لاعب')} ${m.shirt_number?'#'+m.shirt_number:''} — ${esc(m.position||'')}${m.notes?' — '+esc(m.notes):''}`).join('<br>')||'لاعبون الفريق لم يضافوا بعد.'}</div>${me&&x.owner_user_id===me.id?`<button class=btn onclick="addPlayer(${x.id})" style="margin-top:8px">＋ لاعب بالمعرف</button>`:''}</article>`).join('')||'<div class=c>لا توجد فرق بعد.</div>'}async function addPlayer(team){let u=prompt('اكتب معرف اللاعب username');if(!u)return;let {data:p}=await db.from('profiles').select('id,username,full_name').ilike('username',u).maybeSingle();if(!p)return alert('لم يتم العثور على هذا المعرف');let pos=prompt('مركز اللاعب: حارس/دفاع/وسط/هجوم')||'';let num=prompt('رقم القميص (اختياري)')||'';let note=prompt('معلومات اللاعب/ملاحظات (اختياري)')||'';let {error}=await db.from('sports_team_members').insert({team_id:team,user_id:p.id,position:pos,shirt_number:num?Number(num):null,notes:note||null});alert(error?error.message:'✅ تمت إضافة اللاعب')}async function loadLeagues(){let {data}=await db.from('sports_leagues').select('*').eq('is_active',true).order('start_date',{ascending:false});leagueList.innerHTML=(data||[]).map(x=>`<article class=c><h3>🏆 ${esc(x.name)}</h3><div>${esc(x.governorate||'')}</div><p class=muted>${esc(x.details||'')}</p><div>${esc(x.start_date||'')} — ${esc(x.end_date||'')}</div></article>`).join('')||'<div class=c>لا توجد دوريات معلنة حالياً.</div>'}function loadAll(){loadFacilities();loadTeams();loadLeagues()}init();</script></body></html>
