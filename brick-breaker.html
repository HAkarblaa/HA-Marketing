<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تكسير الطابوق</title><link rel="stylesheet" href="assets/ha-games-style.css"></head><body><div class="page"><div class="topbar"><div class="brand"><div class="logo">🧱</div><div><h1>تكسير الطابوق</h1><p>اكسر أكبر عدد ممكن من الطابوق بالمضرب والكرة</p></div></div><div class="row"><a class="btn secondary" href="games-hub.html">↩ الألعاب</a><button id="fullBtn" class="btn secondary">⛶ ملء الشاشة</button></div></div>
<div class="game-shell"><div id="stageHolder" class="stage-wrap"><canvas id="game" class="stage" width="480" height="720"></canvas></div><div class="side-panel"><div class="card"><h3>التحكم</h3><p>حرّك المضرب بالماوس/اللمس أو الأسهم. اكسر الطابوق واجمع النقاط. إذا سقطت الكرة تنتهي الجولة.</p><div class="row"><button id="startBtn" class="btn">▶ ابدأ</button><button id="restartBtn" class="btn secondary">↻ إعادة</button></div></div><div class="card"><div class="stat-grid"><div class="stat"><b id="score">0</b><span>النقاط</span></div><div class="stat"><b id="best">0</b><span>الأفضل</span></div><div class="stat"><b id="plays">0</b><span>اللعبات</span></div></div></div><div class="card"><h3>أفضل اللاعبين</h3><div id="leader" class="list"></div></div></div></div><footer>🧱 لعبة تكسير الطابوق</footer></div>
<script src="assets/ha-games-common.js"></script><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'); let run=false, anim=0, score=0,best=0; const paddle={x:200,y:660,w:110,h:16}; const ball={x:240,y:500,r:10,vx:4,vy:-5}; let bricks=[];
function makeBricks(){bricks=[]; const colors=['#f59e0b','#38bdf8','#f43f5e','#22c55e','#a78bfa']; for(let r=0;r<5;r++){for(let c=0;c<7;c++){bricks.push({x:30+c*60,y:80+r*38,w:52,h:24,alive:true,color:colors[r%colors.length]});}}}
function reset(){score=0; paddle.x=185; Object.assign(ball,{x:240,y:500,vx:4,vy:-5}); makeBricks(); updateStats(); draw();}
function updateStats(){const board=HAGames.getLeaderboard('brick-breaker'); const me=board.find(x=>x.userId===HAGames.detectUser().id); best=me?me.bestScore:best; document.getElementById('score').textContent=score; document.getElementById('best').textContent=best||0; document.getElementById('plays').textContent=me?me.playCount:0; HAGames.renderMiniLeaderboard(document.getElementById('leader'),'brick-breaker',8);}
function endGame(win=false){run=false; cancelAnimationFrame(anim); HAGames.beep(win?'win':'lose'); const p=HAGames.saveScore('brick-breaker','🧱 تكسير الطابوق',score,{win}); best=Math.max(best,p.bestScore||0); updateStats(); HAGames.toast(win?'فزت بالجولة!':'انتهت الجولة'); draw();}
function loop(){if(!run) return; ball.x+=ball.vx; ball.y+=ball.vy; if(ball.x<ball.r||ball.x>480-ball.r) ball.vx*=-1; if(ball.y<ball.r) ball.vy*=-1; if(ball.y>720+20) return endGame(false); if(ball.x>paddle.x&&ball.x<paddle.x+paddle.w&&ball.y+ball.r>paddle.y&&ball.y-ball.r<paddle.y+paddle.h){ball.vy=-Math.abs(ball.vy); ball.vx=((ball.x-(paddle.x+paddle.w/2))/18); HAGames.beep('tick');}
 let alive=0; bricks.forEach(b=>{if(!b.alive) return; alive++; if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){b.alive=false; ball.vy*=-1; score+=10; HAGames.beep('coin');}}); if(alive===0) return endGame(true); updateStats(); draw(); anim=requestAnimationFrame(loop);} 
function draw(){ctx.clearRect(0,0,480,720); ctx.fillStyle='#0b1020'; ctx.fillRect(0,0,480,720); bricks.forEach(b=>{if(!b.alive)return; ctx.fillStyle=b.color; ctx.fillRect(b.x,b.y,b.w,b.h);}); ctx.fillStyle='#f8fafc'; ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h); ctx.beginPath(); ctx.fillStyle='#38bdf8'; ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2); ctx.fill(); ctx.fillStyle='white'; ctx.font='bold 28px Tahoma'; ctx.fillText('النقاط: '+score,18,38); if(!run){ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillRect(0,0,480,720); ctx.fillStyle='white'; ctx.font='bold 34px Tahoma'; ctx.fillText(score>0?'انتهت الجولة':'اضغط ابدأ',155,340);}}
function moveClientX(clientX){const rect=canvas.getBoundingClientRect(); const x=(clientX-rect.left)*(canvas.width/rect.width); paddle.x=Math.max(0,Math.min(480-paddle.w,x-paddle.w/2));}
window.addEventListener('mousemove',e=>moveClientX(e.clientX)); window.addEventListener('touchmove',e=>{moveClientX(e.touches[0].clientX)},{passive:true}); window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft') paddle.x=Math.max(0,paddle.x-25); if(e.key==='ArrowRight') paddle.x=Math.min(480-paddle.w,paddle.x+25)}); document.getElementById('startBtn').onclick=()=>{reset();run=true;loop();}; document.getElementById('restartBtn').onclick=reset; HAGames.bindFullscreen(document.getElementById('fullBtn'),'#stageHolder'); reset();
</script></body></html>
