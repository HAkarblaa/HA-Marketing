<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أنا</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:linear-gradient(180deg,#f3f7ff,#fff)}.w{width:min(900px,94%);margin:20px auto}.hero{background:#111;color:#fff;border-radius:22px;padding:22px}.c{background:#fff;border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 3px 14px #0001}.g{display:grid;grid-template-columns:1fr 1fr;gap:9px}input,select,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px}textarea{min-height:80px;grid-column:1/-1}button,.b{border:0;background:#111;color:#fff;border-radius:10px;padding:11px 14px;text-decoration:none}.note{color:#667;line-height:1.7}@media(max-width:600px){.g{grid-template-columns:1fr}textarea{grid-column:auto}}</style></head><body><div class=w><a class=b href="index.html">← الرئيسية</a><div class=hero><h1>👤 أنا</h1><p>معلوماتي الشخصية والقياسات والحسابات المالية الأساسية في مكان واحد.</p></div><div class=c><h2>البيانات الشخصية</h2><div class=g><input id=full_name placeholder="الاسم الكامل"><input id=birth_date type=date><select id=gender><option value="">الجنس (اختياري)</option><option>ذكر</option><option>أنثى</option></select><input id=occupation placeholder="المهنة"><input id=employer placeholder="جهة العمل / الدراسة"><input id=governorate placeholder="المحافظة"><input id=height type=number placeholder="الطول سم"><input id=weight type=number placeholder="الوزن كغم"><select id=blood><option value="">فصيلة الدم (اختياري)</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select><input id=emergency placeholder="رقم طوارئ (اختياري)"><textarea id=notes placeholder="ملاحظات شخصية"></textarea></div><div id=bmi class=note></div></div><div class=c><h2>الحسابات المالية الأساسية</h2><div class=note>لا تدخل رقم بطاقة مصرفية كامل أو CVV أو رمز سري. احفظ فقط اسم البنك/المحفظة ومعرفاً مختصراً إذا تحتاجه.</div><div class=g><input id=income type=number placeholder="الدخل الشهري التقريبي"><input id=expenses type=number placeholder="المصروف الشهري التقريبي"><input id=bank placeholder="اسم البنك / المحفظة"><input id=finance_ref placeholder="معرف مختصر للحساب"><textarea id=finance_notes placeholder="ملاحظات مالية"></textarea></div></div><button onclick=save() style="width:100%">حفظ معلوماتي</button><div id=st class=c>جاري التحميل...</div></div><script>const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});
let me=null;async function init(){let {data:{session}}=await db.auth.getSession();if(!session)return location.href='login.html?next=personal-center.html';me=session.user;let {data:p,error}=await db.from('profiles').select('*').eq('id',me.id).maybeSingle();if(error)return st.textContent=error.message;p=p||{};['full_name','birth_date','gender','occupation','employer','governorate','blood_type','emergency_phone','personal_notes','monthly_income','monthly_expenses','bank_name','finance_ref','finance_notes'].forEach(k=>{let el=document.getElementById(k==='blood_type'?'blood':k==='emergency_phone'?'emergency':k==='personal_notes'?'notes':k==='monthly_income'?'income':k==='monthly_expenses'?'expenses':k==='bank_name'?'bank':k);if(el)el.value=p[k]??''});height.value=p.height_cm??'';weight.value=p.weight_kg??'';calcBMI();st.textContent='✅ جاهز للتعديل'}function calcBMI(){let h=+height.value/100,w=+weight.value;if(h&&w)bmi.textContent='BMI التقريبي: '+(w/(h*h)).toFixed(1);else bmi.textContent='أدخل الطول والوزن حتى يظهر BMI.'}height.oninput=weight.oninput=calcBMI;async function save(){let r={full_name:full_name.value.trim()||null,birth_date:birth_date.value||null,gender:gender.value||null,occupation:occupation.value.trim()||null,employer:employer.value.trim()||null,governorate:governorate.value.trim()||null,height_cm:+height.value||null,weight_kg:+weight.value||null,blood_type:blood.value||null,emergency_phone:emergency.value.trim()||null,personal_notes:notes.value.trim()||null,monthly_income:+income.value||null,monthly_expenses:+expenses.value||null,bank_name:bank.value.trim()||null,finance_ref:finance_ref.value.trim()||null,finance_notes:finance_notes.value.trim()||null};let {error}=await db.from('profiles').update(r).eq('id',me.id);st.textContent=error?'تعذر الحفظ: '+error.message:'✅ تم حفظ معلوماتك';calcBMI()}init();</script></body></html>
