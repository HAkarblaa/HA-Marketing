<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مقدمو الخدمة</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="ha-nearby.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f5f5}.wrap{width:94%;max-width:1100px;margin:22px auto}.btn{display:inline-block;background:#111;color:#fff;text-decoration:none;padding:10px 13px;border-radius:10px}.light{background:#eee;color:#111}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;background:#fff;padding:12px;border-radius:15px;margin:14px 0}.filters input,.filters select{padding:11px;border:1px solid #ccc;border-radius:10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 16px #0001}.img{width:100%;height:190px;object-fit:cover;border-radius:12px;background:#eee}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.muted{color:#666;line-height:1.7}.badge{background:#eee;padding:5px 8px;border-radius:999px}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr}}
.category-request{background:#fff;border-radius:16px;padding:14px;margin:14px 0;box-shadow:0 4px 16px #0001}
.category-request h2{margin:0 0 7px}.reqgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.reqgrid input,.reqgrid textarea,.reqgrid button{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;font:inherit}
.reqgrid textarea{grid-column:1/-1;min-height:95px;resize:vertical}.reqstatus{font-size:13px;line-height:1.7;margin-top:8px;color:#555}
@media(max-width:600px){.reqgrid{grid-template-columns:1fr}.reqgrid textarea{grid-column:auto}}

/* ===== SIMPLE SERVICE CATEGORY ===== */
.simple-filters{grid-template-columns:2fr 1fr!important;padding:9px!important}
.simple-request{padding:13px!important}
.request-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.request-title div{display:flex;flex-direction:column;gap:4px}
.request-title b{font-size:18px}
.request-title small{font-size:12px;color:#777}
.simple-reqgrid{grid-template-columns:1fr 1fr!important}
.simple-reqgrid textarea{grid-column:1/-1!important;min-height:82px!important}
.request-send{width:100%;margin-top:9px;font-size:16px;font-weight:800}
@media(max-width:600px){
  .simple-filters{grid-template-columns:1fr!important}
  .simple-reqgrid{grid-template-columns:1fr!important}
  .simple-reqgrid textarea{grid-column:auto!important}
}

</style><link rel="stylesheet" href="ha-premium-theme.css"><script src="ha-theme.js"></script>
<link rel="stylesheet" href="ha-theme.css">
</head><body><div class="wrap"><div class="row"><a class="btn light" href="services.html">← الأقسام</a><a class="btn" href="service-orders.html">📋 طلباتي</a></div><h1 id="title">مقدمو الخدمة</h1><div class="filters simple-filters">
  <input id="q" placeholder="🔎 ابحث باسم مقدم الخدمة أو المنطقة">
  <select id="avail"><option value="all">الكل</option><option value="yes">المتوفر الآن</option></select>
</div>
<div class="category-request simple-request">
  <div class="request-title">
    <div><b>📩 اطلب الخدمة بسرعة</b><small>املأ المعلومات الأساسية فقط</small></div>
  </div>
  <div class="reqgrid simple-reqgrid">
    <input id="reqName" placeholder="الاسم">
    <input id="reqPhone" placeholder="رقم الهاتف 07xxxxxxxxx" inputmode="tel">
    <input id="reqAddress" placeholder="المنطقة / العنوان">
    <textarea id="reqDetails" placeholder="شنو الخدمة اللي تحتاجها؟"></textarea>
  </div>
  <button id="reqSend" class="btn request-send" type="button">إرسال الطلب</button>
  <div id="reqStatus" class="reqstatus"></div>
  <input id="reqDate" type="hidden">
  <input id="reqTime" type="hidden">
  <button id="reqLoc" type="button" style="display:none"></button>
</div>
<div id="nearbyStatus" class="card" style="margin-bottom:10px">📍 جاري تحديد موقعك لعرض الأقرب أولاً...</div><div id="box" class="grid"><div class="card">جاري التحميل...</div></div></div><script>
const db=supabase.createClient(
  'https://ubayrhtshgtgggxprrek.supabase.co',
  'sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',
  {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}}
);

const categoryId=Number(new URLSearchParams(location.search).get('id'));
let rows=[],userPos=null,me=null,reqLat=null,reqLng=null,currentCategory=null;

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

function providerName(x){
  return x.name||x.full_name||'مقدم خدمة';
}

async function load(){
  if(!Number.isFinite(categoryId)||categoryId<=0){
    title.textContent='قسم غير صحيح';
    box.innerHTML='<div class="card">ارجع واختر نوع الخدمة من جديد.</div>';
    reqSend.disabled=true;
    return;
  }

  me=(await db.auth.getUser()).data.user||null;

  const [{data:c,error:catError},{data:p,error:providersError}]=await Promise.all([
    db.from('service_categories').select('id,name').eq('id',categoryId).eq('is_active',true).maybeSingle(),
    db.from('service_providers')
      .select('*')
      .eq('category_id',categoryId)
      .eq('is_active',true)
      .order('sort_order')
  ]);

  if(catError||!c){
    title.textContent='تعذر تحميل القسم';
    box.innerHTML='<div class="card">'+esc(catError?.message||'القسم غير موجود')+'</div>';
    reqSend.disabled=true;
    return;
  }

  currentCategory=c;
  title.textContent=c.name;

  if(me){
    const {data:pr}=await db.from('profiles')
      .select('full_name,phone,governorate')
      .eq('id',me.id)
      .maybeSingle();
    if(pr){
      reqName.value=pr.full_name||'';
      reqPhone.value=pr.phone||'';
      reqAddress.value=pr.governorate||'';
    }
  }

  if(providersError){
    box.innerHTML='<div class="card">'+esc(providersError.message)+'</div>';
    return;
  }

  rows=p||[];
  render();
  locateAndSort();
}

async function locateAndSort(){
  try{
    userPos=await HA_Nearby.getCurrent({allowCache:false});
    nearbyStatus.innerHTML='✅ يتم عرض مقدمي الخدمة الأقرب لموقعك أولاً <button class="btn light" onclick="locateAndSort()">تحديث</button>';
  }catch(e){
    nearbyStatus.innerHTML='📍 فعّل الموقع حتى نعرض الأقرب لك <button class="btn light" onclick="locateAndSort()">تحديد موقعي</button>';
  }
  render();
}

function render(){
  const search=q.value.trim();
  let a=rows.filter(x=>{
    const hay=[providerName(x),x.other_profession,x.area,x.address,x.governorate].filter(Boolean).join(' ');
    return (!search||hay.includes(search))
      && (avail.value!=='yes'||x.is_available);
  });

  if(userPos){
    a.forEach(x=>{
      const lat=Number(x.lat),lng=Number(x.lng);
      x._distance=(Number.isFinite(lat)&&Number.isFinite(lng))
        ?HA_Nearby.distanceKm(userPos,{lat,lng})
        :Infinity;
    });
    a.sort((x,y)=>(x._distance??Infinity)-(y._distance??Infinity));
  }

  box.innerHTML=a.length?a.map(x=>{
    const distance=userPos&&Number.isFinite(x._distance)
      ?`<div class="muted">🧭 يبعد عنك ${HA_Nearby.distanceText(x._distance)}</div>`:'';
    return `<div class="card">
      ${x.image_url?`<img class="img" src="${esc(x.image_url)}">`:''}
      <div class="row"><h2>${esc(providerName(x))}</h2>${x.is_verified?'<span class="badge">✅ معتمد</span>':''}</div>
      <div class="muted">🛠️ ${esc(currentCategory?.name||x.other_profession||'')}</div>
      <div class="muted">📍 ${esc([x.governorate,x.area,x.address].filter(Boolean).join(' - ')||'العنوان غير مضاف')}</div>
      ${distance}
      <div class="muted">${x.is_available?'🟢 متوفر':'🔴 غير متوفر'} ${x.price_from!=null?' • يبدأ من '+Number(x.price_from).toLocaleString('ar-IQ')+' د.ع':''}</div>
      <p>${esc(x.description||x.skills||'')}</p>
      <a class="btn" href="service-provider.html?id=${x.id}">عرض التفاصيل وطلب الخدمة</a>
    </div>`;
  }).join(''):'<div class="card">لا يوجد مقدمو خدمة بهذا القسم حالياً، لكن تقدر ترسل طلب عام للقسم أعلاه.</div>';
}

q.oninput=render;
avail.onchange=render;

reqLoc.onclick=async()=>{
  try{
    const pos=await HA_Nearby.getCurrent({allowCache:false});
    reqLat=pos.lat;reqLng=pos.lng;
    reqStatus.textContent='✅ تم تحديد موقعك.';
  }catch(e){
    reqStatus.textContent='تعذر تحديد الموقع. فعّل GPS والسماح بالموقع.';
  }
};

reqSend.onclick=async()=>{
  if(!me){
    location.href='login.html?next='+encodeURIComponent(location.href);
    return;
  }

  const n=reqName.value.trim();
  const ph=reqPhone.value.replace(/\D/g,'');
  const ad=reqAddress.value.trim();
  const de=reqDetails.value.trim();

  if(!n)return alert('اكتب الاسم');
  if(!/^07\d{9}$/.test(ph))return alert('رقم الهاتف يجب أن يبدأ بـ 07 ويتكون من 11 رقم');
  if(!ad)return alert('اكتب العنوان أو المنطقة');
  if(!de)return alert('اكتب تفاصيل الخدمة');
  if(!currentCategory)return alert('تعذر تحديد نوع الخدمة');

  reqSend.disabled=true;
  reqStatus.textContent='جاري إرسال الطلب...';

  const payload={
    customer_id:me.id,
    provider_id:null,
    category_id:categoryId,
    service_type:currentCategory.name,
    customer_name:n,
    phone:ph,
    address:ad,
    details:de,
    preferred_date:reqDate.value||null,
    preferred_time:reqTime.value.trim()||null,
    customer_lat:reqLat,
    customer_lng:reqLng,
    status:'new'
  };

  const {data,error}=await db.from('service_requests')
    .insert(payload)
    .select('id')
    .single();

  reqSend.disabled=false;

  if(error){
    reqStatus.textContent='❌ تعذر إرسال الطلب: '+error.message;
    return;
  }

  reqStatus.textContent='✅ تم إرسال الطلب لمقدمي خدمة '+currentCategory.name+' بنجاح. رقم الطلب: '+data.id;
  reqDetails.value='';
  setTimeout(()=>location.href='service-orders.html',900);
};

load();
</script></body></html>
