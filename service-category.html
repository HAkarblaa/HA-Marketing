<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مقدمو الخدمة</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f5f5}.wrap{width:94%;max-width:1100px;margin:22px auto}.btn{display:inline-block;background:#111;color:#fff;text-decoration:none;padding:10px 13px;border-radius:10px}.light{background:#eee;color:#111}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;background:#fff;padding:12px;border-radius:15px;margin:14px 0}.filters input,.filters select{padding:11px;border:1px solid #ccc;border-radius:10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 16px #0001}.img{width:100%;height:190px;object-fit:cover;border-radius:12px;background:#eee}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.muted{color:#666;line-height:1.7}.badge{background:#eee;padding:5px 8px;border-radius:999px}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="row"><a class="btn light" href="services.html">← الأقسام</a><a class="btn" href="service-orders.html">📋 طلباتي</a></div><h1 id="title">مقدمو الخدمة</h1><div class="filters"><input id="q" placeholder="🔎 الاسم أو المنطقة"><select id="gov"><option value="">كل المحافظات</option></select><select id="avail"><option value="all">الكل</option><option value="yes">متوفر الآن</option></select></div><div id="box" class="grid"><div class="card">جاري التحميل...</div></div></div><script>
const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll');const id=Number(new URLSearchParams(location.search).get('id'));let rows=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const [{data:c},{data:p,error}]=await Promise.all([db.from('service_categories').select('name').eq('id',id).maybeSingle(),db.from('service_providers').select('*').eq('category_id',id).eq('is_active',true).order('sort_order')]);title.textContent=c?.name||'مقدمو الخدمة';if(error){box.textContent=error.message;return}rows=p||[];[...new Set(rows.map(x=>x.governorate).filter(Boolean))].forEach(v=>gov.insertAdjacentHTML('beforeend',`<option>${esc(v)}</option>`));render()}function render(){const s=q.value.trim();let a=rows.filter(x=>(!s||(x.name+' '+(x.area||'')+' '+(x.address||'')).includes(s))&&(!gov.value||x.governorate===gov.value)&&(avail.value!=='yes'||x.is_available));box.innerHTML=a.length?a.map(x=>`<div class="card">${x.image_url?`<img class="img" src="${esc(x.image_url)}">`:''}<div class="row"><h2>${esc(x.name)}</h2>${x.is_verified?'<span class="badge">✅ موثّق</span>':''}</div><div class="muted">📍 ${esc([x.governorate,x.area,x.address].filter(Boolean).join(' - ')||'العنوان غير مضاف')}</div><div class="muted">${x.is_available?'🟢 متوفر':'🔴 غير متوفر'} ${x.price_from!=null?' • يبدأ من '+Number(x.price_from).toLocaleString('ar-IQ')+' د.ع':''}</div><p>${esc(x.description||'')}</p><a class="btn" href="service-provider.html?id=${x.id}">عرض التفاصيل وطلب الخدمة</a></div>`).join(''):'<div class="card">لا يوجد مقدمو خدمة مطابقون.</div>'}q.oninput=render;gov.onchange=render;avail.onchange=render;load();
</script></body></html>
