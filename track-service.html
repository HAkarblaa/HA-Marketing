<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تتبع الموظف - HA Marketing</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f5f5f5;color:#111}
.wrap{width:94%;max-width:900px;margin:25px auto}
h1{text-align:center}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 4px 16px #0001;margin:14px 0}
.status{padding:13px;border-radius:10px;background:#fff;text-align:center;margin-bottom:14px}
.info{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info div{background:#f7f7f7;border-radius:10px;padding:12px}
#map{width:100%;height:470px;border-radius:14px;overflow:hidden;margin-top:14px;display:none}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:9px;margin-top:12px;text-align:center;text-decoration:none;font-size:16px;cursor:pointer}
.primary{background:#111;color:#fff}
.light{background:#eaeaea;color:#111}
.small{color:#666;font-size:14px;line-height:1.7}
@media(max-width:600px){
 #map{height:390px}
 .info{grid-template-columns:1fr}
}
</style>
</head>

<body>
<div class="wrap">

<h1>📍 تتبع الموظف</h1>

<div id="pageStatus" class="status">جاري تحميل بيانات الطلب...</div>

<div id="trackingCard" class="card" style="display:none">
  <div class="info">
    <div><strong>حالة الطلب:</strong><br><span id="orderStatus">-</span></div>
    <div><strong>آخر تحديث:</strong><br><span id="lastUpdate">-</span></div>
  </div>

  <div id="map"></div>

  <p class="small">
    تظهر الخريطة عندما تكون حالة الطلب «بالطريق» وتتوفر إحداثيات العميل والموظف.
    يتم تحديث البيانات تلقائياً أثناء فتح الصفحة.
  </p>

  <button id="refreshBtn" class="btn primary" type="button">🔄 تحديث الموقع الآن</button>
</div>

<a class="btn light" href="account.html">← الرجوع إلى الحساب</a>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const db=supabase.createClient(
 'https://ubayrhtshgtgggxprrek.supabase.co',
 'sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll'
);

const params=new URLSearchParams(location.search);
const orderId=params.get('order');

let currentUser=null;
let map=null;
let customerMarker=null;
let employeeMarker=null;
let routeLine=null;
let refreshTimer=null;

async function init(){
 const {data}=await db.auth.getUser();
 currentUser=data.user||null;

 if(!currentUser){
  pageStatus.textContent='يجب تسجيل الدخول أولاً.';
  setTimeout(()=>location.href='login.html',1200);
  return;
 }

 if(!orderId){
  pageStatus.textContent='رقم الطلب غير موجود.';
  return;
 }

 trackingCard.style.display='block';
 await loadOrder();

 refreshTimer=setInterval(loadOrder,5000);
}

async function loadOrder(){
 const {data,error}=await db
  .from('service_orders')
  .select('id,user_id,status,customer_lat,customer_lng,employee_lat,employee_lng,updated_at,created_at')
  .eq('id',orderId)
  .eq('user_id',currentUser.id)
  .maybeSingle();

 if(error){
  pageStatus.textContent='تعذر تحميل الطلب: '+error.message;
  return;
 }

 if(!data){
  pageStatus.textContent='الطلب غير موجود أو لا تملك صلاحية عرضه.';
  return;
 }

 orderStatus.textContent=data.status||'-';

 const updateTime=data.updated_at||data.created_at;
 lastUpdate.textContent=updateTime
  ? new Date(updateTime).toLocaleString('ar-IQ')
  : '-';

 if(data.status!=='بالطريق'){
  pageStatus.textContent='التتبع غير متاح حالياً. حالة الطلب: '+(data.status||'-');
  document.getElementById('map').style.display='none';
  return;
 }

 const customerReady=
  Number.isFinite(Number(data.customer_lat)) &&
  Number.isFinite(Number(data.customer_lng));

 const employeeReady=
  Number.isFinite(Number(data.employee_lat)) &&
  Number.isFinite(Number(data.employee_lng));

 if(!customerReady){
  pageStatus.textContent='بانتظار تسجيل موقع العميل لهذا الطلب.';
  return;
 }

 if(!employeeReady){
  pageStatus.textContent='الموظف بالطريق، وبانتظار بدء مشاركة موقعه.';
  showMap(
   Number(data.customer_lat),
   Number(data.customer_lng),
   null,
   null
  );
  return;
 }

 pageStatus.textContent='🟢 التتبع مباشر — يتم تحديث موقع الموظف تلقائياً.';

 showMap(
  Number(data.customer_lat),
  Number(data.customer_lng),
  Number(data.employee_lat),
  Number(data.employee_lng)
 );
}

function showMap(customerLat,customerLng,employeeLat,employeeLng){
 const mapBox=document.getElementById('map');
 mapBox.style.display='block';

 if(!map){
  map=L.map('map').setView([customerLat,customerLng],15);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
   maxZoom:19,
   attribution:'&copy; OpenStreetMap contributors'
  }).addTo(map);
 }

 if(!customerMarker){
  customerMarker=L.marker([customerLat,customerLng])
   .addTo(map)
   .bindPopup('📍 موقع العميل');
 }else{
  customerMarker.setLatLng([customerLat,customerLng]);
 }

 if(employeeLat!==null && employeeLng!==null){
  if(!employeeMarker){
   employeeMarker=L.marker([employeeLat,employeeLng])
    .addTo(map)
    .bindPopup('🚗 موقع الموظف');
  }else{
   employeeMarker.setLatLng([employeeLat,employeeLng]);
  }

  const points=[
   [customerLat,customerLng],
   [employeeLat,employeeLng]
  ];

  if(routeLine){
   routeLine.setLatLngs(points);
  }else{
   routeLine=L.polyline(points).addTo(map);
  }

  map.fitBounds(L.latLngBounds(points),{padding:[45,45]});
 }else{
  map.setView([customerLat,customerLng],16);
 }

 setTimeout(()=>map.invalidateSize(),100);
}

document.getElementById('refreshBtn').addEventListener('click',loadOrder);

window.addEventListener('beforeunload',()=>{
 if(refreshTimer)clearInterval(refreshTimer);
});

init();
</script>
</body>
</html>
