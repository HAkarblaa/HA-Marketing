<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تتبع الخدمة</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{font-family:Arial;background:#f5f5f5;margin:0;direction:rtl}.wrap{width:94%;max-width:900px;margin:25px auto}.card{background:#fff;padding:18px;border-radius:16px}#map{height:480px;border-radius:14px;margin-top:14px}.btn{display:block;padding:13px;background:#eee;color:#111;text-decoration:none;text-align:center;border-radius:10px;margin-top:12px}</style></head><body><div class="wrap"><div class="card"><h1>📍 تتبع الموظف</h1><p id="status">جاري تحميل الطلب...</p><div id="map"></div><a class="btn" href="account.html">← حسابي</a></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll');const id=new URLSearchParams(location.search).get('order');let map=L.map('map').setView([33.3,44.4],6),cm=null,em=null,line=null;L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);async function load(){const {data:u}=await db.auth.getUser();if(!u?.user||!id){status.textContent='يجب تسجيل الدخول';return}const {data:o,error}=await db.from('orders').select('id,status,customer_lat,customer_lng,employee_lat,employee_lng').eq('id',id).eq('customer_id',u.user.id).maybeSingle();if(error||!o){status.textContent='تعذر تحميل الطلب';return}status.textContent='حالة الطلب: '+({new:'جديد',accepted:'مقبول',on_the_way:'بالطريق',completed:'مكتمل',cancelled:'ملغي'}[o.status]||o.status);if(o.customer_lat==null||o.customer_lng==null)return;const c=[o.customer_lat,o.customer_lng];if(!cm)cm=L.marker(c).addTo(map).bindPopup('موقعك');else cm.setLatLng(c);if(o.employee_lat!=null&&o.employee_lng!=null){const e=[o.employee_lat,o.employee_lng];if(!em)em=L.marker(e).addTo(map).bindPopup('موقع الموظف');else em.setLatLng(e);if(!line)line=L.polyline([c,e]).addTo(map);else line.setLatLngs([c,e]);map.fitBounds([c,e],{padding:[40,40]})}else map.setView(c,16)}load();setInterval(load,5000);
</script></body></html>
