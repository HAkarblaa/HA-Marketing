<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة المحتوى</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{font-family:Arial;background:#f4f5f7;margin:0}.wrap{width:min(900px,94%);margin:20px auto}.box{background:#fff;padding:16px;border-radius:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select,textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px}textarea{min-height:100px}.btn{border:0;border-radius:10px;padding:11px 16px;background:#111;color:#fff}.item{border-top:1px solid #eee;padding:12px 0}.danger{background:#b00020}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><a href="admin-panel.html">← لوحة الأدمن</a><h1>📝 إدارة الأخبار والمحتوى</h1><div class="box"><div class="grid"><select id="section"><option value="news">الأخبار</option><option value="sports">الرياضة</option><option value="religious">الديني</option><option value="entertainment">الترفيه</option></select><input id="category" placeholder="التصنيف: محلي، رياضة..."><input id="title" placeholder="العنوان"><input id="image" placeholder="رابط الصورة"><input id="sourceName" placeholder="اسم المصدر"><input id="sourceUrl" placeholder="رابط المصدر"></div><textarea id="summary" placeholder="ملخص"></textarea><textarea id="body" placeholder="التفاصيل"></textarea><label><input id="breaking" type="checkbox" style="width:auto"> عاجل</label> <label><input id="featured" type="checkbox" style="width:auto"> مميز</label><br><br><button class="btn" onclick="save()">إضافة المحتوى</button></div><div class="box"><h2>المحتوى المضاف</h2><div id="list">تحميل...</div></div></div><script>
const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});
let me=null,isSuper=false,allowed=new Set();
const LABELS={news:'الأخبار',sports:'الرياضة',religious:'الديني',entertainment:'الترفيه'};
async function init(){
 const {data:{session}}=await db.auth.getSession(); if(!session)return location.href='login.html'; me=session.user;
 const {data:a}=await db.from('app_admins').select('is_super_admin,is_active').eq('user_id',me.id).maybeSingle();
 if(!a?.is_active && me.id!=='f65185bb-1761-42c0-b358-1b0277555e24')return deny();
 isSuper=!!a?.is_super_admin || me.id==='f65185bb-1761-42c0-b358-1b0277555e24';
 if(isSuper){Object.keys(LABELS).forEach(x=>allowed.add(x));}
 else{
  const {data:p}=await db.from('app_admin_permissions').select('section_key,can_manage,can_create,can_edit,can_delete').eq('admin_user_id',me.id);
  (p||[]).forEach(x=>{if(LABELS[x.section_key]&&(x.can_manage||x.can_create||x.can_edit||x.can_delete))allowed.add(x.section_key)});
 }
 if(!allowed.size)return deny();
 section.innerHTML=[...allowed].map(k=>`<option value="${k}">${LABELS[k]}</option>`).join('');
 const wanted=new URLSearchParams(location.search).get('section'); if(wanted&&allowed.has(wanted))section.value=wanted;
 section.onchange=load; await load();
}
function deny(){document.body.innerHTML='<h2 style="text-align:center;margin-top:60px">لا تملك صلاحية إدارة هذا القسم</h2>'}
async function save(){if(!allowed.has(section.value))return alert('لا توجد صلاحية لهذا القسم');let {error}=await db.from('content_posts').insert({section:section.value,category:category.value.trim()||'عام',title:title.value.trim(),summary:summary.value.trim(),body:body.value.trim(),image_url:image.value.trim()||null,source_name:sourceName.value.trim()||null,source_url:sourceUrl.value.trim()||null,is_breaking:breaking.checked,is_featured:featured.checked,created_by:me.id});if(error)return alert(error.message);title.value=summary.value=body.value=image.value=sourceName.value=sourceUrl.value='';load()}
async function load(){if(!allowed.has(section.value))return;let {data,error}=await db.from('content_posts').select('*').eq('section',section.value).order('published_at',{ascending:false}).limit(150);if(error)return list.textContent=error.message;list.innerHTML=(data||[]).map(x=>`<div class="item"><b>${x.title}</b> — ${x.category} <button class="btn danger" onclick="del(${x.id},'${x.section}')">حذف</button></div>`).join('')||'لا يوجد محتوى'}
async function del(id,sec){if(!allowed.has(sec))return alert('لا توجد صلاحية لهذا القسم');if(!confirm('حذف؟'))return;let {error}=await db.from('content_posts').delete().eq('id',id).eq('section',sec);if(error)alert(error.message);else load()}
init();
</script></body></html>
