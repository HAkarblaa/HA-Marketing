<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل الدخول - HA Marketing</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f5f5}.box{width:92%;max-width:480px;margin:60px auto;background:#fff;padding:25px;border-radius:18px;box-shadow:0 5px 20px #0001}
h1{text-align:center}input,button,a{width:100%;padding:13px;margin:7px 0;border-radius:10px;font-size:16px;box-sizing:border-box}input{border:1px solid #ccc}button{border:0;background:#111;color:#fff;cursor:pointer}
a{display:block;text-align:center;text-decoration:none;background:#eee;color:#111}</style></head><body><div class="box">
<h1>تسجيل الدخول</h1><input id="phone" type="tel" placeholder="رقم الموبايل"><input id="password" type="password" placeholder="الرقم السري">
<button onclick="login()">تسجيل الدخول</button><a href="forgot-password.html" style="background:#fff;color:#111;border:1px solid #ddd">هل نسيت كلمة المرور؟</a><button onclick="guestLogin()" style="background:#666">الدخول كضيف</button>
<a href="register.html">إنشاء حساب جديد</a><a href="index.html">الرجوع للرئيسية</a></div>
<script>const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll');
function normalizePhone(v){let p=v.replace(/\D/g,'');if(p.startsWith('0'))p='964'+p.slice(1);if(!p.startsWith('964'))p='964'+p;return p}
function authEmail(p){return 'u'+p+'@ha.local'}
async function login(){const p=normalizePhone(phone.value.trim());if(!phone.value.trim()||!password.value){alert('اكتب رقم الموبايل والرقم السري');return}
const {error}=await db.auth.signInWithPassword({email:authEmail(p),password:password.value});if(error)alert('بيانات الدخول غير صحيحة');else{localStorage.setItem('ha_logged_in','1');location.href='index.html';}}
async function guestLogin(){const {error}=await db.auth.signInAnonymously();if(error)alert(error.message);else{localStorage.setItem('ha_logged_in','1');location.href='index.html';}}
</script></body></html>
