<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل الدخول - HA Marketing</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f5f5}.box{width:92%;max-width:480px;margin:60px auto;background:#fff;padding:25px;border-radius:18px;box-shadow:0 5px 20px #0001}
h1{text-align:center}input,button,a{width:100%;padding:13px;margin:7px 0;border-radius:10px;font-size:16px;box-sizing:border-box}input{border:1px solid #ccc}button{border:0;background:#111;color:#fff;cursor:pointer}
a{display:block;text-align:center;text-decoration:none;background:#eee;color:#111}
button:disabled{opacity:.65;cursor:not-allowed}
.ha-loading{position:fixed;inset:0;background:rgba(255,255,255,.90);z-index:99999;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px}
.ha-loading.show{display:flex}.ha-spinner{width:54px;height:54px;border:5px solid #ddd;border-top-color:#111;border-radius:50%;animation:haSpin .8s linear infinite}.ha-load-text{font-weight:700;font-size:16px;color:#222}
@keyframes haSpin{to{transform:rotate(360deg)}}
</style></head><body><div class="box">
<h1>تسجيل الدخول</h1><input id="phone" type="tel" placeholder="رقم الموبايل"><input id="password" type="password" placeholder="الرقم السري">
<button id="loginBtn" onclick="login()">تسجيل الدخول</button><a href="forgot-password.html" style="background:#fff;color:#111;border:1px solid #ddd">هل نسيت كلمة المرور؟</a>
<a href="register.html">إنشاء حساب جديد</a><a href="index.html">الرجوع للرئيسية</a></div><div id="haLoading" class="ha-loading" aria-live="polite"><div class="ha-spinner"></div><div id="haLoadText" class="ha-load-text">جاري التحقق...</div></div>
<script>
const SB_URL='https://ubayrhtshgtgggxprrek.supabase.co';
const SB_KEY='sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll';

function migrateLegacyAuth(){
  try{
    const target='ha-marketing-auth';
    if(localStorage.getItem(target)) return;
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i)||'';
      if(/^sb-.*-auth-token$/.test(k)){
        const v=localStorage.getItem(k);
        if(v){ localStorage.setItem(target,v); break; }
      }
    }
  }catch(e){ console.warn('auth migration',e); }
}
migrateLegacyAuth();
const db=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});
function normalizePhone(v){let p=String(v||'').replace(/\D/g,'');if(p.startsWith('0'))p='964'+p.slice(1);if(!p.startsWith('964'))p='964'+p;return p}
function localPhone(v){const d=String(v||'').replace(/\D/g,'');if(d.startsWith('964'))return '0'+d.slice(3);return d}
function authEmail(p){return 'u'+p+'@ha.local'}
function validUsername(v){return /^[\x21-\x7E]{6,40}$/.test(v)}
async function persistLoginFlag(){const {data}=await db.auth.getSession();if(data.session){localStorage.setItem('ha_logged_in','1');return data.session}localStorage.removeItem('ha_logged_in');return null}
async function ensureProfile(user, fallback={}){
  if(!user||user.is_anonymous)return;
  const m=user.user_metadata||{};
  const row={
    id:user.id,
    full_name:fallback.full_name??m.full_name??null,
    phone:fallback.phone??m.phone??null,
    username:fallback.username??m.username??null,
    avatar_url:fallback.avatar_url??m.avatar_url??null,
    governorate:fallback.governorate??m.governorate??null,
    account_type:fallback.account_type??m.account_type??'customer',
    employee_role:fallback.employee_role??m.employee_role_key??m.employee_role??null,
    employee_status:(fallback.account_type??m.account_type)==='employee'?'pending':'not_applicable'
  };
  const {data:existing}=await db.from('profiles').select('id').eq('id',user.id).maybeSingle();
  if(existing){
    await db.from('profiles').update({full_name:row.full_name,phone:row.phone,username:row.username,avatar_url:row.avatar_url,governorate:row.governorate}).eq('id',user.id);
  }else{
    await db.from('profiles').insert(row);
  }
}

function showLoading(text='جاري التحميل...'){haLoadText.textContent=text;haLoading.classList.add('show');if(window.loginBtn)loginBtn.disabled=true}
function hideLoading(){haLoading.classList.remove('show');if(window.loginBtn)loginBtn.disabled=false}
async function login(){
 const raw=phone.value.trim(),pass=password.value;
 if(!raw||!pass){alert('اكتب رقم الموبايل والرقم السري');return}
 const lp=localPhone(raw);if(!/^07\d{9}$/.test(lp)){alert('اكتب رقم موبايل عراقي صحيح يبدأ بـ 07 ويتكون من 11 رقم.');return}
 const p=normalizePhone(lp);
 showLoading('جاري تسجيل الدخول...');
 try{
  const {data,error}=await db.auth.signInWithPassword({email:authEmail(p),password:pass});
  if(error||!data.session){localStorage.removeItem('ha_logged_in');hideLoading();alert('بيانات الدخول غير صحيحة');return}
  if(data.user?.is_anonymous){await db.auth.signOut();localStorage.removeItem('ha_logged_in');hideLoading();alert('الدخول كضيف غير متاح. سجّل دخول بحسابك.');return}
  await ensureProfile(data.user);
  await persistLoginFlag();
  haLoadText.textContent='تم تسجيل الدخول، جاري فتح الموقع...';
  location.replace('index.html');
 }catch(e){hideLoading();alert('تعذر تسجيل الدخول حالياً. تحقق من الإنترنت وحاول مرة ثانية.');}
}
(async()=>{
 showLoading('جاري التحقق من الحساب...');
 try{
  const s=await persistLoginFlag();
  if(s?.user?.is_anonymous){await db.auth.signOut();localStorage.removeItem('ha_logged_in');}
 }catch(e){}
 hideLoading();
})();

</script></body></html>
