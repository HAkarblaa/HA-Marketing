<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسوق الآن - HA Marketing</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="ha-nearby.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f5f5f5;color:#111}.wrap{width:94%;max-width:980px;margin:24px auto}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.btn{background:#111;color:#fff;text-decoration:none;border-radius:10px;padding:10px 13px;display:inline-block}.light{background:#eee;color:#111}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:18px}.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 16px #0001;text-decoration:none;color:#111}.card img{width:100%;height:150px;object-fit:cover;background:#eee}.body{padding:12px}.body h3{margin:0 0 7px}.muted{color:#666;font-size:13px;line-height:1.6}.empty{background:#fff;border-radius:16px;padding:25px;text-align:center;margin-top:18px}.legacy{margin:12px 0}.legacy a{display:block;text-align:center;background:#fff;padding:13px;border-radius:12px;text-decoration:none;color:#111;box-shadow:0 3px 12px #0001}@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card img{height:120px}}</style><link rel="stylesheet" href="ha-premium-theme.css"></head><body><div class="wrap"><div class="top"><a class="btn light" href="shop.html">← رجوع</a><h2 id="title">تسوق الآن</h2><span></span></div><div id="nearbyStatus" class="legacy"><a href="#" onclick="refreshNearby();return false">📍 جاري تحديد موقعك لعرض الأقرب أولاً...</a></div><div id="legacy" class="legacy"></div><div id="list" class="grid"></div></div><script>
const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});
const SECTIONS={library:['📚','مكتبة'],building_materials:['🏗️','مواد البناء'],cards_credit:['💳','بطاقات وأرصدة'],yugioh:['🃏','أوراق يوغي'],markets:['🛒','أسواق'],restaurants:['🍽️','مطاعم'],flowers:['💐','ورد'],home_appliances:['🏠','أجهزة منزلية'],printers:['🖨️','طابعات'],devices:['📱','أجهزة'],device_accessories:['🎧','إكسسوارات الأجهزة'],clothes:['👕','ملابس'],shoes:['👟','أحذية']};
const section=new URLSearchParams(location.search).get('section')||'';
let rows=[],userPos=null;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){
  let a=[...rows];
  if(userPos){
    a.forEach(x=>x._distance=HA_Nearby.distanceKm(userPos,{lat:x.lat,lng:x.lng}));
    a.sort((x,y)=>{
      const dx=Number.isFinite(x._distance)?x._distance:Infinity;
      const dy=Number.isFinite(y._distance)?y._distance:Infinity;
      if(dx!==dy)return dx-dy;
      return Number(x.sort_order||100)-Number(y.sort_order||100);
    });
  }
  list.innerHTML=a.map(x=>{
    const dist=userPos&&Number.isFinite(x._distance)
      ? `<div class="muted">🧭 يبعد عنك ${HA_Nearby.distanceText(x._distance)}</div>`:'';
    return `<a class="card" href="shop-business.html?id=${x.id}">
      <img src="${esc(x.image_url||'main.jpg')}" alt="">
      <div class="body">
        <h3>${esc(x.name)}</h3>
        <div class="muted">📍 ${esc(x.location_text||'الموقع غير محدد')}</div>
        ${dist}
        ${x.description?`<div class="muted">${esc(x.description).slice(0,100)}</div>`:''}
      </div>
    </a>`;
  }).join('')||'<div class="empty" style="grid-column:1/-1">لا توجد إضافات في هذا القسم حالياً.</div>';
}
async function refreshNearby(){
  nearbyStatus.innerHTML='<a href="#">📍 جاري تحديد موقعك...</a>';
  try{
    userPos=await HA_Nearby.getCurrent({allowCache:false});
    nearbyStatus.innerHTML='<a href="#" onclick="refreshNearby();return false">✅ المحلات مرتبة حسب الأقرب لموقعك — تحديث الموقع</a>';
    render();
  }catch(e){
    nearbyStatus.innerHTML='<a href="#" onclick="refreshNearby();return false">📍 فعّل الموقع لعرض الأقرب لك</a>';
    render();
  }
}
async function init(){
  const info=SECTIONS[section];
  if(!info){title.textContent='قسم غير موجود';list.innerHTML='<div class="empty">تعذر تحديد القسم.</div>';return}
  title.textContent=info[0]+' '+info[1];
  document.title=info[1]+' - HA Marketing';
  if(section==='building_materials')legacy.innerHTML='<a href="store.html?category=building_materials">🛍️ فتح منتجات مواد البناء مباشرة</a>';
  if(section==='yugioh')legacy.innerHTML='<a href="store.html?category=yugioh">🛍️ فتح منتجات أوراق يوغي مباشرة</a>';

  const {data,error}=await db.from('shop_businesses').select('*').eq('section_key',section).eq('is_active',true).order('sort_order').order('created_at');
  if(error){list.innerHTML='<div class="empty">تعذر تحميل المحلات حالياً.</div>';return}
  rows=data||[];
  render();
  refreshNearby();
}
init();</script></body></html>
