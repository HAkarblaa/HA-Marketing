<!doctype html><html lang="ar" dir="rtl"><head>
<script id="ha-daylight-boot">(function(){try{var r=document.documentElement;r.setAttribute('data-ha-theme','light');r.style.colorScheme='light';['ha_theme_mode_v2','ha_theme_mode','ha-theme','theme'].forEach(function(k){localStorage.setItem(k,'light')});}catch(e){}})();</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدرسو الصف - HA Marketing</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#06090c;color:#fff;min-height:100vh}.wrap{width:min(94%,920px);margin:16px auto 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.back{padding:10px 13px;border-radius:12px;background:#151b20;border:1px solid #34414c;color:#fff;text-decoration:none}.hero{margin:16px 0 12px;padding:16px;border-radius:20px;background:linear-gradient(145deg,#12191e,#090d10);border:1px solid rgba(239,199,104,.32);text-align:center}.hero h1{margin:0 0 6px;color:#f0c86b;font-size:24px}.hero p{margin:0;color:#aeb7bf;font-size:12px}.branches{display:none;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0 14px}.branches.show{display:grid}.branch{border:1px solid #3c4954;background:#10161b;color:#dfe5ea;border-radius:12px;padding:10px 5px;font:inherit;cursor:pointer}.branch.on{border-color:#d5a944;color:#f0c86b;background:#1a160e}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.teacher{min-height:220px;border-radius:20px;background:linear-gradient(145deg,#11181d,#080c0f);border:1px solid #37444f;padding:13px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;box-shadow:0 8px 24px #0005}.avatar{width:72px;height:72px;border-radius:20px;background:#0b1115;border:1px solid rgba(239,199,104,.4);display:grid;place-items:center;font-size:35px;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.teacher h2{margin:0;font-size:16px;color:#f5cf76}.teacher .subject{font-size:12px;color:#fff}.teacher small{font-size:9px;color:#aeb7bf;line-height:1.5}.btn{margin-top:auto;width:100%;min-height:42px;border:1px solid #966f25;border-radius:13px;background:#17130c;color:#f2ca6c;font:inherit;font-weight:800;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center}.btn.lock{border-color:#35434f;background:#0b1115;color:#8f9ba5}.btn.ok{border-color:#2f8152;background:#0c2115;color:#83e6a5}.empty{grid-column:1/-1;padding:35px 15px;text-align:center;color:#aeb7bf;border:1px solid #2f3c47;border-radius:18px;background:#0c1115}@media(max-width:650px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.teacher{min-height:200px;padding:10px}.avatar{width:62px;height:62px}.teacher h2{font-size:14px}.branches{grid-template-columns:repeat(4,1fr)}}@media(max-width:380px){.grid{grid-template-columns:1fr 1fr}.teacher{min-height:185px}}</style><script src="ha-theme.js?v=20260925-v3"></script><link rel="stylesheet" href="ha-theme.css?v=20260925-v3"><link rel="stylesheet" href="ha-daylight-force.css?v=20260925-v3">
</head><body><div class="wrap"><div class="top"><a class="back" id="backLink" href="courses.html">← الصفوف</a><b>HA Marketing</b><a class="back" href="teacher-classes.html">👨‍🏫 مدرس</a></div><div class="hero"><h1 id="pageTitle">المدرسون</h1><p>الانضمام للكلاس يتم فقط من خلال دعوة يرسلها المدرس إلى حسابك</p></div><div class="branches" id="branches"><button class="branch on" data-branch="">الكل</button><button class="branch" data-branch="علمي">علمي</button><button class="branch" data-branch="أدبي">أدبي</button><button class="branch" data-branch="مهني">مهني</button></div><div class="grid" id="teachers"><div class="empty">جاري التحميل...</div></div></div>
<script>
const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});
const p=new URLSearchParams(location.search),mode=p.get('mode')||'online',grade=p.get('grade')||'primary1';let branch='';let me=null,myEmail='';let invites=[],members=[];
const MODES={online:'أونلاين',inperson:'حضوري',both:'كلاهما'};const GRADES={primary1:'الأول الابتدائي',primary2:'الثاني الابتدائي',primary3:'الثالث الابتدائي',primary4:'الرابع الابتدائي',primary5:'الخامس الابتدائي',primary6:'السادس الابتدائي',middle1:'الأول المتوسط',middle2:'الثاني المتوسط',middle3:'الثالث المتوسط',prep4:'الرابع الإعدادي',prep5:'الخامس الإعدادي',prep6:'السادس الإعدادي'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('backLink').href=mode==='online'?'courses-online.html':mode==='inperson'?'courses-inperson.html':'courses-both.html';document.getElementById('pageTitle').textContent=`${MODES[mode]||mode} — ${GRADES[grade]||grade}`;
if(grade.startsWith('prep'))document.getElementById('branches').classList.add('show');
document.querySelectorAll('.branch').forEach(b=>b.onclick=()=>{document.querySelectorAll('.branch').forEach(x=>x.classList.remove('on'));b.classList.add('on');branch=b.dataset.branch||'';loadClasses()});
async function auth(){const {data:{session}}=await db.auth.getSession();me=session?.user||null;myEmail=(me?.email||'').toLowerCase();if(me){const a=await db.from('study_class_invites').select('id,class_id,status,invited_email').eq('invited_email',myEmail);if(!a.error)invites=a.data||[];const m=await db.from('study_class_members').select('class_id').eq('student_user_id',me.id);if(!m.error)members=m.data||[];}}
function inviteFor(id){return invites.find(x=>String(x.class_id)===String(id)&&x.status==='pending')}function memberOf(id){return members.some(x=>String(x.class_id)===String(id))}
async function loadClasses(){const el=document.getElementById('teachers');el.innerHTML='<div class="empty">جاري التحميل...</div>';let q=db.from('study_classes').select('*').eq('mode',mode).eq('grade_key',grade).eq('is_active',true).order('created_at',{ascending:false});if(branch)q=q.eq('branch',branch);const {data,error}=await q;if(error){el.innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}const classes=data||[];if(!classes.length){el.innerHTML='<div class="empty">لا توجد كلاسات مضافة لهذا الصف حالياً.</div>';return}const ids=[...new Set(classes.map(x=>x.teacher_user_id))];let teachers={};if(ids.length){const t=await db.from('study_teachers').select('user_id,display_name,image_url,subject').in('user_id',ids);(t.data||[]).forEach(x=>teachers[x.user_id]=x)}el.innerHTML=classes.map(c=>{const t=teachers[c.teacher_user_id]||{};const inv=inviteFor(c.id),joined=memberOf(c.id);let action;if(joined)action=`<a class="btn ok" href="study-class.html?class=${c.id}">✅ دخول الكلاس</a>`;else if(inv)action=`<button class="btn" onclick="acceptInvite(${inv.id},${c.id})">✉️ قبول الدعوة والانضمام</button>`;else if(!me)action='<a class="btn lock" href="login.html">🔐 سجل الدخول لعرض الدعوات</a>';else action='<div class="btn lock">🔒 الانضمام بالدعوة فقط</div>';return `<div class="teacher"><div class="avatar">${t.image_url?`<img src="${esc(t.image_url)}" alt="">`:'👨‍🏫'}</div><h2>${esc(t.display_name||'مدرس')}</h2><div class="subject">${esc(c.subject||t.subject||c.class_name||'كلاس دراسي')}</div><small>${esc(c.class_name||'')}${c.branch?' • '+esc(c.branch):''}</small>${action}</div>`}).join('')}
async function acceptInvite(inviteId,classId){if(!me)return location.href='login.html';const {data,error}=await db.rpc('accept_study_class_invite',{p_invite_id:inviteId});if(error)return alert(error.message);location.href='study-class.html?class='+classId}
(async()=>{await auth();await loadClasses()})();
</script></body></html>
