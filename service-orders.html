<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلبات الخدمات</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:Arial;background:#f5f5f5}.wrap{width:94%;max-width:900px;margin:22px auto}.card{background:#fff;border-radius:15px;padding:15px;margin:12px 0}.btn,button{border:0;background:#111;color:#fff;padding:10px 13px;border-radius:9px;text-decoration:none}.danger{background:#9b1733}.muted{color:#666;line-height:1.8}.badge{background:#eee;padding:5px 8px;border-radius:999px}</style></head><body><div class="wrap"><a class="btn" href="services.html">← طلب خدمة</a><h1>📋 طلباتي</h1><div id="box">جاري التحميل...</div></div><script>
const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,storageKey:'ha-marketing-auth'}}),S={new:'جديد',accepted:'مقبول',on_the_way:'بالطريق',in_progress:'قيد التنفيذ',completed:'مكتمل',cancelled:'ملغي'};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const u=(await db.auth.getUser()).data.user;if(!u){location.href='login.html';return}const {data,error}=await db.from('service_requests').select('*,service_providers(name,phone),service_categories(name)').eq('customer_id',u.id).order('created_at',{ascending:false});if(error){box.textContent=error.message;return}box.innerHTML=(data||[]).length?data.map(o=>`<div class="card"><b>طلب #${o.id}</b> <span class="badge">${S[o.status]||o.status}</span><h3>${esc(o.service_categories?.name||'خدمة')} - ${esc(o.service_providers?.name||'')}</h3><div class="muted">${esc(o.details)}<br>📍 ${esc(o.address)}<br>📞 ${esc(o.phone)}<br>🕒 ${new Date(o.created_at).toLocaleString('ar-IQ')}</div>${['new','accepted'].includes(o.status)?`<button class="danger" onclick="cancelOrder(${o.id})">إلغاء الطلب</button>`:''}</div>`).join(''):'<div class="card">ما عندك طلبات خدمات بعد.</div>'}async function cancelOrder(id){const r=prompt('سبب الإلغاء:');if(r===null)return;const {error}=await db.from('service_requests').update({status:'cancelled',cancel_reason:r||'إلغاء من العميل'}).eq('id',id);if(error)return alert(error.message);load()}load();
</script></body></html>
