<!doctype html><html lang="ar" dir="rtl"><head><script id="ha-modern-boot">document.documentElement.setAttribute('data-ha-modern','1');document.documentElement.setAttribute('data-ha-theme','light');document.documentElement.style.colorScheme='light';</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلبات الخدمات</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:Arial;background:#f5f5f5}.wrap{width:94%;max-width:900px;margin:22px auto}.card{background:#fff;border-radius:15px;padding:15px;margin:12px 0}.btn,button{border:0;background:#111;color:#fff;padding:10px 13px;border-radius:9px;text-decoration:none}.danger{background:#9b1733}.muted{color:#666;line-height:1.8}.badge{background:#eee;padding:5px 8px;border-radius:999px}</style><link rel="stylesheet" href="ha-premium-theme.css"><script src="ha-theme.js"></script>
<link rel="stylesheet" href="ha-theme.css">
<link rel="stylesheet" href="ha-modern-blue.css?v=20260926-1"><script src="ha-modern-blue.js?v=20260926-1" defer></script></head><body><div class="wrap"><a class="btn" href="services.html">← طلب خدمة</a><h1>📋 طلباتي</h1><div id="box">جاري التحميل...</div></div><script>
const db=supabase.createClient(
  'https://ubayrhtshgtgggxprrek.supabase.co',
  'sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',
  {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}}
);

const S={
  new:'جديد',
  pending:'جديد',
  accepted:'مقبول',
  on_the_way:'مقدم الخدمة بالطريق',
  in_progress:'قيد التنفيذ',
  completed:'مكتمل',
  cancelled:'ملغي'
};

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

async function load(){
  const u=(await db.auth.getUser()).data.user;
  if(!u){location.href='login.html';return}

  const {data:orders,error}=await db.from('service_requests')
    .select('*')
    .eq('customer_id',u.id)
    .order('created_at',{ascending:false});

  if(error){
    box.textContent='تعذر تحميل الطلبات: '+error.message;
    return;
  }

  const arr=orders||[];
  if(!arr.length){
    box.innerHTML='<div class="card">ما عندك طلبات خدمات بعد.</div>';
    return;
  }

  const catIds=[...new Set(arr.map(x=>Number(x.category_id)).filter(Number.isFinite))];
  const providerIds=[...new Set(arr.map(x=>Number(x.provider_id)).filter(Number.isFinite))];

  const catMap={};
  const providerMap={};

  if(catIds.length){
    const {data}=await db.from('service_categories').select('id,name').in('id',catIds);
    (data||[]).forEach(x=>catMap[x.id]=x);
  }

  if(providerIds.length){
    const {data}=await db.from('service_providers').select('id,name,full_name,phone,whatsapp').in('id',providerIds);
    (data||[]).forEach(x=>providerMap[x.id]=x);
  }

  box.innerHTML=arr.map(o=>{
    const category=catMap[Number(o.category_id)];
    const provider=providerMap[Number(o.provider_id)];
    const providerName=provider?(provider.name||provider.full_name||'مقدم الخدمة'):'بانتظار مقدم خدمة';

    return `<div class="card">
      <b>طلب #${o.id}</b>
      <span class="badge">${esc(S[o.status]||o.status)}</span>
      <h3>${esc(category?.name||o.service_type||'خدمة')}</h3>
      <div class="muted">
        ${esc(o.details||'')}<br>
        📍 ${esc(o.address||'')}<br>
        📞 ${esc(o.phone||'')}<br>
        ${o.preferred_date?'📅 '+esc(o.preferred_date)+'<br>':''}
        ${o.preferred_time?'🕒 '+esc(o.preferred_time)+'<br>':''}
        🕒 ${new Date(o.created_at).toLocaleString('ar-IQ')}
      </div>

      ${provider?`<div class="card" style="background:#f7faf7;margin-top:10px">
        <b>✅ مقدم الخدمة: ${esc(providerName)}</b><br>
        ${provider.phone?`<a class="btn" href="tel:${esc(provider.phone)}">📞 اتصال</a>`:''}
      </div>`:''}

      ${['new','pending','accepted'].includes(o.status)
        ?`<button class="danger" onclick="cancelOrder(${o.id})">إلغاء الطلب</button>`
        :''}
    </div>`;
  }).join('');
}

async function cancelOrder(id){
  const reason=prompt('سبب الإلغاء:');
  if(reason===null)return;

  const {error}=await db.rpc('cancel_my_service_request',{
    p_request_id:id,
    p_reason:reason||'إلغاء من العميل'
  });

  if(error)return alert(error.message);
  await load();
}

load();
</script></body></html>
