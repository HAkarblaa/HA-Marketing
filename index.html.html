<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HA Marketing</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#111}
.topbar{background:#000;padding:14px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.search-box{flex:1;max-width:850px;margin:auto;position:relative}
.search-box input{width:100%;padding:14px 45px 14px 15px;border:0;border-radius:10px;font-size:17px;outline:none}
.search-icon{position:absolute;right:15px;top:50%;transform:translateY(-50%);font-size:20px}
.menu-wrap{position:relative}.menu-btn{width:48px;height:48px;border:0;border-radius:10px;background:#fff;font-size:25px;cursor:pointer}
.shortcuts{display:none;position:absolute;left:0;top:58px;width:190px;background:#fff;border-radius:12px;box-shadow:0 8px 25px rgba(0,0,0,.2);overflow:hidden;z-index:20}
.shortcuts.show{display:block}.shortcuts a{display:block;padding:14px 16px;color:#111;text-decoration:none;border-bottom:1px solid #eee}
.header{text-align:center;padding:35px 15px 20px}.header h1{margin:0;font-size:38px}.header p{color:#666}
.grid{width:min(900px,92%);margin:15px auto 45px;display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.card{min-height:190px;background:#fff;border-radius:18px;padding:25px 15px;text-decoration:none;color:#111;box-shadow:0 4px 16px rgba(0,0,0,.10);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.card .icon{font-size:48px;margin-bottom:14px}.card h2{margin:0 0 8px;font-size:24px}.card p{margin:0;color:#666}
.no-results{display:none;grid-column:1/-1;background:#fff;padding:25px;text-align:center;border-radius:14px}
@media(max-width:600px){.topbar{padding:10px}.header h1{font-size:30px}.grid{gap:12px;width:94%}.card{min-height:155px;padding:18px 10px}.card .icon{font-size:38px}.card h2{font-size:20px}.card p{font-size:14px}}
</style>
</head>
<body>
<div class="topbar">
 <div class="menu-wrap">
  <button class="menu-btn" type="button" onclick="toggleMenu()">☰</button>
  <div class="shortcuts" id="shortcuts">
   <a href="index.html">الرئيسية</a><a href="shop.html">تسوق الآن</a><a href="contact.html">طلب خدمة</a><a href="building-materials.html">مواد البناء</a><a href="call-us.html">اتصل بنا</a>
  </div>
 </div>
 <div class="search-box"><span class="search-icon">🔍</span><input id="searchInput" type="text" placeholder="ابحث في الأقسام..." oninput="searchCards()"></div>
</div>
<header class="header"><h1>HA Marketing</h1><p>اختر القسم الذي تريد الدخول إليه</p></header>
<main class="grid">
 <a class="card" href="shop.html" data-search="تسوق الآن متجر منتجات شراء"><div class="icon">🛒</div><h2>تسوق الآن</h2><p>تصفح المنتجات واطلب مباشرة</p></a>
 <a class="card" href="contact.html" data-search="طلب خدمة خدمات"><div class="icon">🛠️</div><h2>طلب خدمة</h2><p>أرسل تفاصيل الخدمة التي تحتاجها</p></a>
 <a class="card" href="building-materials.html" data-search="مواد البناء بناء اسمنت حديد"><div class="icon">🏗️</div><h2>مواد البناء</h2><p>تصفح مواد ومنتجات البناء</p></a>
 <a class="card" href="call-us.html" data-search="اتصل بنا تواصل استفسار"><div class="icon">📞</div><h2>اتصل بنا</h2><p>للتواصل والاستفسارات</p></a>
 <div class="no-results" id="noResults">لا توجد نتائج مطابقة للبحث.</div>
</main>
<script>
function toggleMenu(){document.getElementById('shortcuts').classList.toggle('show')}
document.addEventListener('click',e=>{const m=document.querySelector('.menu-wrap');if(!m.contains(e.target))document.getElementById('shortcuts').classList.remove('show')});
function searchCards(){const v=document.getElementById('searchInput').value.trim().toLowerCase();const cards=document.querySelectorAll('.card');let n=0;cards.forEach(c=>{const ok=(c.innerText+' '+c.dataset.search).toLowerCase().includes(v);c.style.display=ok?'flex':'none';if(ok)n++});document.getElementById('noResults').style.display=n?'none':'block'}
</script>
</body>
</html>
