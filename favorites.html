<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المفضلة</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll');</script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f5f5}.wrap{width:94%;max-width:1000px;margin:24px auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 16px #0001}.img{width:100%;height:190px;object-fit:contain}.btn,button{border:0;border-radius:10px;padding:10px 13px;background:#111;color:#fff;text-decoration:none;cursor:pointer}.light{background:#eee;color:#111}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.price{font-size:20px;font-weight:bold}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:470px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="row"><a class="btn light" href="shop.html">← تسوق الآن</a><a class="btn" href="cart.html">🛒 السلة</a></div><h1>❤️ المفضلة</h1><div id="box" class="grid"><div class="card">جاري التحميل...</div></div></div><script>
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}async function load(){const {data:u}=await db.auth.getUser();if(!u?.user){box.innerHTML='<div class="card">سجل الدخول حتى تشاهد المفضلة.</div>';return}const {data:f,error}=await db.from('shop_favorites').select('product_id,products(id,name,price,discount_price,image_url,stock,is_active,product_categories(slug))').eq('user_id',u.user.id);if(error){box.innerHTML='<div class="card">'+esc(error.message)+'</div>';return}const arr=(f||[]).map(x=>x.products).filter(Boolean).filter(x=>x.is_active);box.innerHTML=arr.map(p=>`<div class="card">${p.image_url?`<img class="img" src="${esc(p.image_url)}">`:''}<h2>${esc(p.name)}</h2><div class="row"><span class="price">${Number(p.discount_price??p.price).toLocaleString('ar-IQ')} د.ع</span><a class="btn light" href="product-details.html?id=${p.id}&category=${encodeURIComponent(p.product_categories?.slug||'')}">التفاصيل</a></div><button style="width:100%;margin-top:8px" onclick="removeFav(${p.id})">إزالة من المفضلة</button></div>`).join('')||'<div class="card">ما عندك منتجات مفضلة حالياً.</div>'}async function removeFav(id){const {data:u}=await db.auth.getUser();await db.from('shop_favorites').delete().eq('user_id',u.user.id).eq('product_id',id);load()}load();
</script></body></html>
