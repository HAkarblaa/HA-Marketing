<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طلب تكسي أو مندوب - HA Marketing</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f5f5f5;color:#111}
.wrap{width:94%;max-width:850px;margin:35px auto}
h1{text-align:center;margin-bottom:8px}
.subtitle{text-align:center;color:#666;margin-bottom:25px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{min-height:230px;background:#fff;border-radius:18px;padding:25px 15px;text-decoration:none;color:#111;box-shadow:0 4px 16px rgba(0,0,0,.10);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.icon{font-size:60px;margin-bottom:15px}
.card h2{margin:0 0 10px;font-size:25px}
.card p{margin:0;color:#666;line-height:1.7}
.back{display:block;margin-top:20px;background:#eaeaea;color:#111;text-decoration:none;text-align:center;padding:13px;border-radius:10px}
@media(max-width:800px){.grid{grid-template-columns:1fr}.card{min-height:180px}}

/* HA Marketing mobile compact grid: 3 cards per row */
@media (max-width: 700px){
  .grid,.cards,.menu-grid,.rooms,.categories,.category-grid,.services-grid,.service-grid,.games-grid,.options-grid,.quick-grid,.tools-grid,.subgrid,.main-grid,.dashboard-grid{
    grid-template-columns:repeat(3,minmax(0,1fr)) !important;
    gap:7px !important;
  }
  .card,.menu-card,.room,.category,.category-card,.service-card,.game-card,.option-card,.quick-card,.tool-card,.subcard{
    min-width:0 !important;
    min-height:88px !important;
    padding:9px 5px !important;
    border-radius:12px !important;
  }
  .card .icon,.menu-card .icon,.room .icon,.category .icon,.category-card .icon,.service-card .icon,.game-card .icon,.option-card .icon,.quick-card .icon,.tool-card .icon,.subcard .subicon{
    font-size:27px !important;
    margin-bottom:4px !important;
  }
  .card h2,.card h3,.menu-card h2,.menu-card h3,.category-card h2,.category-card h3,.service-card h2,.service-card h3,.game-card h2,.game-card h3,.option-card h2,.quick-card h2,.tool-card h2,.subcard strong{
    font-size:12px !important;
    line-height:1.25 !important;
    margin:2px 0 !important;
  }
  .card p,.menu-card p,.category-card p,.service-card p,.game-card p,.option-card p,.quick-card p,.tool-card p{
    font-size:9px !important;
    line-height:1.2 !important;
    margin:2px 0 !important;
  }
}
</style>
</head>
<body>
<div class="wrap">
<h1>🚕 طلب تكسي أو مندوب</h1>
<p class="subtitle">اختر نوع الخدمة التي تحتاجها</p>

<div class="grid">
 <a class="card" href="taxi.html">
   <div class="icon">🚕</div>
   <h2>تكسي</h2>
   <p>اطلب سيارة وحدد موقع الانطلاق والوجهة</p>
 </a>

 <a class="card" href="delivery.html">
   <div class="icon">🛵</div>
   <h2>مندوب</h2>
   <p>اطلب مندوب لاستلام أو توصيل طلبك</p>
 </a>

 <a class="card" href="tuktuk.html">
   <div class="icon">🛺</div>
   <h2>تكتك</h2>
   <p>اطلب تكتك وحدد موقع الانطلاق والوجهة</p>
 </a>
</div>

<a class="back" href="index.html">← الرجوع إلى الرئيسية</a>
</div>
</body>
</html>
