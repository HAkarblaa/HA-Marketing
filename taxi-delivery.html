<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طلب تكسي أو مندوب - HA Marketing</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f5f5f5;color:#111}
.wrap{width:94%;max-width:850px;margin:35px auto}
h1{text-align:center;margin-bottom:8px}
.subtitle{text-align:center;color:#666;margin-bottom:25px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.card{min-height:230px;background:#fff;border-radius:18px;padding:25px 15px;text-decoration:none;color:#111;box-shadow:0 4px 16px rgba(0,0,0,.10);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.icon{font-size:60px;margin-bottom:15px}
.card h2{margin:0 0 10px;font-size:25px}
.card p{margin:0;color:#666;line-height:1.7}
.back{display:block;margin-top:20px;background:#eaeaea;color:#111;text-decoration:none;text-align:center;padding:13px;border-radius:10px}
@media(max-width:600px){.grid{grid-template-columns:1fr}.card{min-height:190px}}
</style>
</head>
<body>
<div class="wrap">
<h1>🚕 طلب تكسي أو مندوب</h1>
<p class="subtitle">اختر نوع الخدمة التي تحتاجها</p>

<div class="grid">
 <a class="card" href="taxi.html">
   <div class="icon">🚕</div>
   <h2>تكسي</h2>
   <p>اطلب سيارة وحدد موقع الانطلاق والوجهة</p>
 </a>

 <a class="card" href="delivery.html">
   <div class="icon">🛵</div>
   <h2>مندوب</h2>
   <p>اطلب مندوب لاستلام أو توصيل طلبك</p>
 </a>
</div>

<a class="back" href="index.html">← الرجوع إلى الرئيسية</a>
</div>
</body>
</html>
