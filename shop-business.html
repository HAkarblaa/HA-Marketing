<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المتجر - HA Marketing</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f5f5f5;color:#111}.wrap{width:94%;max-width:760px;margin:24px auto}.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 18px #0001}.hero{width:100%;max-height:420px;object-fit:cover;background:#eee}.body{padding:18px}.body h1{margin:0 0 12px}.location{background:#f6f6f6;border-radius:12px;padding:12px;margin:10px 0}.desc{line-height:1.9;white-space:pre-wrap}.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.btn{background:#111;color:#fff;text-decoration:none;border-radius:10px;padding:11px 14px}.light{background:#eee;color:#111}</style></head><body><div class="wrap"><div id="box" class="card"><div class="body">جاري التحميل...</div></div><div id="sellerProducts" class="card"><div class="body"><h2>منتجات المتجر</h2><div id="spList">جاري التحميل...</div></div></div></div><script>
const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});const id=Number(new URLSearchParams(location.search).get('id'));function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function safeUrl(u){try{const x=new URL(u,location.href);return ['http:','https:'].includes(x.protocol)?x.href:''}catch{return ''}}
async function init(){if(!Number.isInteger(id)||id<1){box.innerHTML='<div class="body">العنصر غير موجود.</div>';return}const {data:x,error}=await db.from('shop_businesses').select('*').eq('id',id).eq('is_active',true).maybeSingle();if(error||!x){box.innerHTML='<div class="body">العنصر غير متوفر حالياً.</div>';return}document.title=x.name+' - HA Marketing';const map=safeUrl(x.map_url),page=safeUrl(x.page_url);box.innerHTML=`${x.image_url?`<img class="hero" src="${esc(x.image_url)}" alt="">`:''}<div class="body"><h1>${esc(x.name)}</h1><div class="location">📍 ${esc(x.location_text||'الموقع غير محدد')}</div>${x.description?`<div class="desc">${esc(x.description)}</div>`:''}<div class="row">${map?`<a class="btn" href="${esc(map)}" target="_blank" rel="noopener">فتح الموقع على الخريطة</a>`:''}${page?`<a class="btn" href="${esc(page)}">فتح المتجر</a>`:''}<a class="btn light" href="shop-section.html?section=${encodeURIComponent(x.section_key)}">← رجوع</a></div></div>`}async function loadSellerProducts(){const {data,error}=await db.from('products').select('id,name,price,discount_price,stock,image_url').eq('business_id',id).eq('is_active',true).order('created_at',{ascending:false});if(error){spList.textContent='';return}spList.innerHTML=(data||[]).map(p=>`<div style="padding:10px 0;border-bottom:1px solid #eee"><div class="row"><div><b>${esc(p.name)}</b><div class="muted">${Number(p.discount_price??p.price).toLocaleString('ar-IQ')} د.ع — متوفر ${p.stock}</div></div><a class="btn" href="product-details.html?id=${p.id}">عرض المنتج</a></div></div>`).join('')||'لا توجد منتجات مضافة لهذا المتجر بعد.'}init();loadSellerProducts();
</script></body></html>
