</style></head><body><div id="cartToast" class="cart-toast">تمت الإضافة للسلة ✅</div><div class="wrap"><div id="box" class="card"><div class="body">جاري التحميل...</div></div><div id="sellerProducts" class="card"><div class="body"><h2>منتجات المتجر</h2><div id="spList">جاري التحميل...</div></div></div></div><script>
const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});
const id=Number(new URLSearchParams(location.search).get('id'));
let sellerProducts=[];
let cart=JSON.parse(localStorage.getItem('ha_cart')||'[]');

function showCartToast(msg='تمت الإضافة للسلة ✅'){
  const el=document.getElementById('cartToast');
  if(!el)return;
  el.textContent=msg;
  el.style.display='block';
  clearTimeout(showCartToast._t);
  showCartToast._t=setTimeout(()=>el.style.display='none',1800);
}

function addProductToCart(productId){
  const p=sellerProducts.find(x=>Number(x.id)===Number(productId));
  if(!p)return;

  const stock=Number(p.stock||0);
  const min=Math.max(1,Number(p.min_order_qty||1));

  if(stock<min){
    showCartToast('المنتج غير متوفر حالياً');
    return;
  }

  const existing=cart.find(x=>Number(x.product_id)===Number(productId) && !x.option_text);

  if(existing){
    const next=Number(existing.qty||0)+min;
    if(next>stock){
      showCartToast('لا يمكن تجاوز الكمية المتوفرة');
      return;
    }
    existing.qty=next;
  }else{
    cart.push({
      product_id:Number(p.id),
      name:p.name,
      qty:min
    });
  }

  localStorage.setItem('ha_cart',JSON.stringify(cart));
  showCartToast('تمت إضافة '+p.name+' للسلة ✅');
}

function esc(s){
  return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function safeUrl(u){
  try{
    if(!u) return '';
    const raw=String(u).trim();
    // لا نحوّل النصوص العادية إلى روابط داخل GitHub Pages حتى لا تظهر 404.
    if(!/^https?:\/\//i.test(raw)) return '';
    const x=new URL(raw);
    return ['http:','https:'].includes(x.protocol)?x.href:'';
  }catch{return ''}
}

function safeProductImageUrl(value){
  const raw=String(value||'').trim();
  if(/^data:image\/(?:png|jpe?g|webp|gif|avif);base64,[a-z0-9+/=\s]+$/i.test(raw))return raw;
  try{
    if(/^https?:\/\//i.test(raw)){const url=new URL(raw);return url.href;}
    if(!raw||/^[a-z][a-z0-9+.-]*:/i.test(raw)||raw.startsWith('//'))return '';
    if(!/\.(?:png|jpe?g|webp|gif|avif)(?:[?#].*)?$/i.test(raw))return '';
    const url=new URL(raw,location.href);return ['http:','https:'].includes(url.protocol)?url.href:'';
  }catch(_e){return '';}
}

function buildMapUrl(x){
  const raw=String(x.map_url||'').trim();

  // إذا خزّن رابط خرائط صحيح نستخدمه مباشرة.
  if(/^https?:\/\//i.test(raw)){
    try{
      const u=new URL(raw);
      if(['http:','https:'].includes(u.protocol)) return u.href;
    }catch(_e){}
  }

  // إذا خزّن إحداثيات أو عنوان كنص، نحوله إلى بحث Google Maps.
  let q='';
  if(raw && !/^https?:\/\//i.test(raw)) q=raw;
  else if(x.latitude!=null && x.longitude!=null) q=`${x.latitude},${x.longitude}`;
  else if(x.lat!=null && x.lng!=null) q=`${x.lat},${x.lng}`;
  else q=String(x.location_text||'').trim();

  return q ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}` : '';
}

function openStoreProducts(){
  const el=document.getElementById('sellerProducts');
  if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
}
async function init(){
  if(!Number.isInteger(id)||id<1){
    box.innerHTML='<div class="body">العنصر غير موجود.</div>';
    return;
  }

  const {data:x,error}=await db.from('shop_businesses')
    .select('*')
    .eq('id',id)
    .eq('is_active',true)
    .maybeSingle();

  if(error||!x){
    box.innerHTML='<div class="body">العنصر غير متوفر حالياً.</div>';
    return;
  }

  document.title=x.name+' - HA Marketing';
  const map=buildMapUrl(x);

  box.innerHTML=`${x.image_url?`<img class="hero" src="${esc(x.image_url)}" alt="">`:''}
  <div class="body">
    <h1>${esc(x.name)}</h1>
    <div class="location">📍 ${esc(x.location_text||'الموقع غير محدد')}</div>
    <div class="location"><h3>أجرة التوصيل</h3><p class="muted">سيحدد صاحب المتجر أجرة التوصيل وسيتم تبليغكم بها قبل إيصال الطلب.</p></div>
    ${x.description?`<div class="desc">${esc(x.description)}</div>`:''}
    <div class="row">
      ${map?`<a class="btn" href="${esc(map)}" target="_blank" rel="noopener noreferrer">فتح الموقع على الخريطة</a>`:''}
      <button class="btn" type="button" onclick="openStoreProducts()" style="border:0;cursor:pointer">فتح المتجر</button>
      <a class="btn light" href="shop-section.html?section=${encodeURIComponent(x.section_key)}">← رجوع</a>
    </div>
  </div>`;


}

async function loadSellerProducts(){
const {data,error}=await db.from('products')
.select('id,name,price,discount_price,stock,image_url,min_order_qty')
.eq('business_id',id)
.eq('is_active',true)
.order('created_at',{ascending:false});

if(error){spList.innerHTML='<div class="product-list-message">تعذر تحميل منتجات المتجر. أعد المحاولة.</div>';return}

sellerProducts=data||[];

spList.innerHTML=sellerProducts.map(p=>{
  const img=safeProductImageUrl(p.image_url);
  return `<div class="product-item">
    <div class="product-image-wrap">
      ${img
        ? `<img class="product-image" src="${esc(img)}" alt="${esc(p.name)}" loading="lazy" decoding="async" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="product-image-placeholder" style="display:none">🛍️</div>`
        : `<div class="product-image-placeholder">🛍️</div>`}
    </div>
    <div class="product-info">
      <b>${esc(p.name)}</b>
      <div class="muted">${Number(p.discount_price??p.price).toLocaleString('ar-IQ')} د.ع — متوفر ${p.stock}</div>
    </div>
    <div class="product-actions">
      <button class="btn cart-btn" type="button" onclick="addProductToCart(${p.id})" ${Number(p.stock||0)<Math.max(1,Number(p.min_order_qty||1))?'disabled':''}>
        ${Number(p.stock||0)>=Math.max(1,Number(p.min_order_qty||1))?'🛒 إضافة إلى السلة':'نفد المخزون'}
      </button>
      <a class="btn" href="product-details.html?id=${p.id}">عرض المنتج</a>
    </div>
  </div>`;
}).join('')||'<div class="product-list-message">لا توجد منتجات مضافة لهذا المتجر بعد.</div>';
}init();loadSellerProducts();
