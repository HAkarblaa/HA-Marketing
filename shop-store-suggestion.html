<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07885f">
<title>اقتراح متجر - HA Marketing</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial;background:#f4faf8;color:#10233f}
.wrap{width:92%;max-width:720px;margin:22px auto 90px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.btn,button{border:0;border-radius:14px;padding:12px 15px;background:#087d5b;color:#fff;text-decoration:none;cursor:pointer;font:inherit;font-weight:800}
.card{background:#fff;border:1px solid #dcebe6;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 10px 30px rgba(18,81,62,.08)}
.hero{text-align:center;background:linear-gradient(135deg,#effcf7,#eef8ff)}
.hero .ico{font-size:52px}.hero h1{margin:8px 0;color:#0b7455}.hero p{margin:0;color:#66768a;line-height:1.8}
label{display:block;font-weight:800;margin:12px 0 6px}
input,textarea{width:100%;border:1px solid #cfded9;border-radius:13px;padding:13px 14px;font:inherit;background:#fbfefd;color:#10233f;outline:none}
input:focus,textarea:focus{border-color:#0c9d72;box-shadow:0 0 0 3px rgba(12,157,114,.1)}
textarea{min-height:120px;resize:vertical}
.send{width:100%;margin-top:14px;background:linear-gradient(135deg,#0b9a70,#087a5a)}
.status{margin-top:10px;color:#5e6c7d;line-height:1.7}
.item{padding:12px 0;border-bottom:1px solid #edf2f0}
.item:last-child{border-bottom:0}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eaf7f2;color:#087a5a;font-size:12px;font-weight:800}
small{color:#7d8997}
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="ha-location-picker.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="ha-location-picker.js"></script><link rel="stylesheet" href="ha-role-bottom-nav.css?v=20260930-1"><link rel="stylesheet" href="ha-lux-icons.css?v=20260930-1"><link rel="stylesheet" href="ha-unified-sections-final.css?v=20261001-1"><link rel="stylesheet" href="ha-card-customizer.css?v=20261001-1">
</head>
<body class="ha-ui-final ha-family-shop"><div class="ha-family-strip"><a href="shop.html">← التسوق</a><div><b>اقتراح متجر</b><small>HA Marketing</small></div><a href="index.html">الرئيسية</a></div>
<div class="wrap">
  <div class="top">
    <a class="btn" href="shop.html">← التسوق</a>
    <b>HA Marketing</b>
    <span></span>
  </div>

  <div class="card hero">
    <div class="ico">💡🏪</div>
    <h1>اقتراح متجر</h1>
    <p>اقترح متجراً تريد إضافته إلى قسم التسوق، وسيصل المقترح مباشرة إلى الأدمن الرئيسي.</p>
  </div>

  <div class="card">
    <label for="storeName">اسم المتجر</label>
    <input id="storeName" maxlength="120" placeholder="مثال: متجر HA للأجهزة">

    <label>موقع المتجر</label>
    <div class="ha-location-box">
      <div class="ha-location-grid">
        <select id="suggestGovernorate"><option value="">اختر المحافظة</option></select>
        <input id="suggestArea" maxlength="160" placeholder="القضاء / الناحية / الحي">
        <input id="storeLocation" class="full" maxlength="240" placeholder="العنوان التفصيلي">
      </div>
      <input id="suggestLat" type="hidden"><input id="suggestLng" type="hidden">
      <div class="ha-location-actions">
        <button id="suggestMapBtn" class="light" type="button">🗺️ اختيار العنوان من الخريطة</button>
        <button id="suggestGpsBtn" class="light" type="button">📍 استخدام دبوس الموقع الحالي</button>
      </div>
      <div id="suggestLocationStatus" class="ha-location-status">حدد الموقع من الخريطة أو استخدم دبوس الموقع الحالي.</div>
      <div id="suggestMap" class="ha-location-map"></div>
    </div>

    <label for="storeLink">رابط المتجر أو صفحته (اختياري)</label>
    <input id="storeLink" maxlength="500" placeholder="https://...">

    <label for="storeDetails">تفاصيل إضافية (اختياري)</label>
    <textarea id="storeDetails" maxlength="1800" placeholder="نوع المنتجات أو أي معلومات تساعد الأدمن..."></textarea>

    <button id="sendBtn" class="send" type="button">إرسال اقتراح المتجر</button>
    <div id="status" class="status"></div>
  </div>

  <div class="card">
    <h3>اقتراحات المتاجر السابقة</h3>
    <div id="mine">جاري التحميل...</div>
  </div>
</div>

<script>
const db=supabase.createClient(
  'https://ubayrhtshgtgggxprrek.supabase.co',
  'sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',
  {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}}
);

const suggestionPicker=HA_LocationPicker.attach({
  governorate:'#suggestGovernorate',area:'#suggestArea',address:'#storeLocation',
  lat:'#suggestLat',lng:'#suggestLng',map:'#suggestMap',
  mapButton:'#suggestMapBtn',gpsButton:'#suggestGpsBtn',status:'#suggestLocationStatus'
});

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

let me=null;

async function init(){
  const {data:{session}}=await db.auth.getSession();
  if(!session){
    location.href='login.html?next=shop-store-suggestion.html';
    return;
  }
  me=session.user;
  loadMine();
}

sendBtn.onclick=async()=>{
  const name=storeName.value.trim();
  const loc=suggestionPicker.getValue();
  const link=storeLink.value.trim();
  const details=storeDetails.value.trim();

  if(name.length<2)return alert('اكتب اسم المتجر');
  if(!loc.governorate||!loc.area||!loc.address)return alert('اختر المحافظة واكتب القضاء/الناحية/الحي والعنوان');
  if(loc.lat==null||loc.lng==null)return alert('حدد موقع المتجر من الخريطة أو استخدم دبوس الموقع الحالي');

  const message=[
    '[اقتراح متجر]',
    'اسم المتجر: '+name,
    'المحافظة: '+loc.governorate,
    'القضاء / الناحية / الحي: '+loc.area,
    'العنوان: '+loc.address,
    'الإحداثيات: '+loc.lat+','+loc.lng,
    link?'الرابط: '+link:'',
    details?'التفاصيل: '+details:''
  ].filter(Boolean).join('\n');

  sendBtn.disabled=true;
  status.textContent='جاري إرسال الاقتراح...';

  const {error}=await db.rpc('submit_user_suggestion',{p_message:message});
  sendBtn.disabled=false;

  if(error){
    status.textContent='تعذر الإرسال: '+error.message;
    return;
  }

  storeName.value='';
  suggestionPicker.reset();
  storeLink.value='';
  storeDetails.value='';
  status.textContent='✅ تم إرسال اقتراح المتجر إلى الأدمن الرئيسي.';
  loadMine();
};

async function loadMine(){
  const {data,error}=await db.from('user_suggestions')
    .select('*')
    .eq('user_id',me.id)
    .order('created_at',{ascending:false})
    .limit(100);

  if(error){
    mine.textContent='تعذر تحميل المقترحات: '+error.message;
    return;
  }

  const rows=(data||[]).filter(x=>String(x.message||'').startsWith('[اقتراح متجر]'));
  const names={new:'⏳ جديد',reviewed:'✅ تمت المراجعة',closed:'✔️ مغلق'};

  mine.innerHTML=rows.map(x=>`
    <div class="item">
      <span class="badge">${names[x.status]||esc(x.status)}</span>
      <div style="margin:8px 0;line-height:1.8;white-space:pre-line">${esc(x.message).replace('[اقتراح متجر]\\n','')}</div>
      ${x.admin_note?`<small>رد الإدارة: ${esc(x.admin_note)}</small><br>`:''}
      <small>${new Date(x.created_at).toLocaleString('ar-IQ')}</small>
    </div>
  `).join('')||'ما عندك اقتراحات متاجر سابقة.';
}

init();
</script>
<script src="ha-role-bottom-nav.js?v=20260930-1" defer></script><script src="ha-lux-icons.js?v=20260930-1" defer></script><script src="ha-card-customizer.js?v=20261001-1" defer></script>
</body>
</html>
