<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الدردشة - HA Marketing</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:linear-gradient(135deg,#eff7ff,#fff3f8,#f2fff6);color:#111}.app{height:100vh;display:grid;grid-template-columns:360px 1fr;max-width:1200px;margin:auto;background:#fff}.side{border-left:1px solid #ddd;display:flex;flex-direction:column;min-width:0}.head{padding:14px;border-bottom:1px solid #eee}.headrow{display:flex;gap:8px;align-items:center}.back,.new{border:0;border-radius:10px;padding:10px 12px;cursor:pointer}.new{background:#111;color:#fff}.search{width:100%;margin-top:10px;padding:12px;border:1px solid #ddd;border-radius:12px}.tabs{display:flex;gap:6px;margin-top:9px}.tabs button{flex:1;border:0;padding:9px;border-radius:10px;background:#eee}.tabs .on{background:#111;color:#fff}.list{overflow:auto;flex:1}.item{display:flex;gap:10px;padding:12px;border-bottom:1px solid #f0f0f0;cursor:pointer;align-items:center}.item:hover,.item.active{background:#f5f6f7}.ava{width:48px;height:48px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-weight:bold;flex:none}.txt{min-width:0;flex:1}.txt b,.txt span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.txt span{font-size:13px;color:#777;margin-top:4px}.badge{background:#d21f2b;color:#fff;border-radius:20px;padding:3px 7px;font-size:11px}.main{display:flex;flex-direction:column;min-width:0}.chathead{padding:13px 16px;border-bottom:1px solid #eee;font-weight:bold}.msgs{flex:1;overflow:auto;padding:18px;background:linear-gradient(180deg,#f9fbff,#fff7fb)}.bubble{max-width:75%;padding:10px 12px;border-radius:15px;background:#fff;margin:7px 0;box-shadow:0 1px 3px #0001}.mine{margin-right:auto;background:linear-gradient(135deg,#dff7ff,#e9ffe8)}.meta{font-size:11px;color:#777;margin-bottom:5px}.send{display:flex;gap:8px;padding:12px;border-top:1px solid #eee;position:relative;background:#fff}.send input{flex:1;padding:13px;border:1px solid #ddd;border-radius:12px}.send button{border:0;background:linear-gradient(135deg,#5b63ff,#8d5bff);color:#fff;border-radius:12px;padding:0 18px}.emojiBtn{font-size:22px!important;background:#fff4c7!important;color:#111!important;padding:0 12px!important}.emojiBox{display:none;position:absolute;bottom:62px;right:12px;left:12px;background:#fff;border:1px solid #eee;border-radius:16px;padding:10px;box-shadow:0 8px 25px #0002;z-index:5;grid-template-columns:repeat(10,1fr);gap:4px}.emojiBox.show{display:grid}.emojiBox button{background:#f8f8f8!important;color:#111!important;padding:7px!important;font-size:20px!important}.empty{margin:auto;text-align:center;color:#777}.modal{display:none;position:fixed;inset:0;background:#0007;z-index:10;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.card{background:#fff;width:min(500px,96vw);max-height:80vh;overflow:auto;border-radius:18px;padding:18px}.result{padding:10px;border-bottom:1px solid #eee;cursor:pointer}.member{display:flex;gap:8px;align-items:center}.member input{width:auto}.hint{font-size:12px;color:#777}.close{float:left;border:0;background:#eee;border-radius:9px;padding:8px 11px}@media(max-width:760px){.app{grid-template-columns:1fr}.main{display:none}.app.open .side{display:none}.app.open .main{display:flex}.bubble{max-width:88%}}
</style><link rel="stylesheet" href="ha-sections-gold.css"><style>
.app[hidden],#chatLanding[hidden]{display:none!important}.app{height:calc(100dvh - 180px);min-height:360px;background:#080b0e;border:1px solid #65542e;border-radius:20px;overflow:hidden;width:94%;margin:22px auto}.side,.head,.chathead,.send,.result,.item{border-color:#31302a}.head,.main,.send,.modal .card,.emojiBox{background:#0d1216;color:#fff}.msgs{background:#080b0e}.search,.send input,.tabs button,.close,.back{background:#141b20;color:#fff;border:1px solid #65542e}.new,.tabs .on,.send button{background:linear-gradient(135deg,#f3c35c,#b77a16);color:#17120b}.item:hover,.item.active,.bubble{background:#20282e}.mine{background:#4a391b}.txt span,.hint,.meta,.empty{color:#c8c3ba}.modal{z-index:100;background:#000b}.modal .card{text-align:right;display:block;width:min(500px,96vw)}.send input{min-width:0}.send button{padding:0 10px}.emojiBox{grid-template-columns:repeat(6,minmax(0,1fr))}.ha-card h2{font-size:17px}.empty{padding:20px;line-height:1.8}.empty a{color:#f3c35c}.chat-exit{display:block;width:94%;margin:15px auto 0;background:#10171c;color:#f3c35c;border:1px solid #65542e;border-radius:12px;padding:12px;font:inherit}button{cursor:pointer}.modal input{font:inherit}.bubble{overflow-wrap:anywhere}
</style></head><body><header class="topbar"><a class="ha-back" href="index.html" aria-label="رجوع إلى الرئيسية">→</a><div class="title">الدردشة<small>HA Marketing</small></div><a class="home" href="index.html" aria-label="الرئيسية">⌂</a></header><div id="chatLanding"><section class="hero"><div class="brandmark">HA</div><h1>الدردشة</h1><p>محادثاتك وأصدقاؤك وكروباتك في مكان واحد.</p><div class="goldline"></div></section><main class="ha-grid"><button class="ha-card" type="button" onclick="enterChat('chats')"><div class="icon"><svg viewBox="0 0 48 48" width="38" height="38" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 9h28a5 5 0 0 1 5 5v17a5 5 0 0 1-5 5H20L9 43v-7a5 5 0 0 1-4-5V14a5 5 0 0 1 5-5Z M14 19h20M14 26h14"/></svg></div><h2>المحادثات</h2><p>تابع محادثاتك الخاصة</p></button><button class="ha-card" type="button" onclick="enterChat('people')"><div class="icon"><svg viewBox="0 0 48 48" width="38" height="38" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="24" cy="15" r="8"/><path d="M8 42v-6a16 16 0 0 1 32 0v6"/></svg></div><h2>الأشخاص</h2><p>ابحث وابدأ محادثة</p></button><button class="ha-card" type="button" onclick="enterChat('groups')"><div class="icon"><svg viewBox="0 0 48 48" width="38" height="38" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="24" cy="14" r="6"/><path d="M13 40V30a11 11 0 0 1 22 0v10M9 10a6 6 0 0 0 0 12M39 10a6 6 0 0 1 0 12M8 27a8 8 0 0 0-5 8v5M40 27a8 8 0 0 1 5 8v5"/></svg></div><h2>الكروبات</h2><p>أنشئ كروباً للأصدقاء</p></button></main></div><button id="chatExit" class="chat-exit" hidden onclick="leaveChat()">→ أقسام الدردشة</button><div id="app" class="app" hidden><aside class="side"><div class="head"><div class="headrow"><button class="back" onclick="location.href='index.html'">⌂</button><b style="flex:1">💬 الدردشة</b><button class="new" onclick="openNew()">＋ جديد</button></div><input id="q" class="search" placeholder="بحث بالمحادثات أو الأشخاص..." oninput="searchAll()"><div class="tabs"><button id="tChats" class="on" onclick="setTab('chats')">المحادثات</button><button id="tPeople" onclick="setTab('people')">الأشخاص</button></div></div><div id="list" class="list"></div></aside><main class="main"><div id="chatHead" class="chathead">اختر محادثة</div><div id="msgs" class="msgs"><div class="empty">اختر شخصاً أو كروباً لبدء الدردشة</div></div><div class="send"><button class="emojiBtn" onclick="toggleEmoji()" type="button">😊</button><input id="msg" placeholder="اكتب رسالتك..." onkeydown="if(event.key==='Enter')send()" disabled><button onclick="send()">إرسال</button><div id="emojiBox" class="emojiBox"></div></div></main></div>
<div id="modal" class="modal"><div class="card"><button class="close" onclick="modal.classList.remove('show')">✕</button><h2>محادثة جديدة</h2><input id="peopleQ" class="search" placeholder="ابحث بالاسم أو المعرف أو الرقم" oninput="loadPeople(peopleQ.value)"><div id="people"></div><hr><h3>إنشاء كروب</h3><input id="groupName" class="search" placeholder="اسم الكروب"><p class="hint">حدد الأعضاء من النتائج أعلاه ثم اضغط إنشاء.</p><button class="new" onclick="createGroup()">إنشاء الكروب</button></div></div>
<script>
const db=window.supabase?supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}}):null, esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let me=null,threads=[],active=null,channel=null,tab='chats',selected=new Set();
async function init(){
 if(!db){list.innerHTML='<div class="empty">تعذر الاتصال بالدردشة. تأكد من الإنترنت ثم أعد تحميل الصفحة.</div>';return}
  let session=null;
  try{({data:{session}}=await db.auth.getSession())}catch(e){}
  if(!session){
    for(let i=0;i<4&&!session;i++){
      await new Promise(r=>setTimeout(r,250));
      try{({data:{session}}=await db.auth.getSession())}catch(e){}
    }
  }
  if(!session){list.innerHTML='<div class="empty">سجّل دخولك لعرض محادثاتك.<br><a href="login.html?next=chat.html">تسجيل الدخول</a></div>';return}
  me=session.user;
  localStorage.setItem('ha_logged_in','1');
  await loadThreads();
}
async function profileMap(ids){if(!ids.length)return{};let {data}=await db.from('profiles').select('id,full_name,username,phone').in('id',[...new Set(ids)]);return Object.fromEntries((data||[]).map(x=>[x.id,x]));}
async function loadThreads(){let {data:mem}=await db.from('chat_members').select('thread_id,last_read_at').eq('user_id',me.id);let ids=(mem||[]).map(x=>x.thread_id);if(!ids.length){threads=[];renderThreads();return}let {data:t}=await db.from('chat_threads').select('*').in('id',ids).order('updated_at',{ascending:false});let {data:allm}=await db.from('chat_members').select('thread_id,user_id,role').in('thread_id',ids);let pmap=await profileMap((allm||[]).map(x=>x.user_id));threads=(t||[]).map(x=>{let members=(allm||[]).filter(m=>m.thread_id===x.id),other=members.find(m=>m.user_id!==me.id),name=x.type==='group'?(x.title||'كروب'):(pmap[other?.user_id]?.full_name||pmap[other?.user_id]?.username||pmap[other?.user_id]?.phone||'مستخدم');return {...x,name,members,pmap}});renderThreads();}
function renderThreads(){let qv=q.value.trim().toLowerCase(),arr=threads.filter(x=>x.name.toLowerCase().includes(qv));list.innerHTML=arr.map(x=>`<div class="item ${active===x.id?'active':''}" onclick="openThread('${x.id}')"><div class="ava">${x.type==='group'?'👥':esc(x.name.slice(0,1))}</div><div class="txt"><b>${esc(x.name)}</b><span>${x.type==='group'?'كروب':'محادثة خاصة'}</span></div></div>`).join('')||'<div class="empty" style="padding:30px">لا توجد محادثات بعد</div>';}
async function openThread(id){active=id;app.classList.add('open');let t=threads.find(x=>x.id===id);chatHead.innerHTML=`<button class="back" onclick="app.classList.remove('open')">رجوع</button> ${esc(t?.name||'الدردشة')}`;msg.disabled=false;await loadMessages();if(channel)db.removeChannel(channel);channel=db.channel('thread-'+id).on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages',filter:'thread_id=eq.'+id},()=>loadMessages()).subscribe();await db.from('chat_members').update({last_read_at:new Date().toISOString()}).eq('thread_id',id).eq('user_id',me.id);}
async function loadMessages(){let {data}=await db.from('chat_messages').select('*').eq('thread_id',active).order('created_at').limit(300),pmap=await profileMap((data||[]).map(x=>x.sender_id));msgs.innerHTML=(data||[]).map(m=>`<div class="bubble ${m.sender_id===me.id?'mine':''}"><div class="meta">${esc(pmap[m.sender_id]?.full_name||pmap[m.sender_id]?.username||'مستخدم')} · ${new Date(m.created_at).toLocaleTimeString('ar-IQ',{hour:'2-digit',minute:'2-digit'})}</div>${esc(m.body)}</div>`).join('')||'<div class="empty">ابدأ المحادثة</div>';msgs.scrollTop=msgs.scrollHeight;}
const EMOJIS=['😀','😃','😄','😁','😂','🥰','😍','😊','😉','😎','🤩','😘','😇','🙂','🙃','🤗','🤔','😴','😭','😢','😡','👍','👎','👏','🙏','❤️','💙','💚','💛','🔥','⭐','🎉','✅','💯','🌹','⚽','📚','🛍️','🚕','🫶'];emojiBox.innerHTML=EMOJIS.map(e=>`<button type="button" onclick="addEmoji('${e}')">${e}</button>`).join('');function toggleEmoji(){emojiBox.classList.toggle('show')}function addEmoji(e){msg.value+=e;msg.focus()}
async function send(){let body=msg.value.trim();if(!body||!active)return;msg.value='';let {error}=await db.from('chat_messages').insert({thread_id:active,sender_id:me.id,body});if(error)alert(error.message);else{await db.from('chat_threads').update({updated_at:new Date().toISOString()}).eq('id',active);loadMessages();}}
function setTab(x){if(!me)return;tab=x;tChats.classList.toggle('on',x==='chats');tPeople.classList.toggle('on',x==='people');if(x==='people')loadPeople(q.value,true);else renderThreads()}
function searchAll(){tab==='people'?loadPeople(q.value,true):renderThreads()}
async function loadPeople(term='',intoList=false){if(!me)return;let query=db.from('profiles').select('id,full_name,username,phone').neq('id',me.id).limit(30);if(term.trim())query=query.or(`full_name.ilike.%${term}%,username.ilike.%${term}%,phone.ilike.%${term}%`);let {data}=await query;let html=(data||[]).map(p=>`<div class="result" ${intoList?`onclick="startPrivate('${p.id}')"`:''}><label class="member">${intoList?'':`<input type="checkbox" onchange="pick('${p.id}',this.checked)">`}<div><b>${esc(p.full_name||p.username||'مستخدم')}</b><div class="hint">${esc(p.username||p.phone||'')}</div></div>${intoList?'<span style="margin-right:auto">دردشة ←</span>':''}</label></div>`).join('')||'<div class="hint">لا توجد نتائج</div>';if(intoList)list.innerHTML=html;else people.innerHTML=html;}
function pick(id,on){on?selected.add(id):selected.delete(id)}function openNew(){if(!me){location.href='login.html?next=chat.html';return}selected.clear();modal.classList.add('show');loadPeople('')}
async function startPrivate(id){let {data,error}=await db.rpc('start_private_chat',{other_user:id});if(error)return alert(error.message);modal.classList.remove('show');await loadThreads();openThread(data)}
async function createGroup(){let name=groupName.value.trim();if(!name)return alert('اكتب اسم الكروب');let {data,error}=await db.rpc('create_group_chat',{p_title:name,p_members:[...selected]});if(error)return alert(error.message);groupName.value='';modal.classList.remove('show');await loadThreads();openThread(data)}
async function enterChat(mode){document.getElementById('chatLanding').hidden=true;app.hidden=false;document.getElementById('chatExit').hidden=false;list.innerHTML='<div class="empty">جاري تحميل المحادثات...</div>';try{if(!me)await init();if(me){if(mode==='groups')openNew();else setTab(mode)}}catch(e){list.innerHTML='<div class="empty">تعذر تحميل الدردشة. حاول مرة أخرى.</div>'}window.scrollTo(0,0)}
function leaveChat(){app.hidden=true;app.classList.remove('open');document.getElementById('chatLanding').hidden=false;document.getElementById('chatExit').hidden=true;modal.classList.remove('show');}
</script><nav class="bottom-nav" aria-label="التنقل"><a class="nav-item active" href="chat.html" aria-current="page"><span class="ni">◇</span><span>الدردشة</span></a><a class="nav-brand" href="index.html"><b>HA</b><span>HA Marketing</span></a><a class="nav-item" href="index.html"><span class="ni">⌂</span><span>الرئيسية</span></a></nav></body></html>
