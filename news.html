<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>آخر الأخبار</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f5f7}.wrap{width:min(1000px,94%);margin:20px auto}.top{display:flex;gap:10px;align-items:center}.top a{text-decoration:none;color:#111;background:#fff;padding:10px;border-radius:10px}.search{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px}.cats{display:flex;gap:8px;overflow:auto;padding:12px 0}.cats button{white-space:nowrap;border:0;padding:9px 14px;border-radius:20px;background:#fff}.cats .on{background:#111;color:#fff}.breaking{display:none;background:#b00020;color:#fff;padding:12px;border-radius:13px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 3px 12px #0001}.card img{width:100%;height:190px;object-fit:cover}.pad{padding:14px}.tag{font-size:12px;background:#eee;padding:4px 8px;border-radius:20px}.card h2{font-size:19px}.meta{font-size:12px;color:#777}.legacy{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:15px 0}.legacy a{background:#fff;text-decoration:none;color:#111;padding:12px;border-radius:12px;text-align:center}@media(max-width:700px){.grid{grid-template-columns:1fr}.legacy{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="wrap"><div class="top"><a href="index.html">رجوع</a><h1 style="flex:1">📰 آخر الأخبار</h1></div><input id="q" class="search" placeholder="ابحث في الأخبار..." oninput="render()"><div class="legacy"><a href="education-news.html">🎓 التربية</a><a href="higher-education-news.html">🏫 التعليم العالي</a><a href="football-news.html">⚽ كرة القدم</a><a href="currency-prices.html">💱 العملات</a></div><div id="breaking" class="breaking"></div><div id="cats" class="cats"></div><div id="grid" class="grid"></div></div><script>const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll');let posts=[],cat='الكل';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){let {data}=await db.from('content_posts').select('*').eq('section','news').eq('is_active',true).order('published_at',{ascending:false}).limit(100);posts=data||[];let b=posts.find(x=>x.is_breaking);if(b){breaking.style.display='block';breaking.innerHTML='🚨 عاجل: '+esc(b.title)}renderCats();render()}function renderCats(){let a=['الكل',...new Set(posts.map(x=>x.category))];cats.innerHTML=a.map(x=>`<button class="${x===cat?'on':''}" onclick="cat='${esc(x)}';renderCats();render()">${esc(x)}</button>`).join('')}function render(){let term=q.value.trim().toLowerCase(),a=posts.filter(x=>(cat==='الكل'||x.category===cat)&&(!term||(x.title+' '+(x.summary||'')).toLowerCase().includes(term)));grid.innerHTML=a.map(x=>`<article class="card">${x.image_url?`<img src="${esc(x.image_url)}">`:''}<div class="pad"><span class="tag">${esc(x.category)}</span>${x.is_featured?' ⭐':''}<h2>${esc(x.title)}</h2><p>${esc(x.summary||'')}</p><div class="meta">${new Date(x.published_at).toLocaleString('ar-IQ')}</div>${x.source_url?`<p><a href="${esc(x.source_url)}" target="_blank" rel="noopener">المصدر: ${esc(x.source_name||'فتح المصدر')}</a></p>`:''}</div></article>`).join('')||'<p>لا توجد أخبار مضافة حالياً.</p>'}load();</script></body></html>
