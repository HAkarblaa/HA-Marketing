<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10170e">
<title>لعبة الحية - HA Marketing</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;background:#070b08;color:#f3f7ee}
body{display:flex;justify-content:center;padding:14px 10px 40px}
.wrap{width:min(520px,100%)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.back{width:42px;height:42px;border-radius:13px;border:1px solid #4f624b;background:#111911;color:#dfe8d7;font-size:25px;display:grid;place-items:center;text-decoration:none}
.title{text-align:center;flex:1}.title b{display:block;font-size:20px;color:#d7e4c9}.title small{font-size:11px;color:#8fa087}
.phone{border:2px solid #68745d;border-radius:28px;padding:15px 13px 18px;background:linear-gradient(160deg,#30372d,#151a14 55%,#090c09);box-shadow:0 18px 50px #0008,inset 0 0 0 1px #ffffff10}
.brand{text-align:center;margin:2px 0 9px;font-weight:900;letter-spacing:2px;color:#becab3}
.screen{background:#9eaf79;border:5px solid #252b20;border-radius:12px;padding:8px;box-shadow:inset 0 0 22px #29321caa}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;color:#1c2615;font-family:monospace;font-weight:900;font-size:12px;margin-bottom:6px}
.hud div:nth-child(2){text-align:center}.hud div:last-child{text-align:left}
canvas{display:block;width:100%;aspect-ratio:1/1;background:#a9b982;touch-action:none;cursor:crosshair;border:2px solid #34402a;image-rendering:pixelated}
.msg{min-height:26px;margin-top:6px;text-align:center;color:#1b2515;font-family:monospace;font-size:12px;font-weight:900}
.control-pad{width:max-content;margin:16px auto 0;padding:12px;border:1px solid #4f5c49;border-radius:22px;background:linear-gradient(180deg,#1b2119,#0d110d);box-shadow:inset 0 1px #ffffff10,0 10px 22px #0005}
.controls{display:grid;grid-template-columns:64px 64px 64px;grid-template-rows:56px 56px 56px;justify-content:center;gap:8px;direction:ltr}
.key{width:64px;height:56px;border:1px solid #6a7864;background:linear-gradient(180deg,#2b3428,#151a14);color:#edf5e8;border-radius:16px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px #ffffff18,0 5px 10px #0007;touch-action:manipulation;cursor:pointer}
.key svg{width:27px;height:27px;stroke:currentColor;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round;fill:none;pointer-events:none}
.key.center{background:linear-gradient(180deg,#7f956b,#536347);border-color:#9eb38a;color:#0c1209}
.key.center svg{fill:currentColor;stroke:none;width:25px;height:25px}
.key:active{transform:translateY(2px) scale(.97);filter:brightness(.9)}
.up{grid-column:2;grid-row:1}.left{grid-column:1;grid-row:2}.center{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}.down{grid-column:2;grid-row:3}
.bottom{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.action{padding:12px;border:1px solid #53644c;border-radius:13px;background:#121a12;color:#e4ecdc;font-weight:900;font-size:13px}
.action.primary{background:#1f2e1c;border-color:#79916d;color:#e8f3df}
.note{text-align:center;color:#83907c;font-size:10px;line-height:1.7;margin-top:10px}
@media(max-width:420px){
 body{padding:8px 6px 28px}.phone{padding:11px 9px 14px;border-radius:23px}
 .control-pad{padding:10px;border-radius:19px}
 .controls{grid-template-columns:58px 58px 58px;grid-template-rows:50px 50px 50px;gap:7px}
 .key{width:58px;height:50px;border-radius:14px}.key svg{width:24px;height:24px}.title b{font-size:17px}
}
</style>
<link rel="stylesheet" href="ha-theme.css">
<script src="ha-theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="game-ranking.js"></script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="entertainment.html">‹</a>
    <div class="title"><b>🐍 لعبة الحية</b><small>ستايل نوكيا الكلاسيكي</small></div>
    <div style="width:42px"></div>
  </div>

  <section class="phone">
    <div class="brand">HA • SNAKE</div>

    <div class="screen">
      <div class="hud">
        <div>LEVEL <span id="level">1</span></div>
        <div>SCORE <span id="score">0</span></div>
        <div>BEST <span id="best">0</span></div>
        <div>SHIELD <span id="shieldHud">—</span></div>
      </div>
      <canvas id="game" width="360" height="360" aria-label="لعبة الحية"></canvas>
      <div id="msg" class="msg">اضغط تشغيل أو اسحب على شاشة اللعب</div>
    </div>

    <div class="control-pad" aria-label="أزرار التحكم">
      <div class="controls">
        <button class="key up" data-dir="up" aria-label="أعلى"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
        <button class="key left" data-dir="left" aria-label="يسار"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
        <button class="key center" id="playBtn" aria-label="تشغيل"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></button>
        <button class="key right" data-dir="right" aria-label="يمين"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        <button class="key down" data-dir="down" aria-label="أسفل"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
      </div>
    </div>

    <div class="bottom">
      <button class="action primary" id="restartBtn">↻ إعادة اللعب</button>
      <button class="action" id="pauseBtn">Ⅱ إيقاف مؤقت</button>
    </div>
  </section>

  <div class="note">تشتغل باللمس أو أسهم الكيبورد. المراحل تصير أسرع وتظهر عوائق. 🟡 أكل ذهبي نقاط أكثر • 🛡️ درع يحمي من اصطدام • ☠️ السم ينقص النقاط والطول.</div>
</div>

<script>
(()=>{
  const canvas=document.getElementById('game');
  const ctx=canvas.getContext('2d');
  const scoreEl=document.getElementById('score');
  const bestEl=document.getElementById('best');
  const levelEl=document.getElementById('level');
  const shieldHud=document.getElementById('shieldHud');
  const msg=document.getElementById('msg');
  const playBtn=document.getElementById('playBtn');
  const pauseBtn=document.getElementById('pauseBtn');
  const restartBtn=document.getElementById('restartBtn');

  const CELLS=18;
  const SIZE=canvas.width/CELLS;

  let snake,food,dir,nextDir,score,level,timer,running=false,paused=false;
  let obstacles=[],shieldActive=false,foodsEaten=0,steps=0;
  let rankPlayId='',runStarted=false;
  let best=Number(localStorage.getItem('ha_snake_best')||0);
  bestEl.textContent=best;

  function cellKey(p){return p.x+','+p.y}

  function reset(message='اضغط تشغيل أو اسحب على شاشة اللعب'){
    clearInterval(timer);
    rankPlayId=HA_GameRanking.newPlayId('snake');
    runStarted=false;

    snake=[{x:8,y:9},{x:7,y:9},{x:6,y:9}];
    dir={x:1,y:0};
    nextDir={x:1,y:0};

    score=0;
    level=1;
    foodsEaten=0;
    steps=0;
    shieldActive=false;
    obstacles=[];

    running=false;
    paused=false;

    scoreEl.textContent='0';
    levelEl.textContent='1';
    shieldHud.textContent='—';

    food=randomFood('normal');
    msg.textContent=message;
    pauseBtn.textContent='Ⅱ إيقاف مؤقت';
    draw();
  }

  function updateBest(){
    if(score>best){
      best=score;
      localStorage.setItem('ha_snake_best',String(best));
      bestEl.textContent=best;
    }
  }

  function recordRound(){
    updateBest();
    if(runStarted){
      HA_GameRanking.record('snake',score,{won:false,playId:rankPlayId});
      runStarted=false;
    }
  }

  function finishAndRestart(message){
    clearInterval(timer);
    running=false;
    paused=false;
    recordRound();
    msg.textContent=message;
    draw();
    setTimeout(()=>{
      reset(message);
      start();
    },650);
  }

  function occupiedBySnake(x,y){
    return snake && snake.some(s=>s.x===x&&s.y===y);
  }

  function occupiedByObstacle(x,y){
    return obstacles.some(o=>o.x===x&&o.y===y);
  }

  function randomEmptyCell(){
    let p,tries=0;
    do{
      p={x:Math.floor(Math.random()*CELLS),y:Math.floor(Math.random()*CELLS)};
      tries++;
    }while(
      tries<500 &&
      (
        occupiedBySnake(p.x,p.y) ||
        occupiedByObstacle(p.x,p.y) ||
        (snake && Math.abs(p.x-snake[0].x)+Math.abs(p.y-snake[0].y)<3)
      )
    );
    return p;
  }

  function randomFood(forcedType=null){
    let type=forcedType;
    if(!type){
      const r=Math.random();
      if(level>=2 && r<0.10) type='shield';
      else if(level>=2 && r<0.20) type='poison';
      else if(r<0.38) type='gold';
      else type='normal';
    }

    const p=randomEmptyCell();
    return {...p,type};
  }

  function rebuildObstacles(){
    obstacles=[];

    // من المرحلة 2 تبدأ العوائق وتزيد بالتدريج.
    if(level<2)return;

    const count=Math.min(12,2+(level-2)*2);
    let tries=0;

    while(obstacles.length<count && tries<700){
      tries++;
      const p={
        x:1+Math.floor(Math.random()*(CELLS-2)),
        y:1+Math.floor(Math.random()*(CELLS-2))
      };

      // لا نخلي العائق قريب من بداية الحية ولا فوق الأكل.
      const nearHead=Math.abs(p.x-snake[0].x)+Math.abs(p.y-snake[0].y)<4;
      const onFood=food && p.x===food.x && p.y===food.y;
      const duplicate=occupiedByObstacle(p.x,p.y);
      const onSnake=occupiedBySnake(p.x,p.y);

      if(!nearHead && !onFood && !duplicate && !onSnake){
        obstacles.push(p);
      }
    }
  }

  function speed(){
    return Math.max(62,190-(level-1)*15);
  }

  function startLoop(){
    clearInterval(timer);
    timer=setInterval(step,speed());
  }

  function start(){
    if(running && paused){
      paused=false;
      msg.textContent='';
      startLoop();
      return;
    }
    if(running)return;

    running=true;
    paused=false;
    runStarted=true;
    msg.textContent='';
    startLoop();
  }

  function collisionAt(p){
    if(p.x<0||p.y<0||p.x>=CELLS||p.y>=CELLS)return 'wall';
    if(occupiedByObstacle(p.x,p.y))return 'obstacle';
    if(snake.some(s=>s.x===p.x&&s.y===p.y))return 'self';
    return '';
  }

  function findSafeDirection(){
    const choices=[
      {x:1,y:0,name:'right'},
      {x:-1,y:0,name:'left'},
      {x:0,y:1,name:'down'},
      {x:0,y:-1,name:'up'}
    ].filter(d=>!(d.x===-dir.x&&d.y===-dir.y));

    for(const d of choices){
      const p={x:snake[0].x+d.x,y:snake[0].y+d.y};
      if(!collisionAt(p))return d;
    }
    return null;
  }

  function useShield(){
    if(!shieldActive)return false;
    shieldActive=false;
    shieldHud.textContent='—';
    msg.textContent='🛡️ الدرع حماك من الاصطدام!';
    HAGame.beep('coin');

    const safe=findSafeDirection();
    if(safe){
      dir={x:safe.x,y:safe.y};
      nextDir={x:safe.x,y:safe.y};
    }
    return true;
  }

  function updateLevel(){
    const newLevel=Math.min(10,1+Math.floor(score/60));
    if(newLevel===level)return;

    level=newLevel;
    levelEl.textContent=level;
    rebuildObstacles();

    msg.textContent='LEVEL '+level+' — السرعة والعوائق زادت';
    HAGame.beep('win');
    startLoop();
    setTimeout(()=>{if(running&&!paused)msg.textContent=''},1000);
  }

  function applyFoodEffect(type){
    if(type==='normal'){
      score+=10;
      HAGame.beep('tick');
      return {grow:1};
    }

    if(type==='gold'){
      score+=30;
      msg.textContent='🟡 أكل ذهبي +30';
      HAGame.beep('win');
      return {grow:2};
    }

    if(type==='shield'){
      shieldActive=true;
      shieldHud.textContent='🛡️';
      score+=5;
      msg.textContent='🛡️ حصلت على درع — يحميك من اصطدام واحد';
      HAGame.beep('coin');
      return {grow:1};
    }

    if(type==='poison'){
      score=Math.max(0,score-15);
      msg.textContent='☠️ سم! نقصت 15 نقطة وقصر طول الحية';
      HAGame.beep('lose');

      // السم يقصر الحية لكن ما يخليها أقل من 3 أجزاء.
      if(snake.length>4)snake.pop();
      if(snake.length>4)snake.pop();

      return {grow:0};
    }

    return {grow:1};
  }

  function step(){
    if(paused||!running)return;

    steps++;
    dir=nextDir;

    let head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
    const collision=collisionAt(head);

    if(collision){
      if(useShield()){
        // بعد استخدام الدرع نحاول خطوة بالاتجاه الآمن الجديد.
        head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
        if(collisionAt(head)){
          finishAndRestart('انتهى الدرع وماكو مسار آمن — نبدأ من جديد');
          return;
        }
      }else{
        const messages={
          wall:'اصطدمت بالجدار — نبدأ من جديد',
          obstacle:'اصطدمت بعائق — نبدأ من جديد',
          self:'اصطدمت الحية بنفسها — نبدأ من جديد'
        };
        finishAndRestart(messages[collision]||'GAME OVER');
        return;
      }
    }

    snake.unshift(head);

    if(head.x===food.x&&head.y===food.y){
      foodsEaten++;
      const result=applyFoodEffect(food.type);

      // النمو: لأن الرأس انضاف، نقرر كم جزء نخلي قبل حذف الذيل.
      if(result.grow<=0){
        snake.pop();
      }else if(result.grow===1){
        // لا نحذف ذيل = نمو جزء واحد.
      }else if(result.grow>=2){
        // نمو إضافي بسيط بتكرار آخر جزء.
        const tail=snake[snake.length-1];
        snake.push({x:tail.x,y:tail.y});
      }

      scoreEl.textContent=score;
      updateLevel();

      // كل 5 أكلات نضمن أكل خاص حتى تبقى اللعبة متنوعة.
      let forced=null;
      if(foodsEaten%10===0)forced='shield';
      else if(foodsEaten%5===0)forced='gold';

      food=randomFood(forced);
    }else{
      snake.pop();
    }

    draw();
  }

  function drawGrid(){
    ctx.strokeStyle='rgba(43,54,34,.12)';
    ctx.lineWidth=1;
    for(let i=0;i<=CELLS;i++){
      ctx.beginPath();ctx.moveTo(i*SIZE,0);ctx.lineTo(i*SIZE,canvas.height);ctx.stroke();
      ctx.beginPath();ctx.moveTo(0,i*SIZE);ctx.lineTo(canvas.width,i*SIZE);ctx.stroke();
    }
  }

  function drawObstacles(){
    obstacles.forEach(o=>{
      const x=o.x*SIZE,y=o.y*SIZE;
      ctx.fillStyle='#4d563d';
      ctx.fillRect(x+2,y+2,SIZE-4,SIZE-4);
      ctx.fillStyle='#687358';
      ctx.fillRect(x+5,y+5,SIZE-10,4);
      ctx.strokeStyle='#222a1d';
      ctx.strokeRect(x+2.5,y+2.5,SIZE-5,SIZE-5);
    });
  }

  function drawFood(){
    const cx=food.x*SIZE+SIZE/2;
    const cy=food.y*SIZE+SIZE/2;

    if(food.type==='normal'){
      ctx.fillStyle='#1c2615';
      ctx.beginPath();
      ctx.arc(cx,cy,SIZE*.28,0,Math.PI*2);
      ctx.fill();
      return;
    }

    if(food.type==='gold'){
      ctx.fillStyle='#e2b714';
      ctx.beginPath();
      ctx.arc(cx,cy,SIZE*.34,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle='#fff1a6';
      ctx.font='bold 14px Tahoma';
      ctx.textAlign='center';
      ctx.fillText('★',cx,cy+5);
      ctx.textAlign='start';
      return;
    }

    if(food.type==='shield'){
      ctx.fillStyle='#3b82a8';
      ctx.beginPath();
      ctx.arc(cx,cy,SIZE*.36,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle='#ecfbff';
      ctx.font='14px Tahoma';
      ctx.textAlign='center';
      ctx.fillText('🛡',cx,cy+5);
      ctx.textAlign='start';
      return;
    }

    if(food.type==='poison'){
      ctx.fillStyle='#7a2727';
      ctx.beginPath();
      ctx.arc(cx,cy,SIZE*.34,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle='#fff';
      ctx.font='14px Tahoma';
      ctx.textAlign='center';
      ctx.fillText('☠',cx,cy+5);
      ctx.textAlign='start';
    }
  }

  function draw(){
    // تتغير درجة الشاشة بشكل بسيط مع تقدم المرحلة.
    const bg=level>=7?'#879b6c':level>=4?'#9eb17d':'#a9b982';
    ctx.fillStyle=bg;
    ctx.fillRect(0,0,canvas.width,canvas.height);

    drawGrid();
    drawObstacles();

    snake.forEach((s,i)=>{
      const pad=i===0?2:3;
      ctx.fillStyle=i===0?'#17210f':'#243019';
      ctx.fillRect(s.x*SIZE+pad,s.y*SIZE+pad,SIZE-pad*2,SIZE-pad*2);
    });

    if(shieldActive){
      const h=snake[0];
      ctx.strokeStyle='#d5f5ff';
      ctx.lineWidth=2;
      ctx.strokeRect(h.x*SIZE+1,h.y*SIZE+1,SIZE-2,SIZE-2);
    }

    drawFood();
  }

  function setDir(name){
    const d={
      up:{x:0,y:-1},
      down:{x:0,y:1},
      left:{x:-1,y:0},
      right:{x:1,y:0}
    }[name];

    if(!d)return;
    if(d.x===-dir.x&&d.y===-dir.y)return;

    nextDir=d;
    if(!running)start();
  }

  document.querySelectorAll('[data-dir]').forEach(b=>{
    b.addEventListener('pointerdown',e=>{
      e.preventDefault();
      setDir(b.dataset.dir);
    });
  });

  let swipeStart=null;

  const applySwipe=(dx,dy)=>{
    if(Math.max(Math.abs(dx),Math.abs(dy))<14)return false;
    if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?'right':'left');
    else setDir(dy>0?'down':'up');
    return true;
  };

  canvas.addEventListener('pointerdown',e=>{
    e.preventDefault();
    swipeStart={x:e.clientX,y:e.clientY,id:e.pointerId};
    try{canvas.setPointerCapture(e.pointerId)}catch(_){}
  });

  canvas.addEventListener('pointermove',e=>{
    if(!swipeStart||e.pointerId!==swipeStart.id)return;
    e.preventDefault();
    const dx=e.clientX-swipeStart.x;
    const dy=e.clientY-swipeStart.y;
    if(applySwipe(dx,dy)){
      swipeStart={x:e.clientX,y:e.clientY,id:e.pointerId};
    }
  });

  const endSwipe=e=>{
    if(!swipeStart||e.pointerId!==swipeStart.id)return;
    e.preventDefault();

    const dx=e.clientX-swipeStart.x;
    const dy=e.clientY-swipeStart.y;

    if(!applySwipe(dx,dy)){
      const r=canvas.getBoundingClientRect();
      const x=e.clientX-r.left-r.width/2;
      const y=e.clientY-r.top-r.height/2;

      if(Math.abs(x)>Math.abs(y))setDir(x>0?'right':'left');
      else setDir(y>0?'down':'up');
    }

    swipeStart=null;
  };

  canvas.addEventListener('pointerup',endSwipe);
  canvas.addEventListener('pointercancel',()=>{swipeStart=null});

  document.addEventListener('keydown',e=>{
    const map={
      ArrowUp:'up',
      ArrowDown:'down',
      ArrowLeft:'left',
      ArrowRight:'right'
    };

    if(map[e.key]){
      e.preventDefault();
      setDir(map[e.key]);
    }

    if(e.key===' '){
      e.preventDefault();
      togglePause();
    }
  });

  function togglePause(){
    if(!running)return;

    paused=!paused;

    if(paused){
      clearInterval(timer);
      msg.textContent='PAUSED';
      pauseBtn.textContent='▶ متابعة';
    }else{
      msg.textContent='';
      pauseBtn.textContent='Ⅱ إيقاف مؤقت';
      startLoop();
    }
  }

  playBtn.onclick=start;
  pauseBtn.onclick=togglePause;

  restartBtn.onclick=()=>{
    if(runStarted)recordRound();
    reset();
    start();
  };

  reset();
})();
</script>
</body>
</html>
