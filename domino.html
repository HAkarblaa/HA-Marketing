<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>دومينو - HA Marketing</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f5f5f5;color:#111}.wrap{width:96%;max-width:1050px;margin:25px auto}h1{text-align:center}.sub{text-align:center;color:#666}.board{background:#185d39;border-radius:18px;padding:18px;min-height:240px;box-shadow:0 4px 16px #0002}.chain{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;min-height:180px}.tile{display:inline-flex;background:#fff;border:2px solid #111;border-radius:7px;overflow:hidden;cursor:pointer;box-shadow:0 2px 5px #0002}.tile span{width:34px;height:48px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700}.tile span+span{border-right:2px solid #111}.hand{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:15px 0}.panel{background:#fff;border-radius:15px;padding:15px;margin-top:12px;text-align:center}.actions{display:flex;gap:8px;justify-content:center}.actions button{border:0;border-radius:10px;padding:11px 15px;background:#111;color:#fff;cursor:pointer}.status{font-weight:700;margin:10px}.back{display:block;text-align:center;margin:25px;text-decoration:none;color:#111}
</style></head><body><div class="wrap"><h1>🁣 دومينو</h1><p class="sub">نسخة مبسطة ضد الجهاز: ضع قطعة تطابق أحد طرفي السلسلة.</p><div class="board"><div id="chain" class="chain"></div></div><div class="panel"><div id="status" class="status"></div><div id="hand" class="hand"></div><div class="actions"><button id="draw">اسحب قطعة</button><button id="new">لعبة جديدة</button></div></div><a class="back" href="entertainment.html">← الرجوع إلى الترفيه</a></div>
<script>
let stock=[],player=[],cpu=[],chain=[],turn='player',over=false;
function makeSet(){let a=[];for(let i=0;i<=6;i++)for(let j=i;j<=6;j++)a.push([i,j]);return a.sort(()=>Math.random()-.5)}
function init(){let set=makeSet();player=set.splice(0,7);cpu=set.splice(0,7);stock=set;chain=[];turn='player';over=false;let first=cpu.pop();chain=[first];render();status.textContent='دورك — اختر قطعة تطابق '+chain[0][0]+' أو '+chain[chain.length-1][1]}
function tile(t,click){let b=document.createElement('button');b.className='tile';b.innerHTML='<span>'+t[0]+'</span><span>'+t[1]+'</span>';if(click)b.onclick=click;return b}
function render(){chainEl=document.getElementById('chain');chainEl.innerHTML='';chain.forEach(t=>chainEl.appendChild(tile(t)));hand.innerHTML='';player.forEach((t,i)=>hand.appendChild(tile(t,()=>playPlayer(i))));if(!player.length&&!over)end('أنت فزت! 🎉');if(!cpu.length&&!over)end('الجهاز فاز.')}
function fits(t){return t[0]===chain[0][0]||t[1]===chain[0][0]||t[0]===chain[chain.length-1][1]||t[1]===chain[chain.length-1][1]}
function place(t){let L=chain[0][0],R=chain[chain.length-1][1];if(t[1]===L)chain.unshift(t);else if(t[0]===L)chain.unshift([t[1],t[0]]);else if(t[0]===R)chain.push(t);else if(t[1]===R)chain.push([t[1],t[0]]);else return false;return true}
function playPlayer(i){if(turn!=='player'||over)return;let t=player[i];if(!fits(t)){status.textContent='هذه القطعة لا تطابق الطرفين.';return}place(t);player.splice(i,1);render();if(over)return;turn='cpu';status.textContent='الجهاز يفكر...';setTimeout(cpuMove,700)}
function cpuMove(){if(over)return;let i=cpu.findIndex(fits);if(i>=0){let t=cpu.splice(i,1)[0];place(t);status.textContent='لعب الجهاز قطعة. دورك الآن.'}else if(stock.length){cpu.push(stock.pop());status.textContent='الجهاز سحب قطعة. دورك الآن.'}else status.textContent='الجهاز مرّر دوره. دورك.';turn='player';render()}
draw.onclick=()=>{if(turn!=='player'||over)return;if(stock.length){player.push(stock.pop());status.textContent='سحبت قطعة.';render()}else status.textContent='لا توجد قطع للسحب.'};new.onclick=init;function end(msg){over=true;status.textContent=msg}init();
</script></body></html>
