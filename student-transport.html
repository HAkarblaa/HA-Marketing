<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>النقل الطلابي</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7fb}.w{width:min(1000px,94%);margin:20px auto}.c{background:#fff;border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 3px 14px #0001}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}input,select,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;margin:5px 0}button,.b{border:0;background:#111;color:#fff;border-radius:10px;padding:11px 14px;text-decoration:none}.route h3{margin:3px 0}.muted{color:#667;line-height:1.7}#editor{display:none}@media(max-width:650px){.g{grid-template-columns:1fr}}</style></head><body><div class=w><a class=b href="study.html">← دراسة</a><h1>🚌 النقل الطلابي</h1><div class=c><div style="display:flex;gap:8px;align-items:center;justify-content:space-between"><div><h2>خطوط النقل المتوفرة</h2><div class=muted>الجميع يقدر يشاهد الخطوط، لكن تسجيل خط جديد مخصص لموظف النقل المعتمد أو الأدمن الرئيسي.</div></div><button onclick=openEditor()>＋ تسجيل خط</button></div></div><div id=editor class=c><h2>تسجيل خط نقل</h2><div class=g><input id=driver placeholder="اسم السائق"><input id=phone placeholder="الهاتف"><select id=vehicle><option>باص</option><option>فان</option><option>سيارة</option></select><input id=from placeholder="منطقة الانطلاق"><input id=to placeholder="المدرسة / الجامعة"><input id=seats type=number min=1 placeholder="عدد المقاعد"><input id=available type=number min=0 placeholder="المقاعد المتوفرة"><input id=goTime type=time><input id=backTime type=time><input id=price type=number min=0 placeholder="الاشتراك الشهري"><input id=days placeholder="الأيام: الأحد - الخميس"><input id=plate placeholder="رقم المركبة"></div><textarea id=notes placeholder="المسار، نقاط التوقف، ملاحظات"></textarea><button onclick=saveRoute() style="width:100%">حفظ الخط</button><div id=msg></div></div><div id=routes class=g></div></div><script>const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});
let me=null,can=false;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function init(){const {data:{session}}=await db.auth.getSession();me=session?.user||null;if(me){const [r,a]=await Promise.all([db.rpc('has_approved_role',{p_role:'delivery_driver'}),db.from('app_admins').select('is_super_admin,is_active').eq('user_id',me.id).maybeSingle()]);can=!!r.data||!!(a.data?.is_super_admin&&a.data?.is_active)}load()}function openEditor(){if(!me)return location.href='login.html?next=student-transport.html';if(!can)return alert('يجب أن يكون حسابك موظف نقل (مندوب معتمد) أو الأدمن الرئيسي لتسجيل خط.');editor.style.display='block';editor.scrollIntoView({behavior:'smooth'})}async function saveRoute(){if(!can)return;let row={owner_user_id:me.id,driver_name:driver.value.trim(),phone:phone.value.trim(),vehicle_type:vehicle.value,from_area:from.value.trim(),to_institution:to.value.trim(),seats:+seats.value||0,available_seats:+available.value||0,pickup_time:goTime.value||null,return_time:backTime.value||null,monthly_price:+price.value||0,days:days.value.trim()||null,plate_number:plate.value.trim()||null,notes:notes.value.trim()||null};if(!row.driver_name||!row.phone||!row.from_area||!row.to_institution||!row.seats)return msg.textContent='أكمل الحقول الأساسية.';const {error}=await db.from('student_transport_routes').insert(row);msg.textContent=error?error.message:'✅ تم تسجيل الخط';if(!error){editor.style.display='none';load()}}async function load(){const {data,error}=await db.from('student_transport_routes').select('*').eq('is_active',true).order('created_at',{ascending:false});if(error){routes.innerHTML='<div class=c>شغّل ملف SQL الجديد أولاً.</div>';return}routes.innerHTML=(data||[]).map(x=>`<article class="c route"><h3>${esc(x.from_area)} ← ${esc(x.to_institution)}</h3><div>👤 ${esc(x.driver_name)} • 🚐 ${esc(x.vehicle_type)}</div><div class=muted>المقاعد: ${x.available_seats} / ${x.seats}<br>الذهاب: ${esc(x.pickup_time||'—')} • العودة: ${esc(x.return_time||'—')}<br>الأيام: ${esc(x.days||'—')}<br>الاشتراك: ${Number(x.monthly_price||0).toLocaleString('ar-IQ')} د.ع</div><a class=b href="tel:${esc(x.phone)}" style="display:inline-block;margin-top:8px">اتصال</a></article>`).join('')||'<div class=c>لا توجد خطوط مسجلة حالياً.</div>'}init();</script></body></html>
