<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الأدعية - HA Marketing</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f5f5f5;color:#111}
.wrap{width:94%;max-width:900px;margin:30px auto}
h1{text-align:center}
.intro{text-align:center;color:#666;line-height:1.8}
.item{width:100%;background:#fff;border:0;border-radius:15px;padding:18px;margin:9px 0;text-align:right;box-shadow:0 3px 12px #0001;cursor:pointer}
.item span{display:block;font-size:20px;font-weight:700}
.item small{display:block;color:#666;margin-top:6px}
.reader{display:none;background:#fff;border-radius:18px;padding:20px;box-shadow:0 4px 16px #0001;margin-top:12px}
.reader.show{display:block}
.reader h2{text-align:center;font-size:27px;margin-top:8px}
.body{font-family:"Traditional Arabic","Amiri",serif;font-size:24px;line-height:2.15;text-align:right}
.body p{margin:10px 0}
.body h2,.body h3,.body h4{font-family:Arial,Tahoma,sans-serif}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.controls button{border:0;border-radius:10px;background:#111;color:#fff;padding:11px 14px;cursor:pointer;font-size:15px}
.controls button.light{background:#eee;color:#111}
.status{text-align:center;color:#666;padding:16px}
.source{font-size:13px;color:#666;margin-top:18px;border-top:1px solid #eee;padding-top:12px}
.back{display:block;text-align:center;margin:25px;text-decoration:none;color:#111}
@media(max-width:600px){.body{font-size:21px}}
</style>
</head>
<body>
<div class="wrap">
<h1>🤲 الأدعية</h1>
<p class="intro">اختر الاسم؛ يفتح النص الكامل داخل نفس الصفحة. زر الرجوع بالموبايل يرجعك أولاً إلى قائمة الأدعية.</p>

<div id="list"><button class="item" data-title="دعاء كميل">
  <span>دعاء كميل</span>
  <small>اضغط لفتح النص الكامل داخل نفس الصفحة</small>
</button>
<button class="item" data-title="دعاء التوسل">
  <span>دعاء التوسل</span>
  <small>اضغط لفتح النص الكامل داخل نفس الصفحة</small>
</button>
<button class="item" data-title="دعاء العهد">
  <span>دعاء العهد</span>
  <small>اضغط لفتح النص الكامل داخل نفس الصفحة</small>
</button>
<button class="item" data-title="دعاء الفرج">
  <span>دعاء الفرج</span>
  <small>اضغط لفتح النص الكامل داخل نفس الصفحة</small>
</button></div>

<section id="reader" class="reader">
  <div class="controls">
    <button id="backBtn" class="light" type="button">← الرجوع للقائمة</button>
    <button id="speakBtn" type="button">🔊 قراءة النص</button>
    <button id="stopBtn" class="light" type="button">⏹ إيقاف الصوت</button>
  </div>
  <h2 id="readerTitle"></h2>
  <div id="status" class="status">جاري تحميل النص...</div>
  <div id="body" class="body"></div>
  <div class="source">المصدر النصي: ويكي مصدر العربية. يتم تحميل النص الكامل عند فتح الدعاء أو الزيارة.</div>
</section>

<a class="back" href="religious.html">← الرجوع إلى الأمور الدينية</a>
</div>

<script>
const API='https://ar.wikisource.org/w/api.php';
const list=document.getElementById('list');
const reader=document.getElementById('reader');
const readerTitle=document.getElementById('readerTitle');
const body=document.getElementById('body');
const statusBox=document.getElementById('status');
let readerOpen=false;

function cleanHtml(html){
  const box=document.createElement('div');
  box.innerHTML=html;

  box.querySelectorAll(
    'style,script,.mw-editsection,.navbox,.metadata,.ambox,.hatnote,.sistersitebox,.noprint,.catlinks,table'
  ).forEach(x=>x.remove());

  box.querySelectorAll('a').forEach(a=>{
    const span=document.createElement('span');
    span.innerHTML=a.innerHTML;
    a.replaceWith(span);
  });

  return box.innerHTML;
}

async function searchPage(title){
  const q=new URLSearchParams({
    action:'query',
    list:'search',
    srsearch:'intitle:"'+title+'"',
    srnamespace:'0',
    srlimit:'5',
    format:'json',
    origin:'*'
  });
  const r=await fetch(API+'?'+q);
  const j=await r.json();
  const results=j?.query?.search||[];
  const exact=results.find(x=>x.title.trim()===title.trim());
  return (exact||results[0])?.title||null;
}

async function fetchFullText(title){
  let pageTitle=title;
  let q=new URLSearchParams({
    action:'parse',page:pageTitle,prop:'text',format:'json',origin:'*'
  });
  let r=await fetch(API+'?'+q);
  let j=await r.json();

  if(j.error){
    pageTitle=await searchPage(title);
    if(!pageTitle) throw new Error('not found');
    q=new URLSearchParams({
      action:'parse',page:pageTitle,prop:'text',format:'json',origin:'*'
    });
    r=await fetch(API+'?'+q);
    j=await r.json();
  }

  if(!j?.parse?.text?.['*']) throw new Error('empty');
  return cleanHtml(j.parse.text['*']);
}

async function openReader(title,push=true){
  list.style.display='none';
  reader.classList.add('show');
  readerTitle.textContent=title;
  body.innerHTML='';
  statusBox.style.display='block';
  statusBox.textContent='جاري تحميل النص الكامل...';
  readerOpen=true;

  if(push) history.pushState({reader:true,title},'',location.href);

  try{
    body.innerHTML=await fetchFullText(title);
    statusBox.style.display='none';
  }catch(e){
    statusBox.style.display='block';
    statusBox.textContent='تعذر تحميل النص الكامل لهذا العنوان من المصدر حالياً. حاول مرة أخرى لاحقاً.';
  }
  window.scrollTo(0,0);
}

function showList(){
  speechSynthesis.cancel();
  reader.classList.remove('show');
  list.style.display='block';
  readerOpen=false;
  body.innerHTML='';
  window.scrollTo(0,0);
}

document.querySelectorAll('.item').forEach(btn=>{
  btn.addEventListener('click',()=>openReader(btn.dataset.title,true));
});

document.getElementById('backBtn').addEventListener('click',()=>{
  if(readerOpen) history.back();
  else showList();
});

window.addEventListener('popstate',()=>{
  if(readerOpen) showList();
});

document.getElementById('speakBtn').addEventListener('click',()=>{
  const txt=body.innerText.trim();
  if(!txt)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt);
  u.lang='ar-SA';
  u.rate=.82;
  speechSynthesis.speak(u);
});
document.getElementById('stopBtn').addEventListener('click',()=>speechSynthesis.cancel());
</script>
</body>
</html>
