<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دليل الدراسة</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f5f5}.top{background:#000;color:#fff;padding:12px 14px;display:flex;gap:10px;align-items:center}.top button{width:44px;height:44px;border:0;border-radius:10px;background:#fff;font-size:21px}.wrap{width:min(1000px,94%);margin:18px auto}.filters,.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 3px 12px #0001;margin-bottom:12px}.row{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}input,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px}.card{display:grid;grid-template-columns:90px 1fr;gap:14px}.card img{width:90px;height:90px;object-fit:cover;border-radius:12px;background:#eee}.card h3{margin:0 0 5px}.meta{color:#666;line-height:1.7}.actions{margin-top:9px;display:flex;gap:7px;flex-wrap:wrap}.actions a{background:#111;color:#fff;padding:8px 11px;border-radius:9px;text-decoration:none}.empty{text-align:center;padding:35px;color:#777}@media(max-width:650px){.row{grid-template-columns:1fr}.card{grid-template-columns:70px 1fr}.card img{width:70px;height:70px}}</style></head><body><div class="top"><button onclick="history.back()">←</button><h2 style="margin:0;font-size:19px">🏫 دليل المؤسسات الدراسية</h2></div><main class="wrap"><div class="filters"><div class="row"><input id="q" placeholder="بحث بالاسم أو المنطقة" oninput="load()"><select id="type" onchange="load()"><option value="">كل الأنواع</option><option>مدرسة</option><option>جامعة</option><option>معهد</option><option>مركز تقوية</option><option>مدرس خصوصي</option><option>دورة تدريبية</option></select><input id="gov" placeholder="المحافظة" oninput="load()"><input id="area" placeholder="المنطقة" oninput="load()"></div></div><div id="list"></div></main><script>
const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});function e(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){let r=await db.from('study_directory').select('*').eq('is_active',true).order('sort_order').order('created_at',{ascending:false});let a=r.data||[];const x=q.value.trim().toLowerCase(),g=gov.value.trim().toLowerCase(),ar=area.value.trim().toLowerCase();if(type.value)a=a.filter(v=>v.type===type.value);if(x)a=a.filter(v=>(v.name+' '+(v.area||'')+' '+(v.description||'')).toLowerCase().includes(x));if(g)a=a.filter(v=>(v.governorate||'').toLowerCase().includes(g));if(ar)a=a.filter(v=>((v.area||'')+' '+(v.address||'')).toLowerCase().includes(ar));list.innerHTML=a.length?a.map(v=>`<div class="card"><img src="${e(v.image_url||'main.jpg')}" onerror="this.src='main.jpg'"><div><h3>${e(v.name)}</h3><div class="meta">${e(v.type)} • ${e(v.governorate||'')} ${e(v.area||'')}<br>${e(v.address||'')}<br>${e(v.description||'')}</div><div class="actions">${v.phone?`<a href="tel:${e(v.phone)}">📞 اتصال</a>`:''}${v.map_url?`<a href="${e(v.map_url)}" target="_blank">📍 الموقع</a>`:''}</div></div></div>`).join(''):'<div class="empty">لا توجد نتائج حالياً.</div>'}load();</script></body></html>
