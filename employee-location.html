const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});const id=new URLSearchParams(location.search).get('order');let watch=null,last=0;async function verify(){const {data:u}=await db.auth.getUser();if(!u?.user||!id){status.textContent='الرابط أو الحساب غير صالح';start.disabled=true;return}const {data:o}=await db.from('orders').select('id,status,assigned_employee_id').eq('id',id).maybeSingle();if(!o||o.assigned_employee_id!==u.user.id||o.status!=='on_the_way'){status.textContent='هذا الطلب غير جاهز لمشاركة الموقع';start.disabled=true;return}status.textContent='جاهز لبدء مشاركة الموقع.'}start.onclick=()=>{if(!navigator.geolocation){alert('GPS غير مدعوم');return}start.disabled=true;stop.disabled=false;status.textContent='جاري تحديد موقعك...';watch=HA_LocationUX.watchPosition(async p=>{if(Date.now()-last<5000)return;last=Date.now();const {error}=await db.rpc('employee_update_location',{p_order_id:Number(id),p_lat:p.coords.latitude,p_lng:p.coords.longitude});status.textContent=error?'تعذر إرسال الموقع: '+error.message:'🟢 موقعك يرسل مباشرة — الدقة '+Math.round(p.coords.accuracy)+' متر'},()=>{status.textContent='تعذر الوصول إلى GPS. فعّل الموقع ثم حاول مرة ثانية.';start.disabled=false;stop.disabled=true;watch=null;},{enableHighAccuracy:true,maximumAge:0,timeout:15000})};stop.onclick=()=>{if(watch!==null)navigator.geolocation.clearWatch(watch);watch=null;start.disabled=false;stop.disabled=true;status.textContent='تم إيقاف المشاركة.'};verify();
