<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مشاركة موقع الموظف - HA Marketing</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f5f5f5;color:#111}
.wrap{width:94%;max-width:650px;margin:35px auto}
h1{text-align:center}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 16px #0001;margin:14px 0}
.status{padding:13px;border-radius:10px;background:#fff;text-align:center;margin-bottom:14px;line-height:1.7}
button,a.btn{width:100%;display:block;padding:14px;border:0;border-radius:10px;margin-top:10px;text-align:center;text-decoration:none;font-size:16px;cursor:pointer}
.primary{background:#111;color:#fff}
.danger{background:#b00020;color:#fff}
.light{background:#eaeaea;color:#111}
button:disabled{opacity:.55;cursor:not-allowed}
.info{background:#f7f7f7;border-radius:10px;padding:13px;margin-top:12px;line-height:1.9}
.small{color:#666;font-size:14px;line-height:1.7}
</style>
</head>

<body>
<div class="wrap">

<h1>🚗 مشاركة موقع الموظف</h1>

<div id="pageStatus" class="status">جاري التحقق من الطلب...</div>

<div id="controlCard" class="card" style="display:none">
  <div class="info">
    <div><strong>رقم الطلب:</strong> <span id="orderNumber">-</span></div>
    <div><strong>حالة الطلب:</strong> <span id="orderStatus">-</span></div>
    <div><strong>آخر دقة GPS:</strong> <span id="gpsAccuracy">-</span></div>
  </div>

  <button id="startBtn" class="primary" type="button">📍 ابدأ مشاركة موقعي</button>
  <button id="stopBtn" class="danger" type="button" disabled>⏹ إيقاف مشاركة الموقع</button>

  <p class="small">
    اترك هذه الصفحة مفتوحة أثناء توجهك إلى العميل. سيطلب المتصفح إذن الوصول إلى الموقع.
    عند إيقاف المشاركة يتوقف إرسال تحديثات الموقع.
  </p>
</div>

<a class="btn light" href="index.html">← الرجوع إلى الرئيسية</a>

</div>

<script>
const db=supabase.createClient(
 'https://ubayrhtshgtgggxprrek.supabase.co',
 'sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll'
);

const params=new URLSearchParams(location.search);
const orderId=params.get('order');

let currentUser=null;
let watchId=null;
let lastSentAt=0;

async function init(){
 const {data}=await db.auth.getUser();
 currentUser=data.user||null;

 if(!currentUser){
  pageStatus.textContent='يجب تسجيل الدخول أولاً.';
  return;
 }

 if(!orderId){
  pageStatus.textContent='رقم الطلب غير موجود في الرابط.';
  return;
 }

 orderNumber.textContent=orderId;

 const {data:order,error}=await db
  .from('service_orders')
  .select('id,status')
  .eq('id',orderId)
  .maybeSingle();

 if(error){
  pageStatus.textContent='تعذر قراءة الطلب: '+error.message;
  return;
 }

 if(!order){
  pageStatus.textContent='الطلب غير موجود أو ليس لديك صلاحية للوصول إليه.';
  return;
 }

 orderStatus.textContent=order.status||'-';

 if(order.status!=='بالطريق'){
  pageStatus.textContent='مشاركة الموقع تعمل فقط عندما تكون حالة الطلب «بالطريق».';
  return;
 }

 pageStatus.textContent='الطلب جاهز لبدء مشاركة الموقع.';
 controlCard.style.display='block';
}

async function sendLocation(position){
 const now=Date.now();

 // لا نرسل أكثر من تحديث واحد كل 5 ثوانٍ.
 if(now-lastSentAt<5000)return;
 lastSentAt=now;

 const lat=position.coords.latitude;
 const lng=position.coords.longitude;
 const accuracy=Math.round(position.coords.accuracy);

 gpsAccuracy.textContent=accuracy+' متر';
 pageStatus.textContent='🟢 جاري مشاركة موقعك — آخر تحديث الآن...';

 const {error}=await db
  .from('service_orders')
  .update({
   employee_lat:lat,
   employee_lng:lng,
   updated_at:new Date().toISOString()
  })
  .eq('id',orderId)
  .eq('status','بالطريق');

 if(error){
  pageStatus.textContent='تعذر إرسال الموقع: '+error.message;
 }
}

function locationError(error){
 let msg='تعذر تحديد موقعك.';

 if(error.code===error.PERMISSION_DENIED){
  msg='تم رفض إذن الموقع. اسمح للموقع بالوصول إلى GPS ثم حاول مرة أخرى.';
 }else if(error.code===error.POSITION_UNAVAILABLE){
  msg='الموقع غير متوفر حالياً. تأكد من تشغيل GPS.';
 }else if(error.code===error.TIMEOUT){
  msg='انتهت مهلة تحديد الموقع. حاول مرة أخرى.';
 }

 pageStatus.textContent='❌ '+msg;
 stopSharing();
}

function startSharing(){
 if(!navigator.geolocation){
  pageStatus.textContent='هذا المتصفح لا يدعم تحديد الموقع.';
  return;
 }

 if(watchId!==null)return;

 startBtn.disabled=true;
 stopBtn.disabled=false;
 pageStatus.textContent='يرجى السماح بالوصول إلى موقعك...';

 watchId=navigator.geolocation.watchPosition(
  sendLocation,
  locationError,
  {
   enableHighAccuracy:true,
   maximumAge:0,
   timeout:15000
  }
 );
}

function stopSharing(){
 if(watchId!==null){
  navigator.geolocation.clearWatch(watchId);
  watchId=null;
 }

 startBtn.disabled=false;
 stopBtn.disabled=true;

 if(pageStatus.textContent.startsWith('🟢')){
  pageStatus.textContent='تم إيقاف مشاركة الموقع.';
 }
}

startBtn.addEventListener('click',startSharing);
stopBtn.addEventListener('click',stopSharing);

window.addEventListener('beforeunload',()=>{
 if(watchId!==null)navigator.geolocation.clearWatch(watchId);
});

init();
</script>
</body>
</html>
