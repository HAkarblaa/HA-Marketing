<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>موقع الموظف</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;background:#f5f5f5;direction:rtl;margin:0}.wrap{width:94%;max-width:650px;margin:30px auto}.card{background:#fff;padding:20px;border-radius:16px}button,a{display:block;width:100%;box-sizing:border-box;padding:14px;margin-top:10px;border:0;border-radius:10px;text-align:center;text-decoration:none}.primary{background:#111;color:#fff}.danger{background:#a90020;color:#fff}.light{background:#eee;color:#111}</style></head><body><div class="wrap"><div class="card"><h1>📍 مشاركة موقع الموظف</h1><p id="status">جاري التحقق...</p><button id="start" class="primary">ابدأ مشاركة موقعي الحقيقي</button><button id="stop" class="danger" disabled>إيقاف المشاركة</button><a class="light" href="employee-orders.html">← الطلبات</a></div></div><script>
const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll');const id=new URLSearchParams(location.search).get('order');let watch=null,last=0;async function verify(){const {data:u}=await db.auth.getUser();if(!u?.user||!id){status.textContent='الرابط أو الحساب غير صالح';start.disabled=true;return}const {data:o}=await db.from('orders').select('id,status,assigned_employee_id').eq('id',id).maybeSingle();if(!o||o.assigned_employee_id!==u.user.id||o.status!=='on_the_way'){status.textContent='هذا الطلب غير جاهز لمشاركة الموقع';start.disabled=true;return}status.textContent='جاهز لبدء مشاركة الموقع.'}start.onclick=()=>{if(!navigator.geolocation){alert('GPS غير مدعوم');return}start.disabled=true;stop.disabled=false;watch=navigator.geolocation.watchPosition(async p=>{if(Date.now()-last<5000)return;last=Date.now();const {error}=await db.rpc('employee_update_location',{p_order_id:Number(id),p_lat:p.coords.latitude,p_lng:p.coords.longitude});status.textContent=error?'تعذر إرسال الموقع: '+error.message:'🟢 موقعك يرسل مباشرة — الدقة '+Math.round(p.coords.accuracy)+' متر'},()=>{status.textContent='تعذر الوصول إلى GPS';},{enableHighAccuracy:true,maximumAge:0,timeout:15000})};stop.onclick=()=>{if(watch!==null)navigator.geolocation.clearWatch(watch);watch=null;start.disabled=false;stop.disabled=true;status.textContent='تم إيقاف المشاركة.'};verify();
</script></body></html>
