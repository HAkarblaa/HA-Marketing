challenge_entries(count)').eq('is_active',true).order('created_at',{ascending:false});let a=r.data||[],t=q.value.trim().toLowerCase();if(t)a=a.filter(x=>(x.title+' '+x.sport+' '+(x.details||'')).toLowerCase().includes(t));list.innerHTML=a.map(x=>`<div class=item><h3>${e(x.title)}</h3><b>${e(x.sport)}</b><p>${e(x.details||'')}</p><div>النهاية: ${e(x.end_date||'مفتوح')} • المشاركون: ${x.study_sports_challenge_entries?.[0]?.count||0}</div><button onclick="join(${x.id})">انضم للتحدي</button></div>`).join('')||'لا توجد تحديات حالياً.'}init()</script><script src="ha-lux-icons.js?v=20260930-1" defer></script></body></html>
