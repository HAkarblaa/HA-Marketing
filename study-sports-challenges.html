<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التحديات الرياضية</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f4f7fb}.w{width:min(950px,94%);margin:20px auto}.c{background:#fff;padding:16px;border-radius:18px;margin:10px 0;box-shadow:0 4px 15px #0001}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}input,select,textarea,button{width:100%;padding:11px;border-radius:10px;border:1px solid #ddd;margin:4px 0}button,.b{background:#111;color:#fff;border:0;text-decoration:none;display:inline-block;padding:10px;border-radius:10px}.item{border-top:1px solid #eee;padding:12px 0}@media(max-width:650px){.g{grid-template-columns:1fr}}</style></head><body><div class=w><a class=b href="study.html">← الدراسة</a><h1>🏆 التحديات الرياضية</h1><div class=c><h2>إضافة تحدٍ</h2><div class=g><input id=title placeholder="اسم التحدي"><select id=sport><option>كرة القدم</option><option>الجري</option><option>اللياقة</option><option>كرة السلة</option><option>رياضة أخرى</option></select><input id=end type=date></div><textarea id=details placeholder="تفاصيل وشروط التحدي"></textarea><button onclick=add()>نشر التحدي</button><div id=msg></div></div><div class=c><input id=q placeholder="بحث بالتحديات" oninput=load()><div id=list></div></div></div><script>const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{storageKey:'ha-marketing-auth',persistSession:true}});let me=null;const e=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function init(){const r=await db.auth.getSession();me=r.data.session?.user||null;load()}async function add(){if(!me)return location.href='login.html?next=study-sports-challenges.html';if(!title.value.trim())return alert('اكتب اسم التحدي');const r=await db.from('study_sports_challenges').insert({creator_id:me.id,title:title.value.trim(),sport:sport.value,details:details.value.trim()||null,end_date:end.value||null});msg.textContent=r.error?r.error.message:'✅ تم نشر التحدي';if(!r.error){title.value=details.value='';load()}}async function join(id){if(!me)return location.href='login.html?next=study-sports-challenges.html';const r=await db.from('study_sports_challenge_entries').upsert({challenge_id:id,user_id:me.id},{onConflict:'challenge_id,user_id'});alert(r.error?r.error.message:'تم الانضمام للتحدي')}async function load(){let r=await db.from('study_sports_challenges').select('*,study_sports_challenge_entries(count)').eq('is_active',true).order('created_at',{ascending:false});let a=r.data||[],t=q.value.trim().toLowerCase();if(t)a=a.filter(x=>(x.title+' '+x.sport+' '+(x.details||'')).toLowerCase().includes(t));list.innerHTML=a.map(x=>`<div class=item><h3>${e(x.title)}</h3><b>${e(x.sport)}</b><p>${e(x.details||'')}</p><div>النهاية: ${e(x.end_date||'مفتوح')} • المشاركون: ${x.study_sports_challenge_entries?.[0]?.count||0}</div><button onclick="join(${x.id})">انضم للتحدي</button></div>`).join('')||'لا توجد تحديات حالياً.'}init()</script></body></html>
