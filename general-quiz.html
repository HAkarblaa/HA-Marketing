<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>أسئلة عامة - HA Marketing</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f5f5f5;color:#111}.wrap{width:95%;max-width:1000px;margin:26px auto}h1{text-align:center}.sub{text-align:center;color:#666}
.game{display:grid;grid-template-columns:75px 1fr;gap:14px}.side{position:sticky;top:18px;display:flex;flex-direction:column;align-items:center;gap:10px}.ball{width:58px;height:58px;border-radius:50%;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.rail{height:350px;width:9px;background:#ddd;border-radius:99px;position:relative}.fill{position:absolute;bottom:0;width:100%;height:0;background:#111;border-radius:99px;transition:.3s}.arr{position:absolute;left:50%;bottom:0;transform:translate(-50%,50%);transition:.3s}
.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 4px 18px #0001;min-height:430px}.top{display:flex;justify-content:space-between;align-items:center}.timer{width:54px;height:54px;border-radius:50%;background:conic-gradient(#111 var(--p,100%),#ddd 0);display:flex;align-items:center;justify-content:center;position:relative}.timer:before{content:"";position:absolute;inset:6px;background:#fff;border-radius:50%}.timer span{position:relative;font-weight:700}
.q{font-size:24px;line-height:1.7;margin:20px 0}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.ans{border:2px solid #e2e2e2;background:#fafafa;border-radius:14px;padding:15px;text-align:right;font-size:17px;cursor:pointer}.ans.correct{background:#e8f7eb;border-color:#34a853}.ans.wrong{background:#fdeaea;border-color:#d93025}.mark{font-size:50px;text-align:center;min-height:62px;margin-top:12px}.result{display:none;text-align:center}.result.show{display:block}.score{font-size:48px;font-weight:700;margin:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f7f7f7;border-radius:12px;padding:13px}button.restart{border:0;background:#111;color:#fff;padding:13px 20px;border-radius:11px;margin-top:15px;cursor:pointer}.back{display:block;text-align:center;margin:25px;text-decoration:none;color:#111}
@media(max-width:700px){.game{grid-template-columns:55px 1fr;gap:7px}.rail{height:290px}.answers{grid-template-columns:1fr}.q{font-size:20px}.stats{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><h1>❓ أسئلة عامة</h1><p class="sub">20 مرحلة، 15 ثانية لكل سؤال، والأسئلة تتغير بكل جولة.</p>
<div class="game"><aside class="side"><div class="ball" id="ball">1</div><div class="rail"><div id="fill" class="fill"></div><div id="arr" class="arr">⬆️</div></div></aside>
<main class="card"><div id="quiz"><div class="top"><b>المرحلة <span id="stage">1</span> من 20</b><div id="timer" class="timer"><span id="time">15</span></div></div><div id="q" class="q"></div><div id="answers" class="answers"></div><div id="mark" class="mark"></div></div>
<div id="result" class="result"><h2>انتهت الجولة 🎉</h2><div id="pct" class="score">0%</div><div class="stats"><div class="stat"><b id="ok">0</b><div>صح</div></div><div class="stat"><b id="bad">0</b><div>خطأ</div></div><div class="stat"><b id="skip">0</b><div>بدون جواب</div></div></div><button id="restart" class="restart">جولة جديدة</button></div></main></div><a class="back" href="entertainment.html">← الرجوع إلى الترفيه</a></div>
<script>const BANK=[{"q": "ما أكبر كوكب في المجموعة الشمسية؟", "a": ["الأرض", "المريخ", "المشتري", "الزهرة"], "c": 2}, {"q": "ما عاصمة العراق؟", "a": ["بغداد", "البصرة", "الموصل", "أربيل"], "c": 0}, {"q": "كم عدد قارات العالم؟", "a": ["5", "6", "7", "8"], "c": 2}, {"q": "ما أسرع حيوان بري؟", "a": ["الأسد", "الفهد", "الحصان", "الغزال"], "c": 1}, {"q": "أي عضو يضخ الدم في جسم الإنسان؟", "a": ["الرئة", "القلب", "الكبد", "المعدة"], "c": 1}, {"q": "ما الغاز الذي يتنفسه الإنسان أساساً؟", "a": ["الأكسجين", "الهيدروجين", "الهيليوم", "النيون"], "c": 0}, {"q": "كم يوماً في السنة العادية؟", "a": ["360", "364", "365", "366"], "c": 2}, {"q": "ما عاصمة مصر؟", "a": ["القاهرة", "الإسكندرية", "الأقصر", "أسوان"], "c": 0}, {"q": "أي محيط هو الأكبر؟", "a": ["الهندي", "الأطلسي", "الهادئ", "المتجمد"], "c": 2}, {"q": "كم ضلعاً للمثلث؟", "a": ["2", "3", "4", "5"], "c": 1}, {"q": "ما الكوكب المعروف بالكوكب الأحمر؟", "a": ["المريخ", "زحل", "عطارد", "نبتون"], "c": 0}, {"q": "ما الحيوان الذي يملك ثمانية أذرع؟", "a": ["الحوت", "الأخطبوط", "القرش", "الدلفين"], "c": 1}, {"q": "ما عاصمة فرنسا؟", "a": ["روما", "مدريد", "باريس", "برلين"], "c": 2}, {"q": "أي حاسة تستخدمها الأذن؟", "a": ["الشم", "السمع", "البصر", "اللمس"], "c": 1}, {"q": "كم شهراً في السنة؟", "a": ["10", "11", "12", "13"], "c": 2}, {"q": "ما ناتج 9 × 7؟", "a": ["54", "56", "63", "72"], "c": 2}, {"q": "ما أكبر عضو في جسم الإنسان؟", "a": ["القلب", "الجلد", "الرئة", "الكبد"], "c": 1}, {"q": "ما لون الزمرد الشائع؟", "a": ["أخضر", "أحمر", "أزرق", "أسود"], "c": 0}, {"q": "ما اللغة الرسمية في البرازيل؟", "a": ["الإسبانية", "البرتغالية", "الفرنسية", "الإنجليزية"], "c": 1}, {"q": "كم دقيقة في الساعة؟", "a": ["50", "60", "70", "100"], "c": 1}, {"q": "ما عاصمة اليابان؟", "a": ["طوكيو", "سيول", "بكين", "كيوتو"], "c": 0}, {"q": "ما العنصر الذي رمزه الكيميائي O؟", "a": ["ذهب", "أكسجين", "حديد", "فضة"], "c": 1}, {"q": "كم ثانية في الدقيقة؟", "a": ["30", "45", "60", "90"], "c": 2}, {"q": "ما أصغر عدد أولي؟", "a": ["0", "1", "2", "3"], "c": 2}, {"q": "أي كوكب له حلقات مشهورة؟", "a": ["زحل", "الأرض", "المريخ", "عطارد"], "c": 0}, {"q": "من أين تشرق الشمس تقريباً؟", "a": ["الغرب", "الشرق", "الشمال", "الجنوب"], "c": 1}, {"q": "ما الحالة الصلبة للماء؟", "a": ["بخار", "جليد", "مطر", "ندى"], "c": 1}, {"q": "أي حيوان يُعرف بسفينة الصحراء؟", "a": ["الحصان", "الجمل", "الفيل", "الحمار الوحشي"], "c": 1}, {"q": "ما أكبر قارة مساحة؟", "a": ["أوروبا", "أفريقيا", "آسيا", "أستراليا"], "c": 2}, {"q": "ما عاصمة المملكة العربية السعودية؟", "a": ["جدة", "مكة", "الرياض", "الدمام"], "c": 2}, {"q": "ما عاصمة الإمارات؟", "a": ["دبي", "أبوظبي", "الشارقة", "العين"], "c": 1}, {"q": "ما عاصمة لبنان؟", "a": ["بيروت", "طرابلس", "صيدا", "بعلبك"], "c": 0}, {"q": "ما عاصمة الكويت؟", "a": ["الكويت", "حولي", "الجهراء", "الأحمدي"], "c": 0}, {"q": "أي آلة تقيس درجة الحرارة؟", "a": ["البارومتر", "الترمومتر", "البوصلة", "المسطرة"], "c": 1}, {"q": "ما المادة التي تجذب الحديد؟", "a": ["المغناطيس", "الزجاج", "الخشب", "الورق"], "c": 0}, {"q": "ما الحيوان الأكبر على الأرض؟", "a": ["الفيل", "الحوت الأزرق", "الزرافة", "وحيد القرن"], "c": 1}, {"q": "كم ساعة في اليوم؟", "a": ["12", "18", "24", "30"], "c": 2}, {"q": "أي شكل له أربعة أضلاع متساوية وزوايا قائمة؟", "a": ["مثلث", "دائرة", "مربع", "خماسي"], "c": 2}, {"q": "ما الكوكب الأقرب للشمس؟", "a": ["الأرض", "عطارد", "الزهرة", "المريخ"], "c": 1}, {"q": "ما عاصمة تركيا؟", "a": ["إسطنبول", "أنقرة", "إزمير", "بورصة"], "c": 1}, {"q": "ما عاصمة سوريا؟", "a": ["حلب", "دمشق", "حمص", "اللاذقية"], "c": 1}, {"q": "ما عاصمة قطر؟", "a": ["الدوحة", "الريان", "الوكرة", "الخور"], "c": 0}, {"q": "ما عاصمة البحرين؟", "a": ["المنامة", "المحرق", "الرفاع", "سترة"], "c": 0}, {"q": "ما عاصمة سلطنة عُمان؟", "a": ["صلالة", "مسقط", "صحار", "نزوى"], "c": 1}, {"q": "أي كائن يصنع العسل؟", "a": ["النمل", "النحل", "الفراش", "الخنفساء"], "c": 1}, {"q": "ما وحدة قياس الطول الأساسية في النظام المتري؟", "a": ["متر", "لتر", "غرام", "ثانية"], "c": 0}, {"q": "أي عضو يساعد على التنفس؟", "a": ["الرئتان", "الكليتان", "المعدة", "الطحال"], "c": 0}, {"q": "ما عاصمة إيطاليا؟", "a": ["ميلانو", "روما", "نابولي", "تورينو"], "c": 1}, {"q": "أي رقم يأتي بعد 99؟", "a": ["98", "100", "101", "109"], "c": 1}, {"q": "ما اسم القمر الطبيعي للأرض؟", "a": ["القمر", "فوبوس", "تيتان", "أوروبا"], "c": 0}],TOTAL=20;let qs=[],i=0,ok=0,bad=0,skip=0,left=15,t=null,locked=false;
function sh(a){a=[...a];for(let x=a.length-1;x>0;x--){let j=Math.floor(Math.random()*(x+1));[a[x],a[j]]=[a[j],a[x]]}return a}
function newGame(){qs=sh(BANK).slice(0,TOTAL);i=ok=bad=skip=0;document.getElementById('result').classList.remove('show');document.getElementById('quiz').style.display='block';render()}
function prog(){let p=i/TOTAL*100;stage.textContent=Math.min(i+1,TOTAL);ball.textContent=Math.min(i+1,TOTAL);fill.style.height=p+'%';arr.style.bottom=p+'%'}
function rt(){time.textContent=left;timer.style.setProperty('--p',(left/15*100)+'%')}
function render(){locked=false;prog();mark.textContent='';let x=qs[i];q.textContent=x.q;answers.innerHTML='';x.a.forEach((v,n)=>{let b=document.createElement('button');b.className='ans';b.textContent=v;b.onclick=()=>choose(n,b);answers.appendChild(b)});clearInterval(t);left=15;rt();t=setInterval(()=>{left--;rt();if(left<=0){clearInterval(t);timeout()}},1000)}
function disable(){document.querySelectorAll('.ans').forEach(b=>b.disabled=true)}
function choose(n,b){if(locked)return;locked=true;clearInterval(t);disable();let x=qs[i];if(n===x.c){ok++;b.classList.add('correct');mark.textContent='✅'}else{bad++;b.classList.add('wrong');answers.children[x.c].classList.add('correct');mark.textContent='❌'}setTimeout(next,3000)}
function timeout(){if(locked)return;locked=true;skip++;bad++;disable();answers.children[qs[i].c].classList.add('correct');mark.textContent='⏱️❌';setTimeout(next,3000)}
function next(){i++;i>=TOTAL?finish():render()}function finish(){clearInterval(t);quiz.style.display='none';result.classList.add('show');pct.textContent=Math.round(ok/TOTAL*100)+'%';document.getElementById('ok').textContent=ok;document.getElementById('bad').textContent=bad;document.getElementById('skip').textContent=skip;fill.style.height='100%';arr.style.bottom='100%';ball.textContent='20'}
restart.onclick=newGame;newGame();</script></body></html>
