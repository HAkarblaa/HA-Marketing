<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حسابي - HA Marketing</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f5f5f5;color:#111}.wrap{width:94%;max-width:850px;margin:25px auto}.card{background:#fff;border-radius:16px;padding:18px;margin:13px 0;box-shadow:0 4px 16px #0001}h1{text-align:center}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.muted{color:#666;font-size:14px;line-height:1.7}.badge{padding:6px 10px;border-radius:999px;background:#eee;font-weight:bold}.order{border:1px solid #ddd;border-radius:12px;padding:14px;margin-top:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button,a.btn{border:0;border-radius:9px;padding:11px 14px;text-decoration:none;text-align:center;cursor:pointer;font-size:15px}.primary{background:#111;color:#fff}.light{background:#eee;color:#111}.danger{background:#a90020;color:#fff}input,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:9px;margin-top:7px}.stars button{background:#eee;color:#111}.empty{text-align:center;color:#666;padding:20px}.topbtn{display:block;width:100%;margin-top:10px}</style></head><body><div class="wrap"><h1>👤 حسابي</h1><div class="card"><a class="btn primary topbtn" href="notifications-center.html">🔔 الإشعارات</a></div><div id="profileBox" class="card">جاري تحميل الحساب...</div><div id="employeeLink" class="card" style="display:none"><a class="btn primary topbtn" href="employee-orders.html">🧑‍💼 طلبات الموظف</a></div><div class="card"><a class="btn light topbtn" href="shop-orders.html">🛍️ طلبات المشتريات</a></div><div class="card"><div class="row"><h2>📦 طلبات الخدمة</h2><a class="btn primary" href="contact.html">+ طلب خدمة جديد</a></div><div id="ordersBox" class="empty">جاري تحميل الطلبات...</div></div><div class="card"><button class="danger topbtn" onclick="logout()">تسجيل الخروج</button><a class="btn light topbtn" href="index.html">← الرئيسية</a></div></div><script>
const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll');let me=null,profile=null;const ar={new:'جديد',accepted:'مقبول',on_the_way:'بالطريق',completed:'مكتمل',cancelled:'ملغي'};function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function init(){const {data}=await db.auth.getUser();me=data?.user||null;if(!me){profileBox.innerHTML='غير مسجل. <a href="login.html">تسجيل الدخول</a>';ordersBox.textContent='';return}const {data:p}=await db.from('profiles').select('*').eq('id',me.id).maybeSingle();profile=p;if(!p){profileBox.textContent='تعذر تحميل بيانات الحساب';return}profileBox.innerHTML='<strong>'+esc(p.full_name||p.username||'حسابي')+'</strong><div class="muted">'+esc(p.phone||'')+'<br>'+esc(p.governorate||'')+'<br>نوع الحساب: '+(p.account_type==='employee'?'موظف':'عميل')+'</div>';if(p.account_type==='employee'&&p.employee_status==='approved')employeeLink.style.display='block';if(p.account_type==='customer')await loadOrders();else ordersBox.innerHTML='<div class="empty">طلبات الخدمة الخاصة بالعملاء فقط.</div>';db.channel('account-orders-'+me.id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'orders',filter:'customer_id=eq.'+me.id},()=>loadOrders()).subscribe()}
async function loadOrders(){const {data,error}=await db.from('orders').select('id,order_type,description,area,status,assigned_employee_id,attachment_url,customer_rating,created_at').eq('customer_id',me.id).order('created_at',{ascending:false});if(error){ordersBox.textContent='تعذر تحميل الطلبات: '+error.message;return}if(!data?.length){ordersBox.innerHTML='<div class="empty">لا توجد طلبات خدمة.</div>';return}ordersBox.innerHTML=data.map(o=>`<div class="order"><div class="row"><strong>طلب #${o.id} — ${esc(o.order_type)}</strong><span class="badge">${esc(ar[o.status]||o.status)}</span></div><div class="muted">${esc(o.area||'')}<br>${new Date(o.created_at).toLocaleString('ar-IQ')}</div>${o.description?`<p>${esc(o.description)}</p>`:''}${o.attachment_url?`<a href="${esc(o.attachment_url)}" target="_blank">📎 فتح المرفق</a>`:''}<div class="actions">${o.status==='on_the_way'?`<a class="btn primary" href="track-service.html?order=${o.id}">📍 تتبع الموظف</a>`:''}${['new','accepted'].includes(o.status)?`<button class="danger" onclick="cancelOrder(${o.id})">إلغاء الطلب</button>`:''}${o.status==='completed'&&!o.customer_rating?`<button class="primary" onclick="rateOrder(${o.id})">⭐ تقييم الموظف</button>`:''}${o.customer_rating?`<span class="badge">تقييمك: ${o.customer_rating}/5</span>`:''}</div></div>`).join('')}
async function cancelOrder(id){const reason=prompt('سبب الإلغاء (اختياري):')??null;if(reason===null)return;const {error}=await db.rpc('customer_cancel_order',{p_order_id:id,p_reason:reason});if(error)alert('تعذر الإلغاء: '+error.message);else loadOrders()}
async function rateOrder(id){const r=Number(prompt('قيّم الموظف من 1 إلى 5:'));if(!Number.isInteger(r)||r<1||r>5){alert('التقييم لازم يكون من 1 إلى 5');return}const review=prompt('ملاحظة على الخدمة (اختياري):')||null;const {error}=await db.rpc('customer_rate_order',{p_order_id:id,p_rating:r,p_review:review});if(error)alert('تعذر حفظ التقييم: '+error.message);else loadOrders()}
async function logout(){localStorage.removeItem('ha_logged_in');await db.auth.signOut();location.href='login.html'}init();
</script></body></html>
