<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>إدارة الانضمام والمنصة</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{
      box-sizing:border-box
    }

    body{
      margin:0;
      font-family:Arial,Tahoma;
      background:#f5f5f5;
      color:#111
    }

    .wrap{
      width:94%;
      max-width:1050px;
      margin:22px auto
    }

    .top,
    .row{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap
    }

    .btn,
    button{
      border:0;
      border-radius:11px;
      padding:11px 14px;
      background:#111;
      color:#fff;
      text-decoration:none;
      cursor:pointer;
      font:inherit
    }

    .light{
      background:#eee;
      color:#111
    }

    .danger{
      background:#9b1028
    }

    .ok{
      background:#0c6b2a
    }

    .card{
      background:#fff;
      border-radius:16px;
      padding:15px;
      margin:12px 0;
      box-shadow:0 4px 16px #0001
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:10px
    }

    .muted{
      color:#666;
      line-height:1.7
    }

    .badge{
      display:inline-block;
      padding:5px 9px;
      border-radius:999px;
      background:#eee;
      font-size:12px
    }

    input,
    select,
    textarea{
      width:100%;
      padding:11px;
      border:1px solid #ccc;
      border-radius:10px;
      font:inherit;
      margin:5px 0 10px
    }

    textarea{
      min-height:90px
    }

    .status{
      padding:10px;
      border-radius:10px;
      background:#f1f1f1;
      white-space:pre-wrap
    }

    .approved-box{
      margin-top:10px;
      background:#e8f7ec;
      color:#086b2a;
      border:1px solid #b7e3c4;
      font-weight:bold
    }

    .rejected-box{
      margin-top:10px;
      background:#fdebec;
      color:#9b1028;
      border:1px solid #f2b9c2;
      font-weight:bold
    }

    .suspended-box{
      margin-top:10px;
      background:#f1f1f1;
      color:#555;
      border:1px solid #ddd;
      font-weight:bold
    }

    @media(max-width:720px){
      .grid{
        grid-template-columns:repeat(3,minmax(0,1fr));
        gap:6px
      }

      .card{
        padding:10px
      }

      .grid .card{
        font-size:12px
      }
    }
  </style>
</head>

<body>

<div class="wrap">

  <div class="top">
    <a class="btn light" href="admin-panel.html">
      ← لوحة الإدارة
    </a>

    <h1>🛡️ طلبات الانضمام</h1>

    <span></span>
  </div>


  <div id="gate" class="card">
    جاري التحقق...
  </div>


  <div class="card" style="border:2px solid #111">
    <div class="row">

      <div>
        <h2 style="margin:0 0 6px">
          🚚 طلبات السائقين والمندوبين
        </h2>

        <div class="muted">
          طلبات الانضمام الجديدة تظهر هنا للأدمن الرئيسي.
        </div>
      </div>

      <button onclick="load()">
        تحديث الطلبات
      </button>

    </div>
  </div>


  <div id="list">
    <div class="card">
      جاري تحميل الطلبات...
    </div>
  </div>


  <div class="card">

    <h2>
      إضافة مادة للمكتبة الدراسية
    </h2>

    <input
      id="stage"
      placeholder="المرحلة"
    >

    <input
      id="grade"
      placeholder="الصف/المرحلة"
    >

    <input
      id="subject"
      placeholder="المادة"
    >

    <input
      id="title"
      placeholder="العنوان"
    >

    <select id="type">
      <option value="lesson">محاضرة</option>
      <option value="book">كتاب</option>
      <option value="notes">ملزمة</option>
      <option value="questions">أسئلة</option>
      <option value="exam">امتحان</option>
      <option value="video">فيديو</option>
    </select>

    <input
      id="url"
      placeholder="رابط الملف أو الفيديو"
    >

    <textarea
      id="desc"
      placeholder="وصف"
    ></textarea>

    <button onclick="addMaterial()">
      إضافة
    </button>

    <div
      id="mstatus"
      class="status"
    ></div>

  </div>

</div>


<script>

const db = supabase.createClient(
  'https://ubayrhtshgtgggxprrek.supabase.co',
  'sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true,
      storageKey:'ha-marketing-auth'
    }
  }
);


let me = null;


function esc(s){

  return String(s ?? '').replace(
    /[&<>"']/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c])
  );

}


async function init(){

  const {
    data:{
      session
    }
  } = await db.auth.getSession();


  if(!session){

    location.href = 'login.html';

    return;
  }


  me = session.user;


  const {
    data:ok
  } = await db.rpc('is_super_admin');


  if(!ok){

    gate.textContent =
      'هذه الصفحة للـ Super Admin فقط.';

    return;
  }


  gate.textContent =
    '✅ Super Admin';


  load();

}


async function load(){

  list.innerHTML =
    '<div class="card">جاري تحميل طلبات الانضمام...</div>';


  try{

    await db.rpc(
      'admin_sync_transport_applications'
    );

  }catch(e){

    console.warn(
      'sync skipped:',
      e
    );

  }


  const {
    data,
    error
  } = await db
    .from('marketplace_applications')
    .select('*')
    .in(
      'role_type',
      [
        'taxi_driver',
        'delivery_driver'
      ]
    )
    .order(
      'created_at',
      {
        ascending:false
      }
    );


  if(error){

    list.innerHTML =
      '<div class="card danger">' +
      'خطأ في جلب الطلبات: ' +
      esc(error.message) +
      '</div>';

    return;
  }


  list.innerHTML =
    (data || []).map(x => {


      let roleName =

        x.role_type === 'delivery_driver'

          ? 'مندوب توصيل'

          : 'سائق تكسي';



      let statusName = 'قيد المراجعة';


      if(x.status === 'approved'){

        statusName = 'مقبول';

      }else if(
        x.status === 'rejected'
      ){

        statusName = 'مرفوض';

      }else if(
        x.status === 'suspended'
      ){

        statusName = 'موقوف';

      }



      let actions = '';



      if(x.status === 'pending'){

        actions = `

          <div
            class="row"
            style="margin-top:10px"
          >

            <button
              class="ok"
              onclick="review(${x.id},'approved')"
            >
              ✅ موافقة
            </button>

            <button
              class="danger"
              onclick="review(${x.id},'rejected')"
            >
              ❌ رفض
            </button>

          </div>

        `;

      }


      else if(
        x.status === 'approved'
      ){

        actions = `

          <div
            class="status approved-box"
          >
            ✅ تمت الموافقة على هذا الطلب
          </div>

          <div
            class="row"
            style="margin-top:10px"
          >

            <button
              class="light"
              onclick="review(${x.id},'suspended')"
            >
              ⛔ إيقاف الحساب
            </button>

          </div>

        `;

      }


      else if(
        x.status === 'rejected'
      ){

        actions = `

          <div
            class="status rejected-box"
          >
            ❌ تم رفض هذا الطلب
          </div>

        `;

      }


      else if(
        x.status === 'suspended'
      ){

        actions = `

          <div
            class="status suspended-box"
          >
            ⛔ تم إيقاف هذا الحساب
          </div>

        `;

      }


      return `

        <div
          class="card"
          style="border-right:5px solid #111"
        >

          <div class="row">

            <b>
              ${esc(
                x.display_name ||
                'بدون اسم'
              )}
            </b>

            <span class="badge">

              ${roleName}

              —

              ${statusName}

            </span>

          </div>


          <div
            style="margin-top:10px"
          >

            ${esc(
              x.phone ||
              'بدون هاتف'
            )}

            —

            ${esc(
              x.governorate ||
              ''
            )}

          </div>


          <div class="muted">

            ${esc(
              x.details ||
              ''
            )}

          </div>


          ${actions}


        </div>

      `;

    }).join('') ||

    `

      <div class="card">

        <b>
          لا توجد طلبات سائقين أو مندوبين حالياً.
        </b>

        <br>

        <span class="muted">
          إذا أرسل مستخدم طلباً جديداً اضغط تحديث الطلبات.
        </span>

      </div>

    `;

}



async function review(id,status){


  let actionName = '';


  if(status === 'approved'){

    actionName =
      'الموافقة على هذا الطلب';

  }

  else if(
    status === 'rejected'
  ){

    actionName =
      'رفض هذا الطلب';

  }

  else if(
    status === 'suspended'
  ){

    actionName =
      'إيقاف هذا الحساب';

  }


  const sure = confirm(
    'هل أنت متأكد من ' +
    actionName +
    '؟'
  );


  if(!sure){

    return;

  }


  const note = prompt(
    'ملاحظة الإدارة (اختياري):'
  ) || null;



  const {
    error
  } = await db.rpc(

    'admin_review_marketplace_application',

    {

      p_id:id,

      p_status:status,

      p_note:note

    }

  );



  if(error){

    alert(
      '❌ تعذر تنفيذ العملية:\n' +
      error.message
    );

    return;

  }



  if(status === 'approved'){

    alert(
      '✅ تمت الموافقة على الطلب بنجاح.'
    );

  }

  else if(
    status === 'rejected'
  ){

    alert(
      '✅ تم رفض الطلب.'
    );

  }

  else if(
    status === 'suspended'
  ){

    alert(
      '✅ تم إيقاف الحساب.'
    );

  }


  await load();

}



async function addMaterial(){

  const payload = {

    stage:
      stage.value.trim(),

    grade:
      grade.value.trim() ||
      null,

    subject:
      subject.value.trim(),

    title:
      title.value.trim(),

    material_type:
      type.value,

    description:
      desc.value.trim() ||
      null,

    external_url:
      url.value.trim() ||
      null,

    created_by:
      me.id,

    is_active:
      true

  };


  if(
    !payload.stage ||
    !payload.subject ||
    !payload.title
  ){

    return alert(
      'أكمل المرحلة والمادة والعنوان'
    );

  }


  const {
    error
  } = await db
    .from('study_materials')
    .insert(payload);


  mstatus.textContent =

    error

      ? error.message

      : '✅ تمت إضافة المادة بنجاح.';

}


init();

</script>

</body>
</html>
