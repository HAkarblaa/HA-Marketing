<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة الانضمام والمنصة</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f5f5f5;color:#111}.wrap{width:94%;max-width:1050px;margin:22px auto}.top,.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.btn,button{border:0;border-radius:11px;padding:11px 14px;background:#111;color:#fff;text-decoration:none;cursor:pointer;font:inherit}.light{background:#eee;color:#111}.danger{background:#9b1028}.ok{background:#0c6b2a}.card{background:#fff;border-radius:16px;padding:15px;margin:12px 0;box-shadow:0 4px 16px #0001}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.muted{color:#666;line-height:1.7}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eee;font-size:12px}input,select,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;font:inherit;margin:5px 0 10px}textarea{min-height:90px}.status{padding:10px;border-radius:10px;background:#f1f1f1;white-space:pre-wrap}@media(max-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.card{padding:10px}.grid .card{font-size:12px}}</style></head><body><div class="wrap"><div class="top"><a class="btn light" href="admin-panel.html">← لوحة الإدارة</a><h1>🛡️ طلبات الانضمام</h1><span></span></div><div id="gate" class="card">جاري التحقق...</div><div class="card" style="border:2px solid #111"><div class="row"><div><h2 style="margin:0 0 6px">🚚 طلبات السائقين والمندوبين</h2><div class="muted">طلبات الانضمام الجديدة تظهر هنا للأدمن الرئيسي.</div></div><button onclick="load()">تحديث الطلبات</button></div></div><div id="list"><div class="card">جاري تحميل الطلبات...</div></div><div class="card"><h2>إضافة مادة للمكتبة الدراسية</h2><input id="stage" placeholder="المرحلة"><input id="grade" placeholder="الصف/المرحلة"><input id="subject" placeholder="المادة"><input id="title" placeholder="العنوان"><select id="type"><option value="lesson">محاضرة</option><option value="book">كتاب</option><option value="notes">ملزمة</option><option value="questions">أسئلة</option><option value="exam">امتحان</option><option value="video">فيديو</option></select><input id="url" placeholder="رابط الملف أو الفيديو"><textarea id="desc" placeholder="وصف"></textarea><button onclick="addMaterial()">إضافة</button><div id="mstatus" class="status"></div></div></div><script>const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});
let me=null;function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function init(){const {data:{session}}=await db.auth.getSession();if(!session){location.href='login.html';return}me=session.user;const {data:ok}=await db.rpc('is_super_admin');if(!ok){gate.textContent='هذه الصفحة للـSuper Admin فقط.';return}gate.textContent='✅ Super Admin';load()}async function load(){list.innerHTML='<div class="card">جاري تحميل طلبات الانضمام...</div>';try{await db.rpc('admin_sync_transport_applications')}catch(e){console.warn(e)}const {data,error}=await db.from('marketplace_applications').select('*').in('role_type',['taxi_driver','delivery_driver']).order('created_at',{ascending:false});if(error){list.innerHTML='<div class="card danger">خطأ في جلب الطلبات: '+esc(error.message)+'</div>';return}list.innerHTML=(data||[]).map(x=>`<div class="card" style="border-right:5px solid #111"><div class="row"><b>${esc(x.display_name||'بدون اسم')}</b><span class="badge">${x.role_type==='delivery_driver'?'مندوب توصيل':'سائق تكسي'} — ${x.status==='pending'?'قيد المراجعة':x.status==='approved'?'مقبول':x.status==='rejected'?'مرفوض':'موقوف'}</span></div><div>${esc(x.phone||'بدون هاتف')} — ${esc(x.governorate||'')}</div><div class="muted">${esc(x.details||'')}</div><div class="row" style="margin-top:8px"><button class="ok" onclick="review(${x.id},'approved')">موافقة</button><button class="danger" onclick="review(${x.id},'rejected')">رفض</button><button class="light" onclick="review(${x.id},'suspended')">إيقاف</button></div></div>`).join('')||'<div class="card"><b>لا توجد طلبات سائقين أو مندوبين حالياً.</b><br><span class="muted">إذا أرسل مستخدم طلباً جديداً اضغط تحديث الطلبات.</span></div>'}async function review(id,s){const note=prompt('ملاحظة الإدارة (اختياري):')||null;const {error}=await db.rpc('admin_review_marketplace_application',{p_id:id,p_status:s,p_note:note});if(error)alert(error.message);else load()}async function addMaterial(){const payload={stage:stage.value.trim(),grade:grade.value.trim()||null,subject:subject.value.trim(),title:title.value.trim(),material_type:type.value,description:desc.value.trim()||null,external_url:url.value.trim()||null,created_by:me.id,is_active:true};if(!payload.stage||!payload.subject||!payload.title)return alert('أكمل المرحلة والمادة والعنوان');const {error}=await db.from('study_materials').insert(payload);mstatus.textContent=error?error.message:'تمت إضافة المادة.'}init();</script></body></html>
