<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>طلبات الانضمام - HA Marketing</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box
}

:root{
  --bg:#050505;
  --card:#0d0d0d;
  --border:#322b1a;
  --gold:#d3a13a;
  --text:#f7f7f7;
  --muted:#aaa;
}

body{
  margin:0;
  background:
    radial-gradient(circle at top,#181306 0,#070707 28%,#020202 75%);
  color:var(--text);
  font-family:Arial,Tahoma,sans-serif;
  min-height:100vh;
}

.wrap{
  width:94%;
  max-width:900px;
  margin:0 auto;
  padding:18px 0 40px;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:18px;
}

.back{
  text-decoration:none;
  color:#17120a;
  background:linear-gradient(135deg,#e0b14a,#b98224);
  border:1px solid #f0ca70;
  border-radius:13px;
  padding:12px 17px;
  font-weight:bold;
}

.title{
  display:flex;
  align-items:center;
  gap:10px;
  margin:0;
  font-size:30px;
  color:#fff;
}

.admin-badge{
  background:#0c0c0c;
  border:1px solid #342b17;
  border-radius:18px;
  padding:15px 18px;
  margin-bottom:14px;
  color:#ddd;
  box-shadow:0 8px 25px #0008;
  font-size:18px;
}

.main-card{
  background:linear-gradient(180deg,#111,#080808);
  border:1px solid #3b3018;
  border-radius:20px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 10px 30px #0009;
}

.main-card h2{
  margin:0 0 8px;
  font-size:23px;
}

.main-card p{
  color:var(--muted);
  line-height:1.8;
  margin:0 0 14px;
}

.refresh{
  width:100%;
  border:1px solid #80611f;
  border-radius:13px;
  padding:13px;
  font:inherit;
  font-weight:bold;
  color:#17120a;
  background:linear-gradient(135deg,#e5b74f,#bd8525);
  cursor:pointer;
}

.request{
  background:linear-gradient(180deg,#111,#090909);
  border:1px solid #2f291b;
  border-right:5px solid var(--gold);
  border-radius:18px;
  margin:14px 0;
  padding:16px;
  box-shadow:0 8px 24px #0008;
}

.request-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  flex-wrap:wrap;
}

.name{
  font-size:20px;
  font-weight:bold;
}

.badge{
  border-radius:999px;
  padding:7px 11px;
  font-size:12px;
  border:1px solid #4d4124;
  background:#18150e;
  color:#f0cf7e;
}

.info{
  color:#ddd;
  margin-top:11px;
  line-height:1.8;
}

.details{
  color:#999;
  margin-top:7px;
  line-height:1.7;
  font-size:14px;
}

.actions{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:9px;
  margin-top:14px;
}

button{
  border:0;
  border-radius:12px;
  padding:12px 10px;
  cursor:pointer;
  font:inherit;
  font-weight:bold;
}

.approve{
  background:#126a3a;
  color:#fff;
  border:1px solid #2aa463;
}

.reject{
  background:#721d29;
  color:#fff;
  border:1px solid #b73b4c;
}

.stop{
  background:#3d321b;
  color:#f2ca69;
  border:1px solid #7e6427;
  width:100%;
  margin-top:9px;
}

.result{
  margin-top:13px;
  border-radius:12px;
  padding:12px;
  font-weight:bold;
}

.result.approved{
  background:#0e291b;
  border:1px solid #1e7145;
  color:#60dc91;
}

.result.rejected{
  background:#2b1015;
  border:1px solid #7d2936;
  color:#ff7d8b;
}

.result.suspended{
  background:#272014;
  border:1px solid #6e5622;
  color:#e8bd5d;
}

.empty,
.error{
  background:#101010;
  border:1px solid #30291a;
  border-radius:18px;
  padding:22px;
  text-align:center;
  color:#bbb;
  line-height:1.8;
}

.error{
  color:#ff8d98;
  border-color:#6f2831;
}

@media(max-width:600px){

  .wrap{
    width:95%;
  }

  .title{
    font-size:25px;
  }

  .back{
    padding:10px 12px;
    font-size:14px;
  }

  .main-card h2{
    font-size:21px;
  }

}
</style>
</head>

<body>

<div class="wrap">

  <div class="top">

    <a class="back" href="admin-panel.html">
      ← لوحة الإدارة
    </a>

    <h1 class="title">
      🛡️ طلبات الانضمام
    </h1>

  </div>


  <div id="gate" class="admin-badge">
    جاري التحقق...
  </div>


  <div class="main-card">

    <h2>
      🛡️ جميع طلبات صلاحيات العمل
    </h2>

    <p>
      التاجر، مقدم الخدمة، صاحب الملعب، الجيم،
      إدارة الألعاب، السائق والمندوب تظهر طلباتهم هنا.
    </p>

    <button class="refresh" onclick="load()">
      🔄 تحديث الطلبات
    </button>

  </div>


  <div id="list">

    <div class="empty">
      جاري تحميل الطلبات...
    </div>

  </div>

</div>


<script>

const db = supabase.createClient(
  'https://ubayrhtshgtgggxprrek.supabase.co',
  'sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true,
      storageKey:'ha-marketing-auth'
    }
  }
);

let me = null;


function esc(s){

  return String(s ?? '').replace(
    /[&<>"']/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c])
  );

}


function roleName(role){

  const map = {

    merchant:'تاجر',
    trader:'تاجر',
    shop_owner:'تاجر',

    provider:'مقدم خدمة',
    service_provider:'مقدم خدمة',

    stadium_owner:'صاحب ملعب',
    stadium:'صاحب ملعب',

    gym_owner:'صاحب جيم',
    gym:'صاحب جيم',

    games_admin:'إدارة الألعاب',
    game_admin:'إدارة الألعاب',

    taxi_driver:'سائق تكسي',
    delivery_driver:'مندوب توصيل'

  };

  return map[role] || role || 'طلب صلاحية';

}


function statusName(status){

  if(status === 'pending'){
    return 'قيد المراجعة';
  }

  if(status === 'approved'){
    return 'مقبول';
  }

  if(status === 'rejected'){
    return 'مرفوض';
  }

  if(status === 'suspended'){
    return 'موقوف';
  }

  return status || 'غير محدد';

}


async function init(){

  const {
    data:{session}
  } = await db.auth.getSession();


  if(!session){

    location.href='login.html';

    return;
  }


  me = session.user;


  const {
    data:ok,
    error
  } = await db.rpc('is_super_admin');


  if(error || !ok){

    gate.textContent=
      '❌ هذه الصفحة للـ Super Admin فقط.';

    return;
  }


  gate.textContent=
    'Super Admin ✅';


  await load();

}


async function load(){

  list.innerHTML=
    '<div class="empty">جاري تحميل الطلبات...</div>';


  try{

    await db.rpc(
      'admin_sync_transport_applications'
    );

  }catch(e){

    console.warn(
      'sync skipped',
      e
    );

  }


  const {
    data,
    error
  } = await db
    .from('marketplace_applications')
    .select('*')
    .order(
      'created_at',
      {
        ascending:false
      }
    );


  if(error){

    list.innerHTML=
      '<div class="error">'+
      'تعذر تحميل الطلبات:<br>'+
      esc(error.message)+
      '</div>';

    return;
  }


  if(!data || !data.length){

    list.innerHTML=`

      <div class="empty">

        لا توجد طلبات صلاحيات عمل حالياً.

        <br>

        إذا أرسل مستخدم طلباً جديداً
        اضغط تحديث الطلبات.

      </div>

    `;

    return;
  }


  list.innerHTML = data.map(x => {


    let actions = '';


    if(x.status === 'pending'){

      actions = `

        <div class="actions">

          <button
            class="approve"
            onclick="review(${x.id},'approved')"
          >
            ✅ موافقة
          </button>


          <button
            class="reject"
            onclick="review(${x.id},'rejected')"
          >
            ❌ رفض
          </button>

        </div>

      `;

    }


    else if(x.status === 'approved'){

      actions = `

        <div class="result approved">

          ✅ تمت الموافقة على هذا الطلب

        </div>


        <button
          class="stop"
          onclick="review(${x.id},'suspended')"
        >
          ⛔ إيقاف الصلاحية
        </button>

      `;

    }


    else if(x.status === 'rejected'){

      actions = `

        <div class="result rejected">

          ❌ تم رفض هذا الطلب

        </div>

      `;

    }


    else if(x.status === 'suspended'){

      actions = `

        <div class="result suspended">

          ⛔ تم إيقاف هذه الصلاحية

        </div>

      `;

    }


    return `

      <div class="request">

        <div class="request-head">

          <div class="name">

            ${esc(
              x.display_name ||
              'بدون اسم'
            )}

          </div>


          <div class="badge">

            ${esc(
              roleName(
                x.role_type
              )
            )}

            —

            ${esc(
              statusName(
                x.status
              )
            )}

          </div>

        </div>


        <div class="info">

          📱
          ${esc(
            x.phone ||
            'بدون هاتف'
          )}

          ${
            x.governorate
              ? ' — 📍 '+esc(x.governorate)
              : ''
          }

        </div>


        ${
          x.details

            ? `<div class="details">
                 ${esc(x.details)}
               </div>`

            : ''
        }


        ${actions}


      </div>

    `;

  }).join('');

}


async function review(id,status){

  let actionText='';


  if(status === 'approved'){

    actionText=
      'الموافقة على هذا الطلب';

  }

  else if(status === 'rejected'){

    actionText=
      'رفض هذا الطلب';

  }

  else if(status === 'suspended'){

    actionText=
      'إيقاف هذه الصلاحية';

  }


  const sure = confirm(
    'هل أنت متأكد من '+
    actionText+
    '؟'
  );


  if(!sure){

    return;

  }


  const note =
    prompt(
      'ملاحظة الإدارة (اختياري):'
    ) || null;


  const {
    error
  } = await db.rpc(

    'admin_review_marketplace_application',

    {

      p_id:id,

      p_status:status,

      p_note:note

    }

  );


  if(error){

    alert(
      '❌ تعذر تنفيذ العملية:\n'+
      error.message
    );

    return;

  }


  if(status === 'approved'){

    alert(
      '✅ تمت الموافقة على الطلب بنجاح.'
    );

  }

  else if(status === 'rejected'){

    alert(
      '✅ تم رفض الطلب.'
    );

  }

  else if(status === 'suspended'){

    alert(
      '✅ تم إيقاف الصلاحية.'
    );

  }


  await load();

}


init();

</script>

</body>
</html>
