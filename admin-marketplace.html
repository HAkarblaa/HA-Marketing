<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>طلبات الانضمام - HA Marketing</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f5f5f5;color:#111}.wrap{width:94%;max-width:1050px;margin:22px auto}.top,.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.btn,button{border:0;border-radius:11px;padding:11px 14px;background:#111;color:#fff;text-decoration:none;cursor:pointer;font:inherit}.light{background:#eee;color:#111}.danger{background:#9b1028}.ok{background:#0c6b2a}.warn{background:#8a5b00}.card{background:#fff;border-radius:16px;padding:15px;margin:12px 0;box-shadow:0 4px 16px #0001}.muted{color:#666;line-height:1.7}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eee;font-size:12px}.status{padding:10px;border-radius:10px;background:#f1f1f1;white-space:pre-wrap}.pending{background:#fff5cf}.approved{background:#dff5e4}.rejected{background:#ffe1e1}.suspended{background:#eee}.empty{text-align:center;padding:25px;color:#666}.sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.role{font-weight:700}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}@media(max-width:720px){.card{padding:12px}.btn,button{padding:10px 12px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="btn light" href="admin-panel.html">← لوحة الإدارة</a><h1>🛡️ طلبات الانضمام</h1><button class="light" onclick="refreshAll()">تحديث</button></div>
  <div id="gate" class="card">جاري التحقق...</div>
  <div class="card"><div class="sectionTitle"><h2 style="margin:0">🚕🛵 طلبات السائقين والمندوبين</h2><span id="count" class="badge">0</span></div><div id="list"><div class="empty">جاري التحميل...</div></div></div>
</div>
<script>
const SB_URL='https://ubayrhtshgtgggxprrek.supabase.co';
const SB_KEY='sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll';
function migrateLegacyAuth(){try{const target='ha-marketing-auth';if(localStorage.getItem(target))return;for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i)||'';if(/^sb-.*-auth-token$/.test(k)){const v=localStorage.getItem(k);if(v){localStorage.setItem(target,v);break}}}}catch(e){console.warn(e)}}
migrateLegacyAuth();
const db=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});
let me=null;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function roleName(r){return r==='delivery_driver'?'موظف توصيل / مندوب':r==='taxi_driver'?'سائق تكسي':r||''}
function statusName(s){return s==='approved'?'مقبول ✅':s==='rejected'?'مرفوض ❌':s==='suspended'?'موقوف':'قيد المراجعة ⏳'}
async function init(){
  const {data:{session},error:se}=await db.auth.getSession();
  if(se||!session){location.href='login.html';return}
  me=session.user;
  let isSuper=false;
  try{const r=await db.rpc('is_super_admin');if(!r.error)isSuper=!!r.data}catch(_e){}
  if(!isSuper){
    try{const r=await db.from('app_admins').select('is_super_admin,is_active').eq('user_id',me.id).maybeSingle();isSuper=!!(r.data?.is_active&&r.data?.is_super_admin)}catch(_e){}
  }
  if(!isSuper){gate.textContent='هذا الحساب غير مسجل كـ Super Admin في قاعدة البيانات.';list.innerHTML='<div class="empty">لا يمكن عرض الطلبات قبل تفعيل صلاحية Super Admin لهذا الحساب.</div>';return}
  gate.textContent='✅ تم الدخول كـ Super Admin';
  await refreshAll();
}
async function refreshAll(){
  if(!me)return;
  gate.textContent='جاري مزامنة طلبات النقل...';
  try{const s=await db.rpc('admin_sync_transport_applications');if(s.error)console.warn('sync',s.error.message)}catch(e){console.warn(e)}
  await load();
}
async function load(){
  const {data,error}=await db.from('marketplace_applications').select('*').in('role_type',['taxi_driver','delivery_driver']).order('created_at',{ascending:false});
  if(error){gate.textContent='تعذر تحميل الطلبات: '+error.message;list.innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}
  gate.textContent='✅ Super Admin — الطلبات محدثة';
  const rows=data||[]; count.textContent=String(rows.length);
  if(!rows.length){list.innerHTML='<div class="empty">لا توجد طلبات سائقين أو موظفي توصيل حالياً.</div>';return}
  list.innerHTML=rows.map(x=>`<div class="card ${esc(x.status||'pending')}"><div class="row"><div><div class="role">${esc(x.display_name||'بدون اسم')}</div><div class="muted">${esc(roleName(x.role_type))}</div></div><span class="badge">${esc(statusName(x.status))}</span></div><div class="muted"><b>الهاتف:</b> ${esc(x.phone||'—')}<br><b>المحافظة:</b> ${esc(x.governorate||'—')}<br><b>تفاصيل المركبة:</b> ${esc(x.details||'—')}${x.admin_note?'<br><b>ملاحظة الإدارة:</b> '+esc(x.admin_note):''}</div><div class="actions"><button class="ok" onclick="review(${Number(x.id)},'approved')">موافقة</button><button class="danger" onclick="review(${Number(x.id)},'rejected')">رفض</button><button class="warn" onclick="review(${Number(x.id)},'suspended')">إيقاف</button>${x.status!=='pending'?'<button class="light" onclick="review('+Number(x.id)+','pending')">إرجاع للمراجعة</button>':''}</div></div>`).join('');
}
async function review(id,s){
  const note=prompt('ملاحظة الإدارة (اختياري):')||null;
  const {error}=await db.rpc('admin_review_marketplace_application',{p_id:id,p_status:s,p_note:note});
  if(error){alert('تعذر تنفيذ العملية: '+error.message);return}
  alert(s==='approved'?'تمت الموافقة وتفعيل الموظف ✅':s==='rejected'?'تم رفض الطلب.':s==='suspended'?'تم إيقاف الموظف.':'تم إرجاع الطلب للمراجعة.');
  await load();
}
init();
</script>
</body>
</html>
