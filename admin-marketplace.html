<button class="tab active" onclick="setStatusFilter('pending',this)">قيد المراجعة <span class="count" id="cntPending">0</span></button>
<button class="tab" onclick="setStatusFilter('approved',this)">المقبولة <span class="count" id="cntApproved">0</span></button>
<button class="tab" onclick="setStatusFilter('rejected',this)">المرفوضة <span class="count" id="cntRejected">0</span></button>
</div><div id="list"><div class="card">جاري تحميل الطلبات...</div></div><script>const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});
let me=null,currentStatus='pending',allApplications=[];function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function init(){const {data:{session}}=await db.auth.getSession();if(!session){location.href='login.html';return}me=session.user;const {data:ok}=await db.rpc('is_super_admin');if(!ok){gate.textContent='هذه الصفحة للـSuper Admin فقط.';return}gate.textContent='✅ Super Admin';load()}async function load(){
  list.innerHTML='<div class="card">جاري تحميل طلبات صلاحيات العمل...</div>';
  try{await db.rpc('admin_sync_transport_applications')}catch(e){console.warn(e)}
  const {data,error}=await db.from('marketplace_applications')
    .select('*')
    .order('created_at',{ascending:false});
  if(error){
    list.innerHTML='<div class="card danger">خطأ في جلب الطلبات: '+esc(error.message)+'</div>';
    return;
  }
  allApplications=data||[];
  document.getElementById('cntPending').textContent=allApplications.filter(x=>x.status==='pending').length;
  document.getElementById('cntApproved').textContent=allApplications.filter(x=>x.status==='approved').length;
  document.getElementById('cntRejected').textContent=allApplications.filter(x=>x.status==='rejected').length;
  const dataFiltered=allApplications.filter(x=>x.status===currentStatus);
  const roleLabel=x=>{
    if(x.role_type==='seller')return 'بائع / متجر';
    if(x.role_type==='service_provider')return 'مقدم خدمة';
    if(x.role_type==='sports_manager')return 'صاحب ملعب / جم';
    if(x.role_type==='games_manager')return 'إدارة الألعاب';
    if(x.role_type==='delivery_driver')return 'مندوب توصيل';
    if(x.role_type==='stoota_driver')return 'سائق ستوتة';
    if(x.role_type==='taxi_driver'&&String(x.details||'').includes('سائق تكتك'))return 'سائق تكتك';
    if(x.role_type==='taxi_driver')return 'سائق تكسي';
    return x.role_type;
  };
  list.innerHTML=dataFiltered.map(x=>`<div class="card" style="border-right:5px solid #d69b34">
    <div class="row">
      <b>${esc(x.display_name||'بدون اسم')}</b>
      <span class="badge">${esc(roleLabel(x))} — ${x.status==='pending'?'قيد المراجعة':x.status==='approved'?'مقبول':x.status==='rejected'?'مرفوض':'موقوف'}</span>
    </div>
    <div>${esc(x.phone||'بدون هاتف')} — ${esc(x.governorate||'')}</div>
    ${x.role_type==='service_provider'?`
      <div class="muted"><b>اليوزر:</b> ${esc(x.original_username||'')}</div>
      <div class="muted"><b>الأرقام:</b> ${esc(Array.isArray(x.phone_numbers)?x.phone_numbers.join(' / '):(x.phone||''))}</div>
      <div class="muted"><b>المنطقة:</b> ${esc(x.area||'')}</div>
      <div class="muted"><b>المهنة:</b> ${esc(x.service_type_name||x.custom_profession||'')}</div>
      <div class="muted"><b>الموقع:</b> ${esc(x.location_text||x.address||'')}</div>
      ${x.lat!=null&&x.lng!=null?`<div class="muted"><b>الإحداثيات:</b> ${esc(x.lat)}, ${esc(x.lng)}</div>`:''}
    `:`
      <div class="muted">${esc(x.address||'')}</div>
    `}
    <div class="muted"><b>التفاصيل:</b> ${esc(x.details||'')}</div>
    ${x.status==='pending'?`<div class="row" style="margin-top:8px">
      <button class="ok" onclick="review('${x.id}','approved')">موافقة وتفعيل الصلاحية</button>
      <button class="danger" onclick="review('${x.id}','rejected')">رفض</button>
    </div>`:''}
  </div>`).join('')||'<div class="card"><b>لا توجد طلبات صلاحيات عمل حالياً.</b></div>';
}
function setStatusFilter(status,btn){
  currentStatus=status;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  if(btn)btn.classList.add('active');
  load();
}
async function review(id,s){
  const note=prompt('ملاحظة الإدارة (اختياري):')||null;

  const {data,error}=await db.rpc('admin_review_marketplace_application',{
    p_id:String(id),
    p_status:s,
    p_note:note
  });

  if(error){
    alert('تعذر تغيير الصلاحية: '+error.message);
    return;
  }

  await load();
}
async function addMaterial(){const payload={stage:stage.value.trim(),grade:grade.value.trim()||null,subject:subject.value.trim(),title:title.value.trim(),material_type:type.value,description:desc.value.trim()||null,external_url:url.value.trim()||null,created_by:me.id,is_active:true};if(!payload.stage||!payload.subject||!payload.title)return alert('أكمل المرحلة والمادة والعنوان');const {error}=await db.from('study_materials').insert(payload);mstatus.textContent=error?error.message:'تمت إضافة المادة.'}init();</script><script src="ha-lux-icons.js?v=20260930-1" defer></script></body></html>
