<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>مواعيد الأذان - HA Marketing</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f5f5f5;color:#111}
.wrap{width:95%;max-width:900px;margin:30px auto}
h1{text-align:center;margin-bottom:8px}
.subtitle{text-align:center;color:#666;line-height:1.8;margin-bottom:18px}
.panel,.times-card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 4px 16px #0001;margin:14px 0}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
label{display:block;font-weight:700;margin-bottom:6px}
select,button{width:100%;padding:13px;border-radius:10px;font-size:16px}
select{border:1px solid #ccc;background:#fff}
button{border:0;background:#111;color:#fff;cursor:pointer;font-weight:700}
button:disabled{opacity:.55}
.status{text-align:center;padding:12px;border-radius:10px;background:#fff;margin:14px 0;line-height:1.7}
.location-title{text-align:center;font-size:22px;font-weight:700;margin-bottom:6px}
.date{text-align:center;color:#666;margin-bottom:16px}
.times{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.time-box{border:1px solid #e1e1e1;border-radius:12px;padding:14px;text-align:center}
.time-box .name{font-weight:700;margin-bottom:6px}
.time-box .value{font-size:23px}
.note{font-size:13px;color:#666;line-height:1.8;margin-top:14px}
.back{display:block;text-align:center;margin:28px 0;text-decoration:none;color:#111}
.hidden{display:none}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>🕰️ مواعيد الأذان</h1>
<p class="subtitle">اختيار فقط بدون كتابة: اختر الدولة، ثم المحافظة/المنطقة، ثم المدينة.</p>

<div class="panel">
  <div class="form-grid">
    <div>
      <label for="country">الدولة</label>
      <select id="country">
        <option value="">اختر الدولة</option>
        <option value="Iraq">العراق</option>
        <option value="Iran">إيران</option>
        <option value="Lebanon">لبنان</option>
        <option value="Kuwait">الكويت</option>
        <option value="Saudi Arabia">السعودية</option>
        <option value="Bahrain">البحرين</option>
        <option value="Qatar">قطر</option>
        <option value="United Arab Emirates">الإمارات</option>
        <option value="Egypt">مصر</option>
        <option value="Syria">سوريا</option>
        <option value="Oman">عُمان</option>
        <option value="Yemen">اليمن</option>
      </select>
    </div>

    <div>
      <label for="state">المحافظة / المنطقة</label>
      <select id="state" disabled><option value="">اختر الدولة أولاً</option></select>
    </div>

    <div>
      <label for="city">المدينة</label>
      <select id="city" disabled><option value="">اختر المحافظة أولاً</option></select>
    </div>

    <div>
      <label for="method">طريقة الحساب</label>
      <select id="method">
        <option value="0">الجعفري - Ithna Ashari</option>
        <option value="8">منطقة الخليج</option>
        <option value="4">أم القرى - مكة</option>
        <option value="3">رابطة العالم الإسلامي</option>
        <option value="5">الهيئة المصرية للمساحة</option>
        <option value="7">جامعة طهران</option>
      </select>
    </div>
  </div>

  <button id="loadBtn" type="button" style="margin-top:14px">عرض مواقيت اليوم</button>
</div>

<div id="status" class="status">اختر الدولة لعرض محافظاتها ومناطقها.</div>

<div id="result" class="times-card hidden">
  <div id="locationTitle" class="location-title"></div>
  <div id="dateBox" class="date"></div>
  <div class="times">
    <div class="time-box"><div class="name">الفجر</div><div id="fajr" class="value">-</div></div>
    <div class="time-box"><div class="name">الشروق</div><div id="sunrise" class="value">-</div></div>
    <div class="time-box"><div class="name">الظهر</div><div id="dhuhr" class="value">-</div></div>
    <div class="time-box"><div class="name">العصر</div><div id="asr" class="value">-</div></div>
    <div class="time-box"><div class="name">المغرب</div><div id="maghrib" class="value">-</div></div>
    <div class="time-box"><div class="name">العشاء</div><div id="isha" class="value">-</div></div>
  </div>
  <div class="note">المواقيت تُحسب حسب المكان وطريقة الحساب المختارة، وقد تختلف عدة دقائق عن الجهة الدينية المحلية.</div>
</div>

<a class="back" href="religious.html">← الرجوع إلى الأمور الدينية</a>
</div>

<script>
const countryEl=document.getElementById('country');
const stateEl=document.getElementById('state');
const cityEl=document.getElementById('city');
const statusBox=document.getElementById('status');
const loadBtn=document.getElementById('loadBtn');
const result=document.getElementById('result');

async function postJSON(url, body){
 const res=await fetch(url,{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify(body)
 });
 if(!res.ok)throw new Error('HTTP '+res.status);
 return await res.json();
}

countryEl.addEventListener('change', async()=>{
 result.classList.add('hidden');
 stateEl.disabled=true; cityEl.disabled=true;
 stateEl.innerHTML='<option value="">جاري تحميل المحافظات...</option>';
 cityEl.innerHTML='<option value="">اختر المحافظة أولاً</option>';

 if(!countryEl.value){
   stateEl.innerHTML='<option value="">اختر الدولة أولاً</option>';
   statusBox.textContent='اختر الدولة لعرض محافظاتها ومناطقها.';
   return;
 }

 statusBox.textContent='جاري تحميل المحافظات والمناطق...';

 try{
   const json=await postJSON('https://countriesnow.space/api/v0.1/countries/states',{country:countryEl.value});
   const states=json?.data?.states || [];
   if(!states.length)throw new Error('لا توجد مناطق');

   stateEl.innerHTML='<option value="">اختر المحافظة / المنطقة</option>'+
      states.map(s=>'<option value="'+String(s.name).replaceAll('"','&quot;')+'">'+s.name+'</option>').join('');
   stateEl.disabled=false;
   statusBox.textContent='اختر المحافظة أو المنطقة.';
 }catch(err){
   stateEl.innerHTML='<option value="">تعذر تحميل المحافظات</option>';
   statusBox.textContent='تعذر تحميل المحافظات حالياً. تأكد من اتصال الإنترنت ثم حاول مرة أخرى.';
 }
});

stateEl.addEventListener('change', async()=>{
 result.classList.add('hidden');
 cityEl.disabled=true;
 cityEl.innerHTML='<option value="">جاري تحميل المدن...</option>';

 if(!stateEl.value){
   cityEl.innerHTML='<option value="">اختر المحافظة أولاً</option>';
   return;
 }

 statusBox.textContent='جاري تحميل المدن...';

 try{
   const json=await postJSON('https://countriesnow.space/api/v0.1/countries/state/cities',{
      country:countryEl.value,
      state:stateEl.value
   });
   const cities=json?.data || [];
   if(!cities.length){
     // fallback: allow the province/state itself as the prayer location
     cityEl.innerHTML='<option value="'+stateEl.value+'">'+stateEl.value+'</option>';
   }else{
     cityEl.innerHTML='<option value="">اختر المدينة</option>'+
       cities.map(c=>'<option value="'+String(c).replaceAll('"','&quot;')+'">'+c+'</option>').join('');
   }
   cityEl.disabled=false;
   statusBox.textContent='اختر المدينة ثم اضغط عرض مواقيت اليوم.';
 }catch(err){
   cityEl.innerHTML='<option value="'+stateEl.value+'">'+stateEl.value+'</option>';
   cityEl.disabled=false;
   statusBox.textContent='تعذر تحميل المدن، لذلك يمكنك استخدام المحافظة نفسها.';
 }
});

function cleanTime(v){return String(v||'-').replace(/\s*\(.+?\)\s*/g,'').trim()}

loadBtn.addEventListener('click',async()=>{
 const country=countryEl.value;
 const state=stateEl.value;
 const city=cityEl.value || state;
 const method=document.getElementById('method').value;

 if(!country || !state || !city){
   statusBox.textContent='اختر الدولة والمحافظة والمدينة أولاً.';
   return;
 }

 loadBtn.disabled=true;
 loadBtn.textContent='جاري التحميل...';
 statusBox.textContent='جاري جلب مواقيت الصلاة...';
 result.classList.add('hidden');

 try{
   const url='https://api.aladhan.com/v1/timingsByCity'
    +'?city='+encodeURIComponent(city)
    +'&country='+encodeURIComponent(country)
    +'&method='+encodeURIComponent(method);

   const res=await fetch(url);
   if(!res.ok)throw new Error('HTTP '+res.status);
   const json=await res.json();
   if(json.code!==200 || !json.data)throw new Error('تعذر جلب البيانات');

   const t=json.data.timings||{}, d=json.data.date||{};
   document.getElementById('locationTitle').textContent=city+' - '+state+' - '+country;
   document.getElementById('dateBox').textContent=
     (d.readable||'')+(d.hijri?.date?' | '+d.hijri.date+' هـ':'');
   document.getElementById('fajr').textContent=cleanTime(t.Fajr);
   document.getElementById('sunrise').textContent=cleanTime(t.Sunrise);
   document.getElementById('dhuhr').textContent=cleanTime(t.Dhuhr);
   document.getElementById('asr').textContent=cleanTime(t.Asr);
   document.getElementById('maghrib').textContent=cleanTime(t.Maghrib);
   document.getElementById('isha').textContent=cleanTime(t.Isha);

   result.classList.remove('hidden');
   statusBox.textContent='✅ تم تحميل مواقيت اليوم.';
 }catch(err){
   statusBox.textContent='تعذر جلب المواقيت لهذا المكان حالياً. جرّب مدينة أخرى أو أعد المحاولة.';
 }finally{
   loadBtn.disabled=false;
   loadBtn.textContent='عرض مواقيت اليوم';
 }
});
</script>
</body>
</html>
