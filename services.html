<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلب خدمة - HA Marketing</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f5f5f5;color:#111}.wrap{width:94%;max-width:1100px;margin:24px auto}.top,.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.btn{display:inline-block;padding:11px 14px;border-radius:10px;background:#111;color:#fff;text-decoration:none}.light{background:#eee;color:#111}h1{text-align:center}.search{display:grid;grid-template-columns:2fr 1fr;gap:10px;background:#fff;padding:12px;border-radius:16px;margin:15px 0}.search input,.search select{padding:12px;border:1px solid #ccc;border-radius:10px;width:100%}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:#fff;border-radius:16px;padding:15px;box-shadow:0 4px 18px #0001;text-decoration:none;color:#111;min-height:150px}.icon{font-size:38px}.muted{color:#666;line-height:1.7}.img{width:100%;height:120px;object-fit:cover;border-radius:12px;background:#eee}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr}.search{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><a class="btn light" href="index.html">← الرئيسية</a><a class="btn" href="service-orders.html">📋 طلباتي</a></div><h1>🛠️ طلب خدمة</h1><p class="muted" style="text-align:center">اختر نوع الخدمة ثم اختر مقدم الخدمة المناسب حسب المنطقة والتوفر والتقييم.</p><div class="search"><input id="q" placeholder="🔎 ابحث عن حداد، حلاق، كهربائي..."><select id="sort"><option value="order">الترتيب</option><option value="name">حسب الاسم</option></select></div><div id="box" class="grid"><div class="card">جاري التحميل...</div></div></div><script>
const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,storageKey:'ha-marketing-auth'}});let rows=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const {data,error}=await db.from('service_categories').select('*').eq('is_active',true).order('sort_order');if(error){box.innerHTML='<div class="card">شغّل ملف SERVICE-MARKETPLACE-UPDATE.sql أولاً.<br>'+esc(error.message)+'</div>';return}rows=data||[];render()}function render(){let a=rows.filter(x=>!q.value.trim()||(x.name+' '+(x.description||'')).includes(q.value.trim()));if(sort.value==='name')a.sort((x,y)=>x.name.localeCompare(y.name,'ar'));box.innerHTML=a.length?a.map(x=>`<a class="card" href="service-category.html?id=${x.id}">${x.image_url?`<img class="img" src="${esc(x.image_url)}" alt="">`:`<div class="icon">${esc(x.icon||'🛠️')}</div>`}<h2>${esc(x.name)}</h2><div class="muted">${esc(x.description||'')}</div></a>`).join(''):'<div class="card">لا توجد نتائج.</div>'}q.oninput=render;sort.onchange=render;load();
</script></body></html>
