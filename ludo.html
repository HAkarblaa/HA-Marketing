<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6446d7"><title>لودو • HA Marketing</title><link rel="stylesheet" href="ha-ludo.css"><link rel="stylesheet" href="ha-game-comms.css"><script src="ha-vendor-supabase.js" defer></script><script src="ha-ludo-engine.js" defer></script><script src="ha-game-sync.js" defer></script><script src="ha-game-comms.js" defer></script><script src="ha-ludo.js" defer></script><script src="ha-entertainment-offline.js" defer></script></head><body><main class="app"><header><a class="icon" href="entertainment.html" aria-label="الرجوع للترفيه">➜</a><strong>HA Marketing</strong><button class="icon" id="settings" aria-label="الإعدادات">⚙</button></header><h1>لودو <span>🎲</span></h1><p class="intro">ارمِ النرد… وخطّط للفوز!</p>
<section id="lobby" class="panel"><img class="hero" src="ha-game-ludo.svg" width="600" height="330" alt="لوحة لودو بألوان زاهية"><label for="name">اسم اللاعب</label><input id="name" maxlength="24" placeholder="اكتب اسمك"><div class="modes"><button data-mode="cpu"><b>ضد الجهاز</b><small>تدريب بثلاث صعوبات</small></button><button data-mode="local"><b>لاعبان</b><small>على نفس الموبايل</small></button><button data-mode="levels"><b>المستويات</b><small id="levelLabel">12 تحدياً</small></button><button data-mode="online"><b>أونلاين</b><small>صديقك • مايك • إيموجيات</small></button></div><label for="difficulty">صعوبة الجهاز</label><select id="difficulty"><option value="easy">سهل</option><option value="medium">متوسط</option><option value="hard">صعب</option></select><button id="leaders" class="gold wide">🏆 التصنيف</button></section>
<section id="onlinePanel" class="panel" hidden><h2>العب ويا صديقك</h2><p>لودو للاعبين: الأحمر والأزرق. شارك كود الغرفة حتى ينضم صديقك.</p><button id="create" class="primary wide">إنشاء غرفة</button><div class="join"><input id="roomInput" maxlength="8" placeholder="كود الغرفة" aria-label="كود الغرفة" dir="ltr"><button id="join" class="secondary">انضمام</button></div><p class="hint">الفوز بالأونلاين 30 نقطة. التدريب والأوفلاين بدون نقاط تصنيف.</p><button id="onlineBack" class="secondary wide">رجوع</button></section>
<section id="game" hidden><div class="scores"><div class="score red"><b id="p1"></b><span id="s1">0 / 4</span></div><div class="round">الجولة <b id="round">1</b></div><div class="score blue"><b id="p2"></b><span id="s2">0 / 4</span></div></div><div id="roomInfo" hidden><strong id="roomCode"></strong><button id="copyCode">نسخ الكود</button></div><p id="status" role="status"></p><div id="board" aria-label="لوحة لودو"></div><div class="dice-row"><div id="die" aria-label="النرد">⚄</div><button id="roll" class="primary">🎲 ارمِ النرد</button></div><div id="pieceChoices" class="piece-choices" aria-label="اختيار القطعة"></div><p id="lastAction" class="hint"></p><p id="connection" class="hint"></p><button id="hintReward" class="gold wide" hidden>شاهد إعلاناً • تلميح أفضل قطعة</button><div class="actions"><button id="again" class="primary">جولة جديدة ↻</button><button id="menu" class="secondary">القائمة</button></div></section>
<footer><button id="sound">الصوت: شغّال</button><button id="help">طريقة اللعب</button></footer><p id="notice" role="status" hidden></p><dialog id="dialog"><form method="dialog"><button class="close" aria-label="إغلاق">×</button></form><h2 id="dialogTitle"></h2><div id="dialogBody"></div></dialog></main></body></html>
