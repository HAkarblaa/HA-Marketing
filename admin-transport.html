<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>إدارة النقل - HA Marketing</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="firebase-auth-secure.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f5f5f5;color:#111}.top{position:sticky;top:0;z-index:5;background:#111;color:#fff;padding:13px 15px;display:flex;justify-content:space-between;align-items:center}.top a{background:#fff;color:#111;text-decoration:none;padding:8px 11px;border-radius:9px}.wrap{width:min(1150px,96%);margin:15px auto}.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 3px 14px #0001}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#f7f7f7;border-radius:12px;padding:12px;text-align:center}.stat b{font-size:22px;display:block}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}.filters input,.filters select{padding:11px;border:1px solid #ddd;border-radius:10px}.ride{border:1px solid #e5e5e5;border-radius:13px;padding:12px;margin:8px 0}.ride-head{display:flex;justify-content:space-between;gap:8px;align-items:center}.badge{background:#eee;padding:5px 8px;border-radius:999px;font-size:11px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.cell{background:#f8f8f8;border-radius:9px;padding:8px}.cell small{display:block;color:#777;font-size:10px}.cell b{font-size:12px}.actions{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:9px 11px;background:#111;color:#fff;font-weight:700}.btn.danger{background:#8b0000}.muted{color:#666;font-size:12px;line-height:1.6}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.filters,.grid{grid-template-columns:1fr}}</style></head><body>
<div class="top"><b>🚕 إدارة النقل</b><a href="admin-panel.html">لوحة الإدارة</a></div><div class="wrap"><div id="gate" class="card">جاري التحقق من صلاحية الأدمن...</div><div id="app" style="display:none">
<div class="stats"><div class="stat"><b id="sSearch">0</b>بانتظار سائق</div><div class="stat"><b id="sActive">0</b>رحلات فعالة</div><div class="stat"><b id="sDone">0</b>مكتملة</div><div class="stat"><b id="sCancel">0</b>ملغاة</div></div>
<div class="card"><div class="filters"><input id="q" placeholder="بحث باسم الزبون أو السائق أو رقم الهاتف"><select id="service"><option value="">كل الخدمات</option><option value="taxi">تكسي</option><option value="tuktuk">تكتك</option><option value="delivery">مندوب</option></select><select id="status"><option value="">كل الحالات</option><option value="searching">بحث</option><option value="accepted">مقبولة</option><option value="arrived">وصل</option><option value="started">بدأت</option><option value="finished">مكتملة</option><option value="cancelled">ملغاة</option><option value="rejected">مرفوضة</option></select></div></div>
<div class="card"><div class="ride-head"><b>الطلبات والرحلات</b><span class="muted">تحديث مباشر من Firebase</span></div><div id="list">جاري التحميل...</div></div></div></div>
<script>
const SB_URL='https://ubayrhtshgtgggxprrek.supabase.co',SB_KEY='sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll';const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});const PRINCIPAL='f65185bb-1761-42c0-b358-1b0277555e24';
const firebaseConfig={apiKey:'AIzaSyBeMx5PkqtfsNcahpw2EUFxAO4lmFE7i2I',authDomain:'ha-marketing-transport.firebaseapp.com',databaseURL:'https://ha-marketing-transport-default-rtdb.firebaseio.com',projectId:'ha-marketing-transport',storageBucket:'ha-marketing-transport.firebasestorage.app',messagingSenderId:'346291699367',appId:'1:346291699367:web:efb83ed1fb6d2bd8999539'};if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);const rdb=firebase.database();let rides={};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return n?Number(n).toLocaleString('ar-IQ')+' د.ع':'—'}function dt(v){return v?new Date(v).toLocaleString('ar-IQ'):'—'}function st(s){return ({searching:'جاري البحث',accepted:'مقبولة',arrived:'وصل السائق',started:'بدأت',finished:'مكتملة',cancelled:'ملغاة',rejected:'مرفوضة'})[s]||s||'—'}function sv(r){return r.serviceType||'taxi'}
async function init(){const {data:{session}}=await sb.auth.getSession();if(!session){gate.textContent='يجب تسجيل الدخول أولاً.';return}let ok=session.user.id===PRINCIPAL;try{const a=await sb.from('app_admins').select('is_super_admin,is_active').eq('user_id',session.user.id).maybeSingle();ok=ok||!!(a.data?.is_active&&a.data?.is_super_admin);if(!ok){const p=await sb.from('app_admin_permissions').select('section_key').eq('admin_user_id',session.user.id).eq('section_key','transport').eq('can_view',true).maybeSingle();ok=!!p.data}}catch(e){}if(!ok){gate.textContent='هذا الحساب لا يملك صلاحية إدارة النقل.';return}gate.style.display='none';app.style.display='block';await HA_FirebaseAuth.ready();rdb.ref('rides').on('value',s=>{rides=s.val()||{};render()})}
function render(){const arr=Object.entries(rides).map(([id,r])=>({id,...r})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));sSearch.textContent=arr.filter(r=>r.status==='searching').length;sActive.textContent=arr.filter(r=>['accepted','arrived','started'].includes(r.status)).length;sDone.textContent=arr.filter(r=>r.status==='finished').length;sCancel.textContent=arr.filter(r=>r.status==='cancelled').length;const text=q.value.trim().toLowerCase(),ser=service.value,sta=status.value;const f=arr.filter(r=>(!ser||sv(r)===ser)&&(!sta||r.status===sta)&&(!text||[r.customer?.name,r.customer?.phone,r.driver?.name,r.driver?.phone,r.id].some(x=>String(x||'').toLowerCase().includes(text))));list.innerHTML=f.length?f.slice(0,100).map(r=>`<div class="ride"><div class="ride-head"><b>${esc(r.customer?.name||'زبون')} • ${money(r.price)}</b><span class="badge">${esc(st(r.status))} / ${esc(sv(r))}</span></div><div class="grid"><div class="cell"><small>الزبون</small><b>${esc(r.customer?.phone||'—')}</b></div><div class="cell"><small>السائق</small><b>${esc(r.driver?.name||'—')}</b></div><div class="cell"><small>المركبة</small><b>${esc(r.driver?.plate||r.vehicleType||'—')}</b></div><div class="cell"><small>المسافة</small><b>${r.distanceKm?Number(r.distanceKm).toFixed(1)+' كم':'—'}</b></div><div class="cell"><small>المدة</small><b>${r.tripMinutes?Math.round(r.tripMinutes)+' د':'—'}</b></div><div class="cell"><small>وقت الطلب</small><b>${dt(r.createdAt)}</b></div></div>${r.cancelReason?`<div class="muted">سبب الإلغاء: ${esc(r.cancelReason)}</div>`:''}<div class="actions">${['searching','accepted','arrived','started'].includes(r.status)?`<button class="btn danger" onclick="cancelRide('${r.id}')">إلغاء من الإدارة</button>`:''}</div></div>`).join(''):'<div class="muted">لا توجد نتائج.</div>'}
async function cancelRide(id){if(!confirm('تأكيد إلغاء هذه الرحلة من الإدارة؟'))return;await rdb.ref('rides/'+id).update({status:'cancelled',cancelledBy:'admin',cancelReason:'ألغي من الإدارة',cancelledAt:firebase.database.ServerValue.TIMESTAMP})}q.oninput=render;service.onchange=render;status.onchange=render;init();
</script></body></html>
