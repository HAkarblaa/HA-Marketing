<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سلة الشراء</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll');</script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f5f5f5;color:#111}.wrap{width:94%;max-width:1000px;margin:24px auto}h1{text-align:center}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 4px 16px #0001}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.btn,button{display:inline-block;border:0;border-radius:10px;padding:11px 14px;background:#111;color:#fff;text-decoration:none;cursor:pointer}.light{background:#eee;color:#111}.danger{background:#a90020}.muted{color:#666;line-height:1.7}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}input,select,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:9px;margin:6px 0}.img{width:100%;height:220px;object-fit:contain;background:#fafafa;border-radius:12px}.price{font-size:21px;font-weight:bold}.badge{background:#eee;padding:5px 9px;border-radius:999px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><a class="btn light" href="shop.html">← متابعة التسوق</a><h1>🛒 سلة الشراء</h1><div id="items"></div><div class="card"><h2>بيانات التسليم</h2><input id="phone" placeholder="رقم الهاتف"><textarea id="address" placeholder="العنوان الكامل"></textarea><textarea id="notes" placeholder="ملاحظات (اختياري)"></textarea><p class="muted">طريقة الدفع المتاحة حاليًا: <strong>الدفع عند الاستلام</strong>. لا يتم عرض دفع إلكتروني قبل ربط مزود دفع فعلي.</p><button id="checkout" style="width:100%">تأكيد الطلب</button></div></div><script>
let cart=JSON.parse(localStorage.getItem('ha_cart')||'[]'), products=[];function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}async function render(){if(!cart.length){items.innerHTML='<div class="card">السلة فارغة.</div>';checkout.disabled=true;return}const ids=cart.map(x=>x.product_id);const {data,error}=await db.from('shop_products').select('id,name,price_iqd,stock_qty,is_active').in('id',ids);if(error){items.innerHTML='<div class="card">'+esc(error.message)+'</div>';return}products=data||[];let total=0;items.innerHTML=cart.map((x,i)=>{const p=products.find(p=>p.id===x.product_id);if(!p)return '';total+=Number(p.price_iqd)*x.qty;return `<div class="card"><div class="row"><strong>${esc(p.name)}</strong><span>${Number(p.price_iqd).toLocaleString('ar-IQ')} د.ع</span></div><div class="row" style="margin-top:10px"><button class="light" onclick="q(${i},-1)">−</button><span>الكمية: ${x.qty}</span><button class="light" onclick="q(${i},1)">+</button><button class="danger" onclick="del(${i})">حذف</button></div></div>`}).join('')+`<div class="card"><div class="row"><strong>المجموع</strong><strong class="price">${total.toLocaleString('ar-IQ')} د.ع</strong></div></div>`}function q(i,d){cart[i].qty=Math.max(1,cart[i].qty+d);save()}function del(i){cart.splice(i,1);save()}function save(){localStorage.setItem('ha_cart',JSON.stringify(cart));render()}
checkout.onclick=async()=>{const {data:u}=await db.auth.getUser();if(!u?.user){alert('يجب تسجيل الدخول قبل تأكيد الطلب');location.href='login.html';return}if(!phone.value.trim()||!address.value.trim()){alert('أدخل الهاتف والعنوان');return}checkout.disabled=true;const payload=cart.map(x=>({product_id:x.product_id,qty:x.qty}));const {data,error}=await db.rpc('create_shop_order',{p_items:payload,p_phone:phone.value.trim(),p_address:address.value.trim(),p_notes:notes.value.trim()||null});checkout.disabled=false;if(error){alert('تعذر إنشاء الطلب: '+error.message);return}localStorage.removeItem('ha_cart');alert('تم إنشاء طلب الشراء رقم #'+data+' بنجاح');location.href='shop-orders.html'};render();
</script></body></html>
