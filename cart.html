<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سلة الشراء</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll');</script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f5f5f5;color:#111}.wrap{width:94%;max-width:1000px;margin:24px auto}h1{text-align:center}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 4px 16px #0001}.btn,button{display:inline-block;border:0;border-radius:10px;padding:11px 14px;background:#111;color:#fff;text-decoration:none;cursor:pointer}.light{background:#eee;color:#111}.danger{background:#a90020}.muted{color:#666;line-height:1.7}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}input,select,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:9px;margin:6px 0}.price{font-size:21px;font-weight:bold}.payopt{display:block;border:1px solid #ddd;border-radius:12px;padding:13px;margin:9px 0;background:#fafafa;cursor:pointer}.payopt input{width:auto;margin-left:8px}.summary .row{padding:7px 0;border-bottom:1px solid #eee}.summary .row:last-child{border:0}.coupon{display:grid;grid-template-columns:1fr auto;gap:8px}.saved{display:grid;grid-template-columns:1fr auto;gap:8px}.tag{background:#eee;padding:4px 8px;border-radius:999px;font-size:13px}</style></head><body><div class="wrap"><a class="btn light" href="shop.html">← متابعة التسوق</a><h1>🛒 سلة الشراء</h1><div id="items"></div><div class="card"><h2>بيانات التسليم</h2><div id="savedBox"></div><input id="customerName" placeholder="الاسم الكامل"><input id="phone" placeholder="رقم الهاتف"><input id="governorate" placeholder="المحافظة"><textarea id="address" placeholder="العنوان الكامل"></textarea><label><input id="saveAddress" type="checkbox" style="width:auto"> حفظ هذا العنوان لاستخدامه لاحقاً</label><textarea id="notes" placeholder="ملاحظات (اختياري)"></textarea><h3>كوبون الخصم</h3><div class="coupon"><input id="coupon" placeholder="اكتب رمز الكوبون"><button class="light" onclick="previewTotals()">تطبيق</button></div><div id="couponMsg" class="muted"></div><h3>طريقة الدفع</h3><label class="payopt"><input type="radio" name="paymentMethod" value="cash_on_delivery" checked> <strong>الدفع عند الاستلام</strong><br><span class="muted">تدفع قيمة الطلب عند وصوله إليك.</span></label><label class="payopt"><input type="radio" name="paymentMethod" value="electronic"> <strong>الدفع الإلكتروني / بالبطاقة</strong><br><span class="muted">يتم إنشاء الطلب ثم تفتح صفحة الدفع الإلكتروني.</span></label><div id="payNotice" class="muted" style="margin:10px 0"></div><div id="summary" class="summary"></div><button id="checkout" style="width:100%;margin-top:10px">إتمام الشراء</button></div></div><script>
let cart=JSON.parse(localStorage.getItem('ha_cart')||'[]'),products=[],me=null,deliveryFee=0,discountAmount=0;const items=document.getElementById('items'),checkout=document.getElementById('checkout');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function eff(p){return p.discount_price!=null&&Number(p.discount_price)<Number(p.price)?Number(p.discount_price):Number(p.price)}function subtotal(){return cart.reduce((s,x)=>{const p=products.find(p=>p.id===x.product_id);return s+(p?eff(p)*x.qty:0)},0)}
async function prefill(){const {data:u}=await db.auth.getUser();me=u?.user||null;if(!me)return;const {data:p}=await db.from('profiles').select('full_name,phone,governorate').eq('id',me.id).maybeSingle();if(p){customerName.value=p.full_name||'';phone.value=p.phone||'';governorate.value=p.governorate||''}const {data:a}=await db.from('shop_saved_addresses').select('*').eq('user_id',me.id).order('is_default',{ascending:false}).order('created_at',{ascending:false});if(a?.length){savedBox.innerHTML='<h3>العناوين المحفوظة</h3>'+a.map(x=>`<button class="light" style="margin:3px" onclick="useAddress(${x.id})">${esc(x.label)} — ${esc(x.governorate||'')}</button>`).join('');window.savedAddresses=a}await previewTotals()}
async function render(){checkout.disabled=!cart.length;if(!cart.length){items.innerHTML='<div class="card">السلة فارغة.</div>';summary.innerHTML='';return}const ids=[...new Set(cart.map(x=>x.product_id))];const {data,error}=await db.from('products').select('id,name,price,discount_price,stock,is_active,min_order_qty').in('id',ids);if(error){items.innerHTML='<div class="card">'+esc(error.message)+'</div>';return}products=data||[];cart=cart.filter(x=>products.some(p=>p.id===x.product_id));localStorage.setItem('ha_cart',JSON.stringify(cart));items.innerHTML=cart.map((x,i)=>{const p=products.find(p=>p.id===x.product_id);if(!p)return '';const min=Math.max(1,Number(p.min_order_qty||1));if(x.qty>p.stock)x.qty=Math.max(min,p.stock);return `<div class="card"><div class="row"><strong>${esc(p.name)} ${x.option_text?`<span class="tag">${esc(x.option_text)}</span>`:''}</strong><span>${eff(p).toLocaleString('ar-IQ')} د.ع</span></div><div class="row" style="margin-top:10px"><button class="light" onclick="q(${i},-${min})">−</button><span>الكمية: ${x.qty}</span><button class="light" onclick="q(${i},${min})">+</button><button class="danger" onclick="delItem(${i})">حذف</button></div></div>`}).join('');localStorage.setItem('ha_cart',JSON.stringify(cart));await previewTotals()}
function q(i,d){const p=products.find(p=>p.id===cart[i].product_id);if(!p)return;const min=Math.max(1,Number(p.min_order_qty||1)),next=cart[i].qty+d;if(next<min)return;if(next>p.stock){alert('الكمية المطلوبة أكبر من المخزون المتوفر');return}cart[i].qty=next;save()}function delItem(i){cart.splice(i,1);save()}function save(){localStorage.setItem('ha_cart',JSON.stringify(cart));render()}
function useAddress(id){const x=(window.savedAddresses||[]).find(a=>a.id===id);if(!x)return;governorate.value=x.governorate||'';address.value=x.address||'';previewTotals()}
async function previewTotals(){deliveryFee=0;discountAmount=0;const sub=subtotal(),gov=governorate.value.trim();if(gov){const {data:f}=await db.from('shop_delivery_fees').select('fee').eq('governorate',gov).eq('is_active',true).maybeSingle();deliveryFee=Number(f?.fee||0)}const code=coupon.value.trim();if(code){const now=new Date().toISOString();const {data:c}=await db.from('shop_coupons').select('*').ilike('code',code).eq('is_active',true).maybeSingle();if(c&&sub>=Number(c.min_total||0)&&(!c.starts_at||c.starts_at<=now)&&(!c.expires_at||c.expires_at>=now)){discountAmount=c.discount_type==='percent'?Math.floor(sub*Math.min(Number(c.discount_value),100)/100):Number(c.discount_value);if(c.max_discount!=null)discountAmount=Math.min(discountAmount,Number(c.max_discount));discountAmount=Math.min(discountAmount,sub);couponMsg.textContent='تم تطبيق الكوبون.'}else couponMsg.textContent='الكوبون غير صالح أو لا ينطبق على هذا الطلب.'}else couponMsg.textContent='';const total=Math.max(0,sub+deliveryFee-discountAmount);summary.innerHTML=`<div class="row"><span>المجموع الفرعي</span><strong>${sub.toLocaleString('ar-IQ')} د.ع</strong></div><div class="row"><span>التوصيل</span><strong>${deliveryFee.toLocaleString('ar-IQ')} د.ع</strong></div><div class="row"><span>الخصم</span><strong>- ${discountAmount.toLocaleString('ar-IQ')} د.ع</strong></div><div class="row"><span>المجموع النهائي</span><strong class="price">${total.toLocaleString('ar-IQ')} د.ع</strong></div>`}
checkout.onclick=async()=>{const {data:u}=await db.auth.getUser();if(!u?.user){alert('يجب تسجيل الدخول قبل تأكيد الطلب');location.href='login.html';return}if(!cart.length)return;if(!customerName.value.trim()||!phone.value.trim()||!address.value.trim()){alert('أكمل الاسم ورقم الهاتف والعنوان');return}checkout.disabled=true;const payload=cart.map(x=>({product_id:x.product_id,quantity:x.qty,option_text:x.option_text||null}));const method=document.querySelector('input[name=paymentMethod]:checked')?.value||'cash_on_delivery';const {data,error}=await db.rpc('create_shop_order_v3',{p_customer_name:customerName.value.trim(),p_phone:phone.value.trim(),p_governorate:governorate.value.trim(),p_address:address.value.trim(),p_notes:notes.value.trim()||null,p_items:payload,p_payment_method:method,p_coupon_code:coupon.value.trim()||null});if(!error&&saveAddress.checked){await db.from('shop_saved_addresses').insert({user_id:u.user.id,label:'عنوان '+new Date().toLocaleDateString('ar-IQ'),governorate:governorate.value.trim()||null,address:address.value.trim()})}checkout.disabled=false;if(error){alert('تعذر إنشاء الطلب: '+error.message);return}localStorage.removeItem('ha_cart');if(method==='electronic'){alert('تم إنشاء الطلب رقم #'+data+' وسيتم نقلك إلى الدفع الإلكتروني');location.href='payments.html?order='+encodeURIComponent(data)}else{alert('تم إنشاء طلب الشراء رقم #'+data+' بنجاح');location.href='order-receipt.html?id='+encodeURIComponent(data)}};
[governorate,coupon].forEach(x=>x.addEventListener('change',previewTotals));document.querySelectorAll('input[name=paymentMethod]').forEach(x=>x.addEventListener('change',()=>{const m=document.querySelector('input[name=paymentMethod]:checked')?.value;payNotice.textContent=m==='electronic'?'سيتم إنشاء الطلب ثم الانتقال إلى صفحة الدفع الإلكتروني.':'سيتم الدفع عند استلام الطلب.'}));prefill();render();
</script></body></html>
