<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سلة الشراء</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll');</script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f5f5f5;color:#111}.wrap{width:94%;max-width:1000px;margin:24px auto}h1{text-align:center}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 4px 16px #0001}.btn,button{display:inline-block;border:0;border-radius:10px;padding:11px 14px;background:#111;color:#fff;text-decoration:none;cursor:pointer}.light{background:#eee;color:#111}.danger{background:#a90020}.muted{color:#666;line-height:1.7}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}input,select,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:9px;margin:6px 0}.price{font-size:21px;font-weight:bold}.payopt{display:block;border:1px solid #ddd;border-radius:12px;padding:13px;margin:9px 0;background:#fafafa;cursor:pointer}.payopt input{width:auto;margin-left:8px}.payopt:has(input:checked){border-color:#111;background:#f1f1f1}</style></head><body><div class="wrap"><a class="btn light" href="shop.html">← متابعة التسوق</a><h1>🛒 سلة الشراء</h1><div id="items"></div><div class="card"><h2>بيانات التسليم</h2><input id="customerName" placeholder="الاسم الكامل"><input id="phone" placeholder="رقم الهاتف"><input id="governorate" placeholder="المحافظة"><textarea id="address" placeholder="العنوان الكامل"></textarea><textarea id="notes" placeholder="ملاحظات (اختياري)"></textarea><h3>طريقة الدفع</h3><label class="payopt"><input type="radio" name="paymentMethod" value="cash_on_delivery" checked> <strong>الدفع عند الاستلام</strong><br><span class="muted">تدفع قيمة الطلب عند وصوله إليك.</span></label><label class="payopt"><input type="radio" name="paymentMethod" value="electronic"> <strong>الدفع الإلكتروني / بالبطاقة</strong><br><span class="muted">يتم إنشاء الطلب ثم تفتح صفحة الدفع الإلكتروني. الربط الفعلي ببوابة الدفع يتم لاحقاً.</span></label><div id="payNotice" class="muted" style="margin:10px 0"></div><button id="checkout" style="width:100%">إتمام الشراء</button></div></div><script>
let cart=JSON.parse(localStorage.getItem('ha_cart')||'[]'),products=[];const items=document.getElementById('items'),checkout=document.getElementById('checkout');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function prefill(){const {data:u}=await db.auth.getUser();if(!u?.user)return;const {data:p}=await db.from('profiles').select('full_name,phone,governorate,account_type').eq('id',u.user.id).maybeSingle();if(p){customerName.value=p.full_name||'';phone.value=p.phone||'';governorate.value=p.governorate||''}}
async function render(){checkout.disabled=!cart.length;if(!cart.length){items.innerHTML='<div class="card">السلة فارغة.</div>';return}const ids=[...new Set(cart.map(x=>x.product_id))];const {data,error}=await db.from('products').select('id,name,price,stock,is_active').in('id',ids);if(error){items.innerHTML='<div class="card">'+esc(error.message)+'</div>';return}products=data||[];cart=cart.filter(x=>products.some(p=>p.id===x.product_id));localStorage.setItem('ha_cart',JSON.stringify(cart));let total=0;items.innerHTML=cart.map((x,i)=>{const p=products.find(p=>p.id===x.product_id);if(!p)return '';if(x.qty>p.stock)x.qty=Math.max(1,p.stock);total+=Number(p.price)*x.qty;return `<div class="card"><div class="row"><strong>${esc(p.name)}</strong><span>${Number(p.price).toLocaleString('ar-IQ')} د.ع</span></div><div class="row" style="margin-top:10px"><button class="light" onclick="q(${i},-1)">−</button><span>الكمية: ${x.qty}</span><button class="light" onclick="q(${i},1)">+</button><button class="danger" onclick="delItem(${i})">حذف</button></div></div>`}).join('')+`<div class="card"><div class="row"><strong>المجموع</strong><strong class="price">${total.toLocaleString('ar-IQ')} د.ع</strong></div></div>`;localStorage.setItem('ha_cart',JSON.stringify(cart))}
function q(i,d){const p=products.find(p=>p.id===cart[i].product_id);if(!p)return;const next=cart[i].qty+d;if(next<1)return;if(next>p.stock){alert('الكمية المطلوبة أكبر من المخزون المتوفر');return}cart[i].qty=next;save()}function delItem(i){cart.splice(i,1);save()}function save(){localStorage.setItem('ha_cart',JSON.stringify(cart));render()}
checkout.onclick=async()=>{const {data:u}=await db.auth.getUser();if(!u?.user){alert('يجب تسجيل الدخول قبل تأكيد الطلب');location.href='login.html';return}if(!cart.length)return;if(!customerName.value.trim()||!phone.value.trim()||!address.value.trim()){alert('أكمل الاسم ورقم الهاتف والعنوان');return}checkout.disabled=true;const payload=cart.map(x=>({product_id:x.product_id,quantity:x.qty}));const method=document.querySelector('input[name=paymentMethod]:checked')?.value||'cash_on_delivery';const {data,error}=await db.rpc('create_shop_order_v2',{p_customer_name:customerName.value.trim(),p_phone:phone.value.trim(),p_governorate:governorate.value.trim(),p_address:address.value.trim(),p_notes:notes.value.trim()||null,p_items:payload,p_payment_method:method});checkout.disabled=false;if(error){alert('تعذر إنشاء الطلب: '+error.message);return}localStorage.removeItem('ha_cart');if(method==='electronic'){alert('تم إنشاء الطلب رقم #'+data+' وسيتم نقلك إلى الدفع الإلكتروني');location.href='payments.html?order='+encodeURIComponent(data)}else{alert('تم إنشاء طلب الشراء رقم #'+data+' بنجاح');location.href='shop-orders.html'}};prefill();render();
document.querySelectorAll('input[name=paymentMethod]').forEach(x=>x.addEventListener('change',()=>{const m=document.querySelector('input[name=paymentMethod]:checked')?.value;payNotice.textContent=m==='electronic'?'سيتم إنشاء الطلب ثم الانتقال إلى صفحة الدفع الإلكتروني.':'سيتم الدفع عند استلام الطلب.'}));</script></body></html>
