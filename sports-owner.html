<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة الرياضة - قريباً</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7f5}.w{width:min(1000px,94%);margin:20px auto}.c{background:#fff;border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 3px 14px #0001}input,textarea,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;margin:5px 0}button,.b{border:0;background:#164b32;color:#fff;border-radius:10px;padding:10px 13px;text-decoration:none}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.muted{color:#667;line-height:1.7}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class=w><a class=b href="sports.html">← الرياضة - قريباً</a><h1>🧑‍💼 إدارة المرافق الرياضية</h1><div id=guard class=c>جاري التحقق...</div><div id=app style="display:none"><div class=c><h2>🏆 إضافة دوري</h2><div class=grid><input id=ln placeholder="اسم الدوري"><input id=lg placeholder="المحافظة"><input id=ls type=date><input id=le type=date></div><textarea id=ld placeholder="تفاصيل الدوري، الشروط، الجوائز، الفرق المستهدفة"></textarea><button onclick=addLeague()>إضافة الدوري</button></div><div class=c><h2>📅 طلبات الحجز والاشتراك</h2><div id=bookings>جاري التحميل...</div></div></div></div><script>const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});
let me=null;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function init(){let {data:{session}}=await db.auth.getSession();if(!session)return location.href='login.html?next=sports-owner.html';me=session.user;let {data}=await db.rpc('can_manage_sports');if(!data){guard.textContent='هذه الصفحة للموظف المعتمد/مقدم الخدمة أو الأدمن الرئيسي.';return}guard.textContent='✅ صلاحية الإدارة فعالة';app.style.display='block';load()}async function addLeague(){if(!ln.value.trim())return alert('اكتب اسم الدوري');let {error}=await db.from('sports_leagues').insert({owner_user_id:me.id,name:ln.value.trim(),governorate:lg.value.trim()||null,start_date:ls.value||null,end_date:le.value||null,details:ld.value.trim()||null});if(error)return alert(error.message);ln.value='';ld.value='';alert('✅ تم إضافة الدوري')}async function load(){let {data,error}=await db.from('sports_bookings').select('*,sports_facilities(name,facility_type,owner_user_id)').order('created_at',{ascending:false});if(error){bookings.textContent=error.message;return}let a=(data||[]).filter(x=>x.sports_facilities?.owner_user_id===me.id);bookings.innerHTML=a.map(x=>`<div class=c><div class=row><b>${x.sports_facilities.facility_type==='stadium'?'🏟️':'🏋️'} ${esc(x.sports_facilities.name)}</b><span>${esc(x.status)}</span></div><div class=muted>التاريخ: ${esc(x.booking_date||'اشتراك')} — الوقت: ${esc(x.booking_time||'—')}<br>${esc(x.notes||'')}</div><div class=row style="margin-top:8px"><button onclick="setSt(${x.id},'approved')">موافقة</button><button onclick="setSt(${x.id},'rejected')">رفض</button><button onclick="setSt(${x.id},'completed')">مكتمل</button></div></div>`).join('')||'لا توجد طلبات حالياً.'}async function setSt(id,status){let {error}=await db.from('sports_bookings').update({status}).eq('id',id);if(error)alert(error.message);else load()}init();</script></body></html>
