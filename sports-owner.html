<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>إدارة الملاعب والجم - HA Marketing</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#03070b;--panel:#081018;--gold:#f4c45f;--gold2:#a87520;--text:#fff;--muted:#aeb8c4;--line:#263747;--red:#d83a47;--green:#1e9b59}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:radial-gradient(circle at 50% 0,#12212d 0,#05090d 35%,#020405 75%);color:var(--text)}
a{text-decoration:none;color:inherit}.w{width:min(100%,980px);margin:auto;padding:14px 10px 95px}.top,.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.b,button{border:1px solid #8f6827;background:#0a0f14;color:#fff;border-radius:12px;padding:10px 13px;font:inherit;cursor:pointer}.primary{background:linear-gradient(135deg,#ffdc78,#e99d19);color:#111;font-weight:900}.danger{border-color:#b62c38;color:#ff7078}.ok{border-color:#248b55;color:#74e6a6}
.c{background:linear-gradient(145deg,#0b151f,#050a0f);border:1px solid #38495a;border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 10px 28px #0008}
h1{font-size:24px;margin:8px 0;color:#f7d879}h2{font-size:18px;margin:4px 0 10px;color:#f7d879}.muted{color:var(--muted);line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
input,select,textarea{width:100%;padding:11px;border-radius:11px;border:1px solid #38495a;background:#050a0f;color:#fff;font:inherit;margin:4px 0}textarea{min-height:85px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}.tabs button.on{background:#d69b34;color:#111;font-weight:900}.panel{display:none}.panel.on{display:block}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;border:1px solid #7b5a25;color:#f2c969;font-size:11px}
.item{border:1px solid #263747;border-radius:14px;padding:11px;margin:8px 0;background:#070d12}
@media(max-width:600px){.grid{grid-template-columns:1fr}.w{padding:8px 7px 88px}h1{font-size:20px}.tabs button{font-size:11px;padding:9px 4px}}
</style>
</head>
<body>
<div class="w">
  <div class="top">
    <a class="b" href="sports.html">← الرياضة</a>
    <h1>🏟️ إدارة الملاعب والجم</h1>
    <a class="b" href="work-center.html">مركز العمل</a>
  </div>

  <div id="guard" class="c">جاري التحقق من صلاحية العمل...</div>

  <div id="app" style="display:none">
    <div class="tabs">
      <button class="on" onclick="showTab('facilities',this)">الملاعب والجم</button>
      <button onclick="showTab('leagues',this)">الدوريات</button>
      <button onclick="showTab('bookings',this)">الحجوزات</button>
    </div>

    <section id="facilities" class="panel on">
      <div class="c">
        <h2>＋ إضافة ملعب أو جم</h2>
        <div class="grid">
          <select id="facilityType">
            <option value="stadium">🏟️ ملعب كرة قدم</option>
            <option value="gym">🏋️ جم / مركز لياقة</option>
          </select>
          <input id="facilityName" placeholder="اسم الملعب أو المركز">
          <input id="facilityGov" placeholder="المحافظة">
          <input id="facilityAddress" placeholder="العنوان">
          <input id="facilityHours" placeholder="ساعات العمل">
          <input id="facilityPrice" type="number" min="0" placeholder="السعر / الاشتراك">
          <input id="facilityPhone" placeholder="رقم التواصل">
          <input id="facilitySlots" placeholder="الأوقات المتاحة">
        </div>
        <textarea id="facilityDetails" placeholder="الخدمات، نوع الأرضية، الأجهزة، المدربين، أقسام الرجال/النساء أو أي تفاصيل"></textarea>
        <button class="primary" onclick="saveFacility()" style="width:100%">حفظ وإضافة داخل التطبيق</button>
      </div>
      <div class="c"><h2>إضافاتي</h2><div id="myFacilities">جاري التحميل...</div></div>
    </section>

    <section id="leagues" class="panel">
      <div class="c">
        <h2>🏆 إضافة دوري</h2>
        <div class="grid">
          <input id="ln" placeholder="اسم الدوري">
          <input id="lg" placeholder="المحافظة">
          <input id="ls" type="date">
          <input id="le" type="date">
        </div>
        <textarea id="ld" placeholder="تفاصيل الدوري، الشروط، الجوائز والفرق المستهدفة"></textarea>
        <button class="primary" onclick="addLeague()" style="width:100%">إضافة الدوري</button>
      </div>
      <div class="c"><h2>دورياتي</h2><div id="myLeagues">جاري التحميل...</div></div>
    </section>

    <section id="bookings" class="panel">
      <div class="c"><h2>📅 طلبات الحجز والاشتراك</h2><div id="bookingsBox">جاري التحميل...</div></div>
    </section>
  </div>
</div>

<script>
const db=supabase.createClient(
  'https://ubayrhtshgtgggxprrek.supabase.co',
  'sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',
  {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}}
);
let me=null;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function showTab(id,b){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}
async function init(){
  const {data:{session}}=await db.auth.getSession();
  if(!session){location.href='login.html?next=sports-owner.html';return}
  me=session.user;
  let allowed=false;
  try{
    const {data}=await db.rpc('has_approved_role',{p_role:'sports_manager'});
    allowed=!!data;
  }catch(e){}
  if(!allowed){
    try{
      const {data}=await db.rpc('can_manage_sports');
      allowed=!!data;
    }catch(e){}
  }
  if(!allowed){
    guard.innerHTML='ما عندك صلاحية إدارة رياضية بعد. <a class="b" href="marketplace-onboarding.html">اطلب صلاحية صاحب ملعب / جم</a>';
    return;
  }
  guard.innerHTML='✅ صلاحية إضافة وإدارة الملاعب والجم فعالة من داخل التطبيق';
  app.style.display='block';
  await Promise.all([loadFacilities(),loadLeagues(),loadBookings()]);
}
async function saveFacility(){
  const row={
    owner_user_id:me.id,
    facility_type:facilityType.value,
    name:facilityName.value.trim(),
    governorate:facilityGov.value.trim()||null,
    address:facilityAddress.value.trim(),
    working_hours:facilityHours.value.trim()||null,
    price:Number(facilityPrice.value)||0,
    phone:facilityPhone.value.trim()||null,
    details:facilityDetails.value.trim()||null,
    available_slots:facilitySlots.value.trim()||null,
    is_active:true
  };
  if(!row.name||!row.address)return alert('أكمل الاسم والعنوان');
  const {error}=await db.from('sports_facilities').insert(row);
  if(error)return alert(error.message);
  facilityName.value=facilityAddress.value=facilityDetails.value=facilitySlots.value='';
  facilityHours.value=facilityPrice.value=facilityPhone.value='';
  alert('✅ تمت الإضافة داخل التطبيق');
  loadFacilities();
}
async function loadFacilities(){
  const {data,error}=await db.from('sports_facilities').select('*').eq('owner_user_id',me.id).order('created_at',{ascending:false});
  if(error){myFacilities.textContent=error.message;return}
  myFacilities.innerHTML=(data||[]).map(x=>`<div class="item">
    <div class="row"><b>${x.facility_type==='stadium'?'🏟️':'🏋️'} ${esc(x.name)}</b><span class="badge">${x.is_active?'فعال':'موقوف'}</span></div>
    <div class="muted">${esc(x.governorate||'')} — ${esc(x.address||'')}<br>السعر: ${Number(x.price||0).toLocaleString('ar-IQ')} د.ع</div>
    <div class="row" style="margin-top:8px">
      <button onclick="toggleFacility(${x.id},${!x.is_active})">${x.is_active?'إيقاف':'تفعيل'}</button>
      <button class="danger" onclick="deleteFacility(${x.id})">حذف</button>
    </div>
  </div>`).join('')||'لا توجد إضافات بعد.';
}
async function toggleFacility(id,v){const {error}=await db.from('sports_facilities').update({is_active:v,updated_at:new Date().toISOString()}).eq('id',id).eq('owner_user_id',me.id);if(error)alert(error.message);else loadFacilities()}
async function deleteFacility(id){if(!confirm('حذف هذا المرفق؟'))return;const {error}=await db.from('sports_facilities').delete().eq('id',id).eq('owner_user_id',me.id);if(error)alert(error.message);else loadFacilities()}
async function addLeague(){
  if(!ln.value.trim())return alert('اكتب اسم الدوري');
  const {error}=await db.from('sports_leagues').insert({owner_user_id:me.id,name:ln.value.trim(),governorate:lg.value.trim()||null,start_date:ls.value||null,end_date:le.value||null,details:ld.value.trim()||null,is_active:true});
  if(error)return alert(error.message);
  ln.value=lg.value=ls.value=le.value=ld.value='';
  alert('✅ تمت إضافة الدوري');
  loadLeagues();
}
async function loadLeagues(){
  const {data,error}=await db.from('sports_leagues').select('*').eq('owner_user_id',me.id).order('created_at',{ascending:false});
  if(error){myLeagues.textContent=error.message;return}
  myLeagues.innerHTML=(data||[]).map(x=>`<div class="item"><div class="row"><b>🏆 ${esc(x.name)}</b><span class="badge">${x.is_active?'فعال':'موقوف'}</span></div><div class="muted">${esc(x.governorate||'')}<br>${esc(x.start_date||'')} — ${esc(x.end_date||'')}<br>${esc(x.details||'')}</div></div>`).join('')||'لا توجد دوريات.';
}
async function loadBookings(){
  const {data,error}=await db.from('sports_bookings').select('*,sports_facilities(name,facility_type,owner_user_id)').order('created_at',{ascending:false});
  if(error){bookingsBox.textContent=error.message;return}
  const a=(data||[]).filter(x=>x.sports_facilities?.owner_user_id===me.id);
  bookingsBox.innerHTML=a.map(x=>`<div class="item">
    <div class="row"><b>${x.sports_facilities.facility_type==='stadium'?'🏟️':'🏋️'} ${esc(x.sports_facilities.name)}</b><span class="badge">${esc(x.status)}</span></div>
    <div class="muted">التاريخ: ${esc(x.booking_date||'اشتراك')} — الوقت: ${esc(x.booking_time||'—')}<br>${esc(x.notes||'')}</div>
    <div class="row" style="margin-top:8px">
      <button class="ok" onclick="setSt(${x.id},'approved')">موافقة</button>
      <button class="danger" onclick="setSt(${x.id},'rejected')">رفض</button>
      <button onclick="setSt(${x.id},'completed')">مكتمل</button>
    </div>
  </div>`).join('')||'لا توجد طلبات حالياً.';
}
async function setSt(id,status){const {error}=await db.from('sports_bookings').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else loadBookings()}
init();
</script>
</body>
</html>
