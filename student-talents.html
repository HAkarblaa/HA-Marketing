<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مواهب الطلاب</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:linear-gradient(180deg,#fff8ef,#f4f8ff)}.w{width:min(1050px,94%);margin:20px auto}.c{background:#fff;border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 4px 18px #0001}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}input,select,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:11px;margin:5px 0}button,.b{border:0;background:#111;color:#fff;border-radius:11px;padding:11px 14px;text-decoration:none}.talent img{width:100%;height:200px;object-fit:cover;border-radius:12px}.talent p{line-height:1.7;color:#555}@media(max-width:650px){.g{grid-template-columns:repeat(2,1fr)}.talent img{height:130px}}</style></head><body><div class=w><a class=b href="study.html">← دراسة</a><h1>🎨 مواهب الطلاب</h1><div class=c><h2>انشر موهبتك</h2><select id=student><option value="">اختياري: اختر الطالب المسجل</option></select><input id=title placeholder="عنوان الموهبة"><select id=type><option>رسم</option><option>خط</option><option>شعر وكتابة</option><option>برمجة</option><option>تصوير</option><option>رياضة</option><option>أعمال يدوية</option><option>موهبة أخرى</option></select><textarea id=details placeholder="اكتب تفاصيل عن الموهبة"></textarea><input id=photo type=file accept="image/*"><button onclick=publish() style="width:100%">نشر الموهبة</button><div id=st style="margin-top:8px"></div></div><div id=feed class=g></div></div><script>const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});
let me=null;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function init(){const {data:{session}}=await db.auth.getSession();me=session?.user||null;if(me){const {data:s}=await db.from('study_students').select('id,student_name').eq('owner_user_id',me.id);student.innerHTML='<option value="">اختياري: اختر الطالب المسجل</option>'+(s||[]).map(x=>`<option value="${x.id}">${esc(x.student_name)}</option>`).join('')}load()}async function publish(){if(!me)return location.href='login.html?next=student-talents.html';if(!title.value.trim())return alert('اكتب عنوان الموهبة');let image_url=null,file=photo.files[0];if(file){st.textContent='جاري رفع الصورة...';const ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path=me.id+'/'+Date.now()+'.'+ext;const {error}=await db.storage.from('student-talents').upload(path,file,{upsert:false});if(error)return st.textContent='تعذر رفع الصورة: '+error.message;image_url=db.storage.from('student-talents').getPublicUrl(path).data.publicUrl}const {error}=await db.from('student_talents').insert({user_id:me.id,student_id:student.value?Number(student.value):null,title:title.value.trim(),talent_type:type.value,details:details.value.trim()||null,image_url});if(error)return st.textContent=error.message;title.value='';details.value='';photo.value='';st.textContent='✅ تم النشر';load()}async function load(){const {data,error}=await db.from('student_talents').select('*,study_students(student_name)').eq('is_active',true).order('created_at',{ascending:false}).limit(100);if(error){feed.innerHTML='<div class=c>شغّل ملف SQL الجديد أولاً.</div>';return}feed.innerHTML=(data||[]).map(x=>`<article class="c talent">${x.image_url?`<img src="${esc(x.image_url)}" loading=lazy>`:''}<h3>${esc(x.title)}</h3><b>${esc(x.talent_type)}</b>${x.study_students?.student_name?`<div>👨‍🎓 ${esc(x.study_students.student_name)}</div>`:''}<p>${esc(x.details||'')}</p></article>`).join('')||'<div class=c>لا توجد مواهب منشورة بعد.</div>'}init();</script></body></html>
