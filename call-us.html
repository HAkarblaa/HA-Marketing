<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اتصل بنا - HA Marketing</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#111}
.wrap{width:92%;max-width:800px;margin:45px auto}
h1{text-align:center;font-size:40px;margin-bottom:12px}
.subtitle{text-align:center;color:#666;font-size:18px;margin-bottom:30px}
.contact-card{background:#fff;border-radius:16px;padding:22px;margin:18px 0;box-shadow:0 0 15px rgba(0,0,0,.12);text-align:center}
.number{font-size:25px;font-weight:bold;direction:ltr;margin-bottom:18px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions a{display:block;text-decoration:none;padding:15px 10px;border-radius:10px;font-size:18px;font-weight:bold;color:#fff}
.call{background:#000}
.whatsapp{background:#25D366}
.back{display:block;text-align:center;margin-top:30px;color:#111;text-decoration:none;font-size:17px}
@media(max-width:500px){
 h1{font-size:32px}
 .wrap{width:94%;margin-top:30px}
 .contact-card{padding:16px}
 .number{font-size:21px}
 .actions a{font-size:16px;padding:13px 5px}
}
</style>
</head>
<body>
<div class="wrap">

  <p class="subtitle">اختر الاتصال المباشر أو التواصل عبر واتساب</p>

</html>
