<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة البائع</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f5f5f5;color:#111}.wrap{width:94%;max-width:1050px;margin:22px auto}.top,.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.btn,button{border:0;border-radius:11px;padding:11px 14px;background:#111;color:#fff;text-decoration:none;cursor:pointer;font:inherit}.light{background:#eee;color:#111}.danger{background:#9b1028}.ok{background:#0c6b2a}.card{background:#fff;border-radius:16px;padding:15px;margin:12px 0;box-shadow:0 4px 16px #0001}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.muted{color:#666;line-height:1.7}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eee;font-size:12px}input,select,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;font:inherit;margin:5px 0 10px}textarea{min-height:90px}.status{padding:10px;border-radius:10px;background:#f1f1f1;white-space:pre-wrap}@media(max-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.card{padding:10px}.grid .card{font-size:12px}}</style></head><body><div class="wrap"><div class="top"><a class="btn light" href="shop.html">← التسوق</a><h1>🏪 لوحة البائع</h1><a class="btn light" href="marketplace-onboarding.html">حالة الاعتماد</a></div><div id="gate" class="card">جاري التحقق...</div><div id="panel" style="display:none"><div class="card"><h2>متجري</h2><select id="section"><option value="markets">أسواق</option><option value="restaurants">مطاعم</option><option value="flowers">ورد</option><option value="home_appliances">أجهزة منزلية</option><option value="devices">أجهزة</option><option value="clothes">ملابس</option><option value="shoes">أحذية</option><option value="library">مكتبة</option></select><input id="storeName" placeholder="اسم المتجر"><input id="location" placeholder="العنوان / الموقع"><input id="image" placeholder="رابط الصورة"><textarea id="desc" placeholder="وصف المتجر"></textarea><button onclick="saveStore()">حفظ المتجر</button></div><div class="card"><h2>إضافة منتج</h2><select id="category"></select><input id="pname" placeholder="اسم المنتج"><input id="price" type="number" placeholder="السعر"><input id="stock" type="number" placeholder="المخزون"><input id="pimage" placeholder="رابط صورة المنتج"><textarea id="pdesc" placeholder="الوصف"></textarea><button onclick="addProduct()">إضافة المنتج</button></div><div class="card"><h2>منتجاتي</h2><div id="products">جاري التحميل...</div></div></div></div><script>const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});
let me=null,store=null;function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function init(){const {data:{session}}=await db.auth.getSession();if(!session){location.href='login.html';return}me=session.user;const {data:ok}=await db.rpc('has_approved_role',{p_role:'seller'});if(!ok){gate.innerHTML='حسابك غير معتمد كبائع بعد. <a href="marketplace-onboarding.html">إرسال/متابعة الطلب</a>';return}gate.innerHTML='✅ حساب بائع معتمد';panel.style.display='block';const {data:s}=await db.from('shop_businesses').select('*').eq('owner_user_id',me.id).maybeSingle();if(s){store=s;section.value=s.section_key;storeName.value=s.name;location.value=s.location_text||'';image.value=s.image_url||'';desc.value=s.description||''}const {data:c}=await db.from('product_categories').select('id,name').eq('is_active',true).order('sort_order');category.innerHTML=(c||[]).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');loadProducts()}async function saveStore(){const payload={owner_user_id:me.id,section_key:section.value,name:storeName.value.trim(),location_text:location.value.trim(),image_url:image.value.trim()||null,description:desc.value.trim()||null,is_active:true};if(!payload.name)return alert('اكتب اسم المتجر');let r=store?await db.from('shop_businesses').update(payload).eq('id',store.id).select().single():await db.from('shop_businesses').insert(payload).select().single();if(r.error)return alert(r.error.message);store=r.data;alert('تم حفظ المتجر')}async function addProduct(){if(!store)return alert('احفظ المتجر أولاً');const payload={category_id:Number(category.value),name:pname.value.trim(),description:pdesc.value.trim()||null,price:Number(price.value),stock:Number(stock.value||0),image_url:pimage.value.trim()||null,seller_user_id:me.id,business_id:store.id,is_active:true};if(!payload.name||!Number.isFinite(payload.price))return alert('أكمل الاسم والسعر');const {error}=await db.from('products').insert(payload);if(error)return alert(error.message);pname.value=price.value=stock.value=pimage.value=pdesc.value='';loadProducts()}async function loadProducts(){if(!me)return;const {data,error}=await db.from('products').select('id,name,price,stock,is_active').eq('seller_user_id',me.id).order('created_at',{ascending:false});products.innerHTML=error?esc(error.message):(data||[]).map(x=>`<div class="row card"><div><b>${esc(x.name)}</b><div class="muted">${Number(x.price).toLocaleString('ar-IQ')} د.ع — مخزون ${x.stock}</div></div><button class="danger" onclick="delP(${x.id})">حذف</button></div>`).join('')||'لا توجد منتجات.'}async function delP(id){if(!confirm('حذف المنتج؟'))return;const {error}=await db.from('products').delete().eq('id',id).eq('seller_user_id',me.id);if(error)alert(error.message);else loadProducts()}init();</script></body></html>
