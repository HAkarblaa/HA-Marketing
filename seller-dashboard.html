<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة البائع</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f5f5f5;color:#111}.wrap{width:94%;max-width:1050px;margin:22px auto}.top,.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.btn,button{border:0;border-radius:11px;padding:11px 14px;background:#111;color:#fff;text-decoration:none;cursor:pointer;font:inherit}.light{background:#eee;color:#111}.danger{background:#9b1028}.ok{background:#0c6b2a}.blue{background:#1769e0}.card{background:#fff;border-radius:16px;padding:15px;margin:12px 0;box-shadow:0 4px 16px #0001}.muted{color:#666;line-height:1.7}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eee;font-size:12px}input,select,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;font:inherit;margin:5px 0 10px}textarea{min-height:90px}.order{border:1px solid #e6e6e6}.items{background:#fafafa;border-radius:10px;padding:9px;margin:8px 0}.delivery{background:#eef5ff;border-radius:11px;padding:10px;margin-top:9px}@media(max-width:720px){.card{padding:11px;font-size:13px}}</style></head><body><div class="wrap"><div class="top"><a class="btn light" href="shop.html">← التسوق</a><h1>🏪 لوحة البائع</h1><a class="btn light" href="marketplace-onboarding.html">حالة الاعتماد</a></div><div id="gate" class="card">جاري التحقق...</div><div id="panel" style="display:none"><div class="card"><h2>متجري</h2><select id="section"><option value="markets">أسواق</option><option value="restaurants">مطاعم</option><option value="flowers">ورد</option><option value="home_appliances">أجهزة منزلية</option><option value="devices">أجهزة</option><option value="clothes">ملابس</option><option value="shoes">أحذية</option><option value="library">مكتبة</option></select><input id="storeName" placeholder="اسم المتجر"><input id="location" placeholder="العنوان / موقع استلام المندوب"><input id="image" placeholder="رابط الصورة"><textarea id="desc" placeholder="وصف المتجر"></textarea><button onclick="saveStore()">حفظ المتجر</button></div><div class="card"><h2>إضافة منتج</h2><select id="category"></select><input id="pname" placeholder="اسم المنتج"><input id="price" type="number" placeholder="السعر"><input id="stock" type="number" placeholder="المخزون"><input id="pimage" placeholder="رابط صورة المنتج"><textarea id="pdesc" placeholder="الوصف"></textarea><button onclick="addProduct()">إضافة المنتج</button></div><div class="card"><h2>منتجاتي</h2><div id="products">جاري التحميل...</div></div><div class="card"><div class="row"><h2>📦 طلبات المتجر والتوصيل</h2><button class="light" onclick="loadOrders()">تحديث</button></div><div class="muted">بعد تجهيز الطلب اضغط «الطلب جاهز — اطلب مندوب». يظهر الطلب للمندوبين المعتمدين، وبعد الاستلام يتابع الزبون الحالة ويؤكد التسليم برمز OTP.</div><div id="orders">جاري التحميل...</div></div></div></div><script>const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});let me=null,store=null;const DS={ready:'بانتظار مندوب',accepted:'قبله المندوب',picked_up:'تم الاستلام من المتجر',on_the_way:'بالطريق للزبون',delivered:'تم التسليم',cancelled:'ملغي'};function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function init(){const {data:{session}}=await db.auth.getSession();if(!session){location.href='login.html';return}me=session.user;const {data:ok}=await db.rpc('has_approved_role',{p_role:'seller'});if(!ok){gate.innerHTML='حسابك غير معتمد كبائع بعد. <a href="marketplace-onboarding.html">إرسال/متابعة الطلب</a>';return}gate.innerHTML='✅ حساب بائع معتمد';panel.style.display='block';const {data:s}=await db.from('shop_businesses').select('*').eq('owner_user_id',me.id).maybeSingle();if(s){store=s;section.value=s.section_key;storeName.value=s.name;location.value=s.location_text||'';image.value=s.image_url||'';desc.value=s.description||''}const {data:c}=await db.from('product_categories').select('id,name').eq('is_active',true).order('sort_order');category.innerHTML=(c||[]).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');loadProducts();loadOrders()}async function saveStore(){const payload={owner_user_id:me.id,section_key:section.value,name:storeName.value.trim(),location_text:location.value.trim(),image_url:image.value.trim()||null,description:desc.value.trim()||null,is_active:true};if(!payload.name)return alert('اكتب اسم المتجر');let r=store?await db.from('shop_businesses').update(payload).eq('id',store.id).select().single():await db.from('shop_businesses').insert(payload).select().single();if(r.error)return alert(r.error.message);store=r.data;alert('تم حفظ المتجر')}async function addProduct(){if(!store)return alert('احفظ المتجر أولاً');const payload={category_id:Number(category.value),name:pname.value.trim(),description:pdesc.value.trim()||null,price:Number(price.value),stock:Number(stock.value||0),image_url:pimage.value.trim()||null,seller_user_id:me.id,business_id:store.id,is_active:true};if(!payload.name||!Number.isFinite(payload.price))return alert('أكمل الاسم والسعر');const {error}=await db.from('products').insert(payload);if(error)return alert(error.message);pname.value=price.value=stock.value=pimage.value=pdesc.value='';loadProducts()}async function loadProducts(){const {data,error}=await db.from('products').select('id,name,price,stock,is_active').eq('seller_user_id',me.id).order('created_at',{ascending:false});products.innerHTML=error?esc(error.message):(data||[]).map(x=>`<div class="row card"><div><b>${esc(x.name)}</b><div class="muted">${Number(x.price).toLocaleString('ar-IQ')} د.ع — مخزون ${x.stock}</div></div><button class="danger" onclick="delP(${x.id})">حذف</button></div>`).join('')||'لا توجد منتجات.'}async function delP(id){if(!confirm('حذف المنتج؟'))return;const {error}=await db.from('products').delete().eq('id',id).eq('seller_user_id',me.id);if(error)alert(error.message);else loadProducts()}async function loadOrders(){const el=document.getElementById('orders');el.innerHTML='جاري التحميل...';const {data,error}=await db.rpc('get_seller_shop_orders');if(error){el.innerHTML='<div class="card">شغّل SHOP-COURIER-INTEGRATION.sql أولاً.<br>'+esc(error.message)+'</div>';return}const arr=Array.isArray(data)?data:[];el.innerHTML=arr.map(o=>{const d=o.delivery;const items=(o.items||[]).map(i=>`${esc(i.name)} × ${i.quantity}${i.option_text?' — '+esc(i.option_text):''}`).join('<br>');let delivery=d?`<div class="delivery"><b>التوصيل: ${esc(DS[d.status]||d.status)}</b></div>`:`<div class="delivery">لم يُطلب مندوب بعد.</div>`;let action='';if(o.order_status!=='cancelled'&&(!d||['cancelled','ready'].includes(d.status))){action=d?.status==='ready'?'<button class="light" disabled>بانتظار مندوب...</button>':`<button class="blue" onclick="requestCourier(${o.order_id})">✅ الطلب جاهز — اطلب مندوب</button>`}return `<div class="card order"><div class="row"><b>طلب #${o.order_id}</b><span class="badge">${esc(o.order_status)}</span></div><div class="items">${items||'لا توجد مواد'}</div><div class="muted">الزبون: ${esc(o.customer_name)} — ${esc(o.phone)}<br>${esc(o.governorate||'')} — ${esc(o.address)}</div><div class="row" style="margin-top:8px"><b>${Number(o.seller_total||0).toLocaleString('ar-IQ')} د.ع</b>${action}</div>${delivery}</div>`}).join('')||'<div class="muted">لا توجد طلبات لمتجرك حالياً.</div>'}async function requestCourier(id){if(!store||!store.location_text)return alert('حدد عنوان المتجر أولاً حتى يعرف المندوب مكان الاستلام.');if(!confirm('تأكيد أن الطلب جاهز للاستلام وطلب مندوب؟'))return;const {error}=await db.rpc('request_shop_courier',{p_order_id:id});if(error)return alert(error.message);alert('تم إرسال طلب التوصيل للمندوبين المعتمدين.');loadOrders()}init();</script></body></html>
