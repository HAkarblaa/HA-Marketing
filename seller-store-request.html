<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>إضافة متجر جديد - HA Marketing</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="ha-seller-store-flow.css?v=20261002-1">
<link rel="stylesheet" href="ha-role-bottom-nav.css?v=20261002-1">
</head>
<body class="ha-ui-final ha-family-shop">
<div class="ha-wrap">
  <div class="ha-top">
    <a class="ha-back" href="seller-dashboard.html">← متجري</a>
    <a class="ha-home" href="shop.html">التسوق</a>
  </div>

  <section class="ha-hero">
    <h1>➕ إضافة متجر جديد</h1>
    <p>بعد اعتمادك كبائع تگدر تضيف أكثر من متجر. كل متجر جديد يبقى مخفي إلى أن يوافق عليه الأدمن الرئيسي.</p>
  </section>

  <section class="ha-card">
    <h2>بيانات المتجر</h2>
    <div class="ha-grid">
      <div>
        <label>قسم المتجر</label>
        <select id="newSection">
          <option value="markets">🛒 الأسواق</option>
          <option value="library">📚 مكتبة</option>
          <option value="printers">🖨️ مطبعة</option>
          <option value="devices">📱 موبايلات</option>
          <option value="home_appliances">💻 الأجهزة الإلكترونية</option>
          <option value="device_accessories">🎧 إكسسوارات</option>
          <option value="clothes">👕 ملابس</option>
          <option value="shoes">👟 أحذية</option>
          <option value="restaurants">🍽️ مطاعم</option>
          <option value="flowers">💐 ورد وهدايا</option>
          <option value="building_materials">🏗️ مواد البناء</option>
        </select>
      </div>
      <div><label>اسم المتجر</label><input id="newName" placeholder="اسم المتجر"></div>
      <div><label>المحافظة</label><select id="newGov"></select></div>
      <div><label>القضاء / الناحية / الحي</label><input id="newArea" placeholder="المنطقة"></div>
      <div class="full"><label>العنوان التفصيلي</label><input id="newAddress" placeholder="الشارع / أقرب نقطة دالة"></div>
      <div class="full">
        <div class="ha-row"><button id="newGpsBtn" type="button" class="ha-gps">📍 تحديد موقع المتجر</button><span id="newGpsStatus" class="ha-badge">اختياري</span></div>
      </div>
      <div class="full"><label>الوصف</label><textarea id="newDesc" placeholder="تفاصيل المتجر"></textarea></div>
      <div class="full">
        <label>صورة المتجر</label>
        <input id="newImage" type="file" accept="image/*">
        <img id="newPreview" class="ha-preview" alt="">
      </div>
    </div>

    <button id="newSubmit" class="ha-submit" type="button">إرسال المتجر للموافقة</button>
    <div id="newStatus" class="ha-status">المتجر لن يظهر للزبائن إلا بعد موافقة الأدمن الرئيسي.</div>
  </section>

  <section class="ha-card">
    <h2>طلبات متاجري</h2>
    <div id="myStoreRequests">جاري التحميل...</div>
  </section>
</div>

<script src="ha-seller-new-store.js?v=20261002-1"></script>
<script src="ha-role-bottom-nav.js?v=20261002-1" defer></script>
</body>
</html>
