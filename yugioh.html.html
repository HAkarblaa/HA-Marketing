<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أوراق يوغي - HA Marketing</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#111}
.wrap{width:94%;max-width:900px;margin:40px auto}
h1{text-align:center;font-size:38px;margin-bottom:8px}
.subtitle{text-align:center;color:#666;margin-bottom:28px}
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.product{background:#fff;border-radius:18px;padding:22px;box-shadow:0 4px 16px rgba(0,0,0,.10);text-align:center}
.icon{font-size:55px;margin-bottom:10px}
.product-image{width:100%;height:260px;object-fit:contain;background:#fafafa;border-radius:14px;margin-bottom:12px}
h2{font-size:25px;margin:8px 0 14px}
.details{line-height:1.9;color:#555;min-height:100px}
.price{font-size:24px;font-weight:bold;margin-top:16px}
.back{display:block;text-align:center;margin-top:30px;text-decoration:none;color:#111;font-size:17px}
@media(max-width:600px){
 .products{grid-template-columns:1fr}
 h1{font-size:30px}
}
</style>
</head>
<body>
<div class="wrap">
<h1>🃏 أوراق يوغي</h1>
<p class="subtitle">المنتجات المتوفرة</p>

<div class="products">
  <div class="product">
    <img class="product-image" src="4.jpg" alt="ستركجر Slifer" onerror="this.onerror=null;this.src='4.png';">
    <h2>ستركجر Slifer</h2>
    <div class="details">
      مجموعة تخص وحش Slifer جاهزة للمبارزة.<br>
      منتج أصلي ورسمي من Konami.
    </div>
    <div class="price">25,000 دينار فقط</div>
  </div>

  <div class="product">
    <img class="product-image" src="5.jpg" alt="ستركجر Obelsk" onerror="this.onerror=null;this.src='5.png';">
    <h2>ستركجر Obelsk</h2>
    <div class="details">
      مجموعة تخص وحش Obslak جاهزة للمبارزة.<br>
      منتج أصلي ورسمي من Konami.
    </div>
    <div class="price">25,000 دينار فقط</div>
  </div>
</div>

<a class="back" href="shop.html">← الرجوع إلى تسوق الآن</a>
</div>
</body>
</html>
