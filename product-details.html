<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تفاصيل المنتج</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll');</script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f5f5f5;color:#111}.wrap{width:94%;max-width:900px;margin:24px auto}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 4px 16px #0001}.hero{width:100%;height:360px;object-fit:contain;background:#fafafa;border-radius:14px}.btn,button{border:0;border-radius:10px;padding:11px 14px;background:#111;color:#fff;text-decoration:none;cursor:pointer}.light{background:#eee;color:#111}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.muted{color:#666;line-height:1.8}.price{font-size:26px;font-weight:bold}.old{text-decoration:line-through;color:#888}.badge{background:#eee;border-radius:999px;padding:6px 10px}.stars{font-size:21px}.review{border-top:1px solid #eee;padding:12px 0}textarea,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:10px;margin:6px 0}.spec{white-space:pre-wrap;line-height:1.9}.qty{width:90px;padding:10px;border:1px solid #ccc;border-radius:10px}</style></head><body><div class="wrap"><div class="row"><a id="back" class="btn light" href="shop.html">← رجوع</a><a class="btn" href="cart.html">🛒 السلة</a></div><div id="box" class="card">جاري التحميل...</div><div class="card"><h2>⭐ التقييمات</h2><div id="reviewForm"></div><div id="reviews">جاري التحميل...</div></div></div><script>
const id=Number(new URLSearchParams(location.search).get('id')),category=new URLSearchParams(location.search).get('category')||'';let product=null,me=null,cart=JSON.parse(localStorage.getItem('ha_cart')||'[]');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function eff(p){return p.discount_price!=null&&Number(p.discount_price)<Number(p.price)?Number(p.discount_price):Number(p.price)}if(category)back.href='store.html?category='+encodeURIComponent(category);
async function load(){const {data:u}=await db.auth.getUser();me=u?.user||null;const {data:p,error}=await db.from('products').select('*').eq('id',id).eq('is_active',true).maybeSingle();if(error||!p){box.innerHTML='المنتج غير متوفر.';return}product=p;document.title=p.name+' - HA Marketing';let opts=[];try{opts=Array.isArray(p.options_json)?p.options_json:JSON.parse(p.options_json||'[]')}catch{}const price=eff(p),sale=price<Number(p.price),min=Math.max(1,Number(p.min_order_qty||1));box.innerHTML=`${p.image_url?`<img class="hero" src="${esc(p.image_url)}" alt="">`:''}<h1>${esc(p.name)}</h1><div class="muted">${esc(p.description||'')}</div>${p.specifications?`<h3>المواصفات</h3><div class="spec">${esc(p.specifications)}</div>`:''}<div class="row"><div>${sale?`<div class="old">${Number(p.price).toLocaleString('ar-IQ')} د.ع</div>`:''}<div class="price">${price.toLocaleString('ar-IQ')} د.ع</div></div><span class="badge">المتوفر: ${p.stock}</span></div>${opts.length?`<label>الخيار</label><select id="option"><option value="">اختر...</option>${opts.map(o=>`<option value="${esc(typeof o==='string'?o:(o.name||o.label||''))}">${esc(typeof o==='string'?o:(o.name||o.label||''))}</option>`).join('')}</select>`:''}<div class="row" style="margin-top:12px"><input id="qty" class="qty" type="number" min="${min}" max="${p.stock}" value="${min}"><button onclick="add()" ${p.stock<min?'disabled':''}>إضافة إلى السلة</button></div>${min>1?`<div class="muted">الحد الأدنى للطلب: ${min}</div>`:''}`;await loadReviews()}
function add(){const qty=Math.max(Number(product.min_order_qty||1),Number(document.getElementById('qty')?.value||1)),opt=document.getElementById('option')?.value||'';if(qty>product.stock){alert('الكمية أكبر من المخزون');return}const x=cart.find(i=>i.product_id===id&&String(i.option_text||'')===opt);if(x){if(x.qty+qty>product.stock){alert('الكمية أكبر من المخزون');return}x.qty+=qty}else cart.push({product_id:id,name:product.name,qty,option_text:opt});localStorage.setItem('ha_cart',JSON.stringify(cart));alert('تمت الإضافة للسلة')}
async function loadReviews(){const {data,error}=await db.from('shop_product_reviews').select('rating,comment,created_at,user_id').eq('product_id',id).eq('is_visible',true).order('created_at',{ascending:false});if(error){reviews.textContent='تعذر تحميل التقييمات';return}const arr=data||[],avg=arr.length?(arr.reduce((s,x)=>s+Number(x.rating),0)/arr.length).toFixed(1):'—';reviews.innerHTML=`<div class="row"><strong>متوسط التقييم: ${avg} / 5</strong><span>${arr.length} تقييم</span></div>`+arr.map(r=>`<div class="review"><div class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div><div>${esc(r.comment||'')}</div><div class="muted">${new Date(r.created_at).toLocaleDateString('ar-IQ')}</div></div>`).join('')||'<div class="muted">لا توجد تقييمات بعد.</div>';reviewForm.innerHTML=me?`<h3>أضف تقييمك</h3><select id="rating"><option value="5">5 نجوم</option><option value="4">4 نجوم</option><option value="3">3 نجوم</option><option value="2">نجمتان</option><option value="1">نجمة</option></select><textarea id="comment" placeholder="تعليقك (اختياري)"></textarea><button onclick="saveReview()">حفظ التقييم</button>`:'<div class="muted">سجل الدخول حتى تضيف تقييمك.</div>'}
async function saveReview(){if(!me)return;const payload={user_id:me.id,product_id:id,rating:Number(rating.value),comment:comment.value.trim()||null,updated_at:new Date().toISOString()};const {error}=await db.from('shop_product_reviews').upsert(payload,{onConflict:'user_id,product_id'});if(error)alert(error.message);else loadReviews()}load();
</script></body></html>
