<meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة التقييمات - HA Marketing</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f3f6f8;color:#15304b}.wrap{width:min(1050px,95%);margin:22px auto}.top{display:flex;justify-content:space-between;gap:10px}.top a{background:#fff;color:#087f61;text-decoration:none;padding:10px 14px;border-radius:12px}.card{background:#fff;border-radius:18px;padding:16px;margin:13px 0;box-shadow:0 8px 24px #15304b0c}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.stars{color:#f6aa00}.muted{color:#657684}.danger{border:0;border-radius:10px;background:#b72d45;color:#fff;padding:9px 12px;cursor:pointer}</style></head><body>
<div class="wrap"><div class="top"><a href="admin-panel.html">← لوحة الإدارة</a><h1>⭐ إدارة التقييمات</h1><a href="index.html">الرئيسية</a></div><div id="gate" class="card">جاري التحقق...</div><div id="list"></div></div>
<script>
const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{const {data:{session}}=await db.auth.getSession();if(!session){location.href='login.html';return}const {data:ok}=await db.rpc('is_super_admin');if(!ok){gate.textContent='هذه الصفحة للأدمن الرئيسي فقط.';return}gate.textContent='✅ صلاحية الأدمن الرئيسي فعالة';load()})();
async function load(){const {data,error}=await db.from('app_ratings').select('*').order('created_at',{ascending:false}).limit(300);if(error){list.innerHTML='<div class="card">'+esc(error.message)+'</div>';return}list.innerHTML=(data||[]).map(x=>`<div class="card"><div class="row"><b>${esc(x.target_type)} — ${esc(x.target_key)}</b><span class="stars">${'★'.repeat(x.rating)}${'☆'.repeat(5-x.rating)}</span></div><div>${esc(x.comment||'بدون تعليق')}</div><div class="row"><small class="muted">${new Date(x.created_at).toLocaleString('ar-IQ')}</small><button class="danger" onclick="del(${x.id})">حذف التقييم</button></div></div>`).join('')||'<div class="card">لا توجد تقييمات بعد.</div>'}
async function del(id){if(!confirm('حذف هذا التقييم؟'))return;const {error}=await db.from('app_ratings').delete().eq('id',id);if(error)return alert(error.message);load()}
</script></body></html>
