<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05080b">
<title>الطلبات - HA Marketing</title>
<style>
:root{--bg:#020406;--panel:#0b1117;--gold:#efbd5e;--text:#f7f7f7;--muted:#a8adb4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0,rgba(239,189,94,.10),transparent 28%),linear-gradient(180deg,#020507,#05080b 45%,#020406);color:var(--text);font-family:"Segoe UI",Tahoma,Arial,sans-serif;padding-bottom:92px}
.wrap{width:min(760px,94%);margin:auto;padding:18px 0 28px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.top a{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;text-decoration:none;color:var(--gold);border:1px solid rgba(239,189,94,.55);background:#090e13}
.brand{text-align:center}.brand b{display:block;color:var(--gold);font-size:14px}.brand small{color:var(--muted);font-size:10px}
.hero{text-align:center;padding:18px 10px 22px}.hero .ico{font-size:48px}.hero h1{margin:7px 0;color:#f5ca72}.hero p{margin:0;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{min-height:145px;padding:16px 10px;border-radius:20px;text-decoration:none;color:#fff;background:linear-gradient(145deg,#101820,#060a0e);border:1px solid rgba(239,189,94,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.card .ico{font-size:34px;margin-bottom:8px}.card b{color:#f2c66c;font-size:15px}.card small{color:var(--muted);font-size:10px;line-height:1.5;margin-top:5px}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:1900;padding:5px 5px max(6px,env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(6,9,12,.98),#020406);border-top:1px solid rgba(239,189,94,.62);box-shadow:0 -10px 30px rgba(0,0,0,.58)}
.bottom-inner{width:min(760px,100%);margin:auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.bottom-link{min-width:0;min-height:54px;padding:5px 2px;border:1px solid rgba(239,189,94,.30);border-radius:12px;background:linear-gradient(180deg,#10171d,#060a0d);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#f5f5f5;text-decoration:none;font-size:9px;font-weight:800;text-align:center}
.bottom-link .bi{font-size:20px;line-height:1}.bottom-link.active{border-color:#f0bd5d;background:linear-gradient(145deg,#2a2112,#11100c);color:#f5ca72}
@media(max-width:420px){.grid{gap:7px}.card{min-height:130px;padding:12px 7px}.bottom-inner{gap:3px}.bottom-link{min-height:50px;font-size:8px}.bottom-link .bi{font-size:18px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a href="index.html">→</a>
    <div class="brand"><b>HA Marketing</b><small>مركز الطلبات</small></div>
    <a href="index.html">⌂</a>
  </div>

  <section class="hero">
    <div class="ico">📋</div>
    <h1>الطلبات</h1>
    <p>اختر نوع الطلب الذي تريد متابعته</p>
  </section>

  <main class="grid">
    <a class="card" href="shop-orders.html"><span class="ico">🛍️</span><b>طلبات التسوق</b><small>المشتريات والطلبات من المتاجر</small></a>
    <a class="card" href="service-orders.html"><span class="ico">🛠️</span><b>طلبات الخدمات</b><small>الخدمات والحجوزات ومتابعة الحالة</small></a>
    <a class="card" href="taxi-delivery.html"><span class="ico">🚕</span><b>طلبات النقل</b><small>تكسي، تكتك ومندوب</small></a>
    <a class="card" href="work-center.html"><span class="ico">🧰</span><b>طلبات العمل</b><small>طلبات وصلاحيات البائع ومقدم الخدمة والسائق</small></a>
  </main>
</div>

<nav class="bottom-nav">
  <div class="bottom-inner">
    <a class="bottom-link" href="index.html"><span class="bi">⌂</span><span>الرئيسية</span></a>
    <a class="bottom-link" href="notifications-center.html"><span class="bi">🔔</span><span>الإشعارات</span></a>
    <a class="bottom-link active" href="orders-center.html"><span class="bi">📋</span><span>الطلبات</span></a>
    <a class="bottom-link" href="account.html"><span class="bi">👤</span><span>حسابي</span></a>
    <a class="bottom-link" href="call-us.html"><span class="bi">☎</span><span>اتصل بنا</span></a>
  </div>
</nav>
</body>
</html>
