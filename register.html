<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب - HA Marketing</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{font-family:Arial;background:#f5f5f5;margin:0}.box{width:92%;max-width:480px;margin:40px auto;background:#fff;padding:24px;border-radius:16px}input,button,a{width:100%;box-sizing:border-box;padding:13px;margin:7px 0;border-radius:9px;font-size:16px}input{border:1px solid #ccc}button{border:0;background:#111;color:#fff}a{display:block;text-align:center;text-decoration:none;background:#eee;color:#111}</style></head>
<body><div class="box"><h1>إنشاء حساب</h1><input id="username" placeholder="المعرف"><input id="phone" type="tel" placeholder="رقم الهاتف"><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="password" type="password" minlength="6" placeholder="الرقم السري"><button onclick="register()">إنشاء الحساب</button><a href="login.html">عندي حساب</a></div>
<script>const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll');async function register(){if(password.value.length<6){alert('الرقم السري لازم يكون 6 أحرف على الأقل');return;}const {error}=await db.auth.signUp({email:email.value.trim(),password:password.value,options:{data:{username:username.value.trim(),phone:phone.value.trim()}}});if(error)alert(error.message);else{alert('تم إنشاء الحساب. إذا طلب تأكيد البريد افتح الرسالة ثم سجل الدخول.');location.href='login.html';}}</script></body></html>
