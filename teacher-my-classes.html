<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صفوفي - HA Marketing</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#06090c;color:#fff;min-height:100vh}.wrap{width:min(94%,950px);margin:16px auto 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.back,.btn{padding:10px 13px;border-radius:12px;border:1px solid #3b4853;background:#12181d;color:#fff;text-decoration:none;cursor:pointer}.hero{text-align:center;padding:18px;margin:16px 0;border:1px solid #6f5724;border-radius:22px;background:linear-gradient(145deg,#15140f,#0a0d10)}.hero h1{margin:0;color:#f0c86b}.hero p{margin:7px 0 0;color:#aeb7bf}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.class-card{border:1px solid #35434e;border-radius:20px;padding:15px;background:linear-gradient(145deg,#11181d,#080c0f)}.class-card h2{margin:0 0 8px;color:#f0c86b;font-size:19px}.meta{color:#aeb7bf;font-size:12px;line-height:1.7}.open{display:flex;align-items:center;justify-content:center;min-height:46px;margin-top:12px;border-radius:13px;border:1px solid #966f25;background:#18130b;color:#f0c86b;text-decoration:none;font-weight:800}.empty{grid-column:1/-1;text-align:center;color:#aeb7bf;padding:30px;border:1px solid #2f3c47;border-radius:18px}.new{display:flex;justify-content:center;margin:14px 0}.new a{border-color:#8d6a25;color:#f0c86b}@media(max-width:620px){.grid{grid-template-columns:1fr}}

<script>
const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
