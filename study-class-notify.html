<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تبليغ الصف - HA Marketing</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial;background:#06090c;color:#fff;min-height:100vh}
.wrap{width:min(94%,680px);margin:16px auto 50px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.back{padding:10px 13px;border-radius:12px;border:1px solid #3a4752;background:#12181d;color:#fff;text-decoration:none}
.card{margin-top:15px;padding:16px;border-radius:20px;border:1px solid #3a4752;background:linear-gradient(145deg,#11181d,#080c0f)}
h1{margin:0 0 8px;color:#f0c86b;font-size:24px}
.muted{color:#aeb7bf;line-height:1.7;font-size:13px}
label{display:block;margin:15px 0 6px;font-weight:800;color:#e6edf2}
input,textarea{width:100%;border:1px solid #3b4a56;background:#0a1015;color:#fff;border-radius:13px;padding:13px;font:inherit}
textarea{min-height:130px;resize:vertical}
.send{width:100%;min-height:52px;margin-top:16px;border-radius:14px;border:1px solid #967026;background:#18130b;color:#f0c86b;font:inherit;font-weight:900;cursor:pointer}
.send:disabled{opacity:.55;cursor:not-allowed}
.status{margin-top:12px;padding:12px;border-radius:13px;background:#0a1015;border:1px solid #2d3942;color:#aeb7bf;white-space:pre-wrap}
.count{display:inline-block;margin-top:9px;padding:5px 10px;border-radius:999px;background:#14351f;color:#83e6a0;font-size:12px}
</style>
<script src="ha-theme.js"></script>
<link rel="stylesheet" href="ha-theme.css">
</head>
<body>
<div class="wrap">
  <div class="top">
    <a id="backLink" class="back" href="teacher-my-classes.html">← الصف</a>
    <b>HA Marketing</b>
    <span></span>
  </div>

  <div class="card">
    <h1>🔔 إرسال تبليغ للصف</h1>
    <div id="classInfo" class="muted">جاري تحميل بيانات الصف...</div>
    <span id="studentCount" class="count" style="display:none"></span>

    <label>عنوان التبليغ</label>
    <input id="title" maxlength="120" placeholder="مثال: امتحان يوم الأحد">

    <label>نص التبليغ</label>
    <textarea id="message" maxlength="1000" placeholder="اكتب التبليغ الذي تريد إرساله لطلاب هذا الصف فقط"></textarea>

    <button id="sendBtn" class="send" type="button">🔔 إرسال للطلاب</button>
    <div id="status" class="status">جاهز للإرسال.</div>
  </div>
</div>

<script>
const db=supabase.createClient(
  'https://ubayrhtshgtgggxprrek.supabase.co',
  'sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',
  {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}}
);

const classId=Number(new URLSearchParams(location.search).get('class'));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me=null;
let currentClass=null;

async function init(){
  const {data:{session}}=await db.auth.getSession();
  if(!session){location.href='login.html';return}
  me=session.user;

  if(!Number.isInteger(classId)||classId<=0){
    document.getElementById('classInfo').textContent='الصف غير محدد.';
    document.getElementById('sendBtn').disabled=true;
    return;
  }

  document.getElementById('backLink').href='study-class.html?class='+encodeURIComponent(classId);

  const {data:c,error}=await db
    .from('study_classes')
    .select('id,class_name,grade_name,branch,subject,teacher_user_id')
    .eq('id',classId)
    .maybeSingle();

  if(error||!c){
    document.getElementById('classInfo').textContent='تعذر تحميل بيانات الصف.';
    document.getElementById('sendBtn').disabled=true;
    return;
  }

  if(c.teacher_user_id!==me.id){
    document.getElementById('classInfo').textContent='هذه الصفحة خاصة بمدرس الصف فقط.';
    document.getElementById('sendBtn').disabled=true;
    return;
  }

  currentClass=c;
  document.getElementById('classInfo').innerHTML=
    '<b>'+esc(c.class_name)+'</b><br>'+
    esc(c.grade_name||'')+(c.branch?' — '+esc(c.branch):'')+
    (c.subject?'<br>'+esc(c.subject):'');

  const {count}=await db
    .from('study_class_members')
    .select('class_id',{count:'exact',head:true})
    .eq('class_id',classId);

  const countEl=document.getElementById('studentCount');
  countEl.style.display='inline-block';
  countEl.textContent='👨‍🎓 عدد الطلاب المنضمين: '+Number(count||0);
}

document.getElementById('sendBtn').addEventListener('click',async()=>{
  if(!currentClass||!me)return;

  const title=document.getElementById('title').value.trim();
  const message=document.getElementById('message').value.trim();
  const status=document.getElementById('status');
  const btn=document.getElementById('sendBtn');

  if(!title)return alert('اكتب عنوان التبليغ');
  if(!message)return alert('اكتب نص التبليغ');
  if(!confirm('تأكيد إرسال هذا التبليغ فقط للطلاب المنضمين لهذا الصف؟'))return;

  btn.disabled=true;
  btn.textContent='جاري الإرسال...';
  status.textContent='جاري إرسال التبليغ...';

  try{
    const {data,error}=await db.rpc('send_study_class_notification',{
      p_class_id:classId,
      p_title:title,
      p_message:message
    });
    if(error)throw error;

    const sent=(data&&typeof data==='object')?(data.sent??0):0;
    status.textContent='✅ تم إرسال التبليغ بنجاح.\nعدد الطلاب المستلمين: '+sent;
    document.getElementById('title').value='';
    document.getElementById('message').value='';
  }catch(e){
    status.textContent='❌ تعذر الإرسال: '+(e?.message||String(e));
  }finally{
    btn.disabled=false;
    btn.textContent='🔔 إرسال للطلاب';
  }
});

init().catch(e=>{
  document.getElementById('status').textContent='❌ '+(e?.message||String(e));
});
</script>
</body>
</html>
