<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسوق الآن - HA Marketing</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#111}
.wrap{width:94%;max-width:900px;margin:40px auto}
h1{text-align:center;font-size:40px;margin-bottom:10px}
.subtitle{text-align:center;color:#666;font-size:17px;margin-bottom:28px}
.categories{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.category{min-height:190px;background:#fff;border-radius:18px;padding:22px 12px;text-decoration:none;color:#111;box-shadow:0 4px 16px rgba(0,0,0,.10);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.category .icon{font-size:52px;margin-bottom:14px}
.category h2{font-size:25px;margin:0 0 8px}
.category p{font-size:15px;color:#666;margin:0}
.back{display:block;text-align:center;margin-top:30px;text-decoration:none;color:#111;font-size:17px}
@media(max-width:600px){
 h1{font-size:31px}
 .categories{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .category{min-height:155px;padding:14px 8px}
 .category .icon{font-size:42px}
 .category h2{font-size:20px}
 .category p{font-size:13px}
}
</style>
</head>
<body>
<div class="wrap">
<h1>🛒 تسوق الآن</h1>
<p class="subtitle">اختر القسم الذي تريد التسوق منه</p>

<div class="categories">
  <a class="category" href="library.html">
    <div class="icon">📚</div>
    <h2>مكتبة</h2>
    <p>الستيكرات ومنتجات المكتبة</p>
  </a>
  <a class="category" href="building-materials.html">
    <div class="icon">🏗️</div>
    <h2>مواد البناء</h2>
    <p>مواد ومنتجات البناء</p>
  </a>
</div>

<a class="back" href="index.html">← الرجوع إلى الصفحة الرئيسية</a>
</div>
</body>
</html>
