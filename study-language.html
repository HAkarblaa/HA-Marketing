</style></head><body><div class="top"><button onclick="history.back()">←</button><h1>🇬🇧 تعلم الإنجليزية والترجمة</h1></div><main class="wrap"><div class="tabs"><button class="on" onclick="tab('learn',this)">تعلم الإنجليزية</button><button onclick="tab('translate',this)">الترجمة</button></div>
<section id="learn" class="lesson show"><div class="box"><h2>مدرب الإنجليزية</h2><p>اختر مستواك والموضوع، والمساعد يعطيك درساً وتمارين وتصحيحاً.</p><div class="row"><select id="level"><option>مبتدئ</option><option>متوسط</option><option>متقدم</option></select><select id="topic"><option>المحادثة اليومية</option><option>القواعد</option><option>المفردات</option><option>العمل</option><option>السفر</option><option>المدرسة والجامعة</option></select></div><div class="chips"><button onclick="askLearn('اعطني درس اليوم')">درس اليوم</button><button onclick="askLearn('اختبرني 5 أسئلة')">اختبار سريع</button><button onclick="askLearn('اعطني 10 كلمات جديدة مع أمثلة')">مفردات</button><button onclick="askLearn('ابدأ محادثة إنجليزية وصحح أخطائي')">محادثة</button></div><textarea id="learnQ" placeholder="اكتب سؤالاً أو جملة بالإنجليزية حتى أصححها..."></textarea><button class="btn" onclick="learn()">إرسال للمدرب</button></div><div class="box"><h2>النتيجة</h2><div id="learnOut" class="result">جاهز.</div></div></section>
<section id="translate" class="lesson"><div class="box"><h2>المترجم</h2><div class="row"><select id="from"><option>العربية</option><option>الإنجليزية</option><option>الفرنسية</option><option>التركية</option><option>الفارسية</option></select><select id="to"><option>الإنجليزية</option><option>العربية</option><option>الفرنسية</option><option>التركية</option><option>الفارسية</option></select></div><textarea id="txt" placeholder="اكتب النص المراد ترجمته..."></textarea><button class="btn" onclick="translateText()">ترجمة</button></div><div class="box"><h2>الترجمة</h2><div id="transOut" class="result">—</div></div></section></main>
<script>
const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});
function tab(id,b){document.querySelectorAll('.lesson').forEach(x=>x.classList.remove('show'));document.getElementById(id).classList.add('show');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}
async function ai(prompt,out){const el=document.getElementById(out);el.innerHTML='<span class="loader"></span> جاري العمل...';let {data:{session}}=await db.auth.getSession();if(!session){location.href='login.html?next=study-language.html';return}const body={messages:[{role:'user',content:prompt}]};try{let result=null;const inv=await db.functions.invoke('ai-assistant',{body});if(!inv.error&&inv.data){result=inv.data}else{const c=new AbortController(),t=setTimeout(()=>c.abort(),18000);const r=await fetch('https://ubayrhtshgtgggxprrek.supabase.co/functions/v1/ai-assistant',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':'sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll'},body:JSON.stringify(body),signal:c.signal});clearTimeout(t);result=await r.json().catch(()=>({}));if(!r.ok)throw new Error(result.error||'HTTP '+r.status)}const answer=result?.answer||result?.data?.answer;if(!answer)throw new Error(result?.error||'لم يصل جواب من المساعد');el.textContent=answer}catch(e){console.error(e);el.innerHTML='تعذر تشغيل المساعد من الخادم حالياً.<br><b>تم تجهيز تحديث ai-assistant داخل الحزمة ويحتاج نشره في Supabase Edge Functions.</b>'}}
function askLearn(x){learnQ.value=x;learn()}
function learn(){const q=learnQ.value.trim()||'اعطني درس اليوم';ai(`أنت مدرس لغة إنجليزية للعرب. المستوى: ${level.value}. الموضوع: ${topic.value}. الطلب: ${q}. اشرح بالعربية مع أمثلة إنجليزية وترجمة ونطق تقريبي عند الحاجة، واجعل الدرس عملياً ومختصراً.`,`learnOut`)}
function translateText(){if(!txt.value.trim())return;ai(`ترجم النص التالي من ${from.value} إلى ${to.value}. أعطني الترجمة أولاً ثم شرحاً قصيراً للكلمات الصعبة إن وجدت:\n${txt.value}`,`transOut`)}
</script></body></html>
