<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الإنجليزية والترجمة - HA Marketing</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f5f5;color:#111}.top{background:#000;color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:3}.top button{width:44px;height:44px;border:0;border-radius:10px;background:#fff;font-size:21px}.top h1{font-size:19px;margin:0}.wrap{width:min(900px,94%);margin:20px auto 40px}.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1;border:1px solid #ddd;background:#fff;padding:12px;border-radius:13px;font-weight:700}.tabs button.on{background:#111;color:#fff}.box{background:#fff;border-radius:18px;padding:18px;box-shadow:0 3px 14px #0001;margin-bottom:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.langrow{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}.swap{width:46px;height:46px;border:1px solid #ddd;background:#fff;border-radius:50%;font-size:22px;cursor:pointer}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn.secondary{background:#fff;color:#111;border:1px solid #ccc}.hint{font-size:13px;color:#666;margin-top:6px}textarea,input,select{width:100%;border:1px solid #ccc;border-radius:12px;padding:12px;font:inherit;margin:7px 0}textarea{min-height:130px;resize:vertical}.btn{border:0;background:#111;color:#fff;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}.result{white-space:pre-wrap;line-height:1.8;background:#f8f8f8;border-radius:12px;padding:14px;min-height:60px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chips button{border:1px solid #ddd;background:#fff;border-radius:999px;padding:8px 11px}.lesson{display:none}.lesson.show{display:block}.imagePreview{display:none;width:100%;max-height:340px;object-fit:contain;border-radius:12px;border:1px solid #ddd;margin-top:10px}.ocrStatus{font-size:13px;color:#555;margin-top:8px}.loader{display:inline-block;width:18px;height:18px;border:2px solid #bbb;border-top-color:#111;border-radius:50%;animation:s .7s linear infinite;vertical-align:middle}.err{background:#fff0f0;color:#9b111e;border:1px solid #f0c7cb}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:600px){.row{grid-template-columns:1fr}.langrow{grid-template-columns:1fr auto 1fr}.swap{width:40px;height:40px}}
</style></head><body><div class="top"><button onclick="history.back()">←</button><h1>🇬🇧 تعلم الإنجليزية والترجمة</h1></div><main class="wrap"><div class="tabs"><button class="on" onclick="tab('learn',this)">تعلم الإنجليزية</button><button onclick="tab('translate',this)">الترجمة</button></div>
<section id="learn" class="lesson show"><div class="box"><h2>مدرب الإنجليزية</h2><p>اختر مستواك والموضوع، والمساعد يعطيك درساً وتمارين وتصحيحاً.</p><div class="row"><select id="level"><option>مبتدئ</option><option>متوسط</option><option>متقدم</option></select><select id="topic"><option>المحادثة اليومية</option><option>القواعد</option><option>المفردات</option><option>العمل</option><option>السفر</option><option>المدرسة والجامعة</option></select></div><div class="chips"><button onclick="askLearn('اعطني درس اليوم')">درس اليوم</button><button onclick="askLearn('اختبرني 5 أسئلة')">اختبار سريع</button><button onclick="askLearn('اعطني 10 كلمات جديدة مع أمثلة')">مفردات</button><button onclick="askLearn('ابدأ محادثة إنجليزية وصحح أخطائي')">محادثة</button></div><textarea id="learnQ" placeholder="اكتب سؤالاً أو جملة بالإنجليزية حتى أصححها..."></textarea><button class="btn" onclick="learn()">إرسال للمدرب</button></div><div class="box"><h2>النتيجة</h2><div id="learnOut" class="result">جاهز.</div></div></section>
<section id="translate" class="lesson"><div class="box"><h2>المترجم متعدد اللغات</h2><div class="langrow"><select id="fromLang"><option value="auto">تحديد تلقائي</option><option>العربية</option><option>الإنجليزية</option><option>الفارسية</option><option>التركية</option><option>الفرنسية</option><option>الألمانية</option><option>الإسبانية</option><option>الإيطالية</option><option>الروسية</option><option>الكردية</option><option>الأردية</option><option>الصينية</option><option>اليابانية</option><option>الكورية</option><option>الهندية</option></select><button class="swap" type="button" title="تبديل اللغتين" onclick="swapLanguages()">⇄</button><select id="toLang"><option>الإنجليزية</option><option>العربية</option><option>الفارسية</option><option>التركية</option><option>الفرنسية</option><option>الألمانية</option><option>الإسبانية</option><option>الإيطالية</option><option>الروسية</option><option>الكردية</option><option>الأردية</option><option>الصينية</option><option>اليابانية</option><option>الكورية</option><option>الهندية</option></select></div><textarea id="translationText" placeholder="اكتب أو الصق النص المراد ترجمته..."></textarea><div class="actions"><button class="btn" id="translateBtn" onclick="translateText()">ترجمة</button><button class="btn secondary" onclick="copyTranslation()">نسخ الترجمة</button><button class="btn secondary" onclick="clearTranslation()">مسح</button></div><div class="hint">إذا كانت لغة النص غير معروفة، اترك المصدر على «تحديد تلقائي».</div></div><div class="box"><h2>الترجمة</h2><div id="transOut" class="result">—</div></div></section></main>
<script>
const SUPA_URL='https://ubayrhtshgtgggxprrek.supabase.co';
const SUPA_KEY='sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll';
const db=supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});
function tab(id,b){document.querySelectorAll('.lesson').forEach(x=>x.classList.remove('show'));document.getElementById(id).classList.add('show');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}
const AI_URL=SUPA_URL+'/functions/v1/ai-assistant';

async function getAccessToken(){
  try{
    const {data}=await db.auth.getSession();
    return data?.session?.access_token||'';
  }catch(_e){return ''}
}

function requestAIWithXHR(body,token){
  return new Promise((resolve,reject)=>{
    try{
      const xhr=new XMLHttpRequest();
      xhr.open('POST',AI_URL,true);
      xhr.timeout=45000;
      xhr.setRequestHeader('Content-Type','application/json');
      xhr.setRequestHeader('apikey',SUPA_KEY);
      if(token) xhr.setRequestHeader('Authorization','Bearer '+token);
      xhr.onreadystatechange=()=>{
        if(xhr.readyState!==4)return;
        let data={};
        try{data=JSON.parse(xhr.responseText||'{}')}catch(_e){}
        if(xhr.status>=200&&xhr.status<300){
          if(data?.answer)return resolve(data.answer);
          return reject(new Error(data?.error||'لم يصل جواب من المساعد'));
        }
        reject(new Error(data?.error||data?.message||('خطأ من الخادم ('+xhr.status+')')));
      };
      xhr.onerror=()=>reject(new Error('تعذر الاتصال بخادم الترجمة من داخل التطبيق'));
      xhr.ontimeout=()=>reject(new Error('انتهت مهلة الاتصال بخادم الترجمة'));
      xhr.send(JSON.stringify(body));
    }catch(e){reject(e)}
  });
}

async function callAI(prompt){
  const body={message:prompt};

  // الطريقة الأساسية: عميل Supabase نفسه. هذه الطريقة أنسب للموقع والتطبيق
  // لأنها تستخدم إعدادات المشروع الحالية بدون بناء الطلب يدوياً.
  try{
    const {data,error}=await db.functions.invoke('ai-assistant',{body});
    if(error) throw error;
    if(data?.error) throw new Error(data.error);
    if(data?.answer) return data.answer;
    throw new Error('لم يصل جواب من المساعد');
  }catch(invokeError){
    console.warn('Supabase invoke failed, trying direct request',invokeError);
  }

  // احتياط: اتصال مباشر بمفتاح المشروع فقط. Verify JWT للدالة مطفأ.
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),45000);
  try{
    const res=await fetch(AI_URL,{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'apikey':SUPA_KEY,
        'Authorization':'Bearer '+SUPA_KEY
      },
      body:JSON.stringify(body),
      cache:'no-store',
      signal:controller.signal
    });
    let data={};
    try{data=await res.json()}catch(_e){}
    if(!res.ok) throw new Error(data?.error||data?.message||('خطأ من الخادم ('+res.status+')'));
    if(!data?.answer) throw new Error('لم يصل جواب من المساعد');
    return data.answer;
  }catch(e){
    if(e?.name==='AbortError') throw new Error('انتهت مهلة الاتصال بخادم الترجمة');
    throw new Error(e?.message||'تعذر الاتصال بخادم الترجمة');
  }finally{clearTimeout(timer)}
}
async function ai(prompt,outId){const el=document.getElementById(outId);el.classList.remove('err');el.innerHTML='<span class="loader"></span> جاري العمل...';try{el.textContent=await callAI(prompt)}catch(e){console.error(e);el.classList.add('err');if(e?.name==='AbortError'){el.textContent='انتهت مهلة الاتصال. جرّب مرة ثانية.';return}el.textContent='تعذر تشغيل الترجمة: '+(e?.message||'خطأ غير معروف')}}
function askLearn(x){document.getElementById('learnQ').value=x;learn()}
function learn(){const q=document.getElementById('learnQ').value.trim()||'اعطني درس اليوم';ai(`أنت مدرس لغة إنجليزية للعرب. المستوى: ${document.getElementById('level').value}. الموضوع: ${document.getElementById('topic').value}. الطلب: ${q}. اشرح بالعربية مع أمثلة إنجليزية وترجمة ونطق تقريبي عند الحاجة، واجعل الدرس عملياً ومختصراً.`,'learnOut')}
async function translateText(){const text=document.getElementById('translationText').value.trim();if(!text){document.getElementById('transOut').textContent='اكتب النص أولاً.';return}const source=document.getElementById('fromLang').value==='auto'?'حدّد لغة النص تلقائياً':`لغة المصدر هي ${document.getElementById('fromLang').value}`;const target=document.getElementById('toLang').value;await ai(`${source}. ترجم النص التالي إلى ${target}. أرجع الترجمة فقط دون شرح أو مقدمة، وحافظ على الأسماء والأرقام وترتيب الأسطر قدر الإمكان:\n${text}`,'transOut')}
function swapLanguages(){const from=document.getElementById('fromLang'),to=document.getElementById('toLang');if(from.value==='auto'){from.value=to.value;to.value=from.value==='العربية'?'الإنجليزية':'العربية';return}const x=from.value;from.value=to.value;to.value=x}
async function copyTranslation(){const t=document.getElementById('transOut').textContent.trim();if(!t||t==='—')return;try{await navigator.clipboard.writeText(t)}catch(_e){const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove()}}
function clearTranslation(){document.getElementById('translationText').value='';document.getElementById('transOut').textContent='—';document.getElementById('transOut').classList.remove('err');document.getElementById('translationText').focus()}
</script></body></html>
