<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>واجهة المدرس - HA Marketing</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#070a0d;color:#fff;min-height:100vh}.wrap{width:min(94%,900px);margin:16px auto 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.back,.btn,button{border:1px solid #3b4853;border-radius:12px;background:#12181d;color:#fff;padding:10px 13px;text-decoration:none;font:inherit;cursor:pointer}.btn.gold,button.gold{border-color:#9a7326;color:#f0c86b;background:#19140c}h1{text-align:center;color:#f0c86b}.box{background:linear-gradient(145deg,#11181d,#080c0f);border:1px solid #36434e;border-radius:20px;padding:15px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}input,select,textarea{width:100%;padding:11px;border-radius:11px;border:1px solid #3b4a56;background:#0a0f13;color:#fff;font:inherit}textarea{min-height:82px}.full{grid-column:1/-1}.status{padding:12px;border-radius:12px;background:#0d1317;color:#aeb7bf;margin:10px 0}.class{border:1px solid #35434e;border-radius:16px;padding:13px;margin:10px 0;background:#0b1115}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.invite{display:flex;gap:7px;margin-top:10px}.invite input{flex:1}.invite button{flex:none}.pending{color:#f0c86b}.ok{color:#7de19c}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.invite{flex-direction:column}}</style><script src="ha-theme.js"></script><link rel="stylesheet" href="ha-theme.css">
<link rel="stylesheet" href="ha-premium-blue-v2.css?v=20260926-1">
</head><body><div class="wrap"><div class="top"><a class="back" href="courses.html">← الدورات</a><b>HA Marketing</b><span></span></div><h1>👨‍🏫 واجهة المدرس</h1><div id="gate" class="status">جاري التحقق...</div>
<section id="profileBox" class="box" hidden><h2>بيانات المدرس</h2><div class="grid"><input id="displayName" placeholder="اسم المدرس"><input id="teacherSubject" placeholder="المادة"><input id="teacherImage" class="full" placeholder="رابط الصورة (اختياري)"><textarea id="teacherBio" class="full" placeholder="نبذة مختصرة"></textarea><button class="gold full" onclick="saveTeacherProfile()">حفظ وإرسال للمراجعة</button></div></section>
<section id="manage" hidden><div class="box"><h2>➕ إنشاء كلاس</h2><div class="grid"><select id="classMode"><option value="online">أونلاين</option><option value="inperson">حضوري</option><option value="both">كلاهما</option></select><select id="classGrade"><option value="primary1">الأول الابتدائي</option><option value="primary2">الثاني الابتدائي</option><option value="primary3">الثالث الابتدائي</option><option value="primary4">الرابع الابتدائي</option><option value="primary5">الخامس الابتدائي</option><option value="primary6">السادس الابتدائي</option><option value="middle1">الأول المتوسط</option><option value="middle2">الثاني المتوسط</option><option value="middle3">الثالث المتوسط</option><option value="prep4">الرابع الإعدادي</option><option value="prep5">الخامس الإعدادي</option><option value="prep6">السادس الإعدادي</option></select><select id="classBranch"><option value="">بدون فرع</option><option>علمي</option><option>أدبي</option><option>مهني</option></select><input id="className" placeholder="اسم الكلاس"><input id="classSubject" placeholder="المادة"><input id="onlineUrl" placeholder="رابط الأونلاين (اختياري)"><input id="locationText" placeholder="مكان الحضور (اختياري)"><textarea id="classDesc" class="full" placeholder="وصف الكلاس"></textarea><button class="gold full" onclick="createClass()">إنشاء الكلاس</button></div></div><div class="box"><h2>كلاساتي وإرسال الدعوات</h2><div id="classes">جاري التحميل...</div></div></section></div>
<script>const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});let me=null,profile=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const G={primary1:'الأول الابتدائي',primary2:'الثاني الابتدائي',primary3:'الثالث الابتدائي',primary4:'الرابع الابتدائي',primary5:'الخامس الابتدائي',primary6:'السادس الابتدائي',middle1:'الأول المتوسط',middle2:'الثاني المتوسط',middle3:'الثالث المتوسط',prep4:'الرابع الإعدادي',prep5:'الخامس الإعدادي',prep6:'السادس الإعدادي'};
async function init(){const {data:{session}}=await db.auth.getSession();if(!session)return location.href='login.html';me=session.user;const {data,error}=await db.from('study_teachers').select('*').eq('user_id',me.id).maybeSingle();if(error){gate.textContent=error.message;return}profile=data||null;if(!profile){gate.textContent='سجل بياناتك كمدرس أولاً، وبعد موافقة الإدارة تقدر تنشئ الكلاسات وترسل الدعوات.';profileBox.hidden=false;return}displayName.value=profile.display_name||'';teacherSubject.value=profile.subject||'';teacherImage.value=profile.image_url||'';teacherBio.value=profile.bio||'';profileBox.hidden=false;if(!profile.is_approved||!profile.is_active){gate.innerHTML='<span class="pending">⏳ حساب المدرس بانتظار موافقة الإدارة.</span>';return}gate.innerHTML='<span class="ok">✅ حساب مدرس معتمد — تقدر تنشئ كلاسات وترسل دعوات.</span>';manage.hidden=false;loadClasses()}
async function saveTeacherProfile(){if(!me)return;const payload={user_id:me.id,display_name:displayName.value.trim(),subject:teacherSubject.value.trim()||null,image_url:teacherImage.value.trim()||null,bio:teacherBio.value.trim()||null};if(!payload.display_name)return alert('اكتب اسم المدرس');const {error}=await db.from('study_teachers').upsert(payload,{onConflict:'user_id'});if(error)return alert(error.message);alert('تم حفظ البيانات وإرسالها للمراجعة');init()}
async function createClass(){if(!profile?.is_approved)return alert('يجب اعتماد حساب المدرس أولاً');const grade=classGrade.value;const payload={teacher_user_id:me.id,mode:classMode.value,grade_key:grade,grade_name:G[grade]||grade,branch:grade.startsWith('prep')?(classBranch.value||null):null,class_name:className.value.trim(),subject:classSubject.value.trim()||profile.subject||null,online_url:onlineUrl.value.trim()||null,location_text:locationText.value.trim()||null,description:classDesc.value.trim()||null,is_active:true};if(!payload.class_name)return alert('اكتب اسم الكلاس');const {error}=await db.from('study_classes').insert(payload);if(error)return alert(error.message);className.value='';classSubject.value='';onlineUrl.value='';locationText.value='';classDesc.value='';loadClasses()}
async function loadClasses(){const {data,error}=await db.from('study_classes').select('*').eq('teacher_user_id',me.id).order('created_at',{ascending:false});if(error){classes.innerHTML=esc(error.message);return}classes.innerHTML=(data||[]).map(c=>`<div class="class"><div class="row"><div><b>${esc(c.class_name)}</b><div style="color:#aeb7bf;font-size:12px;margin-top:4px">${esc(G[c.grade_key]||c.grade_name)}${c.branch?' • '+esc(c.branch):''} • ${c.mode==='online'?'أونلاين':c.mode==='inperson'?'حضوري':'كلاهما'}</div></div><a class="btn" href="study-class.html?class=${c.id}">فتح</a></div><div class="invite"><input id="invite_${c.id}" type="email" placeholder="إيميل الطالب"><button class="gold" onclick="sendInvite(${c.id})">إرسال دعوة</button></div><div id="invStatus_${c.id}" style="font-size:11px;color:#aeb7bf;margin-top:6px"></div></div>`).join('')||'<div class="status">ما عندك كلاسات بعد.</div>'}
async function sendInvite(classId){const el=document.getElementById('invite_'+classId);const email=(el.value||'').trim().toLowerCase();if(!email)return alert('اكتب إيميل الطالب');const {data,error}=await db.rpc('send_study_class_invite',{p_class_id:classId,p_email:email});const st=document.getElementById('invStatus_'+classId);if(error){st.textContent='❌ '+error.message;return}st.textContent='✅ تم إرسال الدعوة إلى '+email;el.value=''}init();</script></body></html>
