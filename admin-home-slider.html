<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة صور الرئيسية - HA Marketing</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f4f4f4;font-family:Arial,Tahoma,sans-serif;color:#111}.top{background:#050505;color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}.top a{background:#fff;color:#111;text-decoration:none;border-radius:10px;padding:9px 13px}.wrap{width:min(1050px,94%);margin:22px auto}.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 4px 18px #0001;margin-bottom:14px}.card h1{margin:0 0 7px}.muted{color:#666;font-size:13px;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.slot{border:1px solid #ddd;border-radius:16px;padding:12px;background:#fafafa}.slot b{display:block;margin-bottom:9px}.preview{width:100%;aspect-ratio:16/7;object-fit:cover;border-radius:12px;background:#151515;margin-bottom:9px}.slot input{width:100%;padding:10px;border:1px solid #ccc;border-radius:9px;margin:5px 0}.actions{display:flex;gap:7px;margin-top:7px}.btn{border:0;border-radius:10px;padding:10px 12px;background:#111;color:#fff;font-weight:700;cursor:pointer}.btn.alt{background:#eee;color:#111}.status{white-space:pre-wrap;background:#f3f3f3;border-radius:10px;padding:11px;margin-top:12px}.gate{padding:16px;background:#fff3cd;border-radius:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}.preview{aspect-ratio:16/6.5}}
</style></head><body><div class="top"><b>🖼️ إدارة صور الواجهة الرئيسية</b><a href="admin-panel.html">رجوع</a></div><div class="wrap"><div id="gate" class="gate">جاري التحقق من صلاحية الأدمن الرئيسي...</div><div id="app" style="display:none"><div class="card"><h1>صور الصفحة الرئيسية</h1><div class="muted">خمس صور تتبدل تلقائياً للمستخدمين بدون أسهم. هذه الإدارة متاحة للـ Super Admin الرئيسي فقط.</div></div><div class="card"><div class="grid">
<div class="slot"><b>الصورة 1 - التسوق</b><img class="preview" id="p1" alt="الصورة 1"><input id="u1" type="url" placeholder="رابط الصورة (اختياري)"><input id="f1" type="file" accept="image/*"><div class="actions"><button class="btn" onclick="save(1,this)">حفظ / تبديل</button><button class="btn alt" onclick="hideSlide(1)">إخفاء</button></div></div>
<div class="slot"><b>الصورة 2 - النقل والتوصيل</b><img class="preview" id="p2" alt="الصورة 2"><input id="u2" type="url" placeholder="رابط الصورة (اختياري)"><input id="f2" type="file" accept="image/*"><div class="actions"><button class="btn" onclick="save(2,this)">حفظ / تبديل</button><button class="btn alt" onclick="hideSlide(2)">إخفاء</button></div></div>
<div class="slot"><b>الصورة 3 - الترفيه</b><img class="preview" id="p3" alt="الصورة 3"><input id="u3" type="url" placeholder="رابط الصورة (اختياري)"><input id="f3" type="file" accept="image/*"><div class="actions"><button class="btn" onclick="save(3,this)">حفظ / تبديل</button><button class="btn alt" onclick="hideSlide(3)">إخفاء</button></div></div>
<div class="slot"><b>الصورة 4 - الدراسة</b><img class="preview" id="p4" alt="الصورة 4"><input id="u4" type="url" placeholder="رابط الصورة (اختياري)"><input id="f4" type="file" accept="image/*"><div class="actions"><button class="btn" onclick="save(4,this)">حفظ / تبديل</button><button class="btn alt" onclick="hideSlide(4)">إخفاء</button></div></div>
<div class="slot"><b>الصورة 5 - الخدمات</b><img class="preview" id="p5" alt="الصورة 5"><input id="u5" type="url" placeholder="رابط الصورة (اختياري)"><input id="f5" type="file" accept="image/*"><div class="actions"><button class="btn" onclick="save(5,this)">حفظ / تبديل</button><button class="btn alt" onclick="hideSlide(5)">إخفاء</button></div></div>
</div><div id="msg" class="status">جاهز.</div></div></div></div><script>
const SB_URL='https://ubayrhtshgtgggxprrek.supabase.co',SB_KEY='sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll';const db=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});let user=null,isSuper=false;
function preview(n,url){const p=document.getElementById('p'+n);if(url){p.src=url;p.style.opacity='1'}else{p.removeAttribute('src');p.style.opacity='.2'}}
for(let n=1;n<=5;n++)document.getElementById('f'+n).addEventListener('change',e=>{const file=e.target.files?.[0];if(!file)return;const x=URL.createObjectURL(file);preview(n,x);document.getElementById('p'+n).onload=()=>URL.revokeObjectURL(x)});
async function init(){const {data:{session}}=await db.auth.getSession();if(!session){gate.textContent='يجب تسجيل الدخول أولاً.';return}user=session.user;try{const r=await db.rpc('is_super_admin');isSuper=!r.error&&r.data===true}catch(e){}if(!isSuper){try{const a=await db.from('app_admins').select('is_super_admin,is_active').eq('user_id',user.id).maybeSingle();isSuper=!!(a.data?.is_active&&a.data?.is_super_admin)}catch(e){}}if(!isSuper){gate.textContent='هذه الصفحة للأدمن الرئيسي فقط.';return}gate.style.display='none';app.style.display='block';await load()}
async function load(){msg.textContent='جاري تحميل الصور...';const {data,error}=await db.from('home_slider_images').select('slot,image_url,is_active').order('slot');if(error){msg.textContent='تعذر تحميل الصور: '+error.message+'\nشغّل ملف HOME-SLIDER-ADMIN.sql مرة واحدة داخل Supabase.';return}const defaults=['images/home-slide-shopping.png','images/home-slide-transport.png','images/home-slide-entertainment.png','images/home-slide-study.png','images/home-slide-services.png'];for(let n=1;n<=5;n++){const row=(data||[]).find(x=>Number(x.slot)===n);const url=row?.image_url||defaults[n-1]||'';document.getElementById('u'+n).value=url;document.getElementById('f'+n).value='';preview(n,url)}msg.textContent='✅ الصور جاهزة للإدارة.'}
async function upload(n,file){if(!file)return null;if(!String(file.type||'').startsWith('image/'))throw new Error('اختر ملف صورة فقط.');if(file.size>6*1024*1024)throw new Error('حجم الصورة يجب أن يكون أقل من 6MB.');const ext=(file.name.split('.').pop()||'jpg').replace(/[^a-zA-Z0-9]/g,'').toLowerCase()||'jpg';const path='slot-'+n+'/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;const {error}=await db.storage.from('home-slider').upload(path,file,{cacheControl:'3600',upsert:false,contentType:file.type||undefined});if(error)throw error;return db.storage.from('home-slider').getPublicUrl(path).data.publicUrl}
async function save(n,btn){if(!isSuper)return;try{btn.disabled=true;msg.textContent='جاري حفظ الصورة '+n+'...';const file=document.getElementById('f'+n).files?.[0];let url=document.getElementById('u'+n).value.trim();if(file)url=await upload(n,file);if(!url)throw new Error('اختر صورة من الجهاز أو ضع رابط صورة.');const {error}=await db.from('home_slider_images').upsert({slot:n,image_url:url,is_active:true,updated_by:user.id,updated_at:new Date().toISOString()},{onConflict:'slot'});if(error)throw error;msg.textContent='✅ تم حفظ الصورة '+n+' وستظهر في الواجهة الرئيسية.';await load()}catch(e){msg.textContent='❌ '+(e?.message||e)}finally{btn.disabled=false}}
async function hideSlide(n){if(!isSuper||!confirm('إخفاء الصورة '+n+' من الواجهة الرئيسية؟'))return;const {error}=await db.from('home_slider_images').update({is_active:false,updated_by:user.id,updated_at:new Date().toISOString()}).eq('slot',n);msg.textContent=error?'❌ '+error.message:'✅ تم إخفاء الصورة '+n;await load()}
init();
</script></body></html>
