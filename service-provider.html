<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تفاصيل مقدم الخدمة</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f5f5}.wrap{width:94%;max-width:900px;margin:20px auto}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 4px 16px #0001}.img{width:100%;max-height:370px;object-fit:cover;border-radius:14px;background:#eee}.btn,button{border:0;background:#111;color:#fff;padding:11px 14px;border-radius:10px;text-decoration:none;cursor:pointer}.light{background:#eee;color:#111}.row{display:flex;gap:9px;align-items:center;justify-content:space-between;flex-wrap:wrap}.muted{color:#666;line-height:1.8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}input,textarea,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px}textarea{min-height:100px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><a class="btn light" href="services.html">← رجوع</a><div id="detail" class="card">جاري التحميل...</div><div class="card"><h2>📩 طلب هذه الخدمة</h2><div id="loginNote" class="muted"></div><form id="form"><div class="grid"><input id="name" required placeholder="الاسم"><input id="phone" required placeholder="رقم الهاتف"><input id="address" required placeholder="العنوان"><input id="date" type="date"><input id="time" placeholder="الوقت المناسب مثل 5 مساءً"><button type="button" class="light" id="loc">📍 تحديد موقعي</button></div><textarea id="details" required placeholder="اكتب تفاصيل الخدمة المطلوبة"></textarea><button type="submit">تأكيد طلب الخدمة</button></form></div><div class="card"><h2>⭐ التقييمات</h2><div id="reviews">جاري التحميل...</div><div class="grid"><select id="rating"><option value="5">5 نجوم</option><option value="4">4 نجوم</option><option value="3">3 نجوم</option><option value="2">2 نجمتان</option><option value="1">1 نجمة</option></select><input id="comment" placeholder="اكتب تعليقك"></div><button id="sendReview">إرسال التقييم</button></div></div><script>
const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,storageKey:'ha-marketing-auth'}});const id=Number(new URLSearchParams(location.search).get('id'));let p=null,me=null,lat=null,lng=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){me=(await db.auth.getUser()).data.user;const {data,error}=await db.from('service_providers').select('*,service_categories(name)').eq('id',id).maybeSingle();if(error||!data){detail.textContent='تعذر تحميل البيانات';return}p=data;detail.innerHTML=`${p.image_url?`<img class="img" src="${esc(p.image_url)}">`:''}<div class="row"><h1>${esc(p.name)}</h1><b>${p.is_verified?'✅ موثّق':''}</b></div><div class="muted">🛠️ ${esc(p.service_categories?.name||'')}<br>📞 ${esc(p.phone||'غير مضاف')}<br>📍 ${esc([p.governorate,p.area,p.address].filter(Boolean).join(' - ')||'غير مضاف')}<br>🕒 ${esc(p.working_hours||'أوقات العمل غير مضافة')}<br>💰 ${p.price_from!=null?'يبدأ من '+Number(p.price_from).toLocaleString('ar-IQ')+' د.ع '+esc(p.price_note||''):'السعر حسب الخدمة'}<br>${p.is_available?'🟢 متوفر حالياً':'🔴 غير متوفر حالياً'}</div><p>${esc(p.description||'')}</p><p><b>المهارات والخدمات:</b><br>${esc(p.skills||'')}</p><div class="row">${p.phone?`<a class="btn" href="tel:${esc(p.phone)}">📞 اتصال</a>`:''}${p.whatsapp?`<a class="btn" href="https://wa.me/${esc(p.whatsapp.replace(/\D/g,''))}" target="_blank">واتساب</a>`:''}${p.map_url?`<a class="btn light" href="${esc(p.map_url)}" target="_blank">🗺️ الموقع</a>`:''}<button id="fav">♡ مفضلة</button></div>`;document.getElementById('fav').onclick=toggleFav;loginNote.textContent=me?'':'يجب تسجيل الدخول حتى ترسل طلباً أو تقييماً.';loadReviews()}loc.onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(x=>{lat=x.coords.latitude;lng=x.coords.longitude;loc.textContent='✅ تم تحديد الموقع'},()=>alert('تعذر تحديد الموقع')):alert('الموقع غير مدعوم');form.onsubmit=async e=>{e.preventDefault();if(!me){location.href='login.html';return}const payload={customer_id:me.id,provider_id:id,category_id:p.category_id,customer_name:name.value.trim(),phone:phone.value.trim(),address:address.value.trim(),details:details.value.trim(),preferred_date:date.value||null,preferred_time:time.value.trim()||null,customer_lat:lat,customer_lng:lng};const {data,error}=await db.from('service_requests').insert(payload).select('id').single();if(error)return alert(error.message);alert('تم إرسال طلب الخدمة بنجاح. رقم الطلب: '+data.id);location.href='service-orders.html'};async function toggleFav(){if(!me)return location.href='login.html';const {data}=await db.from('service_favorites').select('provider_id').eq('user_id',me.id).eq('provider_id',id).maybeSingle();if(data)await db.from('service_favorites').delete().eq('user_id',me.id).eq('provider_id',id);else await db.from('service_favorites').insert({user_id:me.id,provider_id:id});alert(data?'تمت الإزالة من المفضلة':'تمت الإضافة للمفضلة')}async function loadReviews(){const {data}=await db.from('service_reviews').select('rating,comment,created_at').eq('provider_id',id).order('created_at',{ascending:false});reviews.innerHTML=(data||[]).length?(data||[]).map(r=>`<p>${'⭐'.repeat(r.rating)}<br>${esc(r.comment||'')}</p>`).join(''):'لا توجد تقييمات بعد.'}sendReview.onclick=async()=>{if(!me)return location.href='login.html';const {error}=await db.from('service_reviews').upsert({user_id:me.id,provider_id:id,rating:Number(rating.value),comment:comment.value.trim()},{onConflict:'user_id,provider_id'});if(error)return alert(error.message);comment.value='';loadReviews()};load();
</script></body></html>
