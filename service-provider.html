<script id="ha-daylight-boot">(function(){try{var r=document.documentElement;r.setAttribute('data-ha-theme','light');r.style.colorScheme='light';['ha_theme_mode_v2','ha_theme_mode','ha-theme','theme'].forEach(function(k){localStorage.setItem(k,'light')});}catch(e){}})();</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6fbff">
<title>تفاصيل مقدم الخدمة</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="ha-nearby.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f5f5}.wrap{width:94%;max-width:900px;margin:20px auto}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 4px 16px #0001}.img{width:100%;max-height:370px;object-fit:cover;border-radius:14px;background:#eee}.btn,button{border:0;background:#111;color:#fff;padding:11px 14px;border-radius:10px;text-decoration:none;cursor:pointer}.light{background:#eee;color:#111}.row{display:flex;gap:9px;align-items:center;justify-content:space-between;flex-wrap:wrap}.muted{color:#666;line-height:1.8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}input,textarea,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px}textarea{min-height:100px}@media(max-width:600px){.grid{grid-template-columns:1fr}}
/* ===== SIMPLE PROVIDER REQUEST ===== */
.simple-order-card{padding:14px!important}
.simple-order-head{display:flex;justify-content:space-between;align-items:end;gap:8px;margin-bottom:9px}
.simple-order-head h2{margin:0}
.simple-order-head small{color:#777}
.simple-order-grid{grid-template-columns:1fr 1fr 1fr!important}
.simple-order-card textarea{min-height:82px!important;margin:9px 0}
.send-main{width:100%;font-size:16px;font-weight:800}
.reviews-collapse summary{cursor:pointer;font-weight:900;font-size:18px}
@media(max-width:650px){
  .simple-order-grid{grid-template-columns:1fr!important}
  .simple-order-head{align-items:start;flex-direction:column}
}

</style><link rel="stylesheet" href="ha-premium-theme.css?v=20260925-v4">
<link rel="stylesheet" href="ha-theme.css?v=20260925-v4">
<link rel="stylesheet" href="ha-daylight-force.css?v=20260925-v4">
<script src="ha-theme.js?v=20260925-v4"></script>
</head><body><div class="wrap"><a class="btn light" href="services.html">← رجوع</a><div id="detail" class="card">جاري التحميل...</div><div class="card simple-order-card">
  <div class="simple-order-head">
    <h2>📩 اطلب الخدمة</h2>
    <small>المعلومات الأساسية فقط</small>
  </div>
  <div id="loginNote" class="muted"></div>
  <form id="form">
    <div class="grid simple-order-grid">
      <input id="name" required placeholder="الاسم">
      <input id="phone" required placeholder="رقم الهاتف">
      <input id="address" required placeholder="المنطقة / العنوان">
    </div>
    <textarea id="details" required placeholder="اكتب باختصار شنو تحتاج"></textarea>
    <input id="date" type="hidden">
    <input id="time" type="hidden">
    <button type="button" id="loc" style="display:none"></button>
    <button class="send-main" type="submit">إرسال الطلب</button>
  </form>
</div><details class="card reviews-collapse">
  <summary>⭐ التقييمات</summary>
  <div id="reviews">جاري التحميل...</div><div class="grid"><select id="rating"><option value="5">5 نجوم</option><option value="4">4 نجوم</option><option value="3">3 نجوم</option><option value="2">2 نجمتان</option><option value="1">1 نجمة</option></select><input id="comment" placeholder="اكتب تعليقك"></div><button id="sendReview">إرسال التقييم</button>
</details></div><script>
const db=supabase.createClient(
  'https://ubayrhtshgtgggxprrek.supabase.co',
  'sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',
  {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}}
);

const providerId=Number(new URLSearchParams(location.search).get('id'));
let p=null,me=null,lat=null,lng=null;

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

function providerName(x){
  return x?.name||x?.full_name||'مقدم خدمة';
}

async function load(){
  me=(await db.auth.getUser()).data.user||null;

  if(!Number.isFinite(providerId)||providerId<=0){
    detail.textContent='رقم مقدم الخدمة غير صحيح';
    form.style.display='none';
    return;
  }

  const {data,error}=await db.from('service_providers')
    .select('*,service_categories(id,name)')
    .eq('id',providerId)
    .eq('is_active',true)
    .maybeSingle();

  if(error||!data){
    detail.textContent='تعذر تحميل بيانات مقدم الخدمة';
    form.style.display='none';
    return;
  }

  p=data;
  const profession=p.service_categories?.name||p.other_profession||'خدمة';

  detail.innerHTML=`
    ${p.image_url?`<img class="img" src="${esc(p.image_url)}">`:''}
    <div class="row"><h1>${esc(providerName(p))}</h1>${p.is_verified?'<b>✅ معتمد</b>':''}</div>
    <div class="muted">
      🛠️ ${esc(profession)}<br>
      📍 ${esc([p.governorate,p.area].filter(Boolean).join(' - ')||'الموقع غير مضاف')}<br>
      💰 ${p.price_from!=null?'يبدأ من '+Number(p.price_from).toLocaleString('ar-IQ')+' د.ع':'السعر حسب الخدمة'}<br>
      ${p.is_available?'🟢 متوفر حالياً':'🔴 غير متوفر حالياً'}
    </div>
    ${p.description?`<p>${esc(p.description)}</p>`:''}
    <div class="row">
      ${p.phone?`<a class="btn" href="tel:${esc(p.phone)}">📞 اتصال</a>`:''}
      ${p.whatsapp?`<a class="btn" href="https://wa.me/${esc(p.whatsapp.replace(/\D/g,''))}" target="_blank">واتساب</a>`:''}
      ${p.map_url?`<a class="btn light" href="${esc(p.map_url)}" target="_blank">🗺️ الموقع</a>`:''}
      <button id="fav">♡ مفضلة</button>
    </div>`;

  document.getElementById('fav').onclick=toggleFav;
  loginNote.textContent=me?'':'يجب تسجيل الدخول حتى ترسل طلباً أو تقييماً.';

  if(me){
    const {data:pr}=await db.from('profiles')
      .select('full_name,phone,governorate')
      .eq('id',me.id)
      .maybeSingle();
    if(pr){
      name.value=pr.full_name||'';
      phone.value=pr.phone||'';
      address.value=pr.governorate||'';
    }
  }

  loadReviews();
}

async function setCustomerLocation(showError=true){
  try{
    const pos=await HA_Nearby.getCurrent({allowCache:false});
    lat=pos.lat;lng=pos.lng;
    loc.textContent='✅ موقعك محدد';
    return true;
  }catch(e){
    if(showError)alert('تعذر تحديد الموقع. فعّل GPS والسماح بالموقع.');
    return false;
  }
}

loc.onclick=()=>setCustomerLocation(true);
setTimeout(()=>setCustomerLocation(false),350);

form.onsubmit=async e=>{
  e.preventDefault();

  if(!me){
    location.href='login.html?next='+encodeURIComponent(location.href);
    return;
  }
  if(!p||!p.category_id)return alert('مهنة مقدم الخدمة غير مربوطة بقسم. خلي مقدم الخدمة يحفظ مهنته من جديد.');

  const ph=phone.value.replace(/\D/g,'');
  if(!/^07\d{9}$/.test(ph))return alert('رقم الهاتف يجب أن يبدأ بـ 07 ويتكون من 11 رقم');

  const profession=p.service_categories?.name||p.other_profession||'خدمة';

  const payload={
    customer_id:me.id,
    provider_id:providerId,
    category_id:p.category_id,
    service_type:profession,
    customer_name:name.value.trim(),
    phone:ph,
    address:address.value.trim(),
    details:details.value.trim(),
    preferred_date:date.value||null,
    preferred_time:time.value.trim()||null,
    customer_lat:lat,
    customer_lng:lng,
    status:'new'
  };

  const {data,error}=await db.from('service_requests')
    .insert(payload)
    .select('id')
    .single();

  if(error)return alert('تعذر إرسال الطلب: '+error.message);

  alert('تم إرسال طلب الخدمة بنجاح. رقم الطلب: '+data.id);
  location.href='service-orders.html';
};

async function toggleFav(){
  if(!me)return location.href='login.html';
  const {data}=await db.from('service_favorites')
    .select('provider_id')
    .eq('user_id',me.id)
    .eq('provider_id',providerId)
    .maybeSingle();

  if(data){
    await db.from('service_favorites').delete()
      .eq('user_id',me.id)
      .eq('provider_id',providerId);
  }else{
    await db.from('service_favorites').insert({user_id:me.id,provider_id:providerId});
  }
  alert(data?'تمت الإزالة من المفضلة':'تمت الإضافة للمفضلة');
}

async function loadReviews(){
  const {data}=await db.from('service_reviews')
    .select('rating,comment,created_at')
    .eq('provider_id',providerId)
    .order('created_at',{ascending:false});

  reviews.innerHTML=(data||[]).length
    ?data.map(r=>`<p>${'⭐'.repeat(r.rating)}<br>${esc(r.comment||'')}</p>`).join('')
    :'لا توجد تقييمات بعد.';
}

sendReview.onclick=async()=>{
  if(!me)return location.href='login.html';
  const {error}=await db.from('service_reviews').upsert(
    {user_id:me.id,provider_id:providerId,rating:Number(rating.value),comment:comment.value.trim()},
    {onConflict:'user_id,provider_id'}
  );
  if(error)return alert(error.message);
  comment.value='';
  loadReviews();
};

load();
</script></body></html>
