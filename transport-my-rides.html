<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>طلباتي - HA Marketing</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f4f5f7;color:#111}
.page{width:min(760px,100%);margin:auto;min-height:100vh;background:#fff;padding:12px}
.head{display:flex;align-items:center;gap:10px;position:sticky;top:0;background:#fff;padding:8px 0;z-index:4}
.back{width:38px;height:38px;border:0;border-radius:50%;background:#eee;font-size:22px}.head h1{font-size:18px;margin:0}
.filters{display:flex;gap:6px;overflow:auto;padding:8px 0}.filters button{border:0;border-radius:999px;padding:8px 12px;background:#eee;white-space:nowrap}.filters button.active{background:#111;color:#fff}
.list{display:grid;gap:9px}.card{border:1px solid #e6e6e6;border-radius:15px;padding:12px;background:#fff;box-shadow:0 5px 16px #0000000b}
.top{display:flex;justify-content:space-between;gap:8px}.top b{font-size:14px}.status{font-size:10px;padding:5px 8px;border-radius:999px;background:#eef4ff;color:#2351a5}
.meta{margin-top:9px;display:grid;gap:5px;font-size:11px;color:#666}.price{font-weight:800;color:#111}.empty{text-align:center;color:#777;padding:40px 15px}
</style>
</head><body>
<div class="page">
<div class="head"><button class="back" onclick="history.back()">‹</button><h1>🕘 طلباتي السابقة</h1></div>
<div class="filters"><button class="active" data-f="all">الكل</button><button data-f="active">الفعالة</button><button data-f="finished">المكتملة</button><button data-f="cancelled">الملغاة</button></div>
<div id="list" class="list"><div class="empty">جاري تحميل الطلبات...</div></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="firebase-auth-secure.js"></script>
<script>
const cfg={apiKey:"AIzaSyAPmaCbhJCh1a7DyDos1HyM95HDKe4L6sE",authDomain:"ha-marketing.firebaseapp.com",databaseURL:"https://ha-marketing-default-rtdb.europe-west1.firebasedatabase.app",projectId:"ha-marketing",storageBucket:"ha-marketing.firebasestorage.app",messagingSenderId:"558520139704",appId:"1:558520139704:web:526f8026dac658403b594d"};
if(!firebase.apps.length)firebase.initializeApp(cfg);
const db=firebase.database(), list=document.getElementById('list');
let rides=[],filter='all';
const terminal=['finished','cancelled','rejected'];
const labels={searching:'جاري البحث',accepted:'تم القبول',arrived:'وصل السائق',started:'بدأت الرحلة',finished:'مكتمل',cancelled:'ملغي',rejected:'مرفوض'};
function fmt(ts){if(!ts)return '—';try{return new Date(Number(ts)).toLocaleString('ar-IQ')}catch(e){return '—'}}
function match(r){
 if(filter==='all')return true;
 if(filter==='active')return !terminal.includes(r.status);
 if(filter==='finished')return r.status==='finished';
 if(filter==='cancelled')return ['cancelled','rejected'].includes(r.status);
 return true;
}
function render(){
 const rows=rides.filter(match);
 if(!rows.length){list.innerHTML='<div class="empty">ماكو طلبات بهذا القسم.</div>';return}
 list.innerHTML=rows.map(({id,...r})=>`<div class="card">
   <div class="top"><b>${r.serviceType==='delivery'?'🛵 طلب مندوب':'🚕 طلب تكسي'}</b><span class="status">${labels[r.status]||r.status||'—'}</span></div>
   <div class="meta">
    <div>النوع: ${r.vehicleType||'—'}</div>
    <div>المسافة: ${Number(r.distanceKm||0).toFixed(1)} كم • الوقت: ${Math.round(Number(r.tripMinutes||0))||'—'} د</div>
    ${r.delivery?.item?`<div>الطلب: ${r.delivery.item}</div>`:''}
    ${r.delivery?.collectAmount?`<div>تحصيل عند التسليم: ${Number(r.delivery.collectAmount).toLocaleString('ar-IQ')} د.ع</div>`:''}
    <div>التاريخ: ${fmt(r.createdAt)}</div>
    <div class="price">${Number(r.price||0).toLocaleString('ar-IQ')} د.ع</div>
   </div></div>`).join('');
}
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-f]').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.f;render()});
(async()=>{
 try{
  const u=await HA_FirebaseAuth.ready();
  const s=await db.ref('userRides/'+u.uid).once('value');
  const ids=Object.keys(s.val()||{});
  const arr=[];
  for(const id of ids.slice(-100).reverse()){
    const rs=await db.ref('rides/'+id).once('value');
    if(rs.exists())arr.push({id,...rs.val()});
  }
  rides=arr.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));render();
 }catch(e){console.error(e);list.innerHTML='<div class="empty">تعذر تحميل الطلبات.</div>'}
})();
</script>
</body></html>
