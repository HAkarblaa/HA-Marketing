sliders/transport-2.svg", "title": "مندوب توصيل", "subtitle": "توصيل سريع للطلبات والمشاوير", "details_url": "delivery.html", "is_active": true}, {"slot": 3, "image_url": "images/sliders/transport-3.svg", "title": "تك تك", "subtitle": "للمشاوير القصيرة والقريبة", "details_url": "tuktuk.html", "is_active": true}, {"slot": 4, "image_url": "images/sliders/transport-4.svg", "title": "سيارة حمل", "subtitle": "لنقل الأثاث والبضائع بأمان", "details_url": "cargo.html", "is_active": true}, {"slot": 5, "image_url": "images/sliders/transport-5.svg", "title": "خطوط النقل", "subtitle": "طلاب وموظفين وخيارات نقل إضافية", "details_url": "transport-directory.html", "is_active": true}], "sports": [{"slot": 1, "image_url": "images/sliders/sports-1.svg", "title": "كرة القدم", "subtitle": "أخبار ومباريات ونتائج", "details_url": "football.html", "is_active": true}, {"slot": 2, "image_url": "images/sliders/sports-2.svg", "title": "أخبار الرياضة", "subtitle": "تابع آخر الأخبار الرياضية", "details_url": "football-news.html", "is_active": true}, {"slot": 3, "image_url": "images/sliders/sports-3.svg", "title": "تحديات رياضية", "subtitle": "شارك وتابع المنافسات", "details_url": "study-sports-challenges.html", "is_active": true}, {"slot": 4, "image_url": "images/sliders/sports-4.svg", "title": "النوادي واللياقة", "subtitle": "خيارات رياضية متنوعة", "details_url": "gym.html", "is_active": true}, {"slot": 5, "image_url": "images/sliders/sports-5.svg", "title": "الترتيب والنتائج", "subtitle": "شاهد النتائج والتحديات المميزة", "details_url": "games-ranking.html", "is_active": true}], "entertainment": [{"slot": 1, "image_url": "images/sliders/entertainment-1.svg", "title": "الألعاب", "subtitle": "مجموعة ألعاب سريعة وممتعة", "details_url": "games.html", "is_active": true}, {"slot": 2, "image_url": "images/sliders/entertainment-2.svg", "title": "التحديات", "subtitle": "نافس وارفع ترتيبك", "details_url": "games-ranking.html", "is_active": true}, {"slot": 3, "image_url": "images/sliders/entertainment-3 : "اعرف أوقات الصلاة اليومية", "details_url": "prayer-times.html", "is_active": true}, {"slot": 5, "image_url": "images/sliders/religious-5.svg", "title": "القبلة والتسبيح", "subtitle": "أدوات دينية سريعة وسهلة", "details_url": "qibla.html", "is_active": true}]};
let user=null,isSuper=false,current='home';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function init(){const {data:{session}}=await db.auth.getSession();if(!session){gate.textContent='يجب تسجيل الدخول أولاً.';return}user=session.user;try{const r=await db.rpc('is_super_admin');isSuper=!r.error&&r.data===true}catch(e){}if(!isSuper){try{const r=await db.from('app_admins').select('is_super_admin,is_active').eq('user_id',user.id).maybeSingle();isSuper=!!(r.data?.is_active&&r.data?.is_super_admin)}catch(e){}}if(!isSuper){gate.textContent='هذه الصفحة متاحة للأدمن الرئيسي فقط.';return}gate.style.display='none';app.style.display='block';await loadSection()}
function card(s){return `<div class="slot" data-slot="${s.slot}"><div class="slot-head"><b>الصورة ${s.slot}</b><label class="active"><input id="a${s.slot}" type="checkbox" ${s.is_active!==false?'checked':''}> مفعلة</label></div><img class="preview" id="p${s.slot}" src="${esc(s.image_url)}" alt="صورة ${s.slot}"><div class="field"><label>رفع صورة من الجهاز</label><input id="f${s.slot}" type="file" accept="image/*"></div><div class="field"><label>رابط الصورة</label><input id="u${s.slot}" value="${esc(s.image_url)}"></div><div class="field"><label>العنوان</label><input id="t${s.slot}" value="${esc(s.title)}"></div><div class="field"><label>الوصف</label><textarea id="s${s.slot}">${esc(s.subtitle)}</textarea></div><div class="field"><label>رابط التفاصيل</label><input id="d${s.slot}" value="${esc(s.details_url)}"></div><div class="row"><button class="btn" onclick="saveSlot(${s.slot},this)">حفظ الصورة ${s.slot}</button><button class="btn alt" onclick="restoreDefault(${s.slot})">افتراضي</button></div></div>`}
async function loadSection(){current=sectionSelect.value;msg.textContent='جاري تحميل '+sectionSelect.options[sectionSelect.selectedIndex].text+'...';const {data,error}=await db.from('section_sliders').select('*').eq('section_key',current).order('slot');if(error){msg.textContent='تعذر التحميل: '+error.message+'\nشغّل ملف SECTION-SLIDERS-SETUP.sql مرة واحدة داخل Supabase.';return}const base=DEFAULTS[current].map(x=>({...x,section_key:current}));const slides=base.map(d=>{const r=(data||[]).find(x=>Number(x.slot)===d.slot);return r?{...d,...r,image_url:r.image_url||d.image_url,title:r.title||d.title,subtitle:r.subtitle||d.subtitle,details_url:r.details_url||d.details_url}:d});slots.innerHTML=slides.map(card).join('');slides.forEach(s=>{const f=$('f'+s.slot);f.addEventListener('change',()=>{const file=f.files?.[0];if(!file)return;const u=URL.createObjectURL(file);$('p'+s.slot).src=u;$('p'+s.slot).onload=()=>URL.revokeObjectURL(u)});$('u'+s.slot).addEventListener('input',e=>{if(e.target.value.trim())$('p'+s.slot).src=e.target.value.trim()})});msg.textContent='✅ تم تحميل الصور الخمس.'}
async function upload(slot,file){if(!file)return null;if(!String(file.type||'').startsWith('image/'))throw new Error('اختر صورة فقط.');if(file.size>8*1024*1024)throw new Error('حجم الصورة يجب أن يكون أقل من 8MB.');const ext=(file.name.split('.').pop()||'jpg').replace(/[^a-zA-Z0-9]/g,'').toLowerCase()||'jpg';const path=current+'/slot-'+slot+'/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;const {error}=await db.storage.from('section-sliders').upload(path,file,{cacheControl:'3600',upsert:false,contentType:file.type||undefined});if(error)throw error;return db.storage.from('section-sliders').getPublicUrl(path).data.publicUrl}
async function saveSlot(slot,btn){try{btn.disabled=true;msg.textContent='جاري الحفظ...';let image=$('u'+slot).value.trim();const file=$('f'+slot).files?.[0];if(file)image=await upload(slot,file);if(!image)throw new Error('حدد صورة أو رابط صورة.');const row={section_key:current,slot,image_url:image,title:$('t'+slot).value.trim(),subtitle:$('s'+slot).value.trim(),details_url:$('d'+slot).value.trim()||'index.html',is_active:$('a'+slot).checked,updated_by:user.id,updated_at:new Date().toISOString()};const {error}=await db.from('section_sliders').upsert(row,{onConflict:'section_key,slot'});if(error)throw error;msg.textContent='✅ تم الحفظ. التغيير سيظهر مباشرة في قسم '+sectionSelect.options[sectionSelect.selectedIndex].text+'.';await loadSection()}catch(e){msg.textContent='❌ '+(e?.message||e)}finally{btn.disabled=false}}
async function restoreDefault(slot){const d=DEFAULTS[current].find(x=>x.slot===slot);if(!d)return;if(!confirm('إرجاع الصورة '+slot+' للوضع الافتراضي؟'))return;const {error}=await db.from('section_sliders').upsert({section_key:current,...d,updated_by:user.id,updated_at:new Date().toISOString()},{onConflict:'section_key,slot'});msg.textContent=error?'❌ '+error.message:'✅ تمت استعادة الصورة الافتراضية.';await loadSection()}
loadBtn.onclick=loadSection;sectionSelect.onchange=loadSection;init();
