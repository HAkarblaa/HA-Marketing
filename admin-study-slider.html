<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة صور الدراسة - HA Marketing</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;background:#050709;color:#fff;font-family:Tahoma,Arial,sans-serif}.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;background:#090b0e;border-bottom:1px solid #7e5b21}.top b{color:#f4c45f}.top a{color:#fff;text-decoration:none;background:#171b20;border:1px solid #333;border-radius:11px;padding:9px 13px}.wrap{width:min(1100px,94%);margin:22px auto 60px}.card{background:linear-gradient(145deg,#111a23,#070b0f);border:1px solid #2d3c48;border-radius:18px;padding:17px;margin-bottom:14px}h1{margin:0 0 7px;color:#f4c45f}.muted{color:#aeb8c4;line-height:1.7;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.slot{background:#0a1016;border:1px solid #2c3d4c;border-radius:17px;padding:13px}.slot b{display:block;margin-bottom:9px;color:#ffe09a}.preview{width:100%;aspect-ratio:16/7;object-fit:cover;border-radius:13px;background:#111;border:1px solid #263746;margin-bottom:9px}.slot input,.slot textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #384957;background:#071019;color:#fff;margin:5px 0;font:inherit}.slot textarea{min-height:76px;resize:vertical}.actions{display:flex;gap:8px;margin-top:8px}.btn{flex:1;border:0;border-radius:11px;padding:11px 12px;font:inherit;font-weight:900;cursor:pointer;background:linear-gradient(135deg,#d99927,#f4c45f);color:#17110a}.btn.alt{background:#202a34;color:#fff;border:1px solid #374757}.status{white-space:pre-wrap;background:#080d12;border:1px solid #263747;border-radius:12px;padding:12px;margin-top:13px;color:#d9e1e8}.gate{padding:15px;background:#2a210d;border:1px solid #735c25;border-radius:13px;color:#ffe6a9}.mini{font-size:11px;color:#9fb0be;line-height:1.6}@media(max-width:760px){.grid{grid-template-columns:1fr}.preview{aspect-ratio:16/8}}
</style></head><body><div class="top"><b>📚 إدارة صور الدراسة</b><a href="admin-panel.html">رجوع</a></div><div class="wrap"><div id="gate" class="gate">جاري التحقق من صلاحية الأدمن الرئيسي...</div><div id="app" style="display:none"><div class="card"><h1>سلايدر الدراسة</h1><div class="muted">خمس صور في أعلى صفحة الدراسة، وكل صورة تقدر تغير صورتها وعنوانها ووصفها ونص زر التفاصيل والرابط. الإدارة للأدمن الرئيسي فقط.</div></div><div class="card"><div class="grid" id="gridSlots"></div><div id="msg" class="status">جاهز.</div></div></div></div><script>
const SB_URL='https://ubayrhtshgtgggxprrek.supabase.co',SB_KEY='sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll';const db=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});
const defs=[
{slot:1,title:'الدراسة',subtitle:'كل الأدوات الدراسية بمكان واحد وبشكل مرتب',button_text:'استكشف أدوات الدراسة',details_url:'study-directory.html',icon:'📚',image_url:'study-slide-1-main.svg',label:'الصورة 1 - الدراسة العامة'},
{slot:2,title:'الأسئلة الوزارية',subtitle:'الوصول إلى الأسئلة الوزارية للابتدائي والمتوسط والإعدادي والمهني.',button_text:'الدخول للأسئلة الوزارية',details_url:'ministerial-questions.html',icon:'📑',image_url:'study-slide-2-ministerial.svg',label:'الصورة 2 - الأسئلة الوزارية'},
{slot:3,title:'الدورات',subtitle:'دورات أونلاين وحضورية وخيارات دراسية تساعدك على التطور.',button_text:'عرض الدورات',details_url:'courses.html',icon:'🎓',image_url:'study-slide-3-courses.svg',label:'الصورة 3 - الدورات'},
{slot:4,title:'تلخيص وأدوات الدراسة',subtitle:'تلخيص المواد وتنظيم المحتوى والاستفادة من أدوات الدراسة والملفات.',button_text:'فتح أدوات الدراسة',details_url:'study-summary.html',icon:'📝',image_url:'study-slide-4-tools.svg',label:'الصورة 4 - أدوات الدراسة'},
{slot:5,title:'أخبار التعليم',subtitle:'تابع آخر أخبار التربية والتعليم العالي والجامعات من مكان واحد.',button_text:'عرض أخبار التعليم',details_url:'education-news.html',icon:'🏫',image_url:'study-slide-5-news.svg',label:'الصورة 5 - أخبار التعليم'}];let user=null,isSuper=false;
function slotHtml(s){return '<div class="slot"><b>'+s.label+'</b><img class="preview" id="p'+s.slot+'"><input id="t'+s.slot+'" placeholder="العنوان"><textarea id="d'+s.slot+'" placeholder="الوصف"></textarea><input id="b'+s.slot+'" placeholder="نص زر التفاصيل"><input id="l'+s.slot+'" placeholder="رابط التفاصيل مثل: study-summary.html"><input id="u'+s.slot+'" type="url" placeholder="رابط الصورة (اختياري)"><input id="f'+s.slot+'" type="file" accept="image/*"><div class="mini">اختر صورة من الجهاز أو ضع رابط صورة. الحد الأعلى 6MB.</div><div class="actions"><button class="btn" onclick="saveSlide('+s.slot+',this)">حفظ / تبديل</button><button class="btn alt" onclick="restoreDefault('+s.slot+')">الافتراضية</button></div></div>'}
gridSlots.innerHTML=defs.map(slotHtml).join('');
function preview(n,url){const p=document.getElementById('p'+n);if(url){p.src=url;p.style.opacity='1'}else{p.removeAttribute('src');p.style.opacity='.25'}}
for(let n=1;n<=5;n++)document.getElementById('f'+n).addEventListener('change',e=>{const file=e.target.files?.[0];if(!file)return;const u=URL.createObjectURL(file);preview(n,u);document.getElementById('p'+n).onload=()=>URL.revokeObjectURL(u)});
async function init(){const {data:{session}}=await db.auth.getSession();if(!session){gate.textContent='يجب تسجيل الدخول أولاً.';return}user=session.user;try{const r=await db.rpc('is_super_admin');isSuper=!r.error&&r.data===true}catch(e){}if(!isSuper){try{const a=await db.from('app_admins').select('is_super_admin,is_active').eq('user_id',user.id).maybeSingle();isSuper=!!(a.data?.is_active&&a.data?.is_super_admin)}catch(e){}}if(!isSuper){gate.textContent='هذه الصفحة للأدمن الرئيسي فقط.';return}gate.style.display='none';app.style.display='block';await load()}
async function load(){msg.textContent='جاري تحميل الصور...';const {data,error}=await db.from('study_slider_images').select('slot,title,subtitle,button_text,details_url,image_url,icon').order('slot');if(error){msg.textContent='تعذر تحميل الصور: '+error.message+'\nشغّل STUDY-SLIDER-5-ADMIN.sql مرة واحدة داخل Supabase.';return}for(let n=1;n<=5;n++){const def=defs.find(x=>x.slot===n),row=(data||[]).find(x=>Number(x.slot)===n)||def;t(n).value=row.title||def.title;d(n).value=row.subtitle||def.subtitle;b(n).value=row.button_text||def.button_text;l(n).value=row.details_url||def.details_url;u(n).value=row.image_url||def.image_url;f(n).value='';preview(n,row.image_url||def.image_url)}msg.textContent='✅ صور الدراسة جاهزة للإدارة.'}
function t(n){return document.getElementById('t'+n)} function d(n){return document.getElementById('d'+n)} function b(n){return document.getElementById('b'+n)} function l(n){return document.getElementById('l'+n)} function u(n){return document.getElementById('u'+n)} function f(n){return document.getElementById('f'+n)}
async function upload(n,file){if(!file)return null;if(!String(file.type||'').startsWith('image/'))throw new Error('اختر ملف صورة فقط.');if(file.size>6*1024*1024)throw new Error('حجم الصورة يجب أن يكون أقل من 6MB.');const ext=(file.name.split('.').pop()||'jpg').replace(/[^a-zA-Z0-9]/g,'').toLowerCase()||'jpg';const path='slot-'+n+'/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;const {error}=await db.storage.from('study-slider').upload(path,file,{cacheControl:'3600',upsert:false,contentType:file.type||undefined});if(error)throw error;return db.storage.from('study-slider').getPublicUrl(path).data.publicUrl}
async function saveSlide(n,btn){if(!isSuper)return;try{btn.disabled=true;msg.textContent='جاري حفظ الصورة '+n+'...';const def=defs.find(x=>x.slot===n);const file=f(n).files?.[0];let url=u(n).value.trim();if(file)url=await upload(n,file);if(!url)throw new Error('اختر صورة من الجهاز أو ضع رابط صورة.');const {error}=await db.from('study_slider_images').upsert({slot:n,title:t(n).value.trim()||def.title,subtitle:d(n).value.trim()||def.subtitle,button_text:b(n).value.trim()||def.button_text,details_url:l(n).value.trim()||def.details_url,image_url:url,icon:def.icon,is_active:true,updated_by:user.id,updated_at:new Date().toISOString()},{onConflict:'slot'});if(error)throw error;msg.textContent='✅ تم حفظ الصورة '+n+' وستظهر في أعلى صفحة الدراسة.';await load()}catch(e){msg.textContent='❌ '+(e?.message||e)}finally{btn.disabled=false}}
async function restoreDefault(n){if(!isSuper)return;const def=defs.find(x=>x.slot===n);const {error}=await db.from('study_slider_images').upsert({slot:n,title:def.title,subtitle:def.subtitle,button_text:def.button_text,details_url:def.details_url,image_url:def.image_url,icon:def.icon,is_active:true,updated_by:user.id,updated_at:new Date().toISOString()},{onConflict:'slot'});msg.textContent=error?'❌ '+error.message:'✅ رجعت الصورة '+n+' للوضع الافتراضي.';await load()}
init();
</script></body></html>
