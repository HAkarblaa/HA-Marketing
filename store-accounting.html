<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حسابات المتاجر</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7f5}.w{width:min(1100px,95%);margin:18px auto}.c{background:#fff;border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 3px 14px #0001}.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.num{font-size:24px;font-weight:bold}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}input,select,textarea{width:100%;padding:10px;border:1px solid #ccd5cf;border-radius:10px}button,.b{border:0;background:#163b2b;color:#fff;border-radius:10px;padding:10px 13px;text-decoration:none}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #eee;padding:8px;text-align:right}.income{color:#087f23}.expense{color:#b00020}@media(max-width:700px){.sum{grid-template-columns:repeat(2,1fr)}.g{grid-template-columns:1fr}table{font-size:11px}}</style></head><body><div class=w><a class=b href="shop.html">← التسوق</a><h1>📒 برنامج حسابات المتاجر</h1><div id=guard class=c>جاري التحقق من صلاحية البائع...</div><div id=app style="display:none"><div class=sum><div class=c><div>الإيرادات</div><div id=sin class="num income">0</div></div><div class=c><div>المصروفات</div><div id=sout class="num expense">0</div></div><div class=c><div>المستحق لنا</div><div id=srec class=num>0</div></div><div class=c><div>علينا</div><div id=spay class=num>0</div></div></div><div class=c><h2>إضافة حركة حسابية</h2><div class=g><select id=type><option value=income>إيراد</option><option value=expense>مصروف</option><option value=receivable>مستحق لنا</option><option value=payable>مستحق علينا</option></select><input id=category placeholder="التصنيف: مبيعات/إيجار/رواتب..."><input id=amount type=number min=0 step=0.01 placeholder="المبلغ"><input id=date type=date><input id=party placeholder="العميل / المورد"><input id=ref placeholder="رقم فاتورة / مرجع"><textarea id=desc placeholder="الوصف"></textarea></div><button onclick=saveEntry() style="margin-top:8px">حفظ الحركة</button></div><div class=c><h2>العملاء والموردون</h2><div class=g><select id=partyType><option value=customer>عميل</option><option value=supplier>مورد</option></select><input id=partyName placeholder="الاسم"><input id=partyPhone placeholder="الهاتف"><input id=partyNote placeholder="ملاحظة"></div><button onclick=saveParty()>إضافة</button><div id=parties></div></div><div class=c><h2>السجل</h2><div style="overflow:auto"><table><thead><tr><th>التاريخ</th><th>النوع</th><th>التصنيف</th><th>الوصف</th><th>الطرف</th><th>المبلغ</th><th></th></tr></thead><tbody id=rows></tbody></table></div></div></div></div><script>const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});
let me=null,entries=[];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function init(){let {data:{session}}=await db.auth.getSession();if(!session)return location.href='login.html?next=store-accounting.html';me=session.user;let [r,a]=await Promise.all([db.rpc('has_approved_role',{p_role:'seller'}),db.from('app_admins').select('is_super_admin,is_active').eq('user_id',me.id).maybeSingle()]);if(!r.data&&!(a.data?.is_super_admin&&a.data?.is_active)){guard.textContent='هذا البرنامج متاح للبائع المعتمد أو الأدمن الرئيسي.';return}guard.textContent='✅ صلاحية الحسابات فعالة';app.style.display='block';date.value=new Date().toISOString().slice(0,10);load()}async function saveEntry(){if(!amount.value)return alert('اكتب المبلغ');let row={user_id:me.id,entry_type:type.value,category:category.value.trim()||null,amount:+amount.value,entry_date:date.value||new Date().toISOString().slice(0,10),party_name:party.value.trim()||null,reference:ref.value.trim()||null,description:desc.value.trim()||null};let {error}=await db.from('shop_accounting_entries').insert(row);if(error)return alert(error.message);amount.value='';desc.value='';load()}async function saveParty(){if(!partyName.value.trim())return;let {error}=await db.from('shop_accounting_parties').insert({user_id:me.id,party_type:partyType.value,name:partyName.value.trim(),phone:partyPhone.value.trim()||null,notes:partyNote.value.trim()||null});if(error)return alert(error.message);partyName.value='';partyPhone.value='';partyNote.value='';loadParties()}async function load(){let {data,error}=await db.from('shop_accounting_entries').select('*').eq('user_id',me.id).order('entry_date',{ascending:false}).order('created_at',{ascending:false});if(error){guard.textContent='شغّل ملف SQL الجديد أولاً: '+error.message;return}entries=data||[];let sum=t=>entries.filter(x=>x.entry_type===t).reduce((s,x)=>s+Number(x.amount||0),0);sin.textContent=sum('income').toLocaleString('ar-IQ');sout.textContent=sum('expense').toLocaleString('ar-IQ');srec.textContent=sum('receivable').toLocaleString('ar-IQ');spay.textContent=sum('payable').toLocaleString('ar-IQ');const names={income:'إيراد',expense:'مصروف',receivable:'مستحق لنا',payable:'مستحق علينا'};rows.innerHTML=entries.map(x=>`<tr><td>${esc(x.entry_date)}</td><td class="${x.entry_type}">${names[x.entry_type]}</td><td>${esc(x.category||'')}</td><td>${esc(x.description||'')}</td><td>${esc(x.party_name||'')}</td><td>${Number(x.amount).toLocaleString('ar-IQ')}</td><td><button onclick="editEntry(${x.id})">تعديل</button></td></tr>`).join('');loadParties()}async function editEntry(id){let x=entries.find(e=>e.id===id);let v=prompt('المبلغ الجديد',x.amount);if(v===null)return;let d=prompt('الوصف',x.description||'');let {error}=await db.from('shop_accounting_entries').update({amount:+v,description:d}).eq('id',id).eq('user_id',me.id);if(error)alert(error.message);else load()}async function loadParties(){let {data}=await db.from('shop_accounting_parties').select('*').eq('user_id',me.id).order('created_at',{ascending:false});parties.innerHTML=(data||[]).map(x=>`<div style="padding:7px;border-bottom:1px solid #eee"><b>${esc(x.name)}</b> — ${x.party_type==='customer'?'عميل':'مورد'} — ${esc(x.phone||'')}</div>`).join('')}init();</script></body></html>
