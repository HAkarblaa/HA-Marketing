<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رحلاتي - HA Marketing</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f5f6f8;color:#111}.top{position:sticky;top:0;background:#fff;padding:14px;display:flex;gap:10px;align-items:center;box-shadow:0 2px 12px #0001}.top a{text-decoration:none;color:#111;font-size:22px}.wrap{max-width:760px;margin:auto;padding:14px}.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 3px 14px #0000000b}.row{display:flex;justify-content:space-between;gap:8px;margin:6px 0}.muted{color:#777;font-size:12px}.status{padding:5px 9px;border-radius:20px;background:#eef4ff;font-size:11px;font-weight:bold}.empty{text-align:center;padding:50px 10px;color:#777}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.actions button{border:0;padding:10px;border-radius:10px;font-weight:bold}</style></head><body><div class="top"><a href="taxi.html">→</a><b>🕘 رحلاتي</b></div><div class="wrap"><div id="list" class="empty">جاري تحميل الرحلات...</div></div><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="firebase-auth-secure.js"></script><script>const firebaseConfig={apiKey:"AIzaSyD8T-RD3i22-YfM8xI-AQ3HhStH7U7Qh-8",authDomain:"ha-marketing.firebaseapp.com",databaseURL:"https://ha-marketing-default-rtdb.europe-west1.firebasedatabase.app",projectId:"ha-marketing",storageBucket:"ha-marketing.firebasestorage.app",messagingSenderId:"338753815749",appId:"1:338753815749:web:3af07a342ab71940a8755f"};firebase.initializeApp(firebaseConfig);const db=firebase.database(),list=document.getElementById('list');const names={searching:'جاري البحث',accepted:'تم القبول',arrived:'وصل السائق',started:'الرحلة جارية',finished:'مكتملة',cancelled:'ملغية',rejected:'مرفوضة'};async function run(){try{const u=await HA_FirebaseAuth.ready();const ix=(await db.ref('userRides/'+u.uid).once('value')).val()||{};const ids=Object.keys(ix).reverse();if(!ids.length){list.className='empty';list.textContent='ما عندك رحلات محفوظة بعد.';return}const rows=[];for(const id of ids.slice(0,50)){const r=(await db.ref('rides/'+id).once('value')).val();if(r)rows.push([id,r])}list.className='';list.innerHTML=rows.map(([id,r])=>`<div class="card"><div class="row"><b>${r.vehicleType||'تكسي'}</b><span class="status">${names[r.status]||r.status||'—'}</span></div><div class="row"><span>السعر</span><b>${Number(r.price||0).toLocaleString('ar-IQ')} د.ع</b></div><div class="row muted"><span>المسافة ${Number(r.distanceKm||0).toFixed(1)} كم</span><span>${r.paymentMethod==='electronic'?'💳 إلكتروني':'💵 نقدي'}</span></div><div class="row muted"><span>السائق: ${r.driver?.name||'—'}</span><span>${r.createdAt?new Date(r.createdAt).toLocaleDateString('ar-IQ'):'—'}</span></div><div class="actions"><button onclick="location.href='taxi.html'">طلب جديد</button><button onclick="shareRide('${id}')">مشاركة</button></div></div>`).join('')}catch(e){console.error(e);list.textContent='تعذر تحميل الرحلات. تأكد من تحديث قواعد Firebase.'}}async function shareRide(id){const text='رحلة HA Marketing - رقم الرحلة: '+id;if(navigator.share)try{await navigator.share({title:'مشاركة الرحلة',text})}catch(e){}else{navigator.clipboard.writeText(text);alert('تم النسخ')}}run();</script></body></html>
