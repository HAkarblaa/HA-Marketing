<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إيصال الطلب</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});</script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f5f5f5;color:#111}.wrap{width:94%;max-width:760px;margin:24px auto}.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 16px #0001}.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid #eee}.row:last-child{border:0}.btn,button{display:inline-block;border:0;border-radius:10px;padding:11px 14px;background:#111;color:#fff;text-decoration:none;cursor:pointer}.light{background:#eee;color:#111}.muted{color:#666}.total{font-size:24px}.actions{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}@media print{body{background:#fff}.actions{display:none}.card{box-shadow:none}}</style></head><body><div class="wrap"><div id="box" class="card">جاري تحميل الإيصال...</div></div><script>
const id=Number(new URLSearchParams(location.search).get('id'));const st={new:'جديد',confirmed:'مؤكد',preparing:'قيد التجهيز',out_for_delivery:'خرج للتوصيل',completed:'مكتمل',cancelled:'ملغي'};function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}async function load(){const {data:u}=await db.auth.getUser();if(!u?.user){box.textContent='يجب تسجيل الدخول.';return}const {data:o,error}=await db.from('shop_orders').select('*,shop_order_items(product_name,quantity,unit_price,subtotal,option_text)').eq('id',id).eq('customer_id',u.user.id).maybeSingle();if(error||!o){box.textContent='تعذر العثور على الطلب.';return}document.title='إيصال الطلب #'+o.id;box.innerHTML=`<h1>🧾 إيصال الطلب #${o.id}</h1><div class="row"><span>الحالة</span><strong>${esc(st[o.status]||o.status)}</strong></div><div class="row"><span>الاسم</span><strong>${esc(o.customer_name)}</strong></div><div class="row"><span>الهاتف</span><strong>${esc(o.phone)}</strong></div><div class="row"><span>العنوان</span><strong>${esc((o.governorate||'')+' - '+o.address)}</strong></div><h3>المواد</h3>${(o.shop_order_items||[]).map(i=>`<div class="row"><span>${esc(i.product_name)} × ${i.quantity}${i.option_text?` <span class="muted">(${esc(i.option_text)})</span>`:''}</span><strong>${Number(i.subtotal).toLocaleString('ar-IQ')} د.ع</strong></div>`).join('')}<div class="row"><span>المجموع الفرعي</span><strong>${Number(o.subtotal||o.total||0).toLocaleString('ar-IQ')} د.ع</strong></div><div class="row"><span>التوصيل</span><strong>${Number(o.delivery_fee||0).toLocaleString('ar-IQ')} د.ع</strong></div><div class="row"><span>الخصم${o.coupon_code?` (${esc(o.coupon_code)})`:''}</span><strong>- ${Number(o.discount_amount||0).toLocaleString('ar-IQ')} د.ع</strong></div><div class="row total"><span>المجموع النهائي</span><strong>${Number(o.total||0).toLocaleString('ar-IQ')} د.ع</strong></div><div class="row"><span>الدفع</span><strong>${o.payment_method==='electronic'?'إلكتروني / بطاقة':'عند الاستلام'}</strong></div><div class="muted" style="margin-top:12px">${new Date(o.created_at).toLocaleString('ar-IQ')}</div><div class="actions"><button onclick="print()">طباعة الإيصال</button><a class="btn light" href="shop-orders.html">طلباتي</a><a class="btn light" href="shop.html">تسوق الآن</a></div>`}load();
</script></body></html>
