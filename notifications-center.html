<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الإشعارات - HA Marketing</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f5f5f5;color:#111}.wrap{width:94%;max-width:820px;margin:25px auto}.card{background:#fff;border-radius:16px;padding:17px;margin:12px 0;box-shadow:0 4px 16px #0001}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.muted{color:#666;font-size:14px;line-height:1.7}.unread{border-right:5px solid #111}.badge{background:#eee;border-radius:999px;padding:5px 9px;font-size:13px}button,a{border:0;border-radius:9px;padding:10px 13px;text-decoration:none;cursor:pointer}.primary{background:#111;color:#fff}.light{background:#eee;color:#111}.empty{text-align:center;color:#666;padding:30px}</style></head><body><div class="wrap"><div class="row"><h1>🔔 الإشعارات</h1><button class="light" onclick="markAll()">تحديد الكل كمقروء</button></div><div id="box" class="empty">جاري التحميل...</div><a class="light" style="display:block;text-align:center;margin-top:15px" href="index.html">← الرئيسية</a></div><script>
const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll');let me=null;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function init(){const {data}=await db.auth.getUser();me=data?.user||null;if(!me){box.innerHTML='<div class="card">سجل الدخول أولاً.</div>';return}await load();db.channel('my-notifications-'+me.id).on('postgres_changes',{event:'*',schema:'public',table:'notifications',filter:'user_id=eq.'+me.id},load).subscribe()}
async function load(){const {data,error}=await db.from('notifications').select('*').eq('user_id',me.id).order('created_at',{ascending:false}).limit(100);if(error){box.innerHTML='<div class="card">تعذر تحميل الإشعارات: '+esc(error.message)+'</div>';return}if(!data?.length){box.innerHTML='<div class="card empty">لا توجد إشعارات حالياً.</div>';return}box.innerHTML=data.map(n=>`<div class="card ${n.is_read?'':'unread'}" onclick="readOne(${n.id})"><div class="row"><strong>${esc(n.title||'إشعار')}</strong><span class="badge">${new Date(n.created_at).toLocaleString('ar-IQ')}</span></div><div class="muted">${esc(n.message||'')}</div>${n.order_id?`<div style="margin-top:10px"><a class="primary" href="account.html#order-${n.order_id}" onclick="event.stopPropagation()">فتح الطلب</a></div>`:''}</div>`).join('')}
async function readOne(id){await db.from('notifications').update({is_read:true}).eq('id',id).eq('user_id',me.id);load()}
async function markAll(){await db.from('notifications').update({is_read:true}).eq('user_id',me.id).eq('is_read',false);load()}init();
</script></body></html>
