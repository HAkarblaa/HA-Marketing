<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الإشعارات - HA Marketing</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
:root{--gold:#efbd5e;--gold2:#8d5f1b;--bg:#020507;--panel:#0b1116;--panel2:#101820;--text:#f5f5f5;--muted:#8f9aa3;--line:rgba(239,189,94,.25);--red:#e53935}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 85% 5%,rgba(239,189,94,.10),transparent 25%),linear-gradient(180deg,#020507,#05090d 55%,#020507);color:var(--text);font-family:"Segoe UI",Tahoma,Arial,sans-serif;padding-bottom:92px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 14px;background:rgba(4,8,11,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:20px;color:#f3c86f}
.top button,.top a{border:1px solid rgba(239,189,94,.35);background:#0b1116;color:#fff;border-radius:12px;padding:10px 12px;text-decoration:none;cursor:pointer;font-weight:800}
.wrap{width:min(760px,94%);margin:18px auto}
.hero{border:1px solid var(--line);background:linear-gradient(145deg,rgba(18,25,32,.96),rgba(6,10,14,.98));border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 15px 40px #0007}
.hero h2{margin:0 0 6px;color:#f2c66d}.hero p{margin:0;color:var(--muted);line-height:1.7;font-size:13px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.toolbar button{border:1px solid rgba(239,189,94,.35);background:#0b1116;color:#fff;border-radius:12px;padding:10px 12px;cursor:pointer;font-weight:800}
.toolbar .primary{background:linear-gradient(135deg,#c78d2f,#efbd5e);color:#171006;border-color:#efbd5e}
#countLabel{margin-right:auto;color:#f1c86f;font-size:13px;display:flex;align-items:center}
.list{display:grid;gap:10px}
.item{position:relative;border:1px solid rgba(239,189,94,.18);background:linear-gradient(145deg,#0c1218,#070b0f);border-radius:18px;padding:15px 14px;box-shadow:0 8px 24px #0005;cursor:pointer;transition:.18s}
.item:hover{transform:translateY(-1px);border-color:rgba(239,189,94,.42)}
.item.unread{border-color:rgba(239,189,94,.58);background:linear-gradient(145deg,#17160f,#0a0e12)}
.item.unread::after{content:"";position:absolute;top:13px;left:13px;width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 12px rgba(229,57,53,.65)}
.title{font-weight:900;font-size:15px;padding-left:18px}.body{color:#c8cdd2;line-height:1.65;margin-top:6px;font-size:13px;white-space:pre-wrap}.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;color:#7f8992;font-size:11px}
.type{border:1px solid rgba(239,189,94,.24);border-radius:999px;padding:3px 8px;color:#e9c679}
.section-badge{border:1px solid rgba(90,170,255,.30);border-radius:999px;padding:3px 8px;color:#9dcdff;background:rgba(34,96,150,.12)}
.notice-img{width:100%;max-height:290px;object-fit:cover;border-radius:14px;margin-top:11px;border:1px solid rgba(239,189,94,.16);display:block}
.content-preview{color:#aeb7bf;line-height:1.65;margin-top:9px;font-size:12px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.detail-modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center;padding:12px}
.detail-modal.show{display:flex}.detail-card{width:min(720px,100%);max-height:88vh;overflow:auto;background:linear-gradient(145deg,#101820,#070b0f);border:1px solid rgba(239,189,94,.38);border-radius:22px;padding:18px;box-shadow:0 25px 70px #000b}
.detail-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.detail-head h2{margin:0;color:#f2c66d;font-size:20px}.detail-close{border:1px solid rgba(239,189,94,.35);background:#0b1116;color:#fff;border-radius:10px;width:40px;height:40px;font-size:22px;cursor:pointer}.detail-summary{color:#d6dbe0;line-height:1.8;margin:14px 0;white-space:pre-wrap}.detail-content{color:#f2f2f2;line-height:1.95;white-space:pre-wrap;border-top:1px solid rgba(239,189,94,.16);padding-top:14px}.detail-image{width:100%;max-height:380px;object-fit:contain;background:#05080a;border-radius:16px;margin:12px 0}.detail-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.detail-actions a{background:linear-gradient(135deg,#c78d2f,#efbd5e);color:#171006;text-decoration:none;border-radius:11px;padding:11px 15px;font-weight:900}
.empty,.loading{border:1px dashed rgba(239,189,94,.25);border-radius:18px;padding:28px 16px;text-align:center;color:#9aa3aa}
.bottom{position:fixed;z-index:30;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(7,10,13,.97),#020406);border-top:1px solid rgba(239,189,94,.55);padding:6px max(6px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom))}
.bottom-inner{width:min(820px,100%);margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.bottom a{min-height:54px;border:1px solid rgba(239,189,94,.25);border-radius:12px;text-decoration:none;color:#f5f5f5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9px;font-weight:800;background:linear-gradient(180deg,#10171d,#060a0d)}
.bottom a.active{border-color:#efbd5e;color:#f4c96f;background:linear-gradient(145deg,#2a2112,#11100c)}
.bottom .ico{font-size:20px}
.toast{position:fixed;z-index:99;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:#111a20;border:1px solid rgba(239,189,94,.45);color:#fff;border-radius:14px;padding:11px 14px;opacity:0;pointer-events:none;transition:.2s;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:450px){.wrap{width:95%}.top h1{font-size:18px}.hero{padding:15px}.item{padding:14px 12px}.bottom a{font-size:8px;min-height:50px}.bottom .ico{font-size:18px}}

.ha-push-toggle{
  width:100%;border:1px solid rgba(239,189,94,.45);background:#10171d;color:#fff;
  border-radius:12px;padding:11px 12px;font-weight:800;cursor:pointer
}
.ha-push-toggle.on{background:linear-gradient(135deg,#2c6b34,#17461e);border-color:#58b765}

</style>
<script src="ha-theme.js"></script>
<link rel="stylesheet" href="ha-theme.css">

<link rel="stylesheet" href="ha-premium-blue-v2.css?v=20260926-1">
</head>
<body>
<header class="top">
  <a href="index.html">→ رجوع</a>
  <h1>🔔 الإشعارات</h1>
  <button id="refreshBtn" type="button">تحديث</button>
</header>

<main class="wrap">
  <section class="hero">
    <h2>مركز إشعارات HA Marketing</h2>
    <p>هنا تظهر إشعارات الطلبات والموافقات والرسائل والتحديثات المهمة المرتبطة بحسابك.</p>
  </section>

  <div class="toolbar">
    <button id="markAllBtn" class="primary" type="button">✓ تعليم الكل كمقروء</button>
    <button id="haPushButton" data-ha-push-button class="ha-push-toggle" type="button">🔕 تشغيل إشعارات الموبايل</button>
    <button id="clearReadBtn" type="button">🗑 حذف المقروء</button>
    <span id="countLabel">0 غير مقروء</span>
  </div>

  <div id="list" class="list"><div class="loading">جاري تحميل الإشعارات...</div></div>
</main>

<nav class="bottom">
  <div class="bottom-inner">
    <a href="index.html"><span class="ico">⌂</span><span>الرئيسية</span></a>
    <a class="active" href="notifications-center.html"><span class="ico">🔔</span><span>الإشعارات</span></a>
    <a href="orders-center.html"><span class="ico">📋</span><span>الطلبات</span></a>
    <a href="account.html"><span class="ico">👤</span><span>حسابي</span></a>
    <a href="call-us.html"><span class="ico">☎</span><span>اتصل بنا</span></a>
  </div>
</nav>

<div id="detailModal" class="detail-modal" aria-hidden="true">
  <div class="detail-card" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
    <div class="detail-head"><h2 id="detailTitle">تفاصيل الإشعار</h2><button id="detailClose" class="detail-close" type="button" aria-label="إغلاق">×</button></div>
    <div id="detailMeta" class="meta"></div>
    <img id="detailImage" class="detail-image" alt="صورة التبليغ" style="display:none">
    <div id="detailSummary" class="detail-summary"></div>
    <div id="detailContent" class="detail-content"></div>
    <div id="detailActions" class="detail-actions"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const SB_URL='https://ubayrhtshgtgggxprrek.supabase.co';
const SB_KEY='sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll';
const db=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});

let currentUser=null;
let rows=[];

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>t.classList.remove('show'),2200);
}
function fmtTime(v){
  try{
    const d=new Date(v), now=new Date(), diff=Math.floor((now-d)/1000);
    if(diff<60)return 'الآن';
    if(diff<3600)return `قبل ${Math.floor(diff/60)} دقيقة`;
    if(diff<86400)return `قبل ${Math.floor(diff/3600)} ساعة`;
    if(diff<604800)return `قبل ${Math.floor(diff/86400)} يوم`;
    return d.toLocaleString('ar-IQ',{dateStyle:'medium',timeStyle:'short'});
  }catch{return ''}
}
function typeLabel(v){
  const map={
    announcement:'تبليغ',news:'خبر',general:'عام',order:'طلب',approval:'موافقة',rejection:'رفض',
    chat:'دردشة',taxi:'تكسي',delivery:'توصيل',service:'خدمة',shop:'متجر',admin_broadcast:'تبليغ إداري'
  };
  return map[v]||v||'عام';
}
function sectionLabel(v){
  const map={general:'عام',shop:'تسوق الآن',services:'طلب خدمة',chat:'الدردشة',news:'آخر الأخبار',religious:'الأمور الدينية',study:'الدراسة',entertainment:'الترفيه',sports:'الرياضة',transport:'التكسي والمندوب',appointments:'المواعيد',employees:'الموظفين',users:'المستخدمين'};
  return map[v]||v||'';
}
function notifBody(n){return n.body||n.message||''}
function notifType(n){return n.type||n.notice_type||n.kind||'general'}
function notifSection(n){return n.section_key||n.department||''}
function notifLink(n){return n.link||n.link_url||''}
function render(){
  const list=document.getElementById('list');
  const unread=rows.filter(x=>!x.is_read).length;
  document.getElementById('countLabel').textContent=`${unread} غير مقروء`;

  if(!rows.length){
    list.innerHTML='<div class="empty">🔕 ما عندك إشعارات حالياً.</div>';
    return;
  }
  list.innerHTML='';
  rows.forEach(n=>{
    const item=document.createElement('article');
    item.className='item'+(!n.is_read?' unread':'');
    item.tabIndex=0;

    const title=document.createElement('div');
    title.className='title';
    title.textContent=n.title||'إشعار';

    const body=document.createElement('div');
    body.className='body';
    body.textContent=notifBody(n);

    const meta=document.createElement('div');
    meta.className='meta';
    const sec=notifSection(n);
    if(sec){const s=document.createElement('span');s.className='section-badge';s.textContent='القسم: '+sectionLabel(sec);meta.appendChild(s)}
    const type=document.createElement('span');
    type.className='type';
    type.textContent=typeLabel(notifType(n));
    const time=document.createElement('span');
    time.textContent=fmtTime(n.created_at);
    meta.append(type,time);

    item.append(title,body,meta);
    if(n.image_url){const img=document.createElement('img');img.className='notice-img';img.src=n.image_url;img.alt=n.title||'صورة التبليغ';img.loading='lazy';item.appendChild(img)}
    if(n.content){const cp=document.createElement('div');cp.className='content-preview';cp.textContent=n.content;item.appendChild(cp)}

    const open=()=>openNotification(n);
    item.addEventListener('click',open);
    item.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});
    list.appendChild(item);
  });
}
async function load(){
  if(!currentUser)return;
  const list=document.getElementById('list');
  list.innerHTML='<div class="loading">جاري تحميل الإشعارات...</div>';

  const {data,error}=await db
    .from('notifications')
    .select('*')
    .order('created_at',{ascending:false})
    .limit(100);

  if(error){
    console.error(error);
    list.innerHTML='<div class="empty">تعذر تحميل الإشعارات حالياً.</div>';
    return;
  }
  rows=data||[];
  render();
}
async function markRead(id){
  const {error}=await db.from('notifications').update({is_read:true}).eq('id',id);
  if(error)console.warn(error);
}
async function openNotification(n){
  if(!n.is_read){await markRead(n.id);n.is_read=true;render();}
  const rich=!!(n.content||n.image_url||notifSection(n)||notifType(n)==='news'||n.kind==='admin_broadcast');
  if(rich){
    detailTitle.textContent=n.title||'تفاصيل الإشعار';
    detailSummary.textContent=notifBody(n);
    detailContent.textContent=n.content||'';
    detailContent.style.display=n.content?'block':'none';
    const sec=notifSection(n),typ=notifType(n);
    detailMeta.innerHTML='';
    if(sec){const s=document.createElement('span');s.className='section-badge';s.textContent='القسم: '+sectionLabel(sec);detailMeta.appendChild(s)}
    const t=document.createElement('span');t.className='type';t.textContent=typeLabel(typ);detailMeta.appendChild(t);
    const tm=document.createElement('span');tm.textContent=fmtTime(n.created_at);detailMeta.appendChild(tm);
    if(n.image_url){detailImage.src=n.image_url;detailImage.style.display='block'}else{detailImage.removeAttribute('src');detailImage.style.display='none'}
    detailActions.innerHTML='';
    const link=String(notifLink(n)||'').trim();
    if(link&&/^(https?:\/\/|[a-zA-Z0-9_.-]+\.html(?:[?#].*)?$)/.test(link)){
      const a=document.createElement('a');a.href=link;a.textContent='فتح القسم';detailActions.appendChild(a);
    }
    detailModal.classList.add('show');detailModal.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';
    return;
  }
  const link=String(notifLink(n)||'').trim();
  if(link&&/^(https?:\/\/|[a-zA-Z0-9_.-]+\.html(?:[?#].*)?$)/.test(link))location.href=link;
}
function closeDetail(){detailModal.classList.remove('show');detailModal.setAttribute('aria-hidden','true');document.body.style.overflow=''}
async function markAll(){
  const ids=rows.filter(x=>!x.is_read).map(x=>x.id);
  if(!ids.length){toast('كل الإشعارات مقروءة');return}
  const {error}=await db.from('notifications').update({is_read:true}).in('id',ids);
  if(error){toast('تعذر تحديث الإشعارات');return}
  rows.forEach(x=>x.is_read=true);
  render();
  toast('تم تعليم الكل كمقروء');
}
async function clearRead(){
  const ids=rows.filter(x=>x.is_read).map(x=>x.id);
  if(!ids.length){toast('ماكو إشعارات مقروءة للحذف');return}
  if(!confirm('حذف جميع الإشعارات المقروءة؟'))return;
  const {error}=await db.from('notifications').delete().in('id',ids);
  if(error){toast('تعذر حذف الإشعارات');return}
  rows=rows.filter(x=>!x.is_read);
  render();
  toast('تم حذف الإشعارات المقروءة');
}
async function init(){
  if(!navigator.onLine){
    document.getElementById('list').innerHTML='<div class="empty">📡 تحتاج إنترنت لعرض أحدث الإشعارات.</div>';
    return;
  }

  const {data:{session}}=await db.auth.getSession();
  if(!session?.user || session.user.is_anonymous){
    location.replace('login.html');
    return;
  }
  currentUser=session.user;
  await load();

  db.channel('ha-notifications-center-'+currentUser.id)
    .on('postgres_changes',
      {event:'*',schema:'public',table:'notifications',filter:`user_id=eq.${currentUser.id}`},
      ()=>load()
    )
    .subscribe();
}
document.getElementById('refreshBtn').onclick=load;
document.getElementById('markAllBtn').onclick=markAll;
document.getElementById('clearReadBtn').onclick=clearRead;
detailClose.onclick=closeDetail;
detailModal.addEventListener('click',e=>{if(e.target===detailModal)closeDetail()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&detailModal.classList.contains('show'))closeDetail()});
init();
</script>

<script src="push-config.js"></script>
<script src="notifications.js"></script>
</body>
</html>
