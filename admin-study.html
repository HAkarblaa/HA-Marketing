<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة الدراسة - HA Marketing</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="ha-study-subjects.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#eef4f8;color:#15304b}.wrap{width:min(1100px,95%);margin:22px auto}.top{display:flex;justify-content:space-between;gap:10px}.top a{background:#fff;color:#087f61;padding:10px 14px;border-radius:12px;text-decoration:none}.card{background:#fff;border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 8px 24px #15304b0c}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.full{grid-column:1/-1}input,select,textarea{width:100%;padding:11px;border:1px solid #d5e0e4;border-radius:10px;font:inherit}textarea{min-height:90px}button{border:0;border-radius:11px;padding:11px 14px;background:#087f61;color:#fff;font:inherit;font-weight:900;cursor:pointer}.danger{background:#b72d45}.light{background:#edf4f2;color:#087f61}.item{border-top:1px solid #e7ecee;padding:12px 0}.item:first-child{border-top:0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.status{padding:10px;border-radius:10px;background:#f2f5f6;color:#60717d}.badge{padding:5px 9px;border-radius:999px;background:#eef2f4;font-size:11px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.tab{background:#edf4f2;color:#087f61}.tab.active{background:#087f61;color:#fff}.tab .count{margin-right:5px;font-size:11px}@media(max-width:720px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body>
<div class="wrap"><div class="top"><a href="admin-panel.html">← لوحة الإدارة</a><h1>📚 إدارة الدراسة</h1><a href="study.html">فتح الدراسة</a></div><div id="gate" class="card">جاري التحقق...</div>
<div id="adminContent" hidden>
<section class="card"><h2>طلبات انضمام الطلاب والمدرسين</h2>
<div class="tabs">
<button class="tab active" onclick="setStudyStatus('pending',this)">قيد المراجعة <span class="count" id="studyPendingCount">0</span></button>
<button class="tab" onclick="setStudyStatus('approved',this)">المقبولة <span class="count" id="studyApprovedCount">0</span></button>
<button class="tab" onclick="setStudyStatus('rejected',this)">المرفوضة <span class="count" id="studyRejectedCount">0</span></button>
</div>
<button onclick="loadRequests()">تحديث</button><div id="requests"></div></section>
<section class="card"><h2>اقتراحات الطلاب والمدرسين</h2><button onclick="loadSuggestions()">تحديث</button><div id="suggestions"></div></section>
<section class="card"><h2>إضافة ملف بأي قسم</h2><div class="grid">
<select id="mStage"><option value="">اختر المرحلة</option><option>ابتدائي</option><option>متوسط</option><option>إعدادي</option><option>متوسط متميزين</option><option>إعدادي متميزين</option><option>جامعي</option></select>
<input id="mGrade" placeholder="الصف - مثال: السادس الابتدائي">
<input id="mBranch" placeholder="الفرع - علمي/أدبي/مهني">
<input id="mSubject" placeholder="المادة - عربي/رياضيات/...">
<select id="mType"><option value="book">كتاب</option><option value="notes">ملزمة</option><option value="questions">أسئلة وزارية</option><option value="solutions">حلول</option><option value="lesson">درس</option><option value="video">فيديو</option></select>
<input id="mTitle" placeholder="عنوان الملف">
<textarea id="mDesc" class="full" placeholder="وصف مختصر"></textarea>
<input id="mFile" class="full" type="file">
<input id="mUrl" class="full" placeholder="أو رابط خارجي اختياري">
</div><button id="addMaterialBtn">رفع وإضافة الملف</button><div id="mStatus" class="status">الأدمن الرئيسي يقدر يضيف كتاب أو ملزمة أو وزاريات أو حلول لأي صف ومادة.</div></section>
<section class="card"><h2>الملفات الحالية</h2><button onclick="loadMaterials()">تحديث الملفات</button><div id="materials"></div></section>
</div></div>
<script>
const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});let me=null,studyStatus='pending';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function init(){const {data:{session}}=await db.auth.getSession();if(!session){location.href='login.html';return}me=session.user;const {data:ok}=await db.rpc('is_super_admin');if(!ok){gate.textContent='هذه الصفحة للأدمن الرئيسي فقط.';return}gate.textContent='✅ صلاحية الأدمن الرئيسي مفعلة';adminContent.hidden=false;loadRequests();loadSuggestions();loadMaterials()}
async function loadRequests(){
  requests.innerHTML='جاري التحميل...';
  const {data,error}=await db.from('study_access_profiles').select('*').order('created_at',{ascending:false});
  if(error){requests.textContent=error.message;return}
  const all=data||[];
  document.getElementById('studyPendingCount').textContent=all.filter(x=>x.status==='pending').length;
  document.getElementById('studyApprovedCount').textContent=all.filter(x=>x.status==='approved').length;
  document.getElementById('studyRejectedCount').textContent=all.filter(x=>x.status==='rejected').length;
  const arr=all.filter(x=>x.status===studyStatus);
  requests.innerHTML=arr.map(x=>`<div class="item"><div class="row"><b>${esc(x.full_name)} — ${x.role_type==='teacher'?'مدرس':'طالب'}</b><span class="badge">${x.status==='approved'?'مقبول':x.status==='rejected'?'مرفوض':'قيد المراجعة'}</span></div><div>${esc(x.phone)} — ${esc(x.governorate)} / ${esc(x.area)}</div><div>${esc(x.school_name)} — ${esc(x.stage_name)} — ${esc(x.grade_name)} ${esc(x.branch_name||'')}</div>${x.subject?`<div>المادة: ${esc(x.subject)}</div>`:''}<div>${esc(x.details||'')}</div>${x.admin_note?`<div>ملاحظة الإدارة: ${esc(x.admin_note)}</div>`:''}${x.status==='pending'?`<div class="row"><button onclick="reviewReq(${x.id},'approved')">موافقة</button><button class="danger" onclick="reviewReq(${x.id},'rejected')">رفض</button></div>`:''}</div>`).join('')||'لا توجد طلبات بهذه القائمة';
}
function setStudyStatus(s,btn){
  studyStatus=s;
  document.querySelectorAll('.tabs .tab').forEach(x=>x.classList.remove('active'));
  if(btn)btn.classList.add('active');
  loadRequests();
}
async function reviewReq(id,s){const note=prompt('ملاحظة الأدمن (اختياري):')||null;const {error}=await db.rpc('admin_review_study_access_request',{p_id:id,p_status:s,p_note:note});if(error)return alert(error.message);loadRequests()}
async function loadSuggestions(){suggestions.innerHTML='جاري التحميل...';const {data,error}=await db.from('study_suggestions').select('*').order('created_at',{ascending:false});if(error){suggestions.textContent=error.message;return}suggestions.innerHTML='';for(const x of (data||[])){let link='';if(x.attachment_path){const {data:s}=await db.storage.from('study-suggestions').createSignedUrl(x.attachment_path,3600);if(s?.signedUrl)link=`<a href="${s.signedUrl}" target="_blank">فتح المرفق</a>`}suggestions.innerHTML+=`<div class="item"><div class="row"><b>${esc(x.title)}</b><span class="badge">${esc(x.status)}</span></div><div>${esc(x.stage_name||'')} ${esc(x.grade_name||'')} ${esc(x.branch_name||'')}</div><p>${esc(x.details)}</p>${link}</div>`}if(!suggestions.innerHTML)suggestions.textContent='لا توجد اقتراحات'}
addMaterialBtn.onclick=async()=>{const f=mFile.files[0];if(!mStage.value||!mGrade.value.trim()||!mSubject.value.trim()||!mTitle.value.trim())return alert('أكمل المرحلة والصف والمادة والعنوان');addMaterialBtn.disabled=true;mStatus.textContent='جاري رفع الملف...';try{let fileUrl=null;if(f){const ext=(f.name.split('.').pop()||'bin').toLowerCase();const path='materials/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;const {error}=await db.storage.from('study-materials').upload(path,f,{upsert:false,contentType:f.type||undefined});if(error)throw error;fileUrl=db.storage.from('study-materials').getPublicUrl(path).data.publicUrl}
const {error}=await db.from('study_materials').insert({stage:mStage.value,grade:mGrade.value.trim(),branch_name:mBranch.value.trim()||null,subject:mSubject.value.trim(),title:mTitle.value.trim(),material_type:mType.value,description:mDesc.value.trim()||null,file_url:fileUrl,external_url:mUrl.value.trim()||null,created_by:me.id,is_active:true});if(error)throw error;mStatus.textContent='✅ تمت إضافة الملف.';mFile.value='';mTitle.value='';mDesc.value='';mUrl.value='';loadMaterials()}catch(e){mStatus.textContent='خطأ: '+e.message}finally{addMaterialBtn.disabled=false}}
async function loadMaterials(){materials.innerHTML='جاري التحميل...';const {data,error}=await db.from('study_materials').select('*').order('created_at',{ascending:false}).limit(100);if(error){materials.textContent=error.message;return}materials.innerHTML=(data||[]).map(x=>`<div class="item"><div class="row"><b>${esc(x.title)}</b><span class="badge">${esc(x.material_type)}</span></div><div>${esc(x.stage)} — ${esc(x.grade||'')} ${esc(x.branch_name||'')} — ${esc(x.subject)}</div><div class="row">${x.file_url?`<a href="${esc(x.file_url)}" target="_blank">فتح</a>`:''}<button class="danger" onclick="deleteMat(${x.id})">حذف</button></div></div>`).join('')||'لا توجد ملفات'}
async function deleteMat(id){if(!confirm('حذف هذا الملف من القائمة؟'))return;const {error}=await db.from('study_materials').delete().eq('id',id);if(error)return alert(error.message);loadMaterials()}
init();
</script></body></html>
