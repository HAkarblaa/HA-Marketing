<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة الدراسة</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f5f5}.top{background:#000;color:#fff;padding:12px 14px;display:flex;gap:10px;align-items:center}.top button{width:44px;height:44px;border:0;border-radius:10px;background:#fff;font-size:20px}.wrap{width:min(1000px,94%);margin:18px auto}.box,.item{background:#fff;border-radius:16px;padding:15px;box-shadow:0 3px 12px #0001;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}input,select,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;font:inherit}textarea{min-height:90px}.full{grid-column:1/-1}.btn{border:0;border-radius:10px;padding:11px 15px;background:#111;color:#fff;font-weight:700}.danger{background:#b91c1c}.muted{background:#eee;color:#111}.item{display:flex;gap:12px}.item img{width:80px;height:80px;object-fit:cover;border-radius:12px;background:#eee}.item .info{flex:1}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.status{padding:12px;border-radius:12px;margin-bottom:12px;background:#fff7d6}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.item img{width:65px;height:65px}}</style></head><body><div class="top"><button onclick="history.back()">←</button><h2 style="margin:0;font-size:19px">📚 إدارة قسم الدراسة</h2></div><main class="wrap"><div id="status" class="status">جاري التحقق من الصلاحية...</div><section class="box" id="formBox" hidden><h2 id="formTitle">إضافة مؤسسة أو مدرس</h2><div class="grid"><select id="type"><option>مدرسة</option><option>جامعة</option><option>معهد</option><option>مركز تقوية</option><option>مدرس خصوصي</option><option>دورة تدريبية</option></select><input id="name" placeholder="الاسم"><input id="governorate" placeholder="المحافظة"><input id="area" placeholder="المنطقة"><input id="phone" placeholder="رقم الهاتف"><input id="address" placeholder="العنوان"><input id="image_url" placeholder="رابط الصورة (اختياري)"><input id="map_url" placeholder="رابط الموقع/الخريطة"><input id="sort_order" type="number" value="100" placeholder="الترتيب"><select id="is_active"><option value="true">ظاهر</option><option value="false">مخفي</option></select><textarea id="description" class="full" placeholder="الوصف والتفاصيل"></textarea><div class="full"><button class="btn" onclick="save()">حفظ</button> <button class="btn muted" onclick="resetForm()">تفريغ</button></div></div></section><section><div id="list"></div></section></main><script>
const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});let editId=null,me=null;const SUPER='f65185bb-1761-42c0-b358-1b0277555e24';function e(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function init(){const {data:{session}}=await db.auth.getSession();if(!session)return location.href='login.html';me=session.user;let ok=me.id===SUPER,isSuper=ok;try{const {data:a}=await db.from('app_admins').select('is_super_admin,is_active').eq('user_id',me.id).maybeSingle();isSuper=isSuper||!!(a?.is_active&&a?.is_super_admin);ok=ok||isSuper;if(a?.is_active&&!isSuper){const {data:p}=await db.from('app_admin_permissions').select('section_key,can_manage,can_create,can_edit,can_delete').eq('admin_user_id',me.id).eq('section_key','study').maybeSingle();ok=!!p&&(p.can_manage||p.can_create||p.can_edit||p.can_delete)}}catch{}if(!ok){status.textContent='لا تملك صلاحية إدارة الدراسة.';return}status.textContent=isSuper?'✅ Super Admin — إضافة وتعديل وحذف بكل محتوى الدراسة.':'✅ لديك صلاحية إدارة قسم الدراسة.';formBox.hidden=false;load()}
async function load(){const {data,error}=await db.from('study_directory').select('*').order('sort_order').order('created_at',{ascending:false});if(error){list.innerHTML='<div class="box">'+e(error.message)+'</div>';return}list.innerHTML=(data||[]).map(v=>`<div class="item"><img src="${e(v.image_url||'main.jpg')}" onerror="this.src='main.jpg'"><div class="info"><b>${e(v.name)}</b><div>${e(v.type)} • ${e(v.governorate||'')} ${e(v.area||'')}</div><small>${v.is_active?'ظاهر':'مخفي'} • ${e(v.phone||'')}</small><div class="actions"><button class="btn muted" onclick='edit(${JSON.stringify(v)})'>تعديل</button><button class="btn danger" onclick="del(${v.id})">حذف</button></div></div></div>`).join('')||'<div class="box">لا توجد عناصر.</div>'}
async function save(){if(!name.value.trim())return alert('اكتب الاسم');const p={type:type.value,name:name.value.trim(),governorate:governorate.value.trim(),area:area.value.trim(),phone:phone.value.trim(),address:address.value.trim(),image_url:image_url.value.trim()||null,map_url:map_url.value.trim()||null,description:description.value.trim(),sort_order:+sort_order.value||100,is_active:is_active.value==='true',created_by:me.id};const q=editId?db.from('study_directory').update(p).eq('id',editId):db.from('study_directory').insert(p);const {error}=await q;if(error)return alert(error.message);resetForm();load()}
function edit(v){editId=v.id;formTitle.textContent='تعديل: '+v.name;['type','name','governorate','area','phone','address','image_url','map_url','description','sort_order'].forEach(k=>document.getElementById(k).value=v[k]??'');is_active.value=String(v.is_active);scrollTo({top:0,behavior:'smooth'})}function resetForm(){editId=null;formTitle.textContent='إضافة مؤسسة أو مدرس';['name','governorate','area','phone','address','image_url','map_url','description'].forEach(k=>document.getElementById(k).value='');sort_order.value=100;is_active.value='true'}async function del(id){if(!confirm('متأكد من الحذف؟'))return;const {error}=await db.from('study_directory').delete().eq('id',id);if(error)return alert(error.message);load()}init();</script></body></html>
