<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>قريباً - HA Marketing</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f5f5f5;color:#111;display:grid;place-items:center;min-height:100vh}.card{width:min(92%,520px);background:#fff;border-radius:20px;padding:28px 20px;text-align:center;box-shadow:0 8px 30px #0001}.icon{font-size:54px}.title{font-size:24px;font-weight:800;margin:10px 0}.sub{color:#666;line-height:1.8}.btn{margin-top:18px;border:0;border-radius:12px;background:#111;color:#fff;padding:12px 22px;font-size:15px}</style></head><body><div class="card"><div class="icon">🛠️</div><div class="title">قريباً</div><div class="sub" id="msg">هذا القسم قيد التجهيز حالياً.</div><button class="btn" onclick="history.back()">رجوع</button></div><script>const p=new URLSearchParams(location.search);const s=p.get('section');if(s)document.getElementById('msg').textContent='قسم '+decodeURIComponent(s)+' قيد التجهيز حالياً.';</script></body></html>
