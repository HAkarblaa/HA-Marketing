<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة تجربة الرئيسية - HA Marketing</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f4f7f5;color:#173f32}.wrap{width:94%;max-width:760px;margin:28px auto}.card{background:#fff;border:1px solid #e3ebe6;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 8px 25px #0a60420d}h1{font-size:24px}label{display:block;font-weight:700;margin:13px 0 6px}input,textarea{width:100%;border:1px solid #cfddd5;border-radius:12px;padding:12px;font:inherit}textarea{min-height:100px;resize:vertical}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.btn,button{border:0;border-radius:12px;padding:11px 15px;background:#087f5b;color:#fff;text-decoration:none;font-weight:700;cursor:pointer}.light{background:#edf3ef;color:#234c3d}.muted{color:#6b7b74;font-size:13px;line-height:1.8}.ok{background:#eaf8f1;color:#087f5b;border-radius:12px;padding:10px 12px;margin-top:10px;display:none}.bad{background:#fff0f1;color:#9d2433;border-radius:12px;padding:10px 12px;margin-top:10px;display:none}</style></head><body><div class="wrap"><div class="row"><h1 style="flex:1">⚙️ تجربة الصفحة الرئيسية</h1><a class="btn light" href="admin.html">← الإدارة</a></div><div id="gate" class="card">جاري التحقق من الصلاحية...</div><div id="panel" class="card" style="display:none"><label>العنوان الرئيسي</label><input id="title" maxlength="80"><label>النص التعريفي</label><textarea id="subtitle" maxlength="260"></textarea><label>ملاحظة أو إعلان خفيف</label><textarea id="note" maxlength="220" placeholder="اتركه فارغاً إذا ما تريد رسالة إضافية"></textarea><label class="row"><input id="enabled" type="checkbox" style="width:auto"> تفعيل هذا المحتوى</label><div class="row" style="margin-top:16px"><button id="save">حفظ التغييرات</button><a class="btn light" href="index.html">معاينة الرئيسية</a></div><div id="ok" class="ok">تم الحفظ.</div><div id="bad" class="bad"></div><p class="muted">إذا ظهرت رسالة أن الجدول غير موجود، شغّل ملف HOME-EXPERIENCE-SETUP.sql مرة واحدة داخل Supabase SQL Editor.</p></div></div><script>
const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});
async function init(){const u=await db.auth.getUser(),me=u?.data?.user;if(!me){gate.textContent='يجب تسجيل الدخول.';return}const p=await db.from('profiles').select('account_type').eq('id',me.id).maybeSingle();if(p.data?.account_type!=='admin'){gate.textContent='لا تملك صلاحية الإدارة.';return}gate.textContent='تم التحقق من حساب الأدمن.';panel.style.display='block';const r=await db.from('home_experience_settings').select('*').eq('slug','home').maybeSingle();if(r.error){bad.style.display='block';bad.textContent=r.error.message;return}title.value=r.data?.title||'';subtitle.value=r.data?.subtitle||'';note.value=r.data?.note||'';enabled.checked=r.data?.enabled!==false;save.onclick=async()=>{ok.style.display=bad.style.display='none';const x=await db.from('home_experience_settings').upsert({slug:'home',title:title.value.trim(),subtitle:subtitle.value.trim(),note:note.value.trim()||null,enabled:enabled.checked,updated_at:new Date().toISOString(),updated_by:me.id});if(x.error){bad.style.display='block';bad.textContent=x.error.message}else{ok.style.display='block'}}}init();
</script></body></html>
