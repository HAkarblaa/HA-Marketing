<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>معلومات عامة - HA Marketing</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f5f5f5;color:#111}.wrap{width:95%;max-width:1000px;margin:28px auto}h1{text-align:center}.sub{text-align:center;color:#666}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 4px 14px #0001}
.pic{height:150px;border-radius:14px;background:linear-gradient(135deg,#f0f0f0,#fff);display:flex;align-items:center;justify-content:center;font-size:75px;margin-bottom:12px}
.card h2{margin:0 0 5px}.fact{font-weight:700;margin-bottom:8px}.desc{color:#666;line-height:1.8}.back{display:block;text-align:center;margin:25px;text-decoration:none;color:#111}
@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><h1>💡 معلومات عامة</h1><p class="sub">اسم + صورة توضيحية + معلومة سريعة + شرح مبسط.</p><div id="grid" class="grid"></div><a class="back" href="entertainment.html">← الرجوع إلى الترفيه</a></div>
<script>const DATA=[["الأرض", "🌍", "الكوكب الذي نعيش عليه", "الأرض ثالث كواكب المجموعة الشمسية قرباً من الشمس، وتغطي المياه معظم سطحها."], ["الشمس", "☀️", "نجم مجموعتنا الشمسية", "الشمس نجم ضخم يوفر الضوء والحرارة، وتدور حولها كواكب المجموعة الشمسية."], ["القلب", "❤️", "مضخة الجسم الأساسية", "القلب عضو عضلي يضخ الدم عبر الأوعية الدموية ليصل الأكسجين والمواد الغذائية إلى أنحاء الجسم."], ["الدماغ", "🧠", "مركز التحكم في الجسم", "الدماغ يدير الحركة والذاكرة والحواس واللغة ووظائف كثيرة أخرى عبر الجهاز العصبي."], ["النحل", "🐝", "حشرات مهمة للتلقيح", "يسهم النحل في تلقيح كثير من النباتات، وهو جزء مهم من الأنظمة البيئية والزراعة."], ["الأخطبوط", "🐙", "حيوان بحري ذكي", "للأخطبوط ثمانية أذرع وجهاز عصبي معقد، ويشتهر بقدرته على التمويه وحل بعض المشكلات."], ["الأهرامات", "🔺", "معالم أثرية شهيرة", "أهرامات الجيزة في مصر من أشهر آثار العالم القديم، وبُنيت قبل آلاف السنين."], ["القمر", "🌙", "تابع الأرض الطبيعي", "القمر يدور حول الأرض ويؤثر في المد والجزر، وتتغير أطواره كما نراها من الأرض."], ["المحيط الهادئ", "🌊", "أكبر محيط على الأرض", "المحيط الهادئ هو الأكبر مساحة بين محيطات العالم ويمتد بين آسيا والأمريكيتين."], ["اللغة العربية", "🔤", "إحدى اللغات العالمية الكبرى", "العربية لغة واسعة الانتشار وتتميز بنظام كتابي من اليمين إلى اليسار وتراث أدبي كبير."], ["الجاذبية", "🪐", "قوة تجذب الأجسام", "الجاذبية هي القوة التي تجعل الأجسام ذات الكتلة تتجاذب، وهي التي تبقينا على سطح الأرض."], ["الماء", "💧", "أساس الحياة", "الماء ضروري للكائنات الحية، ويوجد في الطبيعة في حالات سائلة وصلبة وغازية."]];document.getElementById('grid').innerHTML=DATA.map(x=>`<article class="card"><div class="pic">${x[1]}</div><h2>${x[0]}</h2><div class="fact">${x[2]}</div><div class="desc">${x[3]}</div></article>`).join('');</script></body></html>
