<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حذف الحساب - HA Marketing</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;background:#f5f5f5;margin:0;color:#111}.w{max-width:620px;margin:35px auto;padding:16px}.c{background:#fff;padding:22px;border-radius:16px}textarea,button,a{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;margin-top:12px;font-size:16px}textarea{min-height:110px;border:1px solid #ccc}button{border:0;background:#b00020;color:#fff}.back{display:block;text-align:center;background:#eee;color:#111;text-decoration:none}</style></head><body><div class="w"><div class="c"><h1>حذف الحساب</h1><p>يمكنك إرسال طلب حذف حسابك وبياناته المرتبطة. بعد إرسال الطلب سيظهر لك رقم الطلب.</p><textarea id="reason" placeholder="سبب الحذف (اختياري)"></textarea><button id="go">إرسال طلب حذف الحساب</button><div id="msg"></div><a class="back" href="account.html">الرجوع إلى الحساب</a></div></div><script>const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,storageKey:'ha-marketing-auth'}});go.onclick=async()=>{go.disabled=true;msg.textContent='جاري الإرسال...';const {data:{session}}=await db.auth.getSession();if(!session){location.href='login.html';return}const {data,error}=await db.rpc('request_account_deletion',{p_reason:reason.value.trim()||null});go.disabled=false;if(error){msg.textContent=error.message;return}msg.textContent='تم إرسال طلب حذف الحساب. رقم الطلب: '+data};</script></body></html>
