<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محتوى الصف - HA Marketing</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#06090c;color:#fff;font-family:Tahoma,Arial}.wrap{width:min(94%,900px);margin:16px auto 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.btn,button{padding:10px 13px;border:1px solid #3c4a55;border-radius:12px;background:#12181d;color:#fff;text-decoration:none;font:inherit;cursor:pointer}.gold{border-color:#9b7429!important;color:#f0c86b!important;background:#1a140b!important}.hero,.card{background:linear-gradient(145deg,#11181d,#080c0f);border:1px solid #36434e;border-radius:20px;padding:15px;margin:12px 0}.hero{text-align:center}.hero h1{color:#f0c86b;margin:0}.form{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}input,textarea{width:100%;padding:11px;border:1px solid #3d4a55;border-radius:11px;background:#0a0f13;color:#fff;font:inherit}textarea{min-height:95px}.item h3{margin:0 0 7px;color:#f0c86b}.muted{color:#aeb7bf;font-size:12px;line-height:1.7}.actions{display:flex;gap:7px;margin-top:10px}.teacher-form{display:none}.teacher .teacher-form{display:block}@media(max-width:600px){.form{grid-template-columns:1fr}.full{grid-column:auto}}</style><script src="ha-theme.js"></script><link rel="stylesheet" href="ha-theme.css"></head><body><div class="wrap"><div class="top"><a class="btn" id="back" href="courses.html">← الصف</a><b>HA Marketing</b><span></span></div><div class="hero"><h1 id="title">المحتوى</h1></div><section class="card teacher-form"><div class="form"><input id="itemTitle" placeholder="العنوان"><input id="itemDate" type="datetime-local"><input id="itemUrl" class="full" placeholder="رابط (اختياري)"><textarea id="itemBody" class="full" placeholder="التفاصيل"></textarea><button class="gold full" onclick="addItem()">➕ إضافة</button></div></section><div id="list"><div class="card muted">جاري التحميل...</div></div></div><script>
const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});const q=new URLSearchParams(location.search),classId=q.get('class'),type=q.get('type')||'lesson';const N={calendar:'📅 التقويم',handout:'📚 الملازم',exam:'📝 الامتحانات',question:'❓ الأسئلة',lesson:'🎥 الدروس',assignment:'✅ الواجبات',announcement:'📢 الإعلانات',schedule:'🗓️ جدول الحصص',link:'🔗 روابط مهمة'};let me=null,isTeacher=false;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.getElementById('title').textContent=N[type]||'المحتوى';document.getElementById('back').href='study-class.html?class='+encodeURIComponent(classId||'');
async function init(){const {data:{session}}=await db.auth.getSession();if(!session)return location.href='login.html';me=session.user;const {data:c}=await db.from('study_classes').select('teacher_user_id').eq('id',classId).maybeSingle();if(!c)return;isTeacher=c.teacher_user_id===me.id;if(isTeacher)document.body.classList.add('teacher');load()}
async function load(){const {data,error}=await db.from('study_class_content').select('*').eq('class_id',classId).eq('content_type',type).order('event_date',{ascending:false,nullsFirst:false}).order('created_at',{ascending:false});const el=document.getElementById('list');if(error){el.innerHTML='<div class="card">'+esc(error.message)+'</div>';return}el.innerHTML=(data||[]).map(x=>`<div class="card item"><h3>${esc(x.title)}</h3>${x.event_date?`<div class="muted">📅 ${new Date(x.event_date).toLocaleString('ar-IQ')}</div>`:''}<div>${esc(x.body||'').replace(/\n/g,'<br>')}</div>${x.url?`<div class="actions"><a class="btn gold" href="${esc(x.url)}" target="_blank" rel="noopener">فتح الرابط</a></div>`:''}${isTeacher?`<div class="actions"><button onclick="delItem(${x.id})">حذف</button></div>`:''}</div>`).join('')||'<div class="card muted">لا يوجد محتوى بعد.</div>'}
async function addItem(){if(!isTeacher)return;const title=itemTitle.value.trim();if(!title)return alert('اكتب العنوان');const {error}=await db.from('study_class_content').insert({class_id:Number(classId),teacher_user_id:me.id,content_type:type,title,body:itemBody.value.trim()||null,url:itemUrl.value.trim()||null,event_date:itemDate.value?new Date(itemDate.value).toISOString():null});if(error)return alert(error.message);itemTitle.value='';itemBody.value='';itemUrl.value='';itemDate.value='';load()}
async function delItem(id){if(!confirm('حذف؟'))return;const {error}=await db.from('study_class_content').delete().eq('id',id);if(error)alert(error.message);else load()}init();
</script></body></html>
