<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نسيت كلمة المرور - HA Marketing</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#111}
.box{width:92%;max-width:500px;margin:55px auto;background:#fff;padding:25px;border-radius:18px;box-shadow:0 5px 20px #0001}
h1{text-align:center}
p{line-height:1.8;color:#555}
input,button,a{width:100%;padding:13px;margin:7px 0;border-radius:10px;font-size:16px}
input{border:1px solid #ccc}
button{border:0;background:#111;color:#fff;cursor:pointer}
a{display:block;text-align:center;text-decoration:none;background:#eee;color:#111}
.notice{background:#f5f5f5;border-radius:12px;padding:14px;margin:15px 0}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body>
<div class="box">
<h1>🔑 نسيت كلمة المرور؟</h1>
<p>اكتب رقم الموبايل المرتبط بحسابك.</p>
<input id="phone" type="tel" placeholder="07XXXXXXXXX">
<button type="button" onclick="requestReset()">طلب استرجاع الحساب</button>
<div id="result" class="notice" style="display:none"></div>
<a href="login.html">← الرجوع إلى تسجيل الدخول</a>
</div>
<script>
const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll');
function normalizePhone(v){
  v=String(v||'').replace(/\D/g,'');
  if(v.startsWith('00964'))v=v.slice(2);
  if(v.startsWith('964'))return v;
  if(v.startsWith('07'))return '964'+v.slice(1);
  return v;
}
async function requestReset(){
  const value=document.getElementById('phone').value.trim();
  const result=document.getElementById('result');
  const phone=normalizePhone(value);
  if(!/^9647\d{9}$/.test(phone)){
    alert('اكتب رقم عراقي صحيح يبدأ بـ 07 ويتكون من 11 رقم');return;
  }
  result.style.display='block';result.textContent='جاري إرسال الطلب...';
  const {data,error}=await db.rpc('request_password_reset',{p_phone:phone});
  if(error){result.textContent='تعذر تسجيل الطلب: '+error.message;return;}
  result.textContent='تم تسجيل طلب استرجاع الحساب رقم #'+data+'. سيظهر للإدارة للتحقق من صاحب الحساب قبل تغيير كلمة المرور.';
}
</script>
</body>
</html>
