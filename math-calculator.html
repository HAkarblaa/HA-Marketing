<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الحاسبة وحل المعادلات</title><script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/13.2.0/math.min.js"></script><script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/all.min.js"></script><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f5f5;color:#111}.top{background:#000;color:#fff;padding:12px 14px;display:flex;gap:10px;align-items:center}.top button{width:44px;height:44px;border:0;border-radius:10px;background:#fff;font-size:21px}.top h1{margin:0;font-size:19px}.wrap{width:min(920px,94%);margin:18px auto 40px}.box{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 3px 14px #0001}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tabs button{border:1px solid #ddd;background:#fff;border-radius:999px;padding:9px 13px}.tabs .on{background:#111;color:#fff}.pane{display:none}.pane.show{display:block}input,textarea{width:100%;padding:13px;border:1px solid #ccc;border-radius:12px;font:inherit;margin:8px 0}textarea{min-height:110px}.btn{border:0;background:#111;color:#fff;border-radius:12px;padding:12px 16px;font-weight:700}.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:10px}.keys button{padding:12px 5px;border:1px solid #ddd;background:#f8f8f8;border-radius:10px}.out{background:#f7f7f7;border-radius:12px;padding:14px;white-space:pre-wrap;line-height:1.7;min-height:60px}.preview{max-width:100%;max-height:300px;border-radius:12px;display:none;margin:8px auto}.progress{height:8px;background:#eee;border-radius:999px;overflow:hidden;margin:10px 0}.progress span{display:block;height:100%;width:0;background:#111;transition:.2s}@media(max-width:600px){.keys{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div class="top"><button onclick="history.back()">←</button><h1>🧮 الحاسبة وحل المعادلات</h1></div><main class="wrap"><div class="tabs"><button class="on" onclick="show('simple',this)">بسيطة</button><button onclick="show('advanced',this)">متقدمة</button><button onclick="show('image',this)">حل من صورة</button></div>
<section id="simple" class="pane show"><div class="box"><h2>حاسبة بسيطة</h2><input id="expr" dir="ltr" placeholder="مثال: (25+7)*3/2"><div class="keys"><button onclick="k('7')">7</button><button onclick="k('8')">8</button><button onclick="k('9')">9</button><button onclick="k('/')">÷</button><button onclick="k('4')">4</button><button onclick="k('5')">5</button><button onclick="k('6')">6</button><button onclick="k('*')">×</button><button onclick="k('1')">1</button><button onclick="k('2')">2</button><button onclick="k('3')">3</button><button onclick="k('-')">−</button><button onclick="k('0')">0</button><button onclick="k('.')">.</button><button onclick="calc()">=</button><button onclick="k('+')">+</button></div></div><div class="box"><div id="out" class="out">النتيجة تظهر هنا.</div></div></section>
<section id="advanced" class="pane"><div class="box"><h2>معادلات ودوال</h2><p>أمثلة: <b>x^2-5*x+6=0</b> أو <b>diff(x^3+2*x,x)</b> أو <b>integrate(x^2,x)</b></p><input id="adv" dir="ltr" placeholder="اكتب المعادلة أو التعبير"><div class="keys"><button onclick="a('x')">x</button><button onclick="a('^')">xʸ</button><button onclick="a('sqrt(')">√</button><button onclick="a('sin(')">sin</button><button onclick="a('cos(')">cos</button><button onclick="a('tan(')">tan</button><button onclick="a('log(')">log</button><button onclick="a('pi')">π</button><button onclick="a('(')">(</button><button onclick="a(')')">)</button></div><button class="btn" onclick="solveAdv()">حل</button></div><div class="box"><div id="advOut" class="out">—</div></div></section>
<section id="image" class="pane"><div class="box"><h2>📷 حل مسألة من صورة</h2><p>ارفع صورة واضحة للمعادلة. تتم قراءة النص من الصورة ثم محاولة حله. كلما كانت الكتابة مطبوعة وواضحة تكون النتيجة أفضل.</p><input id="photo" type="file" accept="image/*" capture="environment" onchange="preview()"><img id="prev" class="preview"><div class="progress"><span id="bar"></span></div><button class="btn" onclick="readImage()">قراءة وحل الصورة</button></div><div class="box"><h3>النص المقروء</h3><textarea id="ocr" dir="ltr" placeholder="يمكنك تصحيح النص هنا ثم الضغط على حل"></textarea><button class="btn" onclick="solveOCR()">حل النص</button></div><div class="box"><div id="imgOut" class="out">—</div></div></section></main>
<script>
function show(id,b){document.querySelectorAll('.pane').forEach(x=>x.classList.remove('show'));document.getElementById(id).classList.add('show');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}function k(v){expr.value+=v;expr.focus()}function a(v){adv.value+=v;adv.focus()}function calc(){try{out.textContent=math.evaluate(expr.value)}catch(e){out.textContent='تعذر الحساب. تأكد من الصيغة.'}}
function solveString(s){s=s.trim().replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/√/g,'sqrt');if(!s)throw Error();if(s.includes('=')){const p=s.split('=');return 'الحل: '+nerdamer.solveEquations(p[0]+'=('+p.slice(1).join('=')+')','x').toString()}return 'النتيجة: '+nerdamer(s).evaluate().toString()+'\nالتبسيط: '+nerdamer(s).expand().toString()}
function solveAdv(){try{advOut.textContent=solveString(adv.value)}catch(e){try{advOut.textContent=nerdamer(adv.value).toString()}catch(x){advOut.textContent='تعذر حل الصيغة. جرّب كتابة * للضرب مثل 2*x.'}}}
function preview(){const f=photo.files[0];if(!f)return;prev.src=URL.createObjectURL(f);prev.style.display='block'}
async function readImage(){const f=photo.files[0];if(!f)return alert('اختر صورة أولاً');imgOut.textContent='جاري قراءة الصورة...';bar.style.width='0%';try{const r=await Tesseract.recognize(f,'eng',{logger:m=>{if(m.progress)bar.style.width=Math.round(m.progress*100)+'%'}});ocr.value=(r.data.text||'').trim();imgOut.textContent='تمت القراءة. راجع النص ثم اضغط حل، أو سيجري الحل الآن.';solveOCR()}catch(e){imgOut.textContent='تعذرت قراءة الصورة. جرّب صورة أوضح أو اكتب المعادلة يدوياً.'}}
function solveOCR(){try{let s=ocr.value.replace(/\s+/g,'').replace(/[Oo]/g,'0');imgOut.textContent=solveString(s)}catch(e){imgOut.textContent='لم أستطع حل النص المقروء. صحح المعادلة في المربع ثم اضغط حل.'}}
</script></body></html>
