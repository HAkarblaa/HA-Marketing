<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>الحاسبة وحل المعادلات</title><script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/13.2.0/math.min.js"></script><script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/all.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#111}.top{height:74px;background:#000;color:#fff;display:flex;align-items:center;padding:10px 16px;gap:12px;position:sticky;top:0;z-index:2}.top button{width:54px;height:54px;border:0;border-radius:15px;background:#fff;font-size:24px}.top h1{margin:0;font-size:22px;flex:1;text-align:center}.wrap{width:min(620px,94%);margin:16px auto 35px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.tabs button{height:52px;border:1px solid #ddd;border-radius:16px;background:#fff;font-size:18px}.tabs .on{background:#111;color:#fff}.pane{display:none}.pane.show{display:block}.card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 4px 18px #0000000d}.display{width:100%;height:72px;border:1px solid #d8d8d8;border-radius:16px;padding:12px 16px;font-size:27px;text-align:left;direction:ltr;background:#fafafa;margin-bottom:12px}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.keys button{height:62px;border:1px solid #ddd;border-radius:16px;background:#f8f8f8;font-size:23px}.keys .op{font-weight:700}.keys .eq{background:#111;color:#fff}.result{margin-top:14px;background:#fff;border-radius:20px;padding:18px;box-shadow:0 4px 18px #0000000d;min-height:75px;font-size:20px;line-height:1.7}.advkeys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.advkeys button{height:48px;border:1px solid #ddd;border-radius:12px;background:#f8f8f8;font-size:16px}.solve{width:100%;height:52px;border:0;border-radius:14px;background:#111;color:#fff;font-size:18px;font-weight:700}.hint{color:#666;line-height:1.7}.advinput{width:100%;height:58px;border:1px solid #ccc;border-radius:14px;padding:12px;font-size:19px;direction:ltr;text-align:left}@media(max-width:420px){.top h1{font-size:19px}.keys button{height:58px}.display{font-size:24px}}
</style></head><body><header class="top"><button onclick="history.back()">←</button><h1>🧮 الحاسبة وحل المعادلات</h1></header><main class="wrap"><div class="tabs"><button class="on" onclick="showPane('simple',this)">حاسبة</button><button onclick="showPane('advanced',this)">معادلات</button></div>
<section id="simple" class="pane show"><div class="card"><input id="expr" class="display" inputmode="decimal" placeholder="0" readonly><div class="keys"><button onclick="clearCalc()">C</button><button onclick="backCalc()">⌫</button><button class="op" onclick="key('(')">(</button><button class="op" onclick="key('/')">÷</button><button onclick="key('7')">7</button><button onclick="key('8')">8</button><button onclick="key('9')">9</button><button class="op" onclick="key('*')">×</button><button onclick="key('4')">4</button><button onclick="key('5')">5</button><button onclick="key('6')">6</button><button class="op" onclick="key('-')">−</button><button onclick="key('1')">1</button><button onclick="key('2')">2</button><button onclick="key('3')">3</button><button class="op" onclick="key('+')">+</button><button onclick="key('0')">0</button><button onclick="key('.')">.</button><button onclick="key(')')">)</button><button class="eq" onclick="calculate()">=</button></div></div><div id="result" class="result">النتيجة تظهر هنا.</div></section>
<section id="advanced" class="pane"><div class="card"><h2>حل المعادلات</h2><p class="hint">مثال: x^2-5*x+6=0 أو sqrt(81) أو sin(pi/2)</p><input id="adv" class="advinput" placeholder="اكتب المعادلة"><div class="advkeys"><button onclick="addAdv('x')">x</button><button onclick="addAdv('^')">xʸ</button><button onclick="addAdv('sqrt(')">√</button><button onclick="addAdv('pi')">π</button><button onclick="addAdv('sin(')">sin</button><button onclick="addAdv('cos(')">cos</button><button onclick="addAdv('tan(')">tan</button><button onclick="addAdv('log(')">log</button></div><button class="solve" onclick="solveAdv()">حل</button></div><div id="advResult" class="result">النتيجة تظهر هنا.</div></section></main><script>
function showPane(id,b){document.querySelectorAll('.pane').forEach(x=>x.classList.remove('show'));document.getElementById(id).classList.add('show');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}
function key(v){document.getElementById('expr').value+=v}function clearCalc(){document.getElementById('expr').value='';document.getElementById('result').textContent='النتيجة تظهر هنا.'}function backCalc(){let x=document.getElementById('expr');x.value=x.value.slice(0,-1)}function calculate(){let x=document.getElementById('expr');try{let v=math.evaluate(x.value||'0');document.getElementById('result').textContent='النتيجة: '+v;x.value=String(v)}catch(e){document.getElementById('result').textContent='تأكد من العملية ثم حاول مرة ثانية.'}}
function addAdv(v){let x=document.getElementById('adv');x.value+=v;x.focus()}function solveAdv(){let s=document.getElementById('adv').value.trim(),o=document.getElementById('advResult');if(!s){o.textContent='اكتب المعادلة أولاً.';return}try{if(s.includes('=')){let p=s.split('=');o.textContent='الحل: '+nerdamer.solveEquations(p[0]+'=('+p.slice(1).join('=')+')','x').toString()}else{o.textContent='النتيجة: '+nerdamer(s).evaluate().toString()}}catch(e){o.textContent='تعذر حل المعادلة. استخدم * للضرب مثل 2*x.'}}
</script></body></html>
