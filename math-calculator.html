<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الحاسبة وحل المعادلات</title><script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/13.2.0/math.min.js"></script><script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/all.min.js"></script><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7fb}.top{background:#111;color:#fff;padding:12px;display:flex;gap:10px;align-items:center}.top button{width:44px;height:44px;border:0;border-radius:10px}.w{width:min(980px,94%);margin:18px auto}.tabs{display:flex;gap:6px;overflow:auto}.tabs button,.btn{border:0;background:#111;color:#fff;border-radius:12px;padding:11px 14px}.tabs button{background:#fff;color:#111;border:1px solid #ddd;white-space:nowrap}.tabs .on{background:#111;color:#fff}.p{display:none}.p.show{display:block}.c{background:#fff;padding:16px;border-radius:18px;margin:12px 0;box-shadow:0 3px 14px #0001}input,textarea,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:11px;margin:6px 0;font:inherit}.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.keys button{padding:11px 4px;border:1px solid #ddd;border-radius:10px;background:#f8f8f8}.out{white-space:pre-wrap;background:#f7f8fa;border-radius:12px;padding:13px;min-height:60px;line-height:1.8}video,img{width:100%;max-height:360px;object-fit:contain;background:#111;border-radius:12px;display:none}.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{flex:1}@media(max-width:600px){.keys{grid-template-columns:repeat(4,1fr)}}</style></head><body><div class=top><button onclick="history.back()">←</button><b>🧮 الحاسبة المتقدمة</b></div><div class=w><div class=tabs><button class=on onclick="tab('calc',this)">حاسبة</button><button onclick="tab('alg',this)">جبر ومعادلات</button><button onclick="tab('tools',this)">أدوات</button><button onclick="tab('photo',this)">📷 تصوير</button></div><section id=calc class="p show"><div class=c><input id=e dir=ltr placeholder="مثال: sin(pi/2)+sqrt(81)"><div class=keys><button onclick="k('7')">7</button><button onclick="k('8')">8</button><button onclick="k('9')">9</button><button onclick="k('/')">÷</button><button onclick="k('sqrt(')>√</button><button onclick="k('^')">xʸ</button><button onclick="k('4')">4</button><button onclick="k('5')">5</button><button onclick="k('6')">6</button><button onclick="k('*')">×</button><button onclick="k('sin(')">sin</button><button onclick="k('cos(')">cos</button><button onclick="k('1')">1</button><button onclick="k('2')">2</button><button onclick="k('3')">3</button><button onclick="k('-')">−</button><button onclick="k('tan(')">tan</button><button onclick="k('log10(')">log</button><button onclick="k('0')">0</button><button onclick="k('.')">.</button><button onclick="k('+')">+</button><button onclick="k('pi')">π</button><button onclick="k('(')">(</button><button onclick="k(')')">)</button></div><div class=row style="margin-top:8px"><button class=btn onclick=calculate()>احسب</button><button class=btn onclick="e.value='';o.textContent='—'">مسح</button></div></div><div class=c><div id=o class=out>—</div></div></section><section id=alg class=p><div class=c><h2>الجبر والمعادلات</h2><input id=a dir=ltr placeholder="x^2-5*x+6=0"><div class=keys><button onclick="ak('x')">x</button><button onclick="ak('^')">^</button><button onclick="ak('sqrt(')">√</button><button onclick="ak('expand(')">توسيع</button><button onclick="ak('factor(')">تحليل</button><button onclick="ak('diff(')">مشتقة</button><button onclick="ak('integrate(')">تكامل</button><button onclick="ak('solve(')">حل</button></div><button class=btn onclick=solve() style="margin-top:9px;width:100%">حل وتبسيط</button></div><div class=c><div id=ao class=out>—</div></div></section><section id=tools class=p><div class=c><h2>نسبة مئوية</h2><input id=p1 type=number placeholder="الجزء"><input id=p2 type=number placeholder="الكل"><button class=btn onclick="po.textContent=p2.value?((+p1.value/+p2.value)*100).toFixed(2)+'%':'أدخل القيم'">احسب</button><div id=po class=out></div></div><div class=c><h2>المعدل</h2><textarea id=nums placeholder="اكتب الأرقام مفصولة بفاصلة: 90,85,74"></textarea><button class=btn onclick=avg()>احسب المتوسط</button><div id=avgo class=out></div></div><div class=c><h2>تحويل الزوايا</h2><input id=deg type=number placeholder="الدرجة"><button class=btn onclick="dego.textContent=(+deg.value*Math.PI/180)+' راديان'">إلى راديان</button><div id=dego class=out></div></div></section><section id=photo class=p><div class=c><h2>📷 تصوير مسألة</h2><p>تقدر تفتح الكاميرا مباشرة أو تختار صورة من الجهاز.</p><div class=row><button class=btn onclick=startCam()>فتح الكاميرا</button><button class=btn onclick=takePhoto()>التقاط</button></div><video id=v autoplay playsinline></video><canvas id=cv hidden></canvas><input id=f type=file accept="image/*" capture="environment" onchange=pickFile()><img id=im><button class=btn onclick=ocr() style="width:100%">قراءة الصورة</button></div><div class=c><textarea id=txt dir=ltr placeholder="النص المقروء يظهر هنا ويمكنك تصحيحه"></textarea><button class=btn onclick=solvePhoto()>حل النص</button><div id=photoOut class=out>—</div></div></section></div><script>function tab(id,b){document.querySelectorAll('.p').forEach(x=>x.classList.remove('show'));document.getElementById(id).classList.add('show');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}function k(x){e.value+=x}function ak(x){a.value+=x}function calculate(){try{o.textContent=math.evaluate(e.value)}catch(x){o.textContent='تعذر الحساب. راجع الصيغة.'}}function norm(s){return s.trim().replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/√/g,'sqrt')}function solveText(s){s=norm(s);if(s.includes('=')){let q=s.split('=');return 'الحل لـ x: '+nerdamer.solveEquations(q[0]+'='+q.slice(1).join('='),'x').toString()}let n=nerdamer(s);return 'القيمة: '+n.evaluate().toString()+'\nالتبسيط: '+n.toString()+'\nالتوسيع: '+n.expand().toString()}function solve(){try{ao.textContent=solveText(a.value)}catch(e){ao.textContent='تعذر الحل. مثال صحيح: x^2-5*x+6=0'}}function avg(){let x=nums.value.split(/[,،\s]+/).map(Number).filter(Number.isFinite);avgo.textContent=x.length?(x.reduce((a,b)=>a+b,0)/x.length).toFixed(2):'أدخل أرقاماً صحيحة'}let stream=null,blob=null;async function startCam(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});v.srcObject=stream;v.style.display='block'}catch(e){alert('تعذر فتح الكاميرا. اسمح بصلاحية الكاميرا أو استخدم اختيار صورة.')}}function takePhoto(){if(!stream)return alert('افتح الكاميرا أولاً');cv.width=v.videoWidth;cv.height=v.videoHeight;cv.getContext('2d').drawImage(v,0,0);cv.toBlob(b=>{blob=b;im.src=URL.createObjectURL(b);im.style.display='block'});stream.getTracks().forEach(t=>t.stop());v.style.display='none'}function pickFile(){blob=f.files[0]||null;if(blob){im.src=URL.createObjectURL(blob);im.style.display='block'}}async function ocr(){if(!blob)return alert('التقط أو اختر صورة');photoOut.textContent='جاري قراءة الصورة...';try{if(!window.Tesseract)throw Error('OCR');const r=await Tesseract.recognize(blob,'eng');txt.value=(r.data.text||'').replace(/\n+/g,' ').trim();photoOut.textContent=txt.value?'تمت القراءة. صحح النص إذا احتاج ثم اضغط حل.':'لم يتم التعرف على نص واضح.'}catch(e){photoOut.textContent='تعذرت القراءة التلقائية. جرّب صورة أوضح أو اكتب المعادلة يدوياً في المربع.'}}function solvePhoto(){try{photoOut.textContent=solveText(txt.value.replace(/[Oo]/g,'0').replace(/\s+/g,''))}catch(e){photoOut.textContent='تعذر حل النص. صحح المعادلة ثم حاول مرة ثانية.'}}</script></body></html>
