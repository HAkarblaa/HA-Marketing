<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>توصيل طلبات المتاجر</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f5f5;font-family:Arial,Tahoma;color:#111}.wrap{width:94%;max-width:900px;margin:20px auto}.top,.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.card{background:#fff;border-radius:16px;padding:14px;margin:11px 0;box-shadow:0 4px 15px #0001}.btn,button{border:0;border-radius:11px;padding:11px 14px;background:#111;color:#fff;text-decoration:none;cursor:pointer;font:inherit}.light{background:#eee;color:#111}.blue{background:#1769e0}.green{background:#14833b}.muted{color:#666;line-height:1.7}.badge{padding:5px 9px;border-radius:999px;background:#eee;font-size:12px}.route{display:grid;grid-template-columns:1fr 1fr;gap:8px}.route>div{background:#fafafa;border-radius:10px;padding:9px}@media(max-width:600px){.route{grid-template-columns:1fr}.card{font-size:13px}}</style></head><body><div class="wrap"><div class="top"><a class="btn light" href="driver.html">← واجهة المندوب</a><h1>📦 توصيل طلبات المتاجر</h1><button class="light" onclick="loadAll()">تحديث</button></div><div id="gate" class="card">جاري التحقق...</div><div id="current"></div><h2>طلبات متاحة</h2><div id="available"></div></div><script>const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});const ST={ready:'متاح',accepted:'تم القبول',picked_up:'تم الاستلام من المتجر',on_the_way:'بالطريق للزبون',delivered:'تم التسليم'};function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function init(){const {data:{session}}=await db.auth.getSession();if(!session){location.href='login.html';return}const {data:ok,error}=await db.rpc('has_approved_role',{p_role:'delivery_driver'});if(error||!ok){gate.innerHTML='هذا القسم للمندوبين المعتمدين فقط. <a href="marketplace-onboarding.html">قدّم/تابع طلب الانضمام</a>';return}gate.textContent='✅ حساب مندوب معتمد';loadAll();setInterval(loadAll,15000)}async function loadAll(){await Promise.all([loadCurrent(),loadAvailable()])}async function loadCurrent(){const el=current;const {data,error}=await db.rpc('get_driver_shop_deliveries');if(error){el.innerHTML='<div class="card">'+esc(error.message)+'</div>';return}const arr=(Array.isArray(data)?data:[]).filter(x=>x.status!=='delivered');if(!arr.length){el.innerHTML='<div class="card muted">ما عندك توصيل متجر فعال حالياً.</div>';return}el.innerHTML=arr.map(d=>`<div class="card"><div class="row"><b>توصيل #${d.id} — طلب #${d.order_id}</b><span class="badge">${esc(ST[d.status]||d.status)}</span></div><div class="route"><div><small>الاستلام</small><br><b>${esc(d.pickup_name||'المتجر')}</b><br>${esc(d.pickup_address||'')}</div><div><small>التسليم</small><br>${esc(d.delivery_address||'')}<br>${esc(d.governorate||'')}</div></div><div class="row" style="margin-top:9px"><a class="btn light" href="tel:${esc(d.customer_phone||'')}">📞 اتصال بالزبون</a>${nextButton(d)}</div></div>`).join('')}function nextButton(d){if(d.status==='accepted')return `<button class="blue" onclick="setStatus(${d.id},'picked_up')">📦 استلمت الطلب من المتجر</button>`;if(d.status==='picked_up')return `<button class="blue" onclick="setStatus(${d.id},'on_the_way')">🛵 انطلقت للزبون</button>`;if(d.status==='on_the_way')return `<button class="green" onclick="deliver(${d.id})">✅ تأكيد التسليم بالرمز</button>`;return ''}async function loadAvailable(){const el=available;const {data,error}=await db.rpc('get_available_shop_deliveries');if(error){el.innerHTML='<div class="card">شغّل SHOP-COURIER-INTEGRATION.sql أولاً.<br>'+esc(error.message)+'</div>';return}const arr=Array.isArray(data)?data:[];el.innerHTML=arr.map(d=>`<div class="card"><div class="row"><b>طلب توصيل #${d.id}</b><button class="blue" onclick="acceptD(${d.id})">قبول</button></div><div class="route"><div><small>من</small><br><b>${esc(d.pickup_name||'المتجر')}</b><br>${esc(d.pickup_address||'')}</div><div><small>إلى</small><br>${esc(d.delivery_address||'')}<br>${esc(d.governorate||'')}</div></div></div>`).join('')||'<div class="card muted">لا توجد طلبات توصيل متاحة حالياً.</div>'}async function acceptD(id){const {error}=await db.rpc('accept_shop_delivery',{p_delivery_id:id});if(error)return alert(error.message);alert('تم قبول التوصيل.');loadAll()}async function setStatus(id,status){const {error}=await db.rpc('update_shop_delivery_status',{p_delivery_id:id,p_status:status,p_otp:null});if(error)return alert(error.message);loadAll()}async function deliver(id){const otp=prompt('اطلب من الزبون رمز التسليم المكون من 4 أرقام:');if(!otp)return;const {error}=await db.rpc('update_shop_delivery_status',{p_delivery_id:id,p_status:'delivered',p_otp:otp.trim()});if(error)return alert(error.message);alert('تم التسليم بنجاح ✅');loadAll()}init();</script></body></html>
