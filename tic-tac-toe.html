<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#dff7ff"><title>إكس أو • HA Marketing</title><link rel="stylesheet" href="ha-xo.css"><script src="ha-vendor-supabase.js" defer></script><script src="ha-xo.js" defer></script></head><body><main class="app">
<header><a href="entertainment.html" class="icon" aria-label="رجوع إلى الترفيه">➜</a><span class="brand">HA<small>MARKETING</small></span><button class="icon" id="settings" aria-label="الإعدادات">⚙</button></header>
<h1><span>إكس</span> <em>أو</em></h1><p class="intro">خط واحد يفصل بينك وبين الفوز!</p>
<section id="lobby" class="panel"><label for="name">اسم اللاعب</label><input id="name" maxlength="24" placeholder="اكتب اسمك" autocomplete="nickname"><div class="modes"><button data-mode="cpu">ضد الجهاز<small>تدريب بثلاث صعوبات</small></button><button data-mode="local">لاعبان<small>على نفس الموبايل</small></button><button data-mode="levels">المستويات<small id="levelLabel">12 تحدياً</small></button><button data-mode="online">أونلاين<small>غرفة خاصة لصديقك</small></button></div><div class="options"><label>القاعدة<select id="rule"><option value="3,3">3 × 3 — ثلاثة للفوز</option><option value="4,3">4 × 4 — ثلاثة للفوز</option><option value="5,4">5 × 5 — أربعة للفوز</option></select></label><label>الصعوبة<select id="difficulty"><option value="easy">سهل</option><option value="medium">متوسط</option><option value="hard">صعب</option></select></label></div><p class="hint">اختر القاعدة ثم طريقة اللعب. المستويات لها قواعد متدرجة.</p><button class="secondary wide" id="leaders">🏆 التصنيف</button></section>
<section id="onlinePanel" class="panel" hidden><h2>العب ويا صديقك</h2><p>أنشئ غرفة وأرسل الكود، أو أدخل كود صديقك.</p><button id="create" class="primary wide">إنشاء غرفة</button><div class="join"><input id="roomInput" maxlength="8" dir="ltr" placeholder="كود الغرفة" aria-label="كود الغرفة"><button id="join" class="secondary">انضمام</button></div><p class="hint">تحتاجون نت طوال الجولة. الفوز 30 نقطة، والتعادل 10 نقاط. التدريب لا يدخل التصنيف.</p><button class="text" id="onlineBack">رجوع</button></section>
<section id="game" hidden><div class="scores"><div class="score orange"><strong class="mark x">X</strong><div><b id="p1">أنت</b><span id="s1">0</span></div></div><div class="round"><small>الجولة</small><b id="round">1</b></div><div class="score blue"><strong class="mark o">O</strong><div><b id="p2">الجهاز</b><span id="s2">0</span></div></div></div><div class="roomInfo" id="roomInfo" hidden><span id="roomCode"></span><button id="copyCode" class="text">نسخ الكود</button></div><p id="status" class="status" aria-live="polite"></p><p class="hint" id="ruleHint"></p><div id="board" class="board" role="group" aria-label="رقعة إكس أو"></div><p id="connection" class="hint" aria-live="polite"></p><div class="actions"><button id="again" class="primary">جولة جديدة ↻</button><button id="menu" class="secondary">القائمة</button></div></section>
<footer><button id="sound" class="text" aria-pressed="true">الصوت: شغّال</button><button id="help" class="text">طريقة اللعب</button></footer><p id="notice" role="status" class="notice" hidden></p>
<dialog id="dialog"><form method="dialog"><button class="close" aria-label="إغلاق">×</button></form><h2 id="dialogTitle"></h2><div id="dialogBody"></div></dialog></main></body></html>
