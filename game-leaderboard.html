<!doctype html>
<html lang="ar" dir="rtl">
<head>
<script id="ha-daylight-boot">(function(){try{var r=document.documentElement;r.setAttribute('data-ha-theme','light');r.style.colorScheme='light';['ha_theme_mode_v2','ha_theme_mode','ha-theme','theme'].forEach(function(k){localStorage.setItem(k,'light')});}catch(e){}})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6fbff">
<title>ترتيب الألعاب - HA Marketing</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="game-ranking.js"></script>
<style>
:root{--bg:#05070a;--card:#0c141f;--card2:#111c2b;--gold:#f0c765;--gold2:#ffe2a0;--muted:#9eacbc;--line:#ffffff16;--blue:#4f9cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(circle at 50% -10%,#6d4b171f,transparent 30%),linear-gradient(180deg,#030507,#07101a);color:#fff;font-family:Tahoma,Arial,sans-serif;min-height:100vh}
.wrap{width:min(980px,94%);margin:auto;padding:18px 0 38px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{width:44px;height:44px;display:grid;place-items:center;border:1px solid #dcae4d66;border-radius:14px;color:var(--gold);text-decoration:none;background:#0c1118;font-size:25px}
.head{text-align:center;flex:1}.head h1{margin:0;font-size:25px;color:var(--gold2)}.head p{margin:5px 0 0;color:var(--muted);font-size:12px}
.hero{margin:18px 0 14px;padding:20px;border:1px solid #e0aa4260;border-radius:24px;background:linear-gradient(145deg,#17140d,#0b1520);box-shadow:0 16px 42px #0006}
.hero strong{display:block;font-size:22px;color:var(--gold2);margin-bottom:6px}.hero span{color:#c5ced9;font-size:13px;line-height:1.8}
.tabs{display:flex;gap:8px;overflow:auto;padding:3px 0 12px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid #ffffff1c;background:#0c1725;color:#bdc8d5;padding:10px 14px;border-radius:999px;font-weight:800;cursor:pointer}
.tab.active{color:#171006;background:linear-gradient(135deg,#ffd879,#d89a2e);border-color:#ffe09b}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
.sum{background:#0b1623;border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}.sum small{display:block;color:#91a0b0;font-size:10px}.sum b{display:block;color:#f2cc70;font-size:18px;margin-top:4px}
.list{display:grid;gap:9px}
.row{display:grid;grid-template-columns:56px minmax(0,1.5fr) repeat(4,minmax(70px,.6fr));gap:8px;align-items:center;background:linear-gradient(180deg,#0e1928,#09121d);border:1px solid #ffffff12;border-radius:18px;padding:11px}
.row.headrow{background:#15120b;border-color:#d2a24255;color:#e8c778;font-size:11px;font-weight:900}
.rank{font-size:20px;text-align:center;font-weight:900;color:#f3ca66}.player{min-width:0}.player b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player small{display:block;color:#8ea1b5;margin-top:4px;direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell{text-align:center}.cell b{display:block}.cell small{display:block;color:#8091a3;font-size:9px;margin-top:2px}
.empty,.error{padding:25px;text-align:center;border:1px dashed #ffffff25;border-radius:18px;color:#aab7c5;background:#0a131e}
.error{color:#ffd18a;border-color:#d6a44866}.refresh{width:100%;margin-top:12px;padding:12px;border:0;border-radius:13px;background:#18263a;color:#fff;font-weight:900}
@media(max-width:720px){
 .row{grid-template-columns:42px minmax(0,1fr) 82px 72px;padding:10px 8px}.row .best,.row .wins{display:none}.row.headrow .best,.row.headrow .wins{display:none}
 .summary{grid-template-columns:repeat(3,1fr)}.sum{padding:9px}.sum b{font-size:15px}
}
</style>
<link rel="stylesheet" href="ha-premium-theme.css?v=20260925-v4">
<link rel="stylesheet" href="ha-theme.css?v=20260925-v4">
<link rel="stylesheet" href="ha-daylight-force.css?v=20260925-v4">
<script src="ha-theme.js?v=20260925-v4"></script>
</head>
<body>
<main class="wrap">
  <div class="top">
    <a class="back" href="entertainment.html">‹</a>
    <div class="head"><h1>🏆 ترتيب الألعاب</h1><p>حسب مجموع النقاط المتراكمة لكل لاعب</p></div>
    <div style="width:44px"></div>
  </div>

  <section class="hero">
    <strong>تصنيف لعبة الحية</strong>
    <span>كل جولة تنضاف إلى مجموع نقاطك حتى عند الخسارة، ويظهر اسمك ومعرّفك وعدد مرات اللعب وأفضل نتيجة.</span>
  </section>

  <div class="tabs" id="tabs"></div>

  <section class="summary">
    <div class="sum"><small>اللاعبون</small><b id="playersCount">0</b></div>
    <div class="sum"><small>إجمالي النقاط</small><b id="pointsSum">0</b></div>
    <div class="sum"><small>إجمالي اللعبات</small><b id="gamesSum">0</b></div>
  </section>

  <div id="list" class="list"></div>
  <button id="refresh" class="refresh">↻ تحديث الترتيب</button>
</main>

<script>
const GAME_LABELS={
  snake:'🐍 الحية'
};
let current='snake';

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(n){return Number(n||0).toLocaleString('ar-IQ')}

function buildTabs(){
  tabs.innerHTML=Object.entries(GAME_LABELS).map(([k,v])=>`<button class="tab ${k===current?'active':''}" data-k="${k}">${v}</button>`).join('');
  tabs.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{current=b.dataset.k;buildTabs();load()});
}

async function load(){
  list.innerHTML='<div class="empty">جاري تحميل الترتيب...</div>';
  const {data,error}=await HA_GameRanking.leaderboard(current,100);
  if(error){
    list.innerHTML='<div class="error">تعذر تحميل الترتيب.<br>إذا هذه أول مرة، شغّل ملف <b>GAME-RANKING-SETUP.sql</b> داخل Supabase مرة واحدة.<br><small>'+esc(error.message||error)+'</small></div>';
    playersCount.textContent='0';pointsSum.textContent='0';gamesSum.textContent='0';
    return;
  }
  const rows=data||[];
  playersCount.textContent=fmt(rows.length);
  pointsSum.textContent=fmt(rows.reduce((s,r)=>s+Number(r.total_points||0),0));
  gamesSum.textContent=fmt(rows.reduce((s,r)=>s+Number(r.games_played||0),0));
  if(!rows.length){list.innerHTML='<div class="empty">بعد ماكو نتائج. أول ما المستخدمين يلعبون، يطلع ترتيبهم هنا.</div>';return}

  const header=`<div class="row headrow">
    <div>#</div><div>المستخدم</div><div>النقاط</div><div class="best">أفضل نتيجة</div><div>مرات اللعب</div><div class="wins">الفوز</div>
  </div>`;
  list.innerHTML=header+rows.map(r=>{
    const u=r.username?'@'+String(r.username).replace(/^@+/,''):'بدون معرّف';
    const medal=Number(r.rank_no)===1?'🥇':Number(r.rank_no)===2?'🥈':Number(r.rank_no)===3?'🥉':fmt(r.rank_no);
    return `<div class="row">
      <div class="rank">${medal}</div>
      <div class="player"><b>${esc(r.full_name||'مستخدم')}</b><small>${esc(u)}</small></div>
      <div class="cell"><b>${fmt(r.total_points)}</b><small>نقطة</small></div>
      <div class="cell best"><b>${fmt(r.best_score)}</b><small>أفضل</small></div>
      <div class="cell"><b>${fmt(r.games_played)}</b><small>لعبة</small></div>
      <div class="cell wins"><b>${fmt(r.wins)}</b><small>فوز</small></div>
    </div>`;
  }).join('');
}
refresh.onclick=load;
buildTabs();load();
</script>
</body>
</html>
