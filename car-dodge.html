*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:linear-gradient(180deg,#031018,#091725);color:var(--text);font-family:Tahoma,Arial,sans-serif;min-height:100%}body{direction:rtl}a{color:inherit;text-decoration:none}.page{width:min(1050px,100%);margin:auto;padding:12px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.title{display:flex;align-items:center;gap:10px}.icon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:#142538;border:1px solid #ffffff18;font-size:25px}.title h1{font-size:21px;margin:0}.title small{display:block;color:var(--muted);margin-top:3px}.btn{border:0;border-radius:13px;padding:11px 15px;font-weight:900;background:linear-gradient(135deg,#ffd36d,#e6a72f);color:#181106;cursor:pointer;min-height:44px}.btn.alt{background:#172738;color:white;border:1px solid #ffffff16}.game-grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:12px}.stage{background:#07111b;border:1px solid #ffffff15;border-radius:20px;padding:8px;overflow:hidden}.stage canvas{width:100%;height:auto;display:block;border-radius:15px;background:#02060a;touch-action:none}.side{display:grid;gap:10px;align-content:start}.card{background:linear-gradient(180deg,#101c28,#0b1621);border:1px solid #ffffff14;border-radius:17px;padding:13px}.card h3{margin:0 0 10px;font-size:16px;color:#ffe09a}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;background:#07111b;border:1px solid #ffffff0f;border-radius:13px;padding:10px 6px}.stat b{display:block;font-size:20px;color:#ffd56f}.stat small{color:#94a2b2}.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.ctrl{min-width:58px;min-height:48px;border:1px solid #ffffff1d;background:#182a3c;color:white;border-radius:14px;font-size:22px;font-weight:900}.board{display:grid;gap:7px}.rankrow{display:flex;justify-content:space-between;gap:8px;align-items:center;background:#07111b;border-radius:11px;padding:8px 10px;border:1px solid #ffffff0c}.rankrow small{color:#96a5b5}.notice{color:#b9c6d4;font-size:12px;line-height:1.65}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions .btn{flex:1}.status{margin-top:8px;font-size:12px;color:#9fb0c2}.status.ok{color:#7ee6a3}.status.bad{color:#ff9a9a}@media(max-width:820px){.game-grid{grid-template-columns:1fr}.side{grid-template-columns:1fr 1fr}.side .card:last-child{grid-column:1/-1}}@media(max-width:560px){.page{padding:7px}.top{margin-bottom:7px}.title h1{font-size:18px}.title small{font-size:10px}.icon{width:40px;height:40px}.game-grid{gap:7px}.stage{padding:5px;border-radius:15px}.stage canvas{border-radius:11px;max-height:62vh;object-fit:contain}.side{grid-template-columns:1fr;gap:7px}.side .card:last-child{grid-column:auto}.card{padding:10px;border-radius:14px}.stats{gap:5px}.stat{padding:7px 4px}.stat b{font-size:17px}.ctrl{min-height:46px}.btn{padding:9px 11px}.hide-mobile{display:none}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="ha-modern-blue.css?v=20260926-1"><script src="ha-modern-blue.js?v=20260926-1" defer></script></head><body><main class="page"><div class="top"><div class="title"><div class="icon">🚗</div><div><h1>تفادي العوائق</h1><small>سيارة سريعة + نقاط + تصنيف</small></div></div><a class="btn alt" href="entertainment.html">‹ رجوع</a></div><div class="game-grid"><section class="stage"><canvas id="game" width="420" height="680"></canvas><div class="controls" style="margin-top:8px"><button id="leftBtn" class="ctrl">←</button><button id="rightBtn" class="ctrl">→</button></div></section><aside class="side"><section class="card"><h3>اللعبة</h3><div class="actions"><button id="startBtn" class="btn">▶ ابدأ</button><button id="restartBtn" class="btn alt">↻ إعادة</button></div><div id="status" class="status">جاهز للعب</div><p class="notice">استخدم السهمين للتحرك وتجنب السيارات. كلما استمريت أكثر تزيد النقاط.</p></section><section class="card"><h3>نتيجتك</h3><div class="stats"><div class="stat"><b id="score">0</b><small>النقاط</small></div><div class="stat"><b id="best">0</b><small>أفضل نتيجة</small></div><div class="stat"><b id="plays">0</b><small>مرات اللعب</small></div></div></section><section class="card"><h3>🏆 التصنيف</h3><div id="leader" class="board"></div></section></aside></div></main><script>
const HAGame=(()=>{
  const KEY='ha_games_records_v2', mem={};
  const SB_URL='https://ubayrhtshgtgggxprrek.supabase.co';
  const SB_KEY='sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll';
  let client=null;
  const safe={get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]??null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}};
  const parse=v=>{try{return JSON.parse(v)}catch(e){return null}};
  function user(){for(const k of ['ha_user','ha_current_user','currentUser','user','profile']){const o=parse(safe.get(k));if(o&&typeof o==='object'){const id=o.id||o.user_id||o.uid||o.uuid||o.username||'guest';return{id:String(id),name:String(o.full_name||o.fullName||o.name||o.display_name||'مستخدم HA'),username:String(o.username||o.user_name||o.handle||('user_'+String(id).slice(0,6)))}}}return{id:'guest',name:'لاعب',username:'guest'}}
  function data(){return parse(safe.get(KEY))||{games:{}}} function put(d){safe.set(KEY,JSON.stringify(d))}
  function localSave(key,title,score,win){const u=user(),d=data();d.games[key]??={title,players:{}};const p=d.games[key].players[u.id]||{userId:u.id,name:u.name,username:u.username,totalScore:0,bestScore:0,playCount:0,wins:0};p.name=u.name;p.username=u.username;p.totalScore+=score;p.bestScore=Math.max(p.bestScore,score);p.playCount++;if(win)p.wins++;p.lastScore=score;d.games[key].players[u.id]=p;put(d);return p}
  function localBoard(key){const g=data().games[key];return g?Object.values(g.players||{}).sort((a,b)=>b.totalScore-a.totalScore||b.bestScore-a.bestScore):[]}
  function db(){if(client)return client;if(!window.supabase||!window.supabase.createClient)return null;try{client=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});return client}catch(e){return null}}
  async function remoteIdentity(){const c=db();if(!c)return null;try{const {data:{session}}=await c.auth.getSession();if(!session)return null;let name='مستخدم HA',username='user_'+session.user.id.slice(0,6);const r=await c.from('profiles').select('full_name,username').eq('id',session.user.id).maybeSingle();if(r.data){name=r.data.full_name||name;username=r.data.username||username}return{id:session.user.id,name,username}}catch(e){return null}}
  async function remoteSave(key,title,score,win){const c=db(),u=await remoteIdentity();if(!c||!u)return;try{const q=await c.from('ha_game_scores').select('id,total_score,best_score,play_count,wins').eq('user_id',u.id).eq('game_key',key).maybeSingle();if(q.data){await c.from('ha_game_scores').update({username:u.username,display_name:u.name,game_title:title,total_score:Number(q.data.total_score||0)+score,best_score:Math.max(Number(q.data.best_score||0),score),play_count:Number(q.data.play_count||0)+1,wins:Number(q.data.wins||0)+(win?1:0),last_score:score}).eq('id',q.data.id)}else{await c.from('ha_game_scores').insert({user_id:u.id,username:u.username,display_name:u.name,game_key:key,game_title:title,total_score:score,best_score:score,play_count:1,wins:win?1:0,last_score:score})}}catch(e){console.warn('score sync',e)}}
  function save(key,title,score,win=false){score=Math.max(0,Math.floor(Number(score)||0));const p=localSave(key,title,score,win);remoteSave(key,title,score,win);return p}
  async function renderBoard(el,key,limit=8){const local=localBoard(key).slice(0,limit);renderRows(el,local);const c=db();if(!c)return;try{const r=await c.from('ha_game_scores').select('display_name,username,total_score,best_score,play_count,wins').eq('game_key',key).order('total_score',{ascending:false}).limit(limit);if(!r.error&&r.data?.length)renderRows(el,r.data.map(x=>({name:x.display_name,username:x.username,totalScore:x.total_score,bestScore:x.best_score,playCount:x.play_count,wins:x.wins})))}catch(e){}}
  function renderRows(el,rows){if(!el)return;el.innerHTML=rows?.length?rows.map((p,i)=>`<div class="rankrow"><span>#${i+1} ${esc(p.name||'لاعب')} <small>@${esc(p.username||'user')}</small></span><b>${Number(p.totalScore||0)}</b></div>`).join(''):'<div class="notice">لا توجد نتائج بعد.</div>'}
  function myStats(key){const me=localBoard(key).find(x=>x.userId===user().id);return me||{bestScore:0,playCount:0,totalScore:0,wins:0}}
  function beep(type='tick'){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const a=new A(),o=a.createOscillator(),g=a.createGain();const P={tick:[620,.06],coin:[900,.08],jump:[520,.09],lose:[160,.22],win:[760,.18]};const [f,d]=P[type]||P.tick;o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.value=.08;o.start();o.stop(a.currentTime+d)}catch(e){}}
  function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
  return{save,renderBoard,myStats,beep,user,localBoard,db};
})();
</script><script>
const C=document.getElementById('game'),X=C.getContext('2d'),keys={};let running=false,raf=0,t=0,score=0,cars=[];const P={x:210,y:585,w:52,h:82};
function stats(){const s=HAGame.myStats('car-dodge');scoreEl.textContent=score;best.textContent=s.bestScore||0;plays.textContent=s.playCount||0;HAGame.renderBoard(leader,'car-dodge',7)}
const scoreEl=document.getElementById('score');
function reset(){cancelAnimationFrame(raf);running=false;t=0;score=0;cars=[];P.x=210;document.getElementById('status').textContent='جاهز للعب';stats();draw()}
function spawn(){const lanes=[85,165,255,335];cars.push({x:lanes[Math.floor(Math.random()*4)],y:-90,w:50,h:78,c:`hsl(${Math.random()*360},75%,60%)`})}
function hit(a,b){return a.x-a.w/2<b.x+b.w/2&&a.x+a.w/2>b.x-b.w/2&&a.y-a.h/2<b.y+b.h/2&&a.y+a.h/2>b.y-b.h/2}
function finish(){if(!running)return;running=false;cancelAnimationFrame(raf);HAGame.beep('lose');HAGame.save('car-dodge','تفادي العوائق',score,score>=120);document.getElementById('status').textContent='انتهت الجولة - اضغط ابدأ';stats();draw()}
function loop(){if(!running)return;t++;score=Math.floor(t/5);if(t%42===0)spawn();if(keys.left)P.x=Math.max(60,P.x-7);if(keys.right)P.x=Math.min(360,P.x+7);cars.forEach(o=>o.y+=6+Math.min(8,score/40));cars=cars.filter(o=>o.y<760);if(cars.some(o=>hit(P,o)))return finish();scoreEl.textContent=score;draw();raf=requestAnimationFrame(loop)}
function draw(){X.fillStyle='#263441';X.fillRect(0,0,420,680);X.fillStyle='#111923';X.fillRect(28,0,364,680);X.fillStyle='#d8dde3';for(let y=(t*7)%70-70;y<680;y+=70)X.fillRect(206,y,8,38);for(const o of cars){X.fillStyle=o.c;X.fillRect(o.x-o.w/2,o.y-o.h/2,o.w,o.h);X.fillStyle='#dbeafe88';X.fillRect(o.x-14,o.y-25,28,14)}X.fillStyle='#f7bd3b';X.fillRect(P.x-P.w/2,P.y-P.h/2,P.w,P.h);X.fillStyle='#dbeafeaa';X.fillRect(P.x-14,P.y-25,28,14);X.fillStyle='#fff';X.font='bold 24px Tahoma';X.fillText('النقاط '+score,18,34);if(!running){X.fillStyle='#0008';X.fillRect(0,0,420,680);X.fillStyle='#fff';X.font='bold 30px Tahoma';X.textAlign='center';X.fillText(score?'انتهت الجولة':'اضغط ابدأ',210,330);X.textAlign='start'}}
function setDir(d,v){keys[d]=v}leftBtn.onpointerdown=()=>setDir('left',1);leftBtn.onpointerup=leftBtn.onpointerleave=()=>setDir('left',0);rightBtn.onpointerdown=()=>setDir('right',1);rightBtn.onpointerup=rightBtn.onpointerleave=()=>setDir('right',0);addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.left=1;if(e.key==='ArrowRight')keys.right=1});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.left=0;if(e.key==='ArrowRight')keys.right=0});startBtn.onclick=()=>{reset();running=true;document.getElementById('status').textContent='اللعبة شغالة';HAGame.beep();loop()};restartBtn.onclick=reset;reset();
</script></body></html>
