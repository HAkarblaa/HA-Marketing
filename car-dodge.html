<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تفادي العوائق</title><link rel="stylesheet" href="assets/ha-games-style.css"></head><body><div class="page"><div class="topbar"><div class="brand"><div class="logo">🚗</div><div><h1>تفادي العوائق</h1><p>تجنب السيارات واحصل على أعلى نتيجة</p></div></div><div class="row"><a class="btn secondary" href="games-hub.html">↩ الألعاب</a><button id="fullBtn" class="btn secondary">⛶ ملء الشاشة</button></div></div>
<div class="game-shell"><div id="stageHolder" class="stage-wrap"><canvas id="game" class="stage" width="480" height="720"></canvas></div><div class="side-panel"><div class="card"><h3>التحكم</h3><p>الأسهم يمين ويسار أو المس على الجهة المناسبة من الشاشة للتحرك. كلما بقيت مدة أطول زادت النقاط والسرعة.</p><div class="row"><button id="startBtn" class="btn">▶ ابدأ</button><button id="restartBtn" class="btn secondary">↻ إعادة</button></div></div><div class="card"><h3>إحصائياتك</h3><div class="stat-grid"><div class="stat"><b id="score">0</b><span>النقاط</span></div><div class="stat"><b id="best">0</b><span>الأفضل</span></div><div class="stat"><b id="plays">0</b><span>اللعبات</span></div></div></div><div class="card"><h3>أفضل اللاعبين</h3><div id="leader" class="list"></div></div></div></div><footer>🚗 لعبة تفادي العوائق</footer></div>
<script src="assets/ha-games-common.js"></script><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'); let run=false, anim=0, score=0, best=0, roadY=0, tick=0;
const player={x:240,y:610,w:58,h:92,speed:22}; const keys={}; let cars=[];
function reset(){score=0;tick=0;roadY=0;player.x=240;cars=[];updateStats();draw();}
function updateStats(){const board=HAGames.getLeaderboard('car-dodge'); const user=HAGames.detectUser(); const me=board.find(x=>x.userId===user.id); best=me?me.bestScore:best; document.getElementById('score').textContent=score; document.getElementById('best').textContent=best||0; document.getElementById('plays').textContent=me?me.playCount:0; HAGames.renderMiniLeaderboard(document.getElementById('leader'),'car-dodge',8);} 
function spawn(){ const lanes=[90,200,310,420]; cars.push({x:lanes[Math.floor(Math.random()*lanes.length)]-29,y:-120,w:58,h:92,color:`hsl(${Math.random()*360},70%,60%)`}); }
function collision(a,b){return a.x-a.w/2 < b.x+b.w/2 && a.x+a.w/2 > b.x-b.w/2 && a.y-a.h/2 < b.y+b.h/2 && a.y+a.h/2 > b.y-b.h/2}
function endGame(){run=false; cancelAnimationFrame(anim); HAGames.beep('lose'); const p=HAGames.saveScore('car-dodge','🚗 تفادي العوائق',score,{win:score>=80}); HAGames.toast(`انتهت الجولة! نقاطك: ${score}`); best=Math.max(best,p.bestScore||0); updateStats(); draw();}
function loop(){if(!run)return; tick++; score=Math.floor(tick/6); roadY=(roadY+8+score/25)%60; if(tick%36===0) spawn(); cars.forEach(c=>c.y+=8+score/30); cars=cars.filter(c=>c.y<860); if(keys.ArrowLeft) player.x=Math.max(60,player.x-player.speed); if(keys.ArrowRight) player.x=Math.min(420,player.x+player.speed); for(const c of cars){ if(collision({x:player.x,y:player.y,w:player.w,h:player.h}, {x:c.x,y:c.y,w:c.w,h:c.h})) return endGame(); } updateStats(); draw(); anim=requestAnimationFrame(loop);} 
function draw(){ctx.clearRect(0,0,480,720); ctx.fillStyle='#1f2937'; ctx.fillRect(40,0,400,720); ctx.fillStyle='#64748b'; for(let i=0;i<14;i++){ctx.fillRect(235, i*60+roadY, 10, 38);} ctx.fillStyle='#374151'; ctx.fillRect(0,0,40,720); ctx.fillRect(440,0,40,720); cars.forEach(c=>{ctx.fillStyle=c.color; roundRect(c.x-c.w/2,c.y-c.h/2,c.w,c.h,12,true); ctx.fillStyle='rgba(255,255,255,.45)'; ctx.fillRect(c.x-18,c.y-28,36,16);}); ctx.fillStyle='#f59e0b'; roundRect(player.x-player.w/2,player.y-player.h/2,player.w,player.h,12,true); ctx.fillStyle='rgba(255,255,255,.5)'; ctx.fillRect(player.x-18,player.y-28,36,16); ctx.fillStyle='white'; ctx.font='bold 28px Tahoma'; ctx.fillText('النقاط: '+score,20,40); if(!run){ctx.fillStyle='rgba(0,0,0,.4)'; ctx.fillRect(0,0,480,720); ctx.fillStyle='white'; ctx.font='bold 34px Tahoma'; ctx.fillText(score>0?'انتهت الجولة':'اضغط ابدأ',150,320); ctx.font='22px Tahoma'; ctx.fillText('حرّك السيارة وتجنب الاصطدام',115,360);} }
function roundRect(x,y,w,h,r,fill){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r); if(fill) {ctx.fill();} else ctx.stroke();}
window.addEventListener('keydown',e=>keys[e.key]=true); window.addEventListener('keyup',e=>keys[e.key]=false); canvas.addEventListener('touchstart',e=>{const x=e.touches[0].clientX-(canvas.getBoundingClientRect().left); if(x<canvas.clientWidth/2) keys.ArrowLeft=true; else keys.ArrowRight=true;},{passive:true}); canvas.addEventListener('touchend',()=>{keys.ArrowLeft=false; keys.ArrowRight=false;}); document.getElementById('startBtn').onclick=()=>{reset();run=true;HAGames.beep('tick');loop();}; document.getElementById('restartBtn').onclick=()=>{reset();}; HAGames.bindFullscreen(document.getElementById('fullBtn'),'#stageHolder'); reset();
</script></body></html>
