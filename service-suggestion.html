<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07885f">
<title>اقتراح خدمة جديدة - HA Marketing</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f8f7;font-family:Arial,Tahoma,sans-serif;color:#11253f}
.wrap{width:min(720px,94%);margin:28px auto 110px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.back,.home{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border:1px solid #dbe6e3;background:#fff;color:#087c5c;padding:10px 14px;border-radius:13px;font-weight:900}
.hero{background:linear-gradient(135deg,#6c46e8,#a15df0);color:#fff;border-radius:24px;padding:23px 20px;box-shadow:0 15px 35px #31156b22}
.hero h1{margin:0 0 8px;font-size:27px}.hero p{margin:0;line-height:1.8;font-size:14px}
.card{margin-top:16px;background:#fff;border:1px solid #e0e9e7;border-radius:21px;padding:19px;box-shadow:0 10px 28px #17352b0c}
label{display:block;font-size:13px;font-weight:900;margin:14px 0 7px}
input,textarea{width:100%;border:1px solid #d6e1df;border-radius:13px;padding:13px 14px;font:inherit;outline:none;background:#fff}
textarea{min-height:145px;resize:vertical;line-height:1.8}
input:focus,textarea:focus{border-color:#7b55df;box-shadow:0 0 0 3px #7b55df18}
button{width:100%;margin-top:16px;border:0;border-radius:14px;padding:14px 16px;font:inherit;font-weight:900;cursor:pointer;background:#6f4bdd;color:#fff}
button:disabled{opacity:.6;cursor:not-allowed}
.status{margin-top:12px;padding:11px 12px;border-radius:12px;background:#f3f6f5;color:#687778;font-size:12px;line-height:1.7}
.status.ok{background:#e8f8ef;color:#0a7950}.status.err{background:#fff0f2;color:#a82b40}
.hint{font-size:11px;color:#788788;line-height:1.7;margin-top:5px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="services.html">← رجوع للخدمات</a>
    <a class="home" href="index.html">الرئيسية</a>
  </div>

  <section class="hero">
    <h1>➕ اقتراح خدمة جديدة</h1>
    <p>إذا الخدمة اللي تحتاجها مو موجودة، اكتب اسمها ووضح تفاصيلها. اقتراحك يوصل مباشرة للأدمن الرئيسي حتى يراجعه.</p>
  </section>

  <section class="card">
    <label>اسم الخدمة المقترحة *</label>
    <input id="serviceName" maxlength="120" placeholder="مثال: صيانة أجهزة تبريد">

    <label>تفاصيل الخدمة *</label>
    <textarea id="details" maxlength="2000" placeholder="اكتب شنو نوع الخدمة وليش تحتاج إضافتها وأي تفاصيل تساعد الأدمن يفهمها."></textarea>

    <label>رقم الهاتف (اختياري)</label>
    <input id="phone" inputmode="tel" placeholder="07XXXXXXXXX">
    <div class="hint">إذا موجود بحسابك راح نحاول نعبّيه تلقائياً.</div>

    <button id="submitBtn" type="button">إرسال الاقتراح للأدمن الرئيسي</button>
    <div id="status" class="status">بعد الإرسال يبقى الاقتراح قيد المراجعة عند الأدمن الرئيسي.</div>
  </section>
</div>

<script>
const db=supabase.createClient(
  'https://ubayrhtshgtgggxprrek.supabase.co',
  'sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',
  {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}}
);
let me=null;
const serviceName=document.getElementById('serviceName');
const details=document.getElementById('details');
const phone=document.getElementById('phone');
const submitBtn=document.getElementById('submitBtn');
const statusBox=document.getElementById('status');

async function init(){
  const {data:{session}}=await db.auth.getSession();
  if(!session){
    location.href='login.html?next='+encodeURIComponent('service-suggestion.html');
    return;
  }
  me=session.user;

  const {data:p}=await db.from('profiles')
    .select('phone')
    .eq('id',me.id)
    .maybeSingle();

  if(p?.phone) phone.value=p.phone;
}
submitBtn.onclick=async()=>{
  const name=serviceName.value.trim();
  const desc=details.value.trim();
  const ph=phone.value.trim();

  if(!name){
    alert('اكتب اسم الخدمة المقترحة');
    return;
  }
  if(!desc){
    alert('اكتب تفاصيل الخدمة المقترحة');
    return;
  }
  if(ph && !/^07\d{9}$/.test(ph)){
    alert('رقم الهاتف يجب أن يبدأ بـ 07 ويتكون من 11 رقم');
    return;
  }

  submitBtn.disabled=true;
  submitBtn.textContent='جاري إرسال الاقتراح...';
  statusBox.className='status';
  statusBox.textContent='جاري الإرسال للأدمن الرئيسي...';

  const {error}=await db.rpc('submit_service_suggestion',{
    p_service_name:name,
    p_details:desc,
    p_phone:ph||null
  });

  submitBtn.disabled=false;
  submitBtn.textContent='إرسال الاقتراح للأدمن الرئيسي';

  if(error){
    statusBox.className='status err';
    statusBox.textContent='تعذر إرسال الاقتراح: '+error.message;
    return;
  }

  serviceName.value='';
  details.value='';
  statusBox.className='status ok';
  statusBox.textContent='✅ تم إرسال اقتراحك للأدمن الرئيسي بنجاح وهو الآن قيد المراجعة.';
};
init();
</script>
</body>
</html>
