<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلبات الموظف - HA Marketing</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f5f5f5;color:#111}.wrap{width:94%;max-width:900px;margin:25px auto}.card{background:#fff;border-radius:16px;padding:18px;margin:13px 0;box-shadow:0 4px 16px #0001}h1{text-align:center}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}.badge{padding:6px 10px;border-radius:999px;background:#eee;font-weight:bold}.order{border:1px solid #ddd;border-radius:12px;padding:14px;margin-top:12px}.muted{color:#666;font-size:14px;line-height:1.8}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button,a.btn{border:0;border-radius:9px;padding:11px 14px;text-decoration:none;text-align:center;cursor:pointer}.primary{background:#111;color:#fff}.light{background:#eee;color:#111}.danger{background:#a90020;color:#fff}.empty{text-align:center;color:#666;padding:20px}</style></head><body><div class="wrap"><h1>🧑‍💼 طلبات الموظف</h1><div id="info" class="card">جاري التحقق من الحساب...</div><div id="ordersBox"></div><a class="btn light" href="account.html">← الحساب</a></div><script>
const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});let me=null,profile=null,role=null;const ar={new:'جديد',accepted:'مقبول',on_the_way:'بالطريق',completed:'مكتمل',cancelled:'ملغي'};function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function init(){const {data}=await db.auth.getUser();me=data?.user||null;if(!me){info.innerHTML='يجب تسجيل الدخول أولاً.';return}const {data:p}=await db.from('profiles').select('*').eq('id',me.id).maybeSingle();profile=p;if(!p||p.account_type!=='employee'){info.textContent='هذه الصفحة للموظفين فقط.';return}if(p.employee_status!=='approved'){info.textContent='حساب الموظف بانتظار موافقة الإدارة.';return}const {data:r}=await db.from('employee_roles').select('*').eq('id',p.employee_role_id).maybeSingle();role=r;if(!role){info.textContent='تعذر تحديد وظيفة الموظف.';return}info.innerHTML='<strong>'+esc(role.role_name)+'</strong><div class="muted">القسم: '+esc(role.department)+'</div>';await load();db.channel('employee-orders-'+me.id).on('postgres_changes',{event:'*',schema:'public',table:'orders'},()=>load()).subscribe()}
async function load(){const {data,error}=await db.from('orders').select('*').eq('department',role.department).order('created_at',{ascending:false});if(error){ordersBox.innerHTML='<div class="card">تعذر تحميل الطلبات: '+esc(error.message)+'</div>';return}if(!data?.length){ordersBox.innerHTML='<div class="card empty">لا توجد طلبات حالياً.</div>';return}ordersBox.innerHTML=data.map(o=>{const mine=o.assigned_employee_id===me.id;return `<div class="card order"><div class="row"><strong>طلب #${o.id} — ${esc(o.order_type)}</strong><span class="badge">${esc(ar[o.status]||o.status)}</span></div><div class="muted">الهاتف: ${esc(o.phone||'—')}<br>المنطقة: ${esc(o.area||'—')}<br>${new Date(o.created_at).toLocaleString('ar-IQ')}</div><p>${esc(o.description||'')}</p>${o.attachment_url?`<a href="${esc(o.attachment_url)}" target="_blank">📎 فتح المرفق</a>`:''}<div class="actions">${!o.assigned_employee_id&&o.status==='new'?`<button class="primary" onclick="upd(${o.id},'accepted')">قبول الطلب</button>`:''}${mine&&o.status==='accepted'?`<button class="primary" onclick="upd(${o.id},'on_the_way')">أنا بالطريق</button>`:''}${mine&&o.status==='on_the_way'?`<a class="btn primary" href="employee-location.html?order=${o.id}">📍 مشاركة موقعي</a><button class="primary" onclick="upd(${o.id},'completed')">إنهاء الخدمة</button>`:''}${mine&&['accepted','on_the_way'].includes(o.status)?`<button class="danger" onclick="upd(${o.id},'cancelled')">إلغاء</button>`:''}${mine&&o.status==='completed'&&!o.employee_rating?`<button class="light" onclick="rate(${o.id})">⭐ تقييم العميل</button>`:''}${o.employee_rating?`<span class="badge">تقييمك للعميل: ${o.employee_rating}/5</span>`:''}</div></div>`}).join('')}
async function upd(id,status){const {error}=await db.rpc('employee_update_order',{p_order_id:id,p_status:status,p_assign_to_me:status==='accepted'});if(error)alert('تعذر تحديث الطلب: '+error.message);else load()}
async function rate(id){const r=Number(prompt('قيّم العميل من 1 إلى 5:'));if(!Number.isInteger(r)||r<1||r>5){alert('التقييم من 1 إلى 5');return}const review=prompt('ملاحظة (اختياري):')||null;const {error}=await db.rpc('employee_rate_order',{p_order_id:id,p_rating:r,p_review:review});if(error)alert(error.message);else load()}init();
</script></body></html>
