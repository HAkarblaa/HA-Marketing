<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>طلبات الموظف - HA Marketing</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f5;color:#111;font-family:Arial,Tahoma,sans-serif}
.wrap{width:94%;max-width:900px;margin:25px auto 60px}
h1{text-align:center}
.card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #0000000d}
.info{text-align:center;line-height:1.8}
.badge{display:inline-block;padding:6px 11px;border-radius:999px;background:#eee;font-size:14px;font-weight:bold}
.approved{background:#dff5e5;color:#146c2e}
.pending{background:#fff3cd;color:#7a5a00}
.rejected{background:#fde2e5;color:#9b1c31}
.order{border:1px solid #ddd;border-radius:14px;padding:15px;margin-top:13px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.meta{color:#666;font-size:14px;line-height:1.8;margin-top:8px}
.details{white-space:pre-wrap;margin-top:10px;background:#f7f7f7;padding:11px;border-radius:10px}
button,a.btn{border:0;border-radius:10px;padding:11px 14px;cursor:pointer;text-decoration:none;text-align:center;font-size:15px}
.primary{background:#111;color:#fff}
.light{background:#eee;color:#111}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.empty{text-align:center;color:#666;padding:25px}
select{padding:10px;border:1px solid #ccc;border-radius:9px;background:#fff}
</style>
</head>
<body>
<div class="wrap">
<h1>🧑‍💼 طلبات الموظف</h1>

<div id="employeeInfo" class="card info">جاري التحقق من حساب الموظف...</div>

<div id="controls" class="card" style="display:none">
  <div class="row">
    <strong>طلبات قسمك</strong>
    <select id="filter" onchange="renderOrders()">
      <option value="all">الكل</option>
      <option value="new">الجديدة</option>
      <option value="accepted">المقبولة</option>
      <option value="on_the_way">بالطريق</option>
      <option value="completed">المكتملة</option>
      <option value="cancelled">الملغاة</option>
    </select>
  </div>
</div>

<div id="orders"></div>

<a class="btn light" style="display:block;margin-top:15px" href="account.html">← الرجوع إلى الحساب</a>
</div>

<script>
const db=supabase.createClient(
'https://ubayrhtshgtgggxprrek.supabase.co',
'sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll'
);

let me=null, profile=null, role=null, allOrders=[];

const statusNames={
  new:'جديد',
  pending:'جديد',
  accepted:'مقبول',
  on_the_way:'بالطريق',
  completed:'مكتمل',
  cancelled:'ملغي'
};

function esc(v){
  return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}

async function init(){
  const {data}=await db.auth.getUser();
  me=data?.user;

  if(!me){
    employeeInfo.innerHTML='يجب تسجيل الدخول أولاً.<br><a class="btn primary" href="login.html">تسجيل الدخول</a>';
    return;
  }

  const {data:p,error}=await db.from('profiles').select('*').eq('id',me.id).maybeSingle();
  if(error || !p){
    employeeInfo.textContent='تعذر العثور على بيانات الحساب.';
    return;
  }
  profile=p;

  if(profile.account_type!=='employee'){
    employeeInfo.textContent='هذه الصفحة مخصصة لحسابات الموظفين فقط.';
    return;
  }

  if(profile.employee_role_id){
    const {data:r}=await db.from('employee_roles').select('*').eq('id',profile.employee_role_id).maybeSingle();
    role=r;
  }

  const roleName=role?.role_name || profile.employee_role || 'غير محددة';
  const department=role?.department || '';

  if(profile.employee_status!=='approved'){
    const label=profile.employee_status==='rejected'?'مرفوض':'قيد المراجعة';
    const cls=profile.employee_status==='rejected'?'rejected':'pending';
    employeeInfo.innerHTML=
      '<strong>'+esc(roleName)+'</strong><br>'+
      'حالة الحساب: <span class="badge '+cls+'">'+label+'</span><br>'+
      '<small>لا يمكن استلام الطلبات قبل موافقة الإدارة.</small>';
    return;
  }

  employeeInfo.innerHTML=
    '<strong>الوظيفة: '+esc(roleName)+'</strong><br>'+
    'الحالة: <span class="badge approved">مفعّل</span>'+
    (department?'<br>القسم: '+esc(department):'');

  controls.style.display='block';
  await loadOrders();
}

async function loadOrders(){
  orders.innerHTML='<div class="card empty">جاري تحميل الطلبات...</div>';

  const department=role?.department;
  if(!department){
    orders.innerHTML='<div class="card empty">لم يتم تحديد قسم لهذا الموظف.</div>';
    return;
  }

  const {data,error}=await db
    .from('orders')
    .select('*')
    .eq('department',department)
    .order('created_at',{ascending:false});

  if(error){
    orders.innerHTML='<div class="card empty">تعذر تحميل الطلبات: '+esc(error.message)+'</div>';
    return;
  }

  allOrders=data||[];
  renderOrders();
}

function renderOrders(){
  const f=filter.value;
  let list=allOrders;
  if(f!=='all'){
    list=list.filter(o=>{
      const s=(o.status||'new');
      if(f==='new') return s==='new'||s==='pending';
      return s===f;
    });
  }

  if(!list.length){
    orders.innerHTML='<div class="card empty">لا توجد طلبات حالياً.</div>';
    return;
  }

  orders.innerHTML=list.map(o=>{
    const status=o.status||'new';
    const mine=o.assigned_employee_id===me.id;
    const assignedOther=o.assigned_employee_id && !mine;
    const created=o.created_at?new Date(o.created_at).toLocaleString('ar-IQ'):'';

    return `<div class="card order">
      <div class="row">
        <strong>طلب #${esc(o.id)}</strong>
        <span class="badge">${esc(statusNames[status]||status)}</span>
      </div>
      <div class="meta">
        نوع الطلب: ${esc(o.order_type||'—')}<br>
        التاريخ: ${esc(created)}
        ${mine?'<br>هذا الطلب مُسند إليك':''}
        ${assignedOther?'<br>تم استلام هذا الطلب من موظف آخر':''}
      </div>
      ${o.details?`<div class="details">${esc(typeof o.details==='string'?o.details:JSON.stringify(o.details,null,2))}</div>`:''}
      <div class="actions">
        ${(!o.assigned_employee_id && (status==='new'||status==='pending'))?
          `<button class="primary" onclick="updateOrder(${Number(o.id)},'accepted',true)">قبول الطلب</button>`:''}
        ${mine && status==='accepted'?
          `<button class="primary" onclick="updateOrder(${Number(o.id)},'on_the_way',false)">بالطريق</button>`:''}
        ${mine && status==='on_the_way'?
          `<button class="primary" onclick="updateOrder(${Number(o.id)},'completed',false)">إكمال الطلب</button>`:''}
        ${mine && !['completed','cancelled'].includes(status)?
          `<button class="light" onclick="updateOrder(${Number(o.id)},'cancelled',false)">إلغاء</button>`:''}
      </div>
    </div>`;
  }).join('');
}

async function updateOrder(id,status,assignToMe){
  const {error}=await db.rpc('employee_update_order',{
    p_order_id:id,
    p_status:status,
    p_assign_to_me:assignToMe
  });

  if(error){
    alert('تعذر تحديث الطلب: '+error.message);
    return;
  }

  await loadOrders();
}

init();
</script>
</body>
</html>
