<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طلبات الموظف - HA Marketing</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f5f5f5;color:#111}
.wrap{width:94%;max-width:900px;margin:30px auto}
h1{text-align:center}
.status{padding:13px;border-radius:10px;background:#fff;text-align:center;margin-bottom:14px}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 4px 16px #0001;margin:14px 0}
.order{border:1px solid #ddd;border-radius:14px;padding:15px;margin-top:12px}
.order-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#eee;font-weight:bold}
.meta{color:#666;font-size:14px;line-height:1.8;margin-top:10px}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
button,a.btn{width:100%;display:block;padding:12px;border:0;border-radius:9px;text-align:center;text-decoration:none;font-size:15px;cursor:pointer}
.primary{background:#111;color:#fff}
.light{background:#eaeaea;color:#111}
.success{background:#126b2f;color:#fff}
.warning{background:#9a6100;color:#fff}
button:disabled{opacity:.5;cursor:not-allowed}
.empty{text-align:center;color:#666;padding:18px}
@media(max-width:600px){.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>🧑‍🔧 طلبات الموظف</h1>
<div id="pageStatus" class="status">جاري التحقق من حساب الموظف...</div>

<div id="contentBox" style="display:none">
  <div class="card">
    <h2>🆕 الطلبات الجديدة</h2>
    <div id="newOrders"><div class="empty">جاري التحميل...</div></div>
  </div>

  <div class="card">
    <h2>📋 طلباتي الحالية</h2>
    <div id="myOrders"><div class="empty">جاري التحميل...</div></div>
  </div>
</div>

<a class="btn light" href="index.html">← الرجوع إلى الرئيسية</a>
</div>

<script>
const db=supabase.createClient(
 'https://ubayrhtshgtgggxprrek.supabase.co',
 'sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll'
);

let currentUser=null;
let refreshTimer=null;

function esc(v){
 return String(v??'')
  .replaceAll('&','&amp;')
  .replaceAll('<','&lt;')
  .replaceAll('>','&gt;')
  .replaceAll('"','&quot;')
  .replaceAll("'",'&#039;');
}

async function init(){
 const {data}=await db.auth.getUser();
 currentUser=data.user||null;

 if(!currentUser){
  pageStatus.textContent='يجب تسجيل الدخول أولاً.';
  setTimeout(()=>location.href='login.html',1200);
  return;
 }

 const {data:employee,error}=await db
  .from('employees')
  .select('user_id,active')
  .eq('user_id',currentUser.id)
  .maybeSingle();

 if(error){
  pageStatus.textContent='تعذر التحقق من حساب الموظف: '+error.message;
  return;
 }

 if(!employee || employee.active!==true){
  pageStatus.textContent='هذا الحساب غير مسجل كموظف.';
  return;
 }

 pageStatus.textContent='✅ تم تسجيل الدخول كموظف.';
 contentBox.style.display='block';

 await refreshOrders();
 refreshTimer=setInterval(refreshOrders,5000);
}

async function refreshOrders(){
 await Promise.all([loadNewOrders(),loadMyOrders()]);
}

async function loadNewOrders(){
 const box=document.getElementById('newOrders');

 const {data,error}=await db
  .from('service_orders')
  .select('id,user_id,status,customer_lat,customer_lng,created_at')
  .is('employee_id',null)
  .eq('status','جديد')
  .order('created_at',{ascending:true});

 if(error){
  box.innerHTML='<div class="empty">تعذر تحميل الطلبات الجديدة: '+esc(error.message)+'</div>';
  return;
 }

 if(!data || data.length===0){
  box.innerHTML='<div class="empty">لا توجد طلبات جديدة حالياً.</div>';
  return;
 }

 box.innerHTML=data.map(order=>`
  <div class="order">
    <div class="order-head">
      <strong>طلب خدمة</strong>
      <span class="badge">${esc(order.status)}</span>
    </div>
    <div class="meta">
      رقم الطلب: ${esc(order.id)}<br>
      تاريخ الطلب: ${new Date(order.created_at).toLocaleString('ar-IQ')}
    </div>
    <div class="actions">
      <button class="primary accept-btn" data-id="${esc(order.id)}">✅ قبول الطلب</button>
    </div>
  </div>
 `).join('');

 document.querySelectorAll('.accept-btn').forEach(btn=>{
  btn.addEventListener('click',()=>acceptOrder(btn.dataset.id,btn));
 });
}

async function loadMyOrders(){
 const box=document.getElementById('myOrders');

 const {data,error}=await db
  .from('service_orders')
  .select('id,user_id,employee_id,status,customer_lat,customer_lng,employee_lat,employee_lng,created_at,updated_at')
  .eq('employee_id',currentUser.id)
  .not('status','in','("مكتمل","ملغي")')
  .order('created_at',{ascending:false});

 if(error){
  box.innerHTML='<div class="empty">تعذر تحميل طلباتك: '+esc(error.message)+'</div>';
  return;
 }

 if(!data || data.length===0){
  box.innerHTML='<div class="empty">لا توجد طلبات نشطة لديك.</div>';
  return;
 }

 box.innerHTML=data.map(order=>{
  let buttons='';

  if(order.status==='مقبول'){
   buttons+=`<button class="warning action-btn" data-id="${esc(order.id)}" data-status="بالطريق">🚗 أنا بالطريق</button>`;
  }

  if(order.status==='بالطريق'){
   buttons+=`<a class="btn primary" href="employee-location.html?order=${encodeURIComponent(order.id)}">📍 مشاركة موقعي</a>`;
   buttons+=`<button class="success action-btn" data-id="${esc(order.id)}" data-status="وصل">📍 وصلت</button>`;
  }

  if(order.status==='وصل'){
   buttons+=`<button class="success action-btn" data-id="${esc(order.id)}" data-status="مكتمل">✅ إنهاء الخدمة</button>`;
  }

  return `
   <div class="order">
    <div class="order-head">
      <strong>طلب خدمة</strong>
      <span class="badge">${esc(order.status)}</span>
    </div>
    <div class="meta">
      رقم الطلب: ${esc(order.id)}<br>
      تاريخ الطلب: ${new Date(order.created_at).toLocaleString('ar-IQ')}
    </div>
    <div class="actions">${buttons || '<div class="empty">لا توجد إجراءات متاحة لهذه الحالة.</div>'}</div>
   </div>
  `;
 }).join('');

 document.querySelectorAll('.action-btn').forEach(btn=>{
  btn.addEventListener('click',()=>changeStatus(btn.dataset.id,btn.dataset.status,btn));
 });
}

async function acceptOrder(orderId,button){
 button.disabled=true;
 button.textContent='جاري القبول...';

 const {data,error}=await db
  .from('service_orders')
  .update({
   employee_id:currentUser.id,
   status:'مقبول',
   updated_at:new Date().toISOString()
  })
  .eq('id',orderId)
  .is('employee_id',null)
  .eq('status','جديد')
  .select('id')
  .maybeSingle();

 if(error){
  alert('تعذر قبول الطلب: '+error.message);
 }else if(!data){
  alert('هذا الطلب تم قبوله من موظف آخر أو لم يعد متاحاً.');
 }else{
  alert('✅ تم قبول الطلب.');
 }

 await refreshOrders();
}

async function changeStatus(orderId,newStatus,button){
 button.disabled=true;

 const {error}=await db
  .from('service_orders')
  .update({
   status:newStatus,
   updated_at:new Date().toISOString()
  })
  .eq('id',orderId)
  .eq('employee_id',currentUser.id);

 if(error){
  alert('تعذر تحديث حالة الطلب: '+error.message);
  button.disabled=false;
  return;
 }

 if(newStatus==='بالطريق'){
  location.href='employee-location.html?order='+encodeURIComponent(orderId);
  return;
 }

 alert('تم تحديث حالة الطلب إلى: '+newStatus);
 await refreshOrders();
}

window.addEventListener('beforeunload',()=>{
 if(refreshTimer)clearInterval(refreshTimer);
});

init();
</script>
</body>
</html>
