<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة طلب الخدمة</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f5f5}.wrap{width:96%;max-width:1150px;margin:18px auto}.card{background:#fff;border-radius:15px;padding:14px;margin:12px 0;box-shadow:0 4px 15px #0001}.tabs{display:flex;gap:8px;flex-wrap:wrap}.btn,button{border:0;background:#111;color:#fff;padding:10px 13px;border-radius:9px;text-decoration:none;cursor:pointer}.light{background:#eee;color:#111}.danger{background:#9b1733}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}input,textarea,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:9px}textarea{min-height:80px}.list{display:grid;gap:9px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.hidden{display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="row"><a class="btn light" href="admin-panel.html">← لوحة الأدمن</a><h1>🛠️ إدارة طلب الخدمة</h1></div><div id="denied" class="card hidden">لا تملك صلاحية الإدارة.</div><div id="app" class="hidden"><div class="tabs"><button onclick="show('cats')">الأقسام</button><button onclick="show('providers')">مقدمو الخدمة</button><button onclick="show('orders')">طلبات الزبائن</button></div><section id="cats" class="view"><div class="card"><h2>إضافة قسم</h2><div class="grid"><input id="cname" placeholder="اسم القسم: حداد"><input id="cicon" placeholder="الأيقونة: ⚒️"><input id="cdesc" placeholder="الوصف"><input id="csort" type="number" value="100" placeholder="الترتيب"></div><button onclick="addCat()">إضافة القسم</button></div><div id="catList" class="list"></div></section><section id="providers" class="view hidden"><div class="card"><h2>إضافة مقدم خدمة</h2><div class="grid"><select id="pcat"></select><input id="pname" placeholder="الاسم"><input id="pphone" placeholder="رقم الهاتف"><input id="pwa" placeholder="واتساب"><input id="pgov" placeholder="المحافظة"><input id="parea" placeholder="المنطقة"><input id="paddress" placeholder="العنوان"><input id="phours" placeholder="أوقات العمل"><input id="pprice" type="number" placeholder="السعر يبدأ من"><input id="ppriceNote" placeholder="ملاحظة السعر"><input id="pmap" placeholder="رابط الموقع/الخريطة"><input id="pimg" type="file" accept="image/*"><textarea id="pdesc" placeholder="الوصف"></textarea><textarea id="pskills" placeholder="المهارات والخدمات"></textarea></div><label><input id="pavail" type="checkbox" checked> متوفر</label> <label><input id="pverified" type="checkbox"> موثّق</label><br><button onclick="addProvider()">إضافة مقدم الخدمة</button></div><div id="providerList" class="list"></div></section><section id="orders" class="view hidden"><div id="orderList"></div></section></div></div><script>
const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,storageKey:'ha-marketing-auth'}});let me=null,cats=[];const S={new:'جديد',accepted:'مقبول',on_the_way:'بالطريق',in_progress:'قيد التنفيذ',completed:'مكتمل',cancelled:'ملغي'};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');if(id==='orders')loadOrders()}async function init(){me=(await db.auth.getUser()).data.user;if(!me){denied.classList.remove('hidden');return}let ok=false;try{const r=await db.rpc('is_app_admin');ok=!!r.data}catch(e){}if(!ok&&me.id==='f65185bb-1761-42c0-b358-1b0277555e24')ok=true;if(!ok){denied.classList.remove('hidden');return}app.classList.remove('hidden');await loadCats();await loadProviders()}async function loadCats(){const {data,error}=await db.from('service_categories').select('*').order('sort_order');if(error){catList.innerHTML='<div class="card">'+esc(error.message)+'</div>';return}cats=data||[];pcat.innerHTML=cats.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');catList.innerHTML=cats.map(x=>`<div class="card row"><span>${esc(x.icon)} <b>${esc(x.name)}</b> - ${esc(x.description||'')}</span><button class="danger" onclick="delCat(${x.id})">حذف</button></div>`).join('')}async function addCat(){const {error}=await db.from('service_categories').insert({name:cname.value.trim(),icon:cicon.value.trim()||'🛠️',description:cdesc.value.trim(),sort_order:Number(csort.value)||100});if(error)return alert(error.message);cname.value=cdesc.value='';loadCats()}async function delCat(id){if(!confirm('حذف القسم وكل مقدمي الخدمة داخله؟'))return;const {error}=await db.from('service_categories').delete().eq('id',id);if(error)return alert(error.message);loadCats();loadProviders()}async function uploadImg(){const f=pimg.files[0];if(!f)return null;const ext=(f.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'');const path=`providers/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;const {error}=await db.storage.from('service-images').upload(path,f,{upsert:false});if(error)throw error;return db.storage.from('service-images').getPublicUrl(path).data.publicUrl}async function addProvider(){try{const image_url=await uploadImg();const payload={category_id:Number(pcat.value),name:pname.value.trim(),phone:pphone.value.trim(),whatsapp:pwa.value.trim(),governorate:pgov.value.trim(),area:parea.value.trim(),address:paddress.value.trim(),working_hours:phours.value.trim(),price_from:pprice.value?Number(pprice.value):null,price_note:ppriceNote.value.trim(),map_url:pmap.value.trim(),image_url,description:pdesc.value.trim(),skills:pskills.value.trim(),is_available:pavail.checked,is_verified:pverified.checked};const {error}=await db.from('service_providers').insert(payload);if(error)throw error;alert('تمت الإضافة');pname.value=pphone.value=pwa.value=pgov.value=parea.value=paddress.value=phours.value=pprice.value=ppriceNote.value=pmap.value=pdesc.value=pskills.value='';pimg.value='';loadProviders()}catch(e){alert(e.message)}}async function loadProviders(){const {data,error}=await db.from('service_providers').select('*,service_categories(name)').order('created_at',{ascending:false});providerList.innerHTML=error?'<div class="card">'+esc(error.message)+'</div>':(data||[]).map(x=>`<div class="card"><div class="row"><b>${esc(x.name)} - ${esc(x.service_categories?.name||'')}</b><span>${x.is_available?'🟢':'🔴'} ${x.is_verified?'✅':''}</span></div><div>📞 ${esc(x.phone||'')} | 📍 ${esc([x.governorate,x.area,x.address].filter(Boolean).join(' - '))}</div><div class="row"><button onclick="toggleProvider(${x.id},${!x.is_active})">${x.is_active?'إيقاف':'تفعيل'}</button><button class="danger" onclick="delProvider(${x.id})">حذف</button></div></div>`).join('')}async function toggleProvider(id,v){await db.from('service_providers').update({is_active:v}).eq('id',id);loadProviders()}async function delProvider(id){if(!confirm('حذف مقدم الخدمة؟'))return;const {error}=await db.from('service_providers').delete().eq('id',id);if(error)return alert(error.message);loadProviders()}async function loadOrders(){const {data,error}=await db.from('service_requests').select('*,service_providers(name),service_categories(name)').order('created_at',{ascending:false});orderList.innerHTML=error?'<div class="card">'+esc(error.message)+'</div>':(data||[]).map(o=>`<div class="card"><div class="row"><b>طلب #${o.id} - ${esc(o.customer_name)}</b><select onchange="setStatus(${o.id},this.value)">${Object.entries(S).map(([k,v])=>`<option value="${k}" ${o.status===k?'selected':''}>${v}</option>`).join('')}</select></div><div>🛠️ ${esc(o.service_categories?.name||'')} - ${esc(o.service_providers?.name||'')}<br>📞 ${esc(o.phone)}<br>📍 ${esc(o.address)}<br>📝 ${esc(o.details)}<br>🕒 ${new Date(o.created_at).toLocaleString('ar-IQ')}</div></div>`).join('')}async function setStatus(id,status){const {error}=await db.from('service_requests').update({status}).eq('id',id);if(error)alert(error.message)}init();
</script></body></html>
