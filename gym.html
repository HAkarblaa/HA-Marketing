<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الجم واللياقة</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f7f4fb}.w{width:min(1000px,94%);margin:20px auto}.c{background:#fff;border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 3px 14px #0001}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}input,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;margin:5px 0}button,.b{border:0;background:#5b2d82;color:#fff;padding:11px 14px;border-radius:10px;text-decoration:none}#f{display:none}.muted{color:#667;line-height:1.7}@media(max-width:650px){.g{grid-template-columns:1fr}}</style></head><body><div class=w><a class=b href="sports.html">← الرياضة</a> <a class=b href="sports-owner.html">إدارة الطلبات والدوريات</a><h1>🏋️ الجم واللياقة</h1><div class=c><button onclick=openF()>＋ إضافة مركز رياضي</button><div class=muted>الإضافة للموظف المعتمد/مقدم الخدمة أو الأدمن الرئيسي، والعميل يرسل طلب اشتراك.</div></div><div id=f class=c><input id=n placeholder="اسم المركز"><input id=a placeholder="العنوان"><input id=g placeholder="المحافظة"><input id=h placeholder="ساعات العمل"><input id=p type=number placeholder="سعر الاشتراك الشهري"><input id=ph placeholder="الهاتف"><textarea id=d placeholder="الأجهزة، المدربين، أقسام الرجال/النساء، الخدمات"></textarea><button onclick=save()>حفظ</button></div><div id=list class=g></div></div><script>const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});
let me=null,manager=false;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function init(){let {data:{session}}=await db.auth.getSession();me=session?.user||null;if(me){let {data}=await db.rpc('can_manage_sports');manager=!!data}load()}function openF(){if(!me)return location.href='login.html?next=gym.html';if(!manager)return alert('إضافة المركز متاحة للموظف المعتمد/مقدم الخدمة أو الأدمن الرئيسي.');f.style.display='block'}async function save(){let row={owner_user_id:me.id,facility_type:'gym',name:n.value.trim(),address:a.value.trim(),governorate:g.value.trim(),working_hours:h.value.trim(),price:+p.value||0,phone:ph.value.trim(),details:d.value.trim()};if(!row.name||!row.address)return alert('أكمل الاسم والعنوان');let {error}=await db.from('sports_facilities').insert(row);if(error)return alert(error.message);f.style.display='none';load()}async function load(){let {data,error}=await db.from('sports_facilities').select('*').eq('facility_type','gym').eq('is_active',true).order('created_at',{ascending:false});if(error){list.innerHTML='<div class=c>شغّل SQL الجديد أولاً.</div>';return}list.innerHTML=(data||[]).map(x=>`<article class=c><h3>🏋️ ${esc(x.name)}</h3><div>${esc(x.governorate||'')} — ${esc(x.address||'')}</div><div class=muted>الدوام: ${esc(x.working_hours||'—')}<br>الاشتراك: ${Number(x.price||0).toLocaleString('ar-IQ')} د.ع<br>${esc(x.details||'')}</div><button onclick="join(${x.id})">طلب اشتراك</button></article>`).join('')||'<div class=c>لا توجد مراكز مضافة بعد.</div>'}async function join(id){if(!me)return location.href='login.html?next=gym.html';let note=prompt('ملاحظة للطلب (اختياري)')||'';let {error}=await db.from('sports_bookings').insert({user_id:me.id,facility_id:id,status:'pending',notes:note});alert(error?error.message:'✅ تم إرسال طلب الاشتراك')}init();</script></body></html>
