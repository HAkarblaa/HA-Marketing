<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة مقدم الخدمة</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f5f5f5;color:#111}.wrap{width:94%;max-width:1050px;margin:22px auto}.top,.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.btn,button{border:0;border-radius:11px;padding:11px 14px;background:#111;color:#fff;text-decoration:none;cursor:pointer;font:inherit}.light{background:#eee;color:#111}.danger{background:#9b1028}.ok{background:#0c6b2a}.card{background:#fff;border-radius:16px;padding:15px;margin:12px 0;box-shadow:0 4px 16px #0001}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.muted{color:#666;line-height:1.7}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eee;font-size:12px}input,select,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;font:inherit;margin:5px 0 10px}textarea{min-height:90px}.status{padding:10px;border-radius:10px;background:#f1f1f1;white-space:pre-wrap}@media(max-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.card{padding:10px}.grid .card{font-size:12px}}</style></head><body><div class="wrap"><div class="top"><a class="btn light" href="services.html">← الخدمات</a><h1>🛠️ لوحة مقدم الخدمة</h1><a class="btn light" href="marketplace-onboarding.html">حالة الاعتماد</a></div><div id="gate" class="card">جاري التحقق...</div><div id="panel" style="display:none"><div class="card"><h2>ملفي المهني</h2><select id="cat"></select><input id="name" placeholder="الاسم / اسم النشاط"><input id="phone" placeholder="الهاتف"><input id="whatsapp" placeholder="واتساب"><input id="gov" placeholder="المحافظة"><input id="address" placeholder="العنوان"><input id="price" type="number" placeholder="السعر يبدأ من"><textarea id="skills" placeholder="الخدمات والمهارات"></textarea><textarea id="hours" placeholder="أوقات العمل"></textarea><button onclick="saveProfile()">حفظ الملف</button></div><div class="card"><h2>الطلبات الواردة</h2><div id="requests">جاري التحميل...</div></div></div></div><script>const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});
let me=null,p=null;function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function init(){const {data:{session}}=await db.auth.getSession();if(!session){location.href='login.html';return}me=session.user;const {data:ok}=await db.rpc('has_approved_role',{p_role:'service_provider'});if(!ok){gate.innerHTML='حسابك غير معتمد كمقدم خدمة بعد. <a href="marketplace-onboarding.html">متابعة الطلب</a>';return}gate.innerHTML='✅ مقدم خدمة معتمد';panel.style.display='block';const {data:cats}=await db.from('service_categories').select('id,name').eq('is_active',true).order('sort_order');cat.innerHTML=(cats||[]).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');const {data:x}=await db.from('service_providers').select('*').eq('owner_user_id',me.id).maybeSingle();if(x){p=x;cat.value=x.category_id;name.value=x.name;phone.value=x.phone||'';whatsapp.value=x.whatsapp||'';gov.value=x.governorate||'';address.value=x.address||'';price.value=x.price_from||'';skills.value=x.skills||'';hours.value=x.working_hours||''}loadReq()}async function saveProfile(){const payload={owner_user_id:me.id,category_id:Number(cat.value),name:name.value.trim(),phone:phone.value.trim()||null,whatsapp:whatsapp.value.trim()||null,governorate:gov.value.trim()||null,address:address.value.trim()||null,price_from:price.value?Number(price.value):null,skills:skills.value.trim()||null,working_hours:hours.value.trim()||null,is_active:true,is_verified:true,is_available:true};if(!payload.name)return alert('اكتب الاسم');let r=p?await db.from('service_providers').update(payload).eq('id',p.id).select().single():await db.from('service_providers').insert(payload).select().single();if(r.error)return alert(r.error.message);p=r.data;alert('تم الحفظ');loadReq()}async function loadReq(){if(!p){requests.textContent='احفظ ملفك المهني أولاً.';return}const {data,error}=await db.from('service_requests').select('*').eq('provider_id',p.id).order('created_at',{ascending:false});requests.innerHTML=error?esc(error.message):(data||[]).map(x=>`<div class="card"><div class="row"><b>طلب #${x.id}</b><span class="badge">${x.status}</span></div><div>${esc(x.customer_name)} — ${esc(x.phone)}</div><div class="muted">${esc(x.address)}<br>${esc(x.details)}</div><div class="row" style="margin-top:8px">${x.status==='new'?`<button onclick="st(${x.id},'accepted')">قبول</button><button class="danger" onclick="st(${x.id},'cancelled')">رفض</button>`:''}${x.status==='accepted'?`<button onclick="st(${x.id},'on_the_way')">بالطريق</button>`:''}${x.status==='on_the_way'?`<button onclick="st(${x.id},'in_progress')">بدأت الخدمة</button>`:''}${x.status==='in_progress'?`<button class="ok" onclick="st(${x.id},'completed')">إكمال</button>`:''}</div></div>`).join('')||'لا توجد طلبات.'}async function st(id,status){const {error}=await db.from('service_requests').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else loadReq()}init();</script></body></html>
