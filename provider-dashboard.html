(function(){
 'use strict';
 const panel=document.getElementById('panel'),profile=document.getElementById('providerProfileCard'),inbox=document.getElementById('incomingRequestsCard'),balance=document.getElementById('providerBalanceCard');
 const tabs=document.createElement('div');tabs.id='haProviderTabs';tabs.setAttribute('role','tablist');tabs.setAttribute('aria-label','أقسام مقدم الخدمة');
 const names={requests:'الطلبات',profile:'الملف المهني',settings:'الإعدادات'};const views={};
 Object.keys(names).forEach(key=>{const button=document.createElement('button');button.type='button';button.id='haProviderTab-'+key;button.dataset.providerTab=key;button.textContent=names[key];button.setAttribute('role','tab');button.setAttribute('aria-controls','haProviderView-'+key);tabs.appendChild(button);const view=document.createElement('section');view.id='haProviderView-'+key;view.dataset.providerPanel=key;view.setAttribute('role','tabpanel');view.setAttribute('aria-labelledby',button.id);views[key]=view;});
 panel.prepend(tabs);Object.values(views).forEach(v=>panel.appendChild(v));views.requests.appendChild(inbox);views.profile.appendChild(profile);
 views.settings.innerHTML='<div class="card"><h2>الإعدادات</h2><p class="ha-provider-description">إشعارات الطلبات وروابط إدارة الحساب.</p><button id="haPushButton" data-ha-push-button type="button" class="light">تشغيل إشعارات الموبايل</button><a class="btn light" href="work-center.html">مركز العمل</a><a class="btn light" href="services.html">تصفح الخدمات</a></div>';views.settings.appendChild(balance);
 const fields=document.createElement('div');fields.className='ha-provider-fields';
 const labels={cat:'المهنة',name:'الاسم / اسم النشاط',phone:'رقم الهاتف',whatsapp:'رقم واتساب',gov:'المحافظة',address:'العنوان',price:'السعر يبدأ من (د.ع)',skills:'الخدمات والمهارات',hours:'أوقات العمل'};
 Object.keys(labels).forEach(id=>{const input=document.getElementById(id),field=document.createElement('div'),label=document.createElement('label');field.className='ha-provider-field'+(['address','skills','hours'].includes(id)?' ha-provider-wide':'');label.htmlFor=id;label.textContent=labels[id];field.append(label,input);if(id==='cat'){const other=document.getElementById('otherCatBox');const otherLabel=document.createElement('label');otherLabel.htmlFor='otherCat';otherLabel.textContent='اسم المهنة الأخرى';other.prepend(otherLabel);field.appendChild(other);}if(id==='address'){field.append(document.getElementById('providerLocateBtn'),document.getElementById('providerLocStatus'));}fields.appendChild(field);});
 const save=profile.querySelector('button[onclick="saveProfile()"]');save.classList.add('ha-provider-save');profile.insertBefore(fields,save);
 let active='requests';
 function syncNav(){document.querySelectorAll('#haRoleBottomNav a').forEach(a=>{const u=new URL(a.href,location.href);if(u.pathname.split('/').pop()!=='provider-dashboard.html')return;const key=u.searchParams.get('view')==='requests'?'requests':'profile';a.classList.toggle('active',key===active);if(key===active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});}
 function show(key,write){if(!views[key])key='requests';active=key;Object.keys(views).forEach(k=>{views[k].hidden=k!==key;const b=document.getElementById('haProviderTab-'+k);b.setAttribute('aria-selected',String(k===key));b.tabIndex=k===key?0:-1;});if(write){const u=new URL(location.href);u.searchParams.delete('view');u.searchParams.delete('request');u.searchParams.delete('source');u.hash=key==='requests'?'incomingRequestsCard':key==='profile'?'providerProfileCard':'providerSettings';history.replaceState(null,'',u);}syncNav();}
 function fromLocation(){const u=new URL(location.href);show(u.searchParams.get('view')==='requests'||u.searchParams.has('request')||u.hash==='#incomingRequestsCard'?'requests':u.hash==='#providerProfileCard'?'profile':u.hash==='#providerSettings'?'settings':'requests',false);}
 tabs.addEventListener('click',e=>{const b=e.target.closest('[data-provider-tab]');if(b)show(b.dataset.providerTab,true);});
 tabs.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;const bs=Array.from(tabs.querySelectorAll('button'));let i=bs.indexOf(document.activeElement);if(i<0)return;e.preventDefault();i=e.key==='Home'?0:e.key==='End'?bs.length-1:(i+(e.key==='ArrowLeft'?1:-1)+bs.length)%bs.length;show(bs[i].dataset.providerTab,true);bs[i].focus();});
 document.addEventListener('click',e=>{const a=e.target.closest('#haRoleBottomNav a');if(!a)return;const u=new URL(a.href,location.href);if(u.pathname.split('/').pop()==='provider-dashboard.html'){e.preventDefault();show(u.searchParams.get('view')==='requests'?'requests':'profile',true);tabs.scrollIntoView({behavior:'smooth',block:'start'});}});
 window.addEventListener('hashchange',fromLocation);window.addEventListener('popstate',fromLocation);
 const navWatch=new MutationObserver(()=>{if(document.getElementById('haRoleBottomNav')){syncNav();navWatch.disconnect();}});navWatch.observe(document.body,{childList:true});fromLocation();window.HA_ProviderWorkspace={show:key=>show(key,true)};

<script>
const db=supabase.createClient(
  'https://ubayrhtshgtgggxprrek.supabase.co',
  'sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',
  {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}}
);

const providerNameEl=document.getElementById('name');
const providerPhoneEl=document.getElementById('phone');
const providerGovEl=document.getElementById('gov');
const providerAddressEl=document.getElementById('address');
const otherCatBox=document.getElementById('otherCatBox');
const otherCat=document.getElementById('otherCat');

let me=null,p=null,providerLat=null,providerLng=null,categories=[];

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

const statusLabel=s=>({
  new:'جديد',
  pending:'جديد',
  accepted:'مقبول',
  on_the_way:'بالطريق',
  in_progress:'قيد التنفيذ',
  completed:'مكتمل',
  cancelled:'ملغي'
}[s]||s||'');

function categoryChanged(){
  otherCatBox.style.display=cat.value==='other'?'block':'none';
}

async function init(){
  const {data:{session}}=await db.auth.getSession();
  if(!session){location.href='login.html';return}
  me=session.user;

  const {data:ok,error:permError}=await db.rpc('has_approved_role',{p_role:'service_provider'});
  if(permError){
    gate.innerHTML='تعذر التحقق من صلاحية مقدم الخدمة: '+esc(permError.message)+'<br><a href="service-provider-registration.html">فتح تسجيل مقدم الخدمة</a>';
    return;
  }
  if(!ok){
    gate.innerHTML='حسابك غير معتمد كمقدم خدمة بعد. <a href="add-service.html">إرسال/متابعة طلب إضافة الخدمة</a>';
    return;
  }

  gate.innerHTML='✅ مقدم خدمة معتمد — اختر مهنتك واحفظ الملف حتى تستلم طلبات نفس المهنة.';
  panel.style.display='block';

  const {data:cats,error:catError}=await db.from('service_categories')
    .select('id,name')
    .eq('is_active',true)
    .order('sort_order');

  if(catError){
    cat.innerHTML='<option value="">تعذر تحميل المهن</option>';
    return;
  }

  categories=cats||[];
  cat.innerHTML='<option value="">اختر المهنة</option>'
    +categories.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')
    +'<option value="other">➕ غير ذلك / مهنة أخرى</option>';
  cat.onchange=categoryChanged;

  const {data:profiles,error:profileError}=await db.from('service_providers')
    .select('*')
    .eq('owner_user_id',me.id)
    .order('updated_at',{ascending:false})
    .limit(1);

  if(profileError){
    gate.innerHTML+=' <div class="muted">تعذر تحميل الملف: '+esc(profileError.message)+'</div>';
  }

  const x=(profiles||[])[0]||null;
  if(x){
    p=x;
    if(x.category_id){
      cat.value=String(x.category_id);
    }else if(x.other_profession){
      cat.value='other';
      otherCat.value=x.other_profession;
    }
    categoryChanged();

    providerNameEl.value=x.name||x.full_name||'';
    providerPhoneEl.value=x.phone||'';
    whatsapp.value=x.whatsapp||'';
    providerGovEl.value=x.governorate||'';
    providerAddressEl.value=x.address||'';
    providerLat=x.lat??null;
    providerLng=x.lng??null;
    if(providerLat!=null&&providerLng!=null)providerLocStatus.textContent='✅ موقع الخدمة محفوظ';
    price.value=x.price_from||'';
    skills.value=x.skills||'';
    hours.value=x.working_hours||'';
  }else{
    const {data:pr}=await db.from('profiles')
      .select('full_name,phone,governorate')
      .eq('id',me.id)
      .maybeSingle();
    if(pr){
      providerNameEl.value=pr.full_name||'';
      providerPhoneEl.value=pr.phone||'';
      providerGovEl.value=pr.governorate||'';
    }
  }

  await loadReq();
  db.channel('ha-provider-notifications-'+me.id)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+me.id},()=>loadReq()).subscribe();
  setInterval(()=>{if(document.visibilityState==='visible')loadReq();},30000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')loadReq();});

  if(new URLSearchParams(location.search).get('view')==='requests'){
    setTimeout(()=>{
      document.getElementById('incomingRequestsCard')?.scrollIntoView({behavior:'smooth',block:'start'});
    },250);
  }
}

async function redeemProviderBalance(){
  const code=prompt('أدخل كود تعبئة رصيد مقدم الخدمة:');
  if(code===null)return;
  if(!code.trim()){alert('اكتب الكود أولاً');return}

  const {data,error}=await db.rpc('redeem_balance_recharge_code',{
    p_code:code.trim(),
    p_role_type:'service_provider'
  });

  if(error){alert('تعذر إضافة الرصيد: '+error.message);return}

  providerBalanceValue.textContent=
    Number(data?.balance||0).toLocaleString('ar-IQ',{maximumFractionDigits:2})+' د.ع';

  alert('✅ تمت إضافة '+Number(data?.added||0).toLocaleString('ar-IQ')+' د.ع');
}
window.addEventListener('ha-role-balance-changed',e=>{if(e.detail?.role==='service_provider'&&e.detail.amount>0)loadReq();});
async function loadProviderBalance(){
  let amount=0;
  try{
    const {data}=await db.from('role_balances')
      .select('balance')
      .eq('user_id',me.id)
      .eq('role_type','service_provider')
      .maybeSingle();
    amount=Number(data?.balance||0);
  }catch(e){}
  providerBalanceValue.textContent=
    amount.toLocaleString('ar-IQ',{maximumFractionDigits:2})+' د.ع';
}
async function saveProfile(){
  // إضافة خدمة جديدة أو تغيير نوع الخدمة يحتاج موافقة الإدارة أولاً.
  if(!p?.id){
    alert('إضافة الخدمة تحتاج موافقة الإدارة أولاً.');
    location.href='add-service.html';
    return;
  }

  if(cat.value==='other'){
    alert('إضافة نوع خدمة جديد تحتاج موافقة الإدارة أولاً.');
    location.href='add-service.html';
    return;
  }

  const requestedCategory=Number(cat.value);
  if(Number.isFinite(requestedCategory) && Number(p.category_id)!==requestedCategory){
    alert('تغيير نوع الخدمة يحتاج موافقة الإدارة أولاً.');
    location.href='add-service.html';
    return;
  }

  if(!cat.value)return alert('اختر المهنة أولاً');
  if(!providerNameEl.value.trim())return alert('اكتب الاسم / اسم النشاط');

  let categoryId=null;
  let otherProfession=null;

  if(cat.value==='other'){
    otherProfession=otherCat.value.trim();
    if(!otherProfession)return alert('اكتب اسم المهنة الأخرى');

    const {data:newId,error:categoryError}=await db.rpc('ensure_service_category',{p_name:otherProfession});
    if(categoryError)return alert('تعذر حفظ المهنة الجديدة: '+categoryError.message);
    categoryId=Number(newId);
    if(!Number.isFinite(categoryId))return alert('تعذر إنشاء قسم المهنة');
  }else{
    categoryId=Number(cat.value);
    if(!Number.isFinite(categoryId))return alert('اختر مهنة صحيحة');
  }

  if(providerLat==null||providerLng==null){
    try{
      const pos=await HA_Nearby.getCurrent({allowCache:false});
      providerLat=pos.lat;providerLng=pos.lng;
      providerLocStatus.textContent='✅ تم اعتماد موقعك الحالي';
    }catch(e){
      return alert('فعّل GPS وحدد موقع الخدمة حتى تظهر للزبائن حسب الأقرب.');
    }
  }

  const displayName=providerNameEl.value.trim();
  const payload={
    owner_user_id:me.id,
    category_id:categoryId,
    name:displayName,
    full_name:displayName,
    phone:providerPhoneEl.value.trim()||null,
    whatsapp:whatsapp.value.trim()||null,
    governorate:providerGovEl.value.trim()||null,
    address:providerAddressEl.value.trim()||null,
    lat:providerLat,
    lng:providerLng,
    price_from:price.value?Number(price.value):null,
    skills:skills.value.trim()||null,
    description:skills.value.trim()||null,
    working_hours:hours.value.trim()||null,
    other_profession:otherProfession,
    is_active:true,
    is_verified:true,
    is_available:true,
    updated_at:new Date().toISOString()
  };

  let result;
  if(p?.id){
    result=await db.from('service_providers')
      .update(payload)
      .eq('id',p.id)
      .eq('owner_user_id',me.id)
      .select()
      .single();
  }else{
    result=await db.from('service_providers')
      .insert(payload)
      .select()
      .single();
  }

  if(result.error)return alert('تعذر حفظ الملف: '+result.error.message);

  p=result.data;
  cat.value=String(p.category_id);
  otherCatBox.style.display='none';
  alert('✅ تم حفظ المهنة والملف بنجاح');
  await loadReq();
}

providerLocateBtn.onclick=async()=>{
  providerLocStatus.textContent='جاري تحديد الموقع...';
  try{
    const pos=await HA_Nearby.getCurrent({allowCache:false});
    providerLat=pos.lat;providerLng=pos.lng;
    providerLocStatus.textContent='✅ تم تحديد موقع الخدمة بدقة';
  }catch(e){
    providerLocStatus.textContent='تعذر تحديد الموقع. فعّل GPS والسماح بالموقع.';
  }
};

let reqLoading=false;
function providerAttachmentLinks(o){
  const urls=[...new Set([...(Array.isArray(o.attachment_urls)?o.attachment_urls:[]),o.attachment_url].filter(Boolean))]
    .filter(u=>{try{return ['https:','http:'].includes(new URL(u).protocol)}catch(e){return false}});
  return urls.map((url,i)=>`<a class="btn light" href="${esc(url)}">فتح المرفق <span data-no-i18n>${i+1}</span></a>`).join('');
}
async function loadReq(){
  if(!me||reqLoading)return;
  reqLoading=true;
  try{
    const {data,error}=await db.rpc('get_provider_service_inbox');
    if(error){requests.textContent='تعذر تحميل الطلبات: '+error.message;return;}
    const params=new URLSearchParams(location.search),raw=params.get('request');
    const requested=raw&&/^\d+$/.test(raw)?Number(raw):null;
    const source=params.get('source')||'requests';
    const isRequested=x=>Number(x.id)===requested&&x.source===source;
    const arr=(Array.isArray(data)?data:[]).sort((a,b)=>Number(isRequested(b))-Number(isRequested(a)));
    requests.innerHTML=arr.length?arr.map(x=>{
      const general=x.source==='orders',mine=x.mine===true,open=['new','pending'].includes(x.status);
      const args=Number(x.id)+",'"+(general?'orders':'requests')+"'";
      return `<div class="card" data-provider-request="${Number(x.id)}" data-provider-source="${general?'orders':'requests'}" ${isRequested(x)?'style="outline:2px solid #d3a331"':''}>
        <div class="row"><b>طلب #<span data-no-i18n>${Number(x.id)}</span></b><span class="badge">${esc(statusLabel(x.status))}</span></div>
        <div data-no-i18n><b>${esc(x.customer_name||'')}</b> ${esc(x.phone||'')}</div>
        <div class="muted" data-no-i18n>🛠️ ${esc(x.service_type||x.order_type||'')}<br>📍 ${esc(x.address||x.area||'')}<br>
          ${x.preferred_date?'📅 '+esc(x.preferred_date)+'<br>':''}${x.preferred_time?'🕒 '+esc(x.preferred_time)+'<br>':''}${esc(x.details||x.description||'')}</div>
        <div class="row" style="margin-top:8px">
          ${providerAttachmentLinks(x)}
          ${open?`<button onclick="acceptReq(${args})">✅ قبول الطلب</button>${general?'':`<button class="danger" onclick="declineReq(${Number(x.id)})">${x.provider_id!=null?'❌ رفض':'⏭️ تخطي'}</button>`}`:''}
          ${mine&&x.status==='accepted'?`<button onclick="setReqStatus(${args},'on_the_way')">🚗 بالطريق</button>`:''}
          ${mine&&x.status==='on_the_way'?`<button onclick="setReqStatus(${args},'in_progress')">🛠️ بدأت الخدمة</button>`:''}
          ${mine&&x.status==='in_progress'?`<button class="ok" onclick="setReqStatus(${args},'completed')">✅ إكمال</button>`:''}
          ${mine&&x.phone?`<a class="btn light" href="tel:${esc(x.phone)}">📞 اتصال</a>`:''}
        </div></div>`;
    }).join(''):'لا توجد طلبات متاحة في مهنتك حالياً.';
    window.HAI18N?.apply?.();
  }catch(e){requests.textContent='تعذر تحميل الطلبات. حاول مجدداً.';}finally{reqLoading=false;}
}
let reqBusy=false;
async function requestAction(rpc,args){
  if(reqBusy)return;reqBusy=true;
  const buttons=[...requests.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);
  try{
    const {error}=await db.rpc(rpc,args);
    if(error){alert(error.message);return;}
    await loadReq();
  }catch(e){alert('تعذر تحديث الطلب. تحقق من الاتصال وحاول مجدداً.');}finally{reqBusy=false;buttons.forEach(b=>b.disabled=false);}
}
async function acceptReq(id,source='requests'){
  return requestAction(source==='orders'?'provider_update_general_service_order':'accept_service_request',source==='orders'?{p_order_id:id,p_status:'accepted'}:{p_request_id:id});
}
async function declineReq(id){return requestAction('decline_service_request',{p_request_id:id});}
async function setReqStatus(id,source,status){
  return requestAction(source==='orders'?'provider_update_general_service_order':'service_provider_update_request_status',source==='orders'?{p_order_id:id,p_status:status}:{p_request_id:id,p_status:status});
}

init();
</script><script src="ha-role-bottom-nav.js?v=20260930-1" defer></script><script src="ha-lux-icons.js?v=20260930-1" defer></script><script src="ha-card-customizer.js?v=20261001-1" defer></script>
