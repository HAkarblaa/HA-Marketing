d{grid-template-columns:1fr}.top h1{font-size:20px}}</style></head><body data-ha-card-admin="1"><div class="wrap"><div class="top"><h1>🎨 تصميم المربعات وصور واجهات الأقسام</h1><a class="btn" href="admin-panel.html">← لوحة الإدارة</a><a class="btn" href="index.html">الرئيسية</a></div><div id="gate" class="gate">جاري التحقق من صلاحية الأدمن الرئيسي...</div><div id="tools" class="tools"><select id="page"><option value="">كل الصفحات</option></select><input id="q" type="search" placeholder="ابحث باسم المربع أو صورة القسم أو الصفحة"><div id="count" class="count"></div></div><div id="grid" class="grid"></div></div><script src="ha-card-manifest.js?v=20261001-covers1"></script><script src="ha-card-customizer.js?v=20261001-covers1"></script><script>
