<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07120b;font-family:Arial,Tahoma,sans-serif}
#game{position:fixed;inset:0}canvas{display:block}
.hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 4px #000}
.score{position:absolute;top:10px;left:50%;transform:translateX(-50%);min-width:300px;text-align:center;background:#08111cdd;border:1px solid #ffffff45;border-radius:12px;padding:8px 14px;font-weight:900}
.score small{display:block;font-size:10px;color:#ccd5df}
.power{position:absolute;left:14px;top:35%;width:42px;height:180px;border-radius:24px;background:#07111edb;border:2px solid #ffffff70;padding:6px}
.track{position:relative;width:100%;height:100%;border-radius:18px;overflow:hidden;background:linear-gradient(to top,#2dd36f 0 38%,#f3d65b 38% 70%,#ef4d4d 70%)}
#mask{position:absolute;left:0;right:0;top:0;height:45%;background:#07111ee8}
.joy{pointer-events:auto;touch-action:none;position:absolute;left:14px;bottom:18px;width:106px;height:106px;border:3px solid #ffffff75;background:#ffffff18;border-radius:50%}
.joyKnob{position:absolute;width:52px;height:52px;border-radius:50%;left:24px;top:24px;background:#ffffffc9;border:2px solid #fff;box-shadow:0 2px 8px #0006}
.tools{position:absolute;right:10px;top:35%;display:grid;gap:7px;pointer-events:auto}
.tool{width:94px;padding:8px 5px;border:1px solid #ffffff40;border-radius:10px;background:#08111ddd;color:#fff;font-size:10px;font-weight:900}
.tool.active{outline:2px solid #fff}
#shoot{pointer-events:auto;position:absolute;right:16px;bottom:18px;width:102px;height:58px;border-radius:30px;border:2px solid #ffffff99;background:linear-gradient(#244c69,#0b1e2d);color:#fff;font-weight:900;font-size:17px;box-shadow:0 7px 18px #0008}

#msg{position:absolute;left:50%;top:24%;transform:translate(-50%,-50%) scale(.7);font-size:52px;font-weight:1000;opacity:0;transition:.2s}
#msg.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.tip{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:#06101bbb;border:1px solid #ffffff22;border-radius:999px;padding:6px 12px;font-size:11px}
@media(max-width:650px){.score{min-width:245px;font-size:12px}.power{left:5px;width:37px;height:155px}.joy{left:7px;width:88px;height:88px}.joyKnob{width:42px;height:42px;left:20px;top:20px}.tools{right:5px}.tool{width:80px;font-size:8px}#shoot{right:8px;width:88px;height:50px;font-size:14px}.tip{font-size:8px;bottom:76px}}

/* ===== نظام اللعبة الكامل ===== */
#menuScreen{
  position:fixed;inset:0;z-index:5000;background:
  radial-gradient(circle at 50% 8%,#17385b,#0a1424 45%,#050a12);
  color:#fff;display:flex;align-items:center;justify-content:center;padding:15px;overflow:auto
}
.menuCard{width:min(920px,100%);background:#101b2c;border:1px solid #ffffff18;border-radius:24px;padding:17px;box-shadow:0 25px 70px #0009}
.menuTitle{text-align:center}.menuTitle h1{margin:2px 0;font-size:28px}.menuTitle p{color:#aeb9c8;margin:5px 0 12px}
.walletMenu{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px 0}
.menuPill{background:#ffffff0c;border:1px solid #ffffff14;border-radius:999px;padding:8px 11px;font-size:11px;font-weight:800}
.menuGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.menuField{background:#ffffff08;border-radius:13px;padding:9px}
.menuField label{display:block;color:#aeb9c8;font-size:10px;margin-bottom:5px}
.menuField input,.menuField select{width:100%;border:1px solid #ffffff17;background:#08111e;color:#fff;border-radius:9px;padding:10px}
.modeGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.modeBtn{border:1px solid #ffffff14;background:#ffffff08;color:#fff;border-radius:14px;padding:12px 7px;font-weight:800}
.modeBtn small{display:block;color:#aeb9c8;font-size:8px;margin-top:4px}.modeBtn.active{outline:2px solid #2bd083;background:#153c2d}
#tournamentBox,#onlineBox{display:none;margin-top:10px;background:#ffffff07;border:1px solid #ffffff10;border-radius:14px;padding:10px}
#tournamentBox.show,#onlineBox.show{display:block}
.tourGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.menuActions{display:flex;justify-content:center;gap:8px;margin-top:13px;flex-wrap:wrap}
.menuAction{border:0;border-radius:12px;padding:11px 16px;font-weight:900;background:#213149;color:#fff}
.menuAction.primary{background:#2bd083;color:#062015}.menuAction.gold{background:linear-gradient(135deg,#f5d789,#b88329);color:#211500}
.offlineNote{display:none;margin-top:8px;text-align:center;color:#ffcf78;font-size:10px}
.offlineNote.show{display:block}
#endModal,#tournamentModal{
 position:fixed;inset:0;z-index:7000;background:#000b;display:none;align-items:center;justify-content:center;padding:15px;color:#fff
}
#endModal.show,#tournamentModal.show{display:flex}
.modalCard{width:min(650px,100%);max-height:88vh;overflow:auto;background:#101b2c;border:1px solid #ffffff18;border-radius:22px;padding:16px}
.modalCard h2{text-align:center;margin:0 0 12px}
.resultBig{text-align:center;font-size:26px;font-weight:900;margin:10px 0}
.fixture{display:flex;justify-content:space-between;gap:10px;padding:9px;border-bottom:1px solid #ffffff0f;font-size:11px}
#miniHud{position:fixed;right:8px;top:75px;z-index:2100;color:#fff;background:#07111fd8;border:1px solid #ffffff1a;border-radius:12px;padding:7px 9px;font-size:9px;pointer-events:none}
@media(max-width:700px){.menuGrid,.tourGrid{grid-template-columns:1fr}.modeGrid{grid-template-columns:1fr 1fr}.menuTitle h1{font-size:23px}}

<div class="hud">
 <div class="score"><span id="score"><span id="homeTeamText">العراق</span> <span id="homeScoreText">0</span> - <span id="awayScoreText">0</span> <span id="awayTeamText">إيران</span></span><small>ركلات الجزاء 3D</small></div>
 <div class="power"><div class="track"><div id="mask"></div></div></div>

</div>
<script type="module">
import * as THREE from 'three';

const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc8eb);scene.fog=new THREE.Fog(0x9bc8eb,55,130);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,220);camera.position.set(0,5.7,14.7);camera.lookAt(0,1.7,-8);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.getElementById('game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x234526,2.3));const sun=new THREE.DirectionalLight(0xffffff,2.7);sun.position.set(-14,22,11);sun.castShadow=true;scene.add(sun);

const pitch=new THREE.Mesh(new THREE.PlaneGeometry(72,110),new THREE.MeshStandardMaterial({color:0x178c3c,roughness:1}));pitch.rotation.x=-Math.PI/2;pitch.position.z=-24;pitch.receiveShadow=true;scene.add(pitch);
for(let i=0;i<12;i++){let s=new THREE.Mesh(new THREE.PlaneGeometry(72,5),new THREE.MeshBasicMaterial({color:i%2?0x1d9b43:0x147e36,transparent:true,opacity:.35}));s.rotation.x=-Math.PI/2;s.position.set(0,.006,5-i*5);scene.add(s)}
const standMat=new THREE.MeshStandardMaterial({color:0x263142});
for(const x of [-28,28]){let s=new THREE.Mesh(new THREE.BoxGeometry(14,9,50),standMat);s.position.set(x,4,-18);scene.add(s)}
let back=new THREE.Mesh(new THREE.BoxGeometry(70,10,10),standMat);back.position.set(0,5,-33);scene.add(back);
for(let i=0;i<160;i++){let c=new THREE.Mesh(new THREE.SphereGeometry(.1,6,5),new THREE.MeshBasicMaterial({color:new THREE.Color().setHSL(Math.random(),.75,.58)}));let side=Math.random()<.5?-1:1;c.position.set(side*(21+Math.random()*12),1+Math.random()*7,-2-Math.random()*39);scene.add(c)}

const white=new THREE.MeshStandardMaterial({color:0xf7f7f7});
function post(x,y,z,sx,sy,sz){let m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),white);m.position.set(x,y,z);m.castShadow=true;scene.add(m)}
post(-4.8,1.45,-12,.18,2.9,.18);post(4.8,1.45,-12,.18,2.9,.18);post(0,2.9,-12,9.78,.18,.18);
const netMat=new THREE.LineBasicMaterial({color:0xf4f8ff,transparent:true,opacity:.65});
for(let x=-4.7;x<=4.7;x+=.55)scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x,.08,-12.06),new THREE.Vector3(x,2.82,-12.06)]),netMat));
for(let y=.12;y<=2.8;y+=.34)scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-4.7,y,-12.06),new THREE.Vector3(4.7,y,-12.06)]),netMat));

function human(shirt,shorts){
 const g=new THREE.Group(),skin=new THREE.MeshStandardMaterial({color:0xb9784d}),sm=new THREE.MeshStandardMaterial({color:shirt}),hm=new THREE.MeshStandardMaterial({color:shorts});
 let head=new THREE.Mesh(new THREE.SphereGeometry(.27,16,12),skin);head.position.y=2.35;g.add(head);
 let body=new THREE.Mesh(new THREE.CapsuleGeometry(.36,.85,6,12),sm);body.position.y=1.52;g.add(body);
 let hip=new THREE.Mesh(new THREE.BoxGeometry(.72,.36,.43),hm);hip.position.y=.92;g.add(hip);
 for(const x of [-.22,.22]){let leg=new THREE.Mesh(new THREE.CapsuleGeometry(.105,.65,5,10),skin);leg.position.set(x,.38,0);g.add(leg)}
 for(const x of [-.48,.48]){let arm=new THREE.Mesh(new THREE.CapsuleGeometry(.09,.62,5,10),skin);arm.position.set(x,1.55,0);arm.rotation.z=x<0?-.18:.18;g.add(arm)}
 g.traverse(o=>{if(o.isMesh)o.castShadow=true});return g
}
const player=human(0xd51d29,0xffffff);player.position.set(-.8,0,4.7);player.rotation.y=Math.PI;player.scale.set(1.18,1.18,1.18);scene.add(player);
const keeper=human(0xf0d31e,0x161616);keeper.position.set(0,0,-11.5);keeper.scale.set(.92,.92,.92);scene.add(keeper);

const ballMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.55});const ball=new THREE.Mesh(new THREE.SphereGeometry(.23,24,18),ballMat);ball.position.set(.25,.23,2.25);ball.castShadow=true;scene.add(ball);
const curveMat=new THREE.LineDashedMaterial({color:0x6dff63,dashSize:.32,gapSize:.22});let aimLine=new THREE.Line(new THREE.BufferGeometry(),curveMat);scene.add(aimLine);
let aimDot=new THREE.Mesh(new THREE.RingGeometry(.25,.34,24),new THREE.MeshBasicMaterial({color:0x6dff63,side:THREE.DoubleSide}));aimDot.rotation.x=-Math.PI/2;scene.add(aimDot);

let home=0,shooting=false,shotT=0,target=new THREE.Vector3(),keeperTarget=0,power=.55;
const mask=document.getElementById('mask'),msg=document.getElementById('msg');
const joy=document.getElementById('joy'),joyKnob=document.getElementById('joyKnob');
let aimX=0, aimY=0;

function updateAim(){
  const x=aimX*4.0;
  const y=1.35 + aimY*1.25;
  const end=new THREE.Vector3(x,y,-11.65);
  const mid=new THREE.Vector3(x*.35,1.7 + aimY*.65,-4.5);
  const curve=new THREE.QuadraticBezierCurve3(ball.position.clone(),mid,end);
  aimLine.geometry.dispose();
  aimLine.geometry=new THREE.BufferGeometry().setFromPoints(curve.getPoints(30));
  aimLine.computeLineDistances();
  aimDot.position.set(end.x,end.y,-11.56);
  aimDot.rotation.set(0,0,0);
}

function moveJoystick(clientX,clientY){
  const r=joy.getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top+r.height/2;
  let dx=clientX-cx, dy=clientY-cy;
  const max=r.width*.34;
  const len=Math.hypot(dx,dy);
  if(len>max){dx=dx/len*max;dy=dy/len*max}
  joyKnob.style.transform=`translate(${dx}px,${dy}px)`;
  aimX=dx/max;
  aimY=-dy/max;
  updateAim();
}
let joyPointer=null;
joy.addEventListener('pointerdown',e=>{joyPointer=e.pointerId;joy.setPointerCapture(e.pointerId);moveJoystick(e.clientX,e.clientY)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyPointer)moveJoystick(e.clientX,e.clientY)});
joy.addEventListener('pointerup',e=>{if(e.pointerId===joyPointer)joyPointer=null});
joy.addEventListener('pointercancel',()=>{joyPointer=null});
updateAim();

document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tool').forEach(x=>x.classList.remove('active'));b.classList.add('active');let t=b.dataset.ball;if(t==='fire'){ballMat.color.set(0xff6b21);ballMat.emissive.set(0xaa1800);ballMat.emissiveIntensity=1.5}else if(t==='ice'){ballMat.color.set(0x9befff);ballMat.emissive.set(0x187cc5);ballMat.emissiveIntensity=1.2}else if(t==='dirt'){ballMat.color.set(0x9b6a3b);ballMat.emissive.set(0)}else{ballMat.color.set(0xffffff);ballMat.emissive.set(0)}});

function reset(){shooting=false;shotT=0;player.position.set(-.8,0,4.7);player.rotation.set(0,Math.PI,0);keeper.position.set(0,0,-11.5);keeper.rotation.set(0,0,0);ball.position.set(.25,.23,2.25);camera.position.set(0,5.7,14.7);camera.lookAt(0,1.7,-8);aimLine.visible=true;aimDot.visible=true;updateAim()}
document.getElementById('shoot').onclick=()=>{if(shooting)return;shooting=true;shotT=0;aimLine.visible=false;aimDot.visible=false;let x=aimX*4.0;let y=1.0+power*.8+aimY*1.25;target.set(x,THREE.MathUtils.clamp(y,.35,2.75),-12.15);keeperTarget=Math.random()*7.4-3.7};

let clock=new THREE.Clock(),phase=0,judged=false;
function animate(){
 requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.04);phase+=dt*3;power=.48+(Math.sin(phase)+1)*.22;mask.style.height=((1-power)*100)+'%';
 if(shooting){
  shotT+=dt;let t=shotT;
  if(t<.58){let q=t/.58;player.position.z=4.7-q*2.15;player.position.x=-.8+q*.55;player.rotation.z=Math.sin(q*Math.PI)*-.08}
  if(t>.38&&t<1.38){let q=Math.min((t-.38),1),start=new THREE.Vector3(.25,.23,2.25),mid=new THREE.Vector3(target.x*.28,2.15,-4.8),c=new THREE.QuadraticBezierCurve3(start,mid,target);ball.position.copy(c.getPoint(q));ball.rotation.x+=dt*18;ball.rotation.z+=dt*9;if(q>.24){let d=Math.min((q-.24)/.48,1);keeper.position.x=THREE.MathUtils.lerp(0,keeperTarget,d);keeper.position.y=Math.sin(d*Math.PI)*.72;keeper.rotation.z=-keeperTarget*.16*d}camera.position.z=THREE.MathUtils.lerp(14.7,10.8,q);camera.position.y=THREE.MathUtils.lerp(5.7,4.4,q);camera.lookAt(ball.position.x*.22,1.55,-8.7)}
  if(t>=1.38&&!judged){judged=true;let saved=Math.abs(target.x-keeperTarget)<.75&&target.y<2.1;if(!saved){home++;document.getElementById('score').textContent=`العراق ${home} - 0 إيران`;msg.textContent='GOAL!'}else msg.textContent='تصدي!';msg.classList.add('show')}
  if(t>2.15){msg.classList.remove('show');judged=false;reset()}
 }
 renderer.render(scene,camera)
}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>

<script>
(function(){
const teams={
 national:['العراق','إيران','السعودية','الكويت','قطر','الأرجنتين','البرازيل','فرنسا','إسبانيا','ألمانيا','البرتغال','إنجلترا'],
 club:['ريال مدريد','برشلونة','مانشستر سيتي','ليفربول','بايرن ميونخ','ميلان','إنتر','باريس سان جيرمان']
};
let gameMode='cpu',maxKicks=5,kickNo=0,homeScore=0,awayScore=0;
let points=Number(localStorage.getItem('ha_pen_points')||0),gems=Number(localStorage.getItem('ha_pen_gems')||0);
let tournament=JSON.parse(localStorage.getItem('ha_pen_tournament')||'null');

const by=id=>document.getElementById(id);
function syncWallet(){by('menuPoints').textContent=points;by('menuGems').textContent=gems}
function fillTeams(){
 const a=teams[by('teamTypeMenu').value];
 by('teamMenu').innerHTML=a.map(x=>'<option>'+x+'</option>').join('');
 by('opponentMenu').innerHTML=a.map(x=>'<option>'+x+'</option>').join('');
 if(a.length>1)by('opponentMenu').selectedIndex=1;
}
by('teamTypeMenu').addEventListener('change',fillTeams);fillTeams();syncWallet();

function internetState(){
 const on=navigator.onLine;
 by('offlineNote').classList.toggle('show',!on);
 document.querySelector('[data-mode="online"]').disabled=!on;
 if(!on && gameMode==='online'){
   gameMode='cpu';
   document.querySelectorAll('.modeBtn').forEach(b=>b.classList.toggle('active',b.dataset.mode==='cpu'));
   by('onlineBox').classList.remove('show');
 }
}
addEventListener('online',internetState);addEventListener('offline',internetState);internetState();

document.querySelectorAll('.modeBtn').forEach(b=>b.addEventListener('click',()=>{
 if(b.dataset.mode==='online'&&!navigator.onLine){alert('الأونلاين يحتاج اتصال بالإنترنت');return}
 gameMode=b.dataset.mode;
 document.querySelectorAll('.modeBtn').forEach(x=>x.classList.toggle('active',x===b));
 by('tournamentBox').classList.toggle('show',gameMode==='tournament');
 by('onlineBox').classList.toggle('show',gameMode==='online');
}));

function makeTournament(){
 const count=Number(by('tourTeams').value),pool=[...teams[by('teamTypeMenu').value]];
 while(pool.length<count)pool.push('فريق '+(pool.length+1));
 const selected=pool.slice(0,count); const mine=by('teamMenu').value;
 if(!selected.includes(mine))selected[0]=mine;
 const fixtures=[];
 for(let i=0;i<selected.length;i+=2)fixtures.push({a:selected[i],b:selected[i+1],played:false,sa:null,sb:null});
 tournament={name:by('tourName').value||'بطولة HA',format:by('tourFormat').value,type:by('tourType').value,teams:selected,round:1,fixtures,champion:null};
 localStorage.setItem('ha_pen_tournament',JSON.stringify(tournament));return tournament;
}
function renderTournament(){
 if(!tournament)makeTournament();
 by('tourModalTitle').textContent='🏆 '+tournament.name;
 by('tourContent').innerHTML=(tournament.fixtures||[]).map((m,i)=>'<div class="fixture"><span>'+(i+1)+'. '+m.a+'</span><b>'+(m.played?(m.sa+' - '+m.sb):'VS')+'</b><span>'+m.b+'</span></div>').join('')+(tournament.champion?'<div class="resultBig">🏆 البطل: '+tournament.champion+'</div>':'');
 by('tournamentModal').classList.add('show');
}
by('viewTournament').onclick=()=>{if(!tournament)makeTournament();renderTournament()};
by('closeTour').onclick=()=>by('tournamentModal').classList.remove('show');

by('createRoom').onclick=()=>{
 if(!navigator.onLine){alert('لا يوجد إنترنت');return}
 const code=Math.random().toString(36).slice(2,8).toUpperCase();by('roomCode').value=code;by('onlineStatus').value='تم إنشاء الغرفة '+code;
};
by('joinRoom').onclick=()=>{
 if(!navigator.onLine){alert('لا يوجد إنترنت');return}
 if(!by('roomCode').value.trim()){alert('اكتب كود الغرفة');return}
 by('onlineStatus').value='تم الدخول للغرفة';
};

by('shopOpen').onclick=()=>{
 const choice=prompt('المتجر\\n1 = كرة نارية (50 نقطة)\\n2 = كرة ثلجية (50 نقطة)\\n3 = كرة ترابية (40 نقطة)');
 const cost=choice==='3'?40:50;
 if(['1','2','3'].includes(choice||'')){
   if(points<cost){alert('النقاط غير كافية');return}
   points-=cost;gems+=1;localStorage.setItem('ha_pen_points',points);localStorage.setItem('ha_pen_gems',gems);syncWallet();alert('تم الشراء وإضافة جوهرة كمكافأة');
 }
};

function resetScore(){
 kickNo=0;homeScore=0;awayScore=0;
 by('homeScoreText').textContent='0';by('awayScoreText').textContent='0';
 by('hudKicks').textContent='0/'+maxKicks;
}
function currentOpponent(){
 if(gameMode!=='tournament')return by('opponentMenu').value;
 if(!tournament)makeTournament();
 const mine=by('teamMenu').value;
 const m=(tournament.fixtures||[]).find(x=>!x.played&&(x.a===mine||x.b===mine));
 return m?(m.a===mine?m.b:m.a):by('opponentMenu').value;
}
function beginGame(){
 if(gameMode==='online'&&!navigator.onLine){alert('الأونلاين يحتاج إنترنت');return}
 if(gameMode==='tournament'){
   if(by('tourType').value==='rooms'&&!navigator.onLine){alert('بطولة الغرف تحتاج إنترنت. اختر بطولة ضد الجهاز أو شغّل الإنترنت.');return}
   if(!tournament||tournament.champion)makeTournament();
 }
 maxKicks=Number(by('kickCountMenu').value);
 resetScore();
 by('homeTeamText').textContent=by('teamMenu').value;
 by('awayTeamText').textContent=currentOpponent();
 by('hudMode').textContent=gameMode==='cpu'?'ضد الجهاز':gameMode==='local'?'لاعبان محلياً':gameMode==='tournament'?'بطولة':'أونلاين';
 by('menuScreen').style.display='none';
}
by('startGameFull').onclick=beginGame;

function finalizeTournament(){
 if(gameMode!=='tournament'||!tournament)return;
 const mine=by('teamMenu').value;
 const match=(tournament.fixtures||[]).find(x=>!x.played&&(x.a===mine||x.b===mine));
 if(match){
  match.played=true;match.sa=match.a===mine?homeScore:awayScore;match.sb=match.a===mine?awayScore:homeScore;
 }
 if(homeScore>=awayScore){
   const remaining=(tournament.fixtures||[]).filter(x=>!x.played);
   if(!remaining.length)tournament.champion=mine;
 } else {
   tournament.champion=(match?(match.a===mine?match.b:match.a):'الخصم');
 }
 localStorage.setItem('ha_pen_tournament',JSON.stringify(tournament));
}
function finishMatch(){
 finalizeTournament();
 let res=homeScore>awayScore?'فوز 🎉':homeScore<awayScore?'خسارة':'تعادل';
 if(gameMode==='tournament'&&homeScore>=awayScore)res+=' — تأهلت/تقدمت في البطولة 🏆';
 by('endResult').textContent=res;by('endScore').textContent=homeScore+' - '+awayScore;by('endModal').classList.add('show');
}
by('playAgain').onclick=()=>{by('endModal').classList.remove('show');resetScore()};
by('backMenu').onclick=()=>{by('endModal').classList.remove('show');by('menuScreen').style.display='flex'};

// Hook into the existing visual game's score text changes.
// A MutationObserver watches the current 3D result and mirrors it into the full system.
const msg=by('msg');
let lastShown=false;
new MutationObserver(()=>{
 const showing=msg.classList.contains('show');
 if(showing&&!lastShown){
   kickNo++;
   const text=(msg.textContent||'').toLowerCase();
   if(text.includes('goal')||text.includes('هدف')) homeScore++;
   else {
     const d=by('difficultyMenu').value;
     const cpuChance=d==='hard'?.75:d==='medium'?.58:.42;
     if(gameMode==='cpu'||gameMode==='tournament'){if(Math.random()<cpuChance)awayScore++}
   }
   // For every player kick, simulate opponent kick in CPU/tournament.
   if((gameMode==='cpu'||gameMode==='tournament') && (text.includes('goal')||text.includes('هدف'))){
     const d=by('difficultyMenu').value;const cpuChance=d==='hard'?.75:d==='medium'?.58:.42;
     if(Math.random()<cpuChance)awayScore++;
   }
   by('homeScoreText').textContent=homeScore;by('awayScoreText').textContent=awayScore;
   by('hudKicks').textContent=Math.min(kickNo,maxKicks)+'/'+maxKicks;
   points+=text.includes('goal')||text.includes('هدف')?10:2;
   if(Math.random()<.12)gems++;
   localStorage.setItem('ha_pen_points',points);localStorage.setItem('ha_pen_gems',gems);
   if(kickNo>=maxKicks)setTimeout(finishMatch,1400);
 }
 lastShown=showing;
}).observe(msg,{attributes:true,attributeFilter:['class'],childList:true,characterData:true,subtree:true});
})();
</script>
