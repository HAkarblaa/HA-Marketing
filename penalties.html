<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>HA Marketing - ركلات الجزاء 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07120b;font-family:Arial,Tahoma,sans-serif}
#game{position:fixed;inset:0}canvas{display:block}
.hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 4px #000}
.score{position:absolute;top:10px;left:50%;transform:translateX(-50%);min-width:300px;text-align:center;background:#08111cdd;border:1px solid #ffffff45;border-radius:12px;padding:8px 14px;font-weight:900}
.score small{display:block;font-size:10px;color:#ccd5df}
.power{position:absolute;left:14px;top:35%;width:42px;height:180px;border-radius:24px;background:#07111edb;border:2px solid #ffffff70;padding:6px}
.track{position:relative;width:100%;height:100%;border-radius:18px;overflow:hidden;background:linear-gradient(to top,#2dd36f 0 38%,#f3d65b 38% 70%,#ef4d4d 70%)}
#mask{position:absolute;left:0;right:0;top:0;height:45%;background:#07111ee8}
.joy{position:absolute;left:14px;bottom:18px;width:106px;height:106px;border:3px solid #ffffff75;background:#ffffff18;border-radius:50%}
.joy:after{content:"";position:absolute;width:52px;height:52px;border-radius:50%;left:24px;top:24px;background:#ffffffc9;border:2px solid #fff}
.tools{position:absolute;right:10px;top:35%;display:grid;gap:7px;pointer-events:auto}
.tool{width:94px;padding:8px 5px;border:1px solid #ffffff40;border-radius:10px;background:#08111ddd;color:#fff;font-size:10px;font-weight:900}
.tool.active{outline:2px solid #fff}
#shoot{pointer-events:auto;position:absolute;right:16px;bottom:18px;width:102px;height:58px;border-radius:30px;border:2px solid #ffffff99;background:linear-gradient(#244c69,#0b1e2d);color:#fff;font-weight:900;font-size:17px;box-shadow:0 7px 18px #0008}
#aim{pointer-events:auto;position:absolute;left:140px;right:140px;bottom:28px;width:calc(100% - 280px)}
#msg{position:absolute;left:50%;top:24%;transform:translate(-50%,-50%) scale(.7);font-size:52px;font-weight:1000;opacity:0;transition:.2s}
#msg.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.tip{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:#06101bbb;border:1px solid #ffffff22;border-radius:999px;padding:6px 12px;font-size:11px}
@media(max-width:650px){.score{min-width:245px;font-size:12px}.power{left:5px;width:37px;height:155px}.joy{left:7px;width:88px;height:88px}.joy:after{width:42px;height:42px;left:20px;top:20px}.tools{right:5px}.tool{width:80px;font-size:8px}#shoot{right:8px;width:88px;height:50px;font-size:14px}#aim{left:102px;right:102px;width:calc(100% - 204px)}.tip{font-size:8px;bottom:76px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script>
</head>
<body>
<div id="game"></div>
<div class="hud">
 <div class="score"><span id="score">العراق 0 - 0 إيران</span><small>ركلات الجزاء 3D</small></div>
 <div class="power"><div class="track"><div id="mask"></div></div></div>
 <div class="joy"></div>
 <div class="tools">
  <button class="tool active" data-ball="normal">⚽ عادية</button>
  <button class="tool" data-ball="fire">🔥 نارية</button>
  <button class="tool" data-ball="ice">❄️ ثلجية</button>
  <button class="tool" data-ball="dirt">🌪️ ترابية</button>
 </div>
 <input id="aim" type="range" min="-100" max="100" value="0">
 <button id="shoot">تسديد</button>
 <div class="tip">حدد اتجاه الكرة ثم اضغط تسديد</div>
 <div id="msg">GOAL!</div>
</div>
<script type="module">
import * as THREE from 'three';

const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc8eb);scene.fog=new THREE.Fog(0x9bc8eb,55,130);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,220);camera.position.set(0,5.7,14.7);camera.lookAt(0,1.7,-8);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.getElementById('game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x234526,2.3));const sun=new THREE.DirectionalLight(0xffffff,2.7);sun.position.set(-14,22,11);sun.castShadow=true;scene.add(sun);

const pitch=new THREE.Mesh(new THREE.PlaneGeometry(72,110),new THREE.MeshStandardMaterial({color:0x178c3c,roughness:1}));pitch.rotation.x=-Math.PI/2;pitch.position.z=-24;pitch.receiveShadow=true;scene.add(pitch);
for(let i=0;i<12;i++){let s=new THREE.Mesh(new THREE.PlaneGeometry(72,5),new THREE.MeshBasicMaterial({color:i%2?0x1d9b43:0x147e36,transparent:true,opacity:.35}));s.rotation.x=-Math.PI/2;s.position.set(0,.006,5-i*5);scene.add(s)}
const standMat=new THREE.MeshStandardMaterial({color:0x263142});
for(const x of [-28,28]){let s=new THREE.Mesh(new THREE.BoxGeometry(14,9,50),standMat);s.position.set(x,4,-18);scene.add(s)}
let back=new THREE.Mesh(new THREE.BoxGeometry(70,10,10),standMat);back.position.set(0,5,-33);scene.add(back);
for(let i=0;i<160;i++){let c=new THREE.Mesh(new THREE.SphereGeometry(.1,6,5),new THREE.MeshBasicMaterial({color:new THREE.Color().setHSL(Math.random(),.75,.58)}));let side=Math.random()<.5?-1:1;c.position.set(side*(21+Math.random()*12),1+Math.random()*7,-2-Math.random()*39);scene.add(c)}

const white=new THREE.MeshStandardMaterial({color:0xf7f7f7});
function post(x,y,z,sx,sy,sz){let m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),white);m.position.set(x,y,z);m.castShadow=true;scene.add(m)}
post(-4.8,1.45,-12,.18,2.9,.18);post(4.8,1.45,-12,.18,2.9,.18);post(0,2.9,-12,9.78,.18,.18);
const netMat=new THREE.LineBasicMaterial({color:0xf4f8ff,transparent:true,opacity:.65});
for(let x=-4.7;x<=4.7;x+=.55)scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x,.08,-12.06),new THREE.Vector3(x,2.82,-12.06)]),netMat));
for(let y=.12;y<=2.8;y+=.34)scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-4.7,y,-12.06),new THREE.Vector3(4.7,y,-12.06)]),netMat));

function human(shirt,shorts){
 const g=new THREE.Group(),skin=new THREE.MeshStandardMaterial({color:0xb9784d}),sm=new THREE.MeshStandardMaterial({color:shirt}),hm=new THREE.MeshStandardMaterial({color:shorts});
 let head=new THREE.Mesh(new THREE.SphereGeometry(.27,16,12),skin);head.position.y=2.35;g.add(head);
 let body=new THREE.Mesh(new THREE.CapsuleGeometry(.36,.85,6,12),sm);body.position.y=1.52;g.add(body);
 let hip=new THREE.Mesh(new THREE.BoxGeometry(.72,.36,.43),hm);hip.position.y=.92;g.add(hip);
 for(const x of [-.22,.22]){let leg=new THREE.Mesh(new THREE.CapsuleGeometry(.105,.65,5,10),skin);leg.position.set(x,.38,0);g.add(leg)}
 for(const x of [-.48,.48]){let arm=new THREE.Mesh(new THREE.CapsuleGeometry(.09,.62,5,10),skin);arm.position.set(x,1.55,0);arm.rotation.z=x<0?-.18:.18;g.add(arm)}
 g.traverse(o=>{if(o.isMesh)o.castShadow=true});return g
}
const player=human(0xd51d29,0xffffff);player.position.set(-.8,0,4.7);player.rotation.y=Math.PI;player.scale.set(1.18,1.18,1.18);scene.add(player);
const keeper=human(0xf0d31e,0x161616);keeper.position.set(0,0,-11.5);keeper.scale.set(.92,.92,.92);scene.add(keeper);

const ballMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.55});const ball=new THREE.Mesh(new THREE.SphereGeometry(.23,24,18),ballMat);ball.position.set(.25,.23,2.25);ball.castShadow=true;scene.add(ball);
const curveMat=new THREE.LineDashedMaterial({color:0x6dff63,dashSize:.32,gapSize:.22});let aimLine=new THREE.Line(new THREE.BufferGeometry(),curveMat);scene.add(aimLine);
let aimDot=new THREE.Mesh(new THREE.RingGeometry(.25,.34,24),new THREE.MeshBasicMaterial({color:0x6dff63,side:THREE.DoubleSide}));aimDot.rotation.x=-Math.PI/2;scene.add(aimDot);

let home=0,shooting=false,shotT=0,target=new THREE.Vector3(),keeperTarget=0,power=.55;
const aim=document.getElementById('aim'),mask=document.getElementById('mask'),msg=document.getElementById('msg');
function updateAim(){let x=Number(aim.value)/100*4,end=new THREE.Vector3(x,1.35,-11.65),mid=new THREE.Vector3(x*.35,1.7,-4.5),curve=new THREE.QuadraticBezierCurve3(ball.position.clone(),mid,end);aimLine.geometry.dispose();aimLine.geometry=new THREE.BufferGeometry().setFromPoints(curve.getPoints(30));aimLine.computeLineDistances();aimDot.position.set(end.x,.03,-11.2)}
aim.oninput=updateAim;updateAim();

document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tool').forEach(x=>x.classList.remove('active'));b.classList.add('active');let t=b.dataset.ball;if(t==='fire'){ballMat.color.set(0xff6b21);ballMat.emissive.set(0xaa1800);ballMat.emissiveIntensity=1.5}else if(t==='ice'){ballMat.color.set(0x9befff);ballMat.emissive.set(0x187cc5);ballMat.emissiveIntensity=1.2}else if(t==='dirt'){ballMat.color.set(0x9b6a3b);ballMat.emissive.set(0)}else{ballMat.color.set(0xffffff);ballMat.emissive.set(0)}});

function reset(){shooting=false;shotT=0;player.position.set(-.8,0,4.7);player.rotation.set(0,Math.PI,0);keeper.position.set(0,0,-11.5);keeper.rotation.set(0,0,0);ball.position.set(.25,.23,2.25);camera.position.set(0,5.7,14.7);camera.lookAt(0,1.7,-8);aimLine.visible=true;aimDot.visible=true;updateAim()}
document.getElementById('shoot').onclick=()=>{if(shooting)return;shooting=true;shotT=0;aimLine.visible=false;aimDot.visible=false;let x=Number(aim.value)/100*4;target.set(x,1+power*1.55,-12.15);keeperTarget=Math.random()*7.4-3.7};

let clock=new THREE.Clock(),phase=0,judged=false;
function animate(){
 requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.04);phase+=dt*3;power=.48+(Math.sin(phase)+1)*.22;mask.style.height=((1-power)*100)+'%';
 if(shooting){
  shotT+=dt;let t=shotT;
  if(t<.58){let q=t/.58;player.position.z=4.7-q*2.15;player.position.x=-.8+q*.55;player.rotation.z=Math.sin(q*Math.PI)*-.08}
  if(t>.38&&t<1.38){let q=Math.min((t-.38),1),start=new THREE.Vector3(.25,.23,2.25),mid=new THREE.Vector3(target.x*.28,2.15,-4.8),c=new THREE.QuadraticBezierCurve3(start,mid,target);ball.position.copy(c.getPoint(q));ball.rotation.x+=dt*18;ball.rotation.z+=dt*9;if(q>.24){let d=Math.min((q-.24)/.48,1);keeper.position.x=THREE.MathUtils.lerp(0,keeperTarget,d);keeper.position.y=Math.sin(d*Math.PI)*.72;keeper.rotation.z=-keeperTarget*.16*d}camera.position.z=THREE.MathUtils.lerp(14.7,10.8,q);camera.position.y=THREE.MathUtils.lerp(5.7,4.4,q);camera.lookAt(ball.position.x*.22,1.55,-8.7)}
  if(t>=1.38&&!judged){judged=true;let saved=Math.abs(target.x-keeperTarget)<.75&&target.y<2.1;if(!saved){home++;document.getElementById('score').textContent=`العراق ${home} - 0 إيران`;msg.textContent='GOAL!'}else msg.textContent='تصدي!';msg.classList.add('show')}
  if(t>2.15){msg.classList.remove('show');judged=false;reset()}
 }
 renderer.render(scene,camera)
}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
