<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الأدعية - HA Marketing</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f5f5f5;color:#111}
.wrap{width:95%;max-width:950px;margin:28px auto}h1{text-align:center}.sub{text-align:center;color:#666}
.item{width:100%;border:0;background:#fff;border-radius:15px;padding:18px;margin:9px 0;text-align:right;box-shadow:0 3px 12px #0001;cursor:pointer}
.item b{display:block;font-size:20px}.item span{color:#666}
.reader{display:none;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 16px #0001}
.reader.show{display:block}.bar{position:sticky;top:0;z-index:3;background:#fff;padding:12px;border-bottom:1px solid #ddd;display:flex;gap:8px;align-items:center}
.bar button{border:0;border-radius:10px;background:#111;color:#fff;padding:11px 15px;cursor:pointer}.bar h2{font-size:18px;margin:0}
.frame{width:100%;height:78vh;border:0;background:#fff}.back{display:block;text-align:center;margin:25px;text-decoration:none;color:#111}
.note{background:#fff;padding:13px;border-radius:12px;color:#666;line-height:1.7}
</style></head>
<body><div class="wrap">
<h1>🤲 الأدعية</h1><p class="sub">اضغط على الاسم؛ يبقى المستخدم داخل صفحة موقعك ويظهر المحتوى داخلها.</p>
<div id="list"></div>
<div id="reader" class="reader">
 <div class="bar"><button id="backBtn">← رجوع للقائمة</button><h2 id="readerTitle"></h2></div>
 <iframe id="frame" class="frame" referrerpolicy="no-referrer"></iframe>
</div>
<div class="note">إذا منع المصدر العرض داخل الإطار على جهاز معيّن، ستظهر الصفحة فارغة؛ وقتها نثبت النصوص محلياً داخل ملفات الموقع.</div>
<a class="back" href="religious.html">← الرجوع إلى الأمور الدينية</a>
</div>
<script>
const ITEMS=[('دعاء كميل', 'https://www.duas.org/dua-kumayl.html'), ('دعاء التوسل', 'https://www.duas.org/tawassul.desktop.htm'), ('دعاء العهد', 'https://www.duas.org/dua-ahad.html'), ('دعاء الفرج', 'https://www.duas.org/Allahumma.htm')];
const list=document.getElementById('list'),reader=document.getElementById('reader'),frame=document.getElementById('frame'),readerTitle=document.getElementById('readerTitle');
let open=false;
ITEMS.forEach(([name,url])=>{
 const b=document.createElement('button');b.className='item';
 b.innerHTML='<b>'+name+'</b><span>فتح النص الكامل داخل الموقع</span>';
 b.onclick=()=>openReader(name,url);list.appendChild(b);
});
function openReader(name,url){
 list.style.display='none';reader.classList.add('show');readerTitle.textContent=name;frame.src=url;open=true;
 history.pushState({reader:true},'',location.href);window.scrollTo(0,0);
}
function closeReader(){frame.src='about:blank';reader.classList.remove('show');list.style.display='block';open=false;window.scrollTo(0,0)}
document.getElementById('backBtn').onclick=()=>{if(open)history.back();else closeReader()};
window.addEventListener('popstate',()=>{if(open)closeReader()});
</script></body></html>
