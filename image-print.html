<!doctype html><html data-ha-print-page lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طباعة الصور والملفات • HA Marketing</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef6f8;color:#15364a;font:17px/1.7 Tahoma,Arial,sans-serif}main{max-width:760px;margin:auto;padding:20px 16px 70px}a{color:#087f82}h1{font-size:25px;margin:22px 0}section{background:white;border-radius:22px;padding:22px;box-shadow:0 8px 30px #17364a12}button,.pick{display:block;width:100%;padding:15px;border:0;border-radius:14px;background:#087f82;color:white;font:700 17px Tahoma;text-align:center;cursor:pointer;margin:12px 0}button:disabled{opacity:.45;cursor:default}input{max-width:100%}#status{min-height:28px;color:#31596b}small{color:#547181;display:block}#preview{margin-top:20px}.page{background:white;padding:8px;margin:14px 0;border-radius:10px}.page img{display:block;max-width:100%;height:auto;margin:auto}.page figcaption{text-align:center;color:#547181;font-size:13px} @media print{@page{size:A4 portrait;margin:8mm}body{background:white}main{padding:0;max-width:none}.controls,figcaption{display:none!important}#preview{margin:0}.page{margin:0;padding:0;border-radius:0;break-after:page;page-break-after:always;break-inside:avoid}.page:last-child{break-after:auto;page-break-after:auto}.page img{width:100%;height:auto;max-height:280mm;object-fit:contain}}
</style><script src="ha-account-gate.js?v=20261024-print-admin"></script></head><body><main><div class="controls"><a href="index.html">← الرئيسية</a><h1>🖨️ طباعة الصور والملفات</h1><section><label class="pick" for="printFile">اختيار صورة أو ملف PDF</label><input id="printFile" type="file" accept="application/pdf,image/jpeg,image/png,image/webp"><p id="status" role="status" aria-live="polite">اختار صورة أو PDF لعرض المعاينة.</p><button id="printButton" type="button" disabled>طباعة</button><small>بعد المعاينة، اضغط طباعة واختار الطابعة وحجم الورق.</small></section></div><div id="preview" aria-label="معاينة الطباعة"></div></main><p id="printAccessMessage" style="padding:25px;text-align:center">جارٍ التحقق من صلاحية الطباعة…</p>
<script>
(function(){
 let loaded=false;
 function access(e){
  const allowed=e.detail.allowed,notice=document.getElementById('printAccessMessage');
  if(notice){notice.hidden=allowed;notice.textContent='الطباعة متاحة للأدمن الرئيسي فقط.';}
  if(!allowed){document.getElementById('preview').replaceChildren();const f=document.getElementById('printFile');if(f)f.value='';return;}
  if(loaded)return;loaded=true;
  const pdf=document.createElement('script');pdf.src='vendor/pdf.min.js?v=3.11.174';
  pdf.onload=()=>{if(!window.HAPrintAccess?.allowed){loaded=false;return;}const app=document.createElement('script');app.src='image-print.js?v=3';document.body.appendChild(app);};
  pdf.onerror=()=>{loaded=false;notice.hidden=false;notice.textContent='تعذر تحميل أدوات الطباعة. أعد تحميل الصفحة.';};document.body.appendChild(pdf);
 }
 window.addEventListener('ha:print-access',access);
 if(window.HAPrintAccess)access({detail:{allowed:window.HAPrintAccess.allowed}});
 document.addEventListener('click',e=>{if(e.target.closest?.('#printButton,.pick')&&!window.HAPrintAccess?.allowed){e.preventDefault();e.stopImmediatePropagation();}},true);
})();
</script></body></html>
