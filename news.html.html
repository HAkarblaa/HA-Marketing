<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آخر الأخبار - HA Marketing</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#111;
}
.wrap{
    width:94%;
    max-width:900px;
    margin:40px auto;
}
h1{
    text-align:center;
    font-size:40px;
    margin-bottom:30px;
}
.news-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:18px;
}
.news-card{
    min-height:190px;
    background:#fff;
    border-radius:18px;
    padding:24px 16px;
    text-decoration:none;
    color:#111;
    box-shadow:0 4px 16px rgba(0,0,0,.10);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}
.news-card .icon{
    font-size:48px;
    margin-bottom:14px;
}
.news-card h2{
    margin:0 0 8px;
    font-size:24px;
}
.news-card p{
    margin:0;
    color:#666;
    font-size:16px;
}
.back{
    display:block;
    text-align:center;
    margin-top:30px;
    text-decoration:none;
    color:#111;
    font-size:17px;
}
@media(max-width:600px){
    h1{font-size:31px}
    .news-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:10px;
    }
    .news-card{
        min-height:155px;
        padding:15px 8px;
    }
    .news-card .icon{font-size:38px}
    .news-card h2{font-size:18px}
    .news-card p{font-size:13px}
}
</style>
</head>
<body>

<div class="wrap">

<h1>📰 آخر الأخبار</h1>

<div class="news-grid">

    <a class="news-card" href="education-news.html">
        <div class="icon">🏫</div>
        <h2>أخبار وزارة التربية</h2>
        <p>آخر أخبار وتحديثات وزارة التربية</p>
    </a>

    <a class="news-card" href="higher-education-news.html">
        <div class="icon">🎓</div>
        <h2>أخبار وزارة التعليم</h2>
        <p>آخر أخبار وزارة التعليم العالي</p>
    </a>

    <a class="news-card" href="currency-prices.html">
        <div class="icon">💱</div>
        <h2>أسعار العملات</h2>
        <p>متابعة أسعار العملات والتحديثات</p>
    </a>

</div>

<a class="back" href="index.html">← الرجوع إلى الصفحة الرئيسية</a>

</div>

</body>
</html>
