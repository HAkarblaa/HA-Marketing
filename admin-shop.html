<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة صور التسوق - HA Marketing</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;background:#050709;color:#fff;font-family:Tahoma,Arial,sans-serif}.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;background:#090b0e;border-bottom:1px solid #7e5b21}.top b{color:#f4c45f}.top a{color:#fff;text-decoration:none;background:#171b20;border:1px solid #333;border-radius:11px;padding:9px 13px}.wrap{width:min(1100px,94%);margin:22px auto 60px}.card{background:linear-gradient(145deg,#111a23,#070b0f);border:1px solid #2d3c48;border-radius:18px;padding:17px;margin-bottom:14px}h1{margin:0 0 7px;color:#f4c45f}.muted{color:#aeb8c4;line-height:1.7;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.slot{background:#0a1016;border:1px solid #2c3d4c;border-radius:17px;padding:13px}.slot b{display:block;margin-bottom:9px;color:#ffe09a}.preview{width:100%;aspect-ratio:16/6;object-fit:cover;border-radius:13px;background:#111;border:1px solid #263746;margin-bottom:9px}.slot input{width:100%;padding:11px;border-radius:10px;border:1px solid #384957;background:#071019;color:#fff;margin:5px 0;font:inherit}.actions{display:flex;gap:8px;margin-top:8px}.btn{flex:1;border:0;border-radius:11px;padding:11px 12px;font:inherit;font-weight:900;cursor:pointer;background:linear-gradient(135deg,#d99927,#f4c45f);color:#17110a}.btn.alt{background:#202a34;color:#fff;border:1px solid #374757}.status{white-space:pre-wrap;background:#080d12;border:1px solid #263747;border-radius:12px;padding:12px;margin-top:13px;color:#d9e1e8}.gate{padding:15px;background:#2a210d;border:1px solid #735c25;border-radius:13px;color:#ffe6a9}@media(max-width:760px){.grid{grid-template-columns:1fr}.preview{aspect-ratio:16/7}}
</style></head><body><div class="top"><b>🛍️ إدارة صور تسوق الآن</b><a href="admin-panel.html">رجوع</a></div><div class="wrap"><div id="gate" class="gate">جاري التحقق من صلاحية الأدمن الرئيسي...</div><div id="app" style="display:none"><div class="card"><h1>صور سلايدر التسوق</h1><div class="muted">خمس صور. الأدمن الرئيسي فقط يقدر يبدلهن من الجهاز أو يحط رابط صورة.</div></div><div class="card"><div class="grid">
<div class="slot"><b>الصورة 1 - تسوق عام</b><img class="preview" id="p1"><input id="u1" type="url" placeholder="رابط الصورة (اختياري)"><input id="f1" type="file" accept="image/*"><div class="actions"><button class="btn" onclick="saveSlide(1,this)">حفظ / تبديل</button><button class="btn alt" onclick="restoreDefault(1)">الافتراضية</button></div></div>
<div class="slot"><b>الصورة 2 - أزياء وملابس</b><img class="preview" id="p2"><input id="u2" type="url" placeholder="رابط الصورة (اختياري)"><input id="f2" type="file" accept="image/*"><div class="actions"><button class="btn" onclick="saveSlide(2,this)">حفظ / تبديل</button><button class="btn alt" onclick="restoreDefault(2)">الافتراضية</button></div></div>
<div class="slot"><b>الصورة 3 - إلكترونيات</b><img class="preview" id="p3"><input id="u3" type="url" placeholder="رابط الصورة (اختياري)"><input id="f3" type="file" accept="image/*"><div class="actions"><button class="btn" onclick="saveSlide(3,this)">حفظ / تبديل</button><button class="btn alt" onclick="restoreDefault(3)">الافتراضية</button></div></div>
<div class="slot"><b>الصورة 4 - المنزل والمطبخ</b><img class="preview" id="p4"><input id="u4" type="url" placeholder="رابط الصورة (اختياري)"><input id="f4" type="file" accept="image/*"><div class="actions"><button class="btn" onclick="saveSlide(4,this)">حفظ / تبديل</button><button class="btn alt" onclick="restoreDefault(4)">الافتراضية</button></div></div>
<div class="slot"><b>الصورة 5 - الجمال والعناية</b><img class="preview" id="p5"><input id="u5" type="url" placeholder="رابط الصورة (اختياري)"><input id="f5" type="file" accept="image/*"><div class="actions"><button class="btn" onclick="saveSlide(5,this)">حفظ / تبديل</button><button class="btn alt" onclick="restoreDefault(5)">الافتراضية</button></div></div>
</div><div id="msg" class="status">جاهز.</div></div></div></div><script>
const SB_URL='https://ubayrhtshgtgggxprrek.supabase.co',SB_KEY='sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll';const db=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});const defaults=['shop-slide-1-main.png','shop-slide-2-fashion.png','shop-slide-3-electronics.png','shop-slide-4-home.png','shop-slide-5-beauty.png'];let user=null,isSuper=false;
function preview(n,url){const p=document.getElementById('p'+n);if(url){p.src=url;p.style.opacity='1'}else{p.removeAttribute('src');p.style.opacity='.25'}}
for(let n=1;n<=5;n++)document.getElementById('f'+n).addEventListener('change',e=>{const file=e.target.files?.[0];if(!file)return;const u=URL.createObjectURL(file);preview(n,u);document.getElementById('p'+n).onload=()=>URL.revokeObjectURL(u)});
async function init(){const {data:{session}}=await db.auth.getSession();if(!session){gate.textContent='يجب تسجيل الدخول أولاً.';return}user=session.user;try{const r=await db.rpc('is_super_admin');isSuper=!r.error&&r.data===true}catch(e){}if(!isSuper){try{const a=await db.from('app_admins').select('is_super_admin,is_active').eq('user_id',user.id).maybeSingle();isSuper=!!(a.data?.is_active&&a.data?.is_super_admin)}catch(e){}}if(!isSuper){gate.textContent='هذه الصفحة للأدمن الرئيسي فقط.';return}gate.style.display='none';app.style.display='block';await load()}
async function load(){msg.textContent='جاري تحميل الصور...';const {data,error}=await db.from('shop_slider_images').select('slot,image_url').order('slot');if(error){msg.textContent='تعذر تحميل الصور: '+error.message+'\nشغّل SHOP-SLIDER-5-ADMIN.sql مرة واحدة داخل Supabase.';return}for(let n=1;n<=5;n++){const row=(data||[]).find(x=>Number(x.slot)===n);const url=row?.image_url||defaults[n-1];document.getElementById('u'+n).value=url;document.getElementById('f'+n).value='';preview(n,url)}msg.textContent='✅ الصور جاهزة للإدارة.'}
async function upload(n,file){if(!file)return null;if(!String(file.type||'').startsWith('image/'))throw new Error('اختر ملف صورة فقط.');if(file.size>6*1024*1024)throw new Error('حجم الصورة يجب أن يكون أقل من 6MB.');const ext=(file.name.split('.').pop()||'jpg').replace(/[^a-zA-Z0-9]/g,'').toLowerCase()||'jpg';const path='slot-'+n+'/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;const {error}=await db.storage.from('shop-slider').upload(path,file,{cacheControl:'3600',upsert:false,contentType:file.type||undefined});if(error)throw error;return db.storage.from('shop-slider').getPublicUrl(path).data.publicUrl}
async function saveSlide(n,btn){if(!isSuper)return;try{btn.disabled=true;msg.textContent='جاري حفظ الصورة '+n+'...';const file=document.getElementById('f'+n).files?.[0];let url=document.getElementById('u'+n).value.trim();if(file)url=await upload(n,file);if(!url)throw new Error('اختر صورة من الجهاز أو ضع رابط صورة.');const {error}=await db.from('shop_slider_images').upsert({slot:n,image_url:url,is_active:true,updated_by:user.id,updated_at:new Date().toISOString()},{onConflict:'slot'});if(error)throw error;msg.textContent='✅ تم حفظ الصورة '+n+' وستظهر في حقل التسوق.';await load()}catch(e){msg.textContent='❌ '+(e?.message||e)}finally{btn.disabled=false}}
async function restoreDefault(n){if(!isSuper)return;const {error}=await db.from('shop_slider_images').upsert({slot:n,image_url:defaults[n-1],is_active:true,updated_by:user.id,updated_at:new Date().toISOString()},{onConflict:'slot'});msg.textContent=error?'❌ '+error.message:'✅ رجعت الصورة '+n+' للوضع الافتراضي.';await load()}
init();
</script></body></html>
