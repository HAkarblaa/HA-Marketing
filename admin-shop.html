<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>اقتراحات المتاجر - HA Marketing</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#050709;color:#fff}
.wrap{width:min(94%,1000px);margin:24px auto 90px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.back{padding:10px 14px;border:1px solid #4b3b1e;border-radius:12px;color:#f4c45f;text-decoration:none;background:#0c1116}
h1{margin:0;color:#f4c45f;font-size:26px}
.card{background:linear-gradient(145deg,#111a23,#080c10);border:1px solid #2b3b49;border-radius:18px;padding:15px;margin:12px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.name{font-size:20px;font-weight:900;color:#ffe29a}
.meta{color:#c0c9d2;line-height:1.8;margin-top:8px}
.details{margin-top:10px;padding:10px;border-radius:12px;background:#080d12;color:#e6ebef;line-height:1.8}
.badge{padding:6px 10px;border-radius:999px;background:#16202a;color:#f4c45f;font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{border:0;border-radius:11px;padding:10px 13px;cursor:pointer;font:inherit;font-weight:800}
.review{background:#30465d;color:#fff}
.approve{background:#176d36;color:#fff}
.reject{background:#8d2634;color:#fff}
.note{width:100%;margin-top:10px;padding:10px;border-radius:11px;border:1px solid #384b5c;background:#071019;color:#fff}
.empty{padding:24px;text-align:center;color:#aeb8c4}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="admin-shop.html">← إدارة التسوق</a>
    <h1>💡 اقتراحات المتاجر</h1>
    <button class="review" onclick="loadRows()">تحديث</button>
  </div>
  <div id="list" class="empty">جاري التحميل...</div>
</div>

<script>
const db=supabase.createClient(
  'https://ubayrhtshgtgggxprrek.supabase.co',
  'sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',
  {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}}
);

const labels={
  library:'مكتبة',building_materials:'مواد البناء',cards_credit:'بطاقات وأرصدة',
  yugioh:'أوراق يوغي',markets:'أسواق',restaurants:'مطاعم',pharmacies:'صيدليات',
  flowers:'ورد',home_appliances:'أجهزة منزلية',printers:'طابعات',devices:'أجهزة',
  device_accessories:'إكسسوارات',clothes:'ملابس',shoes:'أحذية',other:'قسم آخر'
};
const statusLabels={pending:'بانتظار المراجعة',reviewed:'تمت المراجعة',approved:'مقبول',rejected:'مرفوض'};

function esc(v){
  return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmt(d){
  try{return new Date(d).toLocaleString('ar-IQ')}catch{return d||''}
}
async function updateRow(id,status){
  const note=document.getElementById('note-'+id)?.value||'';
  const {error}=await db.rpc('admin_update_shop_store_suggestion',{
    p_id:id,p_status:status,p_admin_note:note||null
  });
  if(error)return alert(error.message);
  await loadRows();
}
async function loadRows(){
  list.className='empty';
  list.textContent='جاري التحميل...';

  const {data:{session}}=await db.auth.getSession();
  if(!session){location.href='login.html?next='+encodeURIComponent(location.href);return}

  const {data,error}=await db.rpc('admin_list_shop_store_suggestions');
  if(error){
    list.innerHTML='❌ '+esc(error.message);
    return;
  }

  const rows=Array.isArray(data)?data:[];
  if(!rows.length){
    list.innerHTML='لا توجد اقتراحات متاجر حالياً.';
    return;
  }

  list.className='';
  list.innerHTML=rows.map(x=>`
    <div class="card">
      <div class="row">
        <div class="name">🏪 ${esc(x.store_name)}</div>
        <span class="badge">${esc(statusLabels[x.status]||x.status)}</span>
      </div>
      <div class="meta">
        القسم: ${esc(labels[x.category_key]||x.category_key)}<br>
        📞 ${esc(x.phone)}<br>
        📍 ${esc(x.location_text)}<br>
        ${x.store_link?'🔗 '+esc(x.store_link)+'<br>':''}
        🕒 ${esc(fmt(x.created_at))}
      </div>
      ${x.details?`<div class="details">${esc(x.details)}</div>`:''}
      <input class="note" id="note-${x.id}" value="${esc(x.admin_note||'')}" placeholder="ملاحظة الإدارة">
      <div class="actions">
        <button class="review" onclick="updateRow(${x.id},'reviewed')">تمت المراجعة</button>
        <button class="approve" onclick="updateRow(${x.id},'approved')">قبول</button>
        <button class="reject" onclick="updateRow(${x.id},'rejected')">رفض</button>
      </div>
    </div>
  `).join('');
}
loadRows();
</script>
</body>
</html>
