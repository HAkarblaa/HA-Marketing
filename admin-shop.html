<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة المتجر</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll');</script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f5f5f5;color:#111}.wrap{width:94%;max-width:1000px;margin:24px auto}h1{text-align:center}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 4px 16px #0001}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.btn,button{display:inline-block;border:0;border-radius:10px;padding:11px 14px;background:#111;color:#fff;text-decoration:none;cursor:pointer}.light{background:#eee;color:#111}.danger{background:#a90020}.muted{color:#666;line-height:1.7}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}input,select,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:9px;margin:6px 0}.img{width:100%;height:220px;object-fit:contain;background:#fafafa;border-radius:12px}.price{font-size:21px;font-weight:bold}.badge{background:#eee;padding:5px 9px;border-radius:999px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><a class="btn light" href="admin.html">← الإدارة</a><h1>🛍️ إدارة المتجر</h1><div id="gate" class="card">جاري التحقق...</div><div id="panel" style="display:none"><div class="card"><h2>إضافة منتج</h2><select id="cat"></select><input id="name" placeholder="اسم المنتج"><textarea id="desc" placeholder="الوصف"></textarea><input id="price" type="number" min="0" placeholder="السعر بالدينار"><input id="stock" type="number" min="0" placeholder="الكمية المتوفرة"><input id="image" placeholder="رابط صورة المنتج (اختياري)"><button onclick="add()">إضافة المنتج</button></div><h2>المنتجات</h2><div id="products"></div><h2>طلبات الشراء</h2><div id="orders"></div></div></div><script>function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}async function init(){const {data:u}=await db.auth.getUser();if(!u?.user)return gate.textContent='يجب تسجيل الدخول';const {data:p}=await db.from('profiles').select('account_type').eq('id',u.user.id).maybeSingle();if(p?.account_type!=='admin')return gate.textContent='لا تملك صلاحية الإدارة';gate.textContent='صلاحية الإدارة مؤكدة';panel.style.display='block';const {data:c}=await db.from('shop_categories').select('*').order('sort_order');cat.innerHTML=(c||[]).map(x=>`<option value="${x.category_key}">${esc(x.name)}</option>`).join('');loadProducts();loadOrders()}async function add(){const {error}=await db.from('shop_products').insert({category_key:cat.value,name:name.value.trim(),description:desc.value.trim()||null,price_iqd:Number(price.value),stock_qty:Number(stock.value),image_url:image.value.trim()||null});if(error)alert(error.message);else{name.value=desc.value=price.value=stock.value=image.value='';loadProducts()}}async function loadProducts(){const {data,error}=await db.from('shop_products').select('*').order('created_at',{ascending:false});if(error)return products.textContent=error.message;products.innerHTML=(data||[]).map(p=>`<div class="card"><div class="row"><strong>${esc(p.name)}</strong><span>${Number(p.price_iqd).toLocaleString('ar-IQ')} د.ع</span></div><div class="muted">${esc(p.category_key)} — مخزون: ${p.stock_qty} — ${p.is_active?'فعال':'موقوف'}</div><div class="row" style="margin-top:10px"><button class="light" onclick="stockSet(${p.id},${p.stock_qty})">تعديل المخزون</button><button class="${p.is_active?'danger':'btn'}" onclick="toggle(${p.id},${!p.is_active})">${p.is_active?'إيقاف':'تفعيل'}</button></div></div>`).join('')}async function stockSet(id,old){const v=Number(prompt('الكمية الجديدة:',old));if(!Number.isInteger(v)||v<0)return;const {error}=await db.from('shop_products').update({stock_qty:v}).eq('id',id);if(error)alert(error.message);else loadProducts()}async function toggle(id,v){const {error}=await db.from('shop_products').update({is_active:v}).eq('id',id);if(error)alert(error.message);else loadProducts()}async function loadOrders(){const {data,error}=await db.from('shop_orders').select('*').order('created_at',{ascending:false}).limit(200);if(error)return orders.textContent=error.message;orders.innerHTML=(data||[]).map(o=>`<div class="card"><div class="row"><strong>#${o.id}</strong><span class="badge">${esc(o.status)}</span></div><div>${esc(o.phone)} — ${esc(o.address)}</div><strong>${Number(o.total_iqd).toLocaleString('ar-IQ')} د.ع</strong><select onchange="statusSet(${o.id},this.value)"><option value="">تغيير الحالة...</option><option value="confirmed">مؤكد</option><option value="preparing">قيد التجهيز</option><option value="shipped">تم الشحن</option><option value="completed">مكتمل</option><option value="cancelled">ملغي</option></select></div>`).join('')}async function statusSet(id,s){if(!s)return;const {error}=await db.rpc('admin_update_shop_order_status',{p_order_id:id,p_status:s});if(error)alert(error.message);else loadOrders()}init();</script></body></html>
