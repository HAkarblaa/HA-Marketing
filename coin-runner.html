<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>جمع العملات</title><link rel="stylesheet" href="assets/ha-games-style.css"></head><body><div class="page"><div class="topbar"><div class="brand"><div class="logo">🪙</div><div><h1>جمع العملات</h1><p>اجمع أكبر عدد ممكن من العملات وتجنب الحراس</p></div></div><div class="row"><a class="btn secondary" href="games-hub.html">↩ الألعاب</a><button id="fullBtn" class="btn secondary">⛶ ملء الشاشة</button></div></div>
<div class="game-shell"><div id="stageHolder" class="stage-wrap"><canvas id="game" class="stage" width="480" height="720"></canvas></div><div class="side-panel"><div class="card"><h3>التحكم</h3><p>حرّك اللاعب بالأسهم أو اللمس. اجمع العملات واهرب من العوائق المتحركة. كل عملة = 5 نقاط.</p><div class="row"><button id="startBtn" class="btn">▶ ابدأ</button><button id="restartBtn" class="btn secondary">↻ إعادة</button></div></div><div class="card"><div class="stat-grid"><div class="stat"><b id="score">0</b><span>النقاط</span></div><div class="stat"><b id="best">0</b><span>الأفضل</span></div><div class="stat"><b id="plays">0</b><span>اللعبات</span></div></div></div><div class="card"><h3>أفضل اللاعبين</h3><div id="leader" class="list"></div></div></div></div><footer>🪙 لعبة جمع العملات</footer></div>
<script src="assets/ha-games-common.js"></script><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'); let run=false,anim=0,score=0,best=0,frame=0; const p={x:240,y:360,r:18}; const keys={}; let coins=[], enemies=[];
function rand(min,max){return Math.random()*(max-min)+min}
function reset(){score=0;frame=0;p.x=240;p.y=360;coins=[];enemies=[{x:100,y:100,r:20,vx:3,vy:2.3},{x:380,y:560,r:20,vx:-2.5,vy:2.1}]; for(let i=0;i<8;i++) coins.push({x:rand(40,440),y:rand(40,680),r:10,alive:true}); updateStats(); draw();}
function updateStats(){const board=HAGames.getLeaderboard('coin-runner'); const me=board.find(v=>v.userId===HAGames.detectUser().id); best=me?me.bestScore:best; document.getElementById('score').textContent=score; document.getElementById('best').textContent=best||0; document.getElementById('plays').textContent=me?me.playCount:0; HAGames.renderMiniLeaderboard(document.getElementById('leader'),'coin-runner',8);} 
function endGame(win=false){run=false; cancelAnimationFrame(anim); HAGames.beep(win?'win':'lose'); const r=HAGames.saveScore('coin-runner','🪙 جمع العملات',score,{win}); best=Math.max(best,r.bestScore||0); updateStats(); HAGames.toast(win?'أحسنت! جمعت كل العملات':'انتهت الجولة'); draw();}
function loop(){if(!run) return; frame++; const sp=5; if(keys.ArrowLeft) p.x-=sp; if(keys.ArrowRight) p.x+=sp; if(keys.ArrowUp) p.y-=sp; if(keys.ArrowDown) p.y+=sp; p.x=Math.max(18,Math.min(462,p.x)); p.y=Math.max(18,Math.min(702,p.y)); enemies.forEach(e=>{e.x+=e.vx; e.y+=e.vy; if(e.x<e.r||e.x>480-e.r) e.vx*=-1; if(e.y<e.r||e.y>720-e.r) e.vy*=-1; if(Math.hypot(e.x-p.x,e.y-p.y)<e.r+p.r) return endGame(false);}); let left=0; coins.forEach(c=>{if(!c.alive) return; left++; if(Math.hypot(c.x-p.x,c.y-p.y)<c.r+p.r){c.alive=false; score+=5; HAGames.beep('coin');}}); if(left===0) return endGame(true); updateStats(); draw(); anim=requestAnimationFrame(loop);} 
function draw(){ctx.clearRect(0,0,480,720); ctx.fillStyle='#0b1020'; ctx.fillRect(0,0,480,720); ctx.fillStyle='rgba(255,255,255,.05)'; for(let i=0;i<12;i++) ctx.fillRect(i*40,0,1,720), ctx.fillRect(0,i*60,480,1); coins.forEach(c=>{if(!c.alive)return; ctx.beginPath(); ctx.fillStyle='#facc15'; ctx.arc(c.x,c.y,c.r,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#8a5'; ctx.fillText('$',c.x-4,c.y+4);}); enemies.forEach(e=>{ctx.beginPath(); ctx.fillStyle='#ef4444'; ctx.arc(e.x,e.y,e.r,0,Math.PI*2); ctx.fill();}); ctx.beginPath(); ctx.fillStyle='#38bdf8'; ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); ctx.fillStyle='white'; ctx.font='bold 28px Tahoma'; ctx.fillText('النقاط: '+score,18,38); if(!run){ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillRect(0,0,480,720); ctx.fillStyle='white'; ctx.font='bold 34px Tahoma'; ctx.fillText(score>0?'انتهت الجولة':'اضغط ابدأ',155,330);}}
window.addEventListener('keydown',e=>keys[e.key]=true); window.addEventListener('keyup',e=>keys[e.key]=false); canvas.addEventListener('touchmove',e=>{const rect=canvas.getBoundingClientRect(); p.x=(e.touches[0].clientX-rect.left)*(480/rect.width); p.y=(e.touches[0].clientY-rect.top)*(720/rect.height);},{passive:true}); document.getElementById('startBtn').onclick=()=>{reset();run=true;loop();}; document.getElementById('restartBtn').onclick=reset; HAGames.bindFullscreen(document.getElementById('fullBtn'),'#stageHolder'); reset();
</script></body></html>
