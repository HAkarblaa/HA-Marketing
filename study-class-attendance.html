<meta name="viewport" content="width=device-width,initial-scale=1"><title>الحضور - HA Marketing</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#06090c;color:#fff;font-family:Tahoma,Arial}.wrap{width:min(94%,900px);margin:16px auto 70px}.btn,button{padding:10px 13px;border:1px solid #3b4853;border-radius:12px;background:#12181d;color:#fff;text-decoration:none;font:inherit}.hero,.card{padding:15px;border:1px solid #36434e;border-radius:20px;background:linear-gradient(145deg,#11181d,#080c0f);margin:12px 0}.hero{text-align:center}.hero h1{color:#f0c86b;margin:0}.form{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}select,input{padding:11px;border-radius:11px;border:1px solid #3b4853;background:#0a0f13;color:#fff}.teacher-only{display:none}.teacher .teacher-only{display:block}.muted{color:#aeb7bf;font-size:12px}@media(max-width:600px){.form{grid-template-columns:1fr}}</style><link rel="stylesheet" href="ha-lux-icons.css?v=20260930-1"></head><body><div class="wrap"><a class="btn" id="back">← الصف</a><div class="hero"><h1>📋 الحضور</h1></div><section class="card teacher-only"><div class="form"><select id="student"></select><input id="day" type="date"><select id="status"><option value="present">حاضر</option><option value="absent">غائب</option><option value="late">متأخر</option><option value="excused">غياب بعذر</option></select><input id="note" placeholder="ملاحظة"><button onclick="saveAttendance()">حفظ</button></div></section><div id="list"></div></div><script>
const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});const classId=new URLSearchParams(location.search).get('class');let me=null,isTeacher=false;const A={present:'حاضر',absent:'غائب',late:'متأخر',excused:'غياب بعذر'};back.href='study-class.html?class='+classId;
async function init(){const {data:{session}}=await db.auth.getSession();if(!session)return location.href='login.html';me=session.user;const {data:c}=await db.from('study_classes').select('teacher_user_id').eq('id',classId).maybeSingle();isTeacher=c?.teacher_user_id===me.id;if(isTeacher){document.body.classList.add('teacher');const {data}=await db.rpc('get_study_class_students',{p_class_id:Number(classId)});student.innerHTML=(data||[]).map(x=>`<option value="${x.student_user_id}">${x.email}</option>`).join('')||'<option value="">لا يوجد طلاب</option>'}day.value=new Date().toISOString().slice(0,10);load()}
async function load(){let q=db.from('study_class_attendance').select('*').eq('class_id',classId).order('attendance_date',{ascending:false});if(!isTeacher)q=q.eq('student_user_id',me.id);const {data,error}=await q;list.innerHTML=error?`<div class="card">${error.message}</div>`:(data||[]).map(x=>`<div class="card"><b>${x.attendance_date}</b> — ${A[x.status]||x.status}<div class="muted">${x.note||''}</div></div>`).join('')||'<div class="card muted">لا توجد سجلات حضور.</div>'}
async function saveAttendance(){if(!student.value)return alert('لا يوجد طالب محدد');const {error}=await db.from('study_class_attendance').upsert({class_id:Number(classId),student_user_id:student.value,teacher_user_id:me.id,attendance_date:day.value,status:status.value,note:note.value.trim()||null},{onConflict:'class_id,student_user_id,attendance_date'});if(error)return alert(error.message);load()}init();
</script><script src="ha-lux-icons.js?v=20260930-1" defer></script></body></html>
