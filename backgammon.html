<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>طاولة - HA Marketing</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f5f5f5;color:#111}.wrap{width:95%;max-width:850px;margin:25px auto}h1{text-align:center}.sub{text-align:center;color:#666}.board{background:#7b4f2b;border:8px solid #4a2d18;border-radius:18px;padding:18px;display:grid;grid-template-columns:repeat(12,1fr);gap:4px;min-height:260px}.point{background:#f0d7b2;min-height:200px;border-radius:4px;display:flex;flex-direction:column-reverse;align-items:center;padding:4px}.point:nth-child(even){background:#56351f}.checker{width:34px;height:34px;border-radius:50%;margin:1px;border:2px solid #222}.you{background:#f7f7f7}.cpu{background:#111}.panel{background:#fff;border-radius:15px;padding:15px;text-align:center;margin-top:12px}.dice{font-size:45px;margin:8px}.panel button{border:0;border-radius:10px;background:#111;color:#fff;padding:12px 16px;cursor:pointer}.status{font-weight:700;line-height:1.7}.back{display:block;text-align:center;margin:25px;text-decoration:none;color:#111}
@media(max-width:650px){.board{padding:8px;gap:2px}.point{min-height:150px}.checker{width:25px;height:25px}}
</style></head><body><div class="wrap"><h1>🎲 طاولة</h1><p class="sub">نسخة مبسطة ضد الجهاز: سباق 7 أحجار. أنت تتحرك من اليمين إلى اليسار والجهاز بالعكس، وأول من يخرج أحجاره يفوز.</p><div id="board" class="board"></div><div class="panel"><div id="status" class="status">اضغط رمي النرد.</div><div id="dice" class="dice">🎲</div><button id="roll">رمي النرد</button> <button id="reset">لعبة جديدة</button></div><a class="back" href="entertainment.html">← الرجوع إلى الترفيه</a></div>
<script>
let you=[],cpu=[],turn='you',rolled=0,over=false;const N=12,COUNT=7;
function init(){you=Array(COUNT).fill(11);cpu=Array(COUNT).fill(0);turn='you';rolled=0;over=false;status.textContent='دورك — اضغط رمي النرد.';dice.textContent='🎲';render()}
function render(){board.innerHTML='';for(let p=0;p<N;p++){let el=document.createElement('div');el.className='point';you.filter(x=>x===p).forEach(()=>{let c=document.createElement('div');c.className='checker you';el.appendChild(c)});cpu.filter(x=>x===p).forEach(()=>{let c=document.createElement('div');c.className='checker cpu';el.appendChild(c)});board.appendChild(el)}}
function d(){return 1+Math.floor(Math.random()*6)}
function moveYou(n){let candidates=you.map((p,i)=>[p,i]).filter(x=>x[0]>=0).sort((a,b)=>a[0]-b[0]);if(!candidates.length)return;let [p,i]=candidates[0];you[i]=p-n<0?-1:p-n}
function moveCpu(n){let candidates=cpu.map((p,i)=>[p,i]).filter(x=>x[0]<N).sort((a,b)=>b[0]-a[0]);if(!candidates.length)return;let [p,i]=candidates[0];cpu[i]=p+n>=N?N:p+n}
function check(){if(you.every(x=>x<0)){over=true;status.textContent='أنت فزت! 🎉';return true}if(cpu.every(x=>x>=N)){over=true;status.textContent='الجهاز فاز.';return true}return false}
roll.onclick=()=>{if(over||turn!=='you')return;let n=d();dice.textContent='🎲 '+n;moveYou(n);render();if(check())return;turn='cpu';status.textContent='الجهاز يرمي...';setTimeout(()=>{let c=d();dice.textContent='🎲 '+c;moveCpu(c);render();if(check())return;turn='you';status.textContent='دورك — اضغط رمي النرد.'},700)};reset.onclick=init;init();
</script></body></html>
