<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>طلب تكسي - HA Marketing</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f4f4f4;color:#111}
.app{width:100%;max-width:760px;margin:auto;background:#fff;min-height:100vh}
.head{display:flex;align-items:center;justify-content:space-between;padding:8px 12px}
.head h1{font-size:15px;margin:0;font-weight:700}
.back{width:34px;height:34px;border:0;border-radius:50%;background:#f1f1f1;font-size:19px;cursor:pointer}

.search{padding:4px 14px 8px}
.search-row{display:grid;grid-template-columns:1fr auto;gap:7px;margin:7px 0}
.search input{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;font-size:15px}
.search button{border:0;border-radius:10px;background:#111;color:#fff;padding:0 14px}
.results{display:none;border:1px solid #eee;border-radius:10px;overflow:hidden}
.results button{width:100%;background:#fff;border:0;border-bottom:1px solid #eee;text-align:right;padding:9px;font-size:14px}

.map-wrap{position:relative}
#map{height:52vh;min-height:390px;background:#ededed}
.locate-btn{
 position:absolute;left:14px;bottom:18px;z-index:600;
 width:46px;height:46px;border:0;border-radius:13px 13px 13px 4px;
 background:#fff;box-shadow:0 3px 10px #0003;font-size:25px;cursor:pointer;
 display:flex;align-items:center;justify-content:center
}
.center-pin{
 position:absolute;left:50%;top:50%;z-index:550;
 transform:translate(-50%,-100%);
 font-size:36px;pointer-events:none;display:none
}
.center-pin.show{display:block}
.confirm-map{
 position:absolute;right:14px;bottom:18px;z-index:600;
 border:0;border-radius:12px;background:#111;color:#fff;
 padding:9px 13px;font-size:13px;font-weight:700;cursor:pointer;display:none;
 box-shadow:0 3px 10px #0003;border:1px solid #fff
}
.confirm-map.show{display:block}

.box{
 margin:12px 14px 0;position:relative;z-index:500;background:#fff;
 border-radius:18px;padding:13px;border:1px solid #eee
}
.row{display:flex;gap:9px;align-items:center;padding:8px 3px}
.row+.row{border-top:1px solid #eee}
.dot{width:13px;height:13px;border-radius:50%;background:#f47b20}
.dot.end{background:#1110ff;border-radius:4px}
.loc{flex:1}.loc b{display:block;font-size:14px}.loc span{font-size:12px;color:#777}

.actions{display:flex;gap:7px;margin-top:8px}
.actions button{flex:1;border:0;border-radius:10px;padding:8px;background:#eee;font-size:11px}
.actions .active{background:#111;color:#fff}

.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:11px 14px}
.metric{text-align:center;background:#f7f7f7;border-radius:11px;padding:9px}
.metric small{display:block;color:#777;font-size:10px}
.metric b{font-size:13px}

.types{padding:4px 14px}
.type{
 display:flex;align-items:center;gap:9px;border:2px solid transparent;
 border-radius:12px;padding:10px 7px;margin:5px 0;background:#fff;cursor:pointer
}
.type.selected{border-color:#111;background:#f7f7f7}
.vehicle{font-size:30px;width:42px;text-align:center}
.info{flex:1}
.info b{font-size:14px}
.info small{display:block;color:#777;font-size:10px;margin-top:2px}
.price{font-weight:700;font-size:13px}

.notice{
 margin:9px 14px;padding:8px;border-radius:11px;background:#fff8e7;
 color:#666;font-size:10px;line-height:1.5;text-align:center
}
.order{position:sticky;bottom:0;background:#fff;padding:12px;border-top:1px solid #eee}
.order button{
 width:100%;border:0;border-radius:12px;padding:14px;background:#1110ff;
 color:#fff;font-size:17px;font-weight:700
}
.order button:disabled{background:#aaa}


.vehicle-title{
  font-size:14px;font-weight:700;text-align:center;margin:2px 0 9px
}
.type{
  display:flex;align-items:center;gap:9px;border:2px solid transparent;
  border-radius:12px;padding:10px 7px;margin:5px 0;background:#fff;cursor:pointer
}
.type.selected{border-color:#111;background:#f7f7f7}
.vehicle{font-size:30px;width:42px;text-align:center}
.info{flex:1}
.info b{font-size:16px}
.info small{display:block;color:#777;font-size:12px;margin-top:2px}
.price{font-weight:700;font-size:15px}


.order-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.extra-options-btn{background:#f1f1f1!important;color:#111!important;border:1px solid #ddd!important}
.extra-options-btn:disabled{background:#eee!important;color:#aaa!important}
.extra-sheet{
  position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.42);
  display:none;align-items:flex-end;justify-content:center;padding:0
}
.extra-sheet.show{display:flex}
.extra-card{
  width:min(760px,100%);background:#fff;border-radius:22px 22px 0 0;
  padding:16px 15px 22px;max-height:80vh;overflow:auto
}
.extra-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.extra-head h3{margin:0;font-size:19px}
.extra-head button{width:38px;height:38px;border:0;border-radius:50%;background:#eee;font-size:22px;cursor:pointer}
.extra-option{
  display:flex;align-items:center;gap:10px;background:#f8f8f8;
  border-radius:12px;padding:13px;margin:8px 0;cursor:pointer;font-size:15px
}
.extra-option input{width:20px;height:20px}
.extra-fields{display:none;margin:-2px 0 8px}
.extra-fields.show{display:block}
.extra-fields input,.extra-fields select{
  width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;font-size:14px;background:#fff
}
.save-extra{
  width:100%;border:0;border-radius:12px;background:#111;color:#fff;
  padding:13px;font-size:16px;font-weight:700;margin-top:10px;cursor:pointer
}
.extra-summary{
  margin:8px 14px 0;padding:9px 11px;background:#f7f7f7;border-radius:11px;
  color:#555;font-size:12px;line-height:1.6;display:none
}


.location-entry{padding:9px 2px}
.location-entry+.location-entry{border-top:1px solid #eee}
.location-title{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.location-title b{font-size:13px;font-weight:700}
.location-title span:last-child{margin-right:auto;color:#777;font-size:10px;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.start-pin{font-size:20px;color:#f47b20;line-height:1}
.end-pin{font-size:19px;color:#1110ff;line-height:1}
.inline-search{display:grid;grid-template-columns:1fr auto;gap:7px}
.inline-search input{width:100%;padding:13px 12px;border:1px solid #ccc;border-radius:11px;font-size:14px}
.inline-search button{border:0;border-radius:11px;background:#111;color:#fff;padding:0 16px;font-size:13px}


.single-search-wrap{padding:6px 14px 10px;background:#fff}
.single-search-row{display:grid;grid-template-columns:1fr auto;gap:8px}
.single-search-row input{
  width:100%;padding:13px 12px;border:1px solid #ccc;border-radius:11px;
  font-size:14px;background:#fff
}
.single-search-row button{
  border:0;border-radius:11px;background:#111;color:#fff;
  padding:0 16px;font-size:13px;cursor:pointer
}
.confirm-map.start-confirm{background:#f47b20;color:#fff}
.confirm-map.end-confirm{background:#1b55d9;color:#fff}

@media(max-width:560px){
 .metrics{grid-template-columns:1fr 1fr}
 .metrics .metric:last-child{grid-column:1/-1}
}
</style>
</head>

<body>
<div class="app">

<div class="head">
  <button class="back" id="backBtn">‹</button>
  <h1>🚕 طلب تكسي</h1>
  <div style="width:42px"></div>
</div>

<div class="single-search-wrap">
  <div class="single-search-row">
    <input id="placeSearch" placeholder="ابحث عن مكان الانطلاق">
    <button id="placeSearchBtn" type="button">بحث</button>
  </div>
  <div id="placeResults" class="results"></div>
</div>

<div class="map-wrap">
  <div id="map"></div>

  <button id="locateBtn" class="locate-btn" title="تحديد موقعي" aria-label="تحديد موقعي">📍</button>

  <div id="centerPin" class="center-pin">📍</div>
  <button id="confirmMap" class="confirm-map">تأكيد النقطة</button>
</div>

<div id="selectionPanel" class="box">

  <!-- المرحلة الأولى: الانطلاق والوصول -->
  <div id="locationStep">
    <div class="location-entry">
      <div class="location-title">
        <span class="start-pin">●</span>
        <b>الانطلاق</b>
        <span id="startText">غير محدد</span>
      </div>
    </div>

    <div class="location-entry">
      <div class="location-title">
        <span class="end-pin">◆</span>
        <b>الوصول</b>
        <span id="endText">غير محدد</span>
      </div>
    </div>

    <div class="actions">
      <button id="pickStart" class="active">📍 الانطلاق</button>
      <button id="pickEnd">🏁 الوصول</button>
    </div>
  </div>

  <!-- المرحلة الثانية: أنواع السيارة والأسعار -->
  <div id="vehicleStep" style="display:none">
    <div class="vehicle-title">اختر نوع السيارة</div>

    <div class="type selected" data-name="اقتصادي" data-base="1000" data-km="500" data-min="20">
      <div class="vehicle">🚕</div>
      <div class="info"><b>اقتصادي</b><small>أوفر</small></div>
      <div class="price">—</div>
    </div>

    <div class="type" data-name="عادي" data-base="1500" data-km="650" data-min="25">
      <div class="vehicle">🚖</div>
      <div class="info"><b>عادي</b><small>مريح</small></div>
      <div class="price">—</div>
    </div>

    <div class="type" data-name="VIP" data-base="2500" data-km="900" data-min="35">
      <div class="vehicle">🚘</div>
      <div class="info"><b>VIP</b><small>مميز</small></div>
      <div class="price">—</div>
    </div>
  </div>

</div>

<div class="metrics">
 <div class="metric"><small>المسافة</small><b id="distance">—</b></div>
 <div class="metric"><small>الرحلة</small><b id="tripTime">—</b></div>
 <div class="metric"><small>السائق</small><b id="driverTime">—</b></div>
</div>

<div id="notice" class="notice">
حدد الانطلاق أولاً، وبعدها حدد نقطة الوصول.
</div>
<div id="extraSummary" class="extra-summary"></div>

<div class="order">
  <div class="order-row">
    <button id="order" disabled>تأكيد التكسي</button>
    <button id="extraOptionsBtn" class="extra-options-btn" type="button" disabled>⚙️ خيارات إضافية</button>
  </div>
</div>

<div id="extraSheet" class="extra-sheet" aria-hidden="true">
  <div class="extra-card">
    <div class="extra-head">
      <h3>خيارات إضافية</h3>
      <button id="closeExtra" type="button">×</button>
    </div>

    <label class="extra-option">
      <input id="extraDestinationCheck" type="checkbox">
      <span>📍 نقطة وصول إضافية</span>
    </label>
    <div id="extraDestinationFields" class="extra-fields">
      <input id="extraDestinationText" placeholder="اكتب اسم نقطة الوصول الإضافية">
    </div>

    <label class="extra-option">
      <input id="stopCheck" type="checkbox">
      <span>⏸️ توقف في مكان معين</span>
    </label>
    <div id="stopFields" class="extra-fields">
      <input id="stopText" placeholder="اكتب مكان التوقف">
    </div>

    <label class="extra-option">
      <input id="luggageCheck" type="checkbox">
      <span>🧳 معي أغراض</span>
    </label>

    <label class="extra-option">
      <input id="passengersCheck" type="checkbox">
      <span>👥 ركاب إضافيون</span>
    </label>
    <div id="passengerFields" class="extra-fields">
      <select id="extraPassengers">
        <option value="1">راكب إضافي واحد</option>
        <option value="2">راكبان إضافيان</option>
        <option value="3">3 ركاب إضافيين</option>
      </select>
    </div>

    <button id="saveExtra" class="save-extra" type="button">حفظ الخيارات</button>
  </div>
</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
// ===== الخيارات الإضافية =====
const extraSheet=document.getElementById('extraSheet');
const extraOptionsBtn=document.getElementById('extraOptionsBtn');
const closeExtra=document.getElementById('closeExtra');
const saveExtra=document.getElementById('saveExtra');

const extraDestinationCheck=document.getElementById('extraDestinationCheck');
const stopCheck=document.getElementById('stopCheck');
const luggageCheck=document.getElementById('luggageCheck');
const passengersCheck=document.getElementById('passengersCheck');

const extraDestinationFields=document.getElementById('extraDestinationFields');
const stopFields=document.getElementById('stopFields');
const passengerFields=document.getElementById('passengerFields');
const extraDestinationText=document.getElementById('extraDestinationText');
const stopText=document.getElementById('stopText');
const extraPassengers=document.getElementById('extraPassengers');
const extraSummary=document.getElementById('extraSummary');

function toggleExtraFields(){
  extraDestinationFields.classList.toggle('show',extraDestinationCheck.checked);
  stopFields.classList.toggle('show',stopCheck.checked);
  passengerFields.classList.toggle('show',passengersCheck.checked);
}
[extraDestinationCheck,stopCheck,passengersCheck].forEach(x=>x.addEventListener('change',toggleExtraFields));

extraOptionsBtn.addEventListener('click',()=>{
  if(extraOptionsBtn.disabled)return;
  extraSheet.classList.add('show');
  extraSheet.setAttribute('aria-hidden','false');
  history.pushState({extraOptions:true},'',location.href);
});
function closeExtraSheet(){
  extraSheet.classList.remove('show');
  extraSheet.setAttribute('aria-hidden','true');
}
closeExtra.onclick=()=>history.back();

saveExtra.onclick=()=>{
  let parts=[];
  if(extraDestinationCheck.checked) parts.push('📍 وصول إضافي');
  if(stopCheck.checked) parts.push('⏸️ توقف');
  if(luggageCheck.checked) parts.push('🧳 أغراض');
  if(passengersCheck.checked) parts.push('👥 '+extraPassengers.value+' إضافي');

  if(parts.length){
    extraSummary.style.display='block';
    extraSummary.textContent='الخيارات المختارة: '+parts.join(' • ');
  }else{
    extraSummary.style.display='none';
    extraSummary.textContent='';
  }
  history.back();
};

extraSheet.addEventListener('click',e=>{
  if(e.target===extraSheet) history.back();
});

window.addEventListener('popstate',()=>{
  if(extraSheet.classList.contains('show')){
    closeExtraSheet();
  }
});

</script>
<script>
const map=L.map('map',{zoomControl:false}).setView([33.3152,44.3661],12);

// خريطة فاتحة وأقل تفاصيل
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{
 maxZoom:19,
 subdomains:'abcd',
 attribution:'&copy; OpenStreetMap &copy; CARTO'
}).addTo(map);

L.control.zoom({position:'topright'}).addTo(map);

let mode='start';
let start=null,end=null;
let sm=null,em=null,line=null;
let routeKm=0,routeMin=0,pickupMin=0;
let selected=document.querySelector('.type.selected');

function setMode(x){
 mode=x;
 const searchInput=document.getElementById('placeSearch');
 if(searchInput){
   searchInput.placeholder=x==='start'?'ابحث عن مكان الانطلاق':'ابحث عن مكان الوصول';
   searchInput.value='';
 }
 confirmMap.textContent=x==='start'?'✓ تثبيت الانطلاق':'✓ تثبيت الوصول';
 confirmMap.classList.toggle('start-confirm',x==='start');
 confirmMap.classList.toggle('end-confirm',x==='end');
 pickStart.classList.toggle('active',x==='start');
 pickEnd.classList.toggle('active',x==='end');
 notice.textContent=x==='start'
   ? 'حرّك الخريطة وحدد نقطة الانطلاق.'
   : 'حرّك الخريطة وحدد نقطة الوصول.';
}

function startMapPick(){
 centerPin.classList.add('show');
 confirmMap.classList.add('show');
}

function stopMapPick(){
 centerPin.classList.remove('show');
 confirmMap.classList.remove('show');
}

pickStart.onclick=()=>{setMode('start');startMapPick()};
pickEnd.onclick=()=>{setMode('end');startMapPick()};

async function snap(p){
 try{
   const r=await fetch(
     `https://router.project-osrm.org/nearest/v1/driving/${p.lng},${p.lat}?number=1`
   );
   const j=await r.json();
   const x=j?.waypoints?.[0]?.location;
   return x?L.latLng(x[1],x[0]):p;
 }catch(e){
   return p;
 }
}


function startIcon(){
 return L.divIcon({
   className:'',
   html:'<div style="width:24px;height:24px;border-radius:50%;background:#f47b20;border:4px solid white;box-shadow:0 2px 7px #0005"></div>',
   iconSize:[24,24],iconAnchor:[12,12]
 });
}
function endIcon(){
 return L.divIcon({
   className:'',
   html:'<div style="width:23px;height:23px;background:#1110ff;border:4px solid white;box-shadow:0 2px 7px #0005;transform:rotate(45deg)"></div>',
   iconSize:[23,23],iconAnchor:[12,12]
 });
}

function setPoint(kind,p,label){
 if(kind==='start'){
   start=p;
   if(sm)map.removeLayer(sm);
   sm=L.marker(p,{icon:startIcon()}).addTo(map).bindPopup('الانطلاق');
   startText.textContent=label||'تم تحديد نقطة الانطلاق';

   if(!end){
     setMode('end');
     startMapPick();
   }
 }else{
   end=p;
   if(em)map.removeLayer(em);
   em=L.marker(p,{icon:endIcon()}).addTo(map).bindPopup('الوصول');
   endText.textContent=label||'تم تحديد نقطة الوصول';
   stopMapPick();

   // بعد إكمال الوصول نخفي قائمة الانطلاق والوصول بالكامل
   // ونظهر قائمة أنواع التكسي والأسعار مكانها.
   const locationStep=document.getElementById('locationStep');
   const vehicleStep=document.getElementById('vehicleStep');
   locationStep.style.display='none';
   vehicleStep.style.display='block';

   // إخفاء نتائج البحث القديمة أيضاً.
   document.getElementById('placeResults').style.display='none';
 }

 calc();
}

confirmMap.onclick=async()=>{
 const p=await snap(map.getCenter());

 let label='';
 if(mode==='start'){
   label=window.pendingStartLabel||'تم تحديد نقطة الانطلاق';
   window.pendingStartLabel='';
 }else{
   label=window.pendingEndLabel||'تم تحديد نقطة الوصول';
   window.pendingEndLabel='';
 }

 setPoint(mode,p,label);

 // نخزن خطوة حتى زر الرجوع يرجع خطوة مو يطلع
 history.pushState({taxiStep:mode},'',location.href);
};

locateBtn.onclick=()=>{
 if(!navigator.geolocation){
   notice.textContent='المتصفح لا يدعم تحديد الموقع.';
   return;
 }

 notice.textContent='جاري تحديد موقعك...';

 navigator.geolocation.getCurrentPosition(async pos=>{
   const p=await snap(L.latLng(pos.coords.latitude,pos.coords.longitude));

   // زر الدنبوس ينقل الخريطة فقط ولا يثبت الانطلاق تلقائياً.
   setMode('start');
   map.setView(p,16);
   startMapPick();
   window.pendingStartLabel='موقعك الحالي';
   startText.textContent='موقعك الحالي — حرّك الدبوس إذا تريد ثم ثبّت الانطلاق';
   notice.textContent='تم نقل الخريطة إلى موقعك. حرّك الدبوس إذا تريد، ثم اضغط «تثبيت الانطلاق».';
 },()=>{
   notice.textContent='تعذر تحديد موقعك. تأكد من تشغيل GPS والسماح للموقع.';
 },{
   enableHighAccuracy:true,
   timeout:10000
 });
};

async function searchCurrentPlace(){
 const q=document.getElementById('placeSearch').value.trim();
 if(!q)return;

 const kind=mode;
 const box=document.getElementById('placeResults');
 box.style.display='block';
 box.innerHTML='<button disabled>جاري البحث...</button>';

 try{
   const r=await fetch(
     'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&accept-language=ar&q='
     +encodeURIComponent(q)
   );
   const j=await r.json();
   box.innerHTML='';

   if(!j.length){
     box.innerHTML='<button disabled>ماكو نتيجة</button>';
     return;
   }

   j.forEach(x=>{
     const b=document.createElement('button');
     b.textContent=x.display_name;

     b.onclick=async()=>{
       const p=await snap(L.latLng(+x.lat,+x.lon));

       // البحث فقط ينقل الخريطة والدبوس، ولا يثبت النقطة.
       setMode(kind);
       map.setView(p,16);
       startMapPick();

       if(kind==='start'){
         window.pendingStartLabel=x.display_name;
         startText.textContent='عدّل مكان الدبوس ثم ثبّت الانطلاق';
       }else{
         window.pendingEndLabel=x.display_name;
         endText.textContent='عدّل مكان الدبوس ثم ثبّت الوصول';
       }

       box.style.display='none';
       notice.textContent='تم نقل الدبوس للمكان المختار. عدّل مكانه إذا تريد، ثم اضغط زر التثبيت.';
     };

     box.appendChild(b);
   });

 }catch(e){
   box.innerHTML='<button disabled>تعذر البحث</button>';
 }
}

document.getElementById('placeSearchBtn').onclick=searchCurrentPlace;
document.getElementById('placeSearch').addEventListener('keydown',e=>{
 if(e.key==='Enter')searchCurrentPlace();
});

async function route(a,b){
 const r=await fetch(
   `https://router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson`
 );
 const j=await r.json();

 if(j.code!=='Ok')throw 0;
 return j.routes[0];
}

function fm(x){
 x=Math.max(1,Math.round(x));
 return x<60?x+' د':Math.floor(x/60)+' س '+x%60+' د';
}

function round250(x){
 return Math.ceil(x/250)*250;
}

async function calc(){
 if(line){
   map.removeLayer(line);
   line=null;
 }

 if(!(start&&end)){
   order.disabled=true;
   document.getElementById('extraOptionsBtn').disabled=true;
   return;
 }

 notice.textContent='جاري حساب الطريق...';

 try{
   const r=await route(start,end);

   routeKm=r.distance/1000;
   routeMin=r.duration/60;

   line=L.geoJSON(r.geometry,{
     style:{weight:5}
   }).addTo(map);

   map.fitBounds(line.getBounds(),{
     padding:[35,35]
   });

   distance.textContent=routeKm.toFixed(1)+' كم';
   tripTime.textContent=fm(routeMin);

   const demo=L.latLng(start.lat+.008,start.lng+.008);

   try{
     const dr=await route(demo,start);
     pickupMin=dr.duration/60;
   }catch(e){
     pickupMin=5;
   }

   driverTime.textContent='~ '+fm(pickupMin);

   document.querySelectorAll('.type').forEach(c=>{
     const p=round250(
       +c.dataset.base
       +routeKm*(+c.dataset.km)
       +routeMin*(+c.dataset.min)
     );

     c.dataset.price=p;
     c.querySelector('.price').textContent=
       p.toLocaleString('ar-IQ')+' د.ع';
   });

   notice.textContent='جاهز للطلب.';
   order.disabled=false;
   document.getElementById('extraOptionsBtn').disabled=false;
   updateOrder();

 }catch(e){
   notice.textContent='تعذر حساب الطريق.';
 }
}

function updateOrder(){
 if(start&&end&&selected.dataset.price){
   order.textContent=
     selected.dataset.name+' — '
     +Number(selected.dataset.price).toLocaleString('ar-IQ')
     +' د.ع';
 }
}

document.querySelectorAll('.type').forEach(c=>{
 c.onclick=()=>{
   document.querySelectorAll('.type').forEach(x=>x.classList.remove('selected'));
   c.classList.add('selected');
   selected=c;
   updateOrder();
 };
});

order.onclick=()=>{
  let extras=[];
  if(extraDestinationCheck.checked) extras.push('نقطة وصول إضافية: '+(extraDestinationText.value.trim()||'غير محددة'));
  if(stopCheck.checked) extras.push('توقف: '+(stopText.value.trim()||'غير محدد'));
  if(luggageCheck.checked) extras.push('معه أغراض');
  if(passengersCheck.checked) extras.push('ركاب إضافيون: '+extraPassengers.value);

  alert(
    'تم تجهيز طلب التكسي مبدئياً.\n'+
    'النوع: '+selected.dataset.name+'\n'+
    'السعر الأساسي التقديري: '+Number(selected.dataset.price||0).toLocaleString('ar-IQ')+' د.ع'+
    (extras.length?'\nالخيارات:\n- '+extras.join('\n- '):'')
  );
};

// ===== الرجوع خطوة بخطوة =====
function resetRouteDisplay(){
 if(line){
   map.removeLayer(line);
   line=null;
 }

 distance.textContent='—';
 tripTime.textContent='—';
 driverTime.textContent='—';

 document.querySelectorAll('.price').forEach(x=>{
   x.textContent='—';
 });

 order.disabled=true;
 order.textContent='تأكيد التكسي';
 document.getElementById('extraOptionsBtn').disabled=true;
}

function backOneStep(){
 // إذا الوصول متحدد، نمسحه فقط
 if(end){
   end=null;
   window.pendingEndLabel='';

   if(em){
     map.removeLayer(em);
     em=null;
   }

   endText.textContent='غير محدد';

   // الرجوع خطوة يرجع قائمة الانطلاق والوصول بدل أنواع التكسي.
   document.getElementById('vehicleStep').style.display='none';
   document.getElementById('locationStep').style.display='block';

   resetRouteDisplay();

   setMode('end');
   startMapPick();
   notice.textContent='اختر نقطة وصول جديدة.';
   return true;
 }

 // إذا فقط الانطلاق متحدد، نمسحه
 if(start){
   start=null;
   window.pendingStartLabel='';

   if(sm){
     map.removeLayer(sm);
     sm=null;
   }

   startText.textContent='غير محدد';

   setMode('start');
   startMapPick();
   notice.textContent='اختر نقطة انطلاق جديدة.';
   return true;
 }

 return false;
}

backBtn.onclick=()=>{
 if(backOneStep())return;
 history.back();
};

window.addEventListener('popstate',()=>{
 if(backOneStep()){
   // نخلي المستخدم داخل صفحة التكسي بدل ما يطلع منها
   history.pushState({taxiGuard:true},'',location.href);
 }
});

// أول ما تفتح الصفحة يكون اختيار الانطلاق جاهز
setMode('start');
startMapPick();
</script>
