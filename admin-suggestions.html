<!doctype html>
<html lang="ar" dir="rtl">
<head><script id="ha-modern-boot">document.documentElement.setAttribute('data-ha-modern','1');document.documentElement.setAttribute('data-ha-theme','light');document.documentElement.style.colorScheme='light';</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مقترحات المستخدمين - HA Marketing</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial;background:#070a0d;color:#fff}
.wrap{width:94%;max-width:1000px;margin:20px auto 80px}
.top,.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btn,button{border:0;border-radius:12px;padding:10px 13px;background:#151a1e;color:#fff;text-decoration:none;cursor:pointer;font:inherit}
.card{margin:12px 0;padding:15px;border-radius:17px;border:1px solid #39434b;background:#0d1216}
.new{border-right:5px solid #efc45f}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#1b2228;font-size:11px}
.ok{background:#176536}.light{background:#31383e}
.muted{color:#9ea7ae;line-height:1.7}
</style>
<script src="ha-theme.js"></script>
<link rel="stylesheet" href="ha-theme.css">
<link rel="stylesheet" href="ha-modern-blue.css?v=20260926-1"><script src="ha-modern-blue.js?v=20260926-1" defer></script></head>
<body>
<div class="wrap">
  <div class="top">
    <a class="btn" href="admin-panel.html">← لوحة الإدارة</a>
    <h2>💡 مقترحات المستخدمين</h2>
    <button onclick="load()">تحديث</button>
  </div>
  <div id="gate" class="card">جاري التحقق...</div>
  <div id="list"></div>
</div>
<script>
const db=supabase.createClient(
  'https://ubayrhtshgtgggxprrek.supabase.co',
  'sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',
  {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}}
);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));
let allowed=false;

async function init(){
  const {data:{session}}=await db.auth.getSession();
  if(!session){location.href='login.html';return}
  const {data:ok}=await db.rpc('is_super_admin');
  if(!ok){
    gate.textContent='هذه الصفحة للأدمن الرئيسي فقط.';
    return;
  }
  allowed=true;
  gate.textContent='✅ Super Admin';
  load();
}

async function load(){
  if(!allowed)return;
  list.innerHTML='<div class="card">جاري التحميل...</div>';

  const {data,error}=await db.from('user_suggestions')
    .select('*')
    .order('created_at',{ascending:false})
    .limit(300);

  if(error){
    list.innerHTML='<div class="card">'+esc(error.message)+'</div>';
    return;
  }

  const names={new:'جديد',reviewed:'تمت المراجعة',closed:'مغلق'};
  list.innerHTML=(data||[]).map(x=>`
    <div class="card ${x.status==='new'?'new':''}">
      <div class="row">
        <b>مقترح #${x.id}</b>
        <span class="badge">${names[x.status]||esc(x.status)}</span>
      </div>
      <p style="line-height:1.9">${esc(x.message)}</p>
      <div class="muted">${new Date(x.created_at).toLocaleString('ar-IQ')}</div>
      ${x.admin_note?`<div class="muted">ملاحظة الإدارة: ${esc(x.admin_note)}</div>`:''}
      <div class="row" style="margin-top:10px">
        <button class="ok" onclick="review(${x.id},'reviewed')">تمت المراجعة</button>
        <button class="light" onclick="review(${x.id},'closed')">إغلاق</button>
      </div>
    </div>
  `).join('')||'<div class="card">لا توجد مقترحات حالياً.</div>';
}

async function review(id,statusValue){
  const note=prompt('رد / ملاحظة للمستخدم (اختياري):')||null;
  const {error}=await db.rpc('review_user_suggestion',{
    p_id:id,
    p_status:statusValue,
    p_note:note
  });
  if(error)return alert(error.message);
  load();
}
init();
</script>
</body>
</html>
