<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الزيارات - HA Marketing</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f5f5f5;color:#111}
.wrap{width:94%;max-width:900px;margin:28px auto}h1{text-align:center;margin-bottom:8px}.sub{text-align:center;color:#666;line-height:1.8}
.item{display:block;width:100%;border:0;background:#fff;border-radius:15px;padding:18px;margin:9px 0;text-align:right;box-shadow:0 3px 12px #0001;cursor:pointer}
.item b{display:block;font-size:21px}.item span{display:block;color:#666;margin-top:5px}
.reader{display:none;background:#fff;border-radius:18px;padding:18px;box-shadow:0 4px 16px #0001}.reader.show{display:block}
.top{position:sticky;top:0;background:#fff;padding:10px 0;border-bottom:1px solid #eee;z-index:2}
.top button{border:0;border-radius:10px;background:#111;color:#fff;padding:11px 15px;font-size:15px;cursor:pointer}
#readerTitle{text-align:center;font-size:27px}#text{font-family:"Traditional Arabic","Amiri",serif;font-size:25px;line-height:2.15;white-space:pre-wrap}
.status{text-align:center;color:#666;padding:24px;line-height:1.8}.back{display:block;text-align:center;margin:26px;text-decoration:none;color:#111}
@media(max-width:600px){#text{font-size:22px}}
</style></head>
<body><div class="wrap">
<h1>🕊️ الزيارات</h1>
<p class="sub">اضغط على الاسم، ويظهر النص داخل نفس صفحة موقعك بدون تحويل المستخدم إلى موقع آخر.</p>
<div id="list"><button class="item" data-name="زيارة عاشوراء" data-url="https://duas.org/ashura/z_ashura.htm"><b>زيارة عاشوراء</b><span>اضغط لعرض النص داخل موقعك</span></button>
<button class="item" data-name="زيارة وارث" data-url="https://www.duas.org/mobile/Ashura.html"><b>زيارة وارث</b><span>اضغط لعرض النص داخل موقعك</span></button>
<button class="item" data-name="زيارة أمين الله" data-url="https://www.duas.org/mobile/ziyarat-imam-ali-shrine.html"><b>زيارة أمين الله</b><span>اضغط لعرض النص داخل موقعك</span></button>
<button class="item" data-name="زيارة الأربعين" data-url="https://duas.org/mobile/ziyarat-arbaeen-old-mobile.html"><b>زيارة الأربعين</b><span>اضغط لعرض النص داخل موقعك</span></button></div>
<section id="reader" class="reader">
 <div class="top"><button id="backBtn" type="button">← رجوع للقائمة</button></div>
 <h2 id="readerTitle"></h2>
 <div id="status" class="status"></div>
 <div id="text"></div>
</section>
<a class="back" href="religious.html">← الرجوع إلى الأمور الدينية</a>
</div>
<script>
const list=document.getElementById('list'),reader=document.getElementById('reader'),
titleEl=document.getElementById('readerTitle'),textEl=document.getElementById('text'),statusEl=document.getElementById('status');
let opened=false;

function arabicOnly(md){
  const lines=md.split(/\r?\n/);
  const keep=[];
  let started=false;
  for(let raw of lines){
    let s=raw.replace(/!\[[^\]]*\]\([^)]*\)/g,'')
             .replace(/\[([^\]]+)\]\([^)]*\)/g,'$1')
             .replace(/^#+\s*/,'').replace(/^[-*>]+\s*/,'').trim();
    if(!s) continue;
    const ar=(s.match(/[\u0600-\u06FF]/g)||[]).length;
    const latin=(s.match(/[A-Za-z]/g)||[]).length;
    if(ar>=4 && ar>latin*1.5){
      started=true; keep.push(s);
    } else if(started && /^(ثم|وتقول|ويقول|تقول|مائة|مرة|مرّة)/.test(s)){
      keep.push(s);
    }
  }
  return keep.join('\n\n');
}

async function openReader(name,url){
 list.style.display='none';reader.classList.add('show');titleEl.textContent=name;textEl.textContent='';
 statusEl.style.display='block';statusEl.textContent='جاري تحميل النص الكامل...';opened=true;
 history.pushState({reader:true},'',location.href);window.scrollTo(0,0);
 try{
   const proxy='https://r.jina.ai/'+url;
   const r=await fetch(proxy);
   if(!r.ok) throw new Error('fetch');
   const md=await r.text();
   const txt=arabicOnly(md);
   if(txt.length<150) throw new Error('short');
   textEl.textContent=txt;statusEl.style.display='none';
 }catch(e){
   statusEl.textContent='تعذر تحميل النص الآن. تأكد من اتصال الإنترنت ثم أعد المحاولة.';
 }
}
function closeReader(){
 reader.classList.remove('show');list.style.display='block';textEl.textContent='';opened=false;window.scrollTo(0,0);
}
document.querySelectorAll('.item').forEach(b=>b.onclick=()=>openReader(b.dataset.name,b.dataset.url));
document.getElementById('backBtn').onclick=()=>opened?history.back():closeReader();
window.addEventListener('popstate',()=>{if(opened)closeReader()});
</script></body></html>
