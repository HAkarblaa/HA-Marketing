<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sniper Battle</title>
<style>
body{background:#27452b;color:white;text-align:center;font-family:Arial}
#map{height:70vh;margin:10px;background:linear-gradient(#87ceeb,#355b32);border-radius:20px;position:relative}
.bot{position:absolute;background:#d33;width:35px;height:35px;border-radius:50%}
</style></head>
<body>
<h1>🎯 المعركة</h1><h2 id="p"></h2>
<div id="map"></div>
<script>
let n=new URLSearchParams(location.search).get('players')||10;
p.innerHTML='اللاعبين: '+n;
for(let i=0;i<n;i++){let b=document.createElement('div');b.className='bot';b.style.left=Math.random()*90+'%';b.style.top=Math.random()*80+'%';map.appendChild(b)}
</script>
</body></html>
