<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HA Sniper Battle</title>
<style>
body{margin:0;background:#101820;color:#fff;font-family:Arial;text-align:center}
.panel{padding:10px}
#map{height:70vh;margin:10px;background:linear-gradient(#78bde8,#315b35);border-radius:25px;position:relative;overflow:hidden}
.house{position:absolute;background:#555;width:90px;height:120px;bottom:80px}
.tree{position:absolute;font-size:60px}
.char{position:absolute;width:35px;height:55px;border-radius:15px 15px 5px 5px;background:#1e90ff;border:2px solid white}
.bot{background:#e33}
.gun{position:absolute;width:45px;height:5px;background:#222;right:-35px;top:20px}
button,select{padding:12px;border-radius:12px;border:0;margin:5px;background:#f5c542}
</style>
<link rel="stylesheet" href="ha-modern-blue.css?v=20260926-1"><script src="ha-modern-blue.js?v=20260926-1" defer></script><link rel="stylesheet" href="ha-lux-icons.css?v=20260930-1"></head>
<body>
<div class="panel">
<h1>🎯 HA Sniper Battle</h1>
<select id="players"><option>10</option><option>20</option><option>50</option><option>100</option></select>
<select id="maptype"><option>🏢 المدينة</option><option>🌲 الغابة</option></select>
<button onclick="start()">ابدأ المعركة</button>
<h3>اللاعبين: <span id="num">0</span> | النقاط: <span id="score">0</span></h3>
<div id="map"></div>
<button>🎤 مايك</button><button>💬 دردشة</button><button onclick="shoot()">🎯 إطلاق</button>
</div>
<script>
let score=0;
function start(){
 let m=document.getElementById('map');m.innerHTML='';
 let n=Number(players.value);num.innerHTML=n;
 for(let i=0;i<n;i++){
  let p=document.createElement('div');
  p.className='char '+(i?'bot':'');
  p.style.left=Math.random()*85+'%';
  p.style.top=Math.random()*75+'%';
  let g=document.createElement('div');g.className='gun';p.appendChild(g);
  p.onclick=()=>{if(p.classList.contains('bot')){score++;document.getElementById('score').innerText=score;p.remove()}};
  m.appendChild(p);
 }
}
function shoot(){}
</script>
<script src="ha-lux-icons.js?v=20260930-1" defer></script></body>
</html>
