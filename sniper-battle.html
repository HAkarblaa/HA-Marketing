<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لعبة القناصات</title>
<style>body{background:#101820;color:white;text-align:center;font-family:Arial}#game{height:70vh;background:linear-gradient(#8bd8ff,#385d32);margin:15px;border-radius:20px;position:relative;overflow:hidden}.target{position:absolute;width:45px;height:45px;background:#e22;border-radius:50%;border:3px solid white}select,button{padding:12px;border-radius:10px}</style></head>
<body><h1>🎯 لعبة القناصات</h1>
<select id="n"><option>10</option><option>20</option><option>50</option><option>100</option></select>
<button onclick="start()">ابدأ</button><div id="game"></div><h2>النقاط: <span id="s">0</span></h2>
<script>let s=0;function start(){game.innerHTML='';for(let i=0;i<n.value;i++)setTimeout(bot,i*200)}function bot(){let t=document.createElement('div');t.className='target';t.style.left=Math.random()*85+'%';t.style.top=Math.random()*70+'%';t.onclick=()=>{s++;document.getElementById('s').innerHTML=s;t.remove()};game.appendChild(t);setTimeout(()=>t.remove(),3000)}</script>
</body></html>
