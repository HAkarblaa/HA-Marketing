<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HA Sniper Battle</title>
<style>
body{margin:0;background:#17251a;color:#fff;font-family:Arial;text-align:center}
.wrap{padding:15px}
#game{height:70vh;background:linear-gradient(#8bd8ff,#356b35);border-radius:20px;position:relative;overflow:hidden}
.card{background:#fff2;color:white;padding:10px;border-radius:15px}
.target{position:absolute;width:45px;height:45px;background:#e22;border-radius:50%;border:3px solid white}
button,select{padding:12px;border-radius:12px;margin:5px}
</style>
</head>
<body>
<div class="wrap">
<h1>🎯 HA Sniper Battle</h1>
<select id="num"><option>10</option><option>20</option><option>50</option><option>100</option></select>
<button onclick="start()">ابدأ</button>
<div id="game"></div>
<h2>النقاط: <span id="score">0</span></h2>
</div>
<script>
let s=0;
function start(){
 game.innerHTML='';
 let n=Number(num.value);
 for(let i=0;i<n;i++) setTimeout(()=>bot(),i*200);
}
function bot(){
 let t=document.createElement('div');
 t.className='target';
 t.style.left=Math.random()*85+'%';
 t.style.top=Math.random()*70+'%';
 t.onclick=()=>{s++;score.innerText=s;t.remove()};
 game.appendChild(t);
 setTimeout(()=>t.remove(),3000);
}
</script>
</body>
</html>
