<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أسماء الله الحسنى</title><style>body{font-family:Arial;background:#faf7ef;margin:0}.w{max-width:900px;margin:auto;padding:20px}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.c{background:#fff;border-radius:14px;padding:16px;text-align:center;font-weight:bold;box-shadow:0 2px 10px #0001}input{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;margin:12px 0}@media(max-width:500px){.g{grid-template-columns:repeat(3,1fr)}.c{padding:10px;font-size:13px}}</style><div class="w"><a href="religious.html">← رجوع</a><h1>✨ أسماء الله الحسنى</h1><input id="q" placeholder="بحث..." oninput="f()"><div id="g" class="g"></div></div><script>const a=`الله الرحمن الرحيم الملك القدوس السلام المؤمن المهيمن العزيز الجبار المتكبر الخالق البارئ المصور الغفار القهار الوهاب الرزاق الفتاح العليم القابض الباسط الخافض الرافع المعز المذل السميع البصير الحكم العدل اللطيف الخبير الحليم العظيم الغفور الشكور العلي الكبير الحفيظ المقيت الحسيب الجليل الكريم الرقيب المجيب الواسع الحكيم الودود المجيد الباعث الشهيد الحق الوكيل القوي المتين الولي الحميد المحصي المبدئ المعيد المحيي المميت الحي القيوم الواجد الماجد الواحد الصمد القادر المقتدر المقدم المؤخر الأول الآخر الظاهر الباطن الوالي المتعالي البر التواب المنتقم العفو الرؤوف مالك الملك ذو الجلال والإكرام المقسط الجامع الغني المغني المانع الضار النافع النور الهادي البديع الباقي الوارث الرشيد الصبور`.split(' ');function f(){let t=q.value.trim();g.innerHTML=a.filter(x=>!t||x.includes(t)).map(x=>`<div class=c>${x}</div>`).join('')}f()</script>
