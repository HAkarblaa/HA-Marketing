<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لعبة الطائر</title><link rel="stylesheet" href="assets/ha-games-style.css"></head><body><div class="page"><div class="topbar"><div class="brand"><div class="logo">🐦</div><div><h1>لعبة الطائر</h1><p>حلّق بين الحواجز واحصل على أعلى نقاط</p></div></div><div class="row"><a class="btn secondary" href="games-hub.html">↩ الألعاب</a><button id="fullBtn" class="btn secondary">⛶ ملء الشاشة</button></div></div>
<div class="game-shell"><div id="stageHolder" class="stage-wrap"><canvas id="game" class="stage" width="480" height="720"></canvas></div><div class="side-panel"><div class="card"><h3>التحكم</h3><p>اضغط على الشاشة أو اضغط المسافة/أعلى حتى يقفز الطائر. كل أنبوب تتجاوزه = نقطة.</p><div class="row"><button id="startBtn" class="btn">▶ ابدأ</button><button id="restartBtn" class="btn secondary">↻ إعادة</button></div></div><div class="card"><h3>إحصائياتك</h3><div class="stat-grid"><div class="stat"><b id="score">0</b><span>النقاط</span></div><div class="stat"><b id="best">0</b><span>الأفضل</span></div><div class="stat"><b id="plays">0</b><span>اللعبات</span></div></div></div><div class="card"><h3>أفضل اللاعبين</h3><div id="leader" class="list"></div></div></div></div><footer>🐦 لعبة الطائر</footer></div>
<script src="assets/ha-games-common.js"></script><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'); let run=false, anim=0, pipes=[], frame=0, score=0, best=0; const bird={x:130,y:340,r:18,vy:0};
function reset(){pipes=[];frame=0;score=0;bird.y=340;bird.vy=0;updateStats();draw();}
function updateStats(){const board=HAGames.getLeaderboard('bird-game'); const me=board.find(x=>x.userId===HAGames.detectUser().id); best=me?me.bestScore:best; document.getElementById('score').textContent=score; document.getElementById('best').textContent=best||0; document.getElementById('plays').textContent=me?me.playCount:0; HAGames.renderMiniLeaderboard(document.getElementById('leader'),'bird-game',8);} 
function flap(){bird.vy=-8; HAGames.beep('jump');}
function spawn(){const gap=180, top=Math.random()*250+90; pipes.push({x:520,w:70,top, gap, passed:false});}
function endGame(){run=false; cancelAnimationFrame(anim); HAGames.beep('lose'); const p=HAGames.saveScore('bird-game','🐦 لعبة الطائر',score,{win:score>=15}); best=Math.max(best,p.bestScore||0); updateStats(); HAGames.toast('انتهت الجولة!'); draw();}
function loop(){if(!run) return; frame++; if(frame%96===0) spawn(); bird.vy += .45; bird.y += bird.vy; pipes.forEach(p=>{p.x -= 4.8 + score*.05; if(!p.passed && p.x+ p.w < bird.x){p.passed=true; score++; HAGames.beep('coin');} if(bird.x+bird.r>p.x && bird.x-bird.r<p.x+p.w && (bird.y-bird.r<p.top || bird.y+bird.r>p.top+p.gap)) endGame();}); pipes=pipes.filter(p=>p.x+p.w>-10); if(bird.y+bird.r>=670 || bird.y-bird.r<=0) return endGame(); updateStats(); draw(); anim=requestAnimationFrame(loop);} 
function draw(){ctx.clearRect(0,0,480,720); const grd=ctx.createLinearGradient(0,0,0,720); grd.addColorStop(0,'#38bdf8'); grd.addColorStop(1,'#0f172a'); ctx.fillStyle=grd; ctx.fillRect(0,0,480,720); ctx.fillStyle='#65a30d'; pipes.forEach(p=>{ctx.fillRect(p.x,0,p.w,p.top); ctx.fillRect(p.x,p.top+p.gap,p.w,720);}); ctx.fillStyle='#84cc16'; ctx.fillRect(0,680,480,40); ctx.beginPath(); ctx.fillStyle='#facc15'; ctx.arc(bird.x,bird.y,bird.r,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(bird.x+6,bird.y-4,3,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#f97316'; ctx.beginPath(); ctx.moveTo(bird.x+bird.r,bird.y); ctx.lineTo(bird.x+bird.r+14,bird.y-5); ctx.lineTo(bird.x+bird.r+14,bird.y+5); ctx.fill(); ctx.fillStyle='white'; ctx.font='bold 34px Tahoma'; ctx.fillText(score,225,60); if(!run){ctx.fillStyle='rgba(0,0,0,.4)'; ctx.fillRect(0,0,480,720); ctx.fillStyle='white'; ctx.font='bold 34px Tahoma'; ctx.fillText(score>0?'انتهت الجولة':'اضغط ابدأ',160,320); ctx.font='22px Tahoma'; ctx.fillText('اضغط للقفز بين الأنابيب',135,360);} }
window.addEventListener('keydown',e=>{if(e.code==='Space'||e.key==='ArrowUp'){e.preventDefault(); if(run) flap();}}); canvas.addEventListener('click',()=>{if(run) flap();}); canvas.addEventListener('touchstart',(e)=>{e.preventDefault(); if(run) flap();},{passive:false}); document.getElementById('startBtn').onclick=()=>{reset(); run=true; loop();}; document.getElementById('restartBtn').onclick=reset; HAGames.bindFullscreen(document.getElementById('fullBtn'),'#stageHolder'); reset();
</script></body></html>
