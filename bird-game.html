{display:grid;gap:7px}.rankrow{display:flex;justify-content:space-between;gap:8px;align-items:center;background:#07111b;border-radius:11px;padding:8px 10px;border:1px solid #ffffff0c}.rankrow small{color:#96a5b5}.notice{color:#b9c6d4;font-size:12px;line-height:1.65}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions .btn{flex:1}.status{margin-top:8px;font-size:12px;color:#9fb0c2}.status.ok{color:#7ee6a3}.status.bad{color:#ff9a9a}@media(max-width:820px){.game-grid{grid-template-columns:1fr}.side{grid-template-columns:1fr 1fr}.side .card:last-child{grid-column:1/-1}}@media(max-width:560px){html,body{height:100%;overflow:hidden}.page{height:100svh;padding:5px;display:flex;flex-direction:column;overflow:hidden}.top{flex:0 0 auto;height:48px;margin-bottom:4px}.title h1{font-size:17px}.title small{display:none}.icon{width:38px;height:38px;font-size:22px}.top .btn{min-height:38px;padding:7px 10px}.game-grid{display:block;flex:1;min-height:0}.stage{height:100%;padding:4px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center}.stage canvas{flex:1 1 auto;width:auto;max-width:100%;height:calc(100% - 48px);min-height:0;max-height:none;object-fit:contain;border-radius:10px}.controls{flex:0 0 44px;width:100%;margin-top:4px!important;gap:6px;flex-wrap:nowrap}.ctrl{min-width:84px;min-height:40px;padding:6px 10px;font-size:15px;border-radius:11px}.controls .btn{min-height:40px;padding:6px 9px;font-size:13px;flex:1}.side{display:none}.hide-mobile{display:none}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="page"><div class="top"><div class="title"><div class="icon">🐦</div><div><h1>لعبة الطائر</h1><small>اقفز بين الحواجز</small></div></div><a class="btn alt" href="entertainment.html">‹ رجوع</a></div><div class="game-grid"><section class="stage"><canvas id="game" width="420" height="680"></canvas><div class="controls" style="margin-top:8px"><button id="startBtn" class="btn">▶ ابدأ</button><button id="jumpBtn" class="ctrl">⬆ قفز</button><button id="restartBtn" class="btn alt">↻ إعادة</button></div></section><aside class="side"><section class="card"><h3>اللعبة</h3><div id="status" class="status">جاهز للعب</div><p class="notice">اضغط زر القفز أو داخل اللعبة. الصعوبة تزيد بالمراحل، بعض الحواجز تتحرك، اجمع العملات وخذ الدرع للحماية من ضربة واحدة.</p></section><section class="card"><h3>نتيجتك</h3><div class="stats"><div class="stat"><b id="score">0</b><small>النقاط</small></div><div class="stat"><b id="best">0</b><small>أفضل نتيجة</small></div><div class="stat"><b id="plays">0</b><small>مرات اللعب</small></div></div><div class="stats extra"><div class="stat"><b id="level">1</b><small>المرحلة</small></div><div class="stat"><b id="coins">0</b><small>العملات</small></div><div class="stat"><b id="shield">—</b><small>الدرع</small></div></div></section><section class="card"><h3>🏆 التصنيف</h3><div id="leader" class="board"></div></section></aside></div></main><script>
const HAGame=(()=>{
  const KEY='ha_games_records_v2', mem={};
  const SB_URL='https://ubayrhtshgtgggxprrek.supabase.co';
  const SB_KEY='sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll';
  let client=null;
  const safe={get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]??null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}};
  const parse=v=>{try{return JSON.parse(v)}catch(e){return null}};
  function user(){for(const k of ['ha_user','ha_current_user','currentUser','user','profile']){const o=parse(safe.get(k));if(o&&typeof o==='object'){const id=o.id||o.user_id||o.uid||o.uuid||o.username||'guest';return{id:String(id),name:String(o.full_name||o.fullName||o.name||o.display_name||'مستخدم HA'),username:String(o.username||o.user_name||o.handle||('user_'+String(id).slice(0,6)))}}}return{id:'guest',name:'لاعب',username:'guest'}}
  function data(){return parse(safe.get(KEY))||{games:{}}} function put(d){safe.set(KEY,JSON.stringify(d))}
  function localSave(key,title,score,win){const u=user(),d=data();d.games[key]??={title,players:{}};const p=d.games[key].players[u.id]||{userId:u.id,name:u.name,username:u.username,totalScore:0,bestScore:0,playCount:0,wins:0};p.name=u.name;p.username=u.username;p.totalScore+=score;p.bestScore=Math.max(p.bestScore,score);p.playCount++;if(win)p.wins++;p.lastScore=score;d.games[key].players[u.id]=p;put(d);return p}
  function localBoard(key){const g=data().games[key];return g?Object.values(g.players||{}).sort((a,b)=>b.totalScore-a.totalScore||b.bestScore-a.bestScore):[]}
  function db(){if(client)return client;if(!window.supabase||!window.supabase.createClient)return null;try{client=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});return client}catch(e){return null}}
  async function remoteIdentity(){const c=db();if(!c)return null;try{const {data:{session}}=await c.auth.getSession();if(!session)return null;let name='مستخدم HA',username='user_'+session.user.id.slice(0,6);const r=await c.from('profiles').select('full_name,username').eq('id',session.user.id).maybeSingle();if(r.data){name=r.data.full_name||name;username=r.data.username||username}return{id:session.user.id,name,username}}catch(e){return null}}
  async function remoteSave(key,title,score,win){const c=db(),u=await remoteIdentity();if(!c||!u)return;try{const q=await c.from('ha_game_scores').select('id,total_score,best_score,play_count,wins').eq('user_id',u.id).eq('game_key',key).maybeSingle();if(q.data){await c.from('ha_game_scores').update({username:u.username,display_name:u.name,game_title:title,total_score:Number(q.data.total_score||0)+score,best_score:Math.max(Number(q.data.best_score||0),score),play_count:Number(q.data.play_count||0)+1,wins:Number(q.data.wins||0)+(win?1:0),last_score:score}).eq('id',q.data.id)}else{await c.from('ha_game_scores').insert({user_id:u.id,username:u.username,display_name:u.name,game_key:key,game_title:title,total_score:score,best_score:score,play_count:1,wins:win?1:0,last_score:score})}}catch(e){console.warn('score sync',e)}}
  function save(key,title,score,win=false){score=Math.max(0,Math.floor(Number(score)||0));const p=localSave(key,title,score,win);remoteSave(key,title,score,win);return p}
  async function renderBoard(el,key,limit=8){const local=localBoard(key).slice(0,limit);renderRows(el,local);const c=db();if(!c)return;try{const r=await c.from('ha_game_scores').select('display_name,username,total_score,best_score,play_count,wins').eq('game_key',key).order('total_score',{ascending:false}).limit(limit);if(!r.error&&r.data?.length)renderRows(el,r.data.map(x=>({name:x.display_name,username:x.username,totalScore:x.total_score,bestScore:x.best_score,playCount:x.play_count,wins:x.wins})))}catch(e){}}
  function renderRows(el,rows){if(!el)return;el.innerHTML=rows?.length?rows.map((p,i)=>`<div class="rankrow"><span>#${i+1} ${esc(p.name||'لاعب')} <small>@${esc(p.username||'user')}</small></span><b>${Number(p.totalScore||0)}</b></div>`).join(''):'<div class="notice">لا توجد نتائج بعد.</div>'}
  function myStats(key){const me=localBoard(key).find(x=>x.userId===user().id);return me||{bestScore:0,playCount:0,totalScore:0,wins:0}}
  function beep(type='tick'){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const a=new A(),o=a.createOscillator(),g=a.createGain();const P={tick:[620,.06],coin:[900,.08],jump:[520,.09],lose:[160,.22],win:[760,.18]};const [f,d]=P[type]||P.tick;o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.value=.08;o.start();o.stop(a.currentTime+d)}catch(e){}}
  function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
  return{save,renderBoard,myStats,beep,user,localBoard,db};
})();
</script><script>
const C=document.getElementById('game'),X=C.getContext('2d');

let running=false,raf=0,score=0,frame=0,pipes=[];
let levelNo=1,coinCount=0,shieldActive=false,pipeSerial=0;
let flashText='',flashTimer=0;

const B={x:115,y:330,r:20,vy:0};
const scoreEl=document.getElementById('score');
const levelEl=document.getElementById('level');
const coinsEl=document.getElementById('coins');
const shieldEl=document.getElementById('shield');

function stats(){
  const s=HAGame.myStats('bird-game');
  scoreEl.textContent=score;
  best.textContent=s.bestScore||0;
  plays.textContent=s.playCount||0;
  levelEl.textContent=levelNo;
  coinsEl.textContent=coinCount;
  shieldEl.textContent=shieldActive?'🛡️':'—';
  HAGame.renderBoard(leader,'bird-game',7);
}

function reset(){
  cancelAnimationFrame(raf);
  running=false;
  score=0;
  frame=0;
  pipes=[];
  levelNo=1;
  coinCount=0;
  shieldActive=false;
  pipeSerial=0;
  flashText='';
  flashTimer=0;
  B.y=330;
  B.vy=0;
  document.getElementById('status').textContent='جاهز للعب';
  stats();
  draw();
}

function flap(){
  if(!running)return;
  B.vy=-8.5;
  HAGame.beep('jump');
}

function updateLevel(){
  const next=Math.min(20,Math.floor(score/7)+1);
  if(next!==levelNo){
    levelNo=next;
    flashText='المرحلة '+levelNo;
    flashTimer=90;
    HAGame.beep('win');
    document.getElementById('status').textContent='وصلت للمرحلة '+levelNo;
  }
}

function difficulty(){
  return{
    speed:Math.min(7.2,3.9+(levelNo-1)*0.22),
    gap:Math.max(118,172-(levelNo-1)*3),
    spawnEvery:Math.max(58,94-(levelNo-1)*2)
  };
}

function spawn(){
  const d=difficulty();
  const minTop=80,maxTop=390-d.gap;
  const top=minTop+Math.random()*Math.max(40,maxTop-minTop);

  pipeSerial++;
  const moving=levelNo>=2 && (pipeSerial%3===0 || Math.random()<Math.min(.55,.18+levelNo*.025));
  const amp=moving ? Math.min(56,20+levelNo*2) : 0;

  const p={
    x:450,top,gap:d.gap,pass:false,
    moving,baseTop:top,amp,
    phase:Math.random()*Math.PI*2,
    phaseSpeed:.018+Math.min(.02,levelNo*.0012),
    coin:null,power:null
  };

  // عملة داخل فتحة الحاجز.
  if(pipeSerial%2===0 || Math.random()<.42){
    p.coin={x:p.x+29,y:p.top+p.gap/2,r:10,taken:false};
  }

  // درع مؤقت يظهر أحياناً، من المرحلة الثانية فما فوق.
  if(levelNo>=2 && !shieldActive && (pipeSerial%8===0 || Math.random()<.08)){
    p.power={x:p.x+29,y:p.top+p.gap/2-34,r:13,taken:false};
  }

  pipes.push(p);
}

function hitPipe(p){
  return B.x+B.r>p.x && B.x-B.r<p.x+58 &&
    (B.y-B.r<p.top || B.y+B.r>p.top+p.gap);
}

function useShield(){
  if(!shieldActive)return false;
  shieldActive=false;
  shieldEl.textContent='—';
  flashText='🛡️ الدرع حماك!';
  flashTimer=70;
  HAGame.beep('coin');
  // نرجع الطائر شوية للمنتصف حتى ما يعيد الاصطدام مباشرة.
  B.vy=-4.5;
  B.y=Math.max(70,Math.min(585,B.y));
  return true;
}

function finish(){
  if(!running)return;
  running=false;
  cancelAnimationFrame(raf);
  HAGame.beep('lose');
  HAGame.save('bird-game','لعبة الطائر',score,score>=12);
  document.getElementById('status').textContent='انتهت الجولة • وصلت للمرحلة '+levelNo+' • العملات '+coinCount;
  stats();
  draw();
}

function loop(){
  if(!running)return;

  frame++;
  updateLevel();
  const d=difficulty();

  if(frame%d.spawnEvery===0)spawn();

  B.vy+=.42;
  B.y+=B.vy;

  for(const p of pipes){
    p.x-=d.speed;

    if(p.moving){
      p.phase+=p.phaseSpeed;
      const maxTop=430-p.gap;
      p.top=Math.max(62,Math.min(maxTop,p.baseTop+Math.sin(p.phase)*p.amp));
    }

    if(p.coin && !p.coin.taken){
      p.coin.x=p.x+29;
      p.coin.y=p.top+p.gap/2;
      if(Math.hypot(B.x-p.coin.x,B.y-p.coin.y)<B.r+p.coin.r){
        p.coin.taken=true;
        coinCount++;
        coinsEl.textContent=coinCount;
        HAGame.beep('coin');
      }
    }

    if(p.power && !p.power.taken){
      p.power.x=p.x+29;
      p.power.y=p.top+p.gap/2-34;
      if(Math.hypot(B.x-p.power.x,B.y-p.power.y)<B.r+p.power.r){
        p.power.taken=true;
        shieldActive=true;
        shieldEl.textContent='🛡️';
        flashText='🛡️ حصلت على درع';
        flashTimer=80;
        HAGame.beep('win');
      }
    }

    if(!p.pass && p.x+58<B.x){
      p.pass=true;
      score++;
      HAGame.beep('tick');
    }

    if(hitPipe(p)){
      if(useShield()){
        // بعد استهلاك الدرع نعلّم هذا الحاجز كأنه تم تجاوزه من ناحية الاصطدام.
        p.x=-80;
      }else{
        return finish();
      }
    }
  }

  pipes=pipes.filter(p=>p.x>-80);

  if(B.y-B.r<0 || B.y+B.r>650){
    if(useShield()){
      B.y=Math.max(B.r+8,Math.min(650-B.r-8,B.y));
    }else{
      return finish();
    }
  }

  if(flashTimer>0)flashTimer--;
  scoreEl.textContent=score;
  levelEl.textContent=levelNo;
  draw();
  raf=requestAnimationFrame(loop);
}

function drawBackground(){
  // تتغير الخلفية حسب المرحلة.
  let top='#6ad6ff',bottom='#20364a',ground='#67a72c';
  if(levelNo>=5 && levelNo<9){top='#ffb86b';bottom='#5d3b55';ground='#6d8f2f'}
  else if(levelNo>=9 && levelNo<13){top='#14213d';bottom='#07111b';ground='#355c3d'}
  else if(levelNo>=13 && levelNo<17){top='#7f9db3';bottom='#314455';ground='#496b33'}
  else if(levelNo>=17){top='#532d8f';bottom='#151028';ground='#47672e'}

  const g=X.createLinearGradient(0,0,0,680);
  g.addColorStop(0,top);
  g.addColorStop(1,bottom);
  X.fillStyle=g;
  X.fillRect(0,0,420,680);

  // نجوم بالليل.
  if(levelNo>=9){
    X.fillStyle='rgba(255,255,255,.75)';
    for(let i=0;i<22;i++){
      const x=(i*67+levelNo*13)%420;
      const y=(i*43)%260+25;
      X.fillRect(x,y,2,2);
    }
  }

  X.fillStyle=ground;
  X.fillRect(0,650,420,30);
}

function drawPipe(p){
  const grad=X.createLinearGradient(p.x,0,p.x+58,0);
  grad.addColorStop(0,'#3f8e22');
  grad.addColorStop(.5,'#73c63a');
  grad.addColorStop(1,'#2d7817');
  X.fillStyle=grad;
  X.fillRect(p.x,0,58,p.top);
  X.fillRect(p.x,p.top+p.gap,58,680-(p.top+p.gap));

  X.fillStyle='#91db51';
  X.fillRect(p.x-4,p.top-18,66,18);
  X.fillRect(p.x-4,p.top+p.gap,66,18);

  if(p.moving){
    X.fillStyle='#fff';
    X.font='bold 13px Tahoma';
    X.fillText('↕',p.x+22,Math.max(25,p.top-24));
  }
}

function drawCoin(c){
  if(!c || c.taken)return;
  X.beginPath();
  X.fillStyle='#ffd43b';
  X.arc(c.x,c.y,c.r,0,Math.PI*2);
  X.fill();
  X.strokeStyle='#b77a00';
  X.lineWidth=2;
  X.stroke();
  X.fillStyle='#fff1a6';
  X.font='bold 12px Tahoma';
  X.fillText('★',c.x-6,c.y+4);
}

function drawShieldPower(p){
  if(!p || p.taken)return;
  X.beginPath();
  X.fillStyle='rgba(70,175,255,.9)';
  X.arc(p.x,p.y,p.r,0,Math.PI*2);
  X.fill();
  X.strokeStyle='#d9f4ff';
  X.lineWidth=3;
  X.stroke();
  X.fillStyle='#fff';
  X.font='15px Tahoma';
  X.fillText('🛡',p.x-9,p.y+6);
}

function drawBird(){
  // ظل الدرع حول الطائر.
  if(shieldActive){
    X.beginPath();
    X.strokeStyle='rgba(109,211,255,.9)';
    X.lineWidth=5;
    X.arc(B.x,B.y,B.r+10,0,Math.PI*2);
    X.stroke();
    X.beginPath();
    X.strokeStyle='rgba(255,255,255,.35)';
    X.lineWidth=2;
    X.arc(B.x,B.y,B.r+15,0,Math.PI*2);
    X.stroke();
  }

  X.save();
  X.translate(B.x,B.y);
  X.rotate(Math.max(-.45,Math.min(.65,B.vy*.055)));

  X.beginPath();
  X.fillStyle='#ffd23c';
  X.arc(0,0,B.r,0,Math.PI*2);
  X.fill();

  // جناح
  X.beginPath();
  X.fillStyle='#f0a92b';
  X.ellipse(-8,6,12,8,-.3,0,Math.PI*2);
  X.fill();

  // منقار
  X.fillStyle='#ff8b25';
  X.beginPath();
  X.moveTo(17,-1);X.lineTo(31,4);X.lineTo(17,9);X.closePath();X.fill();

  // عين
  X.beginPath();
  X.fillStyle='#fff';
  X.arc(7,-7,7,0,Math.PI*2);X.fill();
  X.beginPath();
  X.fillStyle='#111';
  X.arc(10,-7,3,0,Math.PI*2);X.fill();

  X.restore();
}

function draw(){
  drawBackground();

  for(const p of pipes){
    drawPipe(p);
    drawCoin(p.coin);
    drawShieldPower(p.power);
  }

  drawBird();

  // HUD داخل اللوحة.
  X.fillStyle='rgba(4,9,14,.62)';
  X.fillRect(10,10,150,55);
  X.fillStyle='#fff';
  X.font='bold 19px Tahoma';
  X.fillText('النقاط '+score,22,33);
  X.font='bold 14px Tahoma';
  X.fillStyle='#ffe391';
  X.fillText('مرحلة '+levelNo+'  •  🪙 '+coinCount,22,55);

  if(flashTimer>0 && flashText){
    X.fillStyle='rgba(0,0,0,.65)';
    X.fillRect(85,82,250,48);
    X.fillStyle='#fff';
    X.textAlign='center';
    X.font='bold 19px Tahoma';
    X.fillText(flashText,210,113);
    X.textAlign='start';
  }

  if(!running){
    X.fillStyle='#0008';
    X.fillRect(0,0,420,680);
    X.fillStyle='#fff';
    X.textAlign='center';
    X.font='bold 29px Tahoma';
    X.fillText(score?'انتهت الجولة':'اضغط ابدأ',210,315);
    X.font='bold 16px Tahoma';
    X.fillStyle='#ffe199';
    X.fillText('مراحل • حواجز متحركة • عملات • درع',210,350);
    X.textAlign='start';
  }
}

jumpBtn.onclick=flap;
C.onpointerdown=flap;

addEventListener('keydown',e=>{
  if(e.code==='Space'||e.key==='ArrowUp'){
    e.preventDefault();
    flap();
  }
});

startBtn.onclick=()=>{
  reset();
  running=true;
  document.getElementById('status').textContent='اللعبة شغالة • المرحلة 1';
  spawn(); // أول حاجز مباشرة حتى ما ينتظر اللاعب.
  loop();
};

restartBtn.onclick=reset;
reset();
</script></body></html>
