<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ولي أمر الطالب</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7fb;color:#111}.w{width:min(980px,94%);margin:18px auto}.top{display:flex;gap:10px;align-items:center}.b,button{border:0;border-radius:12px;padding:11px 14px;background:#111;color:#fff;text-decoration:none;cursor:pointer}.c{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 4px 16px #0001}.link{display:grid;grid-template-columns:1fr auto;gap:8px}input,select{width:100%;padding:12px;border:1px solid #ccd3df;border-radius:11px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#f5f7fb;border-radius:14px;padding:13px;text-align:center}.stat b{font-size:22px;display:block}.good{color:#087f23}.mid{color:#a56a00}.low{color:#b00020}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #eee;text-align:center}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.link{grid-template-columns:1fr}table{font-size:12px}.c{padding:12px}}</style></head><body><div class=w><div class=top><a class=b href="study.html">← دراسة</a><h1>👨‍👩‍👧 ولي أمر الطالب</h1></div><div class=c><h2>ربط الطالب</h2><p>خذ رمز الربط من حساب الطالب/الحساب الذي سجّل الطالب، ثم أدخله هنا. لا يمكن الاطلاع على الدرجات بدون الربط.</p><div class=link><input id=code placeholder="رمز ربط الطالب"><button onclick=linkStudent()>ربط</button></div></div><div class=c><h2>أبنائي المرتبطون</h2><select id=students onchange=loadGrades()><option value="">اختر الطالب</option></select></div><div id=summary class=c style="display:none"></div><div class=c><div id=grades>اختر طالباً لعرض مستواه الدراسي.</div></div></div><script>const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function av(x){let a=['daily','monthly','dictation','participation','effort','exam'].map(k=>Number(x[k])).filter(Number.isFinite);return a.length?a.reduce((s,n)=>s+n,0)/a.length:0}function lvl(n){return n>=90?'ممتاز':n>=80?'جيد جداً':n>=70?'جيد':n>=60?'متوسط':n>=50?'مقبول':'يحتاج متابعة'}async function init(){const {data:{session}}=await db.auth.getSession();if(!session)return location.href='login.html?next=parent-portal.html';loadStudents()}async function linkStudent(){if(!code.value.trim())return alert('اكتب رمز الربط');const {error}=await db.rpc('link_parent_to_student',{p_code:code.value.trim()});if(error)return alert(error.message);code.value='';alert('تم ربط الطالب');loadStudents()}async function loadStudents(){const {data,error}=await db.rpc('get_my_parent_students');if(error){grades.textContent='شغّل ملف PARENT-STUDY-UPGRADE-2026-09-04.sql أولاً.';return}students.innerHTML='<option value="">اختر الطالب</option>'+(data||[]).map(x=>`<option value="${x.student_id}">${esc(x.student_name)} — ${esc(x.grade||x.education_level||'')}</option>`).join('')}async function loadGrades(){if(!students.value){summary.style.display='none';grades.textContent='اختر طالباً لعرض مستواه الدراسي.';return}const {data,error}=await db.rpc('get_parent_student_grades',{p_student_id:Number(students.value)});if(error){grades.textContent=error.message;return}let rows=data||[], vals=rows.map(av), overall=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0, best=vals.length?Math.max(...vals):0, weak=rows.filter((x,i)=>vals[i]<50).length;summary.style.display='block';summary.innerHTML=`<div class="stats"><div class=stat><span>المعدل العام</span><b>${overall.toFixed(1)}</b></div><div class=stat><span>المستوى</span><b>${lvl(overall)}</b></div><div class=stat><span>أعلى نتيجة</span><b>${best.toFixed(1)}</b></div><div class=stat><span>تحتاج متابعة</span><b>${weak}</b></div></div>`;grades.innerHTML=rows.length?`<table><tr><th>المادة</th><th>يومي</th><th>شهري</th><th>إملاء</th><th>سعي</th><th>امتحان</th><th>المعدل</th><th>المستوى</th></tr>${rows.map(x=>{let a=av(x);return `<tr><td>${esc(x.subject)}</td><td>${x.daily??0}</td><td>${x.monthly??0}</td><td>${x.dictation??0}</td><td>${x.effort??0}</td><td>${x.exam??0}</td><td>${a.toFixed(1)}</td><td>${lvl(a)}</td></tr>`}).join('')}</table>`:'لا توجد درجات مسجلة لهذا الطالب بعد.'}init();</script></body></html>
