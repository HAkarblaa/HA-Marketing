<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلبات المشتريات</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll');</script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f5f5f5;color:#111}.wrap{width:94%;max-width:1000px;margin:24px auto}h1{text-align:center}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 4px 16px #0001}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.btn,button{display:inline-block;border:0;border-radius:10px;padding:11px 14px;background:#111;color:#fff;text-decoration:none;cursor:pointer}.light{background:#eee;color:#111}.danger{background:#a90020}.muted{color:#666;line-height:1.7}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}input,select,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:9px;margin:6px 0}.img{width:100%;height:220px;object-fit:contain;background:#fafafa;border-radius:12px}.price{font-size:21px;font-weight:bold}.badge{background:#eee;padding:5px 9px;border-radius:999px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><a class="btn light" href="shop.html">← المتجر</a><h1>📦 طلبات مشترياتي</h1><div id="box"><div class="card">جاري التحميل...</div></div></div><script>const st={new:'جديد',confirmed:'مؤكد',preparing:'قيد التجهيز',shipped:'تم الشحن',completed:'مكتمل',cancelled:'ملغي'};function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}async function load(){const {data:u}=await db.auth.getUser();if(!u?.user){box.innerHTML='<div class="card">يجب تسجيل الدخول.</div>';return}const {data,error}=await db.from('shop_orders').select('id,status,total_iqd,phone,address,created_at,shop_order_items(qty,unit_price_iqd,product_name)').eq('customer_id',u.user.id).order('created_at',{ascending:false});if(error){box.innerHTML='<div class="card">'+esc(error.message)+'</div>';return}box.innerHTML=(data||[]).map(o=>`<div class="card"><div class="row"><strong>طلب #${o.id}</strong><span class="badge">${st[o.status]||o.status}</span></div><p>${o.shop_order_items.map(i=>esc(i.product_name)+' × '+i.qty).join('<br>')}</p><div class="row"><span>${new Date(o.created_at).toLocaleString('ar-IQ')}</span><strong>${Number(o.total_iqd).toLocaleString('ar-IQ')} د.ع</strong></div>${o.status==='new'?`<button class="danger" style="margin-top:10px" onclick="cancel(${o.id})">إلغاء الطلب</button>`:''}</div>`).join('')||'<div class="card">لا توجد طلبات شراء.</div>'}async function cancel(id){if(!confirm('إلغاء الطلب؟'))return;const {error}=await db.rpc('cancel_shop_order',{p_order_id:id});if(error)alert(error.message);else load()}load();</script></body></html>
