<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلبات المشتريات</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll');</script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f5f5f5;color:#111}.wrap{width:94%;max-width:1000px;margin:24px auto}h1{text-align:center}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 4px 16px #0001}.btn,button{display:inline-block;border:0;border-radius:10px;padding:11px 14px;background:#111;color:#fff;text-decoration:none;cursor:pointer}.light{background:#eee;color:#111}.danger{background:#a90020}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.badge{background:#eee;padding:5px 9px;border-radius:999px}.muted{color:#666}.progress{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:12px 0}.step{background:#eee;border-radius:8px;padding:7px;text-align:center;font-size:12px}.done{background:#111;color:#fff}</style></head><body><div class="wrap"><a class="btn light" href="shop.html">← المتجر</a><h1>📦 طلبات مشترياتي</h1><div id="box"><div class="card">جاري التحميل...</div></div></div><script>
const box=document.getElementById('box');const st={new:'جديد',confirmed:'مؤكد',preparing:'قيد التجهيز',out_for_delivery:'خرج للتوصيل',completed:'مكتمل',cancelled:'ملغي'},seq=['confirmed','preparing','out_for_delivery','completed'];function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function progress(s){if(s==='cancelled')return '<div class="muted">تم إلغاء الطلب.</div>';const idx=s==='new'?-1:seq.indexOf(s);return `<div class="progress">${seq.map((x,i)=>`<div class="step ${i<=idx?'done':''}">${st[x]}</div>`).join('')}</div>`}
async function load(){const {data:u}=await db.auth.getUser();if(!u?.user){box.innerHTML='<div class="card">يجب تسجيل الدخول.</div>';return}const {data,error}=await db.from('shop_orders').select('id,status,total,subtotal,delivery_fee,discount_amount,coupon_code,phone,address,governorate,payment_method,payment_status,cancel_reason,created_at,shop_order_items(quantity,unit_price,subtotal,product_name,option_text)').eq('customer_id',u.user.id).order('created_at',{ascending:false});if(error){box.innerHTML='<div class="card">'+esc(error.message)+'</div>';return}box.innerHTML=(data||[]).map(o=>`<div class="card"><div class="row"><strong>طلب #${o.id}</strong><span class="badge">${esc(st[o.status]||o.status)}</span></div>${progress(o.status)}<p>${(o.shop_order_items||[]).map(i=>esc(i.product_name)+' × '+i.quantity+(i.option_text?' ('+esc(i.option_text)+')':'')).join('<br>')}</p><div class="muted">${esc(o.governorate||'')} — ${esc(o.address||'')}</div><div class="muted" style="margin-top:6px">الدفع: ${o.payment_method==='electronic'?'إلكتروني / بطاقة':'عند الاستلام'}${o.payment_method==='electronic'?' — '+(o.payment_status==='paid'?'مدفوع':'بانتظار الدفع'):''}</div>${o.coupon_code?`<div class="muted">كوبون: ${esc(o.coupon_code)} — خصم ${Number(o.discount_amount||0).toLocaleString('ar-IQ')} د.ع</div>`:''}${o.cancel_reason?`<div class="muted">سبب الإلغاء: ${esc(o.cancel_reason)}</div>`:''}<div class="row" style="margin-top:10px"><span>${new Date(o.created_at).toLocaleString('ar-IQ')}</span><strong>${Number(o.total).toLocaleString('ar-IQ')} د.ع</strong></div><div class="row" style="margin-top:10px"><a class="btn light" href="order-receipt.html?id=${o.id}">🧾 الإيصال</a>${['new','confirmed'].includes(o.status)?`<button class="danger" onclick="cancelOrder(${o.id})">إلغاء الطلب</button>`:''}</div></div>`).join('')||'<div class="card">لا توجد طلبات شراء.</div>'}
async function cancelOrder(id){if(!confirm('إلغاء الطلب؟'))return;const reason=prompt('سبب الإلغاء (اختياري):')||null;const {error}=await db.rpc('cancel_shop_order',{p_order_id:id,p_reason:reason});if(error)alert(error.message);else load()}load();
</script></body></html>
