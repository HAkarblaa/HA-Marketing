<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلباتي</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f5f5f5;color:#111}.wrap{width:94%;max-width:950px;margin:20px auto}.card{background:#fff;border-radius:16px;padding:15px;margin:11px 0;box-shadow:0 4px 15px #0001}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.btn,button{border:0;border-radius:10px;padding:10px 13px;background:#111;color:#fff;text-decoration:none;cursor:pointer}.light{background:#eee;color:#111}.danger{background:#a90020}.muted{color:#666;line-height:1.7}.badge{padding:5px 9px;background:#eee;border-radius:999px;font-size:12px}.delivery{background:#eef5ff;border-radius:12px;padding:11px;margin-top:10px}.otp{font-size:25px;font-weight:800;letter-spacing:5px;text-align:center;background:#fff;border:1px dashed #1769e0;border-radius:10px;padding:8px;margin:8px 0}.progress{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:10px 0}.step{background:#eee;border-radius:8px;padding:6px;text-align:center;font-size:11px}.step.done{background:#dff4e5;font-weight:bold}@media(max-width:620px){.card{font-size:13px}.progress{grid-template-columns:repeat(4,1fr);gap:3px}.step{font-size:9px;padding:5px 2px}}</style></head><body><div class="wrap"><div class="row"><a class="btn light" href="shop.html">← التسوق</a><h1>📦 طلباتي</h1><button class="light" onclick="load()">تحديث</button></div><div id="box">جاري التحميل...</div></div><script>const db=supabase.createClient('https://ubayrhtshgtgggxprrek.supabase.co','sb_publishable_p3108yoDkdJTLqVXhkvmBg_KVqe-1ll',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ha-marketing-auth'}});const st={new:'جديد',confirmed:'مؤكد',preparing:'قيد التجهيز',out_for_delivery:'خرج للتوصيل',completed:'مكتمل',cancelled:'ملغي'},ds={ready:'المتجر طلب مندوب',accepted:'المندوب قبل الطلب',picked_up:'المندوب استلم الطلب',on_the_way:'المندوب بالطريق إليك',delivered:'تم التسليم'};function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function dprog(s){const seq=['ready','accepted','picked_up','on_the_way','delivered'],idx=seq.indexOf(s);return `<div class="progress">${seq.slice(0,4).map((x,i)=>`<div class="step ${i<=idx?'done':''}">${['طلب مندوب','قبول','استلام','بالطريق'][i]}</div>`).join('')}</div>`}async function load(){const {data:u}=await db.auth.getUser();if(!u?.user){box.innerHTML='<div class="card">يجب تسجيل الدخول.</div>';return}const [{data,error},{data:delivs}]=await Promise.all([db.from('shop_orders').select('id,status,total,subtotal,delivery_fee,discount_amount,coupon_code,phone,address,governorate,payment_method,payment_status,cancel_reason,created_at,shop_order_items(quantity,unit_price,subtotal,product_name,option_text)').eq('customer_id',u.user.id).order('created_at',{ascending:false}),db.rpc('get_my_shop_deliveries')]);if(error){box.innerHTML='<div class="card">'+esc(error.message)+'</div>';return}const dmap={};(Array.isArray(delivs)?delivs:[]).forEach(d=>(dmap[d.order_id]??=[]).push(d));box.innerHTML=(data||[]).map(o=>{const deliveries=dmap[o.id]||[];return `<div class="card"><div class="row"><strong>طلب #${o.id}</strong><span class="badge">${esc(st[o.status]||o.status)}</span></div><p>${(o.shop_order_items||[]).map(i=>esc(i.product_name)+' × '+i.quantity+(i.option_text?' ('+esc(i.option_text)+')':'')).join('<br>')}</p><div class="muted">${esc(o.governorate||'')} — ${esc(o.address||'')}</div><div class="muted">الدفع: ${o.payment_method==='electronic'?'إلكتروني / بطاقة':'عند الاستلام'}</div>${deliveries.map(d=>deliveryCard(d)).join('')}<div class="row" style="margin-top:10px"><strong>${Number(o.total).toLocaleString('ar-IQ')} د.ع</strong><div><a class="btn light" href="order-receipt.html?id=${o.id}">🧾 الإيصال</a>${['new','confirmed'].includes(o.status)?` <button class="danger" onclick="cancelOrder(${o.id})">إلغاء</button>`:''}</div></div></div>`}).join('')||'<div class="card">لا توجد طلبات شراء.</div>'}function deliveryCard(d){return `<div class="delivery"><b>🛵 ${esc(ds[d.status]||d.status)}</b>${dprog(d.status)}${d.driver_name?`<div class="muted">المندوب: <b>${esc(d.driver_name)}</b>${d.vehicle_type?' — '+esc(d.vehicle_type):''}${d.plate_number?' — '+esc(d.plate_number):''}</div>`:''}${d.driver_phone?`<a class="btn light" style="margin-top:7px" href="tel:${esc(d.driver_phone)}">📞 اتصال بالمندوب</a>`:''}${d.otp_code?`<div class="muted" style="margin-top:8px">أعطِ هذا الرمز للمندوب فقط بعد استلام الطلب:</div><div class="otp">${esc(d.otp_code)}</div>`:''}</div>`}async function cancelOrder(id){const reason=prompt('سبب الإلغاء (اختياري):')||'';const {error}=await db.rpc('cancel_shop_order',{p_order_id:id,p_reason:reason});if(error)alert(error.message);else load()}load();setInterval(load,20000);</script></body></html>
